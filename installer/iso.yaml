# ==============================================================================
# AquariusOS live ISO configuration
# ==============================================================================
# Plain English: this tiny file tells the ISO builder two things — what to call
# the disc, and what the black-and-white boot menu should say when someone boots
# the USB stick.
#
# It has to end up inside the image at /usr/lib/bootc-image-builder/iso.yaml.
# The payload build script (build.sh, right next to this file) copies it there.
# Titanoboa refuses to build an ISO if it is missing.
#
# The "label" is the volume name of the disc. It appears twice on purpose: once
# here, and once inside each boot line as `root=live:CDLABEL=...`, which is how
# the booting kernel finds the disc it came from. If you change one, change both
# or the USB stick will not boot.
#
# Adapted from ublue-os/bazzite installer/iso.yaml (Apache-2.0),
# read at commit 0fb3abacb1135fbb50cbb575a18f53fea683ab0f (2026-08-23).
# Structure is identical to Bazzite's; only the names have changed.
# ==============================================================================
label: "AquariusOS-Live"
grub2:
  timeout: 3
  entries:
    - name: "Launch AquariusOS Installer"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=AquariusOS-Live enforcing=0 rd.live.image"
      initrd: "/images/pxeboot/initrd.img"
    - name: "Launch AquariusOS Installer (Basic Graphics Mode)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=AquariusOS-Live enforcing=0 rd.live.image nomodeset"
      initrd: "/images/pxeboot/initrd.img"
