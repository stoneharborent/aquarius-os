# Native Wayland text input lets GNOME know when Anaconda needs its keyboard.
[Service]
Environment=GTK_IM_MODULE=wayland
# Anaconda and its compositor use separate session buses. Share the live
# installer's settings file so both see adaptive text size immediately.
Environment=GSETTINGS_BACKEND=keyfile
Environment=XDG_CONFIG_HOME=/run/aquarius-installer-settings
