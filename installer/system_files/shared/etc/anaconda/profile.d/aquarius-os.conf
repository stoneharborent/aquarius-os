# ==============================================================================
# Anaconda installer settings for AquariusOS
# ==============================================================================
# Plain English: this file decides what the installer does by default — how it
# carves up the disk, whether it asks about networking, and so on.
#
# The "@OS_ID@" below is a placeholder. installer/build.sh replaces it with
# whatever this image really calls itself in /etc/os-release, because that string
# is how Anaconda decides this file applies. Today that is still "bazzite": the
# OS is branded as AquariusOS everywhere a human looks, but the machine-readable
# ID field is deliberately left alone (build_files/image-info.sh says why). If
# that decision is ever reversed, this file follows along on its own.
#
# Adapted from ublue-os/bazzite installer/system_files/shared/etc/anaconda/
# profile.d/bazzite.conf (Apache-2.0), read at commit
# 0fb3abacb1135fbb50cbb575a18f53fea683ab0f (2026-08-23).
# ==============================================================================

[Profile]
# Define the profile.
profile_id = aquarius-os

[Profile Detection]
# Match os-release values
os_id = @OS_ID@

[Network]
default_on_boot = FIRST_WIRED_WITH_LINK

[Bootloader]
efi_dir = fedora
menu_auto_hide = True

[Storage]
default_scheme = BTRFS
btrfs_compression = zstd:1
default_partitioning =
    /     (min 1 GiB, max 70 GiB)
    /home (min 500 MiB, free 50 GiB)
    /var  (btrfs)

[User Interface]
hidden_webui_pages =
    network

[Localization]
use_geolocation = False
