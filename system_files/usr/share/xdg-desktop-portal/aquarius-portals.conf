# =============================================================================
# Portal back ends for the Aquarius Desktop
# =============================================================================
# A "portal" is how a sandboxed or well-behaved application asks the desktop to
# do something it is not allowed to do by itself: record the screen, open a file
# picker, show a notification, remember a password. There is one front door
# (xdg-desktop-portal) and several back ends behind it, and this file says which
# back end answers which question.
#
# Get this file wrong and NOTHING ERRORS. OBS simply shows no screens to record,
# and the file dialog in a Flatpak simply never appears. That silence is why
# this file is commented as heavily as it is.
#
# -----------------------------------------------------------------------------
# HOW THIS FILE GETS FOUND — the part that surprises people
# -----------------------------------------------------------------------------
# xdg-desktop-portal reads XDG_CURRENT_DESKTOP, splits it on colons, lowercases
# each name, and for each one looks for <name>-portals.conf.
# /usr/bin/aquarius-session sets
#
#     XDG_CURRENT_DESKTOP=Aquarius:wlroots
#
# so the first file it looks for is aquarius-portals.conf — this one. The name
# of this file and that environment variable are one mechanism. Rename either
# and screen recording stops working, silently.
#
# The GNOME session is unaffected: it sets XDG_CURRENT_DESKTOP=GNOME and finds
# gnome-portals.conf, which this file does not touch.
#
# A person can override all of this for themselves by putting a file of the same
# name in ~/.config/xdg-desktop-portal/, which is searched first.
#
# Source, verified: portals.conf(5), xdg-desktop-portal.
#
# -----------------------------------------------------------------------------
# WHY SCREEN CAPTURE IS "wlr" HERE AND WOULD NOT BE ON EVERY DESKTOP
# -----------------------------------------------------------------------------
# This is a protocol fact, not a preference. labwc is built on the wlroots
# library and speaks the wlr-screencopy protocol, so xdg-desktop-portal-wlr can
# capture it. The scrollable-tiling compositor this project also evaluated does
# not work that way and would need xdg-desktop-portal-gnome instead. Two
# compositors, two answers; AquariusOS ships labwc, so it is wlr.
# =============================================================================

[preferred]

# Everything not named below is answered by xdg-desktop-portal-gtk. That covers
# printing, notifications, the "an app wants to do X" prompt, and the appearance
# setting. It is the standard fallback back end and the one the wlroots
# ecosystem has settled on.
#
# It used to cover the file chooser too. It does not any more — see the next
# section.
default=gtk

# --- the file picker: it is the Files app -------------------------------------
# ⚠️ THIS LINE REVERSES AN EARLIER DECISION. Read this before changing it back.
#
# WHAT ROYCE ASKED FOR (2026-09-14)
#   "the unified files app window when selecting files or folders from other
#   apps. I want it to always pop up the files app from the OS."
#
#   So: when any program says "open a file" or "save as", the window that
#   appears is the Files app itself — same sidebar, same pinned folders, same
#   drives, same look as when you open Files from the dock. Not a second,
#   older-looking chooser that happens to list the same files.
#
# WHAT THIS FILE USED TO SAY, AND WHY IT WAS WRONG
#   The comment here used to reject the GNOME back end specifically BECAUSE it
#   "opens the Nautilus file manager to act as the file chooser". That was
#   treated as a drawback. It is the entire feature Royce wants. The objection
#   is withdrawn, on the record.
#
# WHY THIS SAYS "nautilus" AND NOT "gnome"
#   The obvious way to get the Files picker is to send this request to the GNOME
#   back end, because that is what GNOME does. ⚠️ THAT DOES NOT WORK HERE, and
#   it fails in the worst possible way — silently, with a long pause.
#
#   xdg-desktop-portal-gnome needs GNOME's window manager, Mutter, to be
#   running. We run labwc. Checked in its own source code, version 50.0
#   (src/xdg-desktop-portal-gnome.c lines 304-310 and 123-126): when it starts
#   and cannot reach Mutter, it prints
#
#       Non-compatible display server, exposing settings only.
#
#   sets an internal "settings only" flag, and then SKIPS setting up the file
#   chooser entirely. But it still answers to its name on the message bus. So
#   the desktop would hand every Open dialog to a program that had quietly
#   decided not to do file dialogs, and the dialog would simply never appear.
#
#   Nautilus, on the other hand, answers file-chooser requests by itself and
#   needs nothing from Mutter — it is an ordinary application drawing an
#   ordinary window. So we skip the middleman and send the request straight to
#   it. Verified in nautilus 50.3 source, src/nautilus-portal.c and
#   src/nautilus-application.c line 1044.
#
#   The note that makes "nautilus" a name this file is allowed to use is
#   portals/nautilus.portal, which we ship because Nautilus does not ship one.
#   Read that file next; it explains the other half.
#
# THE TRADE-OFF, HONESTLY
#   The Files app is a bigger program than the small GTK chooser, so the first
#   dialog after logging in takes a moment longer to appear while the bus starts
#   Files in the background. Every dialog after that is instant. In exchange,
#   every Open and Save window on the machine is the same window.
#
# IF A DIALOG NEVER APPEARS
#   docs/restart/aquarius-session.md, "Why the picker is the Files app", lists
#   the four things to check, in order.
org.freedesktop.impl.portal.FileChooser=nautilus

# --- screen capture ----------------------------------------------------------
# xdg-desktop-portal-wlr implements exactly two interfaces and nothing else:
# Screenshot and ScreenCast. This pair is what makes OBS able to record.
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr

# --- appearance --------------------------------------------------------------
# Listed explicitly even though `default=gtk` already covers it, because this is
# the line the Aquarius Shell's light/dark switching depends on and it should be
# obvious rather than implied.
#
# xdg-desktop-portal-gtk answers org.freedesktop.appearance / color-scheme by
# reading the GSettings key org.gnome.desktop.interface color-scheme, and emits
# a change signal when it changes. The shell's services/SystemAppearance.qml
# listens to exactly that. To test it, in a terminal:
#
#     gsettings set org.gnome.desktop.interface color-scheme prefer-dark
#
# and the bar should turn Midnight while you watch.
org.freedesktop.impl.portal.Settings=gtk

# --- passwords ---------------------------------------------------------------
# The Secret portal is how applications store passwords. gnome-keyring provides
# it; without this line, some applications refuse to start at all.
org.freedesktop.impl.portal.Secret=gnome-keyring

# --- idle inhibition ---------------------------------------------------------
# "none" means: do not offer this interface. labwc's own shipped configuration
# turns Inhibit off, and we follow it rather than second-guess it.
org.freedesktop.impl.portal.Inhibit=none
