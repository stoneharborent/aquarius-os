# ==============================================================================

[org.audacityteam.Audacity]
Name=Audacity
Description=The quick one — record a voiceover, trim a clip, clean up a hiss.
Category=Audio
Recommended=true

[org.ardour.Ardour]
Name=Ardour
Description=A full recording studio, for a podcast with several microphones or a proper music mix.
Category=Audio
Recommended=false


# ==============================================================================
