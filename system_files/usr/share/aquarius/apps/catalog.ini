# ==============================================================================

[org.gimp.GIMP]
Name=GIMP
Description=Photo and image editing — the Photoshop-shaped hole, filled.
Category=Design
Recommended=true

[org.inkscape.Inkscape]
Name=Inkscape
Description=Drawing for logos, titles and anything that has to stay sharp at any size.
Category=Design
Recommended=true

[org.kde.krita]
Name=Krita
Description=Digital painting and illustration, and the best free way to draw a thumbnail by hand.
Category=Design
Recommended=false


