# ==============================================================================
# AquariusOS — the human words for the creator apps
# ==============================================================================
# PLAIN ENGLISH
#
# The shopping list next door
# (/usr/share/flatpak/preinstall.d/aquarius-creator-apps.preinstall) says WHICH
# apps AquariusOS offers. This file says WHAT THEY ARE, in words meant for a
# person: a name, one sentence, and which shelf it belongs on.
#
# The app chooser window that appears the first time you log in is drawn from
# this file. So is `aq apps list`.
#
# ------------------------------------------------------------------------------
# WHY THIS IS A SEPARATE FILE AND NOT MORE LINES IN THE OTHER ONE
# ------------------------------------------------------------------------------
# The other file is Flatpak's format, not ours. It has three keys — Install,
# Branch, IsRuntime — and no place for a description. Extra keys of our own
# would probably be ignored harmlessly by Flatpak today, and that is exactly
# the kind of "probably" worth avoiding: if a future Flatpak ever got stricter
# about that file, the failure would not be a missing label in a window, it
# would be a computer that installs no creator apps at all.
#
# So Flatpak's file stays purely Flatpak's, and our words live here.
#
# THE TWO MUST AGREE, AND THE BUILD CHECKS IT. Every app on the shopping list
# needs an entry here, and every entry here must be on the shopping list. Add
# an app in one place and forget the other and the build fails, on purpose.
#
# ------------------------------------------------------------------------------
# THE KEYS
# ------------------------------------------------------------------------------
#   Name=          What to call it on screen.
#   Description=   ONE sentence, said to a person who has never heard of it.
#                  Say what it is FOR, not what it is. No tab characters.
#   Category=      One of exactly these six, and no others:
#                      Video  Audio  Design  Streaming  Utilities  Gaming
#   Recommended=   true means it is ticked when the chooser first opens.
#                  Reserve true for what a creator wants on day one; leave the
#                  large downloads and the specialist tools for them to choose.
#   Requires=      For a plug-in: the app it belongs to. Empty otherwise.
#
# Whether something is a plug-in rather than an app is NOT written here — it is
# read from IsRuntime= in the shopping list, so there is one answer and not two.
#
# ------------------------------------------------------------------------------
# THE SECOND KIND OF ENTRY: AN APP OF OURS, DOWNLOADED FROM GITHUB
# ------------------------------------------------------------------------------
# ⚠️ ADDED 2026-09-04, WHEN AQUARIUS EDITOR STOPPED BEING BAKED INTO THE IMAGE.
#
# Almost everything in this file is a Flatpak, and a Flatpak's name also appears
# next door in the shopping list. Aquarius Editor is not a Flatpak — it is ours,
# it is on no app store, and it is a four-gigabyte download. Baking it in made
# every AquariusOS image four gigabytes bigger for everybody, including the
# people who will never open it, so it is now something you CHOOSE in the same
# window as everything else. It is ticked when that window opens, because it is
# the flagship, but it is a tick and not a decision made for you.
#
# An entry of that kind carries five extra keys, and it has NO block in the
# shopping list next door, because Flatpak knows nothing about it:
#
#   Type=          flatpak (the default, and what every other entry is) or
#                  appimage (ours, fetched from a GitHub release).
#   Source=        the GitHub repository, as owner/repo.
#   Pin=           the exact release tag. Changing this line is how AquariusOS
#                  offers a new Aquarius Editor. Deliberate, like the pinned
#                  commits at the top of the Containerfile.
#   Asset=         which file in that release is the app, as a shell pattern.
#   Sha256sums=    the fingerprint file published beside it. The download is
#                  checked against it before a single byte is unpacked.
#
# WHERE IT GOES ON THE MACHINE: into the person's own home folder, under
# ~/.local/lib/aquarius/. No administrator password is needed for it — nothing
# outside their own account is touched — which is why choosing only this app
# installs it with no password prompt at all. The whole arrangement is written
# down in docs/restart/creator-apps.md.
# ==============================================================================


# ==============================================================================
# VIDEO
# ==============================================================================

# AQUARIUS EDITOR — ours, and the only entry in this file that is not a Flatpak.
#
# ⚠️ THE PIN BELOW IS THE VERSION OF AQUARIUS EDITOR THIS OPERATING SYSTEM
#    OFFERS. Changing it is a deliberate act with a build behind it. The build
#    checks that the release named here really exists and really publishes a
#    fingerprint file, so a tag that does not exist fails the build rather than
#    failing on somebody's machine six weeks later.
[os.aquarius.editor]
Name=Aquarius Editor
Description=Our own video editor — cut on a timeline, with transcription and footage analysis built in and running on your machine.
Category=Video
Recommended=true
Type=appimage
Source=stoneharborent/aquarius-editor
Pin=v0.7.2
Asset=*.AppImage
Sha256sums=SHA256SUMS.txt

[org.kde.kdenlive]
Name=Kdenlive
Description=A video editor that opens files straight off a camera without converting them first.
Category=Video
Recommended=true

[org.blender.Blender]
Name=Blender
Description=3D animation, modelling and motion graphics — and a capable video editor as well.
Category=Video
Recommended=false


# ==============================================================================
# STREAMING — OBS and the four plug-ins that follow it
# ==============================================================================

[com.obsproject.Studio]
Name=OBS Studio
Description=Record your screen or go live to YouTube, Twitch and anywhere else.
Category=Streaming
Recommended=true

# The five below are plug-ins, not apps. They are marked IsRuntime=true on the
# shopping list, which is what keeps them out of the chooser: they arrive with
# OBS Studio rather than being offered separately.

[com.obsproject.Studio.Plugin.OBSVkCapture]
Name=OBS game capture
Description=Lets OBS record a game's own picture directly instead of filming the whole screen.
Category=Streaming
Recommended=true
Requires=com.obsproject.Studio

[org.freedesktop.Platform.VulkanLayer.OBSVkCapture]
Name=OBS game capture (the part inside the game)
Description=The other half of game capture — without it, game recording quietly captures nothing.
Category=Streaming
Recommended=true
Requires=com.obsproject.Studio

[com.obsproject.Studio.Plugin.PipeWireAudioCapture]
Name=OBS single-app audio
Description=Lets OBS record the sound of one program — the game, the call, a browser tab — instead of everything at once.
Category=Streaming
Recommended=true
Requires=com.obsproject.Studio

[com.obsproject.Studio.Plugin.Gstreamer]
Name=OBS GStreamer
Description=Gives OBS a second set of recording and streaming encoders to choose from.
Category=Streaming
Recommended=true
Requires=com.obsproject.Studio

[com.obsproject.Studio.Plugin.GStreamerVaapi]
Name=OBS hardware encoding for AMD and Intel
Description=Moves recording off the processor and onto AMD or Intel graphics, so the computer stays responsive.
Category=Streaming
Recommended=true
Requires=com.obsproject.Studio


