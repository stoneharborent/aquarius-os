# ==============================================================================
# GAMING
# ==============================================================================
# STEAM IS NOT ON THIS SHELF, AND THAT IS DELIBERATE. Steam is built into
# AquariusOS as a system program (build_files/68-gaming.sh), so it appears in
# the chooser's "Included with AquariusOS" group at the top, with an Open
# button, alongside Aquarius Editor and Aquarius Writer.
#
# What is here is the four things somebody might ALSO want, and none of them
# are ticked: a person who only plays games they bought on Steam should not be
# handed four extra tools they did not ask for.
#
# Protontricks is a Flatpak rather than part of the OS for a measured reason —
# the system package drags in the whole of Wine, 1.5 GB of it, that nothing
# else in this image uses. The note in the .preinstall file has the numbers.
#
# Bottles is deliberately not offered. It does the same job as Lutris by a
# different route, and offering two answers to one question makes the shelf
# harder to read rather than more useful. It is one click away on Flathub for
# anybody who wants it.

[com.heroicgameslauncher.hgl]
Name=Heroic Games Launcher
Description=Play the games you own on Epic, GOG and Amazon — the shops Steam does not cover.
Category=Gaming
Recommended=false

[net.lutris.Lutris]
Name=Lutris
Description=Runs games from everywhere else — old discs, itch.io, emulators and Battle.net.
Category=Gaming
Recommended=false

[net.davidotek.pupgui2]
Name=ProtonUp-Qt
Description=Installs newer or community versions of Proton, for the odd Windows game the built-in one will not run.
Category=Gaming
Recommended=false

[com.github.Matoking.protontricks]
Name=Protontricks
Description=Applies the per-game fixes some Windows titles need before they will run properly.
Category=Gaming
Recommended=false
