# ==============================================================================
# 50-aquarius-resolve-virtual-input.conf
#   An always-present "microphone" so DaVinci Resolve's meters work out of the box
# ==============================================================================
# PLAIN ENGLISH
#
# DaVinci Resolve opens the sound card for playback AND recording in one go
# ("full-duplex"). If the machine has nothing to record from — no microphone or
# line-in plugged into the jacks, which is the normal state — the recording half
# can never connect. Resolve reacts by tearing the whole sound device down and
# opening it again, over and over. On the test machine this happened about a
# hundred times a second, and the constant restarting is what froze Resolve's
# audio meters even though the actual mix was fine.
#
# THE FIX
# This file creates one fake, silent audio INPUT that is always present, called
# "Resolve Audio Input (virtual)". Because a recording source now always exists,
# Resolve's full-duplex open finishes cleanly the first time, and the meters
# move. Sound was never really broken — Resolve just needed something to record
# from, so here is a harmless something.
#
# WHY IT WON'T GET IN THE WAY OF A REAL MICROPHONE
# It is given the lowest possible priority (100). A real microphone or line-in
# announces itself at a much higher priority (around 1800), so the moment a real
# input is plugged in, the system automatically prefers it and this virtual one
# steps aside. It is only ever the fallback for when nothing real is there.
#
# WHERE THIS RUNS
# PipeWire — the program that moves sound around — runs on the AquariusOS
# desktop (the "host"), NOT inside the Rocky Linux box that Resolve itself runs
# in. So this belongs in the operating system image, here, and not in
# resolve-runtime/. It ships for every account on every machine with no setup.
#
# HOW PIPEWIRE FINDS THIS FILE
# PipeWire reads its main settings from pipewire.conf and then merges in every
# ".conf" file it finds in the neighbouring "pipewire.conf.d" folder. Putting
# this here, under /usr/share, makes it a system-wide default that a user can
# still override in /etc/pipewire or in their own home folder if they ever want
# to. The "50-" at the front just means it loads after the base settings.
#
# HISTORY
# Proven live on the bench on 2026-09-11 as a per-user copy of this exact
# config: the device-restart storm dropped from about 11,000 events in six
# seconds to zero, Resolve's recording stream reached "running" and linked to
# this source, and it survived a full PipeWire restart. FEATURES entry 013 has
# the full story.
# ==============================================================================

context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "ResolveInput"
            node.description  = "Resolve Audio Input (virtual)"
            media.class      = "Audio/Source/Virtual"
            audio.position   = [ FL FR ]
            priority.session = 100
            priority.driver  = 100
            object.linger    = true
        }
    }
]
