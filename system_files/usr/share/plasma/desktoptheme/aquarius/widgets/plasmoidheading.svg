<?xml version="1.0" encoding="UTF-8"?>
<!--
  AquariusOS Plasma Style — the HEADING STRIP inside a popup.

  Plasma puts one of these at the top of many popups (the title row of the
  notification panel, the header of an applet) and sometimes a matching one at
  the bottom. It is deliberately quiet: a 4% white wash and a 1-pixel rule, so
  it separates itself from the list below without adding a second sheet of
  glass on top of the popup glass.

  Two full sets of shapes live here:
    header-*   rounded along the TOP, with its rule along the bottom
    footer-*   rounded along the BOTTOM, with its rule along the top

  The rounded ends are 16px to line up with dialogs/background.svg.

  HOW TO READ THIS FILE (you do not need to know SVG)
  ...................................................
  Plasma does not show this picture as-is. It hunts through it for shapes with
  particular id="..." names and uses each one as a tile:

      topleft   top      topright
      left      center   right
      bottomleft bottom  bottomright

  It paints the four corners at their real size, stretches the four edges along
  the sides, and stretches "center" to fill the middle. That is how one small
  drawing becomes a panel of any size.

  There are then three more sets of the same nine names:

    mask-*     A solid black copy of the shape. KWin blurs the wallpaper ONLY
               where this black shape is. If it does not match the visible
               shape exactly, blur leaks past the rounded corners as pale
               squares. Change one, change the other.
    shadow-*   The soft drop shadow. It is drawn OUTSIDE the window, by the
               compositor, so it can be bigger than the window itself.
    hint-*     Invisible markers. Their size is the value; nothing is painted.

  Everything is laid out in labelled bands below so you can find things.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="80" height="200" viewBox="0 0 80 200">

  <!-- ===== BAND 1 — the heading strip (header-*) ===== -->
    <g id="header-topleft">
      <path d="M 0,16 A 16,16 0 0 1 16,0 L 16,16 Z" fill="#EDEFF7" fill-opacity="0.04"/>
    </g>
    <g id="header-topright">
      <path d="M 32,0 A 16,16 0 0 1 48,16 L 32,16 Z" fill="#EDEFF7" fill-opacity="0.04"/>
    </g>
    <g id="header-bottomleft">
      <rect x="0" y="32" width="16" height="16" fill="#EDEFF7" fill-opacity="0.04"/>
      <rect x="0" y="47" width="16" height="1" fill="#EDEFF7" fill-opacity="0.08"/>
    </g>
    <g id="header-bottomright">
      <rect x="32" y="32" width="16" height="16" fill="#EDEFF7" fill-opacity="0.04"/>
      <rect x="32" y="47" width="16" height="1" fill="#EDEFF7" fill-opacity="0.08"/>
    </g>
    <g id="header-top">
      <rect x="16" y="0" width="16" height="16" fill="#EDEFF7" fill-opacity="0.04"/>
    </g>
    <g id="header-bottom">
      <rect x="16" y="32" width="16" height="16" fill="#EDEFF7" fill-opacity="0.04"/>
      <rect x="16" y="47" width="16" height="1" fill="#EDEFF7" fill-opacity="0.08"/>
    </g>
    <g id="header-left">
      <rect x="0" y="16" width="16" height="16" fill="#EDEFF7" fill-opacity="0.04"/>
    </g>
    <g id="header-right">
      <rect x="32" y="16" width="16" height="16" fill="#EDEFF7" fill-opacity="0.04"/>
    </g>
    <g id="header-center">
      <rect x="16" y="16" width="16" height="16" fill="#EDEFF7" fill-opacity="0.04"/>
    </g>
    <rect id="header-hint-top-margin" x="0" y="52" width="4" height="1" fill="none"/>
    <rect id="header-hint-bottom-margin" x="8" y="52" width="4" height="1" fill="none"/>
    <rect id="header-hint-left-margin" x="16" y="52" width="1" height="4" fill="none"/>
    <rect id="header-hint-right-margin" x="24" y="52" width="1" height="4" fill="none"/>

  <!-- ===== BAND 2 — the matching bottom strip (footer-*) ===== -->
    <g id="footer-topleft">
      <rect x="0" y="100" width="16" height="16" fill="#EDEFF7" fill-opacity="0.04"/>
      <rect x="0" y="100" width="16" height="1" fill="#EDEFF7" fill-opacity="0.08"/>
    </g>
    <g id="footer-topright">
      <rect x="32" y="100" width="16" height="16" fill="#EDEFF7" fill-opacity="0.04"/>
      <rect x="32" y="100" width="16" height="1" fill="#EDEFF7" fill-opacity="0.08"/>
    </g>
    <g id="footer-bottomleft">
      <path d="M 16,148 A 16,16 0 0 1 0,132 L 16,132 Z" fill="#EDEFF7" fill-opacity="0.04"/>
    </g>
    <g id="footer-bottomright">
      <path d="M 48,132 A 16,16 0 0 1 32,148 L 32,132 Z" fill="#EDEFF7" fill-opacity="0.04"/>
    </g>
    <g id="footer-top">
      <rect x="16" y="100" width="16" height="16" fill="#EDEFF7" fill-opacity="0.04"/>
      <rect x="16" y="100" width="16" height="1" fill="#EDEFF7" fill-opacity="0.08"/>
    </g>
    <g id="footer-bottom">
      <rect x="16" y="132" width="16" height="16" fill="#EDEFF7" fill-opacity="0.04"/>
    </g>
    <g id="footer-left">
      <rect x="0" y="116" width="16" height="16" fill="#EDEFF7" fill-opacity="0.04"/>
    </g>
    <g id="footer-right">
      <rect x="32" y="116" width="16" height="16" fill="#EDEFF7" fill-opacity="0.04"/>
    </g>
    <g id="footer-center">
      <rect x="16" y="116" width="16" height="16" fill="#EDEFF7" fill-opacity="0.04"/>
    </g>
    <rect id="footer-hint-top-margin" x="0" y="152" width="4" height="1" fill="none"/>
    <rect id="footer-hint-bottom-margin" x="8" y="152" width="4" height="1" fill="none"/>
    <rect id="footer-hint-left-margin" x="16" y="152" width="1" height="4" fill="none"/>
    <rect id="footer-hint-right-margin" x="24" y="152" width="1" height="4" fill="none"/>

  <!-- ===== BAND 3 — stretch the edges rather than tile them ===== -->
  <rect id="hint-stretch-borders" x="60" y="190" width="4" height="4" fill="none"/>
</svg>
