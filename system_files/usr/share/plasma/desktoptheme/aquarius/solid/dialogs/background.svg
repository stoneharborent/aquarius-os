<?xml version="1.0" encoding="UTF-8"?>
<!--
  AquariusOS Plasma Style — the surface behind every POPUP.

  This one file is the background of: system-tray popups, the calendar, the
  notification pop-ups, applet popups and the search box (KRunner). Change the
  colour here and all of them change together.

  ⚠️ NO GLASS ANY MORE — decided by Royce 2026-08-30. Popups used to be
  see-through, on the assumption that the compositor would blur whatever was
  behind them. It never did (full investigation:
  `docs/blur-known-issue.md` in the repo root), so a popup opened over a busy
  window showed that window's text straight through its own — the worst place
  in the whole desktop for it, because a popup is mostly words. The fill below
  is now FULLY OPAQUE. Corners, shadow, hairline and sheen are unchanged.

  ⚠️ THIS FILE EXISTS TWICE, AND THE TWO COPIES ARE IDENTICAL BYTE FOR BYTE.
  There is a `solid/` folder beside this one holding the artwork Plasma uses
  when somebody sets a panel's Opacity to "Opaque" in Edit Mode. It used to
  differ from this file: this one was see-through, that one was not. Now that
  this one is opaque there is nothing left to differ about, so `solid/` is a
  straight copy. Keep it that way — if you edit this file, copy it over
  `solid/dialogs/background.svg` in the same change. Deleting the copy is NOT
  an option: with no file there, "Opaque" falls back to KDE's Breeze artwork
  and the design vanishes the moment somebody clicks it.
  (This is why paths in this file are written from the repo root rather than
  as ../.. — the same text has to make sense from both folders.)

  Design values (branding/design-system, "AquariusOS Desktop Shell"):
    fill      #0B0D15, fully opaque   ← see the sum below
    hairline  #EDEFF7 at 14% opacity, 1 pixel
    top sheen #EDEFF7 at 7% opacity, 1 pixel, just inside the top edge
    corners   16 pixels
    shadow    a big soft pool, heavier below than above

  WHERE #0B0D15 CAME FROM — it is the old glass, finished off, not a new
  colour anybody picked. The design's recipe was "#0D0F18 at 76%, sitting on
  the desktop", and the desktop is `void` = #06070C (branding/tokens.md). Mix
  the two in those proportions, channel by channel, in plain decimal:

    red    13×0.76 + 6×0.24  =  9.88 + 1.44 = 11.32 → 11 → 0B
    green  15×0.76 + 7×0.24  = 11.40 + 1.68 = 13.08 → 13 → 0D
    blue   24×0.76 + 12×0.24 = 18.24 + 2.88 = 21.12 → 21 → 15

  giving #0B0D15. That is a shade DARKER than the #0D0F18 the design names,
  and correctly so: the very dark desktop showing through at 24% was always
  pulling the popup down towards it. Freezing the result keeps what a person
  actually saw over the wallpaper.

  The hairline and the sheen KEEP their opacity. They are drawn on top of the
  opaque fill in this same file, so they mix with it rather than with whatever
  is behind the window — which is what they visually did all along.

  HOW TO READ THIS FILE (you do not need to know SVG)
  ...................................................
  Plasma does not show this picture as-is. It hunts through it for shapes with
  particular id="..." names and uses each one as a tile:

      topleft   top      topright
      left      center   right
      bottomleft bottom  bottomright

  It paints the four corners at their real size, stretches the four edges along
  the sides, and stretches "center" to fill the middle. That is how one small
  drawing becomes a panel of any size.

  There are then three more sets of the same nine names:

    mask-*     A solid black copy of the shape. Plasma hands this to the
               compositor as the window's MASK — the region the window really
               occupies, so nothing is drawn outside the rounded corners. It
               used to double as the blur-behind region too; there is no blur
               any more (see the note at the top of this file), but the mask
               job remains and is unchanged. It must still match the visible
               shape exactly. Change one, change the other.
    shadow-*   The soft drop shadow. It is drawn OUTSIDE the window, by the
               compositor, so it can be bigger than the window itself.
    hint-*     Invisible markers. Their size is the value; nothing is painted.

  Everything is laid out in labelled bands below so you can find things.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" viewBox="0 0 200 300">
  <defs>
    <!-- Edge gradients. "aq-sh-down" means: solid at the top of the tile,
         fading to nothing at the bottom. -->
    <linearGradient id="aq-sh-down" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="0.25" stop-color="#000000" stop-opacity="0.3025"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.143"/>
      <stop offset="0.75" stop-color="#000000" stop-opacity="0.0495"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aq-sh-up" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="0.25" stop-color="#000000" stop-opacity="0.3025"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.143"/>
      <stop offset="0.75" stop-color="#000000" stop-opacity="0.0495"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aq-sh-rightward" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="0.25" stop-color="#000000" stop-opacity="0.3025"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.143"/>
      <stop offset="0.75" stop-color="#000000" stop-opacity="0.0495"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aq-sh-leftward" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="0.25" stop-color="#000000" stop-opacity="0.3025"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.143"/>
      <stop offset="0.75" stop-color="#000000" stop-opacity="0.0495"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <!-- Corner gradients. Each is centred on the corner of the tile that touches
         the window, and because the units are "fraction of this tile" the circle
         is squashed into an ellipse that exactly matches the two edge tiles it
         sits between. That is why there is no seam. -->
    <radialGradient id="aq-sh-corner-br" cx="1" cy="1" r="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="0.25" stop-color="#000000" stop-opacity="0.3025"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.143"/>
      <stop offset="0.75" stop-color="#000000" stop-opacity="0.0495"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aq-sh-corner-bl" cx="0" cy="1" r="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="0.25" stop-color="#000000" stop-opacity="0.3025"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.143"/>
      <stop offset="0.75" stop-color="#000000" stop-opacity="0.0495"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aq-sh-corner-tr" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="0.25" stop-color="#000000" stop-opacity="0.3025"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.143"/>
      <stop offset="0.75" stop-color="#000000" stop-opacity="0.0495"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aq-sh-corner-tl" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="0.25" stop-color="#000000" stop-opacity="0.3025"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.143"/>
      <stop offset="0.75" stop-color="#000000" stop-opacity="0.0495"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== BAND 1 — the visible frame ===== -->
  <g id="aq-frame">
    <g id="topleft">
      <path d="M 0,16 A 16,16 0 0 1 16,0 L 16,16 Z" fill="#0B0D15"/>
      <path d="M 0.5,16 A 15.5,15.5 0 0 1 16,0.5" fill="none" stroke="#EDEFF7" stroke-opacity="0.14" stroke-width="1"/>
      <path d="M 1.5,16 A 14.5,14.5 0 0 1 16,1.5" fill="none" stroke="#EDEFF7" stroke-opacity="0.07" stroke-width="1"/>
    </g>
    <g id="topright">
      <path d="M 32,0 A 16,16 0 0 1 48,16 L 32,16 Z" fill="#0B0D15"/>
      <path d="M 32,0.5 A 15.5,15.5 0 0 1 47.5,16" fill="none" stroke="#EDEFF7" stroke-opacity="0.14" stroke-width="1"/>
      <path d="M 32,1.5 A 14.5,14.5 0 0 1 46.5,16" fill="none" stroke="#EDEFF7" stroke-opacity="0.07" stroke-width="1"/>
    </g>
    <g id="bottomleft">
      <path d="M 16,48 A 16,16 0 0 1 0,32 L 16,32 Z" fill="#0B0D15"/>
      <path d="M 16,47.5 A 15.5,15.5 0 0 1 0.5,32" fill="none" stroke="#EDEFF7" stroke-opacity="0.14" stroke-width="1"/>
    </g>
    <g id="bottomright">
      <path d="M 48,32 A 16,16 0 0 1 32,48 L 32,32 Z" fill="#0B0D15"/>
      <path d="M 47.5,32 A 15.5,15.5 0 0 1 32,47.5" fill="none" stroke="#EDEFF7" stroke-opacity="0.14" stroke-width="1"/>
    </g>
    <g id="top">
      <rect x="16" y="0" width="16" height="16" fill="#0B0D15"/>
      <rect x="16" y="0" width="16" height="1" fill="#EDEFF7" fill-opacity="0.14"/>
      <rect x="16" y="1" width="16" height="1" fill="#EDEFF7" fill-opacity="0.07"/>
    </g>
    <g id="bottom">
      <rect x="16" y="32" width="16" height="16" fill="#0B0D15"/>
      <rect x="16" y="47" width="16" height="1" fill="#EDEFF7" fill-opacity="0.14"/>
    </g>
    <g id="left">
      <rect x="0" y="16" width="16" height="16" fill="#0B0D15"/>
      <rect x="0" y="16" width="1" height="16" fill="#EDEFF7" fill-opacity="0.14"/>
    </g>
    <g id="right">
      <rect x="32" y="16" width="16" height="16" fill="#0B0D15"/>
      <rect x="47" y="16" width="1" height="16" fill="#EDEFF7" fill-opacity="0.14"/>
    </g>
    <rect id="center" x="16" y="16" width="16" height="16" fill="#0B0D15"/>
  </g>

  <!-- ===== BAND 2 — how far content is inset (8 pixels on every side) =====
       Nothing is painted here; only the SIZE of each marker is read. -->
    <rect id="hint-top-margin" x="0" y="56" width="4" height="8" fill="none"/>
    <rect id="hint-bottom-margin" x="8" y="56" width="4" height="8" fill="none"/>
    <rect id="hint-left-margin" x="16" y="56" width="8" height="4" fill="none"/>
    <rect id="hint-right-margin" x="16" y="64" width="8" height="4" fill="none"/>

  <!-- ===== BAND 3 — the mask =====
       Same 16px corners as band 1. If these ever disagree, the popup's
       shape and its drawing stop lining up at the corners. -->
  <g id="aq-mask">
    <g id="mask-topleft">
      <path d="M 0,96 A 16,16 0 0 1 16,80 L 16,96 Z" fill="#000000"/>
    </g>
    <g id="mask-topright">
      <path d="M 32,80 A 16,16 0 0 1 48,96 L 32,96 Z" fill="#000000"/>
    </g>
    <g id="mask-bottomleft">
      <path d="M 16,128 A 16,16 0 0 1 0,112 L 16,112 Z" fill="#000000"/>
    </g>
    <g id="mask-bottomright">
      <path d="M 48,112 A 16,16 0 0 1 32,128 L 32,112 Z" fill="#000000"/>
    </g>
    <g id="mask-top">
      <rect x="16" y="80" width="16" height="16" fill="#000000"/>
    </g>
    <g id="mask-bottom">
      <rect x="16" y="112" width="16" height="16" fill="#000000"/>
    </g>
    <g id="mask-left">
      <rect x="0" y="96" width="16" height="16" fill="#000000"/>
    </g>
    <g id="mask-right">
      <rect x="32" y="96" width="16" height="16" fill="#000000"/>
    </g>
    <rect id="mask-center" x="16" y="96" width="16" height="16" fill="#000000"/>
  </g>

  <!-- ===== BAND 4 — the drop shadow ===== -->
    <!-- ⚠️ Fixed 2026-08-30, first bench boot: a shadow tile is DARKEST along the
         edge that touches the window and fades away from it. All four edge tiles
         below used to be the other way round — clear next to the window, 45%
         black at the far edge — which drew a hard dark rectangle around
         everything. The corners were always right, so the mismatch showed up as
         blocks at the ends. The rule: the gradient's SOLID end points at the
         window. Full write-up in widgets/panel-background.svg, BAND 6. -->
    <rect id="shadow-topleft" x="0" y="136" width="34" height="18" fill="url(#aq-sh-corner-br)"/>
    <rect id="shadow-top" x="34" y="136" width="16" height="18" fill="url(#aq-sh-up)"/>
    <rect id="shadow-topright" x="50" y="136" width="34" height="18" fill="url(#aq-sh-corner-bl)"/>
    <rect id="shadow-left" x="0" y="154" width="34" height="16" fill="url(#aq-sh-leftward)"/>
    <rect id="shadow-center" x="34" y="154" width="16" height="16" fill="none"/>
    <rect id="shadow-right" x="50" y="154" width="34" height="16" fill="url(#aq-sh-rightward)"/>
    <rect id="shadow-bottomleft" x="0" y="170" width="34" height="50" fill="url(#aq-sh-corner-tr)"/>
    <rect id="shadow-bottom" x="34" y="170" width="16" height="50" fill="url(#aq-sh-down)"/>
    <rect id="shadow-bottomright" x="50" y="170" width="34" height="50" fill="url(#aq-sh-corner-tl)"/>
    <rect id="shadow-hint-top-margin" x="0" y="228" width="2" height="18" fill="none"/>
    <rect id="shadow-hint-bottom-margin" x="8" y="228" width="2" height="50" fill="none"/>
    <rect id="shadow-hint-left-margin" x="16" y="228" width="34" height="2" fill="none"/>
    <rect id="shadow-hint-right-margin" x="58" y="228" width="34" height="2" fill="none"/>
</svg>
