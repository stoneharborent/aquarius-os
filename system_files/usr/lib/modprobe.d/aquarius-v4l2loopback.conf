# AquariusOS — how the virtual camera introduces itself
#
# devices=1
#   One fake camera, which is what one person streaming needs. More would show
#   up as extra cameras in every video-call app for no reason.
#
# video_nr=9
#   Which device number it takes: /dev/video9. Deliberately a high number, so
#   it can never collide with a real webcam or capture card (those take 0, 1, 2
#   and upwards as they are plugged in) and so it always lands in the same
#   place, which matters because some apps remember a camera by its number.
#
# card_label
#   The name a person sees in Zoom's camera list. Ours says AquariusOS so it is
#   obvious which one it is.
#
# exclusive_caps=1
#   THE IMPORTANT ONE. Without it the fake camera advertises itself as a camera
#   at all times, even when nothing is sending a picture into it, and Chrome
#   and several video-call apps then either refuse it or show a black
#   rectangle. With it, the device only claims to be a camera while something
#   (OBS) is actually feeding it — which is why it behaves like a real camera
#   in a browser. This single word is the difference between "the virtual
#   camera works" and "the virtual camera is listed and black".
options v4l2loopback devices=1 video_nr=9 card_label="AquariusOS Virtual Camera" exclusive_caps=1
