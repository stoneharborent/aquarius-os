# =============================================================================
# When Game Mode ends, take the "a graphical session is running" signpost down
# =============================================================================
# WHAT THIS FILE IS. A drop-in: a small piece of extra instruction that systemd
# reads on top of somebody else's unit file, without editing theirs. The unit
# it adds to is gamescope-session-plus@.service — Game Mode itself, which comes
# from the Terra repository, not from us.
#
# WHAT IT FIXES, IN PLAIN ENGLISH (bench 4, 2026-09-20).
#
# Your computer runs a small manager of its own for your account. That manager
# keeps a set of switches called TARGETS describing what state you are in. One
# of them, `graphical-session.target`, means "this person has a graphical
# session on the screen right now".
#
# Terra's Game Mode unit says:
#
#     BindsTo=graphical-session.target
#     Before=graphical-session.target
#
# `BindsTo` points FROM the service TO the target. It means "if the TARGET
# stops, stop ME as well". It does NOT mean the reverse — nothing in it says
# "when Game Mode ends, lower the signpost". So when Game Mode ended, the
# signpost stayed up.
#
# GNOME then refused to start. Its own words, once per attempt:
#
#     gnome-session-i[18098]: A graphical session is already running!
#
# GNOME died, the login screen came back, the password-free login fired, GNOME
# refused again. Royce watched that happen forty-five times in ninety seconds
# before he held the power button down.
#
# It had worked on earlier benches only by luck: the account's manager used to
# shut down a few seconds after the last session closed, taking every stale
# signpost with it. Since this account has LINGERING switched on, the manager
# lives from switch-on to switch-off and carries the stale signpost straight
# across the switch. Plasma never noticed, because starting Plasma reloads the
# manager. GNOME checks, and GNOME is right to check.
#
# SO: whenever Game Mode's unit stops — for any reason at all, including Steam
# crashing or somebody killing it from a terminal — this one extra line lowers
# the signpost.
#
# WHY IT IS SAFE.
#   * The leading `-` means "if this command fails, that is not a failure of
#     the unit". A stop path that can fail is a machine that will not let go.
#   * `--no-block` means "ask, do not stand here waiting". We are inside the
#     stop of a unit that those very targets pull in; waiting here is how a
#     stop turns into a hang.
#   * ExecStopPost runs after the session is already finished, so nothing that
#     is still needed can be taken away by it.
#
# OUR OWN SWITCH DOES THE SAME THING, MORE CAREFULLY, in
# /usr/libexec/os-session-select — it stops the targets and then checks that
# they really stopped. This drop-in is the belt to that pair of braces: it
# covers the paths where our program never runs.
#
# Plain-language guide: docs/restart/game-mode.md ("Bench 4, 2026-09-20").
# =============================================================================
[Service]
ExecStopPost=-/usr/bin/systemctl --user --no-block stop graphical-session.target graphical-session-pre.target
