# =============================================================================
# Make /run/media/<you> exist from the moment you log in
# =============================================================================
# PLAIN ENGLISH
#
# systemd runs one background service per logged-in person, called
# user@<your user number>.service. This file is a small ADDITION to that
# service — systemd calls it a "drop-in" — which says: before you start that
# person's session, run this one program.
#
# The program is /usr/libexec/aquarius-media-dir and its own header explains at
# length what it does and why. The short version: it creates the folder every
# drive on this computer appears in, /run/media/<your user name>, and makes it
# yours, so that (a) the dock has a folder to watch from the first second of the
# session and (b) a Mac-formatted drive can be mounted by your own session,
# which is the only way we can read one at all.
#
# ------------------------------------------------------------------------------
# THE THREE ODD-LOOKING CHARACTERS ON THE ExecStartPre LINE
# ------------------------------------------------------------------------------
#   -   "if this fails, carry on anyway". ⚠️ This is not optional. Everything on
#       ExecStartPre runs BEFORE the person's session starts, and a failure
#       there stops the login. A folder for drives is a convenience; being able
#       to log in is not. The program itself also always exits 0, so there are
#       two independent nets under the same worry.
#
#   +   "run this bit as the administrator". The rest of user@.service runs as
#       the person, who cannot create a folder in /run/media. This prefix is
#       systemd's own supported way to say "this one step needs full rights",
#       and it is the reason no `sudo`, no setuid program and no polkit rule is
#       involved anywhere in this feature.
#
#   %i  systemd fills this in with the instance name — for user@1000.service
#       that is "1000", the person's USER NUMBER. (Not their name: systemd names
#       these services by number.) The program looks the number up.
#
# ------------------------------------------------------------------------------
# WHY IT LIVES IN /usr AND NOT /etc
# ------------------------------------------------------------------------------
# Same reason as everything else AquariusOS switches on: /usr is replaced whole
# at every update and nothing local can edit it, so this cannot be silently lost
# on one machine. The long version is beside aq_unit_is_on_from_usr in
# build_files/aq-lib.sh.
#
# Plain-English guide: docs/restart/mac-drives.md
# =============================================================================

[Service]
ExecStartPre=-+/usr/libexec/aquarius-media-dir %i
