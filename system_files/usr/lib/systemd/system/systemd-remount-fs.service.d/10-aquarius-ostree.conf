# ==============================================================================
# Don't re-mount / on a machine that boots the AquariusOS way
# ==============================================================================
# THE SYMPTOM THIS FIXES
#
# Every single boot, the text banner on the console said:
#
#     Failed Units: 1
#       systemd-remount-fs.service
#
# Nothing was broken. Nothing was missing. The machine worked perfectly. But a
# person who reads "Failed" on their screen every morning, forever, reasonably
# assumes something is wrong with their computer — and the next time something
# genuinely IS wrong, that line is already there and means nothing. A warning
# that is always on is not a warning.
#
# ------------------------------------------------------------------------------
# WHAT systemd-remount-fs.service IS FOR, AND WHY IT HAS NO JOB HERE
# ------------------------------------------------------------------------------
# On an ordinary Linux computer, the very first thing that happens is that the
# main disk gets mounted READ-ONLY, so that the disk-checking program can look
# at it safely. Once that check passes, something has to go back and mount it
# again properly, this time writable and with whatever options /etc/fstab asks
# for. That "something" is systemd-remount-fs.service. It reads /etc/fstab,
# finds the lines for `/` and `/usr`, and re-mounts them.
#
# AquariusOS does not boot that way, and cannot.
#
# On this operating system `/` is not a disk. It is an OVERLAY: a read-only,
# checksummed image of the system (composefs) with a writable layer on top of
# it. It is assembled in the boot ramdisk, before systemd starts, and it is
# already mounted exactly right by the time anything else runs.
#
# And an overlay cannot be re-mounted with different options. Not "should not" —
# the Linux kernel refuses. That is the exact error in the journal:
#
#     mount: /: fsconfig system call failed: overlay: No changes allowed in reconfigure.
#     /usr/bin/mount for / exited with exit status 32.
#
# So the service runs, tries to do the one thing it exists to do, is told no by
# the kernel, and reports failure. Every boot. It is not detecting a problem —
# it is asking a question that this kind of computer has no answer to.
#
# ------------------------------------------------------------------------------
# WHERE THE `/` LINE IN /etc/fstab CAME FROM
# ------------------------------------------------------------------------------
# Worth knowing, because it is not anybody's mistake and it will keep happening:
#
#   1. The Fedora installer (Anaconda) writes an /etc/fstab the way it has for
#      twenty years, including a line for `/`.
#   2. bootc then notices that fstab came from Anaconda and ADDS `ro` to that
#      line, from a service called bootc-fstab-edit.service. That was itself a
#      workaround for a different problem.
#   3. systemd-remount-fs reads the line, tries to apply it, and hits the wall
#      above.
#
# The line ends up looking like this, and the `ro` at the end is the trigger:
#
#     UUID=de5051b3-… / btrfs subvol=root,compress=zstd:1,ro 0 0
#
# ------------------------------------------------------------------------------
# THE REAL FIX, AND WHY THIS FILE EXISTS ANYWAY
# ------------------------------------------------------------------------------
# bootc's own maintainer has answered this twice, and the answer is: an image-
# mode system should have NO line for `/` in /etc/fstab at all. The root
# filesystem is described by the kernel command line (`root=` and `rootflags=`)
# and mounted from the ramdisk; fstab never gets a say. That is now written
# down in bootc's install documentation.
#
#     https://bootc-dev.github.io/bootc/bootc-install.html
#     https://github.com/bootc-dev/bootc/issues/971
#     https://github.com/ostreedev/ostree/issues/3193   (closed with that answer)
#
# We do exactly that for machines installed from here on: disk_config/iso.toml
# strips the `/` line in the installer, so a fresh AquariusOS install never has
# one. (bootc will not put it back — its editor only ever modifies an existing
# `/` line, it never creates one.)
#
# But /etc/fstab lives on the person's own disk, not in this image. A machine
# installed BEFORE that change — Royce's bench, installed 2026-08-28 — already
# has the bad line, and no update we publish can reach into it. This drop-in is
# how those machines get a clean boot too, without us rewriting somebody's
# /etc/fstab behind their back at boot time. That would be a real risk (a bug in
# it means a computer that will not start) for a cosmetic problem, and we are
# not taking it.
#
# ------------------------------------------------------------------------------
# WHAT THE ONE LINE BELOW ACTUALLY DOES
# ------------------------------------------------------------------------------
# `/run/ostree-booted` is a marker file. It does not exist on a normal Linux
# machine. On this kind of machine it is created in the boot ramdisk, by ostree,
# on every single boot, before systemd starts — it is the standard way for
# anything on the system to ask "am I running on an image-mode OS?", and it is
# what bootc itself uses.
#
# `ConditionPathExists=!` means "only run when this file is NOT there". So:
#
#   normal Linux         marker absent  → the service runs, exactly as designed
#   AquariusOS           marker present → the service is SKIPPED
#
# A skipped unit is not a failed unit. systemd logs one line saying the
# condition was not met, the unit sits at inactive/dead, and it does not appear
# in `systemctl --failed` or in the console banner. Nothing is masked, nothing
# is deleted, and `systemctl cat systemd-remount-fs.service` shows this file and
# this explanation.
#
# The `10-` in the filename is just ordering. Drop-ins are read in name order
# and this is the first and only one.
# ==============================================================================

[Unit]
ConditionPathExists=!/run/ostree-booted
