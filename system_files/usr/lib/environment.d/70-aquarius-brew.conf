# AquariusOS — let programs started by clicking an icon find brew's tools
#
# THE PROBLEM
# /etc/profile.d/aquarius-brew.sh puts Homebrew on PATH for every terminal, and
# that covers typing. It does not cover clicking: an app started from the dock,
# the app grid or a Quickshell menu is launched by systemd's user manager, and
# no shell is involved at any point, so no file in /etc/profile.d is ever read.
#
# The symptom, if this file did not exist, would be genuinely baffling: a tool
# you installed with brew works perfectly in a terminal, and the editor you
# opened from the dock insists it is not installed.
#
# THE FIX
# /usr/lib/environment.d/ is where an operating system puts variables that apply
# to everything in a person's session. systemd's user manager reads this folder
# at login, and both AquariusOS desktops — the Aquarius Session and the GNOME
# fallback — start their apps through it. Your own copy in
# ~/.config/environment.d/ always wins over this one.
#
# ⚠️ AT THE END OF PATH, NOT THE FRONT — the same rule as the profile file, for
# the same reason. Homebrew will install its own bash, systemd, dbus or rpm
# given the chance, and those copies are built for Homebrew rather than for
# Fedora. Appending means brew's tools are found when nothing else provides
# them and never win against the system's own. The long version is at the top of
# /etc/profile.d/aquarius-brew.sh.
#
# ⚠️ THIS FILE CANNOT ASK WHETHER HOMEBREW IS INSTALLED — it is a list of
# settings, not a script, so there is no "if" available. On a machine where the
# first-boot unpack has not run, or where somebody removed Homebrew, these two
# folders simply do not exist, and a PATH entry pointing at a folder that is not
# there is ignored by everything. It costs nothing and breaks nothing.
#
# Plain-language guide: docs/restart/homebrew.md
PATH=${PATH}:/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin
