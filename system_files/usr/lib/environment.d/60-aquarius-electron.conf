# AquariusOS — make Electron apps draw sharply on a scaled screen
#
# THE PROBLEM
# Aquarius Editor is an Electron app (a program built the way a web browser is).
# By default Electron on Linux talks to the display through XWayland, the
# compatibility layer for older software. On a screen set to 125% or 150% —
# which every 4K monitor is — XWayland cannot scale by a fraction, so the
# desktop scales the app's picture up afterwards, and the result is a window
# that looks faintly out of focus. Text is the giveaway.
#
# THE FIX
# ELECTRON_OZONE_PLATFORM_HINT=auto tells Electron to speak Wayland directly
# when it is on a Wayland desktop, and to fall back to X11 when it is not.
# "auto" rather than "wayland" on purpose: forcing Wayland on a machine that is
# not running it gives an app that does not start at all, which is far worse
# than a slightly soft one.
#
# WHY HERE
# /usr/lib/environment.d/ is where an operating system puts variables that
# should apply to everything in a person's session. systemd's user manager
# reads this folder at login and every app started from the desktop inherits
# it. Your own copy in ~/.config/environment.d/ always wins over this one, and
# so does anything you export by hand in a terminal.
#
# The app launchers (/usr/bin/aquarius-editor) also set this as a default, so
# it is right even when the app is started from an SSH session where a login
# session's variables were never read.
ELECTRON_OZONE_PLATFORM_HINT=auto
