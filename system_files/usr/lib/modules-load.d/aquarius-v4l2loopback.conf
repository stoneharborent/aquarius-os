# AquariusOS — load the virtual camera at boot
#
# v4l2loopback is a kernel module that creates a FAKE WEBCAM. It is the thing
# behind OBS Studio's "Start Virtual Camera" button: OBS writes its picture
# into the fake webcam, and Zoom, Google Meet, a browser or anything else that
# can use a camera sees OBS's output as if it were a camera.
#
# It has to be loaded by the operating system. OBS ships as a Flatpak — a
# sandboxed app — and a sandboxed app cannot load a kernel module. Without this
# file the Virtual Camera button fails with an error nobody can act on.
#
# Its settings (how many cameras, what they are called) are next door in
# /usr/lib/modprobe.d/aquarius-v4l2loopback.conf.
#
# If build_files/62-virtual-camera.sh could not install the module — which
# happens when the ready-made module and this image's kernel are a few days out
# of step — this file is removed by that script rather than left behind asking
# for something that is not there. Check with:  aq status  (or read
# /usr/share/aquarius/virtual-camera.txt).
v4l2loopback
