# =============================================================================
# Load the "uinput" driver at every boot
# =============================================================================
# uinput is the part of Linux that lets a program create a keyboard of its own.
# Aquarius Keys needs it: to give you Mac-style shortcuts it reads your real
# keyboard and then types the replacement keys through an invented one.
#
# Linux normally loads this driver only when something asks for it, and the
# asking happens too late — the permissions on /dev/uinput are set when the
# device appears, and the remapper is already trying to use it by then. On a
# machine where it is loaded at boot, the door is open before anybody knocks.
#
# One word per line. That is the whole file format.
# =============================================================================
uinput
