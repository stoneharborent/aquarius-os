# =============================================================================
# Aquarius Keys — your keyboard shortcut style
# =============================================================================
# This file has one setting in it.
#
#   mode=mac        Copy is Command-C, quit is Command-Q, search is
#                   Command-Space. The key beside the space bar is Command.
#                   This is what AquariusOS ships with.
#
#   mode=windows    The normal Linux and Windows shortcuts. Copy is Control-C.
#                   Nothing about your keyboard is changed at all.
#
# You can edit this file by hand, but the easy way is:
#
#     aq keys mac
#     aq keys windows
#     aq keys status
#
# — which changes this file AND applies it straight away, with no logging out.
#
# If you delete this file, Mac mode comes back, because that is the AquariusOS
# default.
# =============================================================================
mode=mac
