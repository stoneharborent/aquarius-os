# ==============================================================================
# AquariusOS — system-wide mpv settings
# ==============================================================================
# WHAT THIS FILE IS
#   The factory settings for mpv, the command-line video player AquariusOS
#   installs as its reference player. Like every other default in this OS, it is
#   a STARTING POINT and never a lock: mpv reads this file first and then the
#   user's own ~/.config/mpv/mpv.conf, and anything the user writes there wins.
#   Options given on the command line beat both.
#     Source: mpv manual, "Files" — "User-specific options override system-wide
#     options and options given on the command line override both."
#     https://mpv.io/manual/stable/#files
#
# WHY THIS PATH
#   mpv's system-wide config folder is decided when the program is compiled.
#   Fedora builds it with --sysconfdir=/etc, so the folder is /etc/mpv/ — and
#   Fedora's mpv package creates that folder but deliberately ships no mpv.conf
#   inside it, which is why we can put ours there without a fight.
#     Source: Fedora's mpv.spec —  `install -d %{buildroot}%{_sysconfdir}/%{name}`
#     and `%dir %{_sysconfdir}/%{name}/` in the %files list.
#     https://src.fedoraproject.org/rpms/mpv/blob/rawhide/f/mpv.spec
#
#   Note this is /etc and NOT /usr/share/aquarius/xdg/ — that folder is a KDE
#   mechanism and mpv knows nothing about it. Files we ship in /etc become the
#   image's default /etc, which is the normal way to set a program's defaults on
#   an atomic OS like this one.
#
# WHAT THIS DOES NOT AFFECT
#   Haruna, the desktop video player, is a Flatpak. It lives in its own sandbox
#   and never reads this file — it has its own hardware-decoding setting, which
#   is already switched on by its authors. See docs/codec-layer.md.
# ==============================================================================

# ------------------------------------------------------------------------------
# HARDWARE DECODING — let the graphics card do the work
# ------------------------------------------------------------------------------
# Playing modern video is expensive. Every graphics card made in the last decade
# has a dedicated chip that decodes H.264, H.265 and AV1 far faster and far
# cooler than the main processor can. This one line tells mpv to use it.
#
# mpv ships with hardware decoding OFF, on purpose — upstream wants the
# out-of-the-box experience to be maximally reliable rather than maximally fast.
# We turn it on because we know what hardware AquariusOS runs on (a PC with a
# real GPU) and because a creator machine plays a lot of video.
#   Source: mpv manual, --hwdec — "Hardware decoding is not enabled by default,
#   to keep the out-of-the-box configuration as reliable as possible."
#
# WHY "auto-safe" AND NOT SOMETHING STRONGER
#   The value is a promise about which decoders mpv is allowed to try:
#     no            never use hardware (mpv's own default)
#     auto-safe     only decoders the mpv team actively supports  ← this file
#     auto          identical to auto-safe; two names for one thing
#     auto-unsafe   try absolutely everything, including known-flaky paths
#     vaapi, nvdec… name one specific decoder and fail if it is missing
#   If a video's format has no hardware decoder — or the card refuses it — mpv
#   silently falls back to the processor and the video still plays. That
#   fallback is what makes this a safe default rather than a gamble.
#     Source: mpv manual, --hwdec value table (`auto-safe: exactly the same as
#     auto`) and "If hardware decoding is not possible, mpv will fall back on
#     software decoding."
#
# WHAT WE DELIBERATELY DID NOT WRITE
#   `hwdec=vaapi`, or any other single named decoder. Ubuntu does exactly that
#   in its own /etc/mpv/mpv.conf and mpv's manual calls it out by name as a
#   mistake: it may be the wrong choice for the machine and there is no fallback
#   if it is. Naming no decoder lets each machine pick its own.
hwdec=auto-safe

# ------------------------------------------------------------------------------
# HOW TO CHECK IT IS WORKING
# ------------------------------------------------------------------------------
# Play any video with the -v flag and look for a line saying "Using hardware
# decoding":
#
#     mpv -v yourfile.mp4 2>&1 | grep -i "hardware decoding"
#
# To watch it fall back on purpose, for comparison:
#
#     mpv --hwdec=no -v yourfile.mp4
#
# Ctrl+H toggles hardware decoding while a video is playing.
# The wider picture — what hardware video is, and what it cannot do on a PC —
# is in docs/codec-layer.md.
