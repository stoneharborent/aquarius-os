# ⚠️ CURRENTLY UNUSED — and it is NOT the GNOME ISO configuration.
#
# This file arrived with the upstream ublue image-template, next to iso-kde.toml.
# Nothing in this repo reads either of them. The only file bootc-image-builder
# would read is disk_config/iso.toml, and bootc-image-builder cannot build ISOs
# from Bazzite-based images at all right now (see the header of iso.toml).
#
# Our real installer ISOs come from .github/workflows/build-iso.yml, which uses
# Titanoboa and reads nothing in this folder.
#
# So: adding the three GNOME variants to the ISO workflow on 2026-08-31 did NOT
# involve this file, and pointing the GNOME ISO at it would have been wiring to
# nowhere. It is left exactly as upstream shipped it. If bootc-image-builder is
# ever fixed and iso.toml goes live again, THAT is the moment to work out whether
# a per-desktop variant of it is needed.

[customizations.installer.kickstart]
contents = """
%post
bootc switch --mutate-in-place --transport registry ghcr.io/stoneharborent/aquarius-os:latest
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime"
]
disable = [
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Subscription",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]
