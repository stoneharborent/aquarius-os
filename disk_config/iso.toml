# ==============================================================================
# AquariusOS installer ISO
# ==============================================================================
# This file configures the installer that ends up on the USB stick. It is read
# by bootc-image-builder, which is what .github/workflows/build-next-iso.yml
# runs.
#
# ⚠️ THIS FILE IS LIVE AGAIN, AND IT WAS NOT ON THE BAZZITE LINE.
#
# On `main` this same file carried a warning saying it was unused, because
# bootc-image-builder could not build an ISO from a Bazzite-based image — it
# choked on the Terra repository's signing keys
# (https://github.com/osbuild/bootc-image-builder/issues/1188). We worked around
# it with Titanoboa, Universal Blue's live-ISO builder.
#
# That bug was about Bazzite's extra software sources. AquariusOS is built on
# plain Fedora now and has none of them, so the ordinary Fedora installer works
# and Titanoboa is gone from this branch.
#
# ------------------------------------------------------------------------------
# WHAT AN "ANACONDA ISO" ACTUALLY DOES
# ------------------------------------------------------------------------------
# It is a normal Fedora installer that, instead of installing packages, installs
# a whole image. The %post script below is the entire mechanism: when the
# installer has finished writing the system to disk, it runs
# `bootc switch`, which points the freshly installed machine at our published
# image on GitHub as the thing it should be, and should keep updating from.
#
# ⚠️ THE IMAGE NAME BELOW IS A DEFAULT, AND CI REPLACES IT.
#
# This file names ONE image, and there are two. When
# .github/workflows/build-next-iso.yml builds the NVIDIA ISO it makes a copy of
# this file with the NVIDIA image name substituted in, and checks that no other
# image is left named in it.
#
# That step is not tidiness. If an NVIDIA ISO shipped with this line still
# naming the AMD image, the machine would install correctly, work perfectly, and
# then on its first automatic update quietly replace itself with the AMD image
# and lose its graphics driver — a black screen, days later, for no visible
# reason.
#
# The name left here is the AMD/Intel one, so that `just build-iso` on a Linux
# machine, which uses this file as it stands, does the sensible thing.
#
# ⚠️ The owner segment must be a real GitHub owner. If it is ever empty the
# reference becomes "ghcr.io//aquarius-os", the ISO builds perfectly, and
# the machine it installs cannot update — which is discovered weeks later.
# ==============================================================================

# ------------------------------------------------------------------------------
# What the USB stick calls itself
# ------------------------------------------------------------------------------
# `volume_id` is the name written onto the disc image itself. It is what shows up
# when the stick is plugged into a Mac or a Windows machine, and — this is the
# useful part — the installer's own boot menu is built from it too, so the first
# screen a person sees when booting the stick says AQUARIUSOS instead of
# "Fedora-bootc-…".
#
# ⚠️ Only capital letters, digits, `-` and `_` are allowed here. It is an old
# format with old rules; a space or a lower-case letter is rejected.
#
# WHAT THIS DOES NOT CHANGE, and what it would take:
#   The installer program itself (Anaconda) still shows Fedora's logo on its own
#   pages, because that artwork lives inside the installer's own runtime, which
#   is assembled by the ISO builder and is not this operating system. Changing it
#   means shipping a replacement for Fedora's artwork package inside that
#   runtime, which the ISO builder gives us no way to do. It is ten minutes of
#   somebody's life, once, on the way to a machine that then says AquariusOS
#   everywhere forever. See docs/restart/boot-branding.md.
[customizations.iso]
volume_id = "AQUARIUSOS"
application_id = "AquariusOS"
publisher = "Stone Harbor Entertainment"

# ------------------------------------------------------------------------------
# What runs on the freshly installed machine, once, before its first restart
# ------------------------------------------------------------------------------
# `%post` is Anaconda's "now that the system is written to disk, run this inside
# it" step. Two things happen here, and they are unrelated to each other.
#
# 1. `bootc switch` — the whole point of the ISO, described above: it tells the
#    new machine which published image it IS, and should keep updating from.
#
# 2. The `/` line is taken back out of /etc/fstab. This one needs explaining.
#
# ------------------------------------------------------------------------------
# WHY WE DELETE A LINE THE INSTALLER JUST WROTE
# ------------------------------------------------------------------------------
# THE SYMPTOM. On a machine installed from an ISO without this step, every boot
# ends with the console banner saying:
#
#     Failed Units: 1
#       systemd-remount-fs.service
#
# Nothing is broken. But a person reading "Failed" on their screen every morning
# reasonably assumes something is wrong — and the next time something genuinely
# is, that line is already there and means nothing.
#
# THE CAUSE, in three steps, none of which is anybody's mistake:
#
#   a. Anaconda writes an /etc/fstab the way it has for twenty years, and that
#      includes a line for `/`.
#   b. On first boot, bootc notices the fstab came from Anaconda and ADDS `ro`
#      to that line (bootc-fstab-edit.service). That was itself a workaround for
#      a different problem.
#   c. systemd-remount-fs.service then reads the line and tries to re-mount `/`
#      to match it. On this operating system `/` is not a disk — it is a
#      read-only checksummed image with a writable layer on top (composefs),
#      assembled in the boot ramdisk and already mounted correctly. The kernel
#      refuses to re-mount an overlay with different options:
#
#        mount: /: fsconfig system call failed: overlay: No changes allowed in reconfigure.
#
#      So the service fails. Every boot, forever.
#
# THE FIX IS THE ONE BOOTC ITSELF PRESCRIBES. An image-mode system should have
# no line for `/` in /etc/fstab at all: the root filesystem is described by the
# kernel command line (`root=`, `rootflags=`) and mounted from the ramdisk, and
# fstab never gets a say. bootc's maintainer gave that answer in both trackers
# and it is now in bootc's install documentation:
#
#     https://bootc-dev.github.io/bootc/bootc-install.html
#     https://github.com/bootc-dev/bootc/issues/971
#     https://github.com/ostreedev/ostree/issues/3193
#
# It sticks, permanently: bootc's fstab editor only ever MODIFIES an existing
# `/` line to add `ro`. With no such line it changes nothing and never adds one.
#
# ⚠️ ONLY THE `/` LINE GOES. The other lines are real mounts this machine needs
# — `/boot`, `/boot/efi`, `/home`, `/var` — and deleting `/var` or `/home` would
# produce a computer that does not start. The published one-line workaround
# going around for this (`grep "boot " /etc/fstab > …`) throws those away and
# must not be copied. The awk below matches on the SECOND field being exactly
# `/`, so it removes that one line and nothing else, and leaves comments and
# blank lines alone.
#
# `cat > /etc/fstab` rather than `mv`: it rewrites the file that is already
# there, which keeps its permissions and its SELinux label. A moved-in
# replacement can arrive mislabelled, and a mislabelled fstab is a bad first
# morning.
#
# ⚠️ THE `grep /boot` GUARD IS NOT DECORATION. If the awk above ever went wrong,
# the temporary file could be empty, and copying an empty file over /etc/fstab
# would produce a machine with no /boot, no /home and no /var — one that does
# not start. So the new file is only accepted if it still contains the /boot
# line, which proves it survived. If it does not, NOTHING is written, the
# original fstab is left exactly as it was, and the worst case is the cosmetic
# banner this whole section is about — which the image handles anyway, below.
#
# Machines installed from an OLDER ISO still have the bad line, because
# /etc/fstab is on their disk and no image update can reach it. They are covered
# separately, in the image, by
# system_files/usr/lib/systemd/system/systemd-remount-fs.service.d/10-aquarius-ostree.conf
[customizations.installer.kickstart]
contents = """
%post
bootc switch --mutate-in-place --transport registry ghcr.io/stoneharborent/aquarius-os:latest

awk '$1 ~ /^#/ || $2 != "/"' /etc/fstab > /tmp/aq-fstab
if grep -q '[[:space:]]/boot[[:space:]]' /tmp/aq-fstab; then
  echo '# The entry for / was removed by the AquariusOS installer, on purpose.' >> /tmp/aq-fstab
  echo '# bootc mounts / itself, from the kernel command line. An entry here makes' >> /tmp/aq-fstab
  echo '# systemd-remount-fs.service fail on every boot. Do not add one back.' >> /tmp/aq-fstab
  cat /tmp/aq-fstab > /etc/fstab
fi
rm -f /tmp/aq-fstab
%end
"""

# The parts of the installer we want. Everything not listed is switched off,
# which is how the installer stays short: no subscription step (that is a Red
# Hat Enterprise Linux thing and means nothing here), no software selection
# (there is nothing to select — the image is the software).
[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]

disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
