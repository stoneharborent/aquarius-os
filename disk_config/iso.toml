# ==============================================================================
# AquariusOS installer ISO
# ==============================================================================
# This file configures the installer that ends up on the USB stick. It is read
# by bootc-image-builder, which is what .github/workflows/build-next-iso.yml
# runs.
#
# ⚠️ THIS FILE IS LIVE AGAIN, AND IT WAS NOT ON THE BAZZITE LINE.
#
# On `main` this same file carried a warning saying it was unused, because
# bootc-image-builder could not build an ISO from a Bazzite-based image — it
# choked on the Terra repository's signing keys
# (https://github.com/osbuild/bootc-image-builder/issues/1188). We worked around
# it with Titanoboa, Universal Blue's live-ISO builder.
#
# That bug was about Bazzite's extra software sources. AquariusOS is built on
# plain Fedora now and has none of them, so the ordinary Fedora installer works
# and Titanoboa is gone from this branch.
#
# ------------------------------------------------------------------------------
# WHAT AN "ANACONDA ISO" ACTUALLY DOES
# ------------------------------------------------------------------------------
# It is a normal Fedora installer that, instead of installing packages, installs
# a whole image. The %post script below is the entire mechanism: when the
# installer has finished writing the system to disk, it runs
# `bootc switch`, which points the freshly installed machine at our published
# image on GitHub as the thing it should be, and should keep updating from.
#
# ⚠️ THE IMAGE NAME BELOW IS A DEFAULT, AND CI REPLACES IT.
#
# This file names ONE image, and there are two. When
# .github/workflows/build-next-iso.yml builds the NVIDIA ISO it makes a copy of
# this file with the NVIDIA image name substituted in, and checks that no other
# image is left named in it.
#
# That step is not tidiness. If an NVIDIA ISO shipped with this line still
# naming the AMD image, the machine would install correctly, work perfectly, and
# then on its first automatic update quietly replace itself with the AMD image
# and lose its graphics driver — a black screen, days later, for no visible
# reason.
#
# The name left here is the AMD/Intel one, so that `just build-iso` on a Linux
# machine, which uses this file as it stands, does the sensible thing.
#
# ⚠️ The owner segment must be a real GitHub owner. If it is ever empty the
# reference becomes "ghcr.io//aquarius-os", the ISO builds perfectly, and
# the machine it installs cannot update — which is discovered weeks later.
# ==============================================================================

# ------------------------------------------------------------------------------
# What the USB stick calls itself
# ------------------------------------------------------------------------------
# `volume_id` is the name written onto the disc image itself. It is what shows up
# when the stick is plugged into a Mac or a Windows machine, and — this is the
# useful part — the installer's own boot menu is built from it too, so the first
# screen a person sees when booting the stick says AQUARIUSOS instead of
# "Fedora-bootc-…".
#
# ⚠️ Only capital letters, digits, `-` and `_` are allowed here. It is an old
# format with old rules; a space or a lower-case letter is rejected.
#
# WHAT THIS DOES NOT CHANGE, and what it would take:
#   The installer program itself (Anaconda) still shows Fedora's logo on its own
#   pages, because that artwork lives inside the installer's own runtime, which
#   is assembled by the ISO builder and is not this operating system. Changing it
#   means shipping a replacement for Fedora's artwork package inside that
#   runtime, which the ISO builder gives us no way to do. It is ten minutes of
#   somebody's life, once, on the way to a machine that then says AquariusOS
#   everywhere forever. See docs/restart/boot-branding.md.
[customizations.iso]
volume_id = "AQUARIUSOS"
application_id = "AquariusOS"
publisher = "Stone Harbor Entertainment"

[customizations.installer.kickstart]
contents = """
%post
bootc switch --mutate-in-place --transport registry ghcr.io/stoneharborent/aquarius-os:latest
%end
"""

# The parts of the installer we want. Everything not listed is switched off,
# which is how the installer stays short: no subscription step (that is a Red
# Hat Enterprise Linux thing and means nothing here), no software selection
# (there is nothing to select — the image is the software).
[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]

disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
