# ⚠️ CURRENTLY UNUSED — kept on purpose, nothing reads this file today.
#
# This file only means something to bootc-image-builder, and bootc-image-builder
# cannot build ISOs from Bazzite-based images right now. That's a known bug
# upstream: https://github.com/osbuild/bootc-image-builder/issues/1188
# (it fails while resolving packages, because it can't read the terra repo's GPG
# keys through file:// paths).
#
# So "anaconda-iso" was removed from .github/workflows/build-disk.yml, and
# AquariusOS installer ISOs are now built by the separate
# "Build AquariusOS ISO (Titanoboa)" workflow (.github/workflows/build-iso.yml),
# which does not read this file at all.
#
# Leave this file here. If issue 1188 is fixed, adding "anaconda-iso" back to
# the build-disk.yml matrix makes it live again with no other changes.
# ------------------------------------------------------------------------------
# AquariusOS installer ISO configuration (KDE desktop — matches our Bazzite base).
#
# This is the file the ISO build uses. It was created from iso-kde.toml, which is
# the upstream template's KDE variant. Both the Justfile (`just build-iso`) and
# .github/workflows/build-disk.yml look for THIS filename (iso.toml).
#
# The kickstart line below tells the installer which published image to install onto the
# machine. The owner segment must be a real GitHub owner (stoneharborent) — if it is ever
# empty ("ghcr.io//aquarius-os"), the ISO builds fine but installs a malformed reference.

[customizations.installer.kickstart]
contents = """
%post
bootc switch --mutate-in-place --transport registry ghcr.io/stoneharborent/aquarius-os:latest
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]

disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
