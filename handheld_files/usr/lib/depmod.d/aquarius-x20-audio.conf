# AquariusOS handheld image: keep the X20's two patched sound drivers OUT of
# Linux's normal driver index.
#
# They live in /usr/lib/modules/<kernel>/aquarius-x20-audio/ and have the same
# names as Fedora's own drivers. If depmod indexed that folder, a plain
# `modprobe snd_acp_config` could pick OUR copy — and then "fall back to
# Fedora's driver" would quietly load ours again. Skipping the folder means the
# index only ever knows Fedora's drivers, and the patched ones are loaded only
# by /usr/libexec/aquarius-x20-audio, by their full path, after its checks.
exclude aquarius-x20-audio
