# AquariusOS handheld image: the ROG Xbox Ally X20's built-in speakers.
#
# When Linux asks for either of these two sound drivers, run our small program
# instead. It loads the two patched drivers this image compiled for its own
# kernel if (and only if) this is an RC74XA and every check passes; otherwise it
# loads Fedora's normal driver. See /usr/libexec/aquarius-x20-audio and
# docs/restart/handheld.md ("The built-in speakers").
#
# The "10-" at the front matters: if two files give an install line for the
# same driver, the one whose file name sorts FIRST wins. "10-" sorts before the
# old bench workaround's "99-aquarius-x20-audio-test.conf" in /etc/modprobe.d,
# so this one wins even if that old file is still on the machine.
#
# To switch it off without editing this file:  sudo touch /etc/aquarius/x20-audio-off
install snd_acp_config /bin/bash /usr/libexec/aquarius-x20-audio snd_acp_config
install snd_soc_acpi_amd_match /bin/bash /usr/libexec/aquarius-x20-audio snd_soc_acpi_amd_match
