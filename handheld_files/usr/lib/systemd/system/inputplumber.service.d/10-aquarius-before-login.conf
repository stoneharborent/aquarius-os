# =============================================================================
# AquariusOS — InputPlumber has to be ready BEFORE the login screen starts
# =============================================================================
# WHAT THIS FIXES, IN PLAIN ENGLISH
#
# InputPlumber is the program that takes the handheld's built-in controller —
# which Linux sees as three separate things (two raw USB devices and a motion
# sensor) — and presents it to Steam as ONE ordinary Xbox Elite controller,
# with the paddles and the gyro attached to it.
#
# Steam asks "is there a controller?" ONCE, very early, the first time it ever
# runs. If InputPlumber has not finished building that controller by then,
# Steam decides there is no controller on this computer and shows its setup
# screen saying "connect a controller" — on a machine where the controller is
# bolted to the sides and there is nothing to plug in. That is ublue-os/bazzite
# issue #3761, and it is a dead end you can only escape with a USB keyboard.
#
# InputPlumber's own unit file says only "start me some time during boot". This
# adds the one missing word: start me before the login screen.
#
#   Before=display-manager.service   the login screen (GDM) does not start
#                                    until this service has claimed its name on
#                                    the system bus, which is InputPlumber's own
#                                    definition of "I am ready".
#   Wants / After systemd-udev-settle is deliberately NOT here — it is a known
#   way to make a boot hang, and InputPlumber watches udev itself.
#
# ⚠️ THIS FILE IS ONLY ON THE HANDHELD IMAGE. The AMD/Intel and NVIDIA images
# do not carry InputPlumber at all.
#
# If Steam's "connect a controller" screen ever appears anyway, the escape
# hatches are in docs/restart/handheld.md: plug in any USB controller once, or
# press Ctrl+Alt+F3 and type `aq game boot off`.
# =============================================================================
[Unit]
Before=display-manager.service
