# =============================================================================
# HANDHELD IMAGE ONLY — a fresh start for every session switch
# =============================================================================
# systemd normally keeps an account's own service manager alive for ten seconds
# after its last session closes. The switch from the desktop to Game Mode logs
# back in four seconds after logging out, so Game Mode inherited a manager GNOME
# had just half taken apart — and on 2026-10-04 that hung Game Mode on a black
# screen (see /usr/lib/systemd/user/steamos-manager.service.d/).
#
# At boot Game Mode always gets a brand-new manager, and that has never failed.
# With no delay, every switch gets the same: the old manager stops the moment
# the desktop is gone, and the Game Mode login starts a new one.
#
# Only for accounts without lingering; an account with lingering keeps its
# manager whatever this says (`aq game status` reports which).
# =============================================================================
[Login]
UserStopDelaySec=0
