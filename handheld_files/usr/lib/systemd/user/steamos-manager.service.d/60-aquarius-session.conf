# =============================================================================
# HANDHELD IMAGE ONLY — Steam's helper ends with the session it belongs to
# =============================================================================
# THE BENCH BUG (2026-10-04): Desktop → Game Mode hung on a black screen until
# a restart. What the journal showed, in order:
#
#   1. On the handheld steamos-manager runs in the DESKTOP session too (it is
#      what Game Mode's sliders talk to, and it is wanted by
#      graphical-session.target).
#   2. Logging out of GNOME runs gnome-session-restart-dbus.service, which shuts
#      down the account's message bus. steamos-manager kept running, connected
#      to a bus that no longer existed.
#   3. The Game Mode login came four seconds later, so the account's systemd
#      manager was the same one, with that orphaned steamos-manager still in it.
#   4. steamos-manager-session-cleanup.service ran `steamosctl`, which asked the
#      orphan for something and waited — for ever. Game Mode never started.
#
# PartOf= makes it stop when the graphical session stops, so the next session
# starts a fresh one on the new bus. Its WantedBy=graphical-session.target
# brings it back in every session, as before.
# =============================================================================
[Unit]
PartOf=graphical-session.target
