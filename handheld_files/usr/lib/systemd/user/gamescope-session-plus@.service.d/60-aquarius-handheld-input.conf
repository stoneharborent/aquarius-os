# =============================================================================
# HANDHELD IMAGE ONLY — Game Mode gets an ordinary controller back
# =============================================================================
# On the desktop the Ally X's controller is a mouse
# (/usr/share/aquarius/inputplumber/desktop.yaml). Before Steam starts, this
# puts InputPlumber's Default profile back, so Steam sees a plain Xbox pad.
#
# The leading "-": it never stops Game Mode starting, whatever happens, and the
# script itself always exits 0 and writes any trouble to the journal
# (journalctl -t aquarius-handheld-input).
# =============================================================================
[Service]
ExecStartPre=-/usr/libexec/aquarius-handheld-input game
