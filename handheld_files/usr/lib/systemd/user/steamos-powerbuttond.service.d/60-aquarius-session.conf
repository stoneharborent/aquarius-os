# Steam handles the button only while Game Mode is running. Without the
# inhibitor, logind can shut down the machine before Steam handles the press.
# If the daemon exits (including when it finds no button), the inhibitor goes
# away and the handheld's logind setting falls back to suspend.
[Unit]
BindsTo=gamescope-session-plus@steam.service
After=gamescope-session-plus@steam.service
PartOf=gamescope-session-plus@steam.service

[Service]
ExecStart=
ExecStart=/usr/bin/systemd-inhibit --what=handle-power-key --mode=block --who=Steam --why="Steam handles the handheld power button" /usr/lib/hwsupport/steamos-powerbuttond
