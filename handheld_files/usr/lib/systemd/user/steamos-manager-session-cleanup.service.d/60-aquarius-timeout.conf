# =============================================================================
# HANDHELD IMAGE ONLY — the session clean-up step may not wait for ever
# =============================================================================
# A oneshot service has no start time limit by default. On the 2026-10-04 bench
# this one hung on a dead message bus and Game Mode never started (the whole
# story is in steamos-manager.service.d/60-aquarius-session.conf). It normally
# finishes in milliseconds; fifteen seconds is generous, and failing is
# harmless — it only tidies Steam's temporary session entries.
# =============================================================================
[Service]
TimeoutStartSec=15
