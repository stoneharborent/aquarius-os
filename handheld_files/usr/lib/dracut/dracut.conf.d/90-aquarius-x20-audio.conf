# AquariusOS handheld image: never put the two X20 sound drivers into the boot
# ramdisk (initramfs).
#
# The ramdisk does not carry /usr/libexec/aquarius-x20-audio, the program that
# decides between our patched drivers and Fedora's. A copy of either driver in
# the ramdisk could be loaded before that program can run, and once a driver is
# running it is never swapped (swapping a live sound driver froze the handheld
# on 2026-10-16). Sound is not needed to boot, so leaving them out costs nothing:
# they load a moment later from the real system, through the program.
omit_drivers+=" snd_acp_config snd_soc_acpi_amd_match "
