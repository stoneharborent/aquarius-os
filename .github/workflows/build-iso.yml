---
# ==============================================================================
# Build AquariusOS ISO (Titanoboa)
# ==============================================================================
# Plain English: this workflow makes the .iso file you burn onto a USB stick to
# install AquariusOS on a blank computer. You start it by hand from the Actions
# tab; it never runs on its own. Budget about an hour.
#
# It asks you ONE question: which AquariusOS? "base" is the normal one, for AMD
# and Intel graphics. "nvidia" is the one for machines with an NVIDIA graphics
# card. "deck" is the handheld one — a ROG Xbox Ally, Steam Deck or similar,
# which boots into Game Mode. It builds one ISO per run — pick the one you need.
#
# It happens in two stages, and that is the important thing to understand:
#
#   Stage 1 — build the "payload" image from the installer/ folder.
#             This is a live desktop with the Fedora installer on it, with a copy
#             of AquariusOS tucked inside so installing works offline.
#   Stage 2 — hand that payload to Titanoboa, which squashes it into an .iso.
#
# ---- Why the handheld ISO uses TWO images -----------------------------------
# For "base" and "nvidia" the live desktop you boot from the USB stick and the
# OS that gets written to the disk are the same image. For "deck" they are NOT,
# and that is deliberate:
#
#   the live session you boot  →  aquarius-os        (a normal desktop)
#   what gets INSTALLED        →  aquarius-os-deck   (boots into Game Mode)
#
# Because the handheld image's whole job is to skip the desktop and start Steam
# in Game Mode. Boot a live USB of it and you would be sitting in Steam's
# controller UI with the installer somewhere behind it — which is a terrible way
# to install an operating system. So the live half of a handheld ISO is the
# ordinary desktop, and the handheld image travels along inside it as cargo.
#
# This is not our invention: it is exactly what Bazzite does for its own deck
# ISOs, and it is the reason installer/Containerfile has taken two separate
# image arguments (BASE_IMAGE and INSTALL_IMAGE_PAYLOAD) since it was written.
# Until now we always passed the same value to both. See installer/README.md.
#
# Why two stages: Titanoboa refuses to build an ISO unless the image contains
# /usr/lib/bootc-image-builder/iso.yaml (the "container-native ISO contract").
# Bazzite does not put that file in bazzite:stable — it adds it in exactly this
# kind of separate installer layer, built right before its own ISOs. AquariusOS
# is built FROM bazzite:stable, so we had the same hole. installer/ fills it.
# See installer/README.md for the full explanation.
#
# Why not bootc-image-builder: that tool currently cannot make ISOs from
# Bazzite-based images at all — https://github.com/osbuild/bootc-image-builder/issues/1188
#
# Structure copied from ublue-os/bazzite .github/workflows/build_iso.yml
# (Apache-2.0), read at commit 0fb3abacb1135fbb50cbb575a18f53fea683ab0f
# (2026-08-23).
#
# ---- A note on which Titanoboa we use --------------------------------------
# Bazzite's workflow points at a fork, Zeglius/titanoboa@revamp-pr, rather than
# upstream. We checked, on 2026-08-23, whether that matters: the fork's
# action.yml, main.sh, build_iso.sh and Containerfile are byte-for-byte identical
# to upstream ublue-os/titanoboa main @ 5c457c3d0518bd17e754be0fd98a60d29d26abb4,
# which is the commit we already pin. So the payload machinery below depends on
# no fork-only behaviour, and we stay on the upstream pin — same code, but a
# pinned commit in the ublue-os org rather than a moving branch in a personal
# fork. If Bazzite's ISOs ever start depending on something only the fork has,
# re-run that comparison before copying more of their workflow.
# ==============================================================================

name: Build AquariusOS ISO (Titanoboa)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which AquariusOS? KDE line (frozen): base / nvidia / deck. GNOME line (current): gnome / gnome-nvidia / gnome-deck. Handheld = Ally or Steam Deck; nvidia = any RTX card; base = AMD or Intel PC."
        # Still "base" on purpose. The GNOME images have not been published to
        # ghcr.io yet at the time this choice was added, and an ISO can only be
        # built from an image that already exists there. Flipping this default to
        # "gnome" is part of the G3 cut-over, not of adding the variants.
        required: true
        default: base
        type: choice
        options:
          - base
          - nvidia
          - deck
          - gnome
          - gnome-nvidia
          - gnome-deck
      image-ref:
        description: "Advanced: a specific image to INSTALL instead. Leave BLANK to use the choice above."
        required: false
        default: ""
        type: string

permissions: {}

# Plain English: "concurrency" is GitHub's rule for what happens when you start
# this workflow again while an earlier run is still going. Runs that share the
# same "group" name are treated as the same queue, and cancel-in-progress means
# a new run kicks the older one out of that queue.
#
# The variant is part of the group name ON PURPOSE. Without it, base and nvidia
# shared one queue, so starting the NVIDIA ISO would cancel a base ISO that was
# still building (that really happened, 2026-08-26). Now they have a queue each
# and can build at the same time — while starting a second base ISO still
# cancels the first base ISO, which is what you want when you fix something and
# re-run it.
#
# The "|| 'base'" is a safety net: inputs.variant only exists when you press
# "Run workflow" by hand, so if this workflow is ever triggered another way the
# group name still ends in a real word instead of nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.variant || 'base' }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build live installer ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      # GitHub's free runners only have about 14 GB of free disk on the main
      # drive. An OS image plus the ISO we squeeze out of it is far bigger than
      # that, so we clear out preinstalled junk first. Same step, same pinned
      # version, as build-disk.yml uses.
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      # Even after clearing junk, the main drive is too small. The runner has a
      # much larger scratch disk mounted at /mnt, so we make a big filesystem
      # there and point the container storage at it. This is exactly what
      # Bazzite's own ISO workflow does.
      - name: Mount container storage on a large loopback disk
        run: |
          set -euxo pipefail
          sudo truncate -s 110G /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service || true
          LOOP=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$LOOP" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
          sudo systemctl start podman.service || true

      # We need the installer/ folder from this repo to build the payload.
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Everything below runs podman as root, so the login has to be as root too
      # — a normal `podman login` would write credentials somewhere root cannot
      # see. The AquariusOS package is public, so this is belt-and-braces in case
      # it is ever made private.
      - name: Log in to the GitHub container registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${REGISTRY_TOKEN}" \
            | sudo podman login ghcr.io -u "${REGISTRY_USER}" --password-stdin

      # Also creates the folder the finished ISO will land in. That `mkdir` is
      # load-bearing — see the long comment on the "Build the ISO" step.
      - name: Work out the image and ISO file names
        id: names
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
          VARIANT: ${{ inputs.variant }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # If nobody typed a specific image, work it out from the variant they
          # picked. These six names must match IMAGE_NAME, NVIDIA_IMAGE_NAME,
          # DECK_IMAGE_NAME, GNOME_IMAGE_NAME, GNOME_NVIDIA_IMAGE_NAME and
          # GNOME_DECK_IMAGE_NAME in aquarius-os.env — `just` isn't installed on
          # this runner, so this is the one other place they appear. Change both
          # together.
          #
          # IMAGE_REF is what gets INSTALLED onto the machine.
          KDE_DESKTOP_IMAGE_NAME="aquarius-os"
          GNOME_DESKTOP_IMAGE_NAME="aquarius-os-gnome"
          if [[ -z "${IMAGE_REF}" ]]; then
            case "${VARIANT}" in
              base)         IMAGE_NAME="${KDE_DESKTOP_IMAGE_NAME}" ;;
              nvidia)       IMAGE_NAME="aquarius-os-nvidia" ;;
              deck)         IMAGE_NAME="aquarius-os-deck" ;;
              gnome)        IMAGE_NAME="${GNOME_DESKTOP_IMAGE_NAME}" ;;
              gnome-nvidia) IMAGE_NAME="aquarius-os-gnome-nvidia" ;;
              gnome-deck)   IMAGE_NAME="aquarius-os-gnome-deck" ;;
              *)
                echo "::error::Unknown variant '${VARIANT}' — expected base, nvidia, deck, gnome, gnome-nvidia or gnome-deck."
                exit 1
                ;;
            esac
            IMAGE_REF="ghcr.io/${OWNER}/${IMAGE_NAME}:latest"
          fi
          # Lowercase it — registries reject capital letters in image names.
          IMAGE_REF="${IMAGE_REF,,}"

          # LIVE_IMAGE_REF is what the USB stick BOOTS INTO while you install.
          #
          # Normally it is the same image. The handheld one is the exception —
          # it boots into Game Mode instead of a desktop, so a live session made
          # of it would drop you into Steam with the installer hidden behind it.
          # For that one, the live session is the ordinary desktop image and the
          # handheld image rides along as the thing being installed. The long
          # explanation is in this file's header; Bazzite does the same.
          #
          # This is decided from the image NAME, not from the variant input, so
          # that the "Advanced" image-ref box gets the same treatment: type a
          # -deck image in there by hand and you still get a usable installer.
          #
          # ⚠️ There are now TWO handheld images and they must each borrow their
          # OWN line's desktop image for the live session. Lending the KDE
          # desktop image to the GNOME handheld would work, in the sense that
          # the installer would run — but the person installing AquariusOS with
          # GNOME would spend the whole install looking at Plasma, which is a
          # confusing first impression and would make any live-session polish we
          # do for GNOME invisible. The `-gnome` test has to come FIRST, because
          # "aquarius-os-gnome-deck" contains both words.
          if [[ "${IMAGE_REF}" == *"-gnome-deck"* ]]; then
            LIVE_IMAGE_REF="ghcr.io/${OWNER}/${GNOME_DESKTOP_IMAGE_NAME}:latest"
            LIVE_IMAGE_REF="${LIVE_IMAGE_REF,,}"
            echo "GNOME handheld image detected. The live session will be the GNOME desktop image."
          elif [[ "${IMAGE_REF}" == *"-deck"* ]]; then
            LIVE_IMAGE_REF="ghcr.io/${OWNER}/${KDE_DESKTOP_IMAGE_NAME}:latest"
            LIVE_IMAGE_REF="${LIVE_IMAGE_REF,,}"
            echo "Handheld image detected. The live session will be the desktop image."
          else
            LIVE_IMAGE_REF="${IMAGE_REF}"
          fi

          # ⚠️ TODO (G2) — THE GNOME LIVE SESSION HAS NOT BEEN LOOKED AT YET.
          # installer/titanoboa_hook_postrootfs.sh dresses the live USB session,
          # and parts of it are written for Plasma: it appends a virtual-keyboard
          # setting to /etc/xdg/kwinrc for the handheld live session, and pins
          # things the KDE way. On a GNOME live image those lines write a file
          # nothing reads — harmless, but it means a GNOME handheld's live
          # session has NO on-screen keyboard, which on a device with no keyboard
          # attached is the difference between "installable" and "not". Nobody
          # has booted a GNOME ISO yet, so this is written down rather than
          # guessed at. Fix it in G2, on the bench, with a real ISO.

          echo "This ISO will INSTALL:   ${IMAGE_REF}"
          echo "Its live session runs:   ${LIVE_IMAGE_REF}"

          # Turn "ghcr.io/owner/aquarius-os:latest" into "aquarius-os-latest".
          # Named after the image being INSTALLED — that is what somebody is
          # choosing when they download an ISO.
          NAME_PART="${IMAGE_REF##*/}"
          ISO_BASENAME="${NAME_PART/:/-}-live-amd64.iso"
          # One folder holds the finished ISO and its checksum, and is what gets
          # uploaded. Deliberately in RUNNER_TEMP and NOT in the workspace —
          # again, see the "Build the ISO" step.
          UPLOAD_DIR="${RUNNER_TEMP}/upload"
          mkdir -p "${UPLOAD_DIR}"
          echo "image-ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "live-image-ref=${LIVE_IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "iso-basename=${ISO_BASENAME}" >> "$GITHUB_OUTPUT"
          echo "upload-dir=${UPLOAD_DIR}" >> "$GITHUB_OUTPUT"
          echo "iso-dest=${UPLOAD_DIR}/${ISO_BASENAME}" >> "$GITHUB_OUTPUT"

      # ---- Stage 1 -----------------------------------------------------------
      # Build the live installer image from installer/. This is the step that was
      # missing before, and the reason ISO builds used to die with
      # "Missing /usr/lib/bootc-image-builder/iso.yaml".
      #
      # --cap-add sys_admin is required: installer/build.sh runs podman inside the
      # build to embed a copy of AquariusOS into the live image.
      #
      # The two --build-arg lines are the split described in this file's header:
      #   BASE_IMAGE            what the live USB session is made of
      #   INSTALL_IMAGE_PAYLOAD what gets written to the machine's disk
      # For base and nvidia these are the same image, as they always were. For
      # the handheld image they differ, which is the case Bazzite wrote these
      # two arguments for in the first place.
      - name: Build the installer payload image
        env:
          IMAGE_REF: ${{ steps.names.outputs.image-ref }}
          LIVE_IMAGE_REF: ${{ steps.names.outputs.live-image-ref }}
        run: |
          set -euxo pipefail
          sudo env TMPDIR=/mnt/podman-storage/tmp podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --build-arg BASE_IMAGE="${LIVE_IMAGE_REF}" \
            --build-arg INSTALL_IMAGE_PAYLOAD="${IMAGE_REF}" \
            -t localhost/payload:latest \
            installer/

      - name: Show disk space
        if: always()
        run: |
          sudo df -h
          sudo du -sh /mnt/podman-storage.img || true

      # ---- Stage 2 -----------------------------------------------------------
      # The actual ISO build, from the payload image we just made (NOT from the
      # published AquariusOS image directly). Pinned to a specific commit of the
      # Titanoboa action (like every other action in this repo) so a change
      # upstream can never silently change what we build.
      #
      # ⚠️ Two sharp edges in how this action handles `iso-dest`. Both bit us on
      # run 32693412902, where the ISO built perfectly and then the hand-off
      # failed. Do not "tidy up" the path below without reading this.
      #
      # The action does, in effect:
      #     cd "$GITHUB_ACTION_PATH"
      #     dest="$(realpath --relative-base="$GITHUB_WORKSPACE" "$iso_dest")"
      #     dest="$(realpath -m "$dest")"
      #     mkdir -p "$(dirname "$dest")"; mv "$built_iso" "$dest"
      #
      #  1. That first `realpath` has no -m, so it requires the PARENT FOLDER of
      #     iso-dest to already exist. It doesn't create it. If it's missing you
      #     get "No such file or directory" and an empty dest — after an hour of
      #     successful ISO building. The "Work out the ... names" step above
      #     creates it for exactly this reason.
      #  2. `--relative-base` turns any path INSIDE the workspace into a relative
      #     one, and the next line re-resolves that against the current folder —
      #     which the action changed to its own install directory. So a workspace
      #     path quietly relocates the ISO into _actions/ublue-os/titanoboa/...
      #     A path OUTSIDE the workspace passes through untouched. That is why
      #     iso-dest points at RUNNER_TEMP and not at the repo folder.
      #
      # Because the path survives intact, the ISO lands directly in the upload
      # folder and no further moving is needed.
      - name: Build the ISO
        id: build
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4 # main @ 2026-05-19
        with:
          image-ref: localhost/payload:latest
          iso-dest: ${{ steps.names.outputs.iso-dest }}

      # The ISO is already sitting in the upload folder, so all that's left is a
      # checksum next to it — a short fingerprint you can use later to prove the
      # download didn't get corrupted. The `if` is a seatbelt: if a future
      # version of the action ever puts the file somewhere else, we move it back
      # instead of failing.
      - name: Add a checksum file next to the ISO
        env:
          ISO_PATH: ${{ steps.build.outputs.iso-dest }}
          UPLOAD_DIR: ${{ steps.names.outputs.upload-dir }}
        run: |
          set -euxo pipefail
          ISO_NAME="$(basename "${ISO_PATH}")"
          if [[ "${ISO_PATH}" != "${UPLOAD_DIR}/${ISO_NAME}" ]]; then
            echo "Note: the ISO came back from ${ISO_PATH}, moving it into place."
            mv "${ISO_PATH}" "${UPLOAD_DIR}/"
          fi
          cd "${UPLOAD_DIR}"
          sha256sum "${ISO_NAME}" | tee "${ISO_NAME}-CHECKSUM"
          ls -lh "${UPLOAD_DIR}"

      - name: Upload the ISO to Job Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.names.outputs.iso-basename }}
          path: ${{ steps.names.outputs.upload-dir }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      # If the run went red, print the most likely reasons in plain English
      # instead of leaving a wall of shell output as the last word.
      - name: What probably went wrong
        if: failure()
        env:
          IMAGE_REF: ${{ steps.names.outputs.image-ref }}
          LIVE_IMAGE_REF: ${{ steps.names.outputs.live-image-ref }}
        run: |
          echo "The image this run was trying to INSTALL: ${IMAGE_REF:-(not worked out yet)}"
          echo "The image its live session runs:          ${LIVE_IMAGE_REF:-(not worked out yet)}"
          echo "(Those two differ only for the handheld ISO — that is on purpose.)"
          cat <<'EOF'
          ------------------------------------------------------------------
          This ISO build failed. Find the first red step above — that tells
          you which of these it is.

          "Build the installer payload image" failed
            Something in installer/ broke. Common causes:
              * A package name changed upstream, so a `dnf install` in
                installer/build.sh or one of the two hook scripts failed.
              * An AquariusOS image could not be downloaded. Check that BOTH
                images named just above this box are still PUBLIC on GHCR, and
                that the "Build AquariusOS image" workflow has succeeded at
                least once for each. (Every variant is its own package on GHCR
                and each needs making public separately — that is a one-time
                click per image, and it is the usual reason a brand-new
                variant's first ISO fails here.)
              * Ran out of disk. Check the "Show disk space" step.

          "Build the ISO" failed
            Titanoboa could not turn the payload into a disc image. If you see
              "Missing /usr/lib/bootc-image-builder/iso.yaml"
            then the payload build silently skipped its last steps — that file
            is copied in at the very end of installer/build.sh.

            If instead you see the ISO finish writing and THEN a realpath error
            mentioning a missing directory: something changed the iso-dest path.
            Read the long comment on the "Build the ISO" step — that path has to
            live outside the workspace and its folder has to exist first.

          "Add a checksum file..." failed
            The ISO was built but landed somewhere unexpected. Check the
            "Build the ISO" step output for the path it reported.

          Background on how this all fits together: installer/README.md
          ------------------------------------------------------------------
          EOF
