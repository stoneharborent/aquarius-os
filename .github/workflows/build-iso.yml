---
# ==============================================================================
# Build an AquariusOS installer ISO
# ==============================================================================
# An ISO is the file you write to a USB stick to install AquariusOS on a
# computer that is not running it yet. If the machine ALREADY runs AquariusOS
# you do not need this at all — `sudo bootc switch …` is faster and reversible.
# See docs/restart/bench-rebase.md.
#
# ------------------------------------------------------------------------------
# HOW TO RUN IT
# ------------------------------------------------------------------------------
# THE ORDINARY WAY — press the button.
#
#     1. GitHub → this repository → Actions
#     2. "Build AquariusOS ISO" in the left-hand list
#     3. "Run workflow", pick the variant, press the green button
#
# ⚠️ That button only appears for workflows that exist on the repository's
# DEFAULT branch. That is `main`, and this file is on it, so the button is
# there. Before 4 September 2026 it was not: `main` was the older Bazzite line
# then and this file lived on a branch, so the only way in was the tag below.
#
# THE OTHER WAY — push a tag. Still supported, and still the way to start an
# ISO from a branch that is not the default one. Tags are not branches, so
# this touches nothing.
#
#     git tag iso-nvidia-2026-09-05
#     git push origin iso-nvidia-2026-09-05
#
#   The tag name says which image: it must start with `iso-base-` or
#   `iso-nvidia-`. Anything after that is yours — a date is the obvious thing.
#   Pushing the tag starts the build.
#
# Either way: wait 20-40 minutes, then download the ISO from the Artifacts
# section at the bottom of the run's page.
#
# It is deliberately never automatic. An ISO is several gigabytes, it takes half
# an hour of a build machine, and it is needed a handful of times a year.
#
# ⚠️ THE IMAGE MUST BE PUBLISHED FIRST. This workflow takes an image that is
# already on ghcr.io and turns it into an installer. It does not build one. If
# the build workflow has never finished green, there is nothing here to wrap.
#
# ------------------------------------------------------------------------------
# WHY THIS IS SIMPLER THAN THE BAZZITE ONE
# ------------------------------------------------------------------------------
# The Bazzite line (now on the `bazzite-archive` branch) could not use the
# ordinary Fedora installer: bootc-image-builder choked on the extra software
# sources Bazzite carries (osbuild/bootc-image-builder#1188), so we used
# Titanoboa, Universal Blue's live-ISO builder, and then had to undress its
# Bazzite-flavoured live session.
#
# AquariusOS is plain Fedora now and has none of those sources, so the standard
# tool works. This whole workflow is one action call.
#
# A note on that tool: bootc-image-builder was archived in June 2026 and folded
# into osbuild's image-builder. The old form still works through a compatibility
# wrapper and it is what Universal Blue's own template still uses, so it is what
# we use. Expect to revisit this once in the next year.
# ==============================================================================

name: Build AquariusOS ISO

on:
  # The ordinary way: Actions → this workflow → "Run workflow".
  workflow_dispatch:
    inputs:
      variant:
        description: "Which one? base = AMD or Intel graphics. nvidia = any RTX card."
        required: true
        default: nvidia
        type: choice
        options:
          - base
          - nvidia
      tag:
        description: "Which build. Leave as 'latest' unless you want a specific dated one."
        required: false
        default: latest
        type: string
  # The other way. Push a tag whose name starts with the variant — still the
  # way to build an ISO from a branch that is not the default one.
  push:
    tags:
      - 'iso-base-*'
      - 'iso-nvidia-*'

# ⚠️ THE VARIANT HAS TO BE IN THIS NAME. Runs that share a concurrency group
# cancel each other, and both variants started from the button share the same
# branch — so a group of workflow-plus-branch would mean pressing "Run workflow"
# for nvidia silently killed the base ISO that was already twenty minutes in.
# That exact bug happened on the Bazzite line on 2026-08-26 and was fixed the
# same way; it stayed fixed here only by accident, because until the button
# existed every ISO was started by a differently-named tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.variant || 'from-a-tag' }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build the installer ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Make room on the build machine
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Work out which image to wrap
        id: names
        env:
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Which image, from whichever trigger fired. When somebody pressed the
          # button, it is the box they chose. When a tag was pushed, it is the
          # first word of the tag name — `iso-nvidia-2026-09-03` means nvidia.
          if [ -n "${INPUT_VARIANT:-}" ]; then
            VARIANT="${INPUT_VARIANT}"
            echo "Started by hand. Variant: ${VARIANT}"
          else
            case "${REF_NAME}" in
              iso-base-*)   VARIANT="base" ;;
              iso-nvidia-*) VARIANT="nvidia" ;;
              *)
                echo "::error::Tag '${REF_NAME}' does not start with iso-base- or iso-nvidia-, so there is no way to tell which image to build. Delete the tag and push one that does."
                exit 1
                ;;
            esac
            echo "Started by the tag '${REF_NAME}'. Variant: ${VARIANT}"
          fi

          TAG="${INPUT_TAG:-latest}"

          IMAGE_NAME="$(just variant-image-name "${VARIANT}")"
          IMAGE_REF="ghcr.io/${OWNER}/${IMAGE_NAME}:${TAG:-latest}"
          IMAGE_REF="${IMAGE_REF,,}"

          echo "This ISO will install: ${IMAGE_REF}"

          {
            echo "variant=${VARIANT}"
            echo "image-ref=${IMAGE_REF}"
            echo "image-name=${IMAGE_NAME,,}"
            echo "iso-basename=${IMAGE_NAME,,}-${TAG}-amd64.iso"
            echo "user-uid=$(id -u)"
            echo "user-gid=$(id -g)"
          } >> "${GITHUB_OUTPUT}"

      # ------------------------------------------------------------------------
      # Point the installer at the image THIS run is wrapping
      # ------------------------------------------------------------------------
      # ⚠️ THIS IS NOT BOILERPLATE. An installer ISO does two separate things,
      # and it is easy to get one right and the other wrong:
      #
      #   1. it carries an image and writes it to the disk
      #   2. it tells the installed machine which image to FOLLOW for updates,
      #      by running `bootc switch` at the end of the install
      #
      # Number 2 lives in the kickstart inside disk_config/iso.toml, and that
      # file has one image name written in it. If we built an NVIDIA ISO and left
      # the file naming the AMD image, the machine would install with the NVIDIA
      # driver and then, on its very first automatic update, quietly replace
      # itself with the AMD image and lose the driver. On a graphics card that is
      # a black screen, days later, for no visible reason.
      #
      # So the name is substituted here, per run, and then read back.
      - name: Point the installer at the right image
        id: config
        env:
          IMAGE_REF: ${{ steps.names.outputs.image-ref }}
          IMAGE_NAME: ${{ steps.names.outputs.image-name }}
        run: |
          set -euo pipefail
          echo "The template (disk_config/iso.toml) says:"
          grep -n 'bootc switch' disk_config/iso.toml

          GENERATED="${RUNNER_TEMP}/iso.toml"

          # Done in python rather than sed purely for readability: the pattern
          # needs to match a container reference and stop at a quote or a space,
          # and writing that through two layers of shell quoting is how typos
          # get in.
          python3 - "${IMAGE_REF}" disk_config/iso.toml "${GENERATED}" <<'PY'
          import re, sys
          ref, src, dst = sys.argv[1], sys.argv[2], sys.argv[3]
          text = open(src).read()
          new, count = re.subn(r'ghcr\.io/[^\s"\']+', ref, text)
          print(f"Replaced {count} image reference(s) with {ref}")
          open(dst, "w").write(new)
          PY

          echo "This run will use:"
          grep -n 'bootc switch' "${GENERATED}"

          if grep -qF "${IMAGE_REF}" "${GENERATED}"; then
            echo "  OK   the installed machine will follow ${IMAGE_REF}"
          else
            echo "::error::Could not put '${IMAGE_REF}' into the installer configuration. The ISO would install one image and then update itself to a different one."
            exit 1
          fi

          # And nothing else must still be named in there.
          grep -oE 'ghcr\.io/[^"[:space:]]+' "${GENERATED}" > "${RUNNER_TEMP}/refs.txt" || true
          sort -u "${RUNNER_TEMP}/refs.txt"
          if grep -vF "${IMAGE_REF}" "${RUNNER_TEMP}/refs.txt" > "${RUNNER_TEMP}/others.txt"; then
            echo "::error::The installer configuration still names another image:"
            cat "${RUNNER_TEMP}/others.txt"
            exit 1
          fi
          echo "  OK   no other image is named in the installer configuration"

          echo "config-file=${GENERATED}" >> "${GITHUB_OUTPUT}"

      - name: Sign in to GitHub's container registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the ISO
        id: build
        uses: osbuild/bootc-image-builder-action@b43efcb44d76d46d55022b66d3dbb89bdf6e5c9a # main
        with:
          builder-image: "quay.io/centos-bootc/bootc-image-builder:latest"
          config-file: ${{ steps.config.outputs.config-file }}
          image: ${{ steps.names.outputs.image-ref }}
          chown: ${{ steps.names.outputs.user-uid }}:${{ steps.names.outputs.user-gid }}
          types: anaconda-iso
          # --rootfs repeats what the image itself already declares in
          # /usr/lib/bootc/install/20-aquarius.toml. Saying it twice costs
          # nothing and means a mistake in one place is not a failed ISO.
          additional-args: --use-librepo=True --rootfs=btrfs

      # A checksum file next to the ISO. Writing a corrupted ISO to a USB stick
      # produces an installer that fails halfway through with a confusing error;
      # checking the number first takes ten seconds.
      - name: Add a checksum next to it
        env:
          OUT: ${{ steps.build.outputs.output-directory }}
        run: |
          set -euxo pipefail
          find "${OUT}" -name '*.iso' -print
          cd "${OUT}"
          for iso in $(find . -name '*.iso'); do
            sha256sum "${iso}" | tee "${iso}-CHECKSUM"
          done
          ls -lhR .

      - name: Upload the ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.names.outputs.iso-basename }}
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      - name: What to do with it
        run: |
          {
            echo "### AquariusOS installer ISO — ${{ steps.names.outputs.variant }}"
            echo ""
            echo "Download it from the **Artifacts** section at the bottom of this run's page."
            echo ""
            echo "It installs \`${{ steps.names.outputs.image-ref }}\`."
            echo ""
            echo "Write it to a USB stick (Fedora Media Writer, balenaEtcher or \`dd\`), boot the"
            echo "computer from that stick, and follow the installer."
            echo ""
            echo "⚠️ Installing **erases the disk you point it at**. If the machine already runs"
            echo "AquariusOS you do not need this — use \`sudo bootc switch\` instead, which is"
            echo "reversible. See \`docs/restart/bench-rebase.md\`."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: If this failed, here is what to check
        if: failure()
        run: |
          {
            echo "### The ISO build failed"
            echo ""
            echo "The usual causes, in order of likelihood:"
            echo ""
            echo "1. **The image is not published yet.** This workflow wraps an image that already"
            echo "   exists at \`${{ steps.names.outputs.image-ref }}\`. Check that"
            echo "   \"Build AquariusOS\" has finished green at least once."
            echo "2. **The package is private.** A newly published package on GitHub is private"
            echo "   until somebody makes it public — one click, once, on the package's page."
            echo "3. **Out of disk.** An ISO is several gigabytes and the build machine is not"
            echo "   large. The log will say 'no space left on device'."
          } >> "${GITHUB_STEP_SUMMARY}"
