---
# ==============================================================================
# Build AquariusOS ISO (Titanoboa)
# ==============================================================================
# Plain English: this workflow makes the .iso file you burn onto a USB stick to
# install AquariusOS on a blank computer. You start it by hand from the Actions
# tab; it never runs on its own.
#
# Why this exists as a separate workflow:
#   The older "Build AquariusOS disk images" workflow used a tool called
#   bootc-image-builder to make ISOs. That tool currently cannot make ISOs from
#   Bazzite-based images — a known upstream bug:
#   https://github.com/osbuild/bootc-image-builder/issues/1188
#   Bazzite itself does not use that tool for ISOs either. It uses Titanoboa
#   (https://github.com/ublue-os/titanoboa), which turns a container image into
#   a "live" ISO. We do the same thing here.
#
# ⚠️ KNOWN LIMITATION — read before you run this ⚠️
#   Titanoboa requires the container image to carry a small config file at
#   /usr/lib/bootc-image-builder/iso.yaml (this is the "container-native ISO
#   contract"). Bazzite does NOT put that file in ghcr.io/ublue-os/bazzite:stable
#   — it adds it in a separate "installer payload" layer it builds just before
#   making its ISOs (see ublue-os/bazzite → installer/). Because AquariusOS is
#   built FROM bazzite:stable, our published image does not have that file yet
#   either, so this workflow is expected to stop with:
#       ERROR: Missing /usr/lib/bootc-image-builder/iso.yaml file
#   Fixing it means adding an AquariusOS live-installer layer that mirrors
#   Bazzite's installer/ directory (iso.yaml + dracut-live + livesys-scripts +
#   the payload image). That is tracked as follow-up work, not done here.
#   Everything below is already correct and will work once the image satisfies
#   the contract — or right now, if you point `image-ref` at an image that does.
# ==============================================================================

name: Build AquariusOS ISO (Titanoboa)

on:
  workflow_dispatch:
    inputs:
      image-ref:
        description: "Container image to turn into an ISO"
        required: false
        default: "ghcr.io/stoneharborent/aquarius-os:latest"
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build live installer ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      # GitHub's free runners only have about 14 GB of free disk on the main
      # drive. An OS image plus the ISO we squeeze out of it is far bigger than
      # that, so we clear out preinstalled junk first. Same step, same pinned
      # version, as build-disk.yml uses.
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      # Even after clearing junk, the main drive is too small. The runner has a
      # much larger scratch disk mounted at /mnt, so we make a big filesystem
      # there and point the container storage at it. This is exactly what
      # Bazzite's own ISO workflow does.
      - name: Mount container storage on a large loopback disk
        run: |
          set -euxo pipefail
          sudo truncate -s 110G /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service || true
          LOOP=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$LOOP" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
          sudo systemctl start podman.service || true

      # Titanoboa runs podman as root, so the image has to be logged in and
      # pulled as root too — a normal `podman pull` would land in the wrong
      # place and Titanoboa would not find it.
      - name: Log in to the GitHub container registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${REGISTRY_TOKEN}" \
            | sudo podman login ghcr.io -u "${REGISTRY_USER}" --password-stdin

      - name: Work out the image and ISO file names
        id: names
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          set -euo pipefail
          # Lowercase it — registries reject capital letters in image names.
          IMAGE_REF="${IMAGE_REF,,}"
          # Turn "ghcr.io/owner/aquarius-os:latest" into "aquarius-os-latest".
          NAME_PART="${IMAGE_REF##*/}"
          ISO_BASENAME="${NAME_PART/:/-}-live-amd64.iso"
          echo "image-ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "iso-basename=${ISO_BASENAME}" >> "$GITHUB_OUTPUT"
          echo "iso-dest=${GITHUB_WORKSPACE}/output/${ISO_BASENAME}" >> "$GITHUB_OUTPUT"

      - name: Pull the AquariusOS image
        env:
          IMAGE_REF: ${{ steps.names.outputs.image-ref }}
        run: |
          set -euxo pipefail
          sudo env TMPDIR=/mnt/podman-storage/tmp podman pull "${IMAGE_REF}"

      - name: Show disk space
        if: always()
        run: sudo df -h

      # The actual ISO build. Pinned to a specific commit of the Titanoboa
      # action (like every other action in this repo) so a change upstream can
      # never silently change what we build.
      - name: Build the ISO
        id: build
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4 # main @ 2026-05-19
        with:
          image-ref: ${{ steps.names.outputs.image-ref }}
          iso-dest: ${{ steps.names.outputs.iso-dest }}

      # Collect the ISO and a checksum in one folder inside the workspace, so
      # the upload step has a single predictable place to grab from.
      - name: Collect the ISO and add a checksum file
        id: package
        env:
          ISO_PATH: ${{ steps.build.outputs.iso-dest }}
        run: |
          set -euxo pipefail
          UPLOAD_DIR="${GITHUB_WORKSPACE}/upload"
          ISO_NAME="$(basename "${ISO_PATH}")"
          mkdir -p "${UPLOAD_DIR}"
          mv "${ISO_PATH}" "${UPLOAD_DIR}/"
          cd "${UPLOAD_DIR}"
          sha256sum "${ISO_NAME}" | tee "${ISO_NAME}-CHECKSUM"
          echo "upload-dir=${UPLOAD_DIR}" >> "$GITHUB_OUTPUT"

      - name: Upload the ISO to Job Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.names.outputs.iso-basename }}
          path: ${{ steps.package.outputs.upload-dir }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      # If the run went red, print the most likely reason in plain English
      # instead of leaving a wall of shell output as the last word.
      - name: What probably went wrong
        if: failure()
        run: |
          cat <<'EOF'
          ------------------------------------------------------------------
          This ISO build failed. The most likely cause:

            "ERROR: Missing /usr/lib/bootc-image-builder/iso.yaml file"

          Titanoboa needs that small config file inside the AquariusOS image.
          Bazzite does not include it in bazzite:stable — it adds it in a
          separate installer layer just before building its own ISOs. Since
          AquariusOS is built FROM bazzite:stable, our image does not have it
          yet.

          The fix is to add an AquariusOS live-installer layer modelled on
          ublue-os/bazzite -> installer/ (iso.yaml, dracut-live, livesys-scripts
          and the payload image), then build the ISO from that layer instead.

          Scroll up to the "Build the ISO" step to confirm the real error.
          ------------------------------------------------------------------
          EOF
