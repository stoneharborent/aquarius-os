---
# Tests for the scripts that start our own apps (system_files/usr/bin/aquarius-*
# and the two files in system_files/usr/libexec/ that they share).
#
# WHY THIS IS ITS OWN WORKFLOW
# Building the OS image takes the best part of an hour. These are shell scripts,
# and the questions worth asking about them — does the version comparison give
# the right answers, does a broken download still let the app start — can be
# answered on a plain Ubuntu runner in about ten seconds. So they are, on every
# pull request, long before the image build finishes.
#
# It does NOT replace the checks in the image build. The same two test suites are
# run again inside the finished image (build_files/creator-apps.sh) against the
# copy of the library that is really installed there, because "the file in the
# repo is correct" and "the file in the shipped OS is correct" are two different
# statements and only the second one matters to a user.
name: App launcher tests

on:
  pull_request:
    paths:
      - 'system_files/usr/bin/aquarius-editor'
      - 'system_files/usr/bin/aquarius-writer'
      - 'system_files/usr/libexec/aquarius-app-launch'
      - 'system_files/usr/libexec/aquarius-app-overlay'
      - 'tests/**'
      # This is where the VERSION file the launcher reads gets written.
      - 'build_files/creator-apps.sh'
      - '.github/workflows/launcher-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'system_files/usr/bin/aquarius-editor'
      - 'system_files/usr/bin/aquarius-writer'
      - 'system_files/usr/libexec/aquarius-app-launch'
      - 'system_files/usr/libexec/aquarius-app-overlay'
      - 'tests/**'
      - 'build_files/creator-apps.sh'
      - '.github/workflows/launcher-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Version comparison + which-copy-starts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          bash --version | head -1
          shellcheck --version | grep version:

      # ----------------------------------------------------------------------
      # Static checks first: shellcheck reads the scripts without running them.
      # ----------------------------------------------------------------------
      # These files have no .sh on the end (they are commands, not scripts you
      # source), so `just lint` — which looks for *.sh — does not see them. They
      # are listed here by name instead.
      #
      #   -x            follow the files these scripts read in, so a mistake in
      #                 the shared library is reported against every user of it
      #   -P SCRIPTDIR  work out those paths relative to the script being checked,
      #                 which is what the "# shellcheck source=" lines in them
      #                 are written against
      - name: Shellcheck the launcher scripts
        run: |
          shellcheck -x -P SCRIPTDIR \
            system_files/usr/bin/aquarius-editor \
            system_files/usr/bin/aquarius-writer \
            system_files/usr/libexec/aquarius-app-launch \
            system_files/usr/libexec/aquarius-app-overlay \
            build_files/creator-apps.sh \
            tests/test-aquarius-semver.sh \
            tests/test-aquarius-overlay.sh

      # ----------------------------------------------------------------------
      # Then the behaviour, against the copies in this repo.
      # ----------------------------------------------------------------------
      - name: Version comparison
        run: ./tests/test-aquarius-semver.sh

      - name: Which copy of the app starts
        run: ./tests/test-aquarius-overlay.sh

      # ----------------------------------------------------------------------
      # And one thing that is not about the scripts at all.
      # ----------------------------------------------------------------------
      # The launcher can only compare a downloaded update against the built-in
      # app if the build writes down which version it baked. That happens in
      # build_files/creator-apps.sh, driven by the release tags in the table at
      # the top of it — so those tags have to be readable as version numbers.
      # Catching a malformed tag here takes a second; catching it in the image
      # build costs most of an hour.
      - name: The release tags are version numbers
        run: |
          set -euo pipefail
          bad=0
          # Pull the "<folder> <repo> <tag>" lines out of the AQUARIUS_APPS list.
          while read -r name repo tag; do
            [ -n "${tag:-}" ] || continue
            if printf '%s' "${tag#v}" \
               | grep -qE '^[0-9]{1,9}\.[0-9]{1,9}\.[0-9]{1,9}(-[0-9A-Za-z.-]+)?$'; then
              echo "  OK   ${name} (${repo}) tag ${tag} -> version ${tag#v}"
            else
              echo "  FAIL ${name} (${repo}) tag '${tag}' is not a version number."
              echo "       It has to read like v0.3.0, because the number in it is"
              echo "       written into /usr/lib/aquarius/${name}/VERSION and the"
              echo "       launcher compares downloaded updates against it."
              bad=1
            fi
          done < <(sed -n '/^AQUARIUS_APPS=(/,/^)/p' build_files/creator-apps.sh \
                     | grep -oE '"[a-z0-9-]+ [^"]+ [^" ]+"' | tr -d '"')

          if [ "$bad" -ne 0 ]; then
            echo "::error::A release tag in build_files/creator-apps.sh is not a version number."
            exit 1
          fi
