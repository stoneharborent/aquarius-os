---
# ==============================================================================
# TEMPORARY — verify the installer ISO builds after the Terra fix
# ==============================================================================
# ⚠️ THROWAWAY. This workflow exists only to prove, on branch
# restart/iso-terra-fix, that an installer ISO can be built now that the Terra
# repository is removed from the image (osbuild/bootc-image-builder#1188). It
# builds the NVIDIA image and then an ISO FROM THAT LOCAL IMAGE — it publishes
# nothing to the registry, touches no tag any machine follows, and signs nothing.
#
# It is deleted before this branch is merged. Do not build on top of it.
#
# Why it exists at all: the real ISO workflow (build-iso.yml) wraps an image
# ALREADY PUBLISHED on ghcr.io, and side branches never publish — so the only
# way to prove the fix on a side branch is to build the fixed image and the ISO
# together in one run, from local container storage, exactly the way the
# repository's own `just build-iso` recipe does.
# ==============================================================================

name: zz TEMP verify ISO (Terra fix)

on:
  workflow_dispatch:
  push:
    branches:
      - restart/iso-terra-fix
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-iso:
    name: Build the NVIDIA image and an ISO from it (local, no publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Make room on the build machine
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Build the NVIDIA image (local only)
        run: |
          set -euo pipefail
          IMAGE_NAME="$(just variant-image-name nvidia)"
          DEFAULT_TAG="$(just generate-default-tag)"
          echo "IMAGE_NAME=${IMAGE_NAME}"  >> "${GITHUB_ENV}"
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> "${GITHUB_ENV}"
          just build "${IMAGE_NAME}" "${DEFAULT_TAG}" "1"

      - name: Build an installer ISO from that local image
        # This is the acceptance test. Before the Terra fix this step died in
        # depsolve with "Curl error (37): Could not read a file:// file for
        # file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terra44". It must now go green.
        run: |
          set -euo pipefail
          just build-iso "localhost/${IMAGE_NAME}" "${DEFAULT_TAG}"

      - name: Report the ISO and add a checksum
        id: iso
        run: |
          set -euo pipefail
          echo "Everything the build produced:"
          find output -type f -printf '  %p  (%s bytes)\n' | sort
          iso="$(find output -name '*.iso' | head -1)"
          if [ -z "${iso}" ]; then
            echo "::error::No .iso was produced — the ISO build did not succeed."
            exit 1
          fi
          size="$(du -h "${iso}" | cut -f1)"
          sha256sum "${iso}" | tee "${iso}-CHECKSUM"
          {
            echo "### Installer ISO built successfully"
            echo ""
            echo "- File: \`$(basename "${iso}")\`"
            echo "- Size: **${size}**"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "iso-name=$(basename "${iso}")" >> "${GITHUB_OUTPUT}"

      - name: Upload the ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.iso.outputs.iso-name }}
          path: output
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          overwrite: true
