---
# Builds a .qcow2 virtual-machine disk of AquariusOS from the already-published
# container image. Run it by hand from the Actions tab.
#
# Note: this workflow used to build the installer .iso too. It no longer does —
# see the matrix comment below. ISOs now come from the separate
# "Build AquariusOS ISO (Titanoboa)" workflow (.github/workflows/build-iso.yml).
name: Build AquariusOS disk images

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
  pull_request:
    branches:
      - main
    paths:
      - './disk_config/disk.toml'
      - './disk_config/iso.toml'
      - './.github/workflows/build-disk.yml'

env:
  # Must match IMAGE_NAME in aquarius-os.env (which is what build.yml publishes).
  IMAGE_NAME: "aquarius-os"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

# Plain English: "concurrency" decides what happens when this workflow starts
# again while an earlier run is still going. Runs sharing the same "group" name
# are one queue, and cancel-in-progress means the newer run kicks the older one
# out of that queue.
#
# The platform is part of the group name ON PURPOSE — same reason the ISO
# workflow puts its variant in (see .github/workflows/build-iso.yml). Without
# it, amd64 and arm64 shared one queue, so starting the arm64 disk would cancel
# an amd64 disk that was still building. Now they have a queue each and can
# build at the same time, while re-running the SAME platform still cancels the
# older run of it.
#
# The "|| 'pr'" is a safety net: inputs.platform only exists when you press
# "Run workflow" by hand, so pull-request runs land in their own clearly-named
# queue rather than one ending in nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.platform || 'pr' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    runs-on: ${{ inputs.platform == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        # "anaconda-iso" was removed on purpose. bootc-image-builder cannot
        # currently build ISOs from Bazzite-based images — a known upstream bug
        # (https://github.com/osbuild/bootc-image-builder/issues/1188: it fails
        # while resolving packages because it can't read the terra repo's GPG
        # keys). Only qcow2 works, so only qcow2 is built here. Installer ISOs
        # come from the "Build AquariusOS ISO (Titanoboa)" workflow instead.
        # To try ISOs here again once the bug is fixed, add "anaconda-iso" back
        # to this list — the config-file line further down already knows how to
        # pick disk_config/iso.toml for it.
        disk-type: ["qcow2"]
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && './disk_config/iso.toml' || './disk_config/disk.toml' }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          # Our Bazzite base declares no default rootfs type, so bootc-image-builder needs it explicitly.
          rootfs: btrfs
          additional-args: --use-librepo=True

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
      
      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}
