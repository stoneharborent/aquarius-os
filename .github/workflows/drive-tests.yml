---
# Tests for the two scripts behind "drives mount themselves" and "drives show up
# on the desktop":
#   system_files/usr/libexec/aquarius-internal-automount
#   system_files/usr/libexec/aquarius-desktop-volumes
#
# WHY THIS IS ITS OWN WORKFLOW
# Same reasoning as the App launcher tests next door. Building the OS image takes
# the best part of an hour; these two scripts are answering questions — "is this
# partition safe to mount?", "is this file one of ours or one of the user's?" —
# that can be answered on a plain Ubuntu runner in a couple of seconds. So they
# are, on every pull request.
#
# The desktop-icons tests especially earn their keep: that script DELETES files
# out of somebody's Desktop folder, and the tests are what prove it only ever
# deletes its own.
name: Drive and desktop-icon tests

on:
  pull_request:
    paths:
      - 'system_files/usr/libexec/aquarius-internal-automount'
      - 'system_files/usr/libexec/aquarius-desktop-volumes'
      - 'system_files/usr/lib/systemd/system/aquarius-internal-automount.service'
      - 'system_files/usr/lib/systemd/user/aquarius-desktop-volumes.service'
      - 'tests/test-aquarius-automount.py'
      - 'tests/test-aquarius-desktop-volumes.py'
      # This is where the two services get switched on.
      - 'build_files/build.sh'
      - '.github/workflows/drive-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'system_files/usr/libexec/aquarius-internal-automount'
      - 'system_files/usr/libexec/aquarius-desktop-volumes'
      - 'system_files/usr/lib/systemd/system/aquarius-internal-automount.service'
      - 'system_files/usr/lib/systemd/user/aquarius-desktop-volumes.service'
      - 'tests/test-aquarius-automount.py'
      - 'tests/test-aquarius-desktop-volumes.py'
      - 'build_files/build.sh'
      - '.github/workflows/drive-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Which drives mount, and which icons appear
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Show tool versions
        run: python3 --version

      # ----------------------------------------------------------------------
      # A read of the scripts before anything is run. If either has a typo in
      # it, this fails in a second rather than at boot on somebody's machine.
      # ----------------------------------------------------------------------
      - name: The scripts are valid Python
        run: |
          python3 -m py_compile \
            system_files/usr/libexec/aquarius-internal-automount \
            system_files/usr/libexec/aquarius-desktop-volumes

      - name: Which drives are safe to mount by themselves
        run: ./tests/test-aquarius-automount.py

      - name: Which drives get a desktop icon, and whose files are never touched
        run: ./tests/test-aquarius-desktop-volumes.py

      # ----------------------------------------------------------------------
      # And one thing that is not about the scripts at all.
      # ----------------------------------------------------------------------
      # Both services are useless unless the build actually switches them on,
      # and the user one in particular has to be enabled with `--global` or it
      # reaches nobody but brand-new accounts. Neither of those is something the
      # tests above can see, so they are checked here by reading build.sh.
      - name: The build really does switch both services on
        run: |
          set -euo pipefail
          fail=0

          if ! grep -q '^systemctl enable aquarius-internal-automount\.service$' \
                 build_files/build.sh; then
            echo "::error::build.sh no longer enables aquarius-internal-automount.service,"
            echo "         so no internal drive would mount itself at boot."
            fail=1
          fi

          if ! grep -q '^systemctl --global enable aquarius-desktop-volumes\.service$' \
                 build_files/build.sh; then
            echo "::error::build.sh no longer enables aquarius-desktop-volumes.service"
            echo "         with --global. Without that word it is switched on for"
            echo "         nobody, and drive icons would never appear."
            fail=1
          fi

          exit "$fail"

      # ----------------------------------------------------------------------
      # THE GAME MODE GATE  (added 2026-08-30, after a real regression)
      # ----------------------------------------------------------------------
      # On 2026-08-30 these two services, both brand new, between them stopped
      # the handheld image doing the one thing it exists to do: start into
      # Steam's Game Mode. Two separate mistakes, both invisible on a desktop PC
      # and both fatal on a handheld with no keyboard:
      #
      #   1. The desktop program swallowed Bazzite's "Return to Gaming Mode"
      #      icon, which is the only on-screen way back from the desktop.
      #   2. The boot-time mounter stood in the login path
      #      (Before=display-manager.service), the same starting gate as the
      #      service that decides which session the machine starts in.
      #
      # The tests above cover the first one properly. These four checks cover
      # the parts that live in files a Python test cannot see. The whole story
      # is in docs/game-mode-regression.md.
      # ----------------------------------------------------------------------
      - name: Nothing we ship can take the handheld out of Game Mode
        run: |
          set -euo pipefail
          fail=0

          unit_user=system_files/usr/lib/systemd/user/aquarius-desktop-volumes.service
          unit_system=system_files/usr/lib/systemd/system/aquarius-internal-automount.service

          # 1. The desktop service must ask "am I on a desktop?" before starting.
          if ! grep -q '^ExecCondition=/usr/libexec/aquarius-desktop-volumes --check-session$' \
                 "$unit_user"; then
            echo "::error::${unit_user} has lost its ExecCondition= line. Without it"
            echo "         the desktop drive-icon service runs inside Steam's Game"
            echo "         Mode on the handheld image, where it has no business."
            fail=1
          fi

          # 2. The boot-time mounter must stay out of the login path.
          if grep -q '^Before=display-manager\.service' "$unit_system"; then
            echo "::error::${unit_system} is ordered before the login screen again."
            echo "         That puts our drive scan in the same starting gate as"
            echo "         bazzite-autologin.service, which decides whether a"
            echo "         handheld starts in Game Mode. Take the line out."
            fail=1
          fi

          # 3. The list of shortcuts we refuse to move must still name the one
          #    that matters. Bazzite calls it Return.desktop.
          if ! grep -q '"return\.desktop"' \
                 system_files/usr/libexec/aquarius-desktop-volumes; then
            echo "::error::aquarius-desktop-volumes no longer protects Return.desktop,"
            echo "         which is the handheld's only on-screen way back to Game"
            echo "         Mode. See PROTECTED_LAUNCHER_FILENAMES in that file."
            fail=1
          fi

          # 4. We are allowed to have opinions about how the login screen LOOKS.
          #    We are never allowed to have an opinion about WHO it logs in or
          #    WHICH session it starts — that is Bazzite's autologin, rewritten
          #    on every boot, and it is what puts a handheld into Game Mode.
          #    So: an SDDM file of ours may not carry an [Autologin] section, a
          #    Session= key or a User= key.
          while IFS= read -r sddm_file; do
            [ -f "$sddm_file" ] || continue
            if grep -Eqi '^\[Autologin\]|^[[:space:]]*(Session|User)[[:space:]]*=' \
                 "$sddm_file"; then
              echo "::error::${sddm_file} tries to set the login screen's session or"
              echo "         user. AquariusOS must never do that — Bazzite's"
              echo "         bazzite-autologin owns it, and it is what starts a"
              echo "         handheld in Game Mode. Keep our SDDM files to looks."
              fail=1
            fi
          done < <(find system_files -path '*sddm*' -type f)

          exit "$fail"
