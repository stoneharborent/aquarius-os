---
# Tests for the aq-ingest "Editor-Ready Ingest" helper (os-image/ingest/).
#
# This is completely separate from the image-build workflows: it does not build a
# container, it just installs ffmpeg + libheif on a plain Ubuntu runner and runs the
# Python test suite. Every fixture is synthesized with ffmpeg, so no media is committed.
#
# NOTE (restart, 2026-09-03): the old tests/test_desktop.py went with the Bazzite
# line. It worked by looking for particular lines of text inside build_files/build.sh
# and inside the KDE right-click menu file, and neither of those exists any more.
# What it was trying to prove — that the ingest tool and its right-click menu really
# end up installed and working — is now proved directly against the finished image
# in .github/workflows/build.yml, which is a stronger check than reading a
# build script. The old file is still on `main` if you want to see it.
name: aq-ingest tests

on:
  pull_request:
    paths:
      - 'ingest/**'
      - 'system_files/usr/share/nautilus-python/**'
      - '.github/workflows/ingest-tests.yml'
  push:
    branches:
      # The real line after the 4 September 2026 branch rename, and before it.
      - main
      - restart/fedora-bootc
      # Phase R3b promotes the ingest helper (aq ingest, the watch folder), so
      # its branch has to run these tests too — the 95 fixtures are the only
      # thing standing between a rules-engine change and a silently wrong
      # conversion of somebody's footage.
      - restart/r3-apps
      # The 2026-09-04 bench bug: the "Make Editor-Ready" right-click menu was
      # missing in Files because the extension refused to load. Its test lives
      # in ingest/tests/, so this branch runs these tests too.
      - restart/nautilus-fix
    paths:
      - 'ingest/**'
      - 'system_files/usr/share/nautilus-python/**'
      - '.github/workflows/ingest-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Decision table + fixture matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg and libheif tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libheif-examples

      - name: Show tool versions
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1
          heif-enc --version || true
          heif-convert --version || true
          python3 --version

      - name: Check the tool starts and prints its help
        working-directory: ingest
        run: |
          ./aq-ingest --version
          ./aq-ingest --help > /dev/null

      - name: Run the test suite
        working-directory: ingest
        run: python3 -m unittest discover -s tests -t . -v

      # ----------------------------------------------------------------------
      # The Files right-click menu, loaded for real.
      #
      # This runner is Ubuntu and the OS is Fedora, so this is not the same
      # machine the menu ships on — the check that counts runs INSIDE the
      # finished image, in build.yml. What this one adds is the other half
      # of the fix: Ubuntu's Files offers extension interface 4.0 and Fedora 44's
      # offers 4.1, and after the 2026-09-04 bug the extension has to work on
      # both instead of demanding one of them. This is the 4.0 half.
      #
      # It runs with /usr/bin/python3 on purpose. The Python installed above by
      # setup-python has none of GNOME's libraries, so the test would skip
      # itself there and prove nothing. AQ_NAUTILUS_REQUIRED=1 makes a skip an
      # error, so this can never go quiet.
      # ----------------------------------------------------------------------
      - name: Install GNOME's Files libraries for the right-click menu test
        run: |
          sudo apt-get install -y python3-gi gir1.2-nautilus-4.0
          /usr/bin/python3 -c "import gi; gi.require_version('Nautilus', '4.0'); \
            from gi.repository import Nautilus; print('Nautilus 4.0 interface is loadable')"

      - name: Check the "Make Editor-Ready" menu loads and offers itself for a video
        env:
          AQ_NAUTILUS_REQUIRED: '1'
        run: /usr/bin/python3 ingest/tests/test_nautilus_extension.py

      - name: Fail if the HEIC tests were skipped
        working-directory: ingest
        run: |
          # heif-enc and heif-convert are installed above, so on CI these must actually
          # run. A skip here means the packages moved and the coverage silently vanished.
          for tool in heif-enc heif-convert; do
            if ! command -v "$tool" > /dev/null; then
              echo "$tool is missing on the runner — the HEIC tests would be skipped."
              exit 1
            fi
          done
