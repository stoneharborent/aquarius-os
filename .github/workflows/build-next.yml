---
# ==============================================================================
# Build AquariusOS (the Fedora bootc line)
# ==============================================================================
# This is what turns the recipe into an operating system. It runs on GitHub's
# computers, so nobody needs a Linux machine to build AquariusOS.
#
# For each of the two images it:
#   1. builds it from the Containerfile
#   2. INSPECTS THE FINISHED IMAGE and refuses to publish it if it is wrong
#   3. pushes it to GitHub's container registry
#   4. signs it, so a machine can prove an update really came from us
#
# ⚠️ THIS WORKFLOW ONLY EXISTS ON THE `restart/fedora-bootc` BRANCH, and it only
# builds from that branch. The Bazzite line has its own workflow on `main` and
# the two never touch. Nothing here is ever merged into `main`.
#
# ⚠️ STEP 2 IS THE POINT. It would be easy to build an image, see no red text,
# and publish something that boots to a black screen. Every check in the verify
# job reads the ACTUAL CONTENTS of the finished image — the text in
# /etc/os-release, the value gsettings reports, the answer rpm gives, the
# checksum of a picture. Never a file's timestamp: the tooling that packages a
# bootable image flattens every clock, so a timestamp check passes forever,
# including when the step it was checking did nothing. We learned that on
# 2026-08-31 and it is now a rule.
# ==============================================================================

name: Build AquariusOS (next)

on:
  push:
    branches:
      # The real line. Pushes here build, check, publish and sign.
      - restart/fedora-bootc
      # A side branch, so that work in progress gets the same build and the
      # same checks before it is merged. It BUILDS AND CHECKS ONLY — every
      # publishing step below carries an `if:` that limits it to the branch
      # above, so a side branch cannot overwrite the images real machines
      # update from. See the PUBLISHING heading in the job.
      - restart/aquarius-keys
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and publish (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            nvidia: 0
          - variant: nvidia
            nvidia: 1
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # GitHub's runners come with a lot of software we do not need, and the
      # image being built is several gigabytes. Without this the build runs out
      # of disk half way through, which produces a confusing error a long way
      # from the real cause.
      - name: Make room on the build machine
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check the Justfile is valid
        run: just check

      - name: Work out what this image is called
        run: |
          set -euo pipefail
          IMAGE_NAME="$(just variant-image-name ${{ matrix.variant }})"
          NVIDIA="$(just variant-nvidia ${{ matrix.variant }})"
          DEFAULT_TAG="$(just generate-default-tag)"

          # Sanity check: the Justfile and the workflow matrix have to agree
          # about whether this variant wants the NVIDIA driver. If they ever
          # drift, one of the two images gets built as the other and is
          # published under the wrong name.
          if [ "${NVIDIA}" != "${{ matrix.nvidia }}" ]; then
            echo "::error::The Justfile says variant '${{ matrix.variant }}' has NVIDIA=${NVIDIA}, but this workflow says ${{ matrix.nvidia }}. They must agree."
            exit 1
          fi

          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"
          echo "NVIDIA=${NVIDIA}" >> "${GITHUB_ENV}"
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> "${GITHUB_ENV}"
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"

      - name: Build the image
        id: build-image
        run: |
          just build "${IMAGE_NAME}" "${DEFAULT_TAG}" "${NVIDIA}"

      - name: How big is it
        run: |
          podman images --format '{{.Repository}}:{{.Tag}}  {{.Size}}'

      # ------------------------------------------------------------------------
      # THE VERIFICATION
      # ------------------------------------------------------------------------
      # Everything below runs INSIDE the finished image, reading it the way a
      # booted machine would. `podman run --pull=never` guarantees it is looking
      # at the thing that was just built and not at something downloaded.
      - name: Check it says AquariusOS
        run: |
          set -euo pipefail
          cat > /tmp/verify-identity.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }
          check() {   # check "<description>" "<pattern>" "<file>"
            if grep -Eq "$2" "$3"; then ok "$1"; else bad "$1 — /$2/ not found in $3"; fi
          }

          echo "== /usr/lib/os-release =="
          cat /usr/lib/os-release
          echo "== /etc/os-release =="
          ls -l /etc/os-release

          echo "== checks =="
          check "NAME is AquariusOS"            '^NAME="AquariusOS"$'            /etc/os-release
          check "PRETTY_NAME is AquariusOS"     '^PRETTY_NAME="AquariusOS"$'     /etc/os-release
          check "/usr/lib/os-release agrees"    '^NAME="AquariusOS"$'            /usr/lib/os-release
          check "LOGO is ours"                  '^LOGO=aquarius-logo$'           /etc/os-release
          check "DEFAULT_HOSTNAME is aquarius"  '^DEFAULT_HOSTNAME="aquarius"$'  /etc/os-release
          check "VARIANT_ID is aquarius-os"     '^VARIANT_ID=aquarius-os$'       /etc/os-release
          check "VARIANT names an edition"      '^VARIANT="(NVIDIA|Desktop) Edition"$' /etc/os-release
          check "HOME_URL is our repository"    '^HOME_URL="https://github\.com/' /etc/os-release
          check "ID stays fedora (deliberate)"  '^ID=fedora$'                    /etc/os-release

          if grep -q 'Fedora Linux' /etc/os-release; then
            bad "os-release still says 'Fedora Linux' somewhere"
            grep -n 'Fedora Linux' /etc/os-release
          else
            ok "nothing in os-release still says 'Fedora Linux'"
          fi

          # The edition has to match the image being built, or we would publish
          # the AMD image under the NVIDIA name.
          if [ "${EXPECTED_NVIDIA}" = "1" ]; then
            check "this is the NVIDIA edition" '^VARIANT="NVIDIA Edition"$' /etc/os-release
          else
            check "this is the Desktop edition" '^VARIANT="Desktop Edition"$' /etc/os-release
          fi

          INFO=/usr/share/aquarius/image-info.json
          echo "== ${INFO} =="
          cat "${INFO}" || echo "(missing!)"
          if [ ! -f "${INFO}" ]; then
            bad "${INFO} does not exist"
          else
            got_name="$(sed -n 's/.*"image-name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "${INFO}" | head -1)"
            if [ "${got_name}" = "${EXPECTED_IMAGE_NAME}" ]; then
              ok "image-info.json says image-name is '${got_name}'"
            else
              bad "image-info.json says '${got_name}', expected '${EXPECTED_IMAGE_NAME}'"
            fi
          fi

          if [ -s /usr/share/icons/hicolor/scalable/apps/aquarius-logo.svg ]; then
            ok "the AquariusOS icon is installed"
          else
            bad "aquarius-logo.svg is missing — os-release names it and it is not there"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::This image does not identify as AquariusOS."
            exit 1
          fi
          echo "All identity checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            -e EXPECTED_IMAGE_NAME="${IMAGE_NAME}" \
            -e EXPECTED_NVIDIA="${NVIDIA}" \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-identity.sh

      - name: Check the software is really in there
        run: |
          set -euo pipefail
          cat > /tmp/verify-packages.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          echo "== the things this operating system cannot do without =="
          for pkg in \
            ffmpeg fdk-aac mesa-va-drivers-freeworld libheif-freeworld \
            gstreamer1-plugins-bad-freeworld gstreamer1-plugins-ugly \
            pipewire wireplumber NetworkManager NetworkManager-wifi bluez \
            tuned-ppd fwupd linux-firmware plymouth btrfs-progs exfatprogs ntfs-3g \
            gdm gnome-shell mutter gnome-control-center nautilus nautilus-python \
            ptyxis firefox gnome-software \
            gnome-shell-extension-dash-to-dock gnome-shell-extension-appindicator \
            gnome-shell-extension-caffeine gnome-shell-extension-gsconnect \
            xdg-desktop-portal-gnome xorg-x11-server-Xwayland flatpak \
            podman toolbox distrobox \
            rsms-inter-fonts jetbrains-mono-fonts
          do
            if rpm -q "${pkg}" > /dev/null 2>&1; then
              ok "${pkg} $(rpm -q --queryformat '%{VERSION}-%{RELEASE}' "${pkg}")"
            else
              bad "${pkg} is NOT installed"
            fi
          done

          echo "== ffmpeg can actually encode the patented formats =="
          ffmpeg -hide_banner -encoders > /tmp/enc.txt 2>&1 || true
          for enc in libx264 libx265 libfdk_aac; do
            if grep -qw "${enc}" /tmp/enc.txt; then ok "ffmpeg has ${enc}"
            else bad "ffmpeg has no ${enc} — this is Fedora's stripped build, not RPM Fusion's"; fi
          done

          echo "== the login screen and the boot target =="
          if [ "$(systemctl get-default)" = "graphical.target" ]; then
            ok "the machine boots to a desktop"
          else
            bad "default target is $(systemctl get-default) — this would boot to a text prompt"
          fi
          if systemctl is-enabled gdm.service > /dev/null 2>&1; then
            ok "GDM is switched on"
          else
            bad "GDM is not switched on — nothing would draw a login screen"
          fi
          if [ -r /usr/share/wayland-sessions/gnome.desktop ]; then
            ok "there is a GNOME session for GDM to offer"
          else
            bad "no /usr/share/wayland-sessions/gnome.desktop — the login screen would have nothing to log into"
          fi

          echo "== Flathub is configured in the image, not in /var =="
          if [ -s /usr/share/flatpak/remotes.d/flathub.flatpakrepo ]; then
            ok "Flathub is preconfigured"
            grep -E '^(Url|Title)=' /usr/share/flatpak/remotes.d/flathub.flatpakrepo | sed 's/^/       /'
          else
            bad "Flathub is not preconfigured — the app store would be empty"
          fi

          echo "== the ingest helper =="
          if /usr/bin/aq-ingest --version; then ok "aq-ingest runs"; else bad "aq-ingest does not run"; fi
          if [ -r /usr/share/nautilus-python/extensions/aquarius_editor_ready.py ]; then
            ok "the 'Make Editor-Ready' right-click menu is installed"
          else
            bad "the 'Make Editor-Ready' right-click menu is missing"
          fi

          echo "== a fresh install knows which filesystem to use =="
          cat /usr/lib/bootc/install/20-aquarius.toml || echo "(missing!)"
          if grep -q '^type = "btrfs"$' /usr/lib/bootc/install/20-aquarius.toml 2>/dev/null; then
            ok "the image tells an installer to use btrfs"
          else
            bad "no root filesystem type in the image — no installer ISO can be built from it"
          fi

          echo "== exactly one kernel =="
          ls -1 /usr/lib/modules/
          n="$(find /usr/lib/modules -mindepth 1 -maxdepth 1 -type d | wc -l)"
          if [ "$n" -eq 1 ]; then ok "one kernel: $(ls -1 /usr/lib/modules/)"
          else bad "$n kernels in the image — a bootable image must have exactly one"; fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::This image is missing software it cannot work without."
            exit 1
          fi
          echo "All package checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-packages.sh

      - name: Check the desktop comes up as Ice-light AquariusOS
        run: |
          set -euo pipefail
          cat > /tmp/verify-look.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          SCHEMAS=/usr/share/glib-2.0/schemas
          echo "== our settings files =="
          ls -l "${SCHEMAS}"/zz1-aquarius-* || echo "(none!)"

          for f in zz1-aquarius-10-look zz1-aquarius-20-shell zz1-aquarius-30-dash-to-dock; do
            if [ -r "${SCHEMAS}/${f}.gschema.override" ]; then ok "${f} is installed"
            else bad "${SCHEMAS}/${f}.gschema.override is missing"; fi
          done

          # Ours must sort last, or somebody else's answer wins and every
          # AquariusOS default is silently ignored.
          first_ours="$(ls "${SCHEMAS}"/zz1-aquarius-*.gschema.override 2>/dev/null | sort | head -1)"
          last_theirs="$(ls "${SCHEMAS}"/*.gschema.override 2>/dev/null | grep -v 'zz1-aquarius' | sort | tail -1)"
          if [ -n "${last_theirs}" ]; then
            if [ "$(printf '%s\n%s\n' "$(basename "${last_theirs}")" "$(basename "${first_ours}")" | sort | tail -1)" = "$(basename "${first_ours}")" ]; then
              ok "our settings sort after everyone else's (last theirs: $(basename "${last_theirs}"))"
            else
              bad "$(basename "${last_theirs}") sorts after ours and would overwrite our defaults"
            fi
          else
            ok "no other override files in the image — ours are the only ones"
          fi

          if [ -s "${SCHEMAS}/gschemas.compiled" ]; then
            ok "the settings index exists"
          else
            bad "${SCHEMAS}/gschemas.compiled is missing — every AquariusOS default would be ignored"
          fi

          # ---------------------------------------------------------------
          # THE CHECK THAT MATTERS: ask the finished image what its settings
          # ARE, exactly as a brand-new user account will on first login.
          # ---------------------------------------------------------------
          echo "== reading the settings back out of the image =="
          want() {   # want <group> <setting> <expected>
            got="$(GSETTINGS_BACKEND=memory gsettings get "$1" "$2" 2>/dev/null || echo '<error>')"
            if [ "${got}" = "$3" ]; then ok "$1 $2 = ${got}"
            else bad "$1 $2 is ${got}, expected $3"; fi
          }
          want org.gnome.desktop.interface color-scheme "'default'"
          want org.gnome.desktop.interface accent-color "'blue'"
          want org.gnome.desktop.interface font-name "'Inter 11'"
          want org.gnome.desktop.interface monospace-font-name "'JetBrains Mono 10'"
          want org.gnome.desktop.background picture-options "'zoom'"
          want org.gnome.shell.extensions.dash-to-dock dock-position "'BOTTOM'"
          want org.gnome.shell.extensions.dash-to-dock dock-fixed "true"
          want org.gnome.shell.extensions.dash-to-dock intellihide "false"

          echo "  ---- for the log ----"
          GSETTINGS_BACKEND=memory gsettings get org.gnome.desktop.background picture-uri || true
          GSETTINGS_BACKEND=memory gsettings get org.gnome.desktop.background picture-uri-dark || true
          GSETTINGS_BACKEND=memory gsettings get org.gnome.shell favorite-apps || true
          GSETTINGS_BACKEND=memory gsettings get org.gnome.shell enabled-extensions || true

          echo "== every pinned app really exists =="
          GSETTINGS_BACKEND=memory gsettings get org.gnome.shell favorite-apps \
            | tr -d "[]' " | tr ',' '\n' | grep -v '^$' > /tmp/favs.txt || true
          while read -r fav; do
            if [ -r "/usr/share/applications/${fav}" ]; then ok "dock: ${fav}"
            else bad "dock: ${fav} is pinned but not installed"; fi
          done < /tmp/favs.txt

          echo "== every enabled extension really exists =="
          GSETTINGS_BACKEND=memory gsettings get org.gnome.shell enabled-extensions \
            | tr -d "[]' " | tr ',' '\n' | grep -v '^$' > /tmp/exts.txt || true
          while read -r ext; do
            if [ -r "/usr/share/gnome-shell/extensions/${ext}/metadata.json" ]; then ok "extension: ${ext}"
            else bad "extension: ${ext} is switched on but not installed"; fi
          done < /tmp/exts.txt

          echo "== the wallpaper =="
          for f in /usr/share/backgrounds/aquarius/the-pour-ice-3840x2160.png \
                   /usr/share/backgrounds/aquarius/the-pour-midnight-3840x2160.png; do
            if [ -s "$f" ]; then ok "$(basename "$f") ($(stat -c '%s' "$f") bytes)"
            else bad "$f is missing — the desktop would come up a flat colour"; fi
          done
          if [ -r /usr/share/gnome-background-properties/aquarius.xml ]; then
            ok "the wallpaper is listed in Settings > Appearance"
          else
            bad "/usr/share/gnome-background-properties/aquarius.xml is missing"
          fi

          echo "== the fonts are findable =="
          for face in Inter "JetBrains Mono" Sora; do
            if fc-list | grep -qi "${face}"; then ok "${face}"
            else bad "${face} is not findable — the interface would fall back to a default"; fi
          done

          if [ "$fails" -ne 0 ]; then
            echo "::error::The AquariusOS look is not correctly applied in this image."
            exit 1
          fi
          echo "All appearance checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-look.sh

      # The two pictures on the Settings > About page are files we replace.
      # Comparing their checksums against the ones in branding/ is the only way
      # to know ours went in — the file names are Fedora's, so the page looks
      # perfectly normal either way.
      - name: Check the About page shows OUR logo
        run: |
          set -euo pipefail
          LIGHT_SUM="$(sha256sum system_files/usr/share/aquarius/branding/aquarius-about-logo.png | awk '{print $1}')"
          DARK_SUM="$(sha256sum system_files/usr/share/aquarius/branding/aquarius-about-logo-white.png | awk '{print $1}')"
          echo "In the repository:"
          echo "  light ${LIGHT_SUM}"
          echo "  dark  ${DARK_SUM}"
          cat > /tmp/verify-logos.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }
          got_light="$(sha256sum /usr/share/pixmaps/fedora_logo_med.png | awk '{print $1}')"
          got_dark="$(sha256sum /usr/share/pixmaps/fedora_whitelogo_med.png | awk '{print $1}')"
          echo "In the image:"
          echo "  light ${got_light}"
          echo "  dark  ${got_dark}"
          if [ "${got_light}" = "${WANT_LIGHT}" ]; then ok "the light About-page logo is ours"
          else bad "the light About-page logo is NOT ours — the page still shows Fedora's"; fi
          if [ "${got_dark}" = "${WANT_DARK}" ]; then ok "the dark About-page logo is ours"
          else bad "the dark About-page logo is NOT ours — the page still shows Fedora's in dark mode"; fi

          # And that the Settings app still reads those two files at all. If
          # Fedora ever moves them, replacing them becomes a no-op that nothing
          # would otherwise notice.
          for want in /usr/share/pixmaps/fedora_logo_med.png /usr/share/pixmaps/fedora_whitelogo_med.png; do
            if grep -a -q "${want}" /usr/bin/gnome-control-center; then
              ok "the Settings app still reads ${want}"
            else
              bad "the Settings app no longer mentions ${want} — replacing it does nothing now"
            fi
          done

          echo "== the login screen logo =="
          if [ -s /usr/share/aquarius/branding/aquarius-logo.png ]; then ok "the login-screen logo file is installed"
          else bad "/usr/share/aquarius/branding/aquarius-logo.png is missing"; fi
          if grep -a -q '/usr/share/aquarius/branding/aquarius-logo.png' /etc/dconf/db/gdm; then
            ok "the compiled login-screen settings really name our logo"
          else
            bad "/etc/dconf/db/gdm does not name our logo — the login screen would be blank there"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::This image is not wearing the AquariusOS logos."
            exit 1
          fi
          echo "All branding checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            -e WANT_LIGHT="${LIGHT_SUM}" \
            -e WANT_DARK="${DARK_SUM}" \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-logos.sh

      # ------------------------------------------------------------------------
      # THE BOOT PATH
      # ------------------------------------------------------------------------
      # Everything a person sees before the login screen: the boot menu, the
      # splash screen, and the text banner over a text login prompt.
      #
      # The splash is the one piece of branding in the whole image that CANNOT be
      # checked by looking at files on disk alone. A copy of it is baked into the
      # boot ramdisk (initramfs.img), and it is that copy the machine actually
      # uses. Change the theme, forget to rebuild the ramdisk, and the machine
      # shows Fedora's splash forever while every file on disk looks perfect.
      # So the last part of this step opens the ramdisk and reads what is inside.
      - name: Check the boot screen says AquariusOS
        run: |
          set -euo pipefail
          # The picture in the middle of the boot screen, checksummed from the
          # repository. Same trick as the About-page step above: the only way to
          # know OUR picture went in is to compare the bytes.
          WATERMARK_SUM="$(sha256sum system_files/usr/share/plymouth/themes/aquarius/watermark.png | awk '{print $1}')"
          REPO_FRAMES="$(find system_files/usr/share/plymouth/themes/aquarius -name 'throbber-*.png' | wc -l | tr -d ' ')"
          echo "In the repository: watermark ${WATERMARK_SUM}, ${REPO_FRAMES} throbber frames"

          cat > /tmp/verify-boot.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }
          check() {   # check "<description>" "<pattern>" "<file>"
            if [ ! -r "$3" ]; then bad "$1 — $3 does not exist"; return; fi
            if grep -Eq "$2" "$3"; then ok "$1"; else bad "$1 — /$2/ not found in $3"; fi
          }

          THEME=/usr/share/plymouth/themes/aquarius

          echo "== the splash program and its parts =="
          for pkg in plymouth plymouth-plugin-two-step plymouth-plugin-label \
                     plymouth-theme-spinner plymouth-system-theme dracut; do
            if rpm -q "${pkg}" > /dev/null 2>&1; then ok "${pkg} $(rpm -q --queryformat '%{VERSION}-%{RELEASE}' "${pkg}")"
            else bad "${pkg} is NOT installed"; fi
          done

          echo "== the Aquarius theme on disk =="
          ls -l "${THEME}" || true
          FRAMES="$(find "${THEME}" -name 'throbber-*.png' | wc -l)"
          echo "throbber frames in the image: ${FRAMES}"
          if [ "${FRAMES}" -eq "${WANT_FRAMES}" ]; then ok "all ${WANT_FRAMES} throbber frames are installed"
          else bad "${FRAMES} throbber frames in the image, expected ${WANT_FRAMES}"; fi

          got="$(sha256sum "${THEME}/watermark.png" 2>/dev/null | awk '{print $1}')"
          echo "watermark.png in the image: ${got:-<missing>}"
          if [ "${got}" = "${WANT_WATERMARK}" ]; then ok "the picture on the boot screen is ours"
          else bad "the boot screen picture is NOT the one in the repository"; fi

          # lock.png is the one file the two-step plug-in genuinely requires. If
          # it is missing, a machine with an encrypted disk shows no password box
          # and appears to hang.
          if [ -s "${THEME}/lock.png" ]; then ok "the disk-password box has its artwork"
          else bad "${THEME}/lock.png is missing — an encrypted machine would show no password box"; fi

          echo "== the theme's own settings =="
          cat "${THEME}/aquarius.plymouth" | grep -vE '^[[:space:]]*(#|$)' || true
          check "the theme uses the two-step plug-in"  '^ModuleName=two-step$'          "${THEME}/aquarius.plymouth"
          check "the background is Midnight"           '^BackgroundStartColor=0x06070C$' "${THEME}/aquarius.plymouth"
          check "the progress colour is starlight"     '^ProgressBarForegroundColor=0x8AB4FF$' "${THEME}/aquarius.plymouth"

          # THE SETTING THAT REMOVES THE MANUFACTURER'S BADGE. It is per-screen,
          # so it has to be false in every screen the theme defines — one missed
          # section lets a Dell or ASUS logo back in on that screen only.
          if grep -q '^UseFirmwareBackground=true$' "${THEME}/aquarius.plymouth"; then
            bad "the theme switches the firmware/manufacturer logo ON somewhere"
            grep -n '^UseFirmwareBackground=' "${THEME}/aquarius.plymouth"
          else
            ok "the firmware/manufacturer logo is off in every screen ($(grep -c '^UseFirmwareBackground=false$' "${THEME}/aquarius.plymouth") of them)"
          fi

          echo "== which splash this machine is set to =="
          echo "--- /etc/plymouth/plymouthd.conf ---"; cat /etc/plymouth/plymouthd.conf 2>/dev/null || echo "(missing)"
          echo "--- /usr/share/plymouth/plymouthd.defaults ---"; cat /usr/share/plymouth/plymouthd.defaults 2>/dev/null || echo "(missing)"
          echo "---"
          check "this machine's splash is aquarius" '^Theme=aquarius$' /etc/plymouth/plymouthd.conf

          echo "== kernel options =="
          for f in /usr/lib/bootc/kargs.d/*.toml; do echo "--- ${f} ---"; cat "${f}"; done
          check "the boot options ask for a splash" 'kargs = \["quiet", "splash", "rhgb"\]' \
                /usr/lib/bootc/kargs.d/05-aquarius-boot.toml

          echo "== the boot menu =="
          # On an image-based system the boot-menu entry text is generated from
          # PRETTY_NAME, not from /etc/default/grub. Both are checked: the first
          # is what actually decides, the second is what a person goes looking
          # for and what a non-image boot path would use.
          check "PRETTY_NAME is what the menu entries are named from" \
                '^PRETTY_NAME="AquariusOS"$' /etc/os-release
          check "GRUB_DISTRIBUTOR is AquariusOS" \
                '^GRUB_DISTRIBUTOR="AquariusOS"$' /etc/default/grub
          # Evidence, for the log, that the tooling which writes the boot-menu
          # entries really does read PRETTY_NAME to title them. Same technique
          # as the About-page step above: look for the string inside the
          # compiled program.
          echo "Which programs name PRETTY_NAME internally:"
          for b in /usr/bin/ostree /usr/bin/bootc /usr/bin/bootupctl; do
            [ -e "${b}" ] || continue
            if grep -a -q 'PRETTY_NAME' "${b}"; then
              echo "  ${b} reads PRETTY_NAME"
            else
              echo "  ${b} does not name PRETTY_NAME directly (it may go through a library)"
            fi
          done

          echo "== the text banners =="
          for f in /etc/issue /etc/issue.net /etc/fedora-release /etc/system-release /etc/redhat-release; do
            echo "--- ${f} ---"; cat "${f}" 2>/dev/null || echo "(missing)"
          done
          echo "--- /etc/motd (should be empty) ---"; cat /etc/motd 2>/dev/null || echo "(missing)"
          echo "---"
          check "the console banner says AquariusOS" '^AquariusOS$' /etc/issue
          check "the network banner says AquariusOS" '^AquariusOS$' /etc/issue.net
          check "the old-style release line is ours" '^AquariusOS release ' /etc/fedora-release
          if [ -f /etc/motd ] && [ ! -s /etc/motd ]; then ok "/etc/motd is empty (deliberate)"
          elif [ ! -e /etc/motd ]; then ok "/etc/motd does not exist (fine)"
          else bad "/etc/motd has content — it would print on every ssh login: $(cat /etc/motd)"; fi

          echo "== neither Fedora welcome screen is installed =="
          for pkg in gnome-tour gnome-initial-setup; do
            if rpm -q "${pkg}" > /dev/null 2>&1; then bad "${pkg} is installed — it shows a 'Welcome to Fedora' screen"
            else ok "${pkg} is not installed"; fi
          done

          # ---------------------------------------------------------------
          # THE CHECK THAT MATTERS: open the boot ramdisk and read it.
          # ---------------------------------------------------------------
          echo "== inside the boot ramdisk =="
          KVER="$(rpm -q --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}' kernel-core)"
          IMG="/usr/lib/modules/${KVER}/initramfs.img"
          echo "kernel  : ${KVER}"
          echo "ramdisk : ${IMG}"
          if [ ! -s "${IMG}" ]; then
            bad "${IMG} is missing or empty — this image has no boot ramdisk at all"
          else
            ok "the ramdisk exists ($(stat -c '%s' "${IMG}") bytes, mode $(stat -c '%a' "${IMG}"))"

            # `lsinitrd -m` prints a header and the early-CPIO file listing
            # before the module names, so everything after the line
            # "dracut modules:" is the real list.
            echo "-- the parts it was built from --"
            lsinitrd -m "${IMG}" > /tmp/lsinitrd-raw.txt 2>/dev/null || true
            awk '/^dracut modules:/ { seen = 1; next } seen' /tmp/lsinitrd-raw.txt \
              | tr -d '[:blank:]' | grep -E '^[a-z0-9][a-z0-9._-]*$' | sort -u > /tmp/initrd-mods.txt || true
            tr '\n' ' ' < /tmp/initrd-mods.txt; echo
            for part in plymouth ostree bootc; do
              if grep -qx "${part}" /tmp/initrd-mods.txt; then ok "the ramdisk contains the '${part}' part"
              else bad "the ramdisk has no '${part}' part"; fi
            done

            echo "-- everything Plymouth-related inside it --"
            lsinitrd "${IMG}" 2>/dev/null | grep -i plymouth > /tmp/initrd-ply.txt || true
            cat /tmp/initrd-ply.txt || true
            echo "--"

            # These three lines are the evidence that the splash is really in the
            # ramdisk and not just on disk.
            for want in 'plymouth/themes/aquarius/aquarius.plymouth' \
                        'plymouth/themes/aquarius/watermark.png' \
                        'plymouth/themes/aquarius/throbber-0001.png'; do
              if grep -q "${want}" /tmp/initrd-ply.txt; then
                ok "in the ramdisk: $(grep -m1 "${want}" /tmp/initrd-ply.txt | awk '{print $NF}')"
              else
                bad "${want} is NOT inside the ramdisk"
              fi
            done

            # And that the setting inside the ramdisk names our theme rather than
            # one of Fedora's. This is the "no spinner, no bgrt as the default"
            # check — the file is what decides, not which folders happen to be
            # present.
            : > /tmp/initrd-conf.txt
            found=0
            for c in /etc/plymouth/plymouthd.conf /usr/share/plymouth/plymouthd.defaults; do
              # Paths inside a ramdisk are stored with no leading slash; ask both ways.
              if { lsinitrd -f "${c}" "${IMG}" > /tmp/one-conf.txt 2>/dev/null \
                   || lsinitrd -f "${c#/}" "${IMG}" > /tmp/one-conf.txt 2>/dev/null; } && [ -s /tmp/one-conf.txt ]; then
                found=1
                echo "-- ${c}, inside the ramdisk --"; cat /tmp/one-conf.txt
                cat /tmp/one-conf.txt >> /tmp/initrd-conf.txt
              fi
            done
            if [ "${found}" -eq 0 ]; then
              bad "the ramdisk carries no splash setting — it would fall back to Fedora's bgrt"
            elif grep -q '^Theme=aquarius$' /tmp/initrd-conf.txt; then
              ok "the setting inside the ramdisk says Theme=aquarius (so not spinner, not bgrt)"
            else
              bad "the setting inside the ramdisk does not say Theme=aquarius:"
              cat /tmp/initrd-conf.txt
            fi
            if grep -qE '^Theme=(bgrt|spinner|charge)$' /tmp/initrd-conf.txt; then
              bad "a Fedora theme is named as the default inside the ramdisk"
            fi
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The boot path is not correctly branded in this image."
            exit 1
          fi
          echo "All boot-path checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            -e WANT_WATERMARK="${WATERMARK_SUM}" \
            -e WANT_FRAMES="${REPO_FRAMES}" \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-boot.sh

      # ------------------------------------------------------------------------
      # THE "NO STRAY NAMES" AUDIT
      # ------------------------------------------------------------------------
      # Royce's instruction was "anything that still says Bazzite should say
      # Aquarius". This step is what keeps that true next month, when somebody
      # adds a feature and copies a snippet from somewhere.
      #
      # It is two different rules, on purpose:
      #
      #   BAZZITE  must appear NOWHERE. Zero — not in a file name, not in an
      #            installed package, not in the text of any file this build
      #            writes to, comments included. This branch is built from bare
      #            Fedora and has no relationship to Bazzite, so any occurrence
      #            is a mistake by definition.
      #
      #            ⚠️ This rule is stricter than the Fedora one below, and that
      #            asymmetry is on purpose. When this check was first written it
      #            found five real hits, all of them historical notes in the
      #            comments of two GNOME settings files ("the old Bazzite line
      #            pinned all three", and so on). Those notes are genuinely
      #            useful and they were kept — but reworded to say "the line
      #            this replaced", because those files are installed onto every
      #            machine, and Royce's instruction was that a machine should
      #            not say Bazzite anywhere. The repository's own documentation,
      #            which does not ship, still tells the story by name.
      #
      #   FEDORA   must not appear in the places a PERSON reads a name. It is
      #            expected and correct in the places a PROGRAM reads one —
      #            AquariusOS really is Fedora underneath, and pretending
      #            otherwise breaks package installation and security scanning.
      #            The allowed places are listed, with a reason each, below.
      - name: Check nothing still says Bazzite or Fedora
        run: |
          set -euo pipefail
          cat > /tmp/verify-names.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          # A settings file's VALUES, without the plain-English notes around
          # them. Every config file in this project carries a long explanatory
          # header, and several of those headers legitimately explain what
          # Fedora does and why we differ. Explaining Fedora is not the same as
          # being branded Fedora, so the comments are not part of the audit.
          values_only() { grep -vE '^[[:space:]]*(#|;|$)' "$1" 2>/dev/null || true; }

          echo "=============================================================="
          echo " RULE 1 — the word Bazzite must not appear anywhere"
          echo "=============================================================="

          echo "-- as part of a file or folder name --"
          find / -xdev -iname '*bazzite*' > /tmp/bz-names.txt 2>/dev/null || true
          if [ -s /tmp/bz-names.txt ]; then
            bad "$(wc -l < /tmp/bz-names.txt) path(s) are named after Bazzite:"
            head -40 /tmp/bz-names.txt
          else
            ok "no file or folder anywhere on the image is named after Bazzite"
          fi

          echo "-- as an installed package --"
          if rpm -qa | grep -i bazzite > /tmp/bz-pkgs.txt; then
            bad "Bazzite packages are installed:"; cat /tmp/bz-pkgs.txt
          else
            ok "no installed package is a Bazzite one"
          fi

          # Inside text files. The excluded folders are translations, manuals and
          # timezone tables — many gigabytes of text that no AquariusOS build
          # writes into, and which would turn a two-minute check into a
          # twenty-minute one. Everything the build can actually touch is in.
          echo "-- inside text files --"
          grep -rIil bazzite \
            /etc /usr/bin /usr/sbin /usr/libexec /usr/lib/os-release /usr/lib/bootc \
            /usr/lib/systemd /usr/lib/dracut /usr/share/aquarius /usr/share/plymouth \
            /usr/share/glib-2.0/schemas /usr/share/gnome-background-properties \
            /usr/share/applications /usr/share/gnome-shell /usr/share/wayland-sessions \
            /usr/share/xsessions /usr/share/pixmaps /usr/share/backgrounds \
            > /tmp/bz-text.txt 2>/dev/null || true
          if [ -s /tmp/bz-text.txt ]; then
            bad "$(wc -l < /tmp/bz-text.txt) file(s) contain the word Bazzite:"
            head -40 /tmp/bz-text.txt
          else
            ok "no text file in any folder this build writes to mentions Bazzite"
          fi

          echo
          echo "=============================================================="
          echo " RULE 2 — Fedora must not appear where a PERSON reads a name"
          echo "=============================================================="

          # nofedora <what it is> <file> [<grep pattern to narrow to some lines>]
          nofedora() {
            local what="$1" file="$2" narrow="${3:-}" body
            if [ ! -e "${file}" ]; then
              ok "${what}: ${file} does not exist in this image (nothing to say Fedora)"
              return
            fi
            body="$(values_only "${file}")"
            if [ -n "${narrow}" ]; then
              body="$(printf '%s\n' "${body}" | grep -E "${narrow}" || true)"
            fi
            if printf '%s\n' "${body}" | grep -qi fedora; then
              bad "${what} (${file}) still says Fedora:"
              printf '%s\n' "${body}" | grep -i fedora | sed 's/^/       /'
            else
              ok "${what} (${file})"
            fi
          }

          nofedora "the system's name, pretty name and edition" /etc/os-release '^(NAME|PRETTY_NAME|VARIANT)='
          nofedora "the same, in the image copy"                /usr/lib/os-release '^(NAME|PRETTY_NAME|VARIANT)='
          nofedora "the console login banner"                   /etc/issue
          nofedora "the network login banner"                    /etc/issue.net
          nofedora "the message of the day"                      /etc/motd
          nofedora "the old-style release line"                   /etc/fedora-release
          nofedora "the boot menu's distributor name"             /etc/default/grub '^GRUB_DISTRIBUTOR='
          nofedora "which splash this machine uses"               /etc/plymouth/plymouthd.conf '^Theme='
          nofedora "which splash the image falls back to"         /usr/share/plymouth/plymouthd.defaults '^Theme='
          nofedora "this machine's own name"                      /etc/hostname
          nofedora "the wallpaper list in Settings > Appearance"  /usr/share/gnome-background-properties/aquarius.xml

          echo "-- our GNOME defaults --"
          for f in /usr/share/glib-2.0/schemas/zz1-aquarius-*.gschema.override; do
            nofedora "an AquariusOS default" "${f}"
          done

          # The theme folder the machine actually boots with. Text files only —
          # the borrowed grey password-box PNGs are pictures of rectangles and
          # have no words in them.
          echo "-- the active boot splash theme --"
          grep -rIl -i fedora /usr/share/plymouth/themes/aquarius > /tmp/fed-theme.txt 2>/dev/null || true
          if [ -s /tmp/fed-theme.txt ]; then
            # ... except our own explanatory notes, which are allowed to discuss
            # Fedora. Check the settings themselves.
            still=0
            while read -r f; do
              if values_only "${f}" | grep -qi fedora; then
                bad "a SETTING in ${f} says Fedora:"; values_only "${f}" | grep -i fedora | sed 's/^/       /'
                still=1
              fi
            done < /tmp/fed-theme.txt
            if [ "${still}" -eq 0 ]; then
              ok "the boot theme's settings say nothing about Fedora (only its notes do, which is fine)"
            fi
          else
            ok "nothing in the boot theme folder mentions Fedora at all"
          fi

          echo
          echo "=============================================================="
          echo " THE ALLOWLIST — where Fedora is SUPPOSED to still appear"
          echo "=============================================================="
          echo "Each of these is deliberate. None is visible to a person using"
          echo "the machine, and each one would break something if changed."
          echo
          # 1. os-release's machine-readable identity. Hundreds of programs and
          #    scripts branch on ID=fedora to decide which package manager to
          #    use and which paths to look in. Changing it would make this
          #    machine unrecognisable to all of them.
          echo "1. /etc/os-release — the machine-readable identity:"
          grep -E '^(ID|ID_LIKE|VERSION|VERSION_ID|CPE_NAME|REDHAT_)' /etc/os-release | sed 's/^/     /'
          if grep -q '^ID=fedora$' /etc/os-release; then ok "ID is still fedora (required, deliberate)"
          else bad "ID is no longer fedora — software that branches on it would stop recognising this machine"; fi

          # 2. The CPE identifier. Security scanners use it to work out which
          #    published vulnerabilities apply. AquariusOS really is Fedora 44
          #    underneath, so telling a scanner otherwise makes it check the
          #    wrong list — which is a security problem, not a branding one.
          echo "2. /etc/system-release-cpe — used by vulnerability scanners:"
          sed 's/^/     /' /etc/system-release-cpe 2>/dev/null || echo "     (not present)"

          # 3. The software sources. These really are Fedora's servers.
          echo "3. /etc/yum.repos.d/ — the real Fedora and RPM Fusion servers:"
          ls -1 /etc/yum.repos.d/ 2>/dev/null | sed 's/^/     /' || echo "     (none)"

          # 4. Package names, and the record of what this image was built on.
          echo "4. Package names and the build record:"
          echo "     $(rpm -qa 'fedora-*' | tr '\n' ' ')"
          grep -o '"base-image-name": "[^"]*"' /usr/share/aquarius/image-info.json | sed 's/^/     /'

          # 5. Two picture FILENAMES under /usr/share/pixmaps are Fedora's, on
          #    purpose: GNOME's Settings > About page opens those exact paths, so
          #    the only way to brand that page is to put our picture at Fedora's
          #    filename. The bytes are ours; the name is not. Checked properly by
          #    the "About page shows OUR logo" step above.
          echo "5. Fedora-named picture files whose CONTENTS are ours:"
          ls -1 /usr/share/pixmaps/fedora_logo_med.png /usr/share/pixmaps/fedora_whitelogo_med.png 2>/dev/null | sed 's/^/     /' || true

          echo
          if [ "$fails" -ne 0 ]; then
            echo "::error::This image still carries a name it should not. See the FAIL lines above."
            exit 1
          fi
          echo "No stray names. Every visible surface says AquariusOS."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-names.sh

      - name: Check the NVIDIA driver
        if: matrix.nvidia == 1
        run: |
          set -euo pipefail
          cat > /tmp/verify-nvidia.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          echo "== the driver packages =="
          for pkg in kmod-nvidia nvidia-driver egl-wayland nvidia-container-toolkit; do
            if rpm -q "${pkg}" > /dev/null 2>&1; then
              ok "${pkg} $(rpm -q --queryformat '%{VERSION}-%{RELEASE}' "${pkg}")"
            else
              bad "${pkg} is NOT installed"
            fi
          done

          # The kernel module and the driver come from the same source and MUST
          # be the same version. A mismatch is the classic black screen.
          k="$(rpm -q --queryformat '%{VERSION}' kmod-nvidia 2>/dev/null || echo none)"
          d="$(rpm -q --queryformat '%{VERSION}' nvidia-driver 2>/dev/null || echo none)"
          if [ "$k" = "$d" ] && [ "$k" != "none" ]; then
            ok "kernel module and driver are both version ${k}"
          else
            bad "kernel module is ${k} but the driver is ${d}"
          fi

          # And the module file has to be filed under the kernel that is
          # actually in this image, not the one it was built on.
          KERNEL="$(rpm -q --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}' kernel-core)"
          echo "== kernel in this image: ${KERNEL} =="
          ls -1 /usr/lib/modules/
          if compgen -G "/usr/lib/modules/${KERNEL}/extra/nvidia*" > /dev/null; then
            ok "the NVIDIA modules are filed under ${KERNEL}"
            ls -l /usr/lib/modules/"${KERNEL}"/extra/nvidia* | sed 's/^/       /'
          else
            bad "no nvidia* modules under /usr/lib/modules/${KERNEL}/extra — the driver would not load"
            find /usr/lib/modules -name 'nvidia*' | head -20
          fi

          echo "== boot options =="
          cat /usr/lib/bootc/kargs.d/10-aquarius-nvidia.toml || echo "(missing!)"
          if grep -q 'nvidia-drm.modeset=1' /usr/lib/bootc/kargs.d/10-aquarius-nvidia.toml 2>/dev/null; then
            ok "nvidia-drm.modeset=1 is set — Wayland will start"
          else
            bad "nvidia-drm.modeset=1 is not set — a Wayland desktop on NVIDIA would not start"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The NVIDIA layer in this image is not correct."
            exit 1
          fi
          echo "All NVIDIA checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-nvidia.sh

      # And the opposite: the AMD/Intel image must NOT have picked up the
      # NVIDIA driver. If the conditional-stage trick in the Containerfile ever
      # breaks, this is what notices.
      - name: Check the AMD/Intel image has no NVIDIA driver in it
        if: matrix.nvidia == 0
        run: |
          set -euo pipefail
          podman run --rm --pull=never \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" -c '
              if rpm -q kmod-nvidia > /dev/null 2>&1; then
                echo "::error::The AMD/Intel image contains the NVIDIA kernel module. The Containerfile stage selection is broken."
                exit 1
              fi
              echo "  OK   no NVIDIA driver on the AMD/Intel image (correct)"
            '

      # ------------------------------------------------------------------------
      # Aquarius Keys — the Mac-style keyboard shortcuts
      # ------------------------------------------------------------------------
      # A keyboard feature fails in a particularly nasty way: some keys just do
      # nothing, and nothing anywhere says why. So this asks the finished image
      # every question that matters — are both remappers there and do they run,
      # are the rule files ones the remapper itself accepts, is the service
      # switched on, does a brand-new account get Mac keys, is the permission
      # rule in place, and does `aq keys` work.
      #
      # The rule files are ALSO parsed here on the runner as plain YAML. That is
      # not a duplicate of the check the build does: the build asks "does xremap
      # accept this?", and this asks "is it well-formed text?" — which is the
      # question that catches a file that has been truncated or mangled on its
      # way into the image.
      - name: Check the Mac keyboard shortcuts are really in there
        run: |
          set -euo pipefail

          # ---- 1. inside the image -------------------------------------------
          cat > /tmp/verify-keys.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }
          check() {   # check "<description>" "<pattern>" "<file>"
            if [ ! -e "$3" ]; then bad "$1 — $3 does not exist"; return; fi
            if grep -Eq "$2" "$3"; then ok "$1"; else bad "$1 — /$2/ not found in $3"; fi
          }

          echo "== the two remapper programs =="
          for feature in wlroots gnome; do
            bin="/usr/bin/xremap-${feature}"
            if [ ! -x "${bin}" ]; then
              bad "${bin} is missing"
              continue
            fi
            if out="$("${bin}" --version 2>&1)"; then
              ok "${bin} — ${out}"
            else
              bad "${bin} is installed but will not run: ${out}"
            fi
            # A library that is not in the image shows up here as "not found",
            # and would otherwise only be discovered at somebody's login.
            if ldd "${bin}" 2>&1 | grep -q "not found"; then
              bad "${bin} needs a library that is not in this image:"
              ldd "${bin}" 2>&1 | grep "not found" | sed 's/^/       /'
            else
              ok "${bin} has every library it needs"
            fi
          done

          echo
          echo "== the rule files, judged by the remapper itself =="
          # xremap reads and validates the whole file before it looks at any
          # keyboard, so pointing it at a device that does not exist gets the
          # full check and then stops. A complaint about the FILE says "Failed
          # to load config"; a complaint about missing devices is expected,
          # because there is no keyboard inside a container.
          for profile in mac windows; do
            file="/usr/share/aquarius/keys/${profile}.yaml"
            if [ ! -s "${file}" ]; then bad "${file} is missing or empty"; continue; fi
            out="$(/usr/bin/xremap-wlroots --device /nonexistent-device "${file}" 2>&1 || true)"
            if printf '%s' "${out}" | grep -q "Failed to load config"; then
              bad "${file} is not a valid profile:"
              printf '%s\n' "${out}" | sed 's/^/       /'
            else
              ok "${file} is a profile xremap accepts"
            fi
          done

          echo
          echo "== the rules Royce actually asked for =="
          MAC=/usr/share/aquarius/keys/mac.yaml
          check "the key beside the space bar is Command" '^ *Alt_L: Super_L$'     "${MAC}"
          check "the Windows key is Option"               '^ *Super_L: Alt_L$'     "${MAC}"
          check "Apple keyboards are left alone"          'ids:0x05ac'             "${MAC}"
          check "Command-C copies"                        '^ *Super-c: C-c( |$)'   "${MAC}"
          check "in a terminal, Command-C copies"         '^ *Super-c: C-Shift-c( |$)' "${MAC}"
          check "Command-Q closes the window"             '^ *Super-q: A-F4$'      "${MAC}"
          check "Command-Shift-3 takes a screenshot"      '^ *Super-Shift-3: SYSRQ$' "${MAC}"
          check "Files gets its own rules"                '^ *- Nautilus$'         "${MAC}"
          check "DaVinci Resolve is left alone"           '^ *- resolve *#'        "${MAC}"

          # These three must NOT be remapped: they are how the desktop's own
          # search and window switching are reached. A rule for any of them
          # would take the search palette away with no error anywhere.
          for combo in 'Super-space' 'Super-Tab' 'Super-grave'; do
            if grep -Eq "^[[:space:]]+${combo}:" "${MAC}"; then
              bad "${combo} is remapped — that key belongs to the desktop"
            else
              ok "${combo} is left for the desktop, as designed"
            fi
          done

          echo
          echo "== permission to read the keyboard without being root =="
          RULE=/usr/lib/udev/rules.d/70-aquarius-input.rules
          check "the udev rule covers the invented keyboard" 'uinput'          "${RULE}"
          check "it uses uaccess, not a permanent group"     'TAG\+="uaccess"' "${RULE}"
          check "it covers the real keyboards too"           'SUBSYSTEM=="input", KERNEL=="event\[0-9\]\*"' "${RULE}"
          check "the uinput driver loads at boot"            '^uinput$' /usr/lib/modules-load.d/aquarius-uinput.conf

          echo
          echo "== the service, and that it is switched on =="
          UNIT=/usr/lib/systemd/user/aquarius-keys.service
          WANTS=/usr/lib/systemd/user/graphical-session.target.wants/aquarius-keys.service
          check "the service runs the right program" '^ExecStart=/usr/libexec/aquarius-keys-run$' "${UNIT}"
          check "it belongs to the graphical session" '^WantedBy=graphical-session\.target$'      "${UNIT}"
          check "it restarts itself if it crashes"    '^Restart=on-failure$'                     "${UNIT}"
          if [ -L "${WANTS}" ] && [ -e "${WANTS}" ]; then
            ok "switched on by default — ${WANTS} -> $(readlink "${WANTS}")"
          else
            bad "${WANTS} is missing or dangling — the service would never start"
          fi

          echo
          echo "== the default is Mac, in both places it is written =="
          check "a brand-new account gets Mac keys" '^mode=mac$'      /etc/skel/.config/aquarius/keys.conf
          check "an account with no file gets them too" '^AQ_MODE="mac"$' /usr/libexec/aquarius-keys-run

          echo
          echo "== the switch =="
          for script in /usr/libexec/aquarius-keys-run /usr/bin/aq; do
            if [ ! -x "${script}" ]; then bad "${script} is missing or not runnable"; continue; fi
            if bash -n "${script}"; then ok "${script} is valid shell"; else bad "${script} has a syntax error"; fi
          done
          if /usr/bin/aq --help > /dev/null 2>&1; then ok "aq --help works"; else bad "aq --help failed"; fi
          echo "--- aq keys status, with no desktop running ---"
          if /usr/bin/aq keys status; then
            ok "aq keys status explains itself instead of falling over"
          else
            bad "aq keys status failed"
          fi
          echo "---"

          echo
          echo "== the GNOME add-on that reports the focused app =="
          EXT=/usr/share/gnome-shell/extensions/xremap@k0kubun.com
          check "it is installed" '"uuid": "xremap@k0kubun.com"' "${EXT}/metadata.json"
          if [ -s "${EXT}/extension.js" ]; then ok "its code is present"; else bad "${EXT}/extension.js is missing"; fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::Aquarius Keys is not correctly assembled in this image."
            exit 1
          fi
          echo "All Aquarius Keys checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-keys.sh

          # ---- 2. on the runner: are the rule files well-formed YAML? --------
          # PyYAML is on GitHub's runners already; the install line is there so
          # that a future runner image without it fails loudly at this line
          # rather than quietly skipping the check.
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml
          for profile in mac windows; do
            podman run --rm --pull=never --entrypoint /usr/bin/cat \
              "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
              "/usr/share/aquarius/keys/${profile}.yaml" > "/tmp/${profile}.yaml"
            python3 - "$profile" <<'PY'
          import sys, yaml
          name = sys.argv[1]
          with open(f"/tmp/{name}.yaml") as fh:
              doc = yaml.safe_load(fh)
          assert isinstance(doc, dict), f"{name}.yaml is not a settings file at all"
          for section in ("modmap", "keymap"):
              assert section in doc, f"{name}.yaml has no '{section}' section"
              assert isinstance(doc[section], list), f"{name}.yaml: '{section}' is not a list"
          rules = sum(len(block.get("remap", {})) for block in doc["keymap"])
          print(f"  OK   {name}.yaml is well-formed YAML — "
                f"{len(doc['modmap'])} key swap block(s), "
                f"{len(doc['keymap'])} rule block(s), {rules} rules")
          PY
          done

      # ------------------------------------------------------------------------
      # PUBLISHING
      # ------------------------------------------------------------------------
      # ⚠️ EVERY STEP FROM HERE DOWN ONLY RUNS ON `restart/fedora-bootc`.
      #
      # Side branches (`restart/aquarius-keys` and any future one) build the
      # image and run every check above, and then stop. They must not publish,
      # because publishing means pushing to the `aquarius-os-next:latest` tags
      # that real machines update from — so a half-finished side branch would
      # overwrite the working image on the bench PC with its own work in
      # progress. Building and checking is the whole value of running CI on a
      # side branch; publishing from one is only a way to break something.
      #
      # Fable removes these `if:` lines when a side branch is merged back.
      - name: Work out the tags to publish under
        if: github.ref_name == 'restart/fedora-bootc'
        id: tags
        run: |
          alias_tags="$(just generate-build-tags "${IMAGE_NAME}" "${DEFAULT_TAG}")"
          echo "Publishing as: ${alias_tags}"
          echo "alias_tags=${alias_tags}" >> "${GITHUB_OUTPUT}"

      - name: Apply the tags
        if: github.ref_name == 'restart/fedora-bootc'
        env:
          ALIAS_TAGS: ${{ steps.tags.outputs.alias_tags }}
        run: just tag-images "${IMAGE_NAME}" "${DEFAULT_TAG}" "${ALIAS_TAGS}"

      - name: Sign in to GitHub's container registry
        if: github.ref_name == 'restart/fedora-bootc'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.ref_name == 'restart/fedora-bootc'
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile \
              "${IMAGE_NAME}:${tag}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done
          digest="$(< /tmp/digestfile)"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Install cosign
        if: github.ref_name == 'restart/fedora-bootc'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      # Signing is what lets a machine prove an update really came from us and
      # was not swapped out on the way. The private key is a repository secret
      # called SIGNING_SECRET; the matching public half is cosign.pub in this
      # repository, and it is the same pair the Bazzite line uses.
      - name: Sign the published image
        if: github.ref_name == 'restart/fedora-bootc'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: What was published
        if: github.ref_name == 'restart/fedora-bootc'
        run: |
          echo "### ${IMAGE_NAME}" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Published to \`${IMAGE_REGISTRY}/${IMAGE_NAME}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "To put it on a machine already running AquariusOS:" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          echo "sudo bootc switch ${IMAGE_REGISTRY}/${IMAGE_NAME}:latest" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
