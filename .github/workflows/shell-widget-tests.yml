---
# Tests for the Plasma widgets AquariusOS writes itself — currently the clock in
# the top bar, whose popup is the notifications panel.
#
# WHY THIS IS ITS OWN WORKFLOW
# Building the OS image takes the best part of an hour. The questions worth
# asking about a QML widget that CAN be answered without booting anything — is
# the metadata readable, is every file it loads actually here, do the brackets
# balance, is the desktop layout script still valid JavaScript — are answered on
# a plain Ubuntu runner in about ten seconds. So they are, on every pull request.
#
# It does NOT replace the check in the image build. build_files/shell-widgets.sh
# runs against the FINISHED image and asks the question this workflow cannot: are
# the KDE QML libraries the widget imports actually installed in the OS we just
# assembled. "The file in the repo is correct" and "the shipped OS is correct"
# are two different statements, and only the second one matters to a user.
#
# And neither of them is qmllint. Properly linting QML needs Qt, Kirigami and the
# Plasma modules present to resolve the imports; none of that exists on the Mac
# this repo is written on. Real behaviour is checked on real hardware — the bench
# checklist is at the bottom of docs/clock-notifications-widget.md.
name: Shell widget tests

on:
  pull_request:
    paths:
      - 'system_files/usr/share/plasma/plasmoids/**'
      - 'system_files/usr/share/plasma/look-and-feel/**/layouts/**'
      - 'build_files/shell-widgets.sh'
      - 'tests/test-aquarius-plasmoid.sh'
      - '.github/workflows/shell-widget-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'system_files/usr/share/plasma/plasmoids/**'
      - 'system_files/usr/share/plasma/look-and-feel/**/layouts/**'
      - 'build_files/shell-widgets.sh'
      - 'tests/test-aquarius-plasmoid.sh'
      - '.github/workflows/shell-widget-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Widget files, metadata and layout script
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          bash --version | head -1
          python3 --version
          node --version
          shellcheck --version | grep version:

      # Static check first: shellcheck reads the two scripts without running
      # them. build_files/shell-widgets.sh cannot be RUN here — it inspects a
      # finished OS image — so this is the only automated look it gets before it
      # runs for real inside the build.
      - name: Shellcheck the widget scripts
        run: |
          shellcheck tests/test-aquarius-plasmoid.sh build_files/shell-widgets.sh

      - name: Widget files, metadata, brackets and layout script
        run: ./tests/test-aquarius-plasmoid.sh
