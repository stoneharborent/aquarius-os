---
# ==============================================================================
# Build AquariusOS (the Fedora bootc line)
# ==============================================================================
# This is what turns the recipe into an operating system. It runs on GitHub's
# computers, so nobody needs a Linux machine to build AquariusOS.
#
# For each of the two images it:
#   1. builds it from the Containerfile
#   2. INSPECTS THE FINISHED IMAGE and refuses to publish it if it is wrong
#   3. pushes it to GitHub's container registry
#   4. signs it, so a machine can prove an update really came from us
#
# ⚠️ WHICH BRANCHES THIS PUBLISHES FROM, AND WHY THERE ARE TWO.
#
# This is the AquariusOS build. It publishes from `main` — the ordinary,
# permanent home for it.
#
# It ALSO still publishes from `restart/fedora-bootc`, because until 4 September
# 2026 that WAS the branch this line lived on, and `main` was the older,
# Bazzite-based operating system. On that date Royce renamed the branches: the
# old `main` became `bazzite-archive` and this branch became `main`. Naming both
# here means the same file is correct before the rename and after it, so nothing
# has to be edited in the ten minutes between the two clicks. See
# docs/restart/final-names.md.
#
# The Bazzite line's own workflow stays behind on `bazzite-archive` and is never
# merged with this one.
#
# ⚠️ STEP 2 IS THE POINT. It would be easy to build an image, see no red text,
# and publish something that boots to a black screen. Every check in the verify
# job reads the ACTUAL CONTENTS of the finished image — the text in
# /etc/os-release, the value gsettings reports, the answer rpm gives, the
# checksum of a picture. Never a file's timestamp: the tooling that packages a
# bootable image flattens every clock, so a timestamp check passes forever,
# including when the step it was checking did nothing. We learned that on
# 2026-08-31 and it is now a rule.
# ==============================================================================

name: Build AquariusOS

on:
  push:
    branches:
      # The real line, after the 4 September 2026 branch rename. Pushes here
      # build, check, publish and sign.
      - main
      # The real line, before that rename. Same treatment, for exactly as long
      # as this branch name still exists.
      - restart/fedora-bootc
      # A side branch, so that work in progress gets the same build and the
      # same checks before it is merged. It BUILDS AND CHECKS ONLY — every
      # publishing step below carries an `if:` that limits it to the branch
      # above, so a side branch cannot overwrite the images real machines
      # update from. See the PUBLISHING heading in the job.
      - restart/aquarius-keys
      # Phase R3a — DaVinci Resolve in a Rocky Linux container. Same rule:
      # builds and checks, never publishes.
      - restart/r3-resolve
      # Phase R3b — the creator apps layer and the ingest helper. Same
      # arrangement: builds and checks, never publishes.
      - restart/r3-apps
      # Carrying the first-login creator-apps hook back into the aquarius-shell
      # repository's own session files, and taking the shell commit that has it.
      # Same arrangement again: builds and checks, never publishes.
      - restart/shell-autostart
      # Phase R3 polish — everything Royce asked for after the 2026-09-04 bench
      # test: a password prompt in the Aquarius Session, the Resolve installer's
      # wording, a "Remove DaVinci Resolve" window, Resolve at the right size
      # with the right mouse pointer, and langpacks-en baked in. Same
      # arrangement: builds and checks, never publishes.
      - restart/r3-polish
      # The logout clean-up — the 2026-09-04 bench bug where logging out of the
      # Aquarius Desktop to go to GNOME bounced off the login screen two or
      # three times. Same arrangement again: builds and checks, never publishes.
      - restart/session-teardown
      # Phase R4 — the desktop gaming layer: Steam, Proton's supporting cast,
      # the controller drivers, and the Gaming shelf in the app chooser. Same
      # arrangement: builds and checks, never publishes.
      - restart/r4-gaming
      # The kernel pin — making BOTH images ship the kernel Universal Blue's
      # ready-made modules were built for, so the AMD/Intel image can never
      # again publish without the virtual camera and the Xbox drivers. Same
      # arrangement again: builds and checks, never publishes.
      - restart/kernel-pin
      # The login screen — the 2026-09-04 photo, where the screen Royce logs in
      # at was stock Fedora GDM at 100% on a 4K monitor. Part A fixes GDM's
      # size and colours; Part B adds our own greeter (greetd + the Aquarius
      # Shell), shipped switched OFF. Same arrangement: builds and checks,
      # never publishes.
      - restart/login
      # The "All set." page — the 2026-09-04 bench test again: the last page of
      # the creator-apps window was blank at the top (no Aquarius mark) and its
      # main button offered to open one app instead of showing them all. Same
      # arrangement: builds and checks, never publishes.
      - restart/chooser-done
      # The two DaVinci Resolve windows' last pages — the same 2026-09-04 fault
      # as the chooser's "All set." page, in the two windows nobody looked at
      # yet: both finished on a widget that cannot show the Aquarius mark, so
      # both were blank at the top. Same arrangement: builds and checks, never
      # publishes.
      - restart/resolve-done
      # The missing right-click menu — the 2026-09-04 bench test again:
      # right-clicking a video in Files offered no "Make Editor-Ready", because
      # the extension asked for an extension interface version that Fedora 44's
      # Files had already loaded a newer one of, and stopped dead. Same
      # arrangement: builds and checks, never publishes.
      - restart/nautilus-fix
      # Aquarius Editor stops being baked into the image and becomes a download
      # offered by the chooser (ticked by default), installed into each
      # person's own home folder. Roughly four gigabytes off every image. Same
      # arrangement: builds and checks, never publishes.
      - restart/editor-optional
      # The progress bar — the 2026-09-04 bench request: "Make Editor-Ready"
      # said it had started and then went quiet for the several minutes a real
      # camera clip takes. It now shows a filling bar, a percentage and a plain
      # time left, in one notification redrawn in place. Same arrangement:
      # builds and checks, never publishes.
      - restart/ingest-progress
      # Phase R5 — one first-boot welcome flow: how the keyboard should work,
      # then the creator apps, then a page of tips. Replaces the creator-apps
      # window as the thing that opens at a first login. Same arrangement:
      # builds and checks, never publishes.
      - restart/welcome
      # Carrying the welcome back into the aquarius-shell repository's own
      # session files, so a session started from a clone of the shell opens
      # the welcome at first login rather than the creator-apps window, and
      # taking the shell commit that has it. Same arrangement: builds and
      # checks, never publishes.
      - restart/shell-welcome
      # The rename to the final image names, and getting every workflow ready
      # for the branch rename. Same arrangement: builds and checks, never
      # publishes — deliberately, because this is the branch that decides what
      # `aquarius-os:latest` means and it must be proven green first.
      - restart/flip
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and publish (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            nvidia: 0
          - variant: nvidia
            nvidia: 1
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # GitHub's runners come with a lot of software we do not need, and the
      # image being built is several gigabytes. Without this the build runs out
      # of disk half way through, which produces a confusing error a long way
      # from the real cause.
      - name: Make room on the build machine
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check the Justfile is valid
        run: just check

      # ------------------------------------------------------------------------
      # Logging out has to leave the machine clean. This runs BEFORE the build
      # because it takes two seconds and the build takes twenty minutes, and
      # there is no reason to spend the twenty minutes to find out that the
      # logout clean-up has a list wrong.
      #
      # The same test runs again INSIDE the image later, against the installed
      # copies, which is the check that actually counts. This one is the fast
      # warning. (Why it exists at all: the bench bug of 2026-09-04 — logging
      # out of Aquarius to go to GNOME bounced off the login screen two or three
      # times, because the session left its settings and its background programs
      # behind. See docs/restart/aquarius-session.md.)
      # ------------------------------------------------------------------------
      - name: Check logging out leaves the machine clean
        run: ./tests/test-session-teardown.sh

      - name: Work out what this image is called
        run: |
          set -euo pipefail
          IMAGE_NAME="$(just variant-image-name ${{ matrix.variant }})"
          NVIDIA="$(just variant-nvidia ${{ matrix.variant }})"
          DEFAULT_TAG="$(just generate-default-tag)"

          # Sanity check: the Justfile and the workflow matrix have to agree
          # about whether this variant wants the NVIDIA driver. If they ever
          # drift, one of the two images gets built as the other and is
          # published under the wrong name.
          if [ "${NVIDIA}" != "${{ matrix.nvidia }}" ]; then
            echo "::error::The Justfile says variant '${{ matrix.variant }}' has NVIDIA=${NVIDIA}, but this workflow says ${{ matrix.nvidia }}. They must agree."
            exit 1
          fi

          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"
          echo "NVIDIA=${NVIDIA}" >> "${GITHUB_ENV}"
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> "${GITHUB_ENV}"
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"

      - name: Build the image
        id: build-image
        run: |
          just build "${IMAGE_NAME}" "${DEFAULT_TAG}" "${NVIDIA}"

      - name: How big is it
        run: |
          set -uo pipefail
          podman images --format '{{.Repository}}:{{.Tag}}  {{.Size}}'

          # ------------------------------------------------------------------
          # THE SIZE, SAID OUT LOUD AND MEASURED AGAINST WHAT IT USED TO BE
          # ------------------------------------------------------------------
          # ⚠️ THIS IS THE WHOLE POINT OF THE 2026-09-04 CHANGE, AND IT IS THE
          # ONE THING THAT WOULD OTHERWISE GO UNNOTICED. Aquarius Editor coming
          # back into the image produces no error and no red text: the build
          # just takes ten minutes longer and every person downloading
          # AquariusOS pays four gigabytes for an app they may never open.
          #
          # So the number is printed beside what it was before the change, and
          # a ceiling is asserted. The ceiling is deliberately generous — this
          # is a warning about one very large app, not a budget for the whole
          # operating system — and it is expressed in bytes, from podman's own
          # machine-readable field, because "11.1 GB" as text sorts wrongly and
          # rounds differently on different days.
          BYTES="$(podman image inspect "${IMAGE_NAME}:${DEFAULT_TAG}" \
            --format '{{.Size}}' 2>/dev/null || echo 0)"
          GB="$(awk -v b="${BYTES}" 'BEGIN { printf "%.1f", b / 1000000000 }')"

          if [ "${NVIDIA}" = "1" ]; then
            WAS="14.2"; CEILING=12000000000
          else
            WAS="11.1"; CEILING=9000000000
          fi

          echo
          echo "=== how big this image is ==="
          echo "  now:    ${GB} GB"
          echo "  before: ${WAS} GB  (with Aquarius Editor baked in, up to 2026-09-04)"
          echo "  saved:  about $(awk -v w="${WAS}" -v g="${GB}" 'BEGIN { printf "%.1f", w - g }') GB"

          if [ "${BYTES}" -eq 0 ]; then
            echo "::warning::podman would not say how big the image is; skipping the size check"
          elif [ "${BYTES}" -le "${CEILING}" ]; then
            echo "  OK   under the ceiling of $(awk -v c="${CEILING}" 'BEGIN { printf "%.1f", c / 1000000000 }') GB"
          else
            echo "::error::this image is ${GB} GB, over the $(awk -v c="${CEILING}" 'BEGIN { printf "%.1f", c / 1000000000 }') GB ceiling."
            echo "Something large has been added back. The usual suspect is Aquarius Editor,"
            echo "which is 4.1 GB and stopped being baked in on 2026-09-04 — check"
            echo "AQUARIUS_APPS in build_files/64-creator-apps.sh."
            exit 1
          fi

      # ------------------------------------------------------------------------
      # THE VERIFICATION
      # ------------------------------------------------------------------------
      # Everything below runs INSIDE the finished image, reading it the way a
      # booted machine would. `podman run --pull=never` guarantees it is looking
      # at the thing that was just built and not at something downloaded.
      - name: Check it says AquariusOS
        run: |
          set -euo pipefail
          cat > /tmp/verify-identity.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }
          check() {   # check "<description>" "<pattern>" "<file>"
            if grep -Eq "$2" "$3"; then ok "$1"; else bad "$1 — /$2/ not found in $3"; fi
          }

          echo "== /usr/lib/os-release =="
          cat /usr/lib/os-release
          echo "== /etc/os-release =="
          ls -l /etc/os-release

          echo "== checks =="
          check "NAME is AquariusOS"            '^NAME="AquariusOS"$'            /etc/os-release
          check "PRETTY_NAME is AquariusOS"     '^PRETTY_NAME="AquariusOS"$'     /etc/os-release
          check "/usr/lib/os-release agrees"    '^NAME="AquariusOS"$'            /usr/lib/os-release
          check "LOGO is ours"                  '^LOGO=aquarius-logo$'           /etc/os-release
          check "DEFAULT_HOSTNAME is aquarius"  '^DEFAULT_HOSTNAME="aquarius"$'  /etc/os-release
          check "VARIANT_ID is aquarius-os"     '^VARIANT_ID=aquarius-os$'       /etc/os-release
          check "VARIANT names an edition"      '^VARIANT="(NVIDIA|Desktop) Edition"$' /etc/os-release
          check "HOME_URL is our repository"    '^HOME_URL="https://github\.com/' /etc/os-release
          check "ID stays fedora (deliberate)"  '^ID=fedora$'                    /etc/os-release

          if grep -q 'Fedora Linux' /etc/os-release; then
            bad "os-release still says 'Fedora Linux' somewhere"
            grep -n 'Fedora Linux' /etc/os-release
          else
            ok "nothing in os-release still says 'Fedora Linux'"
          fi

          # The edition has to match the image being built, or we would publish
          # the AMD image under the NVIDIA name.
          if [ "${EXPECTED_NVIDIA}" = "1" ]; then
            check "this is the NVIDIA edition" '^VARIANT="NVIDIA Edition"$' /etc/os-release
          else
            check "this is the Desktop edition" '^VARIANT="Desktop Edition"$' /etc/os-release
          fi

          INFO=/usr/share/aquarius/image-info.json
          echo "== ${INFO} =="
          cat "${INFO}" || echo "(missing!)"
          if [ ! -f "${INFO}" ]; then
            bad "${INFO} does not exist"
          else
            got_name="$(sed -n 's/.*"image-name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "${INFO}" | head -1)"
            if [ "${got_name}" = "${EXPECTED_IMAGE_NAME}" ]; then
              ok "image-info.json says image-name is '${got_name}'"
            else
              bad "image-info.json says '${got_name}', expected '${EXPECTED_IMAGE_NAME}'"
            fi
          fi

          if [ -s /usr/share/icons/hicolor/scalable/apps/aquarius-logo.svg ]; then
            ok "the AquariusOS icon is installed"
          else
            bad "aquarius-logo.svg is missing — os-release names it and it is not there"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::This image does not identify as AquariusOS."
            exit 1
          fi
          echo "All identity checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            -e EXPECTED_IMAGE_NAME="${IMAGE_NAME}" \
            -e EXPECTED_NVIDIA="${NVIDIA}" \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-identity.sh

      - name: Check the software is really in there
        run: |
          set -euo pipefail
          cat > /tmp/verify-packages.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          echo "== the things this operating system cannot do without =="
          for pkg in \
            ffmpeg fdk-aac mesa-va-drivers-freeworld libheif-freeworld \
            gstreamer1-plugins-bad-freeworld gstreamer1-plugins-ugly \
            pipewire wireplumber NetworkManager NetworkManager-wifi bluez \
            tuned-ppd fwupd linux-firmware plymouth btrfs-progs exfatprogs ntfs-3g \
            gdm gnome-shell mutter gnome-control-center nautilus nautilus-python \
            ptyxis firefox gnome-software \
            gnome-shell-extension-dash-to-dock gnome-shell-extension-appindicator \
            gnome-shell-extension-caffeine gnome-shell-extension-gsconnect \
            xdg-desktop-portal-gnome xorg-x11-server-Xwayland flatpak \
            podman toolbox distrobox \
            langpacks-en langpacks-core-en \
            rsms-inter-fonts jetbrains-mono-fonts
          do
            if rpm -q "${pkg}" > /dev/null 2>&1; then
              ok "${pkg} $(rpm -q --queryformat '%{VERSION}-%{RELEASE}' "${pkg}")"
            else
              bad "${pkg} is NOT installed"
            fi
          done

          echo "== ffmpeg can actually encode the patented formats =="
          ffmpeg -hide_banner -encoders > /tmp/enc.txt 2>&1 || true
          for enc in libx264 libx265 libfdk_aac; do
            if grep -qw "${enc}" /tmp/enc.txt; then ok "ffmpeg has ${enc}"
            else bad "ffmpeg has no ${enc} — this is Fedora's stripped build, not RPM Fusion's"; fi
          done

          echo "== the login screen and the boot target =="
          if [ "$(systemctl get-default)" = "graphical.target" ]; then
            ok "the machine boots to a desktop"
          else
            bad "default target is $(systemctl get-default) — this would boot to a text prompt"
          fi
          if systemctl is-enabled gdm.service > /dev/null 2>&1; then
            ok "GDM is switched on"
          else
            bad "GDM is not switched on — nothing would draw a login screen"
          fi
          if [ -r /usr/share/wayland-sessions/gnome.desktop ]; then
            ok "there is a GNOME session for GDM to offer"
          else
            bad "no /usr/share/wayland-sessions/gnome.desktop — the login screen would have nothing to log into"
          fi

          echo "== Flathub is configured in the image, not in /var =="
          if [ -s /usr/share/flatpak/remotes.d/flathub.flatpakrepo ]; then
            ok "Flathub is preconfigured"
            grep -E '^(Url|Title)=' /usr/share/flatpak/remotes.d/flathub.flatpakrepo | sed 's/^/       /'
          else
            bad "Flathub is not preconfigured — the app store would be empty"
          fi

          echo "== the ingest helper =="
          if /usr/bin/aq-ingest --version; then ok "aq-ingest runs"; else bad "aq-ingest does not run"; fi
          if [ -r /usr/share/nautilus-python/extensions/aquarius_editor_ready.py ]; then
            ok "the 'Make Editor-Ready' right-click menu is installed"
          else
            bad "the 'Make Editor-Ready' right-click menu is missing"
          fi

          echo "== a fresh install knows which filesystem to use =="
          cat /usr/lib/bootc/install/20-aquarius.toml || echo "(missing!)"
          if grep -q '^type = "btrfs"$' /usr/lib/bootc/install/20-aquarius.toml 2>/dev/null; then
            ok "the image tells an installer to use btrfs"
          else
            bad "no root filesystem type in the image — no installer ISO can be built from it"
          fi

          echo "== exactly one kernel =="
          ls -1 /usr/lib/modules/
          n="$(find /usr/lib/modules -mindepth 1 -maxdepth 1 -type d | wc -l)"
          if [ "$n" -eq 1 ]; then ok "one kernel: $(ls -1 /usr/lib/modules/)"
          else bad "$n kernels in the image — a bootable image must have exactly one"; fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::This image is missing software it cannot work without."
            exit 1
          fi
          echo "All package checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-packages.sh

      - name: Check the desktop comes up as Ice-light AquariusOS
        run: |
          set -euo pipefail
          cat > /tmp/verify-look.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          SCHEMAS=/usr/share/glib-2.0/schemas
          echo "== our settings files =="
          ls -l "${SCHEMAS}"/zz1-aquarius-* || echo "(none!)"

          for f in zz1-aquarius-10-look zz1-aquarius-20-shell zz1-aquarius-30-dash-to-dock; do
            if [ -r "${SCHEMAS}/${f}.gschema.override" ]; then ok "${f} is installed"
            else bad "${SCHEMAS}/${f}.gschema.override is missing"; fi
          done

          # Ours must sort last, or somebody else's answer wins and every
          # AquariusOS default is silently ignored.
          first_ours="$(ls "${SCHEMAS}"/zz1-aquarius-*.gschema.override 2>/dev/null | sort | head -1)"
          last_theirs="$(ls "${SCHEMAS}"/*.gschema.override 2>/dev/null | grep -v 'zz1-aquarius' | sort | tail -1)"
          if [ -n "${last_theirs}" ]; then
            if [ "$(printf '%s\n%s\n' "$(basename "${last_theirs}")" "$(basename "${first_ours}")" | sort | tail -1)" = "$(basename "${first_ours}")" ]; then
              ok "our settings sort after everyone else's (last theirs: $(basename "${last_theirs}"))"
            else
              bad "$(basename "${last_theirs}") sorts after ours and would overwrite our defaults"
            fi
          else
            ok "no other override files in the image — ours are the only ones"
          fi

          if [ -s "${SCHEMAS}/gschemas.compiled" ]; then
            ok "the settings index exists"
          else
            bad "${SCHEMAS}/gschemas.compiled is missing — every AquariusOS default would be ignored"
          fi

          # ---------------------------------------------------------------
          # THE CHECK THAT MATTERS: ask the finished image what its settings
          # ARE, exactly as a brand-new user account will on first login.
          # ---------------------------------------------------------------
          echo "== reading the settings back out of the image =="
          want() {   # want <group> <setting> <expected>
            got="$(GSETTINGS_BACKEND=memory gsettings get "$1" "$2" 2>/dev/null || echo '<error>')"
            if [ "${got}" = "$3" ]; then ok "$1 $2 = ${got}"
            else bad "$1 $2 is ${got}, expected $3"; fi
          }
          want org.gnome.desktop.interface color-scheme "'default'"
          want org.gnome.desktop.interface accent-color "'blue'"
          want org.gnome.desktop.interface font-name "'Inter 11'"
          want org.gnome.desktop.interface monospace-font-name "'JetBrains Mono 10'"
          want org.gnome.desktop.background picture-options "'zoom'"
          want org.gnome.shell.extensions.dash-to-dock dock-position "'BOTTOM'"
          want org.gnome.shell.extensions.dash-to-dock dock-fixed "true"
          want org.gnome.shell.extensions.dash-to-dock intellihide "false"

          echo "  ---- for the log ----"
          GSETTINGS_BACKEND=memory gsettings get org.gnome.desktop.background picture-uri || true
          GSETTINGS_BACKEND=memory gsettings get org.gnome.desktop.background picture-uri-dark || true
          GSETTINGS_BACKEND=memory gsettings get org.gnome.shell favorite-apps || true
          GSETTINGS_BACKEND=memory gsettings get org.gnome.shell enabled-extensions || true

          echo "== every pinned app really exists =="
          # ⚠️ ONE NAMED EXCEPTION SINCE 2026-09-04, and it is the same one that
          # build_files/50-aquarius-desktop.sh and the creator-apps check carry.
          # Aquarius Editor is pinned here and is NOT in the image: it is a
          # four-gigabyte download and its menu entry lands in each person's own
          # ~/.local/share/applications/ when they install it. It stays pinned on
          # purpose — GNOME does not draw a name it cannot resolve, so there is no
          # dead square, and the icon appears in its usual seat the moment the app
          # arrives. Named, never a wildcard, so a real typo still fails.
          GSETTINGS_BACKEND=memory gsettings get org.gnome.shell favorite-apps \
            | tr -d "[]' " | tr ',' '\n' | grep -v '^$' > /tmp/favs.txt || true
          while read -r fav; do
            if [ -r "/usr/share/applications/${fav}" ]; then ok "dock: ${fav}"
            elif [ "${fav}" = "aquarius-editor.desktop" ]; then
              ok "dock: ${fav} (installed into each person's home folder on request)"
            else bad "dock: ${fav} is pinned but not installed"; fi
          done < /tmp/favs.txt

          echo "== every enabled extension really exists =="
          GSETTINGS_BACKEND=memory gsettings get org.gnome.shell enabled-extensions \
            | tr -d "[]' " | tr ',' '\n' | grep -v '^$' > /tmp/exts.txt || true
          while read -r ext; do
            if [ -r "/usr/share/gnome-shell/extensions/${ext}/metadata.json" ]; then ok "extension: ${ext}"
            else bad "extension: ${ext} is switched on but not installed"; fi
          done < /tmp/exts.txt

          echo "== the wallpaper =="
          for f in /usr/share/backgrounds/aquarius/the-pour-ice-3840x2160.png \
                   /usr/share/backgrounds/aquarius/the-pour-midnight-3840x2160.png; do
            if [ -s "$f" ]; then ok "$(basename "$f") ($(stat -c '%s' "$f") bytes)"
            else bad "$f is missing — the desktop would come up a flat colour"; fi
          done
          if [ -r /usr/share/gnome-background-properties/aquarius.xml ]; then
            ok "the wallpaper is listed in Settings > Appearance"
          else
            bad "/usr/share/gnome-background-properties/aquarius.xml is missing"
          fi

          echo "== the fonts are findable =="
          for face in Inter "JetBrains Mono" Sora; do
            if fc-list | grep -qi "${face}"; then ok "${face}"
            else bad "${face} is not findable — the interface would fall back to a default"; fi
          done

          if [ "$fails" -ne 0 ]; then
            echo "::error::The AquariusOS look is not correctly applied in this image."
            exit 1
          fi
          echo "All appearance checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-look.sh

      # The two pictures on the Settings > About page are files we replace.
      # Comparing their checksums against the ones in branding/ is the only way
      # to know ours went in — the file names are Fedora's, so the page looks
      # perfectly normal either way.
      - name: Check the About page shows OUR logo
        run: |
          set -euo pipefail
          LIGHT_SUM="$(sha256sum system_files/usr/share/aquarius/branding/aquarius-about-logo.png | awk '{print $1}')"
          DARK_SUM="$(sha256sum system_files/usr/share/aquarius/branding/aquarius-about-logo-white.png | awk '{print $1}')"
          echo "In the repository:"
          echo "  light ${LIGHT_SUM}"
          echo "  dark  ${DARK_SUM}"
          cat > /tmp/verify-logos.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }
          got_light="$(sha256sum /usr/share/pixmaps/fedora_logo_med.png | awk '{print $1}')"
          got_dark="$(sha256sum /usr/share/pixmaps/fedora_whitelogo_med.png | awk '{print $1}')"
          echo "In the image:"
          echo "  light ${got_light}"
          echo "  dark  ${got_dark}"
          if [ "${got_light}" = "${WANT_LIGHT}" ]; then ok "the light About-page logo is ours"
          else bad "the light About-page logo is NOT ours — the page still shows Fedora's"; fi
          if [ "${got_dark}" = "${WANT_DARK}" ]; then ok "the dark About-page logo is ours"
          else bad "the dark About-page logo is NOT ours — the page still shows Fedora's in dark mode"; fi

          # And that the Settings app still reads those two files at all. If
          # Fedora ever moves them, replacing them becomes a no-op that nothing
          # would otherwise notice.
          for want in /usr/share/pixmaps/fedora_logo_med.png /usr/share/pixmaps/fedora_whitelogo_med.png; do
            if grep -a -q "${want}" /usr/bin/gnome-control-center; then
              ok "the Settings app still reads ${want}"
            else
              bad "the Settings app no longer mentions ${want} — replacing it does nothing now"
            fi
          done

          echo "== the login screen logo =="
          if [ -s /usr/share/aquarius/branding/aquarius-logo.png ]; then ok "the login-screen logo file is installed"
          else bad "/usr/share/aquarius/branding/aquarius-logo.png is missing"; fi
          if grep -a -q '/usr/share/aquarius/branding/aquarius-logo.png' /etc/dconf/db/gdm; then
            ok "the compiled login-screen settings really name our logo"
          else
            bad "/etc/dconf/db/gdm does not name our logo — the login screen would be blank there"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::This image is not wearing the AquariusOS logos."
            exit 1
          fi
          echo "All branding checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            -e WANT_LIGHT="${LIGHT_SUM}" \
            -e WANT_DARK="${DARK_SUM}" \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-logos.sh

      # ------------------------------------------------------------------------
      # THE LOGIN SCREEN
      # ------------------------------------------------------------------------
      # Royce's photograph, 2026-09-04: the screen he logs in at was stock
      # Fedora GDM — flat grey, tiny name tiles on a 55" 4K monitor — while the
      # screen he unlocks at inside the session is ours. Two different
      # programs; docs/restart/login.md explains that in plain English.
      #
      # This step checks the half of the answer that lives in GDM: it is the
      # right size, and it is Ice-light with our typefaces and our logo. The
      # other half — our own greeter — is checked further down.
      - name: Check the login screen is ours and the right size
        run: |
          set -euo pipefail
          cat > /tmp/verify-login.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          echo "== GDM reads its own settings database =="
          if [ -r /etc/dconf/profile/gdm ]; then
            ok "/etc/dconf/profile/gdm exists"
            grep -q '^system-db:gdm$' /etc/dconf/profile/gdm \
              && ok "it names system-db:gdm" \
              || bad "it does not name system-db:gdm — every setting below would be ignored"
          else
            bad "/etc/dconf/profile/gdm is missing — GDM would read none of our settings"
          fi

          # THE CHECK THAT MATTERS: read the BUILT binary database, not the
          # keyfiles we wrote. `dconf update` can decline a keyfile in silence,
          # and then the file on disk is perfect and the login screen is stock.
          echo "== what the built database actually contains =="
          if [ ! -s /etc/dconf/db/gdm ]; then
            bad "/etc/dconf/db/gdm was never built"
          else
            ok "/etc/dconf/db/gdm exists ($(stat -c '%s' /etc/dconf/db/gdm) bytes)"
            for want in \
              /usr/share/aquarius/branding/aquarius-logo.png \
              prefer-light \
              'Inter 11' \
              'JetBrains Mono 10' \
              blue
            do
              if grep -a -q "${want}" /etc/dconf/db/gdm; then
                ok "the login screen carries '${want}'"
              else
                bad "the login screen database has no '${want}' in it"
              fi
            done
          fi

          # The logo has to be a real picture. A path pointing at nothing gives
          # a login screen with a blank space where the logo should be, and no
          # error anywhere.
          if [ -s /usr/share/aquarius/branding/aquarius-logo.png ]; then
            ok "the logo the database names is a real file"
          else
            bad "the logo file the database names does not exist — the login screen would show a gap"
          fi

          echo "== the messenger that tells the login screen the screen size =="
          if [ -x /usr/libexec/aquarius-gdm-display ]; then
            ok "/usr/libexec/aquarius-gdm-display is installed and executable"
          else
            bad "/usr/libexec/aquarius-gdm-display is missing — GDM would run at 100% on a 4K screen"
          fi
          if bash -n /usr/libexec/aquarius-gdm-display 2>/dev/null; then
            ok "it is valid shell"
          else
            bad "/usr/libexec/aquarius-gdm-display does not parse as shell"
          fi

          # Run it for real, inside the image. There are no home folders in a
          # container, so the correct answer is "nobody has chosen a screen
          # size yet" and a clean exit. That proves the program runs at all,
          # which is the failure this catches: a syntax error or a missing
          # python3 would otherwise only show up on Royce's machine, at boot.
          echo "  ---- running it (expected: nothing to copy) ----"
          if /usr/libexec/aquarius-gdm-display 2>&1 | sed 's/^/       /'; then
            ok "it runs and exits cleanly with no display arrangement to copy"
          else
            bad "it failed to run — see the lines above"
          fi

          echo "== it runs at boot, before the login screen =="
          if systemctl is-enabled aquarius-gdm-display.service > /dev/null 2>&1; then
            ok "aquarius-gdm-display.service is switched on"
          else
            bad "aquarius-gdm-display.service is not switched on"
          fi
          if grep -q '^Before=display-manager.service$' \
               /usr/lib/systemd/system/aquarius-gdm-display.service; then
            ok "it is ordered before the login screen starts"
          else
            bad "it is not ordered Before=display-manager.service — it could run too late to matter"
          fi

          echo "== it runs again at every logout =="
          if [ -x /etc/gdm/PostSession/Default ]; then
            ok "/etc/gdm/PostSession/Default is executable (GDM skips it silently otherwise)"
          else
            bad "/etc/gdm/PostSession/Default is missing or not executable"
          fi
          if grep -q '/usr/libexec/aquarius-gdm-display' /etc/gdm/PostSession/Default 2>/dev/null; then
            ok "the logout hook calls the messenger"
          else
            bad "the logout hook does not call /usr/libexec/aquarius-gdm-display"
          fi
          if tail -1 /etc/gdm/PostSession/Default 2>/dev/null | grep -q '^exit 0$'; then
            ok "the logout hook always succeeds (a failing one would trap a session)"
          else
            bad "the logout hook does not end in 'exit 0' — a logout could fail on it"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The login screen is not set up the way this image intends."
            exit 1
          fi
          echo "All login screen checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-login.sh

      # Part B of the same photograph: our OWN login screen, drawn by the
      # Aquarius Shell on top of greetd. It ships fully configured and SWITCHED
      # OFF — Royce turns it on with one command once he has seen it work — so
      # this step checks two different things at once: that every piece of it is
      # in the image, and that none of it has been switched on by accident.
      #
      # ⚠️ THE "SWITCHED OFF" HALF IS NOT PAPERWORK. Two login managers both
      # enabled is a black screen with no way in, and a build that shipped that
      # would be a build that bricks the bench.
      - name: Check the AquariusOS login screen is ready and switched off
        run: |
          set -euo pipefail
          cat > /tmp/verify-greeter.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          echo "== exactly one login manager is switched on =="
          if systemctl is-enabled gdm.service > /dev/null 2>&1; then
            ok "GDM is switched on (this image still boots to GNOME's login screen)"
          else
            bad "GDM is not switched on — this image would boot to a text prompt"
          fi
          if systemctl is-enabled greetd.service > /dev/null 2>&1; then
            bad "greetd is switched on TOO. Two login managers is a black screen with no way in."
          else
            ok "greetd is installed and switched off, as intended"
          fi

          echo "== greetd is configured, and configured for OUR greeter =="
          if [ -r /etc/greetd/config.toml ]; then
            ok "/etc/greetd/config.toml exists"
          else
            bad "/etc/greetd/config.toml is missing"
          fi
          # It has to PARSE. A broken TOML file here is a login screen that
          # never appears, with the reason in a log nobody can reach because
          # they cannot log in.
          if python3 -c "import tomllib; tomllib.load(open('/etc/greetd/config.toml','rb'))" 2>/dev/null; then
            ok "it is valid TOML"
          else
            bad "/etc/greetd/config.toml does not parse"
          fi
          if grep -q '^command = "/usr/libexec/aquarius-greeter"$' /etc/greetd/config.toml; then
            ok "it runs the AquariusOS login screen"
          else
            bad "greetd is not pointed at /usr/libexec/aquarius-greeter"
          fi
          # Fedora's greetd package creates a user called "greetd". Almost every
          # guide on the internet says "greeter", which is Arch's name for it,
          # and the wrong name here is a login screen that never starts.
          if grep -q '^user = "greetd"$' /etc/greetd/config.toml; then
            ok "it runs as 'greetd' — the user Fedora's package actually creates"
          else
            bad "greetd's config names a user other than 'greetd'"
          fi
          if getent passwd greetd > /dev/null 2>&1; then
            ok "that user exists in this image"
          else
            bad "there is no 'greetd' user — the login screen could not start as it"
          fi

          echo "== the login screen's own pieces =="
          for f in /usr/libexec/aquarius-greeter \
                   /usr/libexec/aquarius-greeter-shell \
                   /usr/libexec/aquarius-greeter-info; do
            if [ -x "$f" ]; then ok "$(basename "$f") is installed and executable"
            else bad "$f is missing or not executable"; fi
          done
          for f in /usr/libexec/aquarius-greeter /usr/libexec/aquarius-greeter-shell; do
            if bash -n "$f" 2>/dev/null; then ok "$(basename "$f") is valid shell"
            else bad "$f does not parse as shell"; fi
          done

          # Run the account-and-desktop lister for real. There are no ordinary
          # user accounts in a build container, so an empty people list is the
          # correct answer — but there ARE two session files, and the Aquarius
          # Desktop must be one of them and must be first, because the login
          # screen shows the first one as the default.
          echo "  ---- what it says about this image ----"
          /usr/libexec/aquarius-greeter-info --desktops | sed 's/^/       /'
          if python3 - <<'PY'
          import json, subprocess, sys
          done = subprocess.run(["/usr/libexec/aquarius-greeter-info"],
                                capture_output=True, text=True)
          if done.returncode != 0:
              print("  FAIL it exited %d: %s" % (done.returncode, done.stderr.strip()))
              sys.exit(1)
          data = json.loads(done.stdout)
          names = [d["id"] for d in data["desktops"]]
          if "aquarius" not in names:
              print("  FAIL the Aquarius Desktop is not in the list: %s" % names)
              sys.exit(1)
          if names[0] != "aquarius":
              print("  FAIL the Aquarius Desktop is not first, so it would not be "
                    "the default: %s" % names)
              sys.exit(1)
          if "gnome" not in " ".join(names).lower():
              print("  FAIL GNOME is not offered as an alternative: %s" % names)
              sys.exit(1)
          print("  OK   it offers %s, Aquarius Desktop first" % names)
          sys.exit(0)
          PY
          then :; else bad "the account-and-desktop lister did not answer the way the login screen needs"; fi

          echo "== the login screen's window manager configuration =="
          if [ -r /usr/share/aquarius/greeter-labwc/rc.xml ]; then
            ok "/usr/share/aquarius/greeter-labwc/rc.xml is installed"
          else
            bad "/usr/share/aquarius/greeter-labwc/rc.xml is missing"
          fi
          if python3 -c "import xml.etree.ElementTree as e; e.parse('/usr/share/aquarius/greeter-labwc/rc.xml')" 2>/dev/null; then
            ok "it is well-formed XML (labwc ignores a broken one in silence)"
          else
            bad "the login screen's rc.xml is not valid XML"
          fi
          # No default key bindings on a login screen: there is one window and
          # it must not be closable by Alt+F4.
          #
          # ⚠️ ASKED BY PARSING THE XML, NOT BY grep. The first version of this
          # check grepped for "<default />" and failed on 2026-09-04 against the
          # COMMENT in that file explaining why there is no <default /> in it.
          # A check that fails on its own explanation teaches people to delete
          # the explanation, so this one asks the document instead of the text.
          if python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          tree = ET.parse('/usr/share/aquarius/greeter-labwc/rc.xml')
          found = [e.tag for e in tree.iter() if e.tag == 'default']
          if found:
              print("  FAIL rc.xml has a <default /> element — labwc's own key")
              print("       bindings would be loaded, and Alt+F4 would close the")
              print("       login screen.")
              sys.exit(1)
          print("  OK   it loads no default key bindings")
          sys.exit(0)
          PY
          then :; else bad "the login screen's window manager loads labwc's default key bindings"; fi

          echo "== the login screen itself =="
          GREETER_DIR=/usr/share/aquarius/shell/greeter
          for f in greeter.qml qmldir GreeterState.qml GreeterWindow.qml \
                   GreeterCard.qml GreeterField.qml GreeterAvatar.qml \
                   GreeterStepArrow.qml GreeterDesktopPill.qml; do
            if [ -s "${GREETER_DIR}/${f}" ]; then ok "${f}"
            else bad "${GREETER_DIR}/${f} is missing — the login screen would not draw"; fi
          done
          # The singleton has to be declared or the whole thing fails to load
          # with a message that does not mention qmldir.
          if grep -q '^singleton GreeterState ' "${GREETER_DIR}/qmldir"; then
            ok "GreeterState is declared a singleton"
          else
            bad "${GREETER_DIR}/qmldir does not declare GreeterState"
          fi
          # And the path the QML calls has to be the path the image installed.
          if grep -q '/usr/libexec/aquarius-greeter-info' "${GREETER_DIR}/GreeterState.qml"; then
            ok "the login screen calls the helper at the path this image installs it to"
          else
            bad "the login screen and the image disagree about where the account lister lives"
          fi

          echo "== the Quickshell in this image can talk to greetd =="
          # Without SERVICE_GREETD the greeter's very first import fails, the
          # file refuses to load, and greetd shows a black screen. The build
          # stage records which features were compiled in.
          if grep -q 'SERVICE_GREETD=ON' /usr/share/aquarius/quickshell-build.txt; then
            ok "Quickshell was built with the greetd service in it"
          else
            bad "Quickshell was built WITHOUT SERVICE_GREETD — the login screen could never load"
            sed 's/^/       /' /usr/share/aquarius/quickshell-build.txt || true
          fi

          echo "== the switch, and the way back =="
          if bash -n /usr/bin/aq 2>/dev/null; then ok "aq is valid shell"
          else bad "/usr/bin/aq does not parse as shell"; fi
          if /usr/bin/aq login --help > /dev/null 2>&1; then
            ok "'aq login --help' works"
          else
            bad "'aq login' is not there — there would be no supported way to switch or switch back"
          fi
          echo "  ---- what 'aq login status' says about this image ----"
          /usr/bin/aq login status 2>&1 | sed 's/^/       /' || true
          if /usr/bin/aq login status 2>/dev/null | grep -qi "GNOME's login screen"; then
            ok "it agrees that this image boots to GDM"
          else
            bad "'aq login status' does not report GDM as the login screen"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The AquariusOS login screen is not correctly set up in this image."
            exit 1
          fi
          echo "All AquariusOS login screen checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-greeter.sh

      # ------------------------------------------------------------------------
      # THE BOOT PATH
      # ------------------------------------------------------------------------
      # Everything a person sees before the login screen: the boot menu, the
      # splash screen, and the text banner over a text login prompt.
      #
      # The splash is the one piece of branding in the whole image that CANNOT be
      # checked by looking at files on disk alone. A copy of it is baked into the
      # boot ramdisk (initramfs.img), and it is that copy the machine actually
      # uses. Change the theme, forget to rebuild the ramdisk, and the machine
      # shows Fedora's splash forever while every file on disk looks perfect.
      # So the last part of this step opens the ramdisk and reads what is inside.
      - name: Check the boot screen says AquariusOS
        run: |
          set -euo pipefail
          # The picture in the middle of the boot screen, checksummed from the
          # repository. Same trick as the About-page step above: the only way to
          # know OUR picture went in is to compare the bytes.
          WATERMARK_SUM="$(sha256sum system_files/usr/share/plymouth/themes/aquarius/watermark.png | awk '{print $1}')"
          REPO_FRAMES="$(find system_files/usr/share/plymouth/themes/aquarius -name 'throbber-*.png' | wc -l | tr -d ' ')"
          echo "In the repository: watermark ${WATERMARK_SUM}, ${REPO_FRAMES} throbber frames"

          cat > /tmp/verify-boot.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }
          check() {   # check "<description>" "<pattern>" "<file>"
            if [ ! -r "$3" ]; then bad "$1 — $3 does not exist"; return; fi
            if grep -Eq "$2" "$3"; then ok "$1"; else bad "$1 — /$2/ not found in $3"; fi
          }

          THEME=/usr/share/plymouth/themes/aquarius

          echo "== the splash program and its parts =="
          for pkg in plymouth plymouth-plugin-two-step plymouth-plugin-label \
                     plymouth-theme-spinner plymouth-system-theme dracut; do
            if rpm -q "${pkg}" > /dev/null 2>&1; then ok "${pkg} $(rpm -q --queryformat '%{VERSION}-%{RELEASE}' "${pkg}")"
            else bad "${pkg} is NOT installed"; fi
          done

          echo "== the Aquarius theme on disk =="
          ls -l "${THEME}" || true
          FRAMES="$(find "${THEME}" -name 'throbber-*.png' | wc -l)"
          echo "throbber frames in the image: ${FRAMES}"
          if [ "${FRAMES}" -eq "${WANT_FRAMES}" ]; then ok "all ${WANT_FRAMES} throbber frames are installed"
          else bad "${FRAMES} throbber frames in the image, expected ${WANT_FRAMES}"; fi

          got="$(sha256sum "${THEME}/watermark.png" 2>/dev/null | awk '{print $1}')"
          echo "watermark.png in the image: ${got:-<missing>}"
          if [ "${got}" = "${WANT_WATERMARK}" ]; then ok "the picture on the boot screen is ours"
          else bad "the boot screen picture is NOT the one in the repository"; fi

          # lock.png is the one file the two-step plug-in genuinely requires. If
          # it is missing, a machine with an encrypted disk shows no password box
          # and appears to hang.
          if [ -s "${THEME}/lock.png" ]; then ok "the disk-password box has its artwork"
          else bad "${THEME}/lock.png is missing — an encrypted machine would show no password box"; fi

          echo "== the theme's own settings =="
          cat "${THEME}/aquarius.plymouth" | grep -vE '^[[:space:]]*(#|$)' || true
          check "the theme uses the two-step plug-in"  '^ModuleName=two-step$'          "${THEME}/aquarius.plymouth"
          check "the background is Midnight"           '^BackgroundStartColor=0x06070C$' "${THEME}/aquarius.plymouth"
          check "the progress colour is starlight"     '^ProgressBarForegroundColor=0x8AB4FF$' "${THEME}/aquarius.plymouth"

          # THE SETTING THAT REMOVES THE MANUFACTURER'S BADGE. It is per-screen,
          # so it has to be false in every screen the theme defines — one missed
          # section lets a Dell or ASUS logo back in on that screen only.
          if grep -q '^UseFirmwareBackground=true$' "${THEME}/aquarius.plymouth"; then
            bad "the theme switches the firmware/manufacturer logo ON somewhere"
            grep -n '^UseFirmwareBackground=' "${THEME}/aquarius.plymouth"
          else
            ok "the firmware/manufacturer logo is off in every screen ($(grep -c '^UseFirmwareBackground=false$' "${THEME}/aquarius.plymouth") of them)"
          fi

          echo "== which splash this machine is set to =="
          echo "--- /etc/plymouth/plymouthd.conf ---"; cat /etc/plymouth/plymouthd.conf 2>/dev/null || echo "(missing)"
          echo "--- /usr/share/plymouth/plymouthd.defaults ---"; cat /usr/share/plymouth/plymouthd.defaults 2>/dev/null || echo "(missing)"
          echo "---"
          check "this machine's splash is aquarius" '^Theme=aquarius$' /etc/plymouth/plymouthd.conf

          echo "== kernel options =="
          for f in /usr/lib/bootc/kargs.d/*.toml; do echo "--- ${f} ---"; cat "${f}"; done
          check "the boot options ask for a splash" 'kargs = \["quiet", "splash", "rhgb"\]' \
                /usr/lib/bootc/kargs.d/05-aquarius-boot.toml

          echo "== the boot menu =="
          # On an image-based system the boot-menu entry text is generated from
          # PRETTY_NAME, not from /etc/default/grub. Both are checked: the first
          # is what actually decides, the second is what a person goes looking
          # for and what a non-image boot path would use.
          check "PRETTY_NAME is what the menu entries are named from" \
                '^PRETTY_NAME="AquariusOS"$' /etc/os-release
          check "GRUB_DISTRIBUTOR is AquariusOS" \
                '^GRUB_DISTRIBUTOR="AquariusOS"$' /etc/default/grub
          # Evidence, for the log, that the tooling which writes the boot-menu
          # entries really does read PRETTY_NAME to title them. Same technique
          # as the About-page step above: look for the string inside the
          # compiled program.
          echo "Which programs name PRETTY_NAME internally:"
          for b in /usr/bin/ostree /usr/bin/bootc /usr/bin/bootupctl; do
            [ -e "${b}" ] || continue
            if grep -a -q 'PRETTY_NAME' "${b}"; then
              echo "  ${b} reads PRETTY_NAME"
            else
              echo "  ${b} does not name PRETTY_NAME directly (it may go through a library)"
            fi
          done

          echo "== the text banners =="
          for f in /etc/issue /etc/issue.net /etc/fedora-release /etc/system-release /etc/redhat-release; do
            echo "--- ${f} ---"; cat "${f}" 2>/dev/null || echo "(missing)"
          done
          echo "--- /etc/motd (should be empty) ---"; cat /etc/motd 2>/dev/null || echo "(missing)"
          echo "---"
          check "the console banner says AquariusOS" '^AquariusOS$' /etc/issue
          check "the network banner says AquariusOS" '^AquariusOS$' /etc/issue.net
          check "the old-style release line is ours" '^AquariusOS release ' /etc/fedora-release
          if [ -f /etc/motd ] && [ ! -s /etc/motd ]; then ok "/etc/motd is empty (deliberate)"
          elif [ ! -e /etc/motd ]; then ok "/etc/motd does not exist (fine)"
          else bad "/etc/motd has content — it would print on every ssh login: $(cat /etc/motd)"; fi

          echo "== neither Fedora welcome screen is installed =="
          for pkg in gnome-tour gnome-initial-setup; do
            if rpm -q "${pkg}" > /dev/null 2>&1; then bad "${pkg} is installed — it shows a 'Welcome to Fedora' screen"
            else ok "${pkg} is not installed"; fi
          done

          # ---------------------------------------------------------------
          # THE CHECK THAT MATTERS: open the boot ramdisk and read it.
          # ---------------------------------------------------------------
          echo "== inside the boot ramdisk =="
          KVER="$(rpm -q --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}' kernel-core)"
          IMG="/usr/lib/modules/${KVER}/initramfs.img"
          echo "kernel  : ${KVER}"
          echo "ramdisk : ${IMG}"
          if [ ! -s "${IMG}" ]; then
            bad "${IMG} is missing or empty — this image has no boot ramdisk at all"
          else
            ok "the ramdisk exists ($(stat -c '%s' "${IMG}") bytes, mode $(stat -c '%a' "${IMG}"))"

            # `lsinitrd -m` prints a header and the early-CPIO file listing
            # before the module names, so everything after the line
            # "dracut modules:" is the real list.
            echo "-- the parts it was built from --"
            lsinitrd -m "${IMG}" > /tmp/lsinitrd-raw.txt 2>/dev/null || true
            awk '/^dracut modules:/ { seen = 1; next } seen' /tmp/lsinitrd-raw.txt \
              | tr -d '[:blank:]' | grep -E '^[a-z0-9][a-z0-9._-]*$' | sort -u > /tmp/initrd-mods.txt || true
            tr '\n' ' ' < /tmp/initrd-mods.txt; echo
            for part in plymouth ostree bootc; do
              if grep -qx "${part}" /tmp/initrd-mods.txt; then ok "the ramdisk contains the '${part}' part"
              else bad "the ramdisk has no '${part}' part"; fi
            done

            echo "-- everything Plymouth-related inside it --"
            lsinitrd "${IMG}" 2>/dev/null | grep -i plymouth > /tmp/initrd-ply.txt || true
            cat /tmp/initrd-ply.txt || true
            echo "--"

            # These three lines are the evidence that the splash is really in the
            # ramdisk and not just on disk.
            for want in 'plymouth/themes/aquarius/aquarius.plymouth' \
                        'plymouth/themes/aquarius/watermark.png' \
                        'plymouth/themes/aquarius/throbber-0001.png'; do
              if grep -q "${want}" /tmp/initrd-ply.txt; then
                ok "in the ramdisk: $(grep -m1 "${want}" /tmp/initrd-ply.txt | awk '{print $NF}')"
              else
                bad "${want} is NOT inside the ramdisk"
              fi
            done

            # And that the setting inside the ramdisk names our theme rather than
            # one of Fedora's. This is the "no spinner, no bgrt as the default"
            # check — the file is what decides, not which folders happen to be
            # present.
            : > /tmp/initrd-conf.txt
            found=0
            for c in /etc/plymouth/plymouthd.conf /usr/share/plymouth/plymouthd.defaults; do
              # Paths inside a ramdisk are stored with no leading slash; ask both ways.
              if { lsinitrd -f "${c}" "${IMG}" > /tmp/one-conf.txt 2>/dev/null \
                   || lsinitrd -f "${c#/}" "${IMG}" > /tmp/one-conf.txt 2>/dev/null; } && [ -s /tmp/one-conf.txt ]; then
                found=1
                echo "-- ${c}, inside the ramdisk --"; cat /tmp/one-conf.txt
                cat /tmp/one-conf.txt >> /tmp/initrd-conf.txt
              fi
            done
            if [ "${found}" -eq 0 ]; then
              bad "the ramdisk carries no splash setting — it would fall back to Fedora's bgrt"
            elif grep -q '^Theme=aquarius$' /tmp/initrd-conf.txt; then
              ok "the setting inside the ramdisk says Theme=aquarius (so not spinner, not bgrt)"
            else
              bad "the setting inside the ramdisk does not say Theme=aquarius:"
              cat /tmp/initrd-conf.txt
            fi
            if grep -qE '^Theme=(bgrt|spinner|charge)$' /tmp/initrd-conf.txt; then
              bad "a Fedora theme is named as the default inside the ramdisk"
            fi
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The boot path is not correctly branded in this image."
            exit 1
          fi
          echo "All boot-path checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            -e WANT_WATERMARK="${WATERMARK_SUM}" \
            -e WANT_FRAMES="${REPO_FRAMES}" \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-boot.sh

      # ------------------------------------------------------------------------
      # THE "NO STRAY NAMES" AUDIT
      # ------------------------------------------------------------------------
      # Royce's instruction was "anything that still says Bazzite should say
      # Aquarius". This step is what keeps that true next month, when somebody
      # adds a feature and copies a snippet from somewhere.
      #
      # It is two different rules, on purpose:
      #
      #   BAZZITE  must appear NOWHERE. Zero — not in a file name, not in an
      #            installed package, not in the text of any file this build
      #            writes to, comments included. This branch is built from bare
      #            Fedora and has no relationship to Bazzite, so any occurrence
      #            is a mistake by definition.
      #
      #            ⚠️ This rule is stricter than the Fedora one below, and that
      #            asymmetry is on purpose. When this check was first written it
      #            found five real hits, all of them historical notes in the
      #            comments of two GNOME settings files ("the old Bazzite line
      #            pinned all three", and so on). Those notes are genuinely
      #            useful and they were kept — but reworded to say "the line
      #            this replaced", because those files are installed onto every
      #            machine, and Royce's instruction was that a machine should
      #            not say Bazzite anywhere. The repository's own documentation,
      #            which does not ship, still tells the story by name.
      #
      #   FEDORA   must not appear in the places a PERSON reads a name. It is
      #            expected and correct in the places a PROGRAM reads one —
      #            AquariusOS really is Fedora underneath, and pretending
      #            otherwise breaks package installation and security scanning.
      #            The allowed places are listed, with a reason each, below.
      # ------------------------------------------------------------------------
      # The Aquarius Desktop
      # ------------------------------------------------------------------------
      # Phase R2 added a SECOND desktop beside GNOME: our own shell, on the
      # labwc window manager. Two of its three parts are compiled during the
      # build rather than installed from Fedora, and a compiled part that goes
      # wrong does not announce itself — it produces an image that builds, that
      # publishes, and that drops a person straight back to the login screen the
      # moment they pick "Aquarius Desktop".
      #
      # So this step RUNS both programs inside the finished image and reads what
      # they say. `qs --version` in particular is the exact thing that failed on
      # the bench on 2026-09-02, when a Quickshell built against a different Qt
      # died on its first instruction and left an empty desktop for eighteen
      # minutes with nothing in any log.
      - name: Check the Aquarius Desktop is really in there
        run: |
          set -euo pipefail

          # The commit the image is supposed to have baked in, read from the one
          # place versions live, and handed to the checker so it can compare.
          # shellcheck disable=SC1091
          EXPECT_SHELL_REF="$(grep -E '^AQUARIUS_SHELL_REF=' aquarius-os.env | cut -d'"' -f2)"
          echo "expecting aquarius-shell ${EXPECT_SHELL_REF}"

          cat > /tmp/verify-session.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          echo "== the window manager =="
          if [ -x /usr/bin/labwc ]; then ok "labwc is installed"; else bad "labwc is missing"; fi
          LABWC_SAYS="$(/usr/bin/labwc --version 2>&1 || true)"
          echo "       ${LABWC_SAYS}"
          case "${LABWC_SAYS}" in
            *0.20.*|*0.2[1-9].*|*0.[3-9][0-9].*)
              ok "labwc is 0.20 or newer — the release with HDR and colour management" ;;
            *)
              bad "labwc reports '${LABWC_SAYS}'. Fedora 44's own 0.9.6 is NOT good enough: no HDR, no colour management, and that is the whole reason this project uses labwc." ;;
          esac
          # labwc lists its optional features in that same line with a + or a -.
          # XWayland must never be a minus: it is what runs X11-only software,
          # and on a creator machine that means DaVinci Resolve. This went wrong
          # once (2026-09-03) and the build printed one warning and carried on.
          case "${LABWC_SAYS}" in
            *+xwayland*) ok "labwc can run X11 software (DaVinci Resolve needs this)" ;;
            *) bad "labwc was built WITHOUT XWayland — DaVinci Resolve and every other X11-only program would not start. Its report: ${LABWC_SAYS}" ;;
          esac

          echo "== the shell runtime =="
          # qs is a symlink to quickshell; -e follows it, -L does not.
          if [ -e /usr/bin/qs ] || [ -L /usr/bin/qs ]; then ok "the qs command is installed"; else bad "qs is missing"; fi
          QS_STATUS=0
          # A build container has no runtime directory and no screen. Give Qt
          # both, so that what this measures is the program and not the box.
          export XDG_RUNTIME_DIR=/tmp/aq-verify-runtime
          mkdir -p "${XDG_RUNTIME_DIR}"; chmod 0700 "${XDG_RUNTIME_DIR}"
          export QT_QPA_PLATFORM=offscreen
          QS_SAYS="$(/usr/bin/qs --version 2>&1)" || QS_STATUS=$?
          echo "       ${QS_SAYS}"
          if [ "${QS_STATUS}" -ne 0 ]; then
            bad "qs cannot start (exit ${QS_STATUS}). If that message says 'undefined symbol', Quickshell and Qt in this image do not match and the desktop would never draw a bar."
          else
            ok "qs starts"
            case "${QS_SAYS}" in
              *0.3*) ok "Quickshell is 0.3.x" ;;
              *) bad "Quickshell reports '${QS_SAYS}' — expected 0.3.x. 0.2.1 has no Networking or Bluetooth module and the shell imports both." ;;
            esac
          fi
          echo "       built as: $(cat /usr/share/aquarius/quickshell-build.txt 2>/dev/null | tr '\n' ' ')"

          echo "== the shell that was baked in =="
          # A missing shell is a WARNING, not a failure. The shell lives in a
          # separate repository and a container build has no GitHub account, so
          # if that repository is private the image is finished without it. What
          # ships is then a working desktop with no bar, which says so on screen.
          # Everything else in this step still has to be right.
          sed 's/^/       /' /usr/share/aquarius/shell-build.txt 2>/dev/null || \
            bad "there is no /usr/share/aquarius/shell-build.txt — the shell stage did not run at all"
          if [ -s /usr/share/aquarius/shell/shell.qml ]; then
            ok "the shell is installed"
            GOT_REF="$(grep -E '^commit=' /usr/share/aquarius/shell-build.txt 2>/dev/null | cut -d= -f2)"
            if [ "${GOT_REF}" = "${EXPECT_SHELL_REF}" ]; then
              ok "it is the pinned commit"
            else
              bad "the image contains shell commit '${GOT_REF}' but aquarius-os.env pins '${EXPECT_SHELL_REF}'"
            fi
            for f in theme/Ice.qml theme/Midnight.qml components/bar/TopBar.qml \
                     components/dock/Dock.qml components/search/FlowSearch.qml \
                     components/notifications/NotificationLayer.qml; do
              if [ -s "/usr/share/aquarius/shell/${f}" ]; then ok "${f}"; else bad "${f} is missing"; fi
            done
            for junk in harness tests .git .github; do
              if [ -e "/usr/share/aquarius/shell/${junk}" ]; then
                bad "${junk}/ was shipped inside the operating system and should not have been"
              else
                ok "${junk}/ was correctly left out of the image"
              fi
            done
            echo "== every Quickshell module the shell imports =="
            # Quickshell compiles its QML modules INTO the program rather than
            # installing folders for them, so there is nothing on disk to look
            # for. What there is, is the build's own record of which features it
            # compiled. The mapping from an import line to a feature name lives
            # in build_files/55-aquarius-session.sh and is checked there in full;
            # this repeats the two that are new in 0.3 and would silently remove
            # the Wi-Fi and Bluetooth tiles if they ever went missing.
            FEATURES="$(grep -E '^features=' /usr/share/aquarius/quickshell-build.txt 2>/dev/null | cut -d= -f2-)"
            echo "       ${FEATURES}"
            for pair in "Quickshell.Networking:NETWORK" "Quickshell.Bluetooth:BLUETOOTH" \
                        "Quickshell.Services.Notifications:SERVICE_NOTIFICATIONS" \
                        "Quickshell.Services.Pipewire:SERVICE_PIPEWIRE" \
                        "Quickshell.Services.SystemTray:SERVICE_STATUS_NOTIFIER" \
                        "Quickshell.Services.UPower:SERVICE_UPOWER" \
                        "Quickshell.Wayland:WAYLAND"; do
              imp="${pair%%:*}"; feat="${pair##*:}"
              if ! grep -rqE "^import ${imp}\$" /usr/share/aquarius/shell 2>/dev/null; then
                continue
              fi
              if printf '%s' "${FEATURES}" | grep -q "${feat}=ON"; then
                ok "${imp} (built in as ${feat})"
              else
                bad "${imp} is imported by the shell but Quickshell was built without ${feat}"
              fi
            done
          else
            echo "::warning::This image has no Aquarius Shell — /usr/share/aquarius/shell-build.txt says why. The Aquarius Desktop starts and explains itself on screen. Make the shell repository public and rebuild to bake it in."
            echo "  NOTE the Aquarius Shell is not in this image. Everything else"
            echo "       about the Aquarius Desktop is, and the session tells the"
            echo "       person what is going on rather than showing a blank screen."
            # The one thing that must still be true: the image has to KNOW it is
            # missing, so the session can say so.
            if grep -q '^status=unavailable$' /usr/share/aquarius/shell-build.txt 2>/dev/null; then
              ok "the image records why the shell is absent"
            else
              bad "the shell is absent and the image does not say why — the session would show a blank screen with no explanation"
            fi
          fi

          echo "== the login screen entry =="
          ENTRY=/usr/share/wayland-sessions/aquarius.desktop
          if [ -r "${ENTRY}" ]; then
            ok "${ENTRY} exists"; sed 's/^/       /' "${ENTRY}"
          else
            bad "${ENTRY} is missing — nothing would appear at the login screen"
          fi
          grep -q '^Name=Aquarius Desktop$'        "${ENTRY}" && ok "it is called 'Aquarius Desktop'"       || bad "wrong Name="
          grep -q '^DesktopNames=Aquarius$'        "${ENTRY}" && ok "it names the desktop 'Aquarius'"        || bad "wrong DesktopNames="
          EXEC="$(grep -E '^Exec=' "${ENTRY}" | cut -d= -f2-)"
          if [ -x "${EXEC}" ]; then ok "its Exec target ${EXEC} exists and is executable"
          else bad "its Exec target '${EXEC}' is missing or not executable — picking the session would do nothing"; fi

          # GNOME must still be there. A desktop that REPLACES the fallback
          # rather than sitting beside it is the one thing the design forbids.
          if [ -r /usr/share/wayland-sessions/gnome.desktop ]; then
            ok "the GNOME session is still there to fall back to"
          else
            bad "GNOME's session entry has gone — the fallback is gone"
          fi

          echo "== the scripts a login depends on =="
          for s in /usr/bin/aquarius-session /usr/libexec/aquarius-shell-start; do
            if bash -n "${s}" 2>/tmp/synerr; then ok "${s} is valid shell script"
            else bad "${s} has a syntax error: $(cat /tmp/synerr)"; fi
          done

          # ⚠️ THE 2026-09-03 LOCALE FIX. Running the shell by hand on the bench
          # printed 'Detected locale "C" ... which is not UTF-8'. Three things
          # have to be true for that to stay fixed, and each fails separately:
          # the locale data is installed, the system says which locale to use,
          # and the session launcher actually exports it.
          echo "== the language the machine speaks =="
          if rpm -q glibc-langpack-en > /dev/null 2>&1; then
            ok "glibc-langpack-en $(rpm -q --queryformat '%{VERSION}-%{RELEASE}' glibc-langpack-en)"
          else
            bad "glibc-langpack-en is NOT installed — en_US.UTF-8 would not exist on this machine"
          fi

          if [ -r /etc/locale.conf ]; then
            ok "/etc/locale.conf exists"
            echo "       $(tr '\n' ' ' < /etc/locale.conf)"
            grep -q '^LANG=en_US\.UTF-8$' /etc/locale.conf \
              && ok "it sets LANG=en_US.UTF-8" \
              || bad "it does not set LANG=en_US.UTF-8 — every program falls back to the 7-bit C locale"
          else
            bad "/etc/locale.conf is missing — nothing tells a login which language to use"
          fi

          # glibc spells it "en_US.utf8" in this list and "en_US.UTF-8" in a
          # config file. Same locale, two spellings.
          if locale -a 2>/dev/null | grep -qix 'en_US.utf8'; then
            ok "the en_US.UTF-8 locale is really generated"
          else
            bad "en_US.UTF-8 is named in /etc/locale.conf but was never generated"
          fi

          # And the launcher has to hand it on. A locale the session does not
          # export is a locale the shell never sees.
          grep -q 'export LANG=' /usr/bin/aquarius-session \
            && ok "aquarius-session exports LANG" \
            || bad "aquarius-session does not export LANG — the shell would start in the C locale"
          # The launcher no longer types out the list of variables it hands to
          # systemd — since the logout fix of 2026-09-04 it hands over
          # AQ_SESSION_ENV_PUSH from /usr/libexec/aquarius-session-lib, so that
          # the SAME list is what gets removed again at logout. So the question
          # "does LANG get handed on?" is now asked of the library.
          # (An earlier version of this check read the launcher line by line and
          # missed a backslash continuation, which failed a build on 2026-09-04
          # with the launcher perfectly correct. Reading one plain list is the
          # cure for that whole class of mistake.)
          AQ_PUSHED="$(grep '^AQ_SESSION_ENV_PUSH=' /usr/libexec/aquarius-session-lib \
                       | cut -d'"' -f2 || true)"
          echo "       the session hands over: ${AQ_PUSHED}"
          case " ${AQ_PUSHED} " in
            *" LANG "*)
              ok "it also hands LANG to systemd and D-Bus (for portals started later)" ;;
            *)
              bad "LANG is not pushed to systemd/D-Bus — a portal started later would use the C locale" ;;
          esac
          grep -q 'aq_push_env \${\?AQ_SESSION_ENV_PUSH' /usr/bin/aquarius-session \
            && ok "and the launcher really uses that list rather than a copy of it" \
            || bad "the launcher does not use AQ_SESSION_ENV_PUSH — the start-up list and the logout list can drift apart"

          echo "== the window manager's configuration =="
          for f in rc.xml autostart shutdown environment; do
            if [ -s "/usr/share/aquarius/labwc/${f}" ]; then ok "labwc/${f}"; else bad "labwc/${f} is missing"; fi
          done
          # The corrected form of the summon command. Passing a configuration
          # name here is the mistake the bench caught on 2026-09-01: qs would
          # read it as the IPC target name and silently do nothing.
          if grep -q 'command="qs ipc call search toggle"' /usr/share/aquarius/labwc/rc.xml; then
            ok "Super+Space summons the search palette, in the corrected form"
          else
            bad "the Super+Space binding is not the corrected 'qs ipc call search toggle'"
          fi
          grep -q '<action name="Exit" />' /usr/share/aquarius/labwc/rc.xml \
            && ok "Super+Shift+E leaves the session" || bad "there is no way to leave the session by keyboard"

          echo "== portals =="
          PC=/usr/share/xdg-desktop-portal/aquarius-portals.conf
          if [ -r "${PC}" ]; then ok "${PC} exists"; else bad "${PC} is missing — screen recording would silently do nothing"; fi
          grep -q '^default=gtk$' "${PC}" && ok "default back end is gtk" || bad "default back end is not gtk"
          grep -q '^org.freedesktop.impl.portal.ScreenCast=wlr$'  "${PC}" && ok "screen recording goes to the wlroots back end" || bad "ScreenCast is not wlr"
          grep -q '^org.freedesktop.impl.portal.Screenshot=wlr$'  "${PC}" && ok "screenshots go to the wlroots back end"       || bad "Screenshot is not wlr"
          grep -q '^org.freedesktop.impl.portal.Settings=gtk$'    "${PC}" && ok "light/dark follows the system setting"        || bad "Settings is not gtk"
          grep -q '^chooser_type=simple$' /etc/xdg/xdg-desktop-portal-wlr/config \
            && ok "screen recording asks which screen rather than guessing" || bad "no chooser configured for screen recording"

          # ⚠️ THE 2026-09-04 LOGOUT FIX. Logging out of the Aquarius Desktop to
          # go to GNOME bounced off the login screen two or three times, because
          # the session left its settings on the user's systemd noticeboard and
          # left its background programs running. Everything below reads the
          # finished image to prove the fix is actually in it. The behaviour
          # itself is tested by tests/test-session-teardown.sh, which runs during
          # the build against these same installed files.
          echo "== logging out leaves the machine clean =="
          LIB=/usr/libexec/aquarius-session-lib
          if [ -r "${LIB}" ]; then ok "${LIB} is installed"
          else bad "${LIB} is missing — nobody could log in to the Aquarius Desktop at all, because the launcher refuses to start without it"; fi

          if [ -x /usr/libexec/aquarius-session-portals ]; then
            ok "/usr/libexec/aquarius-session-portals is installed and executable"
          else
            bad "/usr/libexec/aquarius-session-portals is missing or not executable — arriving here from GNOME would leave GNOME's portals in charge and OBS would show no screens"
          fi

          # The launcher must stay alive long enough to clean up. `exec labwc`
          # replaced the launcher with the window manager, which is exactly why
          # nothing was ever cleaned up.
          grep -qE '^exec labwc' /usr/bin/aquarius-session \
            && bad "the launcher still uses 'exec labwc' — nothing would be left alive to clean up after the session" \
            || ok "the launcher outlives the window manager, so it can clean up after it"
          grep -q "^trap 'aq_session_teardown' EXIT" /usr/bin/aquarius-session \
            && ok "the clean-up is armed with a trap, so it runs even if the desktop crashes" \
            || bad "the launcher does not trap EXIT — a crash would skip the clean-up entirely"
          # And the other direction: a session that was force-killed never ran
          # its clean-up, and GNOME never cleans up on the way out at all, so
          # logging IN has to defend itself too.
          grep -q '^aq_session_env_reset$' /usr/bin/aquarius-session \
            && ok "logging in clears the last desktop's screen before naming ours" \
            || bad "the launcher does not clear the previous desktop's screen — arriving after a force-killed session would inherit a dead one"

          # The list of settings that get removed again. WAYLAND_DISPLAY and
          # XDG_CURRENT_DESKTOP are the two that broke GNOME: one names a screen
          # that no longer exists, the other tells the portal system to load the
          # Aquarius configuration in the middle of a GNOME session.
          UNSETS="$(grep '^AQ_SESSION_ENV_COMPOSITOR=' "${LIB}" | cut -d'"' -f2) $(grep '^AQ_SESSION_ENV_PUSH=' "${LIB}" | cut -d'"' -f2)"
          # ⚠️ This is everything the session SETS, which is not quite the same
          # as everything it removes: LANG is deliberately kept (it is the
          # person's language, not this desktop's — checked two blocks down).
          # Labelling this "removed at logout" would be a lie in a checks list,
          # which is the worst place to keep one.
          echo "       set by the session: ${UNSETS}"
          echo "       (all of those are removed again at logout except LANG)"
          for v in WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP QS_CONFIG_PATH QT_QPA_PLATFORM; do
            case " ${UNSETS} " in
              *" ${v} "*) ok "${v} is on the list to be forgotten at logout" ;;
              *) bad "${v} is not on the logout list — it would be inherited by the next desktop" ;;
            esac
          done
          grep -q 'systemctl --user unset-environment' "${LIB}" \
            && ok "the clean-up really tells systemd to forget them" \
            || bad "nothing calls 'systemctl --user unset-environment' — this is the bug of 2026-09-04 exactly"
          grep -q '^AQ_SESSION_ENV_KEEP="LANG"$' "${LIB}" \
            && ok "LANG is deliberately kept (it is the person's language, not this desktop's)" \
            || bad "the keep-list is not just LANG — check the reasoning in ${LIB}"

          # The portals. Stopping them is what makes the NEXT desktop's portals
          # read the next desktop's configuration, in both directions.
          for u in xdg-desktop-portal.service xdg-desktop-portal-wlr.service xdg-desktop-portal-gtk.service; do
            grep -q "${u}" "${LIB}" && ok "${u} is stopped when the session changes" \
              || bad "${u} is not handled — it would answer the next desktop with this one's back end"
          done
          grep -q 'aquarius-session-portals' /usr/share/aquarius/labwc/autostart \
            && ok "logging IN takes the portals back from whichever desktop had them last" \
            || bad "the autostart file does not refresh the portals — arriving from GNOME, screen recording would silently show no screens"

          # And every service of ours that starts with the desktop has to stop
          # with it. Without PartOf= a service started at login keeps running
          # after logout, which is the other half of the same bug.
          for unit in /usr/lib/systemd/user/aquarius-*.service /usr/lib/systemd/user/aq-*.service; do
            [ -r "${unit}" ] || continue
            grep -qE '^WantedBy=.*graphical-session\.target' "${unit}" || continue
            if grep -qE '^PartOf=.*graphical-session\.target' "${unit}"; then
              ok "$(basename "${unit}") stops when the desktop does"
            else
              bad "$(basename "${unit}") starts with the graphical session but is not PartOf it — it would outlive the logout and get in the next desktop's way"
            fi
          done

          echo "== packages the session needs =="
          for pkg in greetd greetd-selinux tuigreet xdg-desktop-portal-wlr \
                     swaybg slurp wlr-randr brightnessctl zenity \
                     qt6-qtbase qt6-qtdeclarative qt6-qtwayland qt6-qtsvg \
                     wlroots libsfdo; do
            if rpm -q "${pkg}" > /dev/null 2>&1; then
              ok "${pkg} $(rpm -q --queryformat '%{VERSION}-%{RELEASE}' "${pkg}")"
            else
              bad "${pkg} is NOT installed"
            fi
          done

          echo "== which login manager is switched on =="
          if systemctl is-enabled gdm.service > /dev/null 2>&1; then
            ok "GDM is switched on"
          else
            bad "GDM is not switched on — nothing would draw a login screen"
          fi
          if systemctl is-enabled greetd.service > /dev/null 2>&1; then
            bad "greetd is switched on too. Two login managers is a black screen; greetd ships switched OFF on purpose."
          else
            ok "greetd is installed but switched off, as intended"
          fi

          echo "== the thing that asks you for your password =="
          # ⚠️ THE 2026-09-04 BENCH FAULT. Pressing Install in the creator-apps
          # window failed with "Error creating textual authentication agent …
          # /dev/tty", because this session had no polkit authentication agent.
          # Four things have to be true, and each of them was true on its own
          # while the feature was still broken, which is why all four are here.
          for pkg in lxqt-policykit polkit-qt6-1; do
            if rpm -q "${pkg}" > /dev/null 2>&1; then
              ok "${pkg} $(rpm -q --queryformat '%{VERSION}-%{RELEASE}' "${pkg}")"
            else
              bad "${pkg} is NOT installed — nothing in the Aquarius Session could ask for a password"
            fi
          done
          if [ -x /usr/libexec/lxqt-policykit-agent ]; then
            ok "the agent binary is at /usr/libexec/lxqt-policykit-agent"
          else
            bad "/usr/libexec/lxqt-policykit-agent is missing"
          fi
          if [ -x /usr/libexec/aquarius-polkit-agent ]; then
            ok "aquarius-polkit-agent is present and runnable"
          else
            bad "/usr/libexec/aquarius-polkit-agent is missing or not runnable"
          fi
          if bash -n /usr/libexec/aquarius-polkit-agent 2>/tmp/pk-syn.txt; then
            ok "aquarius-polkit-agent is valid shell"
          else
            bad "aquarius-polkit-agent has a syntax error"; cat /tmp/pk-syn.txt
          fi
          # Run it. --which is the question that matters: can the helper FIND an
          # agent on this image? A package being installed does not answer that,
          # because the helper looks for a path, not a package name.
          if /usr/libexec/aquarius-polkit-agent --which > /tmp/pk-which.txt 2>&1; then
            ok "the helper finds an agent: $(cat /tmp/pk-which.txt)"
          else
            bad "the helper cannot find any authentication agent on this image"; cat /tmp/pk-which.txt
          fi
          # And the session has to start it, or all of the above is a package
          # nobody runs. labwc reads exactly one file and this is it.
          if grep -q 'aquarius-polkit-agent' /usr/share/aquarius/labwc/autostart; then
            ok "the Aquarius session's autostart starts the agent at login"
          else
            bad "the session never starts the agent — this is the bench fault, back again"
          fi
          # GNOME has an agent of its own inside GNOME Shell. The package's own
          # autostart entry must be switched off, or GNOME starts a second one
          # and which agent you get is decided by timing.
          PKA=/etc/xdg/autostart/lxqt-policykit-agent.desktop
          if [ ! -e "${PKA}" ]; then
            ok "the agent ships no autostart entry of its own"
          elif grep -q '^Hidden=true$' "${PKA}"; then
            ok "the agent's own autostart entry is switched off, so GNOME keeps its own agent"
          else
            bad "${PKA} is still active — GNOME would start a second agent"
          fi

          echo "== no library is missing on the finished image =="
          for b in /usr/bin/labwc /usr/bin/quickshell; do
            [ -e "${b}" ] || continue
            if ldd "${b}" 2>&1 | grep -q 'not found'; then
              bad "${b} is missing libraries:"; ldd "${b}" | grep 'not found' | sed 's/^/       /'
            else
              ok "${b} — every library resolves"
            fi
          done

          if [ "$fails" -ne 0 ]; then
            echo "::error::The Aquarius Desktop in this image is broken. Do not publish it."
            exit 1
          fi
          echo "All Aquarius Desktop checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            -e EXPECT_SHELL_REF="${EXPECT_SHELL_REF}" \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-session.sh

      - name: Check nothing still says Bazzite or Fedora
        run: |
          set -euo pipefail
          cat > /tmp/verify-names.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          # A settings file's VALUES, without the plain-English notes around
          # them. Every config file in this project carries a long explanatory
          # header, and several of those headers legitimately explain what
          # Fedora does and why we differ. Explaining Fedora is not the same as
          # being branded Fedora, so the comments are not part of the audit.
          values_only() { grep -vE '^[[:space:]]*(#|;|$)' "$1" 2>/dev/null || true; }

          echo "=============================================================="
          echo " RULE 1 — the word Bazzite must not appear anywhere"
          echo "=============================================================="

          echo "-- as part of a file or folder name --"
          find / -xdev -iname '*bazzite*' > /tmp/bz-names.txt 2>/dev/null || true
          if [ -s /tmp/bz-names.txt ]; then
            bad "$(wc -l < /tmp/bz-names.txt) path(s) are named after Bazzite:"
            head -40 /tmp/bz-names.txt
          else
            ok "no file or folder anywhere on the image is named after Bazzite"
          fi

          echo "-- as an installed package --"
          if rpm -qa | grep -i bazzite > /tmp/bz-pkgs.txt; then
            bad "Bazzite packages are installed:"; cat /tmp/bz-pkgs.txt
          else
            ok "no installed package is a Bazzite one"
          fi

          # Inside text files. The excluded folders are translations, manuals and
          # timezone tables — many gigabytes of text that no AquariusOS build
          # writes into, and which would turn a two-minute check into a
          # twenty-minute one. Everything the build can actually touch is in.
          echo "-- inside text files --"
          # --exclude-dir=shell keeps the Aquarius Shell's own source out of
          # THIS grep. It gets its own, stricter check immediately below, for
          # the same reason config files are checked with their comments
          # stripped: the shell's QML carries long explanatory notes, and
          # several of them explain what Bazzite's Game Mode does and why the
          # shell refuses to reimplement it. Explaining Bazzite is not the same
          # as being branded Bazzite.
          grep -rIil bazzite --exclude-dir=shell \
            /etc /usr/bin /usr/sbin /usr/libexec /usr/lib/os-release /usr/lib/bootc \
            /usr/lib/systemd /usr/lib/dracut /usr/share/aquarius /usr/share/plymouth \
            /usr/share/glib-2.0/schemas /usr/share/gnome-background-properties \
            /usr/share/applications /usr/share/gnome-shell /usr/share/wayland-sessions \
            /usr/share/xsessions /usr/share/pixmaps /usr/share/backgrounds \
            > /tmp/bz-text.txt 2>/dev/null || true
          if [ -s /tmp/bz-text.txt ]; then
            bad "$(wc -l < /tmp/bz-text.txt) file(s) contain the word Bazzite:"
            head -40 /tmp/bz-text.txt
          else
            ok "no text file in any folder this build writes to mentions Bazzite"
          fi

          echo "-- inside the Aquarius Shell's own code (comments do not count) --"
          # The shell is QML. A line starting with // is a note to whoever reads
          # the file next, and the shell's notes discuss Bazzite at length
          # because the Game Mode tile exists to hand OFF to Bazzite's own
          # script rather than reimplement it. What must not appear is Bazzite
          # in the CODE — a path, a name, a string that a running program uses.
          #
          # So: strip the comments, then look.
          if [ -d /usr/share/aquarius/shell ]; then
            : > /tmp/bz-shell.txt
            while IFS= read -r f; do
              # Drop whole-line // comments and anything after // on a line.
              # Crude, and deliberately so: it can only ever over-report, and an
              # over-report is a person reading one line of QML.
              if sed 's|//.*$||' "${f}" | grep -qi bazzite; then
                echo "${f}" >> /tmp/bz-shell.txt
              fi
            done <<< "$(find /usr/share/aquarius/shell -type f -name '*.qml' -o -type f -name '*.js')"
            if [ -s /tmp/bz-shell.txt ]; then
              bad "the shell's CODE (not its notes) mentions Bazzite:"
              while IFS= read -r f; do
                echo "       ${f}"
                sed 's|//.*$||' "${f}" | grep -in bazzite | sed 's/^/         /'
              done < /tmp/bz-shell.txt
            else
              ok "the shell's code says nothing about Bazzite (only its notes do, which is fine)"
            fi
          else
            ok "there is no shell in this image to check (see the warning above)"
          fi

          echo
          echo "=============================================================="
          echo " RULE 2 — Fedora must not appear where a PERSON reads a name"
          echo "=============================================================="

          # nofedora <what it is> <file> [<grep pattern to narrow to some lines>]
          nofedora() {
            local what="$1" file="$2" narrow="${3:-}" body
            if [ ! -e "${file}" ]; then
              ok "${what}: ${file} does not exist in this image (nothing to say Fedora)"
              return
            fi
            body="$(values_only "${file}")"
            if [ -n "${narrow}" ]; then
              body="$(printf '%s\n' "${body}" | grep -E "${narrow}" || true)"
            fi
            if printf '%s\n' "${body}" | grep -qi fedora; then
              bad "${what} (${file}) still says Fedora:"
              printf '%s\n' "${body}" | grep -i fedora | sed 's/^/       /'
            else
              ok "${what} (${file})"
            fi
          }

          nofedora "the system's name, pretty name and edition" /etc/os-release '^(NAME|PRETTY_NAME|VARIANT)='
          nofedora "the same, in the image copy"                /usr/lib/os-release '^(NAME|PRETTY_NAME|VARIANT)='
          nofedora "the console login banner"                   /etc/issue
          nofedora "the network login banner"                    /etc/issue.net
          nofedora "the message of the day"                      /etc/motd
          nofedora "the old-style release line"                   /etc/fedora-release
          nofedora "the boot menu's distributor name"             /etc/default/grub '^GRUB_DISTRIBUTOR='
          nofedora "which splash this machine uses"               /etc/plymouth/plymouthd.conf '^Theme='
          nofedora "which splash the image falls back to"         /usr/share/plymouth/plymouthd.defaults '^Theme='
          nofedora "this machine's own name"                      /etc/hostname
          nofedora "the wallpaper list in Settings > Appearance"  /usr/share/gnome-background-properties/aquarius.xml

          echo "-- our GNOME defaults --"
          for f in /usr/share/glib-2.0/schemas/zz1-aquarius-*.gschema.override; do
            nofedora "an AquariusOS default" "${f}"
          done

          # The theme folder the machine actually boots with. Text files only —
          # the borrowed grey password-box PNGs are pictures of rectangles and
          # have no words in them.
          echo "-- the active boot splash theme --"
          grep -rIl -i fedora /usr/share/plymouth/themes/aquarius > /tmp/fed-theme.txt 2>/dev/null || true
          if [ -s /tmp/fed-theme.txt ]; then
            # ... except our own explanatory notes, which are allowed to discuss
            # Fedora. Check the settings themselves.
            still=0
            while read -r f; do
              if values_only "${f}" | grep -qi fedora; then
                bad "a SETTING in ${f} says Fedora:"; values_only "${f}" | grep -i fedora | sed 's/^/       /'
                still=1
              fi
            done < /tmp/fed-theme.txt
            if [ "${still}" -eq 0 ]; then
              ok "the boot theme's settings say nothing about Fedora (only its notes do, which is fine)"
            fi
          else
            ok "nothing in the boot theme folder mentions Fedora at all"
          fi

          echo
          echo "=============================================================="
          echo " THE ALLOWLIST — where Fedora is SUPPOSED to still appear"
          echo "=============================================================="
          echo "Each of these is deliberate. None is visible to a person using"
          echo "the machine, and each one would break something if changed."
          echo
          # 1. os-release's machine-readable identity. Hundreds of programs and
          #    scripts branch on ID=fedora to decide which package manager to
          #    use and which paths to look in. Changing it would make this
          #    machine unrecognisable to all of them.
          echo "1. /etc/os-release — the machine-readable identity:"
          grep -E '^(ID|ID_LIKE|VERSION|VERSION_ID|CPE_NAME|REDHAT_)' /etc/os-release | sed 's/^/     /'
          if grep -q '^ID=fedora$' /etc/os-release; then ok "ID is still fedora (required, deliberate)"
          else bad "ID is no longer fedora — software that branches on it would stop recognising this machine"; fi

          # 2. The CPE identifier. Security scanners use it to work out which
          #    published vulnerabilities apply. AquariusOS really is Fedora 44
          #    underneath, so telling a scanner otherwise makes it check the
          #    wrong list — which is a security problem, not a branding one.
          echo "2. /etc/system-release-cpe — used by vulnerability scanners:"
          sed 's/^/     /' /etc/system-release-cpe 2>/dev/null || echo "     (not present)"

          # 3. The software sources. These really are Fedora's servers.
          echo "3. /etc/yum.repos.d/ — the real Fedora and RPM Fusion servers:"
          ls -1 /etc/yum.repos.d/ 2>/dev/null | sed 's/^/     /' || echo "     (none)"

          # 4. Package names, and the record of what this image was built on.
          echo "4. Package names and the build record:"
          echo "     $(rpm -qa 'fedora-*' | tr '\n' ' ')"
          grep -o '"base-image-name": "[^"]*"' /usr/share/aquarius/image-info.json | sed 's/^/     /'

          # 5. Two picture FILENAMES under /usr/share/pixmaps are Fedora's, on
          #    purpose: GNOME's Settings > About page opens those exact paths, so
          #    the only way to brand that page is to put our picture at Fedora's
          #    filename. The bytes are ours; the name is not. Checked properly by
          #    the "About page shows OUR logo" step above.
          echo "5. Fedora-named picture files whose CONTENTS are ours:"
          ls -1 /usr/share/pixmaps/fedora_logo_med.png /usr/share/pixmaps/fedora_whitelogo_med.png 2>/dev/null | sed 's/^/     /' || true

          echo
          if [ "$fails" -ne 0 ]; then
            echo "::error::This image still carries a name it should not. See the FAIL lines above."
            exit 1
          fi
          echo "No stray names. Every visible surface says AquariusOS."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-names.sh

      # ------------------------------------------------------------------------
      # THE KERNEL, AND EVERY READY-MADE MODULE THAT DEPENDS ON IT
      # ------------------------------------------------------------------------
      # Four features in this image are kernel modules: the NVIDIA driver, the
      # OBS virtual camera, and the two Xbox controller drivers. A kernel module
      # only loads on the exact kernel it was built against, so all four stand
      # or fall together with one question — is the kernel in this image the one
      # Universal Blue built their modules for?
      #
      # ⚠️ THIS CHECK EXISTS BECAUSE THE ANSWER WAS SILENTLY "NO" ONCE.
      # On 2026-09-04 (build 33900370878) Fedora shipped kernel 7.1.13 while
      # Universal Blue's modules were still built for 7.1.12. The NVIDIA image
      # swapped its kernel and was fine. The AMD/Intel image had no such step,
      # so it built green, published, and shipped with NO virtual camera and NO
      # Xbox drivers. Every other check in this workflow passed.
      #
      # build_files/58-kernel-pin.sh now pins the kernel on BOTH images, and
      # this reads that back inside the finished image: the pin note, the
      # package database, and the actual folder on disk all have to say the same
      # version, and every module has to be filed under it. It runs on both
      # variants, before the NVIDIA-specific checks below.
      - name: Check the kernel is the one the modules were built for
        run: |
          set -euo pipefail
          cat > /tmp/verify-kernel.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          echo "== what the build wrote down =="
          PIN=/usr/share/aquarius/kernel.txt
          if [ ! -r "${PIN}" ]; then
            bad "${PIN} is missing — the kernel pin step did not run"
            PINNED=""
          else
            sed 's/^/     /' "${PIN}"
            PINNED="$(sed -n 's/^kernel=//p' "${PIN}")"
            if [ -n "${PINNED}" ]; then
              ok "the image says it was pinned to ${PINNED}"
            else
              bad "${PIN} has no kernel= line in it"
            fi
          fi

          echo "== the kernel package =="
          INSTALLED="$(rpm -q --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}' kernel-core)"
          echo "     kernel-core says: ${INSTALLED}"
          rpm -qa --queryformat '     %{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n' 'kernel*' | sort

          echo "== the kernel folder on disk =="
          # This is the `uname -r` of an image you cannot boot: the one folder
          # under /usr/lib/modules is the kernel every module has to be filed
          # under. A bootable image must have exactly one.
          ls -1 /usr/lib/modules/ | sed 's/^/     /'
          COUNT="$(find /usr/lib/modules -mindepth 1 -maxdepth 1 -type d -printf . | wc -c)"
          KVER="$(find /usr/lib/modules -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | head -1)"
          if [ "${COUNT}" -eq 1 ]; then
            ok "exactly one kernel folder: ${KVER}"
          else
            bad "${COUNT} kernel folders under /usr/lib/modules — there must be exactly one"
          fi

          if [ "${KVER}" = "${INSTALLED}" ]; then
            ok "the folder on disk and the package database agree"
          else
            bad "the package database says ${INSTALLED} but the folder on disk is ${KVER}"
          fi
          if [ -n "${PINNED}" ] && [ "${KVER}" = "${PINNED}" ]; then
            ok "and that is exactly what the build pinned"
          elif [ -n "${PINNED}" ]; then
            bad "the build pinned ${PINNED} but this image ships ${KVER} — something moved the kernel after the pin"
          fi

          echo "== the ready-made modules that depend on it =="
          # These come from ghcr.io/ublue-os/akmods and are in BOTH images. Two
          # questions per module, because they fail differently: is the package
          # installed, and did its file land where THIS kernel looks?
          check_kmod() {   # check_kmod <package> <module file pattern> <what it is for>
            pkg="$1"; pat="$2"; what="$3"
            if rpm -q "${pkg}" > /dev/null 2>&1; then
              ok "${pkg} $(rpm -q --queryformat '%{VERSION}-%{RELEASE}' "${pkg}") — ${what}"
            else
              bad "${pkg} is NOT installed — ${what} does not work on this image"
              return
            fi
            found="$(find "/usr/lib/modules/${KVER}" -name "${pat}" 2>/dev/null | head -1)"
            if [ -n "${found}" ]; then
              ok "  its module is under this image's kernel: ${found}"
            else
              bad "  no ${pat} under /usr/lib/modules/${KVER} — the module would never load"
            fi
          }
          check_kmod kmod-v4l2loopback 'v4l2loopback.ko*' "OBS's Start Virtual Camera button"
          check_kmod kmod-xone         'xone_*.ko*'      "the Xbox Wireless Adapter (the USB dongle)"
          check_kmod kmod-xpadneo      'hid-xpadneo.ko*' "Xbox controllers over Bluetooth"

          if [ "${EXPECTED_NVIDIA}" = "1" ]; then
            echo "== and the NVIDIA driver, which comes from the matching box =="
            check_kmod kmod-nvidia 'nvidia.ko*' "the NVIDIA graphics driver"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The kernel and the ready-made kernel modules in this image do not agree. Do not publish it. See docs/restart/kernel.md."
            exit 1
          fi
          echo "All kernel checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            -e EXPECTED_NVIDIA="${NVIDIA}" \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-kernel.sh

      - name: Check the NVIDIA driver
        if: matrix.nvidia == 1
        run: |
          set -euo pipefail
          cat > /tmp/verify-nvidia.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          echo "== the driver packages =="
          for pkg in kmod-nvidia nvidia-driver egl-wayland nvidia-container-toolkit; do
            if rpm -q "${pkg}" > /dev/null 2>&1; then
              ok "${pkg} $(rpm -q --queryformat '%{VERSION}-%{RELEASE}' "${pkg}")"
            else
              bad "${pkg} is NOT installed"
            fi
          done

          # The kernel module and the driver come from the same source and MUST
          # be the same version. A mismatch is the classic black screen.
          k="$(rpm -q --queryformat '%{VERSION}' kmod-nvidia 2>/dev/null || echo none)"
          d="$(rpm -q --queryformat '%{VERSION}' nvidia-driver 2>/dev/null || echo none)"
          if [ "$k" = "$d" ] && [ "$k" != "none" ]; then
            ok "kernel module and driver are both version ${k}"
          else
            bad "kernel module is ${k} but the driver is ${d}"
          fi

          # And the module file has to be filed under the kernel that is
          # actually in this image, not the one it was built on.
          KERNEL="$(rpm -q --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}' kernel-core)"
          echo "== kernel in this image: ${KERNEL} =="
          ls -1 /usr/lib/modules/
          if compgen -G "/usr/lib/modules/${KERNEL}/extra/nvidia*" > /dev/null; then
            ok "the NVIDIA modules are filed under ${KERNEL}"
            ls -l /usr/lib/modules/"${KERNEL}"/extra/nvidia* | sed 's/^/       /'
          else
            bad "no nvidia* modules under /usr/lib/modules/${KERNEL}/extra — the driver would not load"
            find /usr/lib/modules -name 'nvidia*' | head -20
          fi

          echo "== boot options =="
          cat /usr/lib/bootc/kargs.d/10-aquarius-nvidia.toml || echo "(missing!)"
          if grep -q 'nvidia-drm.modeset=1' /usr/lib/bootc/kargs.d/10-aquarius-nvidia.toml 2>/dev/null; then
            ok "nvidia-drm.modeset=1 is set — Wayland will start"
          else
            bad "nvidia-drm.modeset=1 is not set — a Wayland desktop on NVIDIA would not start"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The NVIDIA layer in this image is not correct."
            exit 1
          fi
          echo "All NVIDIA checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-nvidia.sh

      # And the opposite: the AMD/Intel image must NOT have picked up the
      # NVIDIA driver. If the conditional-stage trick in the Containerfile ever
      # breaks, this is what notices.
      - name: Check the AMD/Intel image has no NVIDIA driver in it
        if: matrix.nvidia == 0
        run: |
          set -euo pipefail
          podman run --rm --pull=never \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" -c '
              if rpm -q kmod-nvidia > /dev/null 2>&1; then
                echo "::error::The AMD/Intel image contains the NVIDIA kernel module. The Containerfile stage selection is broken."
                exit 1
              fi
              echo "  OK   no NVIDIA driver on the AMD/Intel image (correct)"
            '

      # ------------------------------------------------------------------------
      # Aquarius Keys — the Mac-style keyboard shortcuts
      # ------------------------------------------------------------------------
      # A keyboard feature fails in a particularly nasty way: some keys just do
      # nothing, and nothing anywhere says why. So this asks the finished image
      # every question that matters — are both remappers there and do they run,
      # are the rule files ones the remapper itself accepts, is the service
      # switched on, does a brand-new account get Mac keys, is the permission
      # rule in place, and does `aq keys` work.
      #
      # The rule files are ALSO parsed here on the runner as plain YAML. That is
      # not a duplicate of the check the build does: the build asks "does xremap
      # accept this?", and this asks "is it well-formed text?" — which is the
      # question that catches a file that has been truncated or mangled on its
      # way into the image.
      - name: Check the Mac keyboard shortcuts are really in there
        run: |
          set -euo pipefail

          # ---- 1. inside the image -------------------------------------------
          cat > /tmp/verify-keys.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }
          check() {   # check "<description>" "<pattern>" "<file>"
            if [ ! -e "$3" ]; then bad "$1 — $3 does not exist"; return; fi
            if grep -Eq "$2" "$3"; then ok "$1"; else bad "$1 — /$2/ not found in $3"; fi
          }

          echo "== the two remapper programs =="
          for feature in wlroots gnome; do
            bin="/usr/bin/xremap-${feature}"
            if [ ! -x "${bin}" ]; then
              bad "${bin} is missing"
              continue
            fi
            if out="$("${bin}" --version 2>&1)"; then
              ok "${bin} — ${out}"
            else
              bad "${bin} is installed but will not run: ${out}"
            fi
            # A library that is not in the image shows up here as "not found",
            # and would otherwise only be discovered at somebody's login.
            if ldd "${bin}" 2>&1 | grep -q "not found"; then
              bad "${bin} needs a library that is not in this image:"
              ldd "${bin}" 2>&1 | grep "not found" | sed 's/^/       /'
            else
              ok "${bin} has every library it needs"
            fi
          done

          echo
          echo "== the rule files, judged by the remapper itself =="
          # xremap reads and validates the whole file before it looks at any
          # keyboard, so pointing it at a device that does not exist gets the
          # full check and then stops. A complaint about the FILE says "Failed
          # to load config"; a complaint about missing devices is expected,
          # because there is no keyboard inside a container.
          for profile in mac windows; do
            file="/usr/share/aquarius/keys/${profile}.yaml"
            if [ ! -s "${file}" ]; then bad "${file} is missing or empty"; continue; fi
            out="$(/usr/bin/xremap-wlroots --device /nonexistent-device "${file}" 2>&1 || true)"
            if printf '%s' "${out}" | grep -q "Failed to load config"; then
              bad "${file} is not a valid profile:"
              printf '%s\n' "${out}" | sed 's/^/       /'
            else
              ok "${file} is a profile xremap accepts"
            fi
          done

          echo
          echo "== the rules Royce actually asked for =="
          MAC=/usr/share/aquarius/keys/mac.yaml
          check "the key beside the space bar is Command" '^ *Alt_L: Super_L$'     "${MAC}"
          check "the Windows key is Option"               '^ *Super_L: Alt_L$'     "${MAC}"
          check "Apple keyboards are left alone"          'ids:0x05ac'             "${MAC}"
          check "Command-C copies"                        '^ *Super-c: C-c( |$)'   "${MAC}"
          check "in a terminal, Command-C copies"         '^ *Super-c: C-Shift-c( |$)' "${MAC}"
          check "Command-Q closes the window"             '^ *Super-q: A-F4$'      "${MAC}"
          check "Command-Shift-3 takes a screenshot"      '^ *Super-Shift-3: SYSRQ$' "${MAC}"
          check "Files gets its own rules"                '^ *- Nautilus$'         "${MAC}"
          check "DaVinci Resolve is left alone"           '^ *- resolve *#'        "${MAC}"

          # These three must NOT be remapped: they are how the desktop's own
          # search and window switching are reached. A rule for any of them
          # would take the search palette away with no error anywhere.
          for combo in 'Super-space' 'Super-Tab' 'Super-grave'; do
            if grep -Eq "^[[:space:]]+${combo}:" "${MAC}"; then
              bad "${combo} is remapped — that key belongs to the desktop"
            else
              ok "${combo} is left for the desktop, as designed"
            fi
          done

          echo
          echo "== permission to read the keyboard without being root =="
          RULE=/usr/lib/udev/rules.d/70-aquarius-input.rules
          check "the udev rule covers the invented keyboard" 'uinput'          "${RULE}"
          check "it uses uaccess, not a permanent group"     'TAG\+="uaccess"' "${RULE}"
          check "it covers the real keyboards too"           'SUBSYSTEM=="input", KERNEL=="event\[0-9\]\*"' "${RULE}"
          check "the uinput driver loads at boot"            '^uinput$' /usr/lib/modules-load.d/aquarius-uinput.conf

          echo
          echo "== the service, and that it is switched on =="
          UNIT=/usr/lib/systemd/user/aquarius-keys.service
          WANTS=/usr/lib/systemd/user/graphical-session.target.wants/aquarius-keys.service
          check "the service runs the right program" '^ExecStart=/usr/libexec/aquarius-keys-run$' "${UNIT}"
          check "it belongs to the graphical session" '^WantedBy=graphical-session\.target$'      "${UNIT}"
          check "it ends when the desktop does"       '^PartOf=graphical-session\.target$'       "${UNIT}"

          # ---- the 2026-09-03 bench bug, checked in the finished image ------
          # A second remapper — the LOGIN SCREEN's, started from the same link,
          # because that link applies to every account including gdm's — had
          # taken hold of both keyboards. Ours was refused each one with
          # "Device or resource busy", held nothing, and reported itself active
          # the whole time. It looked exactly like Windows mode.
          # Every line below is part of the fix and every one is one edit from
          # being lost. See docs/restart/aquarius-keys.md.
          check "the login screen does not run this"  '^ConditionUser=!@system$'                 "${UNIT}"
          check "it keeps retrying rather than giving up" '^Restart=always$'                     "${UNIT}"
          check "it retries two seconds later"        '^RestartSec=2$'                           "${UNIT}"
          check "the give-up limit is switched off"   '^StartLimitIntervalSec=0$'                "${UNIT}"
          check "the two do-not-retry exits are named" '^RestartPreventExitStatus=64 78$'        "${UNIT}"
          check "a leftover remapper is cleared first" '^ExecStartPre=-/usr/bin/pkill'           "${UNIT}"

          RUNNER=/usr/libexec/aquarius-keys-run
          check "a leftover 'xremap' device can never be chosen" 'ignore=xremap'        "${RUNNER}"
          check "a refused keyboard fails the run"    'resource busy'                   "${RUNNER}"
          check "holding no keyboards fails the run"  'No device was selected'          "${RUNNER}"
          check "it says how many keyboards it has"   'remapping .* keyboard'           "${RUNNER}"
          check "on GNOME it waits for the shell"     'GNOME Shell to be ready'         "${RUNNER}"
          check "and for the add-on to finish loading" 'gnome-extensions info'          "${RUNNER}"
          check "'aq keys status' reports the keyboards" 'Keyboards :'                  /usr/bin/aq

          echo "== how big things are on the screen =="
          # labwc starts every monitor at 100%. On a 55" 4K bench monitor that
          # made the whole desktop tiny, while GNOME had been running the same
          # screen at 125% for weeks. See docs/restart/aquarius-display.md.
          if [ -x /usr/libexec/aquarius-display-scale ]; then
            ok "the display-scale helper is installed"
          else
            bad "/usr/libexec/aquarius-display-scale is missing — every screen would stay at 100%"
          fi
          if command -v wlr-randr > /dev/null 2>&1; then
            ok "wlr-randr is installed (the only way to apply a scale here)"
          else
            bad "wlr-randr is missing — the right scale could be worked out and never applied"
          fi
          check "the window manager sets the size at login" 'aquarius-display-scale' \
            /usr/share/aquarius/labwc/autostart
          check "the launcher passes the bar's own size knob" 'AQ_UI_SCALE' \
            /usr/bin/aquarius-session
          check "'aq display' is in the command" 'aq display scale' /usr/bin/aq
          if [ -L "${WANTS}" ] && [ -e "${WANTS}" ]; then
            ok "switched on by default — ${WANTS} -> $(readlink "${WANTS}")"
          else
            bad "${WANTS} is missing or dangling — the service would never start"
          fi

          echo
          echo "== the default is Mac, in both places it is written =="
          check "a brand-new account gets Mac keys" '^mode=mac$'      /etc/skel/.config/aquarius/keys.conf
          check "an account with no file gets them too" '^AQ_MODE="mac"$' /usr/libexec/aquarius-keys-run

          echo
          echo "== the switch =="
          for script in /usr/libexec/aquarius-keys-run /usr/bin/aq; do
            if [ ! -x "${script}" ]; then bad "${script} is missing or not runnable"; continue; fi
            if bash -n "${script}"; then ok "${script} is valid shell"; else bad "${script} has a syntax error"; fi
          done
          if /usr/bin/aq --help > /dev/null 2>&1; then ok "aq --help works"; else bad "aq --help failed"; fi
          echo "--- aq keys status, with no desktop running ---"
          if /usr/bin/aq keys status; then
            ok "aq keys status explains itself instead of falling over"
          else
            bad "aq keys status failed"
          fi
          echo "---"

          echo
          echo "== the GNOME add-on that reports the focused app =="
          EXT=/usr/share/gnome-shell/extensions/xremap@k0kubun.com
          check "it is installed" '"uuid": "xremap@k0kubun.com"' "${EXT}/metadata.json"
          if [ -s "${EXT}/extension.js" ]; then ok "its code is present"; else bad "${EXT}/extension.js is missing"; fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::Aquarius Keys is not correctly assembled in this image."
            exit 1
          fi
          echo "All Aquarius Keys checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-keys.sh

          # ---- 2. on the runner: are the rule files well-formed YAML? --------
          # PyYAML is on GitHub's runners already; the install line is there so
          # that a future runner image without it fails loudly at this line
          # rather than quietly skipping the check.
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml
          for profile in mac windows; do
            podman run --rm --pull=never --entrypoint /usr/bin/cat \
              "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
              "/usr/share/aquarius/keys/${profile}.yaml" > "/tmp/${profile}.yaml"
            python3 - "$profile" <<'PY'
          import sys, yaml
          name = sys.argv[1]
          with open(f"/tmp/{name}.yaml") as fh:
              doc = yaml.safe_load(fh)
          assert isinstance(doc, dict), f"{name}.yaml is not a settings file at all"
          for section in ("modmap", "keymap"):
              assert section in doc, f"{name}.yaml has no '{section}' section"
              assert isinstance(doc[section], list), f"{name}.yaml: '{section}' is not a list"
          rules = sum(len(block.get("remap", {})) for block in doc["keymap"])
          print(f"  OK   {name}.yaml is well-formed YAML — "
                f"{len(doc['modmap'])} key swap block(s), "
                f"{len(doc['keymap'])} rule block(s), {rules} rules")
          PY
          done

      - name: Check the creator apps are really in there
        run: |
          set -euo pipefail
          cat > /tmp/verify-creator.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          # ====================================================================
          # 1. THE TWO APPS THAT ARE BAKED INTO THE IMAGE
          # ====================================================================
          # Re-asked here, on the FINISHED, PACKAGED image, and not only during
          # the build. That is not belt and braces for its own sake: the tool
          # that packages a bootable image rewrites every file, and the whole
          # bug of 2026-08-28 was about file permissions. A permission that is
          # correct when it is set and wrong when it is shipped is exactly the
          # kind of thing this step exists to catch.
          echo "== Aquarius Writer (baked in) and Aquarius Editor (a download) =="

          if [ -r /usr/share/aquarius/creator-apps.txt ]; then
            echo "-- what the build says it installed --"
            sed 's/^/     /' /usr/share/aquarius/creator-apps.txt
          else
            bad "/usr/share/aquarius/creator-apps.txt is missing — the build did not record what it did"
          fi

          for app in aquarius-writer; do
            dir="/usr/lib/aquarius/${app}"

            if [ -d "${dir}" ]; then ok "${app}: unpacked at ${dir} ($(du -sh "${dir}" | cut -f1))"
            else bad "${app}: ${dir} does not exist — the app is not in the image"; continue; fi

            if [ -x "${dir}/AppRun" ]; then ok "${app}: AppRun is there"
            else bad "${app}: ${dir}/AppRun is missing or not runnable"; fi

            if [ -x "/usr/bin/${app}" ]; then ok "${app}: /usr/bin/${app} is the front door"
            else bad "${app}: /usr/bin/${app} is missing"; fi

            if [ -f "/usr/share/applications/${app}.desktop" ]; then
              ok "${app}: it has an app-grid entry"
            else
              bad "${app}: no /usr/share/applications/${app}.desktop — it would not appear in the app grid"
            fi

            # The version stamp, cross-checked against what the build wrote
            # down. Two files, written by different parts of the same step, so
            # a disagreement means one of them did not happen.
            if [ -r "${dir}/VERSION" ]; then
              v="$(cat "${dir}/VERSION")"
              ok "${app}: version ${v}"
              if grep -qx "${app} v${v}" /usr/share/aquarius/creator-apps.txt 2>/dev/null; then
                ok "${app}: the record agrees it is v${v}"
              else
                bad "${app}: VERSION says ${v} but creator-apps.txt does not say v${v}"
              fi
            else
              bad "${app}: ${dir}/VERSION is missing — the launcher could never start a downloaded update"
            fi

            # ⚠️ EVERY CHECK IN THIS FILE RUNS AS ROOT, AND ROOT IGNORES
            #    PERMISSIONS. So the questions are asked the way an ordinary
            #    account experiences them: not "can I", but "could somebody who
            #    is neither root nor in this file's group".
            n="$(find "${dir}" \( -type f -o -type d \) ! -perm -o+r | wc -l)"
            if [ "${n}" -eq 0 ]; then ok "${app}: everything is readable by an ordinary account"
            else bad "${app}: ${n} file(s)/folder(s) an ordinary account cannot read"; find "${dir}" \( -type f -o -type d \) ! -perm -o+r | head -5; fi

            n="$(find "${dir}" -type f -perm -u+x ! -perm -o+x | wc -l)"
            if [ "${n}" -eq 0 ]; then ok "${app}: every program in it can be run by an ordinary account"
            else bad "${app}: ${n} program(s) an ordinary account cannot run — this is the bug of 2026-08-28"; find "${dir}" -type f -perm -u+x ! -perm -o+x | head -5; fi

            n="$(find "${dir}" -type d ! -perm -o+x | wc -l)"
            if [ "${n}" -eq 0 ]; then ok "${app}: every folder can be opened by an ordinary account"
            else bad "${app}: ${n} folder(s) an ordinary account cannot open"; fi

            n="$(find "${dir}" ! -type l -perm -o+w | wc -l)"
            if [ "${n}" -eq 0 ]; then ok "${app}: nothing in it is writable by just anyone"
            else bad "${app}: ${n} file(s) writable by ANY account, inside /usr"; fi

            n="$(find "${dir}" -xtype l | wc -l)"
            if [ "${n}" -eq 0 ]; then ok "${app}: no symlink points at nothing"
            else bad "${app}: ${n} broken symlink(s)"; find "${dir}" -xtype l | head -5; fi
          done

          # ====================================================================
          # 1b. AQUARIUS EDITOR IS A DOWNLOAD NOW, AND MUST NOT BE IN HERE
          # ====================================================================
          # ⚠️ THE CHECK THE WHOLE 2026-09-04 CHANGE RESTS ON. Aquarius Editor
          # is 4.1 GB unpacked. Baking it in made every AquariusOS download four
          # gigabytes bigger for everybody, including the people who will never
          # open it, so it moved out of the image and into the app chooser —
          # ticked by default, installed into each person's own home folder.
          #
          # If it ever comes back, nothing goes red on its own: the build simply
          # takes ten minutes longer and the image is twice the size it needs to
          # be. So it is asserted here, on the FINISHED, PACKAGED image, in the
          # plainest way there is.
          echo
          echo "== Aquarius Editor is NOT in the image (it is a download) =="
          if [ -e /usr/lib/aquarius/aquarius-editor ]; then
            bad "/usr/lib/aquarius/aquarius-editor is in the image — four gigabytes that should not be here"
            du -sh /usr/lib/aquarius/aquarius-editor
          else
            ok "no /usr/lib/aquarius/aquarius-editor"
          fi
          if [ -e /usr/share/applications/aquarius-editor.desktop ]; then
            bad "a system-wide aquarius-editor.desktop is in the image — every account would show a dead icon"
          else
            ok "no system-wide menu entry either — the installer writes a personal one"
          fi
          # And the pieces that DO have to be here, because they are what fetches
          # it onto a real machine.
          if [ -x /usr/libexec/aquarius-appimage-install ]; then
            ok "the home-folder installer is here"
          else
            bad "/usr/libexec/aquarius-appimage-install is missing — the chooser would offer an app nobody can install"
          fi
          if [ -r /usr/share/aquarius/apps/aquarius-editor.desktop.in ]; then
            # ⚠️ Validated through a copy with the right name.
            # desktop-file-validate refuses any filename not ending in
            # `.desktop`, before reading a line of it — and this one is a
            # template on purpose. Checking the copy also asks the more honest
            # question: is the file valid under the name it will really have?
            cp /usr/share/aquarius/apps/aquarius-editor.desktop.in /tmp/aquarius-editor.desktop
            if desktop-file-validate /tmp/aquarius-editor.desktop 2>/tmp/dfv.txt; then
              ok "the menu-entry template it installs is valid"
            else
              bad "the menu-entry template is not valid — the app would install and never appear"
              sed 's/^/       /' /tmp/dfv.txt
            fi
            rm -f /tmp/aquarius-editor.desktop
          else
            bad "/usr/share/aquarius/apps/aquarius-editor.desktop.in is missing"
          fi
          if [ -x /usr/bin/aquarius-editor ]; then
            ok "/usr/bin/aquarius-editor is still the front door"
            if grep -q '\.local/lib/aquarius' /usr/bin/aquarius-editor; then
              ok "and it looks for the app in the person's own home folder"
            else
              bad "the launcher does not look in ~/.local/lib/aquarius — it would never find an installed copy"
            fi
          else
            bad "/usr/bin/aquarius-editor is missing — the menu entry points at it"
          fi
          # The rehearsal, on the packaged image: every step of an install,
          # into a throwaway folder, with the two downloads stood in for.
          echo "-- rehearsing an install, with no network --"
          if /usr/libexec/aquarius-appimage-install --dry-run --progress-fd 2 \
               install os.aquarius.editor >/tmp/reh.txt 2>&1; then
            ok "the installer walked a whole install on this image"
          else
            bad "the installer could not walk an install on this image"
          fi
          sed 's/^/       /' /tmp/reh.txt
          for want in 'STEP 1/1 Aquarius Editor' 'releases/download/v0.7.2/SHA256SUMS.txt' \
                      'menu entry written to' 'is installed, and read back' 'PERCENT 100' 'DONE'; do
            if grep -qF "${want}" /tmp/reh.txt; then ok "  it said: ${want}"
            else bad "  the rehearsal never said: ${want}"; fi
          done

          # The app-grid entries, judged by the freedesktop project's own
          # checker rather than by us reading them.
          echo "== are the app-grid entries well-formed? =="
          for d in /usr/share/applications/aquarius-writer.desktop; do
            if desktop-file-validate "${d}" 2>/tmp/dfv.txt; then ok "$(basename "${d}") is valid"
            else bad "$(basename "${d}") is not valid — the app would never appear"; sed 's/^/       /' /tmp/dfv.txt; fi
          done

          # Electron on a scaled screen. Without this the Editor's window is
          # faintly out of focus at 125% and 150%, which is every 4K monitor.
          echo "== Electron draws sharply on a scaled screen =="
          if grep -qx 'ELECTRON_OZONE_PLATFORM_HINT=auto' /usr/lib/environment.d/60-aquarius-electron.conf 2>/dev/null; then
            ok "the session sets ELECTRON_OZONE_PLATFORM_HINT=auto"
          else
            bad "/usr/lib/environment.d/60-aquarius-electron.conf does not set ELECTRON_OZONE_PLATFORM_HINT=auto"
          fi
          if grep -q 'ELECTRON_OZONE_PLATFORM_HINT' /usr/bin/aquarius-editor; then
            ok "the Editor's launcher sets it too (for an app started outside a login session)"
          else
            bad "/usr/bin/aquarius-editor does not set ELECTRON_OZONE_PLATFORM_HINT"
          fi

          # ====================================================================
          # 2. THE APPS THAT ARRIVE FROM FLATHUB ON FIRST BOOT
          # ====================================================================
          echo
          echo "== the creator apps that arrive on first boot =="

          # Flatpak has to be new enough to have the preinstall command at all.
          # 1.16 is where this mechanism became usable; Fedora 44 ships 1.18.
          FPV="$(flatpak --version | awk '{print $NF}')"
          echo "  flatpak ${FPV}"
          MAJ="${FPV%%.*}"; REST="${FPV#*.}"; MIN="${REST%%.*}"
          if [ "${MAJ}" -gt 1 ] || { [ "${MAJ}" -eq 1 ] && [ "${MIN}" -ge 16 ]; }; then
            ok "flatpak ${FPV} is new enough for preinstall (needs 1.16 or later)"
          else
            bad "flatpak ${FPV} is too old for the preinstall mechanism"
          fi
          if flatpak preinstall --help >/dev/null 2>&1; then
            ok "'flatpak preinstall' exists — the native mechanism is what runs"
          else
            bad "no 'flatpak preinstall' command — the service would fall back to a loop that cannot honour a person's uninstall"
          fi

          LIST=/usr/share/flatpak/preinstall.d/aquarius-creator-apps.preinstall
          if [ -s "${LIST}" ]; then ok "the shopping list is in the image"
          else bad "${LIST} is missing — the OS would advertise a creator suite and install nothing"; fi

          echo "-- every app on the list --"
          grep -o '^\[Flatpak Preinstall [^]]*\]' "${LIST}" | sed 's/^\[Flatpak Preinstall //; s/\]$//' | sort > /tmp/ids.txt
          sed 's/^/     /' /tmp/ids.txt
          echo "  ($(wc -l < /tmp/ids.txt) entries)"

          # The apps Royce chose. Named here so that a deletion from the list is
          # a failed build and not a quiet regression nobody notices for weeks.
          for want in \
            com.obsproject.Studio org.kde.kdenlive org.kde.krita org.blender.Blender \
            org.ardour.Ardour org.audacityteam.Audacity org.gimp.GIMP org.inkscape.Inkscape \
            org.localsend.localsend_app md.obsidian.Obsidian com.google.Chrome \
            com.obsproject.Studio.Plugin.OBSVkCapture \
            com.obsproject.Studio.Plugin.PipeWireAudioCapture \
            org.freedesktop.Platform.VulkanLayer.OBSVkCapture \
            com.heroicgameslauncher.hgl net.lutris.Lutris net.davidotek.pupgui2 \
            com.github.Matoking.protontricks
          do
            if grep -qx "${want}" /tmp/ids.txt; then ok "on the list: ${want}"
            else bad "MISSING from the list: ${want}"; fi
          done

          # Firefox must NOT be on it: it is an ordinary system package, so it
          # works on a machine that has never been online. Listing it as well
          # would mean downloading a second browser nobody asked for.
          if grep -qx 'org.mozilla.firefox' /tmp/ids.txt; then
            bad "Firefox is on the Flatpak list as well as being an installed package — that is a second, duplicate browser"
          else
            ok "Firefox is not on the Flatpak list (it is a system package — correct)"
          fi
          if rpm -q firefox >/dev/null 2>&1; then ok "firefox is installed as a system package"
          else bad "firefox is neither a package nor on the Flatpak list — this image has no browser"; fi

          # A block without Branch= installs nothing, silently.
          blocks="$(grep -c '^\[Flatpak Preinstall ' "${LIST}")"
          branches="$(grep -c '^Branch=' "${LIST}")"
          if [ "${blocks}" -eq "${branches}" ]; then ok "all ${blocks} entries name a branch"
          else bad "${blocks} entries but ${branches} Branch= lines — an entry without one installs nothing, silently"; fi

          # The plug-ins are runtime extensions, not applications, and Flatpak
          # will not find one without IsRuntime=true.
          runtimes="$(grep -c '^IsRuntime=true' "${LIST}")"
          if [ "${runtimes}" -ge 5 ]; then ok "${runtimes} entries are marked IsRuntime=true (the OBS plug-ins and the Vulkan layer)"
          else bad "only ${runtimes} entries are marked IsRuntime=true — a plug-in without it is never found"; fi

          # The installer must be PRESENT and must NOT be switched on. Since
          # 2026-09-04 the app chooser asks the person which apps they want;
          # an image that enables this service downloads about ten gigabytes
          # before anybody has been asked, which is the behaviour we removed.
          # NOT `systemctl is-enabled` as a yes/no: a unit with no [Install]
          # section prints "static" and EXITS ZERO, so asking it that way says
          # "switched on" about a service nothing can switch on. Read what
          # actually decides it — the [Install] section and the .wants links.
          PREUNIT=/usr/lib/systemd/system/aquarius-flatpak-preinstall.service
          if [ ! -r "${PREUNIT}" ]; then
            bad "${PREUNIT} is missing — 'aq apps install --all' would have nothing to run"
          elif grep -q '^\[Install\]' "${PREUNIT}"; then
            bad "the installer has an [Install] section — it would fetch every app before the person was asked; the chooser is supposed to ask first"
          else
            ok "the installer has no [Install] section, so nothing switches it on (correct — the chooser asks first)"
          fi
          WANTS="$(find /etc/systemd/system /usr/lib/systemd/system -name 'aquarius-flatpak-preinstall.service' -path '*.wants/*' 2>/dev/null | sort || true)"
          if [ -n "${WANTS}" ]; then
            bad "something linked the installer into a .wants folder, which starts it at boot:"
            printf '%s\n' "${WANTS}" | sed 's/^/       /'
          else
            ok "and nothing has linked it into a .wants folder either"
          fi
          if [ -x /usr/libexec/aquarius-flatpak-preinstall ]; then ok "the installer script is there and runnable"
          else bad "/usr/libexec/aquarius-flatpak-preinstall is missing"; fi

          # The permissions, on the other hand, MUST be switched on. They are a
          # separate service precisely because the apps now arrive from the
          # chooser: an app installed by somebody else's hand still needs them,
          # and OBS with no camera permission is a silent failure.
          OVRSTATE="$(systemctl is-enabled aquarius-flatpak-overrides.service 2>&1 || true)"
          if [ "${OVRSTATE}" = "enabled" ]; then
            ok "the permissions service is switched on"
          else
            bad "aquarius-flatpak-overrides.service says '${OVRSTATE}', not 'enabled' — OBS would install and then not see a camera"
          fi

          # And it must actually do the copying when run.
          rm -rf /var/lib/flatpak/overrides
          /usr/libexec/aquarius-flatpak-preinstall --overrides-only >/tmp/ovr.txt 2>&1
          COPIED="$(find /var/lib/flatpak/overrides -type f 2>/dev/null | wc -l)"
          SHIPPED="$(find /usr/share/aquarius/flatpak-overrides -type f ! -name '*.md' | wc -l)"
          if [ "${COPIED}" -eq "${SHIPPED}" ] && [ "${COPIED}" -gt 0 ]; then
            ok "--overrides-only put all ${COPIED} permission files in place"
          else
            bad "--overrides-only placed ${COPIED} of ${SHIPPED} permission files:"
            sed 's/^/       /' /tmp/ovr.txt
          fi

          # A permission somebody set themselves is never overwritten.
          printf '[Context]\nfilesystems=home;\n' > /var/lib/flatpak/overrides/com.obsproject.Studio
          /usr/libexec/aquarius-flatpak-preinstall --overrides-only >/dev/null 2>&1
          if grep -q '^filesystems=home;$' /var/lib/flatpak/overrides/com.obsproject.Studio; then
            ok "a permission file somebody edited themselves is left alone"
          else
            bad "it overwrote a permission file the person had set — Flatseal changes would be lost at every boot"
          fi
          rm -rf /var/lib/flatpak/overrides

          # ------------------------------------------------------------------
          # RUN THE REAL PARSER AGAINST THE REAL FILE
          # ------------------------------------------------------------------
          # This is the check that was missing on 2026-09-04, when a reading
          # fault made the installer see zero apps on a full list and write the
          # "never look again" marker. Every check above reads the list file;
          # none of them ran the code that reads it on a real machine. These do.
          PARSED="$(/usr/libexec/aquarius-flatpak-preinstall --list | wc -l)"
          if [ "${PARSED}" -eq "${blocks}" ]; then
            ok "the installer's own parser finds all ${PARSED} apps"
          else
            bad "the parser finds ${PARSED} apps but the list holds ${blocks} — a machine would install the wrong set, or nothing"
          fi

          # THE EXACT BENCH CONDITION. /etc/flatpak/preinstall.d/ is empty on
          # every new machine — nobody has changed anything yet — and that
          # empty folder is what broke the reading. Prove it is harmless.
          rm -rf /etc/flatpak/preinstall.d
          mkdir -p /etc/flatpak/preinstall.d
          PARSED_EMPTY="$(/usr/libexec/aquarius-flatpak-preinstall --list | wc -l)"
          if [ "${PARSED_EMPTY}" -eq "${blocks}" ]; then
            ok "with an empty /etc/flatpak/preinstall.d (a brand-new machine) it still finds all ${PARSED_EMPTY}"
          else
            bad "with an empty /etc/flatpak/preinstall.d it finds ${PARSED_EMPTY} of ${blocks} — this is the 2026-09-04 fault, back again"
          fi

          # And an empty answer must be a loud failure, never a quiet success
          # that writes the marker. Checked by hiding the list from it.
          mv /usr/share/flatpak/preinstall.d /usr/share/flatpak/preinstall.d.hidden
          rm -f /etc/aquarius/flatpak-preinstall-done
          if /usr/libexec/aquarius-flatpak-preinstall >/tmp/empty.txt 2>&1; then
            bad "with no list at all the installer reported SUCCESS — that is how a machine silently never gets its apps"
          else
            ok "with no list at all the installer fails loudly (exit $?) instead of pretending it is done"
          fi
          if grep -q 'ERROR' /tmp/empty.txt; then ok "and it says ERROR in plain words"
          else bad "it failed without saying why:"; sed 's/^/       /' /tmp/empty.txt; fi
          if [ -e /etc/aquarius/flatpak-preinstall-done ]; then
            bad "it wrote the 'already done' marker on an empty list — the machine would never try again"
          else
            ok "it wrote no 'already done' marker (correct — it must try again)"
          fi
          mv /usr/share/flatpak/preinstall.d.hidden /usr/share/flatpak/preinstall.d

          # ------------------------------------------------------------------
          # THE CATALOG THE CHOOSER WINDOW IS DRAWN FROM
          # ------------------------------------------------------------------
          CAT=/usr/share/aquarius/apps/catalog.ini
          if [ -s "${CAT}" ]; then ok "the app catalog is in the image"
          else bad "${CAT} is missing — the chooser would have no names to show"; fi

          /usr/libexec/aquarius-flatpak-preinstall --catalog > /tmp/catalog.txt 2>/tmp/catalog.err
          CAT_RC=$?
          if [ "${CAT_RC}" -eq 0 ]; then ok "--catalog describes every app on the list"
          else bad "--catalog failed (exit ${CAT_RC}):"; sed 's/^/       /' /tmp/catalog.err; fi

          # ⚠️ THE CATALOG IS BIGGER THAN THE FLATPAK LIST SINCE 2026-09-04.
          # Aquarius Editor is not a Flatpak, so it has no block in Flatpak's
          # file at all — it lives only in catalog.ini, marked Type=appimage.
          # The catalog is the UNION, and that is what is checked.
          OURS="$(/usr/libexec/aquarius-flatpak-preinstall --list-appimage 2>/dev/null | grep -c . || true)"
          CAT_LINES="$(wc -l < /tmp/catalog.txt)"
          if [ "${CAT_LINES}" -eq "$(( blocks + OURS ))" ]; then
            ok "${CAT_LINES} catalog lines for ${blocks} Flatpaks and ${OURS} app(s) of ours"
          else
            bad "${CAT_LINES} catalog lines for ${blocks} Flatpaks + ${OURS} of ours — the chooser would show the wrong set"
          fi
          if [ "${OURS}" -ge 1 ]; then
            ok "${OURS} app(s) of ours are offered as downloads:"
            /usr/libexec/aquarius-flatpak-preinstall --list-appimage | sed 's/^/       /'
          else
            bad "NO app of ours is offered as a download — Aquarius Editor is neither in the image nor in the catalog, so nobody could ever get it"
          fi

          # The contract other programs read. Eight fields for a Flatpak, plus
          # the ninth (type:) that every line carries since 2026-09-04, and four
          # more on one of ours: source:, pin:, asset:, sha256sums:.
          FIELDS="$(awk -F'\t' '{print NF}' /tmp/catalog.txt | sort -un | tr '\n' ' ')"
          if [ "${FIELDS}" = "9 13 " ] || [ "${FIELDS}" = "9 " ]; then
            ok "every catalog line has the promised fields (${FIELDS}per line)"
          else
            bad "catalog lines have ${FIELDS}fields — a Flatpak line must have 9 and one of ours 13"
          fi
          # And the ninth field must really say which kind each one is.
          if awk -F'\t' '$9 !~ /^type:(flatpak|appimage)$/' /tmp/catalog.txt | grep -q .; then
            bad "a catalog line does not say what kind of app it is:"
            awk -F'\t' '$9 !~ /^type:(flatpak|appimage)$/ {print "       " $1 " -> " $9}' /tmp/catalog.txt
          else
            ok "every line says whether it is a Flatpak or one of ours"
          fi

          # Six shelves since R4, when Gaming was added (build_files/68-gaming.sh).
          SHELVES='^(Video|Audio|Design|Streaming|Utilities|Gaming)$'
          if awk -F'\t' -v s="${SHELVES}" '$4 !~ s' /tmp/catalog.txt | grep -q .; then
            bad "an app names a category the chooser cannot draw:"
            awk -F'\t' -v s="${SHELVES}" '$4 !~ s {print "       " $1 " -> " $4}' /tmp/catalog.txt
          else
            ok "every app sits on one of the six shelves the chooser draws"
          fi

          # The apps a person picks from, and the plug-ins that follow OBS
          # Studio. Derived from the shipped list rather than written down as a
          # number, so that adding an app to AquariusOS does not mean editing
          # this file — the invariant is that the two agree, not that either is
          # any particular size. The floor is there so an empty catalog, which
          # would satisfy "they agree" perfectly, still fails.
          VISIBLE="$(awk -F'\t' '$6=="runtime:no"' /tmp/catalog.txt | wc -l)"
          HIDDEN="$(awk -F'\t' '$6=="runtime:yes"' /tmp/catalog.txt | wc -l)"
          EXPECT_VISIBLE=$(( blocks - runtimes + OURS ))
          if [ "${VISIBLE}" -eq "${EXPECT_VISIBLE}" ] && [ "${HIDDEN}" -eq "${runtimes}" ] && [ "${VISIBLE}" -ge 10 ]; then
            ok "the chooser would offer ${VISIBLE} apps and quietly bring ${HIDDEN} plug-ins with OBS"
          else
            bad "the chooser would offer ${VISIBLE} apps with ${HIDDEN} plug-ins — the shipped list says ${EXPECT_VISIBLE} and ${runtimes}"
          fi

          # Every plug-in must say which app it belongs to, or it can never be
          # installed: the chooser never offers one directly.
          if awk -F'\t' '$6=="runtime:yes" && $7=="requires:-"' /tmp/catalog.txt | grep -q .; then
            bad "a plug-in does not say which app it belongs to, so nothing would ever install it:"
            awk -F'\t' '$6=="runtime:yes" && $7=="requires:-" {print "       " $1}' /tmp/catalog.txt
          else
            ok "every plug-in names the app it arrives with"
          fi

          echo "-- what the chooser will show --"
          awk -F'\t' '$6=="runtime:no" {printf "     [%s] %-28s %s\n", ($5=="recommended:yes" ? "x" : " "), $2, $4}' /tmp/catalog.txt

          # ------------------------------------------------------------------
          # THE LAST PAGE OF THAT WINDOW — read back out of the finished image
          # ------------------------------------------------------------------
          # ⚠️ THE 2026-09-04 BENCH FAULT. "All set." was drawn with a widget
          # that cannot carry the Aquarius mark, so the page you land on after
          # installing was blank at the top, and its main button offered to
          # open whichever app happened to install first rather than showing
          # you the apps. Both are fixed; these two checks are what stops them
          # coming back. The build already checks the same things in
          # build_files/66-creator-apps-chooser.sh — this asks the copy that is
          # actually in the image.
          CHOOSER=/usr/libexec/aquarius-creator-apps
          if grep -q 'mark, self\.done_title, self\.done_blurb = hero(' "${CHOOSER}"; then
            ok "the 'All set.' page is built from the same hero helper as page 1, so it carries the mark"
          else
            bad "the done page does not use the hero helper — it would have no Aquarius mark on it"
          fi
          if grep -q 'Adw\.StatusPage(' "${CHOOSER}"; then
            bad "the done page is an Adw.StatusPage again, which cannot show the mark"
          else
            ok "nothing in that window is an Adw.StatusPage"
          fi
          if grep -q 'pill_button("Open apps", suggested=True)' "${CHOOSER}"; then
            ok "the suggested button on that page is 'Open apps'"
          else
            bad "the done page's suggested button is not 'Open apps'"
          fi
          if grep -q 'first_app' "${CHOOSER}"; then
            bad "the done page still opens one app on the person's behalf"
          else
            ok "it no longer picks a single app to open"
          fi
          if grep -q '"qs", "ipc", "call", "search", "toggle"' "${CHOOSER}" \
             && grep -q '"ShowApplications"' "${CHOOSER}"; then
            ok "'Open apps' knows both desktops: the Aquarius palette and GNOME's app grid"
          else
            bad "'Open apps' is missing one of its two routes (qs ipc / org.gnome.Shell.ShowApplications)"
          fi

          # ------------------------------------------------------------------
          # THE PASSWORD SPLIT — the point of the 2026-09-04 change
          # ------------------------------------------------------------------
          # Aquarius Editor goes into the person's OWN home folder, so nothing
          # about installing it needs an administrator. Asking for a password to
          # write inside somebody's home folder would be theatre — and worse
          # than theatre, because the password prompt is the one part of this
          # feature that has actually failed on the bench (2026-09-04, no polkit
          # agent in the Aquarius session).
          #
          # Read with the chooser's own parser, in the finished image, because
          # "does it ask for a password" is not something a screenshot answers.
          echo
          echo "== picking only Aquarius Editor asks for no password =="
          "${CHOOSER}" --dry-run --select os.aquarius.editor > /tmp/ed.txt 2>&1 || true
          sed 's/^/       /' /tmp/ed.txt
          if grep -qx 'password prompts: 0' /tmp/ed.txt; then
            ok "no password prompt at all when only our own app is chosen"
          else
            bad "choosing only Aquarius Editor would still ask for a password"
          fi
          if grep -q '^  appimage: 1 app(s), steps 1-1 of 1' /tmp/ed.txt; then
            ok "and it goes to the home-folder installer"
          else
            bad "it does not go to the home-folder installer"
          fi

          echo "== picking both kinds runs two installers behind one bar =="
          "${CHOOSER}" --dry-run --select os.aquarius.editor,org.kde.kdenlive > /tmp/mix.txt 2>&1 || true
          sed 's/^/       /' /tmp/mix.txt
          if grep -qx 'installer runs: 2' /tmp/mix.txt && grep -qx 'password prompts: 1' /tmp/mix.txt; then
            ok "two installers, one password prompt, for the Flathub half only"
          else
            bad "the two-installer split is not what it should be"
          fi
          # Steps numbered straight through rather than restarting at one, which
          # is what --step-offset is for. Without it the bar jumps backwards.
          if grep -q 'steps 1-1 of 2' /tmp/mix.txt && grep -q 'steps 2-2 of 2' /tmp/mix.txt; then
            ok "the steps are numbered 1 and 2 of 2 across both installers"
          else
            bad "the two installers do not share one numbering — the progress bar would jump back to the start"
          fi

          # And the Included group must NOT claim the Editor any more: it is a
          # card now, and saying "Included" about an app that is not there is
          # the worst of both arrangements.
          if grep -q '"aquarius-editor.desktop"' "${CHOOSER}"; then
            bad "the chooser still lists Aquarius Editor as Included with AquariusOS — it is a download now"
          else
            ok "the chooser no longer claims Aquarius Editor is already installed"
          fi
          if grep -q '"aquarius-writer.desktop"' "${CHOOSER}"; then
            ok "Aquarius Writer is still shown as Included, because it really is"
          else
            bad "the chooser no longer shows Aquarius Writer as Included"
          fi

          # ------------------------------------------------------------------
          # `aq apps` — the same job in a terminal
          # ------------------------------------------------------------------
          # It must be discoverable (in `aq --help`) and it must agree with the
          # catalog rather than carry a list of its own.
          if aq --help 2>&1 | grep -q 'aq apps'; then ok "'aq apps' is in aq's own help"
          else bad "'aq apps' is not mentioned by 'aq --help' — nobody would find it"; fi

          AQ_LISTED="$(aq apps list 2>/dev/null | grep -c 'installed\|^  -')"
          if [ "${AQ_LISTED}" -eq "${VISIBLE}" ]; then
            ok "'aq apps list' shows the same ${AQ_LISTED} apps as the catalog"
          else
            bad "'aq apps list' shows ${AQ_LISTED} apps but the catalog has ${VISIBLE}"
          fi

          if aq apps status >/tmp/aqstatus.txt 2>&1; then ok "'aq apps status' runs"
          else bad "'aq apps status' failed:"; sed 's/^/       /' /tmp/aqstatus.txt; fi
          if grep -q 'flatpak preinstall -y --system' /tmp/aqstatus.txt; then
            ok "and it names the rescue command when apps are missing"
          else
            bad "'aq apps status' does not tell somebody how to install the missing apps"
          fi

          # A plug-in must never be installable by name — it belongs to an app.
          if aq apps install com.obsproject.Studio.Plugin.Gstreamer >/dev/null 2>&1; then
            bad "'aq apps install' accepted a plug-in as though it were an app"
          else
            ok "'aq apps install' refuses a plug-in and points at the app it belongs to"
          fi

          # Aquarius Editor has to be findable from the terminal too — as
          # available, not installed, because it is not in this image.
          if aq apps list 2>/dev/null | grep -q 'os.aquarius.editor'; then
            ok "'aq apps list' offers Aquarius Editor"
          else
            bad "'aq apps list' does not mention Aquarius Editor — nobody would find it from a terminal"
          fi
          if aq apps list 2>/dev/null | grep 'os.aquarius.editor' | grep -q 'installed'; then
            bad "'aq apps list' says Aquarius Editor is installed, and it is not in this image"
          else
            ok "and says it is not installed yet, which is the truth on a fresh image"
          fi
          for sub in update remove; do
            if aq apps 2>&1 | grep -q "aq apps ${sub}"; then
              ok "'aq apps ${sub}' is in the help"
            else
              bad "'aq apps ${sub}' is not mentioned in 'aq apps' help"
            fi
          done
          if aq apps update >/tmp/aqup.txt 2>&1; then
            ok "'aq apps update' runs"
          else
            ok "'aq apps update' ran and reported (exit non-zero is fine with no network)"
          fi
          sed 's/^/       /' /tmp/aqup.txt
          if grep -q 'not installed' /tmp/aqup.txt; then
            ok "and says Aquarius Editor is not installed on this image, which is right"
          else
            bad "'aq apps update' did not say what it found"
          fi

          # ====================================================================
          # 3. THE EXTRA PERMISSIONS
          # ====================================================================
          echo
          echo "== the extra permissions creator apps need =="
          # Read back through Flatpak's own parser, not by looking at the text.
          # /var/lib/flatpak/overrides is the ONLY folder Flatpak reads these
          # from — checked in Flatpak's source, because the two folders one
          # would guess are not read at all — and /var is scratch space in a
          # container, so this leaves nothing behind.
          mkdir -p /var/lib/flatpak/overrides

          # A known-good file first, so that "Flatpak cannot do this in a
          # container" is never mistaken for "our permission file is wrong".
          printf '[Context]\nshared=network;\n' > /var/lib/flatpak/overrides/com.aquariusos.OverrideSelfTest
          if flatpak override --system com.aquariusos.OverrideSelfTest >/tmp/ctl.txt 2>&1; then
            ok "Flatpak can read permission files here, so it is the judge"
          else
            bad "Flatpak cannot read even a known-good permission file — this check cannot say anything about ours"
            sed 's/^/       /' /tmp/ctl.txt
          fi
          rm -f /var/lib/flatpak/overrides/com.aquariusos.OverrideSelfTest

          for f in /usr/share/aquarius/flatpak-overrides/*; do
            base="$(basename "${f}")"
            case "${base}" in *.md) continue ;; esac
            cp "${f}" "/var/lib/flatpak/overrides/${base}"

            # ⚠️ NO --show ON THIS FIRST CALL, AND THAT IS THE WHOLE POINT.
            # `--show` prints the file back and checks almost nothing. Without
            # it, Flatpak actually interprets every key and value, which is the
            # path that rejects a misspelt permission like `xdg-vidoes` — a
            # mistake that is otherwise completely silent on a real machine.
            if out="$(flatpak override --system "${base}" 2>&1)"; then
              shown="$(flatpak override --system --show "${base}" 2>&1)"
              ok "${base} — Flatpak accepts it: $(printf '%s' "${shown}" | grep -v '^\[' | grep -v '^$' | tr '\n' ' ')"
            else
              bad "${base} — Flatpak refuses this permission file"
              printf '%s\n' "${out}" | sed 's/^/       /'
            fi
            rm -f "/var/lib/flatpak/overrides/${base}"
          done

          # OBS is the one that genuinely cannot work without help: no camera,
          # no capture card and no virtual camera without devices=all.
          if grep -qE '^devices=.*all' /usr/share/aquarius/flatpak-overrides/com.obsproject.Studio; then
            ok "OBS is granted the cameras and capture cards"
          else
            bad "OBS's override does not grant devices=all — its camera list would be empty"
          fi
          # And nothing may take the lazy way out.
          grep -lE '^filesystems=(.*;)?host(;|$)' /usr/share/aquarius/flatpak-overrides/* >/tmp/host.txt 2>/dev/null || true
          if [ -s /tmp/host.txt ]; then
            bad "these grant filesystems=host, which is the same as no sandbox at all:"; sed 's/^/       /' /tmp/host.txt
          else
            ok "no app is granted the whole computer (never filesystems=host)"
          fi

          # ====================================================================
          # 4. WHERE THE APPS APPEAR
          # ====================================================================
          echo
          echo "== the dock and the app grid =="
          FAV="$(GSETTINGS_BACKEND=memory gsettings get org.gnome.shell favorite-apps)"
          echo "  GNOME dock: ${FAV}"
          for want in aquarius-editor.desktop aquarius-writer.desktop; do
            if printf '%s' "${FAV}" | grep -q "${want}"; then ok "GNOME dock pins ${want}"
            else bad "GNOME dock does not pin ${want}"; fi
          done
          # Every name on that line has to be a real file, or the icon is
          # simply missing with no error anywhere.
          #
          # ⚠️ ONE DELIBERATE EXCEPTION SINCE 2026-09-04. Aquarius Editor is
          # pinned here and is NOT in the image: its menu entry lands in each
          # person's own ~/.local/share/applications/ when they install it. It
          # stays pinned on purpose — GNOME does not draw a name it cannot
          # resolve (no gap, no dead square, no error), and the moment the app
          # is installed the same name resolves and the icon takes the seat it
          # has always had. Named explicitly, not a wildcard, so a real typo in
          # any other name still fails. build_files/50-aquarius-desktop.sh
          # carries the same exception and the same note.
          printf '%s' "${FAV}" | tr -d "[]' " | tr ',' '\n' | grep -v '^$' > /tmp/fav.txt
          while read -r fav; do
            if [ -r "/usr/share/applications/${fav}" ]; then ok "  dock: ${fav}"
            elif [ "${fav}" = "aquarius-editor.desktop" ]; then
              ok "  dock: ${fav} (installed into each person's home folder on request)"
            else bad "  dock: ${fav} is pinned but is not in this image"; fi
          done < /tmp/fav.txt

          # The Aquarius Desktop's own dock. Its list may name the Flatpak apps,
          # because that dock skips a name it cannot find instead of drawing a
          # dead square.
          DOCK=/etc/skel/.config/aquarius-shell/dock.json
          if [ -r "${DOCK}" ]; then
            if python3 -c "import json,sys; d=json.load(open('${DOCK}')); assert isinstance(d.get('pinned'), list) and d['pinned']" 2>/tmp/dock.txt; then
              ok "the Aquarius dock's default list is valid JSON: $(python3 -c "import json;print(', '.join(json.load(open('${DOCK}'))['pinned']))")"
            else
              bad "${DOCK} is not readable as the dock expects"; sed 's/^/       /' /tmp/dock.txt
            fi
            if grep -q 'aquarius-editor.desktop' "${DOCK}" && grep -q 'aquarius-writer.desktop' "${DOCK}"; then
              ok "the Aquarius dock pins both Aquarius apps"
            else
              bad "the Aquarius dock does not pin the Aquarius apps"
            fi
          else
            bad "${DOCK} is missing — a new account would get the shell's built-in default instead of ours"
          fi

          # ====================================================================
          # 5. THE INGEST HELPER
          # ====================================================================
          echo
          echo "== the ingest helper (the flagship feature) =="
          if /usr/bin/aq-ingest --version >/dev/null 2>&1; then ok "aq-ingest runs: $(/usr/bin/aq-ingest --version)"
          else bad "aq-ingest does not run"; fi
          if /usr/bin/aq ingest --help 2>&1 | grep -q 'make camera files open in a video editor'; then
            ok "'aq ingest' is wired up"
          else
            bad "'aq ingest --help' does not print its help — the subcommand is not wired up"
          fi
          if /usr/bin/aq --help 2>&1 | grep -q 'aq ingest'; then ok "'aq --help' tells people it exists"
          else bad "'aq --help' does not mention ingest"; fi
          if [ -r /usr/share/nautilus-python/extensions/aquarius_editor_ready.py ]; then
            ok "the 'Make Editor-Ready' right-click menu is installed"
          else
            bad "the right-click menu is missing"
          fi
          for u in aq-ingest-watch.path aq-ingest-watch.service; do
            if [ -r "/usr/lib/systemd/user/${u}" ]; then ok "${u} is installed"
            else bad "/usr/lib/systemd/user/${u} is missing"; fi
          done
          if [ -e /usr/lib/systemd/user/default.target.wants/aq-ingest-watch.path ]; then
            bad "the watch folder is switched on by default — it must be opt-in"
          else
            ok "the watch folder is off until asked for (correct)"
          fi
          if [ -x /usr/libexec/aquarius-ingest-watch ]; then ok "the watch-folder helper is there"
          else bad "/usr/libexec/aquarius-ingest-watch is missing"; fi

          # ====================================================================
          # 6. THE VIRTUAL CAMERA
          # ====================================================================
          echo
          echo "== the virtual camera (OBS's Start Virtual Camera button) =="
          STAMP=/usr/share/aquarius/virtual-camera.txt
          if [ ! -r "${STAMP}" ]; then
            bad "${STAMP} is missing — the build did not record whether the virtual camera is in this image"
          else
            sed 's/^/     /' "${STAMP}"
            STATUS="$(sed -n 's/^status=//p' "${STAMP}")"
            KVER="$(ls -1 /usr/lib/modules/)"
            case "${STATUS}" in
              installed)
                if find "/usr/lib/modules/${KVER}" -name 'v4l2loopback.ko*' | grep -q .; then
                  ok "the module is in the image, for kernel ${KVER}"
                else
                  bad "the build says the virtual camera is installed, and there is no v4l2loopback module for ${KVER}"
                fi
                if grep -q 'v4l2loopback' "/usr/lib/modules/${KVER}/modules.dep"; then
                  ok "the kernel's index knows about it"
                else
                  bad "v4l2loopback is not in modules.dep — the kernel would not find it"
                fi
                if grep -qx 'v4l2loopback' /usr/lib/modules-load.d/aquarius-v4l2loopback.conf; then
                  ok "it is loaded at boot"
                else
                  bad "nothing loads it at boot, so the Virtual Camera button would still fail"
                fi
                if grep -q 'exclusive_caps=1' /usr/lib/modprobe.d/aquarius-v4l2loopback.conf; then
                  ok "exclusive_caps=1 (without it browsers show a black camera)"
                else
                  bad "exclusive_caps is not set — the virtual camera would be listed and black"
                fi
                ;;
              unavailable)
                # This used to be a warning and a shrug. Since 2026-09-04 the
                # kernel is pinned to the one Universal Blue's modules were
                # built for (build_files/58-kernel-pin.sh), so `unavailable`
                # cannot happen in a build that finished — and if it somehow
                # does, the image is missing a feature it claims to have.
                bad "the image says the virtual camera is NOT in it. The kernel is pinned now, so this should be impossible — see /usr/share/aquarius/kernel.txt above and docs/restart/kernel.md"
                ;;
              *)
                bad "${STAMP} says status=${STATUS}, which is not a status this check knows"
                ;;
            esac
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The creator layer in this image is wrong. Do not publish it."
            exit 1
          fi
          echo "All creator-layer checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-creator.sh

      # ==================================================================
      # THE WELCOME — the first three minutes, read back out of the image
      # ==================================================================
      # This is the window a brand-new person actually meets first: keyboard
      # style, then the creator apps, then a page of tips. build_files/
      # 67-welcome.sh checks it during the build; this asks the copy that is
      # really in the finished image, which is the habit the whole repo runs on.
      #
      # The two things that would be invisible in a screenshot and expensive on
      # somebody's first login:
      #
      #   * Mac must still be the preselected answer. Four things in this OS
      #     have to agree that Mac is the default and this is the one a person
      #     SEES.
      #   * Exactly ONE thing may open at login, and both sessions must open the
      #     SAME thing. GNOME reads /etc/xdg/autostart; labwc reads one file and
      #     never that folder — so the fact is written down twice and can drift.
      - name: Check the welcome flow in the finished image
        run: |
          set -euo pipefail
          cat > /tmp/verify-welcome.sh <<'SCRIPT'
          set -uo pipefail
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          WELCOME=/usr/libexec/aquarius-welcome
          CHOOSER=/usr/libexec/aquarius-creator-apps
          AUTOSTART=/etc/xdg/autostart/aquarius-welcome-firstrun.desktop
          OLD=/etc/xdg/autostart/aquarius-creator-apps-firstrun.desktop
          LABWC=/usr/share/aquarius/labwc/autostart

          echo "== the welcome is in the image =="
          if [ -x "${WELCOME}" ]; then ok "${WELCOME} is here and runnable"
          else bad "${WELCOME} is missing"; fi
          if [ -r /usr/share/aquarius/welcome.env ]; then
            ok "the build recorded what it did:"
            sed 's/^/       /' /usr/share/aquarius/welcome.env
          else
            bad "/usr/share/aquarius/welcome.env is missing — the build did not record what it did"
          fi

          echo
          echo "== the three steps, as the image itself describes them =="
          "${WELCOME}" --dry-run > /tmp/wel.txt 2>&1 || true
          sed 's/^/       /' /tmp/wel.txt
          if grep -qx 'steps: 3' /tmp/wel.txt; then ok "a brand-new account gets three steps"
          else bad "a brand-new account does not get three steps"; fi
          if grep -q '^step 2 of 3: apps' /tmp/wel.txt \
             && grep -qF "runs: ${CHOOSER} --embedded-flow" /tmp/wel.txt; then
            ok "step 2 runs the real creator-apps window, not a copy of it"
          else
            bad "step 2 does not run ${CHOOSER} --embedded-flow"
          fi

          echo
          echo "== Mac is still the preselected answer =="
          if grep -qx 'default choice: mac' /tmp/wel.txt; then
            ok "Mac is what the window opens on, as it is everywhere else in this OS"
          else
            bad "Mac is NOT the preselected keyboard style — the OS now disagrees with itself on its own first screen"
          fi
          if grep -q 'choice mac: Mac — Copy is ⌘C' /tmp/wel.txt \
             && grep -q 'choice windows: Windows — Copy is Ctrl+C' /tmp/wel.txt; then
            ok "both cards say what they mean in one keystroke each"
          else
            bad "the two keyboard cards no longer show their example keystroke"
          fi

          echo
          echo "== an account that already chose its apps is not asked again =="
          "${WELCOME}" --dry-run --pretend-apps-seen > /tmp/wel2.txt 2>&1 || true
          sed 's/^/       /' /tmp/wel2.txt
          if grep -qx 'steps: 2' /tmp/wel2.txt && grep -qx 'apps step: skipped' /tmp/wel2.txt; then
            ok "it gets the keyboard question and the last page, and nothing else"
          else
            bad "an existing account would be asked to choose its apps all over again"
          fi

          echo
          echo "== the keyboard answer goes through 'aq keys' and nowhere else =="
          if grep -q '\[AQ, "keys", mode\]' "${WELCOME}"; then
            ok "it runs the same command a person would type"
          else
            bad "it no longer delegates to 'aq keys'"
          fi
          if grep -qE 'mode=(mac|windows)' "${WELCOME}"; then
            bad "it carries a copy of the keys.conf format — two writers of one file is two ways to disagree"
          else
            ok "it carries no copy of the keys.conf file format"
          fi

          echo
          echo "== exactly one thing opens at login, and both sessions open it =="
          if [ -e "${OLD}" ]; then
            bad "${OLD} is still here — the creator-apps window would open twice at a first login"
          else
            ok "the old creator-apps first-login entry is gone"
          fi
          if grep -q 'aquarius-creator-apps --first-run' "${LABWC}" 2>/dev/null; then
            bad "the Aquarius session still opens the creator-apps window directly at login"
          else
            ok "the Aquarius session does not open it directly either"
          fi
          if [ -r "${AUTOSTART}" ]; then
            ok "the welcome's first-login entry is here"
            GNOME_CMD="$(sed -n 's/^Exec=//p' "${AUTOSTART}" | head -n 1)"
            echo "       GNOME runs: ${GNOME_CMD}"
            if grep -qF "${GNOME_CMD}" "${LABWC}"; then
              ok "and the Aquarius session runs exactly the same command"
            else
              bad "the two sessions run different commands at login"
            fi
          else
            bad "${AUTOSTART} is missing — a first GNOME login would show no welcome at all"
          fi
          # Guarded, because desktop-file-validate is a build-time tool that the
          # image is not obliged to keep. Its absence is not a fault in the
          # welcome, and reporting it as one would be a check that lies.
          if command -v desktop-file-validate >/dev/null 2>&1; then
            if desktop-file-validate "${AUTOSTART}" \
               && desktop-file-validate /usr/share/applications/aquarius-welcome.desktop; then
              ok "both menu entries are well-formed"
            else
              bad "one of the welcome's two menu entries is not a well-formed desktop entry"
            fi
          else
            echo "  note desktop-file-validate is not in this image; the build already validated both entries"
          fi

          echo
          echo "== 'aq welcome' is the way back to it =="
          if aq --help 2>&1 | grep -q 'aq welcome'; then
            ok "'aq welcome' is in aq's own help, so it is findable"
          else
            bad "'aq welcome' is not mentioned by 'aq --help' — nobody would find it"
          fi
          if aq welcome --help > /tmp/welhelp.txt 2>&1; then
            ok "'aq welcome --help' works"
          else
            bad "'aq welcome --help' failed:"; sed 's/^/       /' /tmp/welhelp.txt
          fi

          echo
          echo "== the creator-apps window is still an ordinary app =="
          # The whole change would be a regression if "Aquarius Apps" stopped
          # working on its own.
          if "${CHOOSER}" --dry-run > /tmp/chooser.txt 2>&1; then
            ok "'Aquarius Apps' still reads its list exactly as it did before"
          else
            bad "the --embedded-flow change broke the ordinary chooser:"
            sed 's/^/       /' /tmp/chooser.txt
          fi
          if grep -q 'subtitle="Step 2 of 3" if embedded else ""' "${CHOOSER}"; then
            ok "and it only claims to be 'Step 2 of 3' when the welcome opened it"
          else
            bad "the chooser's step subtitle is not conditional — it would say 'Step 2 of 3' when opened on its own"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The welcome flow in this image is wrong. Do not publish it."
            exit 1
          fi
          echo "All welcome checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-welcome.sh

      - name: Check the 'Make Editor-Ready' menu really loads in Files
        run: |
          set -euo pipefail
          # WHY THIS IS A CHECK OF ITS OWN
          #
          # The check above proves the extension FILE is in the image. On
          # 2026-09-04 that was true and the menu item still was not there: on
          # the bench, right-clicking an MP4 in Files offered nothing.
          #
          # The reason is that a Python file being present, and even compiling,
          # says nothing about whether it RUNS. This one stopped on its first
          # line, because it demanded extension interface 4.0 while the Nautilus
          # that Fedora 44 ships had already loaded 4.1:
          #
          #   ValueError: Namespace Nautilus is already loaded with version 4.1
          #
          # Files says nothing when an extension fails like that. The menu item
          # is simply absent. So this step loads the extension the way Files
          # loads it — inside the finished image, against the real Nautilus that
          # image ships — and then right-clicks a video at it and insists on
          # getting a menu item back. It is the only check here that runs our
          # extension rather than looking at it.
          #
          # AQ_NAUTILUS_REQUIRED=1 means "you may not skip": the test skips
          # itself where GNOME's libraries are missing, which is right on a Mac
          # and would be a silent hole here.
          podman run --rm --pull=never \
            -v "${GITHUB_WORKSPACE}/ingest/tests/test_nautilus_extension.py:/tmp/test_nautilus_extension.py:ro" \
            -e AQ_NAUTILUS_REQUIRED=1 \
            -e AQ_NAUTILUS_EXT=/usr/share/nautilus-python/extensions/aquarius_editor_ready.py \
            --entrypoint /usr/bin/python3 \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
            /tmp/test_nautilus_extension.py

      - name: Check the NVIDIA image can encode video on the graphics card
        if: matrix.nvidia == 1
        run: |
          set -euo pipefail
          # WHY THIS IS A CHECK OF ITS OWN
          #
          # NVENC is the video encoder built into every modern NVIDIA card. It
          # is the difference between exporting a video in three minutes and
          # exporting it in twenty, and it is the single biggest reason the
          # NVIDIA image is the primary creator target of this project
          # (standing decision 5).
          #
          # ffmpeg only offers it if it was COMPILED with it. Nothing about
          # having an NVIDIA driver installed puts it there, so "we ship the
          # NVIDIA driver" is not evidence, and the only honest question is the
          # one ffmpeg answers itself.
          cat > /tmp/verify-nvenc.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          ffmpeg -hide_banner -encoders > /tmp/enc.txt 2>&1 || true
          echo "== everything this ffmpeg can encode with an NVIDIA card =="
          grep -i 'nvenc\|nvidia\|cuda' /tmp/enc.txt | sed 's/^/     /' || echo "     (nothing at all)"

          for enc in h264_nvenc hevc_nvenc; do
            if grep -qw "${enc}" /tmp/enc.txt; then ok "ffmpeg can encode with ${enc}"
            else bad "ffmpeg has no ${enc} — exports would fall back to the processor and take many times longer"; fi
          done

          echo "== and the decoders that make a camera file play smoothly =="
          ffmpeg -hide_banner -decoders > /tmp/dec.txt 2>&1 || true
          grep -i 'cuvid\|nvdec' /tmp/dec.txt | sed 's/^/     /' || echo "     (none listed)"

          if [ "$fails" -ne 0 ]; then
            echo "::error::This NVIDIA image cannot use the graphics card to encode video."
            exit 1
          fi
          echo "NVENC checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-nvenc.sh

      # ------------------------------------------------------------------------
      # DaVinci Resolve — everything except Resolve
      # ------------------------------------------------------------------------
      # ⚠️ WHAT THIS CAN AND CANNOT PROVE, SAID PLAINLY.
      #
      # There is no DaVinci Resolve here — we may not distribute it — and no
      # graphics card in a GitHub runner. So nothing in CI can show that Resolve
      # starts. What it CAN show is that every piece AquariusOS is responsible
      # for arrived: the container machinery, the graphics-card plumbing, the
      # USB rules for a licence dongle, the app-grid entry, and four scripts
      # that parse.
      #
      # The runtime container has its own workflow and its own checks
      # (.github/workflows/build-resolve-runtime.yml). The real proof of both is
      # the bench: docs/restart/resolve.md.
      - name: Check the DaVinci Resolve support is really in there
        run: |
          set -euo pipefail
          cat > /tmp/verify-resolve.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          echo "== the container machinery Resolve runs inside =="
          for pkg in podman distrobox; do
            if rpm -q "${pkg}" > /dev/null 2>&1; then
              ok "${pkg} $(rpm -q --queryformat '%{VERSION}-%{RELEASE}' "${pkg}")"
            else
              bad "${pkg} is NOT installed — the Resolve container could not be built"
            fi
          done

          echo "== getting the graphics card into that container =="
          if [ "${EXPECTED_NVIDIA}" = "1" ]; then
            if rpm -q nvidia-container-toolkit > /dev/null 2>&1; then
              ok "nvidia-container-toolkit $(rpm -q --queryformat '%{VERSION}' nvidia-container-toolkit)"
            else
              bad "nvidia-container-toolkit is NOT installed — Resolve would say its GPU mode is unsupported"
            fi
            if command -v nvidia-ctk > /dev/null 2>&1; then
              ok "nvidia-ctk, the tool that describes the card to containers, is on the path"
            else
              bad "nvidia-ctk is missing"
            fi
            # The safety-net service, for driver builds without NVIDIA's own.
            # Its two Condition lines are the whole reason it is safe to ship:
            # without the second, it would fight nvidia-cdi-refresh for one file.
            if systemctl is-enabled aquarius-resolve-cdi.service > /dev/null 2>&1; then
              ok "the graphics-card safety-net service is switched on"
            else
              bad "aquarius-resolve-cdi.service is not switched on in the NVIDIA image"
            fi
            if grep -q '^ConditionPathExists=!/usr/lib/systemd/system/nvidia-cdi-refresh.service$' \
                 /usr/lib/systemd/system/aquarius-resolve-cdi.service; then
              ok "it stands down when NVIDIA's own service is present"
            else
              bad "the safety-net service would run alongside NVIDIA's own and fight it for one file"
            fi
          else
            # The AMD/Intel image ships the same file (system_files is one tree)
            # and must leave it switched off.
            if systemctl is-enabled aquarius-resolve-cdi.service > /dev/null 2>&1; then
              bad "the NVIDIA safety-net service is switched on in the AMD/Intel image"
            else
              ok "the NVIDIA safety-net service is correctly off in the AMD/Intel image"
            fi
          fi

          echo "== the scripts =="
          for f in /usr/libexec/aquarius-resolve-install \
                   /usr/libexec/aquarius-resolve-launch; do
            if [ -x "$f" ]; then ok "$(basename "$f") is present and runnable"
            else bad "$f is missing or not runnable"; fi
            if bash -n "$f" 2>/tmp/syn.txt; then ok "$(basename "$f") is valid shell"
            else bad "$f has a syntax error"; cat /tmp/syn.txt; fi
          done

          echo "== the shared window pieces =="
          # Three windows import this one file. A fault in it breaks all three,
          # so it is checked the way they use it — by importing it.
          if python3 -c 'import sys; sys.path.insert(0, "/usr/lib/aquarius/python"); import aquarius_ui; print("       StepRow, LogPane and the rest imported")' 2>/tmp/ui.txt; then
            ok "aquarius_ui imports cleanly"
          else
            bad "aquarius_ui cannot be imported — every AquariusOS window would fail to open"; cat /tmp/ui.txt
          fi

          echo "== the installer and uninstaller windows =="
          # "Install DaVinci Resolve" in the app grid opens a real application
          # window, not a terminal. It is Python against GTK 4 and libadwaita,
          # so three things have to be true, and a missing one shows up as an
          # icon that does nothing when clicked.
          for GUI in /usr/libexec/aquarius-resolve-installer \
                     /usr/libexec/aquarius-resolve-uninstaller; do
            if [ -x "${GUI}" ]; then ok "$(basename "${GUI}") is present and runnable"
            else bad "${GUI} is missing or not runnable — its app-grid entry would do nothing"; fi
            if python3 -c 'import py_compile, sys; py_compile.compile(sys.argv[1], cfile="/tmp/aq-gui-check.pyc", doraise=True)' "${GUI}" 2>/tmp/py.txt; then
              ok "$(basename "${GUI}") is valid Python"
            else
              bad "${GUI} has a syntax error"; cat /tmp/py.txt
            fi
            # ⚠️ THE 2026-09-04 BENCH FAULT, WHICH HAPPENED THREE TIMES. All
            # three AquariusOS windows finished on an Adw.StatusPage — a widget
            # that draws a small system symbol and CANNOT be given the Aquarius
            # mark — so the page you landed on after installing was blank at the
            # top while every page before it carried the logo. One shared
            # helper, aquarius_ui.hero(), draws the top of every page now. Read
            # back out of the finished image, which is the copy that ships.
            if grep -q 'Adw\.StatusPage(' "${GUI}"; then
              bad "$(basename "${GUI}") builds an Adw.StatusPage again — that page cannot show the Aquarius mark"
            else
              ok "$(basename "${GUI}") builds no Adw.StatusPage anywhere"
            fi
            for want in 'mark, title, blurb = aquarius_ui.hero(' \
                        'mark, self.working_title, self.working_blurb = aquarius_ui.hero(' \
                        'mark, self.done_title, self.done_blurb = aquarius_ui.hero(' \
                        'aquarius_ui.heading_row('; do
              if grep -qF "$want" "${GUI}"; then
                ok "$(basename "${GUI}"): $want"
              else
                bad "$(basename "${GUI}") no longer has '$want' — one of its pages would have no Aquarius mark"
              fi
            done
          done
          # The helper itself, in the image, where all three windows read it.
          for want in 'def hero(' 'def status_glyph(' 'def set_status_glyph(' 'def heading_row('; do
            if grep -qF "$want" /usr/lib/aquarius/python/aquarius_ui.py; then
              ok "the shared window pieces still have $want"
            else
              bad "aquarius_ui.py has lost '$want' — every AquariusOS window is built on it"
            fi
          done
          # ⚠️ ROYCE'S RULE, 2026-09-04: nothing a person READS may name another
          # Linux. The comments still say Rocky, because whoever maintains these
          # needs to know; the printable strings must not.
          leak=0
          for f in /usr/libexec/aquarius-resolve-install \
                   /usr/libexec/aquarius-resolve-installer \
                   /usr/libexec/aquarius-resolve-uninstaller \
                   /usr/share/applications/aquarius-install-resolve.desktop \
                   /usr/share/applications/aquarius-remove-resolve.desktop; do
            [ -r "$f" ] || continue
            if grep -vE '^[[:space:]]*#' "$f" | grep -qi 'rocky'; then
              bad "$(basename "$f") names Rocky Linux where a person can see it:"
              grep -vE '^[[:space:]]*#' "$f" | grep -i rocky | sed 's/^/       /'
              leak=1
            fi
          done
          [ "$leak" -eq 0 ] && ok "nothing a person reads names another Linux"
          # Removing is a window too, and reads the same channel with 3 steps.
          if aquarius-resolve-install --remove --dry-run --progress-fd 3 3>/tmp/rm.txt >/dev/null 2>&1 \
             || /usr/libexec/aquarius-resolve-install --remove --dry-run --progress-fd 3 3>/tmp/rm.txt >/dev/null 2>&1; then
            ok "the removal rehearsal ran"
            sed 's/^/       /' /tmp/rm.txt
          else
            bad "'aquarius-resolve-install --remove --dry-run' does not run"
          fi
          if grep -q '^STEP 3/3 Keeping your projects and settings$' /tmp/rm.txt; then
            ok "by default removing KEEPS your projects and settings"
          else
            bad "the default removal does not say it keeps your projects — that is the one thing it must never get wrong"
          fi
          # And the size and pointer Resolve is started with.
          LAUNCH=/usr/libexec/aquarius-resolve-launch
          for want in QT_AUTO_SCREEN_SCALE_FACTOR=0 'QT_SCALE_FACTOR=${SCALE}' \
                      'QT_DEVICE_PIXEL_RATIO=${SCALE}' 'aquarius-display-scale --effective-scale' \
                      XCURSOR_THEME= XCURSOR_SIZE= XCURSOR_PATH=; do
            if grep -qF "$want" "$LAUNCH"; then ok "the launcher passes $want"
            else bad "the launcher no longer passes $want — Resolve would open small, or with the wrong pointer"; fi
          done
          EFF="$(/usr/libexec/aquarius-display-scale --effective-scale 2>&1 || true)"
          case "$EFF" in
            ''|*[!0-9.]*) bad "'--effective-scale' printed '$EFF', not a number — the launcher would have nothing to hand Resolve" ;;
            *) ok "'--effective-scale' answers '$EFF' even on a machine with no screens" ;;
          esac
          # Importing needs no screen — it loads the typelib files and stops.
          # This is the check that catches a missing python3-gobject, which is
          # the one package of the three that GNOME does not already bring in.
          if python3 -c 'import gi; gi.require_version("Gtk","4.0"); gi.require_version("Adw","1"); from gi.repository import Gtk, Adw' 2>/tmp/gi.txt; then
            ok "Python can reach GTK 4 and libadwaita"
          else
            bad "Python cannot import GTK 4 and libadwaita — the installer window could not be drawn"
            cat /tmp/gi.txt
          fi
          for pkg in python3-gobject gtk4 libadwaita; do
            if rpm -q "${pkg}" > /dev/null 2>&1; then
              ok "${pkg} $(rpm -q --queryformat '%{VERSION}' "${pkg}")"
            else
              bad "${pkg} is NOT installed — the installer window is built out of it"
            fi
          done

          echo "== the progress channel the window reads =="
          # The window and the installer script have to agree on a handful of
          # structured lines, and the only way to know they still do is to run
          # them. --dry-run walks all six steps and installs nothing at all, so
          # this is safe here: no graphics card, no download, no network.
          #
          # It is also what Royce runs on the bench to look at the window
          # without reinstalling Resolve:  aq resolve install --gui --dry-run
          if /usr/libexec/aquarius-resolve-install --dry-run --progress-fd 3 \
               3>/tmp/progress.txt >/tmp/dryrun.txt 2>&1; then
            ok "the rehearsal ran"
          else
            bad "'aquarius-resolve-install --dry-run' does not run"
            cat /tmp/dryrun.txt
          fi
          echo "       --- what came back on the progress channel ---"
          sed 's/^/       /' /tmp/progress.txt

          # In order, 1..6, and nothing skipped. The window draws its list of
          # steps from these, so a gap here is a window that never ticks a box.
          n=0
          while IFS= read -r line; do
            case "${line}" in
              "STEP "*)
                n=$((n + 1))
                want="STEP ${n}/6 "
                case "${line}" in
                  "${want}"*) : ;;
                  *) bad "expected a line starting '${want}' and got: ${line}" ;;
                esac
                ;;
            esac
          done < /tmp/progress.txt
          if [ "${n}" = "6" ]; then
            ok "all six steps were announced, in order"
          else
            bad "the rehearsal announced ${n} steps, not 6"
          fi
          if grep -q '^PERCENT ' /tmp/progress.txt; then
            ok "PERCENT lines are sent — the bar can fill rather than only pulse"
          else
            bad "no PERCENT line was sent"
          fi
          if [ "$(tail -1 /tmp/progress.txt)" = "DONE" ]; then
            ok "it ends with DONE, which is what moves the window to its last page"
          else
            bad "the rehearsal did not end with DONE — the window would never say it had finished"
          fi
          # A rehearsal that installed something would be a serious bug.
          if [ -e /opt/resolve ] || podman container exists aquarius-resolve 2>/dev/null; then
            bad "--dry-run changed something. It must change nothing at all."
          else
            ok "the rehearsal changed nothing, which is the whole point of it"
          fi

          echo "== the two questions the window asks before it starts =="
          # Captured, not piped into grep: `grep -q` stops early and pipefail
          # then reports the killed producer as a failed pipeline.
          GPU_LINE="$(/usr/libexec/aquarius-resolve-install --gpu-summary || true)"
          echo "       ${GPU_LINE}"
          if printf '%s' "${GPU_LINE}" | grep -Eq "^(ok|warn|none)$(printf '\t')"; then
            ok "'--gpu-summary' answers as a word, a tab and a sentence"
          else
            bad "'--gpu-summary' does not answer in the shape the window reads"
          fi
          # There is no Resolve download in a build container, so finding one
          # would mean the search is matching something it should not.
          if /usr/libexec/aquarius-resolve-install --find-installer >/dev/null 2>&1; then
            bad "'--find-installer' claims to have found a Resolve download in a container that has none"
          else
            ok "'--find-installer' correctly finds nothing here"
          fi

          echo "== which runtime container this image will pull =="
          ENVFILE=/usr/share/aquarius/resolve/runtime.env
          if [ ! -r "${ENVFILE}" ]; then
            bad "${ENVFILE} is missing — nothing would know which container to download"
          else
            grep -E '^AQ_RESOLVE' "${ENVFILE}" | sed 's/^/       /'
            grep -Eq '^AQ_RESOLVE_RUNTIME_IMAGE=ghcr\.io/[a-z0-9-]+/aquarius-resolve-runtime$' "${ENVFILE}" \
              && ok "the runtime image is named" \
              || bad "the runtime image name is not the shape it should be"
            # An Enterprise Linux release number, never `latest`. A moving tag
            # would one day follow us to Rocky 10 — which has the modern GLib
            # this whole design exists to avoid — without anybody deciding to.
            grep -Eq '^AQ_RESOLVE_RUNTIME_TAG=[0-9]+$' "${ENVFILE}" \
              && ok "it is pinned to an Enterprise Linux release, not a moving tag" \
              || bad "the runtime tag is not a release number — a moving tag could change userland by accident"
          fi

          echo "== the USB rules for a Studio licence dongle and a control panel =="
          # These must be on the HOST. Resolve's own installer writes them
          # inside the container, where they apply to nothing, and this system
          # folder is read-only so nothing can add them afterwards.
          RULES=/usr/lib/udev/rules.d/75-aquarius-resolve.rules
          if [ ! -r "${RULES}" ]; then
            bad "${RULES} is missing — a Resolve Studio dongle would not be seen"
          else
            grep -q 'idVendor}=="1edb"' "${RULES}" \
              && ok "Blackmagic Design hardware (1edb) has a rule" \
              || bad "no rule for Blackmagic Design hardware"
            grep -q 'idVendor}=="096e"' "${RULES}" \
              && ok "the Studio USB licence dongle (096e) has a rule" \
              || bad "no rule for the Studio licence dongle"
          fi

          echo "== the way in that needs no terminal =="
          DESK=/usr/share/applications/aquarius-install-resolve.desktop
          if [ ! -r "${DESK}" ]; then
            bad "${DESK} is missing — there would be no 'Install DaVinci Resolve' in the app grid"
          else
            cat "${DESK}" | sed 's/^/       /'
            if desktop-file-validate "${DESK}"; then
              ok "it passes freedesktop's own validator"
            else
              bad "it is not a valid desktop entry — the app grid would silently ignore it"
            fi
            grep -q '^Exec=/usr/libexec/aquarius-resolve-installer$' "${DESK}" \
              && ok "it opens the installer window" \
              || bad "it does not point at /usr/libexec/aquarius-resolve-installer"
            # Must match the application id the window sets, or a running
            # installer appears in the dock as a nameless generic window.
            grep -q '^StartupWMClass=org.aquariusos.ResolveInstaller$' "${DESK}" \
              && ok "the desktop can tell which window belongs to it" \
              || bad "StartupWMClass does not match the window's application id"
          fi

          echo "== the aq resolve command =="
          if aq resolve --help > /tmp/help.txt 2>&1; then
            ok "'aq resolve --help' runs"
            head -6 /tmp/help.txt | sed 's/^/       /'
          else
            bad "'aq resolve --help' does not run"
            cat /tmp/help.txt
          fi
          # `aq resolve status` on a machine with no container must say so
          # calmly rather than fall over. This is the state every new machine is
          # in, so it is the state most people will see first.
          if aq resolve status > /tmp/status.txt 2>&1; then
            ok "'aq resolve status' runs on a machine with nothing installed"
            head -8 /tmp/status.txt | sed 's/^/       /'
          else
            bad "'aq resolve status' fails when Resolve is not installed — which is every new machine"
            cat /tmp/status.txt
          fi

          echo "== and: no Blackmagic software is in this image =="
          # We may not distribute it. Making this impossible beats remembering.
          if [ -e /opt/resolve ]; then
            bad "/opt/resolve exists. We may not distribute Blackmagic's software. DO NOT PUBLISH."
          else
            ok "nothing of Blackmagic's is in this image"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The DaVinci Resolve support is incomplete."
            exit 1
          fi
          echo "All DaVinci Resolve checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            -e EXPECTED_NVIDIA="${NVIDIA}" \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-resolve.sh

      # ------------------------------------------------------------------------
      # The gaming layer (Phase R4)
      # ------------------------------------------------------------------------
      # ⚠️ WHAT THIS CAN AND CANNOT PROVE.
      #
      # There is no graphics card in a GitHub runner, no controller plugged
      # into it and no Steam account, so nothing here can show that a game
      # runs. What it CAN show is that every piece AquariusOS is responsible
      # for arrived and is the piece we meant: the programs, the 32-bit
      # libraries a Windows game needs, the controller kernel modules matched
      # to THIS image's kernel, the udev rules, the Gaming shelf in the app
      # chooser — and, the check that matters most, that adding Terra did not
      # quietly replace Fedora's graphics driver.
      #
      # The real proof is the bench: docs/restart/gaming.md.
      - name: Check the gaming layer is really in there
        run: |
          set -euo pipefail
          cat > /tmp/verify-gaming.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          echo "== the programs =="
          for pkg in steam gamescope gamemode mangohud vkBasalt umu-launcher \
                     steam-devices terra-release; do
            if rpm -q "${pkg}" > /dev/null 2>&1; then
              ok "${pkg} $(rpm -q --queryformat '%{VERSION}-%{RELEASE}' "${pkg}")"
            else
              bad "${pkg} is NOT installed"
            fi
          done

          echo "== where they came from =="
          rpm -q --queryformat '     %{NAME}-%{VERSION} (vendor: %{VENDOR})\n' \
            steam umu-launcher gamescope mangohud 2>&1 || true

          echo "== THE ONE THAT MATTERS: Fedora still owns the graphics driver =="
          # Terra publishes a Valve-patched Mesa. We deliberately do not take
          # it: this machine's job is colour-accurate video work and a graphics
          # driver that moves on a gaming schedule is the wrong risk. If a
          # future edit ever adds terra-release-mesa, everything else would
          # still pass and only this check would notice.
          if rpm -q terra-release-mesa > /dev/null 2>&1; then
            bad "terra-release-mesa is installed — the graphics driver is no longer Fedora's"
          else
            ok "terra-release-mesa is not installed"
          fi
          for pkg in mesa-dri-drivers mesa-vulkan-drivers; do
            vendor="$(rpm -q --queryformat '%{VENDOR}' "${pkg}" 2>/dev/null || echo missing)"
            echo "     ${pkg}: ${vendor}"
            case "${vendor}" in
              *Fedora*) ok "${pkg} is Fedora's" ;;
              *)        bad "${pkg}'s vendor is '${vendor}' — not Fedora's" ;;
            esac
          done

          echo "== Terra is present but switched off =="
          # So that nothing on a user's machine can take a Terra package by
          # accident later. Read out of the repository file itself.
          if [ -r /etc/yum.repos.d/terra.repo ]; then
            ok "the Terra repository file is in the image"
            sed 's/^/     /' /etc/yum.repos.d/terra.repo
            if dnf repolist --enabled 2>/dev/null | awk 'NR>1 {print $1}' | grep -qx 'terra'; then
              bad "Terra is ENABLED — it could replace Fedora packages without anybody asking"
            else
              ok "Terra is disabled by default"
            fi
          else
            bad "there is no /etc/yum.repos.d/terra.repo — Steam's source is not recorded in the image"
          fi

          echo "== the 32-bit libraries a Windows game needs =="
          # Missing these is the classic "the game launches and instantly
          # closes" on Linux, and it produces no error message worth reading.
          for pkg in mesa-dri-drivers mesa-vulkan-drivers mesa-libGL vulkan-loader mangohud vkBasalt; do
            if rpm -q "${pkg}.i686" > /dev/null 2>&1; then
              ok "${pkg}.i686"
            else
              bad "${pkg}.i686 is missing — 32-bit games would not start"
            fi
          done

          if [ "${EXPECTED_NVIDIA}" = "1" ]; then
            echo "== and the 32-bit NVIDIA libraries (NVIDIA image only) =="
            if rpm -q --queryformat '%{ARCH}\n' nvidia-driver-libs 2>/dev/null | grep -qx i686; then
              ok "nvidia-driver-libs is present in its 32-bit form"
              rpm -q --queryformat '     %{NAME}-%{VERSION}.%{ARCH}\n' nvidia-driver-libs
            else
              bad "no 32-bit nvidia-driver-libs — 32-bit games would not reach the graphics card"
            fi
          fi

          echo "== the Xbox controller drivers =="
          # These used to be allowed to be absent, because the ready-made
          # modules are built against one exact kernel and for a day or two
          # after a Fedora kernel update they did not match ours. Since
          # 2026-09-04 the kernel is pinned to theirs, so they must be here:
          # the stamp file is required AND its answer has to be `installed`.
          stamp=/usr/share/aquarius/gaming/controllers.txt
          if [ -r "${stamp}" ]; then
            ok "the image records what happened to the controller drivers"
            sed 's/^/     /' "${stamp}"
          else
            bad "${stamp} is missing — the image cannot say whether the Xbox drivers are in it"
          fi
          kver="$(ls -1 /usr/lib/modules | head -1)"
          echo "     this image runs kernel: ${kver}"
          for pair in "xone:xone_dongle" "xpadneo:hid-xpadneo"; do
            name="${pair%%:*}"; mod="${pair##*:}"
            status="$(sed -n "s/^${name}=//p" "${stamp}" 2>/dev/null || true)"
            found="$(find "/usr/lib/modules/${kver}" -name "${mod}.ko*" 2>/dev/null | head -1)"
            case "${status}" in
              installed)
                if [ -n "${found}" ]; then
                  ok "${name}: says installed, and ${mod} really is under this kernel"
                else
                  bad "${name}: the stamp says installed but no ${mod} module is under ${kver}"
                fi
                if grep -q "${mod}" "/usr/lib/modules/${kver}/modules.dep" 2>/dev/null; then
                  ok "${name}: the kernel's index knows about it"
                else
                  bad "${name}: not in modules.dep — the kernel would not find it at boot"
                fi
                ;;
              unavailable)
                # Same change as the virtual camera, same date, same reason: the
                # kernel is pinned, so a missing controller driver is a fault
                # rather than a scheduling accident.
                bad "${name}: the image says this driver is NOT in it. The kernel is pinned now, so this should be impossible — see /usr/share/aquarius/kernel.txt and docs/restart/kernel.md"
                ;;
              *)
                bad "${name}: the stamp says '${status}', which is neither installed nor unavailable"
                ;;
            esac
          done

          echo "== the controller USB rules =="
          if rpm -ql steam-devices 2>/dev/null | grep -q 'rules.d'; then
            ok "steam-devices installed udev rules"
            rpm -ql steam-devices | grep 'rules.d' | sed 's/^/     /'
          else
            bad "no udev rules from steam-devices — controllers would need administrator rights"
          fi

          echo "== the memory-map limit Proton needs =="
          # Games under Proton ask for far more memory maps than the historic
          # Linux limit allows, and going over it does not fail cleanly.
          grep -rhs '^[[:space:]]*vm\.max_map_count' /usr/lib/sysctl.d /etc/sysctl.d > /tmp/mm.txt 2>/dev/null || true
          if [ -s /tmp/mm.txt ]; then
            sed 's/^/     /' /tmp/mm.txt
            highest="$(awk -F= '{gsub(/[^0-9]/,"",$2); if ($2+0>m) m=$2+0} END {print m+0}' /tmp/mm.txt)"
            if [ "${highest}" -ge 1048576 ]; then
              ok "vm.max_map_count is ${highest}"
            else
              bad "vm.max_map_count is only ${highest} — Proton games would stutter and then die"
            fi
          else
            bad "nothing sets vm.max_map_count at all"
          fi

          echo "== gamemode starts on demand, and is not enabled at boot =="
          if [ -r /usr/share/dbus-1/services/com.feralinteractive.GameMode.service ]; then
            ok "gamemode is wired to start when a game asks for it"
          else
            bad "gamemode has no D-Bus activation file"
          fi

          echo "== MangoHud is installed and OFF =="
          # An overlay stuck over every 3D program — Blender included — is
          # nobody's idea of a default.
          if grep -rqs 'MANGOHUD=1' /usr/lib/environment.d /etc/environment.d 2>/dev/null; then
            bad "something switches MangoHud on for everything"
          else
            ok "nothing turns MangoHud on by itself"
          fi

          echo "== gamescope's permissions came from Fedora, not from us =="
          # Fedora's own gamescope package grants CAP_SYS_NICE in the RPM. That
          # permission has a history of confusing gamescope on NVIDIA
          # (gamescope #521 / #1370), but overriding a distribution's packaging
          # on every build, for a fault we have not seen on our own hardware,
          # is the wrong trade — docs/restart/gaming.md carries the one-line
          # test to run if the bench ever does see it.
          #
          # What must never happen is OUR build quietly granting a capability.
          # So the question is not "are there capabilities" but "did the
          # package declare them".
          declared="$(rpm -q --filecaps gamescope 2>/dev/null | awk '$1 == "/usr/bin/gamescope" { $1 = ""; sub(/^[[:space:]]+/, ""); print }')"
          echo "     the package declares: ${declared:-(none)}"
          if command -v getcap > /dev/null 2>&1; then
            actual="$(getcap /usr/bin/gamescope 2>/dev/null | awk '{ $1 = ""; sub(/^[[:space:]]+/, ""); print }')"
            echo "     the file actually has: ${actual:-(none)}"
            if [ -z "${actual}" ]; then
              ok "gamescope carries no capabilities at all"
            elif [ -n "${declared}" ]; then
              ok "the capabilities on gamescope are the ones Fedora's package ships"
            else
              bad "gamescope has capabilities its package does not declare — something in the build granted them"
            fi
          else
            echo "     (getcap is not in the image; the package's declaration above is the answer)"
          fi

          echo "== the menu entries =="
          for f in /usr/share/applications/steam.desktop \
                   /usr/share/applications/aquarius-steam-bigpicture.desktop; do
            if [ -r "$f" ]; then ok "$(basename "$f")"; else bad "$f is missing"; fi
          done
          grep -q '^Exec=steam -bigpicture$' /usr/share/applications/aquarius-steam-bigpicture.desktop \
            && ok "the Big Picture entry starts Steam full screen" \
            || bad "the Big Picture entry does not run 'steam -bigpicture'"

          echo "== the Gaming shelf in the app chooser =="
          # Read with the chooser's own parser, in the finished image — the
          # same discipline as the creator apps, and for the same reason.
          /usr/libexec/aquarius-flatpak-preinstall --catalog > /tmp/cat.txt 2>/dev/null || true
          awk -F'\t' '$4 == "Gaming" { print "     " $1 "  " $2 "  [" $5 "]" }' /tmp/cat.txt
          gaming="$(awk -F'\t' '$4 == "Gaming"' /tmp/cat.txt | wc -l)"
          if [ "${gaming}" -ge 4 ]; then
            ok "${gaming} apps on the Gaming shelf"
          else
            bad "only ${gaming} apps on the Gaming shelf"
          fi
          ticked="$(awk -F'\t' '$4 == "Gaming" && $5 == "recommended:yes"' /tmp/cat.txt | wc -l)"
          if [ "${ticked}" -eq 0 ]; then
            ok "none of them are ticked by default"
          else
            bad "${ticked} gaming app(s) are ticked by default"
          fi
          for id in com.heroicgameslauncher.hgl net.lutris.Lutris net.davidotek.pupgui2 com.github.Matoking.protontricks; do
            if awk -F'\t' -v want="${id}" '$1 == want { found = 1 } END { exit !found }' /tmp/cat.txt; then
              ok "${id} is offered"
            else
              bad "${id} is not on the shelf"
            fi
          done
          # Steam must NOT be a Flatpak card — it is a system program, and the
          # chooser shows it in the "Included with AquariusOS" group instead.
          if grep -q 'com.valvesoftware.Steam' /tmp/cat.txt; then
            bad "Steam is listed as a Flatpak to install — it is already in the image"
          else
            ok "Steam is not offered as a download (it is already installed)"
          fi
          grep -q '"steam.desktop"' /usr/libexec/aquarius-creator-apps \
            && ok "the chooser lists Steam under Included with AquariusOS" \
            || bad "the chooser does not know Steam is included"

          echo "== and the whole of Wine did not come along for the ride =="
          # protontricks and winetricks were in the first version of this layer
          # and between them pulled in 1.5 GB of Wine that nothing in this image
          # uses - Steam brings its own Proton, umu fetches its own runtime.
          # Protontricks is offered as a Flatpak instead. If Wine ever returns
          # it will be as somebody's silent dependency, and this is the only
          # thing that would notice.
          if rpm -q wine-core > /dev/null 2>&1; then
            bad "wine-core is installed — 1.3 GiB nothing in this image needs; find what pulled it in"
          else
            ok "wine-core is not in this image"
          fi

          echo "== the note that ships in the image =="
          if [ -r /usr/share/aquarius/gaming/README.md ]; then
            ok "/usr/share/aquarius/gaming/README.md is there"
          else
            bad "the plain-language gaming note is missing from the image"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The gaming layer is incomplete."
            exit 1
          fi
          echo "All gaming checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            -e EXPECTED_NVIDIA="${NVIDIA}" \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-gaming.sh

      # ------------------------------------------------------------------------
      # PUBLISHING
      # ------------------------------------------------------------------------
      # ⚠️ EVERY STEP FROM HERE DOWN ONLY RUNS ON THE REAL LINE — which is
      # `main` after the 4 September 2026 branch rename, and was
      # `restart/fedora-bootc` before it. Both are named, so this file is
      # correct on either side of that rename.
      #
      # Side branches (`restart/aquarius-keys`, `restart/r3-apps` and any
      # future one) build the
      # image and run every check above, and then stop. They must not publish,
      # because publishing means pushing to the `aquarius-os:latest` tags
      # that real machines update from — so a half-finished side branch would
      # overwrite the working image on the bench PC with its own work in
      # progress. Building and checking is the whole value of running CI on a
      # side branch; publishing from one is only a way to break something.
      #
      # Fable removes these `if:` lines when a side branch is merged back.

      # ------------------------------------------------------------------------
      # THE SAFETY CATCH — do not publish over history that was never saved
      # ------------------------------------------------------------------------
      # `aquarius-os:latest` and `aquarius-os-nvidia:latest` used to be the
      # older, Bazzite-based operating system. From 4 September 2026 they are
      # this one. The moment this workflow publishes, the older image stops
      # being findable by name — so before that ever happens, all six Bazzite
      # images must have been copied to a permanent `bazzite-final` tag.
      #
      # That copying is a separate workflow ("Archive the Bazzite image tags"),
      # run once, by hand. This step is what makes forgetting it impossible: it
      # simply asks the registry whether the archive exists, and stops the run
      # if it does not. Nothing has been pushed at this point, so stopping here
      # costs a build and breaks nothing.
      #
      # Once the archive exists this step is six quick questions to the registry
      # and always passes. It stays in the file because the archive is the only
      # copy of a year's work, and a check that has already saved you once is
      # not worth deleting.
      - name: Check the Bazzite images were archived first
        if: github.ref_name == 'main' || github.ref_name == 'restart/fedora-bootc'
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          if ! command -v skopeo >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y skopeo
          fi

          # Reading a public package needs no credentials, but signing in costs
          # nothing and means a package that has been made private does not look
          # like a missing archive.
          echo "${GH_TOKEN}" | skopeo login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin >/dev/null 2>&1 || true

          missing=0
          for img in aquarius-os aquarius-os-nvidia aquarius-os-deck \
                     aquarius-os-gnome aquarius-os-gnome-nvidia aquarius-os-gnome-deck; do
            ref="docker://ghcr.io/${OWNER,,}/${img}:bazzite-final"
            if digest="$(skopeo inspect --no-tags --format '{{.Digest}}' "${ref}" 2>/dev/null)"; then
              echo "  OK   ${img}:bazzite-final  ${digest}"
            else
              echo "  FAIL ${img}:bazzite-final is not there"
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            {
              echo "### Stopped before publishing — on purpose"
              echo ""
              echo "The image built and passed every check. It was **not published**, because"
              echo "the older Bazzite images have not been saved under their permanent"
              echo "\`bazzite-final\` tag yet, and publishing would take their names away."
              echo ""
              echo "**What to do:**"
              echo ""
              echo "1. Actions → **Archive the Bazzite image tags** → *Run workflow*"
              echo "   (leave the dry-run box ticked the first time, then run it again unticked)."
              echo "2. Come back to this run and press **Re-run all jobs**."
              echo ""
              echo "The whole sequence is written out in \`docs/restart/final-names.md\`."
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "::error::The Bazzite images have not been archived yet, so publishing would overwrite them. Run 'Archive the Bazzite image tags' first — see docs/restart/final-names.md."
            exit 1
          fi
          echo "The Bazzite images are safely archived. Publishing is allowed."

      - name: Work out the tags to publish under
        if: github.ref_name == 'main' || github.ref_name == 'restart/fedora-bootc'
        id: tags
        run: |
          alias_tags="$(just generate-build-tags "${IMAGE_NAME}" "${DEFAULT_TAG}")"
          echo "Publishing as: ${alias_tags}"
          echo "alias_tags=${alias_tags}" >> "${GITHUB_OUTPUT}"

      - name: Apply the tags
        if: github.ref_name == 'main' || github.ref_name == 'restart/fedora-bootc'
        env:
          ALIAS_TAGS: ${{ steps.tags.outputs.alias_tags }}
        run: just tag-images "${IMAGE_NAME}" "${DEFAULT_TAG}" "${ALIAS_TAGS}"

      - name: Sign in to GitHub's container registry
        if: github.ref_name == 'main' || github.ref_name == 'restart/fedora-bootc'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.ref_name == 'main' || github.ref_name == 'restart/fedora-bootc'
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile \
              "${IMAGE_NAME}:${tag}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done
          digest="$(< /tmp/digestfile)"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Install cosign
        if: github.ref_name == 'main' || github.ref_name == 'restart/fedora-bootc'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      # Signing is what lets a machine prove an update really came from us and
      # was not swapped out on the way. The private key is a repository secret
      # called SIGNING_SECRET; the matching public half is cosign.pub in this
      # repository, and it is the same pair the Bazzite line uses.
      - name: Sign the published image
        if: github.ref_name == 'main' || github.ref_name == 'restart/fedora-bootc'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: What was published
        if: github.ref_name == 'main' || github.ref_name == 'restart/fedora-bootc'
        run: |
          echo "### ${IMAGE_NAME}" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Published to \`${IMAGE_REGISTRY}/${IMAGE_NAME}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "To put it on a machine already running AquariusOS:" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          echo "sudo bootc switch ${IMAGE_REGISTRY}/${IMAGE_NAME}:latest" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"

  # ============================================================================
  # The Aquarius Shell's own checks
  # ============================================================================
  # The shell lives in its own repository (github.com/stoneharborent/aquarius-shell)
  # and the image bakes in one exact commit of it, named in aquarius-os.env.
  #
  # That repository has a test suite, and it is worth running HERE rather than
  # only there, for one reason: it is this repository that decides which commit
  # of the shell ships. Bumping AQUARIUS_SHELL_REF to something broken should
  # fail the AquariusOS build, not surprise somebody at the login screen.
  #
  # What the shell's own script can check without a Linux desktop: that every
  # QML file's brackets balance, that no compositor-specific import has crept in
  # (the standardised-protocols law, enforced instead of trusted), that no
  # component contains a raw colour, that the two themes declare the same set of
  # colour roles, that nothing points at a path on somebody's laptop, and — the
  # only part that RUNS code — about seventy assertions about the search
  # palette's fuzzy matcher and calculator.
  #
  # What it cannot check is whether the QML is CORRECT. That needs qmllint with
  # the matching Quickshell installed, and the matching Quickshell is the one
  # compiled inside the image above — it does not exist as a package anywhere.
  # Running qmllint against Fedora's 0.2.1 package would report every use of
  # Quickshell.Networking and Quickshell.Bluetooth as an unknown module and fail
  # for the wrong reason. So this job is honest about its size: it is the cheap
  # gate. The real one is the bench.
  #
  # It runs in parallel with the image build and does not block it — a shell
  # whose structure is wrong should be visible immediately, but the image build
  # is thirty minutes and there is no sense in queueing behind a shell script.
  shell_tests:
    name: The Aquarius Shell's own checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Work out which commit of the shell this image ships
        id: pin
        run: |
          set -euo pipefail
          REPO="$(grep -E '^AQUARIUS_SHELL_REPO=' aquarius-os.env | cut -d'"' -f2)"
          REF="$(grep -E '^AQUARIUS_SHELL_REF=' aquarius-os.env | cut -d'"' -f2)"
          if [ -z "${REPO}" ] || [ -z "${REF}" ]; then
            echo "::error::aquarius-os.env does not name the shell repository and commit."
            exit 1
          fi
          echo "repo=${REPO}" >> "${GITHUB_OUTPUT}"
          echo "ref=${REF}" >> "${GITHUB_OUTPUT}"
          echo "shell: ${REPO} @ ${REF}"

      # ⚠️ This can legitimately fail to find anything, and that is not an error.
      #
      # A GitHub Actions run can read THIS repository and no other. If
      # aquarius-shell is private, this job cannot fetch it — and neither can
      # the image build, which is why the image ships without the shell and says
      # so on screen. Both halves have to behave the same way, so this reports a
      # warning and stops rather than failing the run for something nobody can
      # fix from inside this repository.
      #
      # The fix is one click: make github.com/stoneharborent/aquarius-shell
      # public. Then this job runs the shell's real tests on every push, and the
      # image bakes the shell in, with no file here changing.
      - name: Fetch the shell at that exact commit
        id: fetch
        run: |
          set -uo pipefail
          export GIT_TERMINAL_PROMPT=0
          if ! git clone "${{ steps.pin.outputs.repo }}" aquarius-shell 2>&1; then
            echo "::warning::Could not read ${{ steps.pin.outputs.repo }} — it is private, so this job and the image build both go without the shell. Make it public to turn this on."
            echo "available=no" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          cd aquarius-shell
          git checkout --detach "${{ steps.pin.outputs.ref }}"
          GOT="$(git rev-parse HEAD)"
          if [ "${GOT}" != "${{ steps.pin.outputs.ref }}" ]; then
            echo "::error::asked for ${{ steps.pin.outputs.ref }} and got ${GOT}"
            exit 1
          fi
          git log -1 --format='%h %ad %s' --date=short
          echo "available=yes" >> "${GITHUB_OUTPUT}"

      - name: Install what the checks need
        if: steps.fetch.outputs.available == 'yes'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python3 -m pip install --user pyyaml

      - name: Run the shell's own checks
        if: steps.fetch.outputs.available == 'yes'
        working-directory: aquarius-shell
        run: ./tests/test-shell.sh

      # The two things this repository needs to be true about the shell, which
      # the shell's own tests have no reason to check because they are about how
      # the OPERATING SYSTEM installs it.
      - name: Check the shell still looks the way the image expects
        if: steps.fetch.outputs.available == 'yes'
        working-directory: aquarius-shell
        run: |
          set -euo pipefail
          fails=0

          echo "== the folders build_files/stage-aquarius-shell.sh copies =="
          for part in shell.qml components services theme assets; do
            if [ -e "${part}" ]; then
              echo "  OK   ${part}"
            else
              echo "  FAIL ${part} is gone — the image build copies it by name and would ship a broken shell"
              fails=1
            fi
          done

          echo "== the summon command the labwc key binding sends =="
          # Both repositories have to agree on this exact string. They were out
          # of step once already: the OS-side binding passed a configuration name
          # that qs reads as an IPC target, and Super+Space would have silently
          # done nothing. If the shell ever renames the target or the function,
          # this fails here rather than on somebody's desk.
          if grep -rq 'search' --include='*.qml' components/search/FlowSearch.qml \
             && grep -q 'IpcHandler' components/search/FlowSearch.qml; then
            echo "  OK   the search palette still declares an IPC handler"
          else
            echo "  FAIL components/search/FlowSearch.qml no longer declares an IpcHandler — Super+Space would do nothing"
            fails=1
          fi

          echo "== the size knob the session sets =="
          # /usr/bin/aquarius-session exports AQ_UI_SCALE from the person's
          # display.conf, and the shell is the only thing that reads it. If the
          # shell ever stops reading it, the OS would keep exporting a variable
          # into a void and `aq display ui` would silently do nothing.
          if grep -q 'AQ_UI_SCALE' theme/Theme.qml; then
            echo "  OK   theme/Theme.qml still reads AQ_UI_SCALE"
          else
            echo "  FAIL theme/Theme.qml no longer reads AQ_UI_SCALE — 'aq display ui' would do nothing at all"
            fails=1
          fi

          if [ "${fails}" -ne 0 ]; then
            echo "::error::The shell no longer matches what the AquariusOS image build expects of it."
            exit 1
          fi
          echo "The shell matches what the image build expects."

  # ============================================================================
  # The names have not slipped back
  # ============================================================================
  # From 2 to 4 September 2026 these images were published under temporary names
  # — `aquarius-os-next` and `aquarius-os-next-nvidia` — so that the restart
  # could be built and installed without overwriting the older Bazzite images
  # people were still running. Those names are finished.
  #
  # The danger is not that somebody types the old name on purpose. It is that an
  # old branch gets merged, or a paragraph gets copied from an old document, and
  # the word comes back into a place that MATTERS — the build settings, the
  # recipe, the installer's kickstart — where it would publish or install the
  # wrong thing, and nothing else in CI would notice, because building an image
  # under a wrong name works perfectly.
  #
  # So this job reads the whole repository and fails if the old name appears
  # anywhere except the handful of files that are ALLOWED to say it, because
  # their job is to record that it happened.
  #
  # It takes about five seconds and runs beside the thirty-minute image build,
  # so a name mistake is visible almost immediately.
  names:
    name: The old image names have not come back
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Look for the retired names
        run: |
          set -uo pipefail

          # The files whose whole purpose is to explain the old names. A match
          # in one of these is correct and expected.
          allowed=(
            "aquarius-os.env"                 # the history note beside the names
            "docs/restart/final-names.md"     # the step-by-step for the rename
            "docs/restart/history.md"         # the record of what was archived
            "docs/restart/bench-rebase.md"    # names the image the bench came FROM
            ".github/workflows/build.yml"     # this comment, and this job
          )

          echo "== searching every tracked file for 'aquarius-os-next' =="
          hits="$(git grep -n --fixed-strings 'aquarius-os-next' -- . || true)"

          if [ -z "${hits}" ]; then
            echo "  OK   the retired names appear nowhere at all"
            exit 0
          fi

          fails=0
          while IFS= read -r line; do
            file="${line%%:*}"
            ok=0
            for a in "${allowed[@]}"; do
              [ "${file}" = "${a}" ] && ok=1 && break
            done
            if [ "${ok}" -eq 1 ]; then
              echo "  ok   ${line}"
            else
              echo "  FAIL ${line}"
              fails=1
            fi
          done <<< "${hits}"

          if [ "${fails}" -ne 0 ]; then
            echo "::error::The retired image name 'aquarius-os-next' is back in a file that is not a history note. The images are called aquarius-os and aquarius-os-nvidia. See docs/restart/final-names.md."
            exit 1
          fi
          echo "  OK   every mention is in a file that exists to record the history"

      - name: The names the build will actually publish
        run: |
          set -euo pipefail
          # Read them back out of the one file that defines them, rather than
          # trusting that the line above says what we think it says.
          # shellcheck disable=SC1091
          . ./aquarius-os.env
          echo "IMAGE_NAME        = ${IMAGE_NAME}"
          echo "NVIDIA_IMAGE_NAME = ${NVIDIA_IMAGE_NAME}"
          fails=0
          [ "${IMAGE_NAME}" = "aquarius-os" ] || { echo "  FAIL IMAGE_NAME should be aquarius-os"; fails=1; }
          [ "${NVIDIA_IMAGE_NAME}" = "aquarius-os-nvidia" ] || { echo "  FAIL NVIDIA_IMAGE_NAME should be aquarius-os-nvidia"; fails=1; }
          # And the installer must point new machines at the same place.
          grep -q 'ghcr.io/stoneharborent/aquarius-os:latest' disk_config/iso.toml \
            || { echo "  FAIL disk_config/iso.toml does not point installed machines at ghcr.io/stoneharborent/aquarius-os:latest"; fails=1; }
          if [ "${fails}" -ne 0 ]; then
            echo "::error::The published names are not the final ones."
            exit 1
          fi
          echo "  OK   both names and the installer's update target are the final ones"
