---
# ==============================================================================
# Build AquariusOS (the Fedora bootc line)
# ==============================================================================
# This is what turns the recipe into an operating system. It runs on GitHub's
# computers, so nobody needs a Linux machine to build AquariusOS.
#
# For each of the two images it:
#   1. builds it from the Containerfile
#   2. INSPECTS THE FINISHED IMAGE and refuses to publish it if it is wrong
#   3. pushes it to GitHub's container registry
#   4. signs it, so a machine can prove an update really came from us
#
# ⚠️ WHICH BRANCHES THIS PUBLISHES FROM, AND WHY THERE ARE TWO.
#
# This is the AquariusOS build. It publishes from `main` — the ordinary,
# permanent home for it.
#
# It ALSO still publishes from `restart/fedora-bootc`, because until 4 September
# 2026 that WAS the branch this line lived on, and `main` was the older,
# Bazzite-based operating system. On that date Royce renamed the branches: the
# old `main` became `bazzite-archive` and this branch became `main`. Naming both
# here means the same file is correct before the rename and after it, so nothing
# has to be edited in the ten minutes between the two clicks. See
# docs/restart/final-names.md.
#
# The Bazzite line's own workflow stays behind on `bazzite-archive` and is never
# merged with this one.
#
# ⚠️ STEP 2 IS THE POINT. It would be easy to build an image, see no red text,
# and publish something that boots to a black screen. Every check in the verify
# job reads the ACTUAL CONTENTS of the finished image — the text in
# /etc/os-release, the value gsettings reports, the answer rpm gives, the
# checksum of a picture. Never a file's timestamp: the tooling that packages a
# bootable image flattens every clock, so a timestamp check passes forever,
# including when the step it was checking did nothing. We learned that on
# 2026-08-31 and it is now a rule.
#
# ⚠️ THIS WORKFLOW NEEDS THE OTHER ONE TO HAVE RUN AT LEAST ONCE (2026-09-16).
# Since the NVIDIA image carries the environment DaVinci Resolve runs in, this
# build fetches `ghcr.io/stoneharborent/aquarius-resolve-runtime:9` while it
# runs. So on a repository where "Build the Resolve runtime" has NEVER
# published anything, the NVIDIA build fails at step 63 with "manifest
# unknown", and the fix is to run that workflow once from the Actions tab.
#
# The two are not chained on purpose, and it is worth saying why rather than
# leaving it looking like an oversight. The runtime changes a few times a year;
# the operating system changes several times a week. Making every OS build wait
# for a runtime build would add ten minutes to every single push to buy a
# guarantee that matters exactly once in a repository's life. And a real
# dependency between them would mean a broken runtime build stopping OS builds,
# which is the tail wagging the dog.
#
# ⚠️ AND IT NEEDS NO CREDENTIALS. That package is PUBLIC, so this build reads it
# anonymously and a fork can build the image without being given any secrets.
# If somebody ever makes it private, step 63 stops with a message that says
# exactly that — see build_files/63-resolve-runtime-bake.sh.
# ==============================================================================

name: Build AquariusOS

on:
  push:
    branches:
      # The real line, after the 4 September 2026 branch rename. Pushes here
      # build, check, publish and sign.
      - main
      # Installer window repair: build and check only; never publish.
      - fix/installer-window-startup
      - fix/next-version-desktop
      # The real line, before that rename. Same treatment, for exactly as long
      # as this branch name still exists.
      - restart/fedora-bootc
      # A side branch, so that work in progress gets the same build and the
      # same checks before it is merged. It BUILDS AND CHECKS ONLY — every
      # publishing step below carries an `if:` that limits it to the branch
      # above, so a side branch cannot overwrite the images real machines
      # update from. See the PUBLISHING heading in the job.
      - restart/aquarius-keys
      # Phase R3a — DaVinci Resolve in a Rocky Linux container. Same rule:
      # builds and checks, never publishes.
      - restart/r3-resolve
      # Phase R3b — the creator apps layer and the ingest helper. Same
      # arrangement: builds and checks, never publishes.
      - restart/r3-apps
      # Carrying the first-login creator-apps hook back into the aquarius-shell
      # repository's own session files, and taking the shell commit that has it.
      # Same arrangement again: builds and checks, never publishes.
      - restart/shell-autostart
      # Phase R3 polish — everything Royce asked for after the 2026-09-04 bench
      # test: a password prompt in the Aquarius Session, the Resolve installer's
      # wording, a "Remove DaVinci Resolve" window, Resolve at the right size
      # with the right mouse pointer, and langpacks-en baked in. Same
      # arrangement: builds and checks, never publishes.
      - restart/r3-polish
      # The logout clean-up — the 2026-09-04 bench bug where logging out of the
      # Aquarius Desktop to go to GNOME bounced off the login screen two or
      # three times. Same arrangement again: builds and checks, never publishes.
      - restart/session-teardown
      # Phase R4 — the desktop gaming layer: Steam, Proton's supporting cast,
      # the controller drivers, and the Gaming shelf in the app chooser. Same
      # arrangement: builds and checks, never publishes.
      - restart/r4-gaming
      # The kernel pin — making BOTH images ship the kernel Universal Blue's
      # ready-made modules were built for, so the AMD/Intel image can never
      # again publish without the virtual camera and the Xbox drivers. Same
      # arrangement again: builds and checks, never publishes.
      - restart/kernel-pin
      # The login screen — the 2026-09-04 photo, where the screen Royce logs in
      # at was stock Fedora GDM at 100% on a 4K monitor. Part A fixes GDM's
      # size and colours; Part B adds our own greeter (greetd + the Aquarius
      # Shell), shipped switched OFF. Same arrangement: builds and checks,
      # never publishes.
      - restart/login
      # The "All set." page — the 2026-09-04 bench test again: the last page of
      # the creator-apps window was blank at the top (no Aquarius mark) and its
      # main button offered to open one app instead of showing them all. Same
      # arrangement: builds and checks, never publishes.
      - restart/chooser-done
      # The two DaVinci Resolve windows' last pages — the same 2026-09-04 fault
      # as the chooser's "All set." page, in the two windows nobody looked at
      # yet: both finished on a widget that cannot show the Aquarius mark, so
      # both were blank at the top. Same arrangement: builds and checks, never
      # publishes.
      - restart/resolve-done
      # The missing right-click menu — the 2026-09-04 bench test again:
      # right-clicking a video in Files offered no "Make Editor-Ready", because
      # the extension asked for an extension interface version that Fedora 44's
      # Files had already loaded a newer one of, and stopped dead. Same
      # arrangement: builds and checks, never publishes.
      - restart/nautilus-fix
      # Aquarius Editor stops being baked into the image and becomes a download
      # offered by the chooser (ticked by default), installed into each
      # person's own home folder. Roughly four gigabytes off every image. Same
      # arrangement: builds and checks, never publishes.
      - restart/editor-optional
      # The progress bar — the 2026-09-04 bench request: "Make Editor-Ready"
      # said it had started and then went quiet for the several minutes a real
      # camera clip takes. It now shows a filling bar, a percentage and a plain
      # time left, in one notification redrawn in place. Same arrangement:
      # builds and checks, never publishes.
      - restart/ingest-progress
      # Phase R5 — one first-boot welcome flow: how the keyboard should work,
      # then the creator apps, then a page of tips. Replaces the creator-apps
      # window as the thing that opens at a first login. Same arrangement:
      # builds and checks, never publishes.
      - restart/welcome
      # Carrying the welcome back into the aquarius-shell repository's own
      # session files, so a session started from a clone of the shell opens
      # the welcome at first login rather than the creator-apps window, and
      # taking the shell commit that has it. Same arrangement: builds and
      # checks, never publishes.
      - restart/shell-welcome
      # The rename to the final image names, and getting every workflow ready
      # for the branch rename. Same arrangement: builds and checks, never
      # publishes — deliberately, because this is the branch that decides what
      # `aquarius-os:latest` means and it must be proven green first.
      - restart/flip
      # The missing firmware — the 2026-09-05 bench bug, where GNOME said "No
      # Wi-Fi Adapter Found" on a board whose Wi-Fi is a MediaTek MT7925.
      # Fedora split `linux-firmware` into thirty per-vendor packages and this
      # image was only installing the leftovers. Ships every radio, every GPU
      # vendor's firmware and both CPU microcodes. Same arrangement: builds and
      # checks, never publishes.
      - restart/firmware
      # The "Failed Units: 1 systemd-remount-fs.service" line printed on the
      # console at every boot — a service that cannot succeed on this kind of
      # machine and was never detecting a real fault. Same arrangement: builds
      # and checks, never publishes.
      - restart/remount-fs
      # The black login screen — the 2026-09-05 bench bug, where the machine
      # booted to a mouse pointer on an empty screen. The display arrangement
      # AquariusOS copies for the login screen is now made safe before it is
      # handed over (part sizes become whole ones), and a guard removes it and
      # restarts the login screen if none appears. Same arrangement as every
      # side branch: builds and checks, never publishes.
      - restart/gdm-scale-fix
      # The black login screen, take two. The bench black-screened AGAIN on the
      # image above, and the guard that was meant to rescue it did nothing —
      # it asked "is there a session?", and in a black-screen boot there is one.
      # So the login screen now gets NO copied display file at all by default,
      # old copies are removed at boot, and the guard's trigger is executed in
      # CI on both sides. Same arrangement as every side branch: builds and
      # checks, never publishes.
      - restart/gdm-copy-off
      # The black login screen, take three. The two images that black-screened
      # on their FIRST start after boot both carried a login-screen setting
      # called experimental-features, and the one image that did not carry it
      # came up fine. GNOME's own window manager printed "Unknown experimental
      # feature" about one of the two values we set. So the setting is removed,
      # and CI now refuses to build any image that sets a login-screen key
      # GNOME does not have. Same arrangement as every side branch: builds and
      # checks, never publishes.
      - restart/gdm-no-experimental
      # The faulty PAM module at every login — the 2026-09-05 bench journal,
      # where `login` wrote "PAM adding faulty module pam_fprintd.so" at every
      # single login. Fedora's stock authselect login rules name a fingerprint
      # step, and the bare base ships that rule but not the module it names. This
      # installs fprintd + fprintd-pam so the reference resolves and fingerprint
      # login works on laptops that have a reader, and adds a check that no
      # shipped /etc/pam.d file may ever again name a module that is not
      # installed. Same arrangement as every side branch: builds and checks,
      # never publishes.
      - restart/pam-fprintd
      # Phase R5 desktop identity — the cursor theme, the icon theme and the
      # system sounds, chosen from Fedora's own packaged themes (Adwaita and
      # freedesktop) rather than hand-drawn, set as defaults beside the fonts
      # and accent so they cannot drift, with a documented seam for real
      # Aquarius artwork later. Same arrangement as every side branch: builds
      # and checks, never publishes. See docs/restart/desktop-identity.md.
      - restart/desktop-identity
      # Phase R5 polish — the installer's branding. Makes the in-image Anaconda
      # artwork replacement actually land (Fedora 44 moved the sidebar logo into
      # per-product folders), and adds CI checks that the installer artwork is
      # ours. Note it does NOT itself build an ISO — ISOs come from
      # build-iso.yml, started by a tag. Same arrangement as every side branch:
      # builds and checks, never publishes.
      - restart/iso-branding
      # The greeter failsafe — the confirmed root cause of the multi-day
      # "black screen with a cursor" saga. `aq login use greetd` (the R5 greeter
      # test) had switched the machine to greetd, whose Quickshell greeter never
      # drew, and the marker persisted across every reboot. Two fixes: the switch
      # now warns and must be confirmed, and a watchdog switches the machine back
      # to GDM by itself after two failed greetd boots in a row. Same arrangement
      # as every side branch: builds and checks, never publishes.
      - restart/greeter-failsafe
      # The installer-ISO blocker — the 2026-09-06 failure (run 34012037986)
      # where every ISO build died in depsolve because the Terra repository the
      # gaming layer added carries a signed catalogue and a local-path GPG key
      # (osbuild/bootc-image-builder#1188). Terra is now removed from the image
      # after Steam and umu are installed, and a new check refuses any repository
      # that would break the ISO. Same arrangement as every side branch: builds
      # and checks, never publishes.
      - restart/iso-terra-fix
      # Phase R6 OS-side pieces that back the shell work: external drives that
      # mount automatically and passwordless when a user is logged in
      # (unmountable without a password too), and a small "Check for Update"
      # window the logo menu opens. Same arrangement as every side branch:
      # builds and checks, never publishes.
      - restart/r6-os
      # R6 shell completeness, pulled forward — bumping AQUARIUS_SHELL_REF to the
      # aquarius-shell commit that adds the Aquarius (logo) menu, the desktop
      # right-click menu, the Quick Settings detail arrows, the darker dock slab
      # and the dock's mounted-drives list. The point of building it here is the
      # shell_tests job below, which clones the shell at the new pin and runs its
      # structural checks. Same arrangement as every side branch: builds and
      # checks, never publishes.
      - restart/r6-shell-pin
      # The two faults from the 2026-09-06 bench test of the R6 shell: a
      # right-click on the desktop showed labwc's own built-in menu instead of
      # the Aquarius one (the OS ships its own copies of the labwc files and
      # nobody copied the shell's new menu.xml or its Root mousebind across),
      # and the dock's Settings icon did nothing (gnome-control-center exits
      # unless XDG_CURRENT_DESKTOP names GNOME, and ours says Aquarius:wlroots).
      # It now also carries the shell-side half of those fixes, as a bump of
      # AQUARIUS_SHELL_REF: one SettingsLauncher singleton that always launches
      # `env XDG_CURRENT_DESKTOP=GNOME gnome-control-center`, shared by the logo
      # menu, the Quick Settings chevrons, the dock's Settings entry and the
      # search palette; and a dock drives list rebuilt as a /run -> /run/media
      # -> /run/media/<user> chain with a read-back health check on the folder,
      # so it can never fall back to listing the home directory. The point of
      # building it here is the shell_tests job below, which clones the shell at
      # the new pin and runs its structural checks.
      # Same arrangement as every side branch: builds and checks, never
      # publishes.
      - restart/r6-bench-fixes
      # The second pass over the 2026-09-06 bench test. One real fault and one
      # piece of drift:
      #
      #   * The Bluetooth arrow in Quick Settings opens GNOME's Settings on its
      #     Bluetooth page, and that page said "No Bluetooth Found" while a
      #     Bluetooth mouse was in use. The page never asks Bluetooth anything —
      #     it reads a value published by /usr/libexec/gsd-rfkill, which GNOME's
      #     session starts and ours did not. This branch adds
      #     aquarius-rfkill.service, switched on for the Aquarius session only
      #     (GNOME runs its own copy, and two would fight over one bus name),
      #     plus build_files/78-rfkill.sh and the read-back below.
      #     (Both retired 2026-09-15 with the Aquarius Session.)
      #   * Super+Tab / Super+Shift+Tab were in the aquarius-shell repository's
      #     rc.xml and had never been copied into the image's own copy — the
      #     same drift that lost the right-click menu last pass.
      #
      # It then closes that second point properly rather than one binding at a
      # time. AQUARIUS_SHELL_REF moves to dd23a40, which brings the desktop menu
      # and title bars an Aquarius look (a new session/labwc/themerc-override),
      # a <theme> font block in rc.xml, "About This PC" opening the About page
      # directly, and a right-click menu on every app in the dock. The image
      # gains its own copy of themerc-override and its rc.xml is brought up to
      # the shell's content.
      #
      # AND THE REAL DELIVERABLE: build_files/check-labwc-drift.sh, run by the
      # shell_tests job below. It compares the two copies of all four shared
      # labwc files — rc.xml, menu.xml, themerc-override, autostart — and fails
      # the push when they differ in anything but their comments. Twice in one
      # day the shell changed one of those files and the image's copy was not
      # updated; naming each missing binding in a check does not generalise, and
      # this does.
      #
      # Same arrangement as every side branch: builds and checks, never
      # publishes.
      - restart/r6-bench-pass-2
      # The app icons — the nine AquariusOS icons from the 2026-09-06 design
      # session (the Editor, the Writer, Files, Settings, the Console, the app
      # chooser, the welcome window and the two DaVinci Resolve buttons), shipped
      # as two icon themes, Aquarius-Ice and Aquarius-Midnight, with Ice as the
      # default, both drawn in the shell's own palette.
      # Same arrangement as every side branch: builds and checks, never
      # publishes. See branding/icons/README.md.
      - restart/icon-grammar
      # The redrawn mark — the small hand-drawn loop at the top of the "A" is
      # gone (the A is now one clean point), and every place the old mark or the
      # old Starlight blue was still showing is moved onto the shell's palette:
      # the logo files, the About-page pictures, the boot splash, the wallpaper
      # and the terminal colour in os-release.
      # Same arrangement as every side branch: builds and checks, never
      # publishes.
      - restart/logo-recolour
      # The window frame — the 2026-09-06 design session's other half: the title
      # bar, the border, the round window buttons and the desktop menu, all now
      # GENERATED from the shell's Ice or Midnight palette instead of being
      # typed out by hand. It also moved the window buttons with `aq keys mac` /
      # `aq keys windows` — that half was undone on 2026-09-17, because apps
      # that draw their own title bar never followed it — and adds the
      # two-property dark-mode GTK colour.
      # Same arrangement as every side branch: builds and checks, never
      # publishes.
      - restart/window-frame
      # The integration branch: the 2026-09-06 design work merged together —
      # the redrawn logo, the generated window frame, and (as they land) the
      # lock screen and the app switcher — so CI can prove the combination
      # before any of it reaches main. Same arrangement as every side branch:
      # builds and checks, never publishes.
      - restart/integration
      # The lock screen. A new lock/ folder in the shell (Super+L, the Aquarius
      # menu's Lock Screen row, dim/lock/screen-off at 5/10/15 minutes), and
      # this image's half of it: /etc/pam.d/aquarius-lock, the service that
      # locks the screen before the machine sleeps, wlopm for turning the
      # monitor off, and build_files/57-lock-screen.sh (retired 2026-09-15), which reads every one of
      # those back. AQUARIUS_SHELL_REF moves to afd26b9.
      #
      # ⚠️ The check worth watching in this run is the one that proves the two
      # repositories agree on one word: the shell asks PAM for a configuration
      # called "aquarius-lock" and this image installs a file by that name. A
      # rename on either side alone means nobody can unlock the machine.
      #
      # Same arrangement as every side branch: builds and checks, never
      # publishes.
      - restart/lock-screen
      # The app switcher — hold Command and tap Tab and a panel of the
      # applications you have open appears in the middle of the screen, the
      # dock's slab lifted into the middle with one big icon per app. Let go of
      # Command and you are in the one you stopped on. Down opens that app's
      # windows; Command+` walks them with no panel; on the Windows keyboard
      # style Alt+Tab lists windows instead, one row each.
      #
      # This branch carries the OS half of it: the five keybinds in this image's
      # own copy of rc.xml (content-identical to the shell's, in one clearly
      # marked block), labwc's own switcher turned off, and a bump of
      # AQUARIUS_SHELL_REF to the shell commit that draws the panel. The point
      # of building it here is the shell_tests job below, which clones the shell
      # at the new pin, runs its structural checks, and compares the two copies
      # of every labwc file.
      # Same arrangement as every side branch: builds and checks, never
      # publishes.
      - restart/app-switcher
      # The boot animation — the 2026-09-06 design session's last piece. The
      # boot screen stops being a still logo with a row of dots under it: the
      # "A" is poured out of falling water on the way up (2.2 s, 66 frames) and
      # blown away by the wind on the way down (1.9 s, 57 frames), and the theme
      # moves from Plymouth's two-step plug-in to its script plug-in so that it
      # can play a sequence at all. Also carries the update screen and the
      # disk-password box, both of which the old plug-in drew for us and this
      # one does not.
      # Same arrangement as every side branch: builds and checks, never
      # publishes.
      - restart/boot-animation
      # The stock GNOME apps keep their stock icons (2026-09-17): the Files,
      # Settings and Console drawings stop being filed under GNOME's own names,
      # and step 5.6 and the icon test fail if any org.gnome.* icon comes back.
      # Same arrangement as every side branch: builds and checks, never
      # publishes.
      - claude/bold-rubin-hfjh8b
      # The four Return-to-Game-Mode bugs from the 2026-09-19 bench (the
      # "Switch to Desktop" hang, 1080p on a 4K screen, the password box, the
      # glyphs) and the boot-into-Game-Mode login found in GDM's source. Step
      # 71 reads every fix back out of the finished image. Same arrangement
      # as every side branch: builds and checks, never publishes.
      - claude/return-game-mode-bugs-tj19kv
      # The fourth Game Mode bench, 2026-09-20: "Switch to Desktop" put the
      # machine in a login loop — the login screen logged Royce in, GNOME said
      # "A graphical session is already running!", the session ended, and the
      # login screen logged him in again, forty-five times in ninety seconds.
      # Game Mode had left graphical-session.target standing in his account's
      # systemd manager; Terra's unit is written BindsTo=that target, which
      # points the other way, so nothing ever lowered it. Our switch now lowers
      # it and reads back that it went down, a drop-in makes Terra's unit do
      # the same however it ends, and a guard in the GDM logout hook stops any
      # login loop at three tries with a password box. Steps 50 and 71 read all
      # of it back out of the finished image. Same arrangement as every side
      # branch: builds and checks, never publishes.
      - fix/game-mode-bench-4
      # The password boxes that asked for nothing. GNOME Software's rpm-ostree
      # plug-in — a weak dependency nobody chose — was asking polkit to upgrade
      # an operating system that does not update that way, about once an hour,
      # ten times in five days on the bench. firewalld was separately running
      # Fedora's SERVER answers on a desktop, so merely READING the firewall
      # configuration wanted an administrator password. Steps 30, 40 and 90 read
      # all of it back out of the finished image, including a second look at the
      # very end in case a later step reinstalls the plug-in through another
      # recommendation. Same arrangement as every side branch: builds and
      # checks, never publishes.
      - fix/login-password-prompts
      # Phase G2: the third image, aquarius-os-handheld, for the one ROG Xbox
      # Ally X Royce owns. The matrix builds all three here, and the third
      # image's own checks run on all three — because half of what they prove is
      # that the two desktop images are UNCHANGED by the whole phase. Same
      # arrangement as every side branch: builds and checks, never publishes.
      - g2-handheld
      # The launcher is called plain "Game Mode" and wears Steam's icon with a
      # controller badge, put together during the build. Same arrangement as
      # every side branch: builds and checks, never publishes.
      - claude/nice-fermi-w6lk1k
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and publish (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            nvidia: 0
            handheld: 0
          - variant: nvidia
            nvidia: 1
            handheld: 0
          # The third image: phase G2. The SAME recipe as `base` — no NVIDIA
          # driver — plus the device layer for one handheld, the ROG Xbox Ally X
          # Royce owns, and a cold boot that goes straight into Game Mode.
          # Everything that makes it different is in build_files/78-handheld.sh,
          # which on the other two images installs nothing and instead proves
          # that none of it arrived.
          - variant: handheld
            nvidia: 0
            handheld: 1
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # GitHub's runners come with a lot of software we do not need, and the
      # image being built is several gigabytes. Without this the build runs out
      # of disk half way through, which produces a confusing error a long way
      # from the real cause.
      - name: Make room on the build machine
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check the Justfile is valid
        run: just check
      - name: Check the login screen is only given a size it can draw
        run: ./tests/test-gdm-scale-sanitize.sh

      # ------------------------------------------------------------------------
      # And the safety net underneath it actually fires
      # ------------------------------------------------------------------------
      # ⚠️ THIS TEST EXISTS BECAUSE THE SAFETY NET DID NOT WORK. On 2026-09-05
      # the bench black-screened a SECOND time, on the very image that had just
      # added the guard, and the guard did nothing. It was enabled. It ran. It
      # asked logind "is there a graphical session?" — and in a black-screen
      # boot the answer is yes, because the mouse pointer you are looking at is
      # drawn by the compositor.
      #
      # A trigger that has never been executed is a comment. This runs the guard
      # against fake system commands, on both sides: it must act when the login
      # screen is broken (four different shapes of broken) and stand aside when
      # it is not.
      - name: Check the login-screen guard actually fires
        run: ./tests/test-gdm-guard.sh
      - name: Check the login screen waits the right amount for the boot animation
        run: ./tests/test-boot-hold.sh
      # external drive, a Mac's internal disk with its five volumes, and a
      # FileVault drive. What it proves is the part a person cannot check by
      # reading: the exact apfs-fuse command line (read-only, this person's uid
      # and gid, and NOT allow_other), that a locked drive produces a
      # notification and not a silent nothing, and that unplugging really closes
      # the mount — because nothing else on the computer ever will.
      - name: Check a plugged-in drive really does get mounted
        run: |
          set -uo pipefail
          if ! python3 -c 'import gi' 2> /dev/null; then
            sudo apt-get install -y python3-gi > /dev/null 2>&1 || true
          fi
          if ! python3 -c 'import gi' 2> /dev/null; then
            echo "NOTE  PyGObject is not available on this runner, so the fast"
            echo "      warning could not run. The same test runs inside the"
            echo "      finished image, and that run can fail the build."
            exit 0
          fi
          ./tests/test-automount-mount.py

      # ------------------------------------------------------------------------
      # An INSIDE drive asks once — and never the wrong drive
      # ------------------------------------------------------------------------
      # Since 2026-09-14 a drive that lives inside the computer is offered once
      # ("Mount Footage every login?") instead of asking for a password at every
      # login. The dangerous half of that is the drives it must NEVER offer: the
      # disk AquariusOS is on, the EFI partition, swap, Windows' own volume.
      # No amount of reading proves a refusal, so the real decision code is run
      # against fake drives here, before the image is even built.
      - name: Check the right inside drives are offered, and the wrong ones refused
        run: |
          set -uo pipefail
          if ! python3 -c 'import gi' 2> /dev/null; then
            sudo apt-get install -y python3-gi > /dev/null 2>&1 || true
          fi
          if ! python3 -c 'import gi' 2> /dev/null; then
            echo "NOTE  PyGObject is not available on this runner, so the fast"
            echo "      warning could not run. The same test runs inside the"
            echo "      finished image, and that run can fail the build."
            exit 0
          fi
          ./tests/test-remember-drive.py

      # ------------------------------------------------------------------------
      # The folder every drive appears in is made at login — and can never stop
      # a login
      # ------------------------------------------------------------------------
      # /usr/libexec/aquarius-media-dir creates /run/media/<you> when somebody
      # logs in, and makes it theirs. Two things depend on it, and both fail
      # invisibly: the dock lists drives by WATCHING that folder (and Qt's
      # watcher silently lists the home directory when the folder is missing —
      # the 2026-09-06 "thirty random folders in the dock" bug), and a Mac drive
      # is mounted by the PERSON, so the person has to be able to create a
      # folder in there.
      #
      # ⚠️ AND IT RUNS ON THE LOGIN PATH. systemd runs it before the session
      # starts, so a failure there is an account that cannot log in. "It always
      # exits 0" is therefore the most important thing this test checks, and it
      # is checked against every way it can go wrong: no such account, no
      # argument, a name with a slash in it, and a folder it is not allowed to
      # create. Seconds, before the build; it runs again inside the image.
      - name: Check the drives folder is made at login, and never stops one
        run: ./tests/test-media-dir.sh

      # ------------------------------------------------------------------------
      # The two Mac-or-Windows switches, before anything is built
      # ------------------------------------------------------------------------
      # AquariusOS has one Mac-or-Windows choice and, since 2026-09-16, a switch
      # for it on each desktop: our own add-on in GNOME's quick settings menu,
      # and a page in KDE's System Settings. Seconds, and it catches the two
      # mistakes that are completely silent — a GNOME add-on whose id does not
      # match its folder (loaded, then refused, with nothing said) and a syntax
      # error in its code (simply absent). The build checks more, inside the
      # finished image; "it appears and it flips the setting" is a bench test.
      - name: Check the Mac-or-Windows switches
        run: ./tests/test-keys-toggle.sh

      # ------------------------------------------------------------------------
      # `aq decky` tells the truth before it changes anything
      # ------------------------------------------------------------------------
      # Decky Loader is OFFERED, never baked (standing decision 4), so the real
      # install cannot be rehearsed here: it downloads 26 MB from GitHub and
      # switches on a service that runs as the administrator. Every DECISION it
      # makes before touching anything can be, and those are where the damage
      # would be — "already installed", "half installed", the version it claims,
      # and the refusal to run under sudo (which would install Decky into the
      # administrator's home folder, where nobody would find it).
      #
      # It points HOME at a throwaway folder and builds each situation out of
      # empty files. Nothing downloads, nothing asks for a password. The real
      # install is a bench job — the list is at the bottom of
      # docs/restart/decky.md.
      - name: Check the aq decky command
        run: ./tests/test-decky.sh

      # ------------------------------------------------------------------------
      # The app icons are all present, and are the sizes they claim
      # ------------------------------------------------------------------------
      # Before the build, because it takes a second and reads the same files the
      # build will copy. The same test runs again INSIDE the finished image
      # further down, which is the check that actually counts; this one is the
      # fast warning.
      #
      # ⚠️ WHY IT IS CHECKED AT ALL. A missing icon is not an error anywhere.
      # Both Aquarius themes say Inherits=Adwaita,hicolor, so anything we fail to
      # ship falls silently through to GNOME's own artwork: the machine looks
      # completely normal, it is just not AquariusOS, and no log anywhere says
      # so. See branding/icons/README.md.
      - name: Check the Aquarius app icons
        run: ./tests/test-aquarius-icons.sh

      # ------------------------------------------------------------------------
      # Resolve's entry in your apps is a real one
      # ------------------------------------------------------------------------
      # ⚠️ THE BENCH FINDING OF 8 SEPTEMBER 2026. "No Resolve icon appeared
      # after install. After quitting, Resolve cannot be reopened and is not in
      # the app search." distrobox's exported entry called itself "DaVinci
      # Resolve (on aquarius-resolve)" and gave a FILE PATH as its
      # StartupWMClass — the key the dock uses to work out which app a window
      # belongs to. A path can never match a window, so the dock had a running
      # Resolve it could not join to anything.
      #
      # The installer repaired Exec and MimeType and nothing ever read the
      # finished entry back. This writes that exact file into a temporary folder,
      # repairs it, and checks every key. Before the build, because it takes a
      # second; the same test runs again inside the finished image.
      - name: Check Resolve's app-menu entry is repaired, key by key
        run: ./tests/test-resolve-entry.sh

      # ------------------------------------------------------------------------
      # Aquarius Installer sorts a download correctly, and refuses what it must
      # ------------------------------------------------------------------------
      # ⚠️ EVERY FAILURE MODE OF A SORTER IS SILENT. A package that should have
      # been refused installs into a home folder and leaves a dead icon. A menu
      # entry with the wrong window class puts a second, nameless icon in the
      # dock. A menu entry with a `Path=` naming a folder this computer does not
      # have makes the desktop refuse to start the app AT ALL, with nothing in
      # any log a person would read — the fault that cost a week on the bench in
      # September 2026.
      #
      # So this builds real files (a real .deb with a maintainer script in it, a
      # real archive, a payload carrying system services and kernel bits, an
      # app needing a library this computer does not have), really installs them
      # into a throwaway home folder, and really reads back what happened. The
      # .deb's script would leave a file behind if it were ever run, which is
      # the only way to PROVE "no scripts, ever" rather than assert it.
      #
      # Before the build, because it takes two seconds. The same test runs again
      # INSIDE the finished image, against the copy that will actually run on
      # Royce's machine, and that run is the one that counts.
      - name: Check Aquarius Installer sorts, installs and removes correctly
        run: |
          ./tests/test-installer-sorter.py
          python3 tests/test-installer-windows.py

      # ------------------------------------------------------------------------
      # The file types Aquarius Installer adds are well formed
      # ------------------------------------------------------------------------
      # Same reason, and the same danger, as the Resolve project type below:
      # a malformed file here would not merely fail to add our types, it would
      # stop the WHOLE shared file-type list from rebuilding and take every
      # other file type on the machine with it.
      - name: Check the installer's file types are well formed
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libxml2-utils shared-mime-info
          SRC=system_files/usr/share/mime/packages/aquarius-installer.xml
          echo "== is it XML at all? =="
          xmllint --noout "${SRC}"
          echo "  OK   ${SRC} is well-formed XML"
          echo "== does the freedesktop tool accept it? =="
          TMP="$(mktemp -d)"
          mkdir -p "${TMP}/packages"
          cp /usr/share/mime/packages/freedesktop.org.xml "${TMP}/packages/"
          cp "${SRC}" "${TMP}/packages/"
          update-mime-database "${TMP}"
          echo "  OK   the shared file-type list rebuilds with it in"
          # What the rebuilt list actually says about our endings, printed
          # every time, because a FAIL below is unreadable without it (this
          # step passed on a developer's Ubuntu and failed on the runner on
          # 2026-09-10 with no way to tell why).
          echo "== the rebuilt list, for the endings we care about =="
          echo "  update-mime-database: $(dpkg-query -W -f='${Version}' shared-mime-info 2>/dev/null || echo unknown)"
          grep -n '\.run$\|\.snap$\|\.pkg$\|\.rpm$' "${TMP}/globs2" | sed 's/^/  globs2 /' || echo "  globs2 has none of them"
          ls -la "${TMP}" | sed 's/^/  /'
          echo "== and the endings really resolve to our names =="
          fails=0
          for pair in \
            "application/x-aquarius-run-installer:*.run" \
            "application/vnd.snap:*.snap" \
            "application/x-apple-installer-package:*.pkg"; do
            # -F: the pair is a literal line, not a pattern. Read as a pattern,
            # the "*" in "*.run" never matches, and this step failed on a
            # correct list twice on 2026-09-10 before anybody noticed why.
            if grep -qxF "60:${pair}" "${TMP}/globs2"; then
              echo "  OK   ${pair}"
            else
              echo "  FAIL ${pair} did not come out of the shared list at weight 60"
              fails=1
            fi
          done
          if [ "${fails}" -ne 0 ]; then
            echo "::error::${SRC} did not teach the shared list the endings it is for."
            exit 1
          fi
          rm -rf "${TMP}"

      # ------------------------------------------------------------------------
      # ...and the installer really is what opens them
      # ------------------------------------------------------------------------
      # ⚠️ THE CHECK THE WHOLE FEATURE RESTS ON, AND THE ONE THAT LOOKS LIKE
      # PAPERWORK. "Which app opens this type" is answered from a CHAIN of files
      # read in a fixed order, so a right answer written into the wrong file in
      # that chain is worth exactly nothing — and the symptom is that
      # double-clicking a download does nothing at all, which is the Linux
      # experience this feature exists to end. This asks the desktop's own tool,
      # in a temporary root with the same folders a real session has.
      - name: Check ZIP extraction feedback and notification actions
        run: |
          sudo apt-get install -y python3-gi libnotify-bin dbus-x11
          /usr/bin/python3 tests/test-extract-zip.py
          /usr/bin/python3 tests/test-extract-zip-notification.py

      - name: Check double-clicking a download opens Aquarius Installer
        run: |
          set -uo pipefail
          sudo apt-get install -y shared-mime-info desktop-file-utils
          fails=0
          ENTRY=system_files/usr/share/applications/aquarius-installer.desktop
          LIST=system_files/etc/xdg/mimeapps.list

          echo "== ask the desktop's own tool, in a temporary root =="
          # The real question, asked the real way: build a small XDG root out of
          # our desktop entries and defaults plus the system's own file-type list, and ask `gio`
          # which app opens each type. This is the only check that covers the
          # whole chain at once — the type exists, the entry declares it, the
          # defaults file is in a folder that is actually read, and the answer
          # that comes back is us.
          #
          # ⚠️ THE Exec/TryExec ARE REWRITTEN IN THE COPY, and that is not a
          # fudge. GIO refuses a menu entry whose TryExec names a program it
          # cannot find, silently — and /usr/libexec/aquarius-installer does not
          # exist on a build runner, only inside the image. Without this the
          # answer to every question below would be "nothing" on a perfectly
          # correct set of files. Everything else about the entry is untouched.
          T="$(mktemp -d)"
          mkdir -p "${T}/share/applications" "${T}/share/mime/packages" \
                   "${T}/config" "${T}/home-config" "${T}/home-data"
          cp /usr/share/mime/packages/freedesktop.org.xml "${T}/share/mime/packages/"
          cp system_files/usr/share/mime/packages/aquarius-installer.xml "${T}/share/mime/packages/"
          update-mime-database "${T}/share/mime"
          cp "${ENTRY}" "${T}/share/applications/"
          cp system_files/usr/share/applications/aquarius-extract-zip.desktop "${T}/share/applications/"
          cp "${LIST}" "${T}/config/"
          sed -i 's|^Exec=.*|Exec=/bin/true %F|; s|^TryExec=.*|TryExec=/bin/true|' \
              "${T}/share/applications/aquarius-installer.desktop" \
              "${T}/share/applications/aquarius-extract-zip.desktop"
          update-desktop-database "${T}/share/applications" 2> /dev/null || true

          default_app() {
            XDG_CURRENT_DESKTOP=GNOME \
              XDG_CONFIG_HOME="${T}/home-config" \
              XDG_DATA_HOME="${T}/home-data" \
              XDG_CONFIG_DIRS="${T}/config" \
              XDG_DATA_DIRS="${T}/share" \
              gio mime "$1" 2> /dev/null \
              | sed -n 's/^Default application for.*: //p' | head -1
          }
          for type in application/x-rpm \
            application/vnd.debian.binary-package \
            application/vnd.appimage \
            application/vnd.flatpak.ref \
            application/vnd.flatpak \
            application/x-aquarius-run-installer \
            application/vnd.snap \
            application/x-apple-diskimage \
            application/x-apple-installer-package \
            application/x-msi \
            application/x-msdownload \
            application/vnd.microsoft.portable-executable; do
            answer="$(default_app "${type}")"
            if [ "${answer}" = "aquarius-installer.desktop" ]; then
              echo "  OK   ${type} opens with Aquarius Installer"
            else
              echo "  FAIL ${type} opens with '${answer:-nothing}'"
              fails=1
            fi
          done
          for type in application/zip application/x-zip application/x-zip-compressed; do
            answer="$(default_app "${type}")"
            if [ "${answer}" = "aquarius-extract-zip.desktop" ]; then
              echo "  OK   ${type} opens with background ZIP extraction"
            else
              echo "  FAIL ${type} opens with '${answer:-nothing}' instead of ZIP extraction"
              fails=1
            fi
          done
          for type in application/zip application/x-shellscript; do
            answer="$(default_app "${type}")"
            if [ "${answer}" = "aquarius-installer.desktop" ]; then
              echo "  FAIL ${type} was taken over — that was a deliberate no"
              fails=1
            else
              echo "  OK   ${type} is not claimed by the Installer"
            fi
          done
          rm -rf "${T}"
          for f in "${ENTRY}" "${LIST}"; do
            if [ -r "${f}" ]; then echo "  OK   ${f} is here"
            else echo "  FAIL ${f} is missing"; fails=1; fi
          done
          echo "== every type the list claims is a type the entry declares =="
          # If mimeapps.list makes us the default for something the entry never
          # says it can open, some desktops quietly ignore the line — which is a
          # double-click that does nothing, again.
          while IFS='=' read -r type app; do
            case "${type}" in ''|'['*|'#'*) continue ;; esac
            [ "${app}" = "aquarius-installer.desktop" ] || continue
            if grep -q "MimeType=.*${type};" "${ENTRY}"; then
              echo "  OK   ${type} is declared by the entry as well"
            else
              echo "  FAIL ${type} is claimed as a default but the entry does not declare it"
              fails=1
            fi
          done < "${LIST}"
          echo "== the Installer must not claim ZIPs or shell scripts =="
          for type in application/zip application/x-shellscript; do
            if grep -q "^${type}=aquarius-installer.desktop" "${LIST}"; then
              echo "  FAIL ${type} is claimed as a default — that was a deliberate no"
              fails=1
            else
              echo "  OK   ${type} is not claimed by the Installer"
            fi
          done
          if [ "${fails}" -ne 0 ]; then
            echo "::error::Aquarius Installer would not open the files it is meant to."
            exit 1
          fi

      # ------------------------------------------------------------------------
      # The Resolve install record can be sourced without running anything
      # ------------------------------------------------------------------------
      # ⚠️ THE BENCH FINDING OF 9 SEPTEMBER 2026. `aq resolve status` printed
      # "installed.env: line 10: name: command not found". The installer had
      # written a note to itself — `AQ_RESOLVE_VERSION_FROM=the name of the
      # file downloaded from Blackmagic` — with no quotes, and `aq` reads that
      # file by sourcing it, so the shell set the variable to "the" and then
      # tried to run a command called "name". A file name with a space would
      # have done the same. Every value is now written in single quotes; this
      # writes a record through the installer's own function with the worst
      # values it can think of, sources it under `set -eu`, and requires
      # silence on standard error and every value back exactly, from all three
      # readers. Seconds, before the build.
      - name: Check the Resolve install record sources cleanly
        run: ./tests/test-resolve-record.sh

      # ------------------------------------------------------------------------
      # Resolve's sound is not optional
      # ------------------------------------------------------------------------
      # ⚠️ FEATURE 008 ITEM 12, 2026-09-08. `pipewire-alsa` is the piece that
      # carries Resolve's audio out of its container and into the desktop's
      # PipeWire. It used to be on the runtime's OPTIONAL list, where a Rocky
      # point release that moved the package would have printed a note and
      # published a runtime that plays no sound at all.
      #
      # It is required now. This is a repository check rather than an image one
      # because the package lists belong to the runtime, which is a separate
      # build — so nothing else in this workflow would notice it sliding back.
      - name: Check Resolve's runtime still requires its sound
        run: |
          set -uo pipefail
          fails=0
          REQ=resolve-runtime/packages-required.txt
          OPT=resolve-runtime/packages-optional.txt
          # The package name on a line of its own — not inside a comment, which
          # is exactly what the note left behind in the optional file is.
          if grep -qx 'pipewire-alsa' "${REQ}"; then
            echo "  OK   ${REQ} requires pipewire-alsa, so a build without it stops"
          else
            echo "  FAIL ${REQ} no longer requires pipewire-alsa — the runtime could publish with no sound"
            fails=1
          fi
          if grep -qx 'pipewire-alsa' "${OPT}"; then
            echo "  FAIL ${OPT} lists pipewire-alsa again — an optional one is allowed to go missing"
            fails=1
          else
            echo "  OK   it is not back on the optional list"
          fi
          if [ "${fails}" -ne 0 ]; then
            echo "::error::Resolve's audio depends on pipewire-alsa being a required package of the runtime."
            exit 1
          fi

      # ------------------------------------------------------------------------
      # Files knows what a DaVinci Resolve project is
      # ------------------------------------------------------------------------
      # ⚠️ FEATURE 008 ITEM 9, 2026-09-08. Linux works out what a file is from a
      # shared list of file types, and that list has never heard of Resolve —
      # Blackmagic never registered one. So a `.drp` project is an "unknown"
      # file, and an unknown file cannot be offered an application to open it
      # with. AquariusOS adds the missing name.
      #
      # The file is checked HERE, on the runner, with the freedesktop project's
      # own tools, in a temporary folder: a malformed one would not merely fail
      # to add our type, it would stop the WHOLE shared list from rebuilding and
      # take every other file type on the machine with it.
      - name: Check the Resolve project file type is well formed
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libxml2-utils shared-mime-info
          SRC=system_files/usr/share/mime/packages/aquarius-resolve.xml
          echo "== is it XML at all? =="
          xmllint --noout "${SRC}"
          echo "  OK   ${SRC} is well-formed XML"
          echo "== does the freedesktop tool accept it? =="
          # In a temporary folder, so nothing on the runner is touched. The
          # system's own definitions go in beside ours: update-mime-database
          # wants a complete folder, not a single file.
          TMP="$(mktemp -d)"
          mkdir -p "${TMP}/packages"
          cp /usr/share/mime/packages/freedesktop.org.xml "${TMP}/packages/"
          cp "${SRC}" "${TMP}/packages/"
          update-mime-database "${TMP}"
          echo "  OK   the shared file-type list rebuilds with it in"
          echo "== and .drp really became a Resolve project =="
          if grep -qx 'application/x-davinci-resolve-project:\*.drp' "${TMP}/globs"; then
            echo "  OK   a file ending .drp is a DaVinci Resolve project"
          else
            echo "::error::${SRC} did not teach the shared list that .drp is a Resolve project."
            exit 1
          fi
          rm -rf "${TMP}"

      # ------------------------------------------------------------------------
      # THE MARK IS ONE DRAWING, AND IT IS THE RIGHT ONE
      # ------------------------------------------------------------------------
      # Royce redrew the AquariusOS mark on 2026-09-06. The "A" is now three
      # straight moves with one clean point at the top; the little hand-drawn
      # loop that used to sit at the apex is retired.
      #
      # ⚠️ WHY THIS IS CHECKED AT ALL. There is no such thing as a wrong-shaped
      # logo error. A stale copy of the old drawing renders perfectly, installs
      # perfectly and passes every other check in this file — the only thing that
      # notices is Royce's eye, and only if he happens to be looking at the boot
      # screen and the app chooser at the same moment. The way it comes back is
      # always the same: somebody restores an older file, or re-runs a renderer
      # from an older source, and nothing anywhere says so.
      #
      # So this reads the actual path data out of every drawing that carries the
      # mark, and it does it both ways round: the new shape must be there, and
      # the old shape must not be anywhere at all.
      - name: Check the mark is the redrawn one, everywhere
        run: |
          set -uo pipefail
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          # The apex, at the two scales it is ever drawn at.
          #   logo grid   the 64x64 files in branding/ and the wallpaper watermarks
          #   icon scale  the app icon, where the mark is shrunk to sit on a plate
          WANT_LOGO='M14 54L32 12L50 54'
          WANT_ICON='M17.24 50.22L32 15.78L46.76 50.22'
          # What the same two used to be. These are what a stale copy looks like.
          WAS_LOGO='q1.4-3.6 4 0'
          WAS_ICON='q1.15-2.95 3.28 0'

          echo "== the logo files themselves =="
          for f in branding/logo.svg branding/logo-ice.svg branding/logo-midnight.svg \
                   branding/logo-mono.svg \
                   system_files/usr/share/icons/hicolor/scalable/apps/aquarius-logo.svg; do
            if [ ! -r "${f}" ]; then bad "${f} is missing"; continue; fi
            if grep -qF "${WANT_LOGO}" "${f}"; then ok "${f} draws the clean point"
            else bad "${f} does not draw the clean point (${WANT_LOGO})"; fi
          done

          # logo.svg is meant to BE the Ice mark, and the icon the OS installs is
          # meant to be a copy of logo.svg. Both are easy to half-update.
          echo "== the copies really are copies =="
          if cmp -s branding/logo.svg branding/logo-ice.svg; then
            ok "logo.svg is byte-for-byte logo-ice.svg"
          else bad "logo.svg and logo-ice.svg have drifted apart"; fi
          if cmp -s branding/logo.svg system_files/usr/share/icons/hicolor/scalable/apps/aquarius-logo.svg; then
            ok "the installed aquarius-logo.svg is byte-for-byte logo.svg"
          else bad "aquarius-logo.svg has drifted from branding/logo.svg"; fi

          echo "== the wallpapers' watermarks =="
          for f in branding/wallpapers/the-pour.svg \
                   branding/wallpapers/the-pour-ice.svg \
                   branding/wallpapers/the-pour-midnight.svg; do
            if grep -qF "${WANT_LOGO}" "${f}"; then ok "$(basename "${f}") draws the clean point"
            else bad "$(basename "${f}") does not draw the clean point"; fi
          done

          echo "== the app icon that carries the mark =="
          # ONE DRAWING carries the mark, and it ships under two names. That is
          # the durable form of "only aquarius-apps changed when the apex
          # changed": if the mark ever spreads to a drawing that should not have
          # it, or leaves this one, this says so.
          #
          # ⚠️ THE SECOND NAME IS DELIBERATE (2026-09-09). aquarius-installer.svg
          # is the SAME FILE as aquarius-apps.svg — Aquarius Installer and
          # Aquarius Apps are two faces of one idea, and only the Installer is
          # visible in the app grid now. branding/icons/render.mjs writes both
          # from one entry in ALIASES, so they cannot drift; the byte-for-byte
          # check below is what proves that is still true. When the Installer
          # gets a drawing of its own, this list goes back to one name.
          for theme in Aquarius-Ice Aquarius-Midnight; do
            dir="system_files/usr/share/icons/${theme}/scalable/apps"
            carriers="$(grep -lF "${WANT_ICON}" "${dir}"/*.svg 2> /dev/null | xargs -n1 basename 2> /dev/null | sort | tr '\n' ' ')"
            if [ "${carriers}" = "aquarius-apps.svg aquarius-installer.svg " ]; then
              ok "${theme}: the mark is carried by the app-chooser drawing and its second name"
            else
              bad "${theme}: the mark is carried by [${carriers:-nothing}], expected aquarius-apps.svg and aquarius-installer.svg"
            fi
            if cmp -s "${dir}/aquarius-apps.svg" "${dir}/aquarius-installer.svg"; then
              ok "${theme}: aquarius-installer.svg is byte-for-byte aquarius-apps.svg"
            else
              bad "${theme}: aquarius-installer.svg has drifted from aquarius-apps.svg — they are meant to be one drawing"
            fi
          done
          for f in branding/icons/ice/aquarius-apps.svg branding/icons/midnight/aquarius-apps.svg; do
            if grep -qF "${WANT_ICON}" "${f}"; then ok "${f} draws the clean point"
            else bad "${f} does not draw the clean point"; fi
          done

          echo "== the code that draws it =="
          if grep -qF 'L${X(32)} ${Y(12)}L${X(50)}' branding/icons/icons.mjs; then
            ok "icons.mjs markPaths() writes the clean point"
          else bad "icons.mjs markPaths() no longer writes the clean point"; fi

          # The boot animation draws the same mark, but as TWO strokes that both
          # start at the point on top — that is what lets both legs pour downward
          # at the same time. Same geometry, written differently, so it needs its
          # own line here rather than the one above.
          if grep -qF "LEG_L = 'M32 12L14 54'" branding/pour.mjs \
             && grep -qF "LEG_R = 'M32 12L50 54'" branding/pour.mjs; then
            ok "pour.mjs pours the A out of the clean point (32,12)"
          else bad "pour.mjs no longer pours the A out of the clean point"; fi

          echo "== the retired apex is nowhere =="
          # Two deliberate exclusions:
          #   design-system/  a mirror of the Claude Design project, re-synced
          #                   from that side and still carrying the old identity.
          #                   branding/README.md says so.
          #   *.md            the written notes are ALLOWED to quote the retired
          #                   path — that is how they explain what was retired.
          #                   Only drawings and code are read here.
          STALE="$(grep -rlF -e "${WAS_LOGO}" -e "${WAS_ICON}" branding system_files \
                     --exclude-dir=design-system --exclude-dir=node_modules \
                     --exclude='*.md' 2> /dev/null || true)"
          if [ -z "${STALE}" ]; then
            ok "no file still draws the retired curved apex"
          else
            bad "these files still draw the retired curved apex:"
            printf '       %s\n' ${STALE}
          fi

          # ----------------------------------------------------------------
          # The rendered pictures, and the sizes they have to come out at
          # ----------------------------------------------------------------
          # Each of these is drawn on the Mac and committed, so nothing in the
          # build would notice a re-render that came out the wrong size. The
          # image-side steps further down prove the image is carrying THESE
          # EXACT FILES, by checksum — so a size checked here is a size checked
          # in the image.
          echo "== the rendered pictures are the sizes they must be =="
          python3 - <<'PY' || fails=1
          import glob, struct, sys

          bad = 0
          def size(path):
              data = open(path, "rb").read()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  return None
              return struct.unpack(">II", data[16:24])

          want = [
              ("system_files/usr/share/aquarius/branding/aquarius-about-logo.png", 279, 80,
               "the light About-page picture"),
              ("system_files/usr/share/aquarius/branding/aquarius-about-logo-white.png", 279, 80,
               "the dark About-page picture"),
              ("system_files/usr/share/aquarius/branding/aquarius-logo.png", 256, 256,
               "the login screen's logo"),
          ]
          for path, w, h, what in want:
              got = size(path)
              if got is None:
                  print(f"  FAIL {what}: {path} is missing or is not a PNG"); bad = 1
              elif got != (w, h):
                  print(f"  FAIL {what}: {path} is {got[0]}x{got[1]}, must be {w}x{h}"); bad = 1
              else:
                  print(f"  OK   {what} is {w}x{h}")

          # ----------------------------------------------------------------
          # The boot animation's frames
          # ----------------------------------------------------------------
          # 66 frames of the pour, 57 of the wind, the hold, and the four small
          # shapes the update and disk-password screens are built from. Numbered
          # with no gaps — the boot screen's own script counts up from 0001 and a
          # gap is a frame that silently never appears.
          THEME = "system_files/usr/share/plymouth/themes/aquarius"

          def check_run(prefix, count, w, h):
              global bad
              found = sorted(glob.glob(f"{THEME}/{prefix}-*.png"))
              if len(found) != count:
                  print(f"  FAIL {len(found)} {prefix} frames, expected {count}"); bad = 1
                  return
              for i, path in enumerate(found, start=1):
                  want = f"{prefix}-{i:04d}.png"
                  if path.rsplit("/", 1)[1] != want:
                      print(f"  FAIL expected {want}, found {path} — the frames must "
                            "be numbered with no gaps"); bad = 1
                      return
                  if size(path) != (w, h):
                      got = size(path)
                      print(f"  FAIL {want} is {got}, must be {w}x{h}"); bad = 1
                      return
              print(f"  OK   {count} {prefix} frames, all {w}x{h}")

          check_run("boot", 66, 288, 389)
          check_run("shutdown", 57, 288, 389)

          # The hold has to be the pour's LAST frame, exactly. A hold that differs
          # by one pixel is a visible flicker the moment the animation stops.
          try:
              last = open(f"{THEME}/boot-0066.png", "rb").read()
              hold = open(f"{THEME}/hold.png", "rb").read()
              if last != hold:
                  print("  FAIL hold.png is not byte-for-byte boot-0066.png — the "
                        "animation would flicker when it stops"); bad = 1
              else:
                  print("  OK   hold.png is byte-for-byte boot-0066.png")
          except FileNotFoundError as e:
              print(f"  FAIL {e.filename} is missing"); bad = 1

          for name, w, h, what in [
              ("box.png", 420, 48, "the disk-password box"),
              ("bullet.png", 18, 18, "one typed dot"),
              ("bar-track.png", 320, 3, "the empty progress bar"),
              ("bar-fill.png", 320, 3, "the blue that fills it"),
          ]:
              got = size(f"{THEME}/{name}")
              if got is None:
                  print(f"  FAIL {what}: {name} is missing or is not a PNG"); bad = 1
              elif got != (w, h):
                  print(f"  FAIL {what}: {name} is {got[0]}x{got[1]}, must be {w}x{h}"); bad = 1
              else:
                  print(f"  OK   {what} is {w}x{h}")

          # Nothing from the boot screen this replaced may still be here. It would
          # not be drawn, but it would be carried into the boot ramdisk, which is
          # the one file in this image whose size is worth caring about.
          stale = sorted(glob.glob(f"{THEME}/throbber-*.png") + glob.glob(f"{THEME}/watermark.png"))
          if stale:
              print(f"  FAIL {len(stale)} left-over picture(s) from the old boot screen, "
                    f"first: {stale[0]}"); bad = 1
          else:
              print("  OK   none of the old boot screen's pictures are left behind")

          sys.exit(bad)
          PY

          # ----------------------------------------------------------------
          # ⚠️ THE COLOURS INSIDE THE PICTURES
          # ----------------------------------------------------------------
          # This is the check no settings file can do. When a colour is retired
          # from the palette it has to disappear from the PICTURES as well, and
          # a hundred and twenty-four PNGs are a place a retired colour can hide
          # where grep cannot look. branding/png-colours.py opens them and reads
          # the actual pixels.
          #
          # It is done HERE, on the repository, rather than inside the image —
          # the image-side step below proves it is carrying these exact files by
          # checksum, so a colour checked here is a colour checked in the image.
          echo "== no retired colour is inside any frame of the boot animation =="
          if python3 branding/png-colours.py \
               --forbid 8AB4FF,5B4BE0,E6DDB8,06070C \
               system_files/usr/share/plymouth/themes/aquarius/boot-*.png \
               system_files/usr/share/plymouth/themes/aquarius/shutdown-*.png \
               system_files/usr/share/plymouth/themes/aquarius/hold.png; then
            echo "  OK   no retired Starlight colour in any of the 124 frames"
          else
            echo "  FAIL a retired colour is still in the boot animation (see above)"
            fails=1
          fi

          echo "== and the update screen's furniture really is the Midnight palette =="
          if python3 branding/png-colours.py --require 00BFFF \
               system_files/usr/share/plymouth/themes/aquarius/bar-fill.png \
             && python3 branding/png-colours.py --require 1B2940 \
               system_files/usr/share/plymouth/themes/aquarius/bar-track.png \
             && python3 branding/png-colours.py --require 121C2E \
               system_files/usr/share/plymouth/themes/aquarius/box.png; then
            echo "  OK   the bar is the Aquarius blue on surfaceAlt and the box is surface"
          else
            echo "  FAIL the progress bar or the password box is not the colour it must be"
            fails=1
          fi

          if [ "${fails}" -ne 0 ]; then
            echo "::error::The AquariusOS mark is not the redrawn one everywhere. Scroll up for the FAIL lines."
            exit 1
          fi
          echo "All mark checks passed."

      - name: Work out what this image is called
        run: |
          set -euo pipefail
          IMAGE_NAME="$(just variant-image-name ${{ matrix.variant }})"
          NVIDIA="$(just variant-nvidia ${{ matrix.variant }})"
          HANDHELD="$(just variant-handheld ${{ matrix.variant }})"
          DEFAULT_TAG="$(just generate-default-tag)"

          # Sanity check: the Justfile and the workflow matrix have to agree
          # about whether this variant wants the NVIDIA driver. If they ever
          # drift, one of the two images gets built as the other and is
          # published under the wrong name.
          if [ "${NVIDIA}" != "${{ matrix.nvidia }}" ]; then
            echo "::error::The Justfile says variant '${{ matrix.variant }}' has NVIDIA=${NVIDIA}, but this workflow says ${{ matrix.nvidia }}. They must agree."
            exit 1
          fi
          # And the same for the handheld switch, for the same reason: if the two
          # ever drift, one image gets built as another and is published under
          # the wrong name — and the handheld one is the image that starts
          # straight into Steam with no login screen, so publishing it under a
          # desktop name would take the login screen off somebody's PC.
          if [ "${HANDHELD}" != "${{ matrix.handheld }}" ]; then
            echo "::error::The Justfile says variant '${{ matrix.variant }}' has HANDHELD=${HANDHELD}, but this workflow says ${{ matrix.handheld }}. They must agree."
            exit 1
          fi

          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"
          echo "NVIDIA=${NVIDIA}" >> "${GITHUB_ENV}"
          echo "HANDHELD=${HANDHELD}" >> "${GITHUB_ENV}"
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> "${GITHUB_ENV}"
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"

      - name: Build the image
        id: build-image
        run: |
          just build "${IMAGE_NAME}" "${DEFAULT_TAG}" "${NVIDIA}" "${HANDHELD}"

      - name: How big is it
        run: |
          set -uo pipefail
          podman images --format '{{.Repository}}:{{.Tag}}  {{.Size}}'

          # ------------------------------------------------------------------
          # THE SIZE, SAID OUT LOUD AND MEASURED AGAINST WHAT IT USED TO BE
          # ------------------------------------------------------------------
          # ⚠️ THIS IS THE WHOLE POINT OF THE 2026-09-04 CHANGE, AND IT IS THE
          # ONE THING THAT WOULD OTHERWISE GO UNNOTICED. Aquarius Editor coming
          # back into the image produces no error and no red text: the build
          # just takes ten minutes longer and every person downloading
          # AquariusOS pays four gigabytes for an app they may never open.
          #
          # So the number is printed beside what it was before the last change
          # that moved it, and a ceiling is asserted. The ceiling is
          # deliberately generous — this is a warning about one very large app,
          # not a budget for the whole operating system — and it is expressed
          # in bytes, from podman's own machine-readable field, because
          # "11.1 GB" as text sorts wrongly and rounds differently on different
          # days.
          #
          # HOW THESE CEILINGS GOT WHERE THEY ARE
          #   2026-09-04  Aquarius Editor (4.1 GB) stopped being baked in and
          #               became a card in the first-login chooser. That is the
          #               thing this check exists to notice coming back.
          #   2026-09-15  Swift (FEATURES 022) baked in — about 3 GB. Ceilings
          #               went to 15 GB NVIDIA / 12 GB base.
          #   2026-09-15  GNOME AND KDE Plasma, both on every image (the
          #               two-desktop decision — see
          #               docs/decision-2026-09-15-two-desktops.md). Plasma is
          #               the new one and it adds about 1.6 GB. The base image
          #               went 11.1 -> 12.7 GB and walked straight through the
          #               12.0 ceiling; that is what failed build 35045190614.
          #               NVIDIA went 13.1 -> 14.7 GB and only just squeezed
          #               under 15.0. So the ceilings are now 16 GB NVIDIA and
          #               14 GB base — room for the second desktop and a little
          #               growth, and still far less than 4.1 GB of head room,
          #               so Aquarius Editor creeping back in is caught on the
          #               very next build.
          #   2026-09-16  The environment DaVinci Resolve runs in is now carried
          #               inside the NVIDIA image — about 0.33 GB, and NVIDIA
          #               only (build_files/63-resolve-runtime-bake.sh). It buys
          #               a Resolve setup of about three minutes instead of
          #               fifteen, and one that works with no internet at all.
          #               The ceilings were NOT raised for it: 14.7 + 0.33 is
          #               about 15.0, comfortably under the 16 GB already there.
          #               ⚠️ IF THIS BUILD FAILS THE SIZE CHECK ON THE NVIDIA
          #               IMAGE AND NOT ON THE BASE ONE, that difference is the
          #               first thing to look at — the environment should be
          #               ~330 MB and step 63 fails on its own if it is not.
          #   2026-09-17  Game Mode (Phase G1, build_files/71-game-mode.sh). The
          #               three Terra packages are small — tens of megabytes —
          #               and the NVIDIA image also carries one gamescope we
          #               compiled ourselves, which is a single program of a few
          #               megabytes, NOT the container it was built in. The
          #               ceilings were NOT raised: the whole phase is well under
          #               0.1 GB on either image and there is a gigabyte of head
          #               room already. ⚠️ IF THIS CHECK STARTS FAILING SOON
          #               AFTER A GAME MODE CHANGE, the thing to suspect is a
          #               build stage leaking its tools into the image — the
          #               gamescope builder is a separate stage precisely so
          #               that its compiler and its forty development packages
          #               never reach the finished operating system.
          BYTES="$(podman image inspect "${IMAGE_NAME}:${DEFAULT_TAG}" \
            --format '{{.Size}}' 2>/dev/null || echo 0)"
          GB="$(awk -v b="${BYTES}" 'BEGIN { printf "%.1f", b / 1000000000 }')"

          # WAS is the last size measured BEFORE the two desktops went in on
          # 2026-09-15 — the number this build should land about 1.6 GB above.
          #   2026-09-19  The handheld image (phase G2) is the AMD image plus
          #               four small userspace packages — InputPlumber,
          #               steamos-manager, powerstation and the power-button
          #               daemon — which together are well under 50 MB. It
          #               therefore shares the AMD image's ceiling, and the
          #               first green build is what turns this guess into a
          #               measured number. ⚠️ IF THE HANDHELD IMAGE IS MORE THAN
          #               ABOUT 0.1 GB BIGGER THAN THE BASE ONE, something has
          #               been pulled in that was not asked for — start with
          #               what steamos-manager-powerstation requires.
          if [ "${NVIDIA}" = "1" ]; then
            WAS="13.1"; CEILING=16000000000   # +1 GB on 2026-09-15: KDE Plasma is ~1.6 GB
          else
            WAS="11.1"; CEILING=14000000000   # +2 GB on 2026-09-15: KDE Plasma is ~1.6 GB
          fi

          echo
          echo "=== how big this image is ==="
          echo "  now:    ${GB} GB"
          echo "  before: ${WAS} GB  (the last build with GNOME as the only desktop, up to 2026-09-15)"
          echo "  change: $(awk -v w="${WAS}" -v g="${GB}" 'BEGIN { printf "%+.1f", g - w }') GB  (KDE Plasma is about +1.6 GB of that)"

          if [ "${BYTES}" -eq 0 ]; then
            echo "::warning::podman would not say how big the image is; skipping the size check"
          elif [ "${BYTES}" -le "${CEILING}" ]; then
            echo "  OK   under the ceiling of $(awk -v c="${CEILING}" 'BEGIN { printf "%.1f", c / 1000000000 }') GB"
          else
            echo "::error::this image is ${GB} GB, over the $(awk -v c="${CEILING}" 'BEGIN { printf "%.1f", c / 1000000000 }') GB ceiling."
            echo "The second desktop is already paid for here: KDE Plasma added about 1.6 GB"
            echo "on 2026-09-15 and the ceiling was raised past that on the same day."
            echo "So something ELSE large has been added. The usual suspect is Aquarius Editor,"
            echo "which is 4.1 GB and stopped being baked in on 2026-09-04 — check"
            echo "AQUARIUS_APPS in build_files/64-creator-apps.sh."
            exit 1
          fi

      # ------------------------------------------------------------------------
      # THE VERIFICATION
      # ------------------------------------------------------------------------
      # Everything below runs INSIDE the finished image, reading it the way a
      # booted machine would. `podman run --pull=never` guarantees it is looking
      # at the thing that was just built and not at something downloaded.
      - name: Check it says AquariusOS
        run: |
          set -euo pipefail
          cat > /tmp/verify-identity.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }
          check() {   # check "<description>" "<pattern>" "<file>"
            if grep -Eq "$2" "$3"; then ok "$1"; else bad "$1 — /$2/ not found in $3"; fi
          }

          echo "== /usr/lib/os-release =="
          cat /usr/lib/os-release
          echo "== /etc/os-release =="
          ls -l /etc/os-release

          echo "== checks =="
          check "NAME is AquariusOS"            '^NAME="AquariusOS"$'            /etc/os-release
          check "PRETTY_NAME is AquariusOS"     '^PRETTY_NAME="AquariusOS"$'     /etc/os-release
          check "/usr/lib/os-release agrees"    '^NAME="AquariusOS"$'            /usr/lib/os-release
          check "LOGO is ours"                  '^LOGO=aquarius-logo$'           /etc/os-release
          # The colour a terminal paints the logo in. `aquariusBlue` at its Ice
          # value #2C8FC4 = 44,143,196. Checked because it is set by a variable
          # a long way from the palette it is copied out of, and a stale value
          # here is invisible until somebody runs neofetch.
          check "ANSI_COLOR is the Ice accent"  '^ANSI_COLOR="0;38;2;44;143;196"$' /etc/os-release
          check "DEFAULT_HOSTNAME is aquarius"  '^DEFAULT_HOSTNAME="aquarius"$'  /etc/os-release
          check "VARIANT_ID is aquarius-os"     '^VARIANT_ID=aquarius-os$'       /etc/os-release
          check "VARIANT names an edition"      '^VARIANT="(NVIDIA|Desktop|Handheld) Edition"$' /etc/os-release
          check "HOME_URL is our repository"    '^HOME_URL="https://github\.com/' /etc/os-release
          check "ID stays fedora (deliberate)"  '^ID=fedora$'                    /etc/os-release

          if grep -q 'Fedora Linux' /etc/os-release; then
            bad "os-release still says 'Fedora Linux' somewhere"
            grep -n 'Fedora Linux' /etc/os-release
          else
            ok "nothing in os-release still says 'Fedora Linux'"
          fi

          # The edition has to match the image being built, or we would publish
          # the AMD image under the NVIDIA name.
          # The handheld one is asked about FIRST. It is an AMD image, so it
          # would otherwise match the Desktop branch — and the Desktop edition is
          # the one thing it certainly is not.
          if [ "${EXPECTED_HANDHELD}" = "1" ]; then
            check "this is the Handheld edition" '^VARIANT="Handheld Edition"$' /etc/os-release
          elif [ "${EXPECTED_NVIDIA}" = "1" ]; then
            check "this is the NVIDIA edition" '^VARIANT="NVIDIA Edition"$' /etc/os-release
          else
            check "this is the Desktop edition" '^VARIANT="Desktop Edition"$' /etc/os-release
          fi

          INFO=/usr/share/aquarius/image-info.json
          echo "== ${INFO} =="
          cat "${INFO}" || echo "(missing!)"
          if [ ! -f "${INFO}" ]; then
            bad "${INFO} does not exist"
          else
            got_name="$(sed -n 's/.*"image-name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "${INFO}" | head -1)"
            if [ "${got_name}" = "${EXPECTED_IMAGE_NAME}" ]; then
              ok "image-info.json says image-name is '${got_name}'"
            else
              bad "image-info.json says '${got_name}', expected '${EXPECTED_IMAGE_NAME}'"
            fi
          fi

          if [ -s /usr/share/icons/hicolor/scalable/apps/aquarius-logo.svg ]; then
            ok "the AquariusOS icon is installed"
          else
            bad "aquarius-logo.svg is missing — os-release names it and it is not there"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::This image does not identify as AquariusOS."
            exit 1
          fi
          echo "All identity checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            -e EXPECTED_IMAGE_NAME="${IMAGE_NAME}" \
            -e EXPECTED_NVIDIA="${NVIDIA}" \
            -e EXPECTED_HANDHELD="${HANDHELD}" \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-identity.sh

      - name: Check the software is really in there
        run: |
          set -euo pipefail
          cat > /tmp/verify-packages.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          echo "== the things this operating system cannot do without =="
          for pkg in \
            ffmpeg fdk-aac mesa-va-drivers-freeworld libheif-freeworld \
            gstreamer1-plugins-bad-freeworld gstreamer1-plugins-ugly \
            pipewire wireplumber NetworkManager NetworkManager-wifi bluez \
            tuned-ppd fwupd linux-firmware plymouth btrfs-progs exfatprogs ntfs-3g \
            gdm gnome-shell mutter gnome-control-center nautilus nautilus-python \
            ptyxis firefox gnome-software \
            gnome-shell-extension-dash-to-dock gnome-shell-extension-appindicator \
            gnome-shell-extension-caffeine gnome-shell-extension-gsconnect \
            xdg-desktop-portal-gnome xorg-x11-server-Xwayland flatpak \
            plasma-desktop plasma-workspace kwin plasma-systemsettings \
            kscreen plasma-nm plasma-pa bluedevil powerdevil \
            dolphin konsole spectacle gwenview okular \
            xdg-desktop-portal-kde breeze-gtk kde-gtk-config breeze-icon-theme \
            libnotify zenity wlr-randr \
            podman toolbox distrobox \
            langpacks-en langpacks-core-en \
            rsms-inter-fonts jetbrains-mono-fonts
          do
            if rpm -q "${pkg}" > /dev/null 2>&1; then
              ok "${pkg} $(rpm -q --queryformat '%{VERSION}-%{RELEASE}' "${pkg}")"
            else
              bad "${pkg} is NOT installed"
            fi
          done

          echo "== ffmpeg can actually encode the patented formats =="
          ffmpeg -hide_banner -encoders > /tmp/enc.txt 2>&1 || true
          for enc in libx264 libx265 libfdk_aac; do
            if grep -qw "${enc}" /tmp/enc.txt; then ok "ffmpeg has ${enc}"
            else bad "ffmpeg has no ${enc} — this is Fedora's stripped build, not RPM Fusion's"; fi
          done

          echo "== the login screen and the boot target =="
          if [ "$(systemctl get-default)" = "graphical.target" ]; then
            ok "the machine boots to a desktop"
          else
            bad "default target is $(systemctl get-default) — this would boot to a text prompt"
          fi
          if systemctl is-enabled gdm.service > /dev/null 2>&1; then
            ok "GDM is switched on"
          else
            bad "GDM is not switched on — nothing would draw a login screen"
          fi
          if [ -r /usr/share/wayland-sessions/gnome.desktop ]; then
            ok "there is a GNOME session for GDM to offer"
          else
            bad "no /usr/share/wayland-sessions/gnome.desktop — the login screen would have nothing to log into"
          fi

          echo "== Flathub is configured in the image, not in /var =="
          if [ -s /usr/share/flatpak/remotes.d/flathub.flatpakrepo ]; then
            ok "Flathub is preconfigured"
            grep -E '^(Url|Title)=' /usr/share/flatpak/remotes.d/flathub.flatpakrepo | sed 's/^/       /'
          else
            bad "Flathub is not preconfigured — the app store would be empty"
          fi

          echo "== the ingest helper =="
          if /usr/bin/aq-ingest --version; then ok "aq-ingest runs"; else bad "aq-ingest does not run"; fi
          if [ -r /usr/share/nautilus-python/extensions/aquarius_editor_ready.py ]; then
            ok "the 'Make Editor-Ready' right-click menu is installed"
          else
            bad "the 'Make Editor-Ready' right-click menu is missing"
          fi

          echo "== a fresh install knows which filesystem to use =="
          cat /usr/lib/bootc/install/20-aquarius.toml || echo "(missing!)"
          if grep -q '^type = "btrfs"$' /usr/lib/bootc/install/20-aquarius.toml 2>/dev/null; then
            ok "the image tells an installer to use btrfs"
          else
            bad "no root filesystem type in the image — no installer ISO can be built from it"
          fi

          echo "== exactly one kernel =="
          ls -1 /usr/lib/modules/
          n="$(find /usr/lib/modules -mindepth 1 -maxdepth 1 -type d | wc -l)"
          if [ "$n" -eq 1 ]; then ok "one kernel: $(ls -1 /usr/lib/modules/)"
          else bad "$n kernels in the image — a bootable image must have exactly one"; fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::This image is missing software it cannot work without."
            exit 1
          fi
          echo "All package checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-packages.sh

      # ------------------------------------------------------------------------
      # THE PAM MODULE CHECK — added 2026-09-05, after the bench login journal
      # ------------------------------------------------------------------------
      # The bench journal on 5 September 2026 had this at every single login:
      #
      #   login: PAM unable to dlopen(/usr/lib64/security/pam_fprintd.so): ...
      #   login: PAM adding faulty module: /usr/lib64/security/pam_fprintd.so
      #
      # Fedora's authselect writes the shared login rules (/etc/pam.d/system-auth
      # and password-auth) with a fingerprint step in them, and the bare
      # fedora-bootc base ships that rule but not the module it names. Step 30
      # now installs fprintd + fprintd-pam so the module exists.
      #
      # This check does two things on the FINISHED image:
      #   1. proves fprintd-pam is in and the exact file the log named is present;
      #   2. makes the fault GENERAL — it reads every /etc/pam.d file and fails
      #      the build if ANY of them names a PAM module that is not installed.
      #      That is the guarantee: a dangling PAM reference can never ship again,
      #      whatever module a future change might add.
      #
      # It runs on the finished image on purpose. A per-step check during the
      # build would see rule files whose modules a LATER step installs; only here,
      # after every package is in, is "names a module that is not installed" a
      # real fault rather than a matter of ordering.
      - name: Check no login rule names a PAM module that is missing
        run: |
          set -euo pipefail
          cat > /tmp/verify-pam.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          echo "== the fingerprint module the base's login rules asked for =="
          for pkg in fprintd fprintd-pam; do
            if rpm -q "${pkg}" > /dev/null 2>&1; then
              ok "${pkg} $(rpm -q --queryformat '%{VERSION}-%{RELEASE}' "${pkg}")"
            else
              bad "${pkg} is NOT installed"
            fi
          done
          if [ -e /usr/lib64/security/pam_fprintd.so ]; then
            ok "/usr/lib64/security/pam_fprintd.so is present — no 'faulty module' line at login"
          else
            bad "/usr/lib64/security/pam_fprintd.so is missing — every login would log a faulty PAM module"
          fi

          echo "== no login rule may REQUIRE a PAM module that is not installed =="
          # For every module a rule file loads, the file must exist — UNLESS the
          # line marks it silent-optional. PAM's own rule (man pam.d): a module
          # TYPE written with a leading '-' — for example
          #     -session   optional   pam_kwallet5.so auto_start
          # tells PAM to skip that module quietly when it is missing and log
          # NOTHING. Those references are optional by design and are not the fault
          # we are guarding against: keyring/wallet and ConsoleKit lines are
          # always written this way. The fprintd line, by contrast, was a plain
          #     auth       sufficient pam_fprintd.so
          # with no '-', which is exactly why it logged "faulty module" at every
          # login. So we honour the '-' prefix and fail only on a REQUIRED
          # reference whose module is absent — the kind that actually writes a
          # line to the journal.
          #
          # Read line by line, because whether a reference is silent depends on
          # its own first field, not just the module name.
          seen=0
          for f in /etc/pam.d/*; do
            [ -f "${f}" ] || continue
            while IFS= read -r raw || [ -n "${raw}" ]; do
              line="${raw%%#*}"                                   # drop trailing comment
              case "${line}" in *[![:space:]]*) : ;; *) continue ;; esac  # skip blank/comment-only
              mod="$(printf '%s\n' "${line}" | grep -oE '(/[A-Za-z0-9_./-]+/)?pam_[A-Za-z0-9_]+\.so' | head -n1)"
              [ -n "${mod}" ] || continue                         # not a module-loading line
              type_field="$(printf '%s\n' "${line}" | awk '{print $1; exit}')"
              case "${type_field}" in
                -*) continue ;;                                   # silent-optional: absence logs nothing
              esac
              seen=$((seen + 1))
              case "${mod}" in
                /*) path="${mod}" ;;
                *)  path="/usr/lib64/security/${mod}" ;;
              esac
              if [ ! -e "${path}" ]; then
                bad "${f} requires ${mod} (${type_field} …), but ${path} is not installed"
              fi
            done < "${f}"
          done
          echo "  (checked ${seen} required module reference(s) across /etc/pam.d)"
          if [ "${fails}" -eq 0 ]; then
            ok "every PAM module named under /etc/pam.d is installed"
          fi

          if [ "${fails}" -ne 0 ]; then
            echo "::error::A login rule names a PAM module that is not in the image. It would log a faulty-module line at every login. See the FAIL lines above."
            exit 1
          fi
          echo "All PAM module checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-pam.sh
      - name: Check the Wi-Fi, Bluetooth and graphics firmware is really in there
        run: |
          set -euo pipefail
          cat > /tmp/verify-firmware.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          echo "== every firmware package this image promises =="
          for pkg in \
            linux-firmware linux-firmware-whence \
            mt7xxx-firmware mediatek-firmware atheros-firmware realtek-firmware \
            brcmfmac-firmware iwlwifi-dvm-firmware iwlwifi-mvm-firmware \
            iwlwifi-mld-firmware iwlegacy-firmware nxpwireless-firmware \
            tiwilink-firmware libertas-firmware qcom-wwan-firmware \
            amd-gpu-firmware intel-gpu-firmware nvidia-gpu-firmware \
            intel-vsc-firmware \
            alsa-firmware alsa-sof-firmware cirrus-audio-firmware \
            intel-audio-firmware \
            amd-ucode-firmware microcode_ctl
          do
            if rpm -q "${pkg}" > /dev/null 2>&1; then
              ok "${pkg} $(rpm -q --queryformat '%{VERSION}-%{RELEASE}' "${pkg}")"
            else
              bad "${pkg} is NOT installed — hardware using it would report itself missing"
            fi
          done

          echo "== the blobs are really on disk =="
          # Counts entries of any kind: Fedora ships firmware xz-compressed and
          # some of it is reachable through symbolic links, so insisting on
          # plain files would report an empty shelf on a full one.
          count_fw() {   # count_fw <folder> <at least> "<whose hardware>"
            if [ ! -d "$1" ]; then
              bad "$3 — $1 does not exist"
              return
            fi
            n="$(find "$1" \( -type f -o -type l \) | wc -l | tr -d ' ')"
            if [ "$n" -ge "$2" ]; then ok "$3 — $n files in $1"
            else bad "$3 — only $n files in $1, expected at least $2"; fi
          }

          # THE ONE THAT FAILED. An MSI X870 Tomahawk WIFI carries a MediaTek
          # MT7925: Wi-Fi 7 and Bluetooth on one chip. These three files are its
          # Wi-Fi program, its Wi-Fi patch and its Bluetooth program, and the
          # Bluetooth one is why pairing still works.
          count_fw /usr/lib/firmware/mediatek/mt7925  3 "MediaTek MT7925 Wi-Fi 7 + Bluetooth (the bench board)"
          echo "       the MT7925's own files:"
          ls -1 /usr/lib/firmware/mediatek/mt7925/ 2>/dev/null | sed 's/^/         /' || true
          n_bt="$(find /usr/lib/firmware/mediatek/mt7925 -name 'BT_RAM_CODE*' 2>/dev/null | wc -l | tr -d ' ')"
          if [ "$n_bt" -ge 1 ]; then
            ok "the MT7925's Bluetooth program is there too"
          else
            bad "the MT7925 has Wi-Fi firmware but no Bluetooth firmware"
          fi

          count_fw /usr/lib/firmware/mediatek       40 "MediaTek radios"
          count_fw /usr/lib/firmware/rtw89           8 "Realtek Wi-Fi 6/7"
          count_fw /usr/lib/firmware/rtlwifi        20 "Realtek Wi-Fi, older"
          count_fw /usr/lib/firmware/rtl_bt         20 "Realtek Bluetooth"
          count_fw /usr/lib/firmware/ath11k          8 "Qualcomm Atheros Wi-Fi 6"
          count_fw /usr/lib/firmware/ath12k          4 "Qualcomm Atheros Wi-Fi 7"
          count_fw /usr/lib/firmware/ath10k          8 "Qualcomm Atheros, older"
          count_fw /usr/lib/firmware/qca            20 "Qualcomm Bluetooth"
          count_fw /usr/lib/firmware/brcm           50 "Broadcom / Cypress Wi-Fi + Bluetooth"
          count_fw /usr/lib/firmware/amdgpu        100 "AMD graphics"
          count_fw /usr/lib/firmware/i915           50 "Intel graphics"
          count_fw /usr/lib/firmware/nvidia/ad102    1 "NVIDIA graphics, nouveau fallback (RTX 40-series)"
          count_fw /usr/lib/firmware/intel/vsc      10 "Intel laptop webcams"
          count_fw /usr/lib/firmware/cirrus         20 "Cirrus laptop speaker amplifiers"
          count_fw /usr/lib/firmware/amd-ucode       1 "AMD CPU microcode"

          n_iwl="$(find /usr/lib/firmware -name 'iwlwifi-*' \( -type f -o -type l \) | wc -l | tr -d ' ')"
          if [ "$n_iwl" -ge 40 ]; then ok "Intel Wi-Fi — $n_iwl iwlwifi blobs"
          else bad "Intel Wi-Fi — only $n_iwl iwlwifi blobs, expected at least 40"; fi

          echo "== the OTHER half: the drivers =="
          # Firmware alone is useless. A working Wi-Fi chip needs the kernel's
          # driver AND the manufacturer's firmware, and missing either one looks
          # exactly the same from the desktop: "No Wi-Fi Adapter Found".
          #
          # This is checked HERE rather than in build_files/20-hardware-media.sh
          # because 58-kernel-pin.sh can replace this image's entire kernel long
          # after the firmware is installed, taking every module with it. Only
          # the finished image knows which modules actually shipped.
          echo "   kernel(s) whose modules are in this image:"
          ls -1 /usr/lib/modules/ | sed 's/^/     /'
          check_mod() {   # check_mod <module> "<whose hardware>"
            if [ -n "$(find /usr/lib/modules -name "$1.ko*" 2>/dev/null | head -1)" ]; then
              ok "$2 — driver $1"
            else
              bad "$2 — driver $1 is MISSING; that chip reports itself absent even with firmware present"
            fi
          }
          check_mod mt7925e    "MediaTek MT7925 Wi-Fi 7 (the bench board)"
          check_mod mt7921e    "MediaTek MT7921/7922 Wi-Fi 6E"
          check_mod iwlwifi    "Intel Wi-Fi"
          check_mod ath11k_pci "Qualcomm Atheros Wi-Fi 6"
          check_mod rtw89_pci  "Realtek Wi-Fi 6/7"
          check_mod brcmfmac   "Broadcom Wi-Fi"
          check_mod btusb      "Bluetooth over USB (every internal Bluetooth radio)"
          check_mod amdgpu     "AMD graphics"
          check_mod i915       "Intel graphics"

          echo "== Bluetooth still has its program as well as its firmware =="
          for pkg in bluez bluez-tools NetworkManager-bluetooth; do
            if rpm -q "${pkg}" > /dev/null 2>&1; then ok "${pkg}"
            else bad "${pkg} is NOT installed — Bluetooth would not pair"; fi
          done

          echo "== the datacentre firmware we deliberately do not ship =="
          # Not a safety check — a budget one. These are firmware for network
          # switches, server NICs and ARM phone chips, about 350 MB of things
          # that cannot appear in a creator's computer. If one turns up here it
          # arrived as somebody's dependency and the image just got bigger for
          # no reason. See the bottom of build_files/20-hardware-media.sh.
          for pkg in qcom-firmware mlxsw_spectrum-firmware mrvlprestera-firmware \
                     qcom-accel-firmware qed-firmware netronome-firmware \
                     liquidio-firmware dvb-firmware
          do
            if rpm -q "${pkg}" > /dev/null 2>&1; then
              echo "  NOTE ${pkg} is installed and was not asked for — something pulled it in"
            fi
          done

          echo "== how much of this image is firmware =="
          du -sh /usr/lib/firmware 2>/dev/null || true

          if [ "$fails" -ne 0 ]; then
            echo "::error::Firmware is missing. A machine booting this image would be told its Wi-Fi, Bluetooth or graphics card does not exist. See docs/restart/hardware.md."
            exit 1
          fi
          echo "All firmware checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-firmware.sh

      - name: Check the desktop comes up as Ice-light AquariusOS
        run: |
          set -euo pipefail
          cat > /tmp/verify-look.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          SCHEMAS=/usr/share/glib-2.0/schemas
          echo "== our settings files =="
          ls -l "${SCHEMAS}"/zz1-aquarius-* || echo "(none!)"

          for f in zz1-aquarius-10-look zz1-aquarius-20-shell zz1-aquarius-30-dash-to-dock zz1-aquarius-40-keys; do
            if [ -r "${SCHEMAS}/${f}.gschema.override" ]; then ok "${f} is installed"
            else bad "${SCHEMAS}/${f}.gschema.override is missing"; fi
          done

          # Ours must sort last, or somebody else's answer wins and every
          # AquariusOS default is silently ignored.
          first_ours="$(ls "${SCHEMAS}"/zz1-aquarius-*.gschema.override 2>/dev/null | sort | head -1)"
          last_theirs="$(ls "${SCHEMAS}"/*.gschema.override 2>/dev/null | grep -v 'zz1-aquarius' | sort | tail -1)"
          if [ -n "${last_theirs}" ]; then
            if [ "$(printf '%s\n%s\n' "$(basename "${last_theirs}")" "$(basename "${first_ours}")" | sort | tail -1)" = "$(basename "${first_ours}")" ]; then
              ok "our settings sort after everyone else's (last theirs: $(basename "${last_theirs}"))"
            else
              bad "$(basename "${last_theirs}") sorts after ours and would overwrite our defaults"
            fi
          else
            ok "no other override files in the image — ours are the only ones"
          fi

          if [ -s "${SCHEMAS}/gschemas.compiled" ]; then
            ok "the settings index exists"
          else
            bad "${SCHEMAS}/gschemas.compiled is missing — every AquariusOS default would be ignored"
          fi

          # ---------------------------------------------------------------
          # THE CHECK THAT MATTERS: ask the finished image what its settings
          # ARE, exactly as a brand-new user account will on first login.
          # ---------------------------------------------------------------
          echo "== reading the settings back out of the image =="
          want() {   # want <group> <setting> <expected>
            got="$(GSETTINGS_BACKEND=memory gsettings get "$1" "$2" 2>/dev/null || echo '<error>')"
            if [ "${got}" = "$3" ]; then ok "$1 $2 = ${got}"
            else bad "$1 $2 is ${got}, expected $3"; fi
          }
          want org.gnome.desktop.interface color-scheme "'default'"
          want org.gnome.desktop.interface font-name "'Inter 11'"
          want org.gnome.desktop.interface monospace-font-name "'JetBrains Mono 10'"
          # Phase R5 desktop identity — the pointer, the app icons and the
          # system sounds, named on purpose so they sit beside the fonts and the
          # accent and cannot drift, and matching the login screen
          # (build_files/50-aquarius-desktop.sh sets the same two values). See
          # docs/restart/desktop-identity.md.
          #
          # The pointer and the sounds are still GNOME's and freedesktop's own.
          # THE ICONS ARE OURS, since 2026-09-06: Aquarius-Ice, the light set,
          # because AquariusOS is light-first. Aquarius-Midnight is built and
          # installed beside it and nothing selects it yet — switching on the
          # colour scheme is the shell's job, not the image's.
          want org.gnome.desktop.interface cursor-theme "'Adwaita'"
          want org.gnome.desktop.interface cursor-size "24"
          want org.gnome.desktop.interface icon-theme "'Aquarius-Ice'"
          want org.gnome.desktop.sound theme-name "'freedesktop'"
          want org.gnome.desktop.sound event-sounds "true"
          want org.gnome.desktop.background picture-options "'zoom'"
          want org.gnome.shell.extensions.dash-to-dock dock-position "'BOTTOM'"
          want org.gnome.shell.extensions.dash-to-dock dock-fixed "true"
          want org.gnome.shell.extensions.dash-to-dock intellihide "false"

          echo "  ---- for the log ----"
          GSETTINGS_BACKEND=memory gsettings get org.gnome.desktop.background picture-uri || true
          GSETTINGS_BACKEND=memory gsettings get org.gnome.desktop.background picture-uri-dark || true
          GSETTINGS_BACKEND=memory gsettings get org.gnome.shell favorite-apps || true
          GSETTINGS_BACKEND=memory gsettings get org.gnome.shell enabled-extensions || true

          echo "== every pinned app really exists =="
          # ⚠️ ONE NAMED EXCEPTION SINCE 2026-09-04, and it is the same one that
          # build_files/50-aquarius-desktop.sh and the creator-apps check carry.
          # Aquarius Editor is pinned here and is NOT in the image: it is a
          # four-gigabyte download and its menu entry lands in each person's own
          # ~/.local/share/applications/ when they install it. It stays pinned on
          # purpose — GNOME does not draw a name it cannot resolve, so there is no
          # dead square, and the icon appears in its usual seat the moment the app
          # arrives. Named, never a wildcard, so a real typo still fails.
          GSETTINGS_BACKEND=memory gsettings get org.gnome.shell favorite-apps \
            | tr -d "[]' " | tr ',' '\n' | grep -v '^$' > /tmp/favs.txt || true
          while read -r fav; do
            if [ -r "/usr/share/applications/${fav}" ]; then ok "dock: ${fav}"
            elif [ "${fav}" = "aquarius-editor.desktop" ]; then
              ok "dock: ${fav} (installed into each person's home folder on request)"
            else bad "dock: ${fav} is pinned but not installed"; fi
          done < /tmp/favs.txt

          echo "== every enabled extension really exists =="
          GSETTINGS_BACKEND=memory gsettings get org.gnome.shell enabled-extensions \
            | tr -d "[]' " | tr ',' '\n' | grep -v '^$' > /tmp/exts.txt || true
          while read -r ext; do
            if [ -r "/usr/share/gnome-shell/extensions/${ext}/metadata.json" ]; then ok "extension: ${ext}"
            else bad "extension: ${ext} is switched on but not installed"; fi
          done < /tmp/exts.txt

          echo "== the wallpaper =="
          for f in /usr/share/backgrounds/aquarius/the-pour-ice-3840x2160.png \
                   /usr/share/backgrounds/aquarius/the-pour-midnight-3840x2160.png; do
            if [ -s "$f" ]; then ok "$(basename "$f") ($(stat -c '%s' "$f") bytes)"
            else bad "$f is missing — the desktop would come up a flat colour"; fi
          done
          if [ -r /usr/share/gnome-background-properties/aquarius.xml ]; then
            ok "the wallpaper is listed in Settings > Appearance"
          else
            bad "/usr/share/gnome-background-properties/aquarius.xml is missing"
          fi

          echo "== the fonts are findable =="
          for face in Inter "JetBrains Mono" Sora; do
            if fc-list | grep -qi "${face}"; then ok "${face}"
            else bad "${face} is not findable — the interface would fall back to a default"; fi
          done

          # ---------------------------------------------------------------
          # Phase R5 desktop identity — the cursor, icon and sound themes
          # ---------------------------------------------------------------
          # A theme setting names a PACKAGE and, on disk, a FOLDER. A gsettings
          # read-back above proves the setting is what we want; these prove the
          # thing it points at is actually in the image, so GNOME never has to
          # silently fall back. Package first, then folder.
          # adwaita-icon-theme still matters even though the icon default is
          # ours: both Aquarius themes say Inherits=Adwaita,hicolor, so it is
          # where the several thousand icons we do NOT draw come from.
          echo "== the desktop-identity theme packages are installed =="
          for pkg in adwaita-cursor-theme adwaita-icon-theme sound-theme-freedesktop; do
            if rpm -q "${pkg}" > /dev/null 2>&1; then ok "${pkg} ($(rpm -q "${pkg}"))"
            else bad "${pkg} is not installed — its theme default would fall back silently"; fi
          done

          echo "== the theme folders those settings point at exist =="
          for dir in \
            /usr/share/icons/Adwaita \
            /usr/share/icons/Adwaita/cursors \
            /usr/share/icons/Aquarius-Ice \
            /usr/share/icons/Aquarius-Midnight \
            /usr/share/sounds/freedesktop; do
            if [ -d "${dir}" ]; then ok "${dir}"
            else bad "${dir} is missing — the matching desktop-identity default would fall back"; fi
          done

          if [ "$fails" -ne 0 ]; then
            echo "::error::The AquariusOS look is not correctly applied in this image."
            exit 1
          fi
          echo "All appearance checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-look.sh

      # The two pictures on the Settings > About page are files we replace.
      # Comparing their checksums against the ones in branding/ is the only way
      # to know ours went in — the file names are Fedora's, so the page looks
      # perfectly normal either way.
      - name: Check the About page shows OUR logo
        run: |
          set -euo pipefail
          LIGHT_SUM="$(sha256sum system_files/usr/share/aquarius/branding/aquarius-about-logo.png | awk '{print $1}')"
          DARK_SUM="$(sha256sum system_files/usr/share/aquarius/branding/aquarius-about-logo-white.png | awk '{print $1}')"
          echo "In the repository:"
          echo "  light ${LIGHT_SUM}"
          echo "  dark  ${DARK_SUM}"
          cat > /tmp/verify-logos.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }
          got_light="$(sha256sum /usr/share/pixmaps/fedora_logo_med.png | awk '{print $1}')"
          got_dark="$(sha256sum /usr/share/pixmaps/fedora_whitelogo_med.png | awk '{print $1}')"
          echo "In the image:"
          echo "  light ${got_light}"
          echo "  dark  ${got_dark}"
          if [ "${got_light}" = "${WANT_LIGHT}" ]; then ok "the light About-page logo is ours"
          else bad "the light About-page logo is NOT ours — the page still shows Fedora's"; fi
          if [ "${got_dark}" = "${WANT_DARK}" ]; then ok "the dark About-page logo is ours"
          else bad "the dark About-page logo is NOT ours — the page still shows Fedora's in dark mode"; fi

          # And that the Settings app still reads those two files at all. If
          # Fedora ever moves them, replacing them becomes a no-op that nothing
          # would otherwise notice.
          for want in /usr/share/pixmaps/fedora_logo_med.png /usr/share/pixmaps/fedora_whitelogo_med.png; do
            if grep -a -q "${want}" /usr/bin/gnome-control-center; then
              ok "the Settings app still reads ${want}"
            else
              bad "the Settings app no longer mentions ${want} — replacing it does nothing now"
            fi
          done

          echo "== the login screen logo =="
          if [ -s /usr/share/aquarius/branding/aquarius-logo.png ]; then ok "the login-screen logo file is installed"
          else bad "/usr/share/aquarius/branding/aquarius-logo.png is missing"; fi
          if grep -a -q '/usr/share/aquarius/branding/aquarius-logo.png' /etc/dconf/db/gdm; then
            ok "the compiled login-screen settings really name our logo"
          else
            bad "/etc/dconf/db/gdm does not name our logo — the login screen would be blank there"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::This image is not wearing the AquariusOS logos."
            exit 1
          fi
          echo "All branding checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            -e WANT_LIGHT="${LIGHT_SUM}" \
            -e WANT_DARK="${DARK_SUM}" \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-logos.sh

      # ------------------------------------------------------------------------
      # THE INSTALLER (ANACONDA) ARTWORK, AND THE ISO'S OWN NAME
      # ------------------------------------------------------------------------
      # Two separate things, checked together because both are about the
      # installer and both were the subject of docs/restart/installer.md.
      #
      # 1. THE ARTWORK INSIDE THE IMAGE. build_files/80-boot-branding.sh replaces
      #    the Fedora logos Anaconda would show when it is run on a machine that
      #    is already up. Fedora 44 moved the sidebar logo into per-product
      #    folders, so the old fixed path replaced nothing; this asserts that
      #    every Anaconda logo path that EXISTS now carries our white wordmark.
      #    It is a positive, absent-safe check: a path that is not there is
      #    reported and skipped (fedora-logos may not be installed), but a path
      #    that IS there and is NOT ours fails the build.
      #
      #    ⚠️ This does NOT cover the picture on the USB-stick installer's own
      #    pages — that comes from a fresh fedora-logos the ISO builder downloads
      #    into a separate runtime, which nothing in this image can reach. See
      #    docs/restart/installer.md. This check is for the run-after-boot case.
      #
      # 2. THE ISO'S OWN NAME. disk_config/iso.toml is not in the image, so this
      #    half is a plain repository check: the disc label, application id and
      #    publisher must say AquariusOS / Stone Harbor. These are what a Mac or
      #    Windows machine shows when the stick is plugged in, and what the
      #    installer's boot menu is built from.
      - name: Check the installer artwork is ours and the ISO names itself AquariusOS
        run: |
          set -euo pipefail

          echo "== disk_config/iso.toml identity =="
          fails=0
          need() { # need <key> <expected>
            if grep -Eq "^${1}[[:space:]]*=[[:space:]]*\"${2}\"" disk_config/iso.toml; then
              echo "  OK   ${1} = \"${2}\""
            else
              echo "  FAIL ${1} is not \"${2}\" in disk_config/iso.toml"
              echo "       got: $(grep -E "^${1}[[:space:]]*=" disk_config/iso.toml || echo '(missing)')"
              fails=1
            fi
          }
          need volume_id AQUARIUSOS
          need application_id AquariusOS
          need publisher "Stone Harbor Entertainment"
          if [ "${fails}" -ne 0 ]; then
            echo "::error::The installer ISO would not name itself AquariusOS. See disk_config/iso.toml."
            exit 1
          fi

          echo "== the Anaconda artwork inside the image =="
          WANT_WORDMARK="$(sha256sum system_files/usr/share/aquarius/branding/aquarius-about-logo-white.png | awk '{print $1}')"
          echo "our white wordmark: ${WANT_WORDMARK}"
          cat > /tmp/verify-installer-art.sh <<'SCRIPT'
          set -u
          fails=0
          seen=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }
          # fedora-logos is what puts these files in the image. Report it, do not
          # require it — an image without it simply has nothing to check here.
          if rpm -q fedora-logos > /dev/null 2>&1; then
            echo "fedora-logos is installed: $(rpm -q fedora-logos)"
          else
            echo "fedora-logos is NOT installed — no Anaconda artwork to check, which is fine."
          fi

          check_is_ours() { # check_is_ours <path>
            local p="$1"
            if [ ! -e "${p}" ]; then
              echo "  absent ${p}"
              return
            fi
            seen=$((seen + 1))
            local got
            got="$(sha256sum "${p}" | awk '{print $1}')"
            if [ "${got}" = "${WANT_WORDMARK}" ]; then
              ok "${p} is ours"
            else
              bad "${p} is NOT ours (${got}) — 80-boot-branding.sh did not replace it"
            fi
          }

          # Fixed paths.
          check_is_ours /usr/share/anaconda/pixmaps/anaconda_header.png
          check_is_ours /usr/share/anaconda/boot/splash.png
          check_is_ours /usr/share/anaconda/boot/syslinux-splash.png

          # Every per-product sidebar logo, wherever Fedora put it.
          while IFS= read -r sb; do
            check_is_ours "${sb}"
          done < <(find /usr/share/anaconda -type f -name 'sidebar-logo.png' 2>/dev/null | sort)

          echo "Checked; ${seen} Anaconda logo file(s) present in this image."

          if [ "${fails}" -ne 0 ]; then
            echo "::error::The installer artwork inside the image is not all ours."
            exit 1
          fi
          echo "All present Anaconda logo files are ours (or none are installed)."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            -e WANT_WORDMARK="${WANT_WORDMARK}" \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-installer-art.sh

      # ------------------------------------------------------------------------
      # THE LOGIN SCREEN
      # ------------------------------------------------------------------------
      # Royce's photograph, 2026-09-04: the screen he logs in at was stock
      # Fedora GDM — flat grey, tiny name tiles on a 55" 4K monitor — while the
      # screen he unlocks at inside the session is ours. Two different
      # programs; docs/restart/login.md explains that in plain English.
      #
      # This step checks the half of the answer that lives in GDM: it is the
      # right size, and it is Ice-light with our typefaces and our logo. The
      # other half — our own greeter — is checked further down.
      - name: Check the login screen is ours and the right size
        run: |
          set -euo pipefail
          cat > /tmp/verify-login.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          echo "== GDM reads its own settings database =="
          if [ -r /etc/dconf/profile/gdm ]; then
            ok "/etc/dconf/profile/gdm exists"
            grep -q '^system-db:gdm$' /etc/dconf/profile/gdm \
              && ok "it names system-db:gdm" \
              || bad "it does not name system-db:gdm — every setting below would be ignored"
          else
            bad "/etc/dconf/profile/gdm is missing — GDM would read none of our settings"
          fi

          # THE CHECK THAT MATTERS: read the BUILT binary database, not the
          # keyfiles we wrote. `dconf update` can decline a keyfile in silence,
          # and then the file on disk is perfect and the login screen is stock.
          echo "== what the built database actually contains =="
          if [ ! -s /etc/dconf/db/gdm ]; then
            bad "/etc/dconf/db/gdm was never built"
          else
            ok "/etc/dconf/db/gdm exists ($(stat -c '%s' /etc/dconf/db/gdm) bytes)"
            for want in \
              /usr/share/aquarius/branding/aquarius-logo.png \
              prefer-light \
              'Inter 11' \
              'JetBrains Mono 10'
            do
              # (accent-color 'blue' used to be on this list. GNOME removed the
              # key from its schema, so ea6bfaf stopped setting it; this copy of
              # the check was missed and failed the NVIDIA image on 2026-09-09.)
              if grep -a -q "${want}" /etc/dconf/db/gdm; then
                ok "the login screen carries '${want}'"
              else
                bad "the login screen database has no '${want}' in it"
              fi
            done

            # ⚠️ AND WHAT MUST *NOT* BE IN IT — the 2026-09-05 removal.
            # The image used to ship a login-screen file setting
            #   [org/gnome/mutter] experimental-features=
            #     ['scale-monitor-framebuffer', 'xwayland-native-scaling']
            # and GNOME's own window manager answered, in the greeter's journal:
            #   Unknown experimental feature 'xwayland-native-scaling'
            # Both names were DELETED from GNOME in mutter merge request 4877
            # (merged 2026-02-03, GNOME 50) when both behaviours became
            # unconditional, and GNOME 51 deletes the experimental-features key
            # itself (merge request 4893). Read out of the BUILT database, not
            # the keyfiles: a keyfile being gone does not prove the database is.
            for never in \
              experimental-features \
              scale-monitor-framebuffer \
              xwayland-native-scaling
            do
              if grep -a -q "${never}" /etc/dconf/db/gdm; then
                bad "the login screen database still sets '${never}' — removed 2026-09-05, see docs/restart/login.md"
              else
                ok "the login screen database has no '${never}' in it"
              fi
            done
          fi

          # ------------------------------------------------------------------
          # ⚠️ EVERY LOGIN-SCREEN KEY WE SET MUST BE A KEY GNOME ACTUALLY HAS
          # ------------------------------------------------------------------
          # This is the general form of the 2026-09-05 bug, and the reason this
          # check exists at all. `dconf update` bakes ANY name into the database
          # without a word of complaint. Nothing between a typo in a build script
          # and a login screen on Royce's desk was checking that the setting was
          # real — so an invented value shipped, twice.
          #
          # The group name in a dconf keyfile is the GSettings schema with
          # slashes instead of dots: [org/gnome/mutter] is org.gnome.mutter. So
          # the check is: does that schema exist in THIS image, and does it list
          # that key? Asked of the schemas compiled into the image, which is the
          # only opinion that counts at runtime.
          echo "== every key we set is a key GNOME has =="
          if ! command -v gsettings > /dev/null 2>&1; then
            bad "'gsettings' is not in this image — login-screen keys cannot be checked"
          else
            for f in /etc/dconf/db/gdm.d/*; do
              [ -f "${f}" ] || continue
              schema=""
              while IFS= read -r line; do
                case "${line}" in
                  \[*\])
                    schema="${line#[}"; schema="${schema%]}"
                    schema="$(printf '%s' "${schema}" | tr '/' '.')"
                    ;;
                  ''|\#*) : ;;
                  *=*)
                    key="$(printf '%s' "${line%%=*}" | tr -d '[:space:]')"
                    [ -n "${key}" ] || continue
                    if [ -z "${schema}" ]; then
                      bad "$(basename "${f}"): '${key}' is not under any [group] — dconf ignores it"
                    elif ! gsettings list-keys "${schema}" > /dev/null 2>&1; then
                      bad "$(basename "${f}"): schema ${schema} is not in this image"
                    elif gsettings list-keys "${schema}" 2>/dev/null | grep -qx "${key}"; then
                      ok "${schema} really has a key called '${key}'"
                    else
                      bad "${schema} has NO key called '${key}' — this is the 2026-09-05 class of bug"
                    fi
                    ;;
                esac
              done < "${f}"
            done
          fi

          # The logo has to be a real picture. A path pointing at nothing gives
          # a login screen with a blank space where the logo should be, and no
          # error anywhere.
          if [ -s /usr/share/aquarius/branding/aquarius-logo.png ]; then
            ok "the logo the database names is a real file"
          else
            bad "the logo file the database names does not exist — the login screen would show a gap"
          fi

          echo "== the messenger that tells the login screen the screen size =="
          if [ -x /usr/libexec/aquarius-gdm-display ]; then
            ok "/usr/libexec/aquarius-gdm-display is installed and executable"
          else
            bad "/usr/libexec/aquarius-gdm-display is missing — GDM would run at 100% on a 4K screen"
          fi
          if bash -n /usr/libexec/aquarius-gdm-display 2>/dev/null; then
            ok "it is valid shell"
          else
            bad "/usr/libexec/aquarius-gdm-display does not parse as shell"
          fi

          # Run it for real, inside the image. There is no opt-in marker here
          # (there must not be), so the correct answer is "the copy is off" and
          # a clean exit. That proves the program runs at all, which is the
          # failure this catches: a syntax error or a missing python3 would
          # otherwise only show up on Royce's machine, at boot.
          echo "  ---- running it (expected: the copy is off) ----"
          if aq_said="$(/usr/libexec/aquarius-gdm-display 2>&1)"; then
            printf '%s\n' "${aq_said}" | sed 's/^/       /'
            ok "it runs and exits cleanly"
          else
            printf '%s\n' "${aq_said}" | sed 's/^/       /'
            bad "it failed to run — see the lines above"
          fi
          if printf '%s' "${aq_said}" | grep -q 'display copy is off'; then
            ok "and it says the copy is off, which is the shipped default"
          else
            bad "it did not say the copy is off — a fresh image must copy nothing"
          fi
          # ⚠️ AND IT MUST HAVE WRITTEN NOTHING. This is the whole decision of
          # 2026-09-05, checked by looking rather than by reading the source.
          for f in /etc/xdg/monitors.xml /var/lib/gdm/.config/monitors.xml; do
            if [ -e "${f}" ]; then
              bad "${f} exists in a fresh image — the login screen must be given nothing by default"
            else
              ok "${f} does not exist (nothing was handed to the login screen)"
            fi
          done

          # ⚠️ AND IT MUST TAKE AWAY A COPY LEFT BY AN OLDER AQUARIUSOS. This is
          # what heals a machine that is updating: its /etc still holds the file
          # the old logout hook wrote at the last shutdown, and that file is what
          # black-screens it. Nobody types anything; the boot run removes it.
          echo "== it removes a copy left behind by an older AquariusOS =="
          mkdir -p /etc/xdg /var/lib/gdm/.config
          printf '<monitors version="2"><configuration><logicalmonitor><scale>1.25</scale></logicalmonitor></configuration></monitors>' \
            | tee /etc/xdg/monitors.xml > /var/lib/gdm/.config/monitors.xml
          /usr/libexec/aquarius-gdm-display 2>&1 | sed 's/^/       /'
          if [ -e /etc/xdg/monitors.xml ] || [ -e /var/lib/gdm/.config/monitors.xml ]; then
            bad "a leftover copy survived — an updating machine would black-screen again"
            rm -f /etc/xdg/monitors.xml /var/lib/gdm/.config/monitors.xml
          else
            ok "both leftover copies were removed with nobody asking"
          fi

          echo "== it runs at boot, before the login screen =="
          # ⚠️ CHECKED AS A SHIPPED SYMLINK UNDER /usr, NOT WITH `is-enabled`.
          # `systemctl enable` writes into /etc, and on this kind of operating
          # system /etc is 3-way merged at every update: one `systemctl disable`
          # on one machine turns a service off there FOREVER, and no image can
          # switch it back on. Royce hit exactly that. The long version is in
          # build_files/aq-lib.sh.
          for unit in aquarius-gdm-display.service aquarius-gdm-guard.service \
                      aquarius-login-screen-alias.service; do
            link="/usr/lib/systemd/system/graphical.target.wants/${unit}"
            if [ -L "${link}" ] && [ -e "${link}" ]; then
              ok "${unit} is switched on from /usr, where an update always restores it"
            else
              bad "${link} is missing or dangling — ${unit} would never start"
            fi
            if [ -e "/etc/systemd/system/graphical.target.wants/${unit}" ]; then
              bad "${unit} is ALSO switched on through /etc — a build step ran 'systemctl enable'"
            else
              ok "nothing switches ${unit} on through /etc"
            fi
          done
          if grep -q '^Before=display-manager.service$' \
               /usr/lib/systemd/system/aquarius-gdm-display.service; then
            ok "it is ordered before the login screen starts"
          else
            bad "it is not ordered Before=display-manager.service — it could run too late to matter"
          fi

          # ⚠️ THE 2026-09-15 FIX: GDM ITSELF IS NOW WANTED FROM /usr.
          # The bench booted to a text prompt because the only thing starting
          # the login screen was a link in /etc, and that machine's /etc still
          # named greetd from a summer test. GDM now starts because the image
          # says so.
          if [ -L /usr/lib/systemd/system/graphical.target.wants/gdm.service ] \
             && [ -e /usr/lib/systemd/system/graphical.target.wants/gdm.service ]; then
            ok "gdm.service is wanted from /usr, so no change to /etc can stop the login screen"
          else
            bad "graphical.target.wants/gdm.service is missing from /usr — a stale /etc alias could leave this machine with no login screen"
          fi
          # And the name still points at GDM. In the finished image this link
          # lives under /usr/etc, which is where the packaging tool puts the
          # image's copy of /etc.
          aq_dm_alias=""
          for f in /usr/etc/systemd/system/display-manager.service \
                   /etc/systemd/system/display-manager.service; do
            [ -e "${f}" ] || [ -L "${f}" ] || continue
            aq_dm_alias="$(readlink -f "${f}" 2>/dev/null || true)"
            echo "       ${f} -> ${aq_dm_alias:-(nothing)}"
            break
          done
          case "${aq_dm_alias}" in
            */gdm.service) ok "'the login screen' in this image means GDM" ;;
            *) bad "the display-manager alias does not point at gdm.service (it says '${aq_dm_alias:-nothing}')" ;;
          esac

          echo "== the logout hook does nothing unless somebody asked =="
          # ⚠️ THE SECOND BLACK SCREEN WAS PROBABLY THIS FILE. An update's new
          # /etc does not exist yet at the moment you log out of the old system,
          # so the last thing a machine runs before its first boot on a new
          # image is the OLD logout hook. A hook that copies by default copies
          # once more after you have stopped wanting it to.
          if [ -x /etc/gdm/PostSession/Default ]; then
            ok "/etc/gdm/PostSession/Default is executable (GDM skips it silently otherwise)"
          else
            bad "/etc/gdm/PostSession/Default is missing or not executable"
          fi
          if grep -q '/usr/libexec/aquarius-gdm-display' /etc/gdm/PostSession/Default 2>/dev/null; then
            ok "the logout hook calls the messenger"
          else
            bad "the logout hook does not call /usr/libexec/aquarius-gdm-display"
          fi
          if grep -q 'gdm-display-optin' /etc/gdm/PostSession/Default 2>/dev/null; then
            ok "and only when the copy has been switched on"
          else
            bad "the logout hook copies unconditionally — that is how the bench got its second black screen"
          fi
          if tail -1 /etc/gdm/PostSession/Default 2>/dev/null | grep -q '^exit 0$'; then
            ok "the logout hook always succeeds (a failing one would trap a session)"
          else
            bad "the logout hook does not end in 'exit 0' — a logout could fail on it"
          fi

          # ====================================================================
          # ⚠️ THE BLACK SCREEN OF 2026-09-05 — the checks that stop it coming
          #    back. Everything above is about the login screen looking right.
          #    This is about it APPEARING AT ALL.
          # ====================================================================
          # The bench booted to a mouse pointer on an empty screen. The cause was
          # this image's own helpfulness: it had copied Royce's display
          # arrangement, which asks for 125%, to the login screen, and the login
          # screen drew nothing rather than round it down.
          echo "== the safety check on what the login screen is given =="
          if [ -x /usr/libexec/aquarius-monitors-sanitize ]; then
            ok "/usr/libexec/aquarius-monitors-sanitize is installed and executable"
          else
            bad "the sanitiser is missing — nothing would stop a part size reaching the login screen"
          fi
          # compile() rather than py_compile, which would write a __pycache__
          # into /usr/libexec. See the note in 50-aquarius-desktop.sh.
          if python3 -c "import sys; compile(open(sys.argv[1]).read(), sys.argv[1], 'exec')" \
               /usr/libexec/aquarius-monitors-sanitize 2>/dev/null; then
            ok "it is valid python"
          else
            bad "/usr/libexec/aquarius-monitors-sanitize does not compile"
          fi

          # ⚠️ AND NOTHING WAS LEFT BEHIND BY THE BUILD. The build checks this
          # program compiles; an earlier version did it with py_compile, which
          # writes, and shipped a __pycache__ folder to every machine.
          if [ -e /usr/libexec/__pycache__ ]; then
            bad "/usr/libexec/__pycache__ was baked into the image — a build step wrote where it should only have read"
          else
            ok "the build left no __pycache__ litter in /usr/libexec"
          fi

          # ⚠️ THE RULE ITSELF, PROVED INSIDE THE FINISHED IMAGE, against Royce's
          # own monitor. A sanitiser that is present and does nothing is exactly
          # as bad as one that is absent and much harder to notice.
          fixture_dir="$(mktemp -d)"
          cat > "${fixture_dir}/in.xml" <<'XML'
          <monitors version="2">
            <configuration>
              <logicalmonitor>
                <x>0</x><y>0</y><scale>1.25</scale><primary>yes</primary>
                <monitor>
                  <monitorspec><connector>DP-1</connector></monitorspec>
                  <mode><width>3840</width><height>2160</height><rate>59.997</rate></mode>
                </monitor>
              </logicalmonitor>
            </configuration>
          </monitors>
          XML
          if /usr/libexec/aquarius-monitors-sanitize \
               "${fixture_dir}/in.xml" "${fixture_dir}/out.xml" >/dev/null 2>&1 \
             && grep -q '<scale>1</scale>' "${fixture_dir}/out.xml"; then
            ok "a 4K screen asking for 125% really comes out as 100%"
          else
            bad "the sanitiser did NOT turn 125% into 100% — the bench would boot to a black screen"
          fi
          # And it must refuse a file it cannot understand rather than pass it on.
          printf '<monitors><configuration>' > "${fixture_dir}/broken.xml"
          if /usr/libexec/aquarius-monitors-sanitize \
               "${fixture_dir}/broken.xml" "${fixture_dir}/broken-out.xml" >/dev/null 2>&1; then
            bad "the sanitiser accepted a half-written file — it must refuse"
          elif [ -e "${fixture_dir}/broken-out.xml" ]; then
            bad "the sanitiser refused a half-written file but wrote output anyway"
          else
            ok "a half-written arrangement is refused and nothing is written"
          fi
          rm -rf "${fixture_dir}"

          # The messenger must USE it. The original bug was not a wrong rule, it
          # was a copy with no rule in front of it, so this checks the wiring and
          # not just the parts.
          if grep -q 'aquarius-monitors-sanitize' /usr/libexec/aquarius-gdm-display; then
            ok "the messenger runs the sanitiser before copying anything"
          else
            bad "/usr/libexec/aquarius-gdm-display does not call the sanitiser — that IS the 2026-09-05 bug"
          fi
          # ...and it must hand over the SAFE copy, not the original. Grepping for
          # the tempting mistake rather than for the right answer: an `install` of
          # ${AQ_NEWEST} is exactly how this regresses.
          if grep -Eq '^\s*install .*\$\{AQ_NEWEST\}' /usr/libexec/aquarius-gdm-display; then
            bad "the messenger still copies the user's file directly somewhere — only the sanitised copy may be handed over"
          else
            ok "nothing in the messenger copies the unsanitised file"
          fi

          echo "== the guard that rescues a login screen that never appears =="
          if [ -x /usr/libexec/aquarius-gdm-guard ]; then
            ok "/usr/libexec/aquarius-gdm-guard is installed and executable"
          else
            bad "the guard is missing — a black login screen would stay black"
          fi
          if bash -n /usr/libexec/aquarius-gdm-guard 2>/dev/null; then
            ok "it is valid shell"
          else
            bad "/usr/libexec/aquarius-gdm-guard does not parse as shell"
          fi
          # ⚠️ AND IT MUST NOT DECIDE ON SESSION EXISTENCE ALONE. That single
          # question is the whole of the 2026-09-05 failure: the greeter had a
          # session and the screen was black. tests/test-gdm-guard.sh executes
          # the new trigger; this is the cheap grep that stops the old shape
          # coming back in a hurry.
          if grep -q 'aq_login_screen_is_up\|aq_graphical_session_exists' \
               /usr/libexec/aquarius-gdm-guard; then
            bad "the guard is back to asking 'is there a session?' — that is the 2026-09-05 bug"
          else
            ok "the guard does not decide on session existence alone"
          fi
          for signal in aq_graphical_session_ids aq_gdm_restart_count \
                        aq_compositor_rejected_the_display_config; do
            if grep -q "${signal}" /usr/libexec/aquarius-gdm-guard; then
              ok "it still has the '${signal}' signal"
            else
              bad "the guard lost the '${signal}' signal — its trigger is back to one question"
            fi
          done
          # ⚠️ THE RESCUER MUST NEVER BE ABLE TO STOP THE RESCUE. After= orders
          # it; Requires= would make the login screen depend on it.
          if grep -q '^After=display-manager.service' /usr/lib/systemd/system/aquarius-gdm-guard.service; then
            ok "it is ordered after the login screen and does not depend on it"
          else
            bad "the guard is not ordered After=display-manager.service"
          fi
          if grep -Eq '^(Requires|BindsTo|Requisite)=.*display-manager' \
               /usr/lib/systemd/system/aquarius-gdm-guard.service; then
            bad "the guard makes the login screen depend on it — a broken rescuer could stop the rescue"
          else
            ok "the login screen does not depend on the guard"
          fi
          # It repairs at most once per boot, and the stamp that guarantees that
          # has to be on a filesystem that is emptied at boot. A stamp under /var
          # would mean it repairs once in the machine's life and never again.
          if grep -q '^AQ_STAMP_DIR="/run/' /usr/libexec/aquarius-gdm-guard; then
            ok "its 'already tried' stamp is under /run, so it resets at every boot"
          else
            bad "the guard's stamp is not under /run — it would only ever repair once, ever"
          fi

          echo "== the login screen is given nothing until somebody says otherwise =="
          # Shipping either marker would mean pushing a behaviour that has
          # black-screened a real machine twice onto every computer that
          # installs AquariusOS, with nobody having chosen it. They are created
          # by hand, on one machine, by `sudo aq login scale on`.
          for marker in /var/lib/aquarius/gdm-display-optin \
                        /var/lib/aquarius/gdm-fractional-ok; do
            if [ -e "${marker}" ]; then
              bad "${marker} is baked into the image — this must be opt-in, per machine"
            else
              ok "${marker} is not in the image"
            fi
          done
          if aq_out="$(aq login scale status 2>&1)"; then
            ok "'aq login scale status' runs"
            printf '%s\n' "${aq_out}" | sed 's/^/       /'
          else
            bad "'aq login scale status' failed"
            printf '%s\n' "${aq_out}" | sed 's/^/       /'
          fi
          # And it must SAY off, in words a person can act on. A status command
          # that reports the opposite of the truth is worse than none.
          if printf '%s' "${aq_out}" | grep -q 'is NOT given anything'; then
            ok "and it says the login screen is given nothing"
          else
            bad "'aq login scale status' does not report the copy as off"
          fi
          # The switch has to exist and be reachable, or the opt-in is a story.
          for word in 'aq login scale on' 'aq login scale off'; do
            if aq login scale --help 2>&1 | grep -q "${word}"; then
              ok "'${word}' is documented in the command's own help"
            else
              bad "'${word}' is not in 'aq login scale --help'"
            fi
          done

          if [ "$fails" -ne 0 ]; then
            echo "::error::The login screen is not set up the way this image intends."
            exit 1
          fi
          echo "All login screen checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-login.sh

      # ------------------------------------------------------------------------
      # The same rule table again, against the INSTALLED copies
      # ------------------------------------------------------------------------
      # The step before the build ran these tests against the files in the
      # repository. This runs the identical tests against the programs as they
      # actually exist in the finished image — which is the only version that
      # will ever run on Royce's machine, and the one that a bad COPY step or a
      # missing chmod would break without changing a single line of source.
      - name: Check the login screen size rules hold in the finished image
        run: |
          set -euo pipefail
          # Each file is mounted at the exact path the test expects to find it,
          # rather than copied and renamed inside — an earlier version mounted
          # the test under a shorter name and then looked for the long one, and
          # failed on a missing file rather than on anything real.
          #
          # The test resolves the guard relative to itself, so the repository's
          # copy is mounted at that relative path. Everything the test actually
          # exercises — the sanitiser and the messenger — is named explicitly on
          # the command line and is the INSTALLED copy.
          podman run --rm --pull=never \
            -v "${GITHUB_WORKSPACE}/tests/test-gdm-scale-sanitize.sh:/tmp/t/tests/test-gdm-scale-sanitize.sh:ro" \
            -v "${GITHUB_WORKSPACE}/system_files/usr/libexec/aquarius-gdm-guard:/tmp/t/system_files/usr/libexec/aquarius-gdm-guard:ro" \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" -c '
              set -e
              bash /tmp/t/tests/test-gdm-scale-sanitize.sh \
                /usr/libexec/aquarius-monitors-sanitize \
                /usr/libexec/aquarius-gdm-display
            '

      # ------------------------------------------------------------------------
      # And the guard's trigger, executed against the INSTALLED guard
      # ------------------------------------------------------------------------
      # The step before the build ran this against the repository's copy. This
      # runs it against the program as it exists in the finished image — which
      # is the only version that will ever run on Royce's machine, and the one
      # a bad COPY step or a missing chmod would break without changing a line
      # of source. That is not hypothetical here: the guard that failed on
      # 2026-09-05 was, as far as any build log could tell, perfectly installed.
      - name: Check the login-screen guard fires in the finished image
        run: |
          set -euo pipefail
          podman run --rm --pull=never \
            -v "${GITHUB_WORKSPACE}/tests/test-gdm-guard.sh:/tmp/t/tests/test-gdm-guard.sh:ro" \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" -c '
              set -e
              bash /tmp/t/tests/test-gdm-guard.sh /usr/libexec/aquarius-gdm-guard
            '
      - name: Check the USB4 rescue in the finished image
        run: |
          set -euo pipefail
          podman run --rm --pull=never \
            -v "${GITHUB_WORKSPACE}/tests/test-usb4-rescue.sh:/tmp/t/tests/test-usb4-rescue.sh:ro" \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" -c '
              set -e
              bash /tmp/t/tests/test-usb4-rescue.sh /usr/libexec/aquarius-usb4-rescue
            '

      # The app icons, read back out of the FINISHED image — every icon, in both
      # themes, at all eight sizes, with each PNG's own stated width and height
      # compared against the folder it sits in.
      #
      # The step before the build checked the repository's copies. This checks
      # the ones that will actually be on Royce's machine, which is a different
      # question: a mis-copied file, a folder that did not survive the image
      # packaging, or a launcher entry that names an icon nothing provides would
      # all pass there and fail here.
      #
      # Same test file, given "/" instead of the repository, so the two can
      # never drift.
      - name: Check the Aquarius app icons in the finished image
        run: |
          set -euo pipefail
          podman run --rm --pull=never \
            -v "${GITHUB_WORKSPACE}/tests/test-aquarius-icons.sh:/tmp/t/tests/test-aquarius-icons.sh:ro" \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" -c '
              set -e
              bash /tmp/t/tests/test-aquarius-icons.sh /
            '

      # The installer's sorter and its routes, run against the copy inside the
      # FINISHED image — the only version that will ever run on Royce's machine.
      # The step before the build proved the repository's copy; a mis-copied
      # file, a missing chmod, or a `cpio` that did not survive the image
      # packaging would all pass there and fail here. Same test file, given the
      # installed path, so the two can never drift.
      #
      # This run also does more than the pre-build one: the finished image has
      # rpm2cpio and cpio, so the .rpm half of Route A is exercised for real
      # rather than skipped.
      - name: Check Aquarius Installer in the finished image
        run: |
          set -euo pipefail
          podman run --rm --pull=never \
            -v "${GITHUB_WORKSPACE}/tests/test-installer-sorter.py:/tmp/t/tests/test-installer-sorter.py:ro" \
            -v "${GITHUB_WORKSPACE}/tests/test-installer-windows.py:/tmp/t/tests/test-installer-windows.py:ro" \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" -c '
              set -e
              python3 /tmp/t/tests/test-installer-sorter.py \
                /usr/lib/aquarius/python/aquarius_installer.py
              python3 /tmp/t/tests/test-installer-windows.py /
            '

      # CLI checks never construct GTK widgets. Open the actual shipped window
      # on an invisible desktop as well, so a bad page cannot ship again.
      #
      # --cap-add=SYS_NICE on every step below that mounts aquarius_headless.py:
      # the invisible desktop is KDE's kwin_wayland, and Fedora ships that
      # program with a file capability (cap_sys_nice+ep — permission to raise
      # its own scheduling priority). The kernel refuses to run a program
      # carrying a capability the container does not have in its bounding set,
      # so without this flag it fails at exec with "Operation not permitted"
      # before KWin runs a single line. Adding SYS_NICE lets it start; it grants
      # the container nothing more than the right to be nice to itself.
      - name: Open Aquarius Installer in the finished image
        run: |
          set -euo pipefail
          podman run --rm --pull=never \
            --cap-add=SYS_NICE \
            -v "${GITHUB_WORKSPACE}/tests/test-installer-window.py:/tmp/test-installer-window.py:ro" \
            -v "${GITHUB_WORKSPACE}/tests/aquarius_headless.py:/tmp/aquarius_headless.py:ro" \
            --entrypoint /usr/bin/python3 \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" /tmp/test-installer-window.py /

      - name: Check Resolve completion page in the finished image
        run: |
          set -euo pipefail
          podman run --rm --pull=never \
            --cap-add=SYS_NICE \
            -v "${GITHUB_WORKSPACE}/tests/test-installer-window.py:/tmp/test-installer-window.py:ro" \
            -v "${GITHUB_WORKSPACE}/tests/aquarius_headless.py:/tmp/aquarius_headless.py:ro" \
            -v "${GITHUB_WORKSPACE}/tests/test-resolve-done-window.py:/tmp/test-resolve-done-window.py:ro" \
            --entrypoint /usr/bin/python3 \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" /tmp/test-resolve-done-window.py /

      # ------------------------------------------------------------------------
      # The environment Resolve runs in is really inside the NVIDIA image
      # ------------------------------------------------------------------------
      # ⚠️ ADDED 2026-09-16, AND IT IS A CHECK ABOUT A FILE NOBODY WOULD MISS.
      # Step 63 of the build fetches the Rocky runtime and puts it into the
      # NVIDIA image so that setting Resolve up takes about three minutes
      # instead of fifteen and works with no internet at all. If that file ever
      # silently stopped arriving, NOTHING WOULD LOOK WRONG: the image would
      # build, boot, and set Resolve up perfectly well — by downloading a
      # gigabyte, exactly as it used to. A feature quietly reverting to the
      # thing it replaced is the hardest kind of regression to notice, so it is
      # read back here, out of the finished image, one more time.
      #
      # It also checks the opposite on the AMD/Intel image, which is the half
      # somebody changing this is most likely to get wrong: system_files/ is one
      # tree copied into both editions, so "not in the base image" is something
      # a build step has to ENFORCE rather than something that is true by
      # accident. 330 MB of container for a machine Blackmagic do not support is
      # exactly the kind of thing that creeps in and stays.
      #
      # ⚠️ THE ICON IS A DIFFERENT QUESTION FROM THE ARCHIVE, AND THE TWO WERE
      # CONFLATED UNTIL 2026-09-17. The DaVinci Resolve entry and its dock pin
      # are on BOTH editions — Royce's call: Resolve installs and runs on AMD,
      # it is the GPU processing Blackmagic do not support, and the setup window
      # says so on its first page before anybody commits. So this step now
      # checks the entry on both and the archive on one.
      - name: Check the environment Resolve runs in is in the NVIDIA image, and only there
        run: |
          set -uo pipefail
          fails=0
          ARCHIVE=/usr/share/aquarius/resolve/runtime.oci
          BAKED=/usr/share/aquarius/resolve/runtime-baked.env
          ENTRY=/usr/share/applications/aquarius-davinci-resolve.desktop

          # One run, reading the finished image the way a booted machine would.
          # `--pull=never` guarantees this is the thing that was just built.
          if ! podman run --rm --pull=never \
            -e EXPECTED_NVIDIA="${NVIDIA}" \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" -c '
              set -uo pipefail
              rc=0
              ARCHIVE=/usr/share/aquarius/resolve/runtime.oci
              BAKED=/usr/share/aquarius/resolve/runtime-baked.env
              ENTRY=/usr/share/applications/aquarius-davinci-resolve.desktop
              UNIT=/usr/lib/systemd/user/aquarius-resolve-prepare.service
              LINK=/usr/lib/systemd/user/graphical-session.target.wants/aquarius-resolve-prepare.service

              if [ "${EXPECTED_NVIDIA}" = "1" ]; then
                if [ -s "${ARCHIVE}" ]; then
                  MB=$(( $(stat -c %s "${ARCHIVE}") / 1024 / 1024 ))
                  echo "  OK   the environment is in this image (${MB} MB)"
                  # A floor and a ceiling, for the same reasons as in step 63: a
                  # truncated copy, and somebody accidentally baking a container
                  # with a video editor in it — which we may not distribute.
                  if [ "${MB}" -lt 100 ] || [ "${MB}" -gt 900 ]; then
                    echo "  FAIL ${MB} MB is not a plausible size for it — it has been ~330 MB"
                    rc=1
                  fi
                else
                  echo "  FAIL ${ARCHIVE} is missing — setting Resolve up would silently go back to a gigabyte download"
                  rc=1
                fi

                # The digest, which is what lets a machine say what it is really
                # running. Written by the build, never by hand.
                if grep -qE "^AQ_RESOLVE_BAKED_DIGEST=sha256:[0-9a-f]{64}$" "${BAKED}" 2>/dev/null; then
                  echo "  OK   and the image records which environment it is, by digest"
                  sed -n "s/^/       /p" "${BAKED}" | grep -v "^       #" | grep -v "^       $"
                else
                  echo "  FAIL ${BAKED} does not name the environment by digest"
                  rc=1
                fi

                # The first login builds it, without anybody waiting.
                if [ -e "${LINK}" ]; then
                  echo "  OK   the first login prepares the environment (switched on from /usr)"
                else
                  echo "  FAIL ${LINK} is missing — the environment would only ever be built while somebody waited"
                  rc=1
                fi
                if grep -q "^ExecStart=-/usr/libexec/aquarius-resolve-install --prepare$" "${UNIT}" 2>/dev/null; then
                  echo "  OK   and a failure there costs the person nothing"
                else
                  echo "  FAIL ${UNIT} does not run the preparation, or would fail loudly"
                  rc=1
                fi
              else
                if [ -e "${ARCHIVE}" ]; then
                  echo "  FAIL ${ARCHIVE} is in the AMD/Intel image — ~330 MB for graphics Blackmagic do not support"
                  rc=1
                else
                  echo "  OK   the AMD/Intel image carries no environment, as it must not"
                fi
              fi

              # ------------------------------------------------------------
              # ON BOTH EDITIONS: the icon, the pin, and whose artwork it is
              # ------------------------------------------------------------
              # ⚠️ 2026-09-17. DaVinci Resolve is in the app grid and on the
              # dock of every AquariusOS, not only the NVIDIA one. On an AMD or
              # Intel machine clicking it downloads the environment and takes
              # about fifteen minutes, and the setup window shows Blackmagic s
              # graphics position on its first page before anybody commits.
              if grep -q "^Icon=aquarius-install-resolve$" "${ENTRY}" 2>/dev/null; then
                echo "  OK   DaVinci Resolve is in the app grid, wearing the AquariusOS mark"
              else
                echo "  FAIL ${ENTRY} is missing or does not wear our own icon"
                rc=1
              fi
              if grep -q "aquarius-davinci-resolve.desktop" \
                /usr/share/glib-2.0/schemas/zz1-aquarius-20-shell.gschema.override 2>/dev/null; then
                echo "  OK   and it is pinned to the dock"
              else
                echo "  FAIL DaVinci Resolve is no longer pinned to the dock"
                rc=1
              fi
              # One icon, not two: Install DaVinci Resolve is folded into it.
              if grep -q "^NoDisplay=true$" /usr/share/applications/aquarius-install-resolve.desktop 2>/dev/null; then
                echo "  OK   Install DaVinci Resolve is folded into it, so there is one icon and not two"
              else
                echo "  FAIL there would be two DaVinci Resolve icons in the app grid"
                rc=1
              fi
              # The program behind the icon answers on a machine with no Resolve.
              OPENS="$(/usr/libexec/aquarius-resolve-open --report 2>&1 || true)"
              case "${OPENS}" in
                "not-installed"*) echo "  OK   clicking it would open the setup window: ${OPENS}" ;;
                *) echo "  FAIL aquarius-resolve-open did not answer sensibly: ${OPENS}" ; rc=1 ;;
              esac
              # ⚠️ AND NOTHING OF BLACKMAGIC S IS SHIPPED AS ARTWORK. Their mark
              # may appear only once their software really is installed, which
              # happens on the person s own machine and never here.
              if [ -n "$(find /usr/share/icons /usr/share/pixmaps -iname "*blackmagic*" -o -iname "*davinci*" 2>/dev/null)" ]; then
                echo "  FAIL there is Blackmagic artwork in this image, which we may not distribute"
                rc=1
              else
                echo "  OK   no Blackmagic artwork anywhere in the image"
              fi
              exit "${rc}"
            '; then
            fails=1
          fi

          if [ "${fails}" -ne 0 ]; then
            echo "::error::the environment DaVinci Resolve runs in is not where it should be in this image. See build_files/63-resolve-runtime-bake.sh."
            exit 1
          fi

      # The arithmetic behind "only promise steps that are going to happen",
      # against the copy of the setup script in the finished image, with stand-in
      # podman and distrobox programs — no container, no graphics card, no
      # download, and nothing on the runner touched.
      - name: Check the Resolve setup only promises steps it will do
        run: |
          set -euo pipefail
          podman run --rm --pull=never \
            -v "${GITHUB_WORKSPACE}/tests/test-resolve-step-count.sh:/tmp/test-resolve-step-count.sh:ro" \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
            /tmp/test-resolve-step-count.sh /usr/libexec/aquarius-resolve-install

      - name: Check Resolve display controls and window memory in the finished image
        run: |
          set -euo pipefail
          podman run --rm --pull=never \
            --cap-add=SYS_NICE \
            -v "${GITHUB_WORKSPACE}/tests/test-installer-window.py:/tmp/test-installer-window.py:ro" \
            -v "${GITHUB_WORKSPACE}/tests/aquarius_headless.py:/tmp/aquarius_headless.py:ro" \
            -v "${GITHUB_WORKSPACE}/tests/test-resolve-settings.py:/tmp/test-resolve-settings.py:ro" \
            --entrypoint /usr/bin/python3 \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" /tmp/test-resolve-settings.py /
          podman run --rm --pull=never \
            --cap-add=SYS_NICE \
            -v "${GITHUB_WORKSPACE}/tests/test-resolve-window.py:/tmp/test-resolve-window.py:ro" \
            -v "${GITHUB_WORKSPACE}/tests/aquarius_headless.py:/tmp/aquarius_headless.py:ro" \
            --entrypoint /usr/bin/python3 \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" /tmp/test-resolve-window.py /

      - name: Check Resolve scale choices in the finished image
        run: |
          set -euo pipefail
          podman run --rm --pull=never \
            -v "${GITHUB_WORKSPACE}/tests/test-resolve-scale.py:/tmp/test-resolve-scale.py:ro" \
            --entrypoint /usr/bin/python3 \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" /tmp/test-resolve-scale.py /

      - name: Check Resolve defaults for fresh accounts in the finished image
        run: |
          set -euo pipefail
          podman run --rm --pull=never \
            -v "${GITHUB_WORKSPACE}/tests/test-resolve-fresh-defaults.py:/tmp/test-resolve-fresh-defaults.py:ro" \
            --entrypoint /usr/bin/python3 \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" /tmp/test-resolve-fresh-defaults.py /

      - name: Check Resolve menu launch isolation in the finished image
        run: |
          set -euo pipefail
          podman run --rm --pull=never \
            -v "${GITHUB_WORKSPACE}/tests/test-resolve-menu-launch.py:/tmp/test-resolve-menu-launch.py:ro" \
            --entrypoint /usr/bin/python3 \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" /tmp/test-resolve-menu-launch.py /

      # And the window's own rehearsal, inside the image: it really unpacks a
      # real archive into a throwaway home folder, really refuses a payload that
      # wants the operating system, really writes a menu entry, really reads it
      # back and really removes it. The build step ran this too; running it
      # again here proves the SHIPPED program still does it, which a build step
      # cannot (it runs before the image is packaged).
      - name: Check Aquarius Installer rehearses every route in the finished image
        run: |
          set -euo pipefail
          podman run --rm --pull=never \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" -c '
              set -e
              /usr/libexec/aquarius-installer --dry-run
            '
      - name: Check the boot screen says AquariusOS
        run: |
          set -euo pipefail
          # Three fingerprints taken from the repository and handed to the
          # checks that run INSIDE the finished image. Same trick as the
          # About-page step above: the only way to know OUR files went in is to
          # compare the bytes.
          #
          # The hold is the one picture worth checksumming on its own. It is what
          # a person actually looks at for the several seconds between the
          # animation finishing and the login screen appearing, so it is the
          # frame most worth being certain about.
          HOLD_SUM="$(sha256sum system_files/usr/share/plymouth/themes/aquarius/hold.png | awk '{print $1}')"
          SCRIPT_SUM="$(sha256sum system_files/usr/share/plymouth/themes/aquarius/aquarius.script | awk '{print $1}')"
          THEME_DIR_REPO=system_files/usr/share/plymouth/themes/aquarius
          REPO_BOOT="$(find "${THEME_DIR_REPO}" -name 'boot-*.png' | wc -l | tr -d ' ')"
          REPO_WIND="$(find "${THEME_DIR_REPO}" -name 'shutdown-*.png' | wc -l | tr -d ' ')"
          echo "In the repository: ${REPO_BOOT} pour frames, ${REPO_WIND} wind frames"
          echo "                   hold ${HOLD_SUM}"
          echo "                   script ${SCRIPT_SUM}"

          cat > /tmp/verify-boot.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }
          check() {   # check "<description>" "<pattern>" "<file>"
            if [ ! -r "$3" ]; then bad "$1 — $3 does not exist"; return; fi
            if grep -Eq "$2" "$3"; then ok "$1"; else bad "$1 — /$2/ not found in $3"; fi
          }

          THEME=/usr/share/plymouth/themes/aquarius

          echo "== the boot screen's program and its parts =="
          # ⚠️ plymouth-plugin-script is the one that matters now. It is what
          # PLAYS the animation; without it the boot screen is black. The theme
          # moved to it on 2026-09-06 — see the long note in the theme file.
          for pkg in plymouth plymouth-plugin-script plymouth-plugin-two-step \
                     plymouth-plugin-label plymouth-theme-spinner \
                     plymouth-system-theme dracut; do
            if rpm -q "${pkg}" > /dev/null 2>&1; then ok "${pkg} $(rpm -q --queryformat '%{VERSION}-%{RELEASE}' "${pkg}")"
            else bad "${pkg} is NOT installed"; fi
          done

          echo "== the Aquarius theme on disk =="
          ls -l "${THEME}" || true

          BOOT="$(find "${THEME}" -name 'boot-*.png' | wc -l)"
          WIND="$(find "${THEME}" -name 'shutdown-*.png' | wc -l)"
          echo "frames in the image: ${BOOT} of the pour, ${WIND} of the wind"
          if [ "${BOOT}" -eq "${WANT_BOOT}" ]; then ok "all ${WANT_BOOT} frames of the pour are installed"
          else bad "${BOOT} pour frames in the image, expected ${WANT_BOOT}"; fi
          if [ "${WIND}" -eq "${WANT_WIND}" ]; then ok "all ${WANT_WIND} frames of the wind are installed"
          else bad "${WIND} wind frames in the image, expected ${WANT_WIND}"; fi

          got="$(sha256sum "${THEME}/hold.png" 2>/dev/null | awk '{print $1}')"
          echo "hold.png in the image: ${got:-<missing>}"
          if [ "${got}" = "${WANT_HOLD}" ]; then ok "the picture left on screen after the pour is ours"
          else bad "hold.png is NOT the one in the repository"; fi

          got="$(sha256sum "${THEME}/aquarius.script" 2>/dev/null | awk '{print $1}')"
          echo "aquarius.script in the image: ${got:-<missing>}"
          if [ "${got}" = "${WANT_SCRIPT}" ]; then ok "the program that plays the animation is ours"
          else bad "aquarius.script is NOT the one in the repository"; fi

          # The four small shapes the update and disk-password screens are built
          # from. box.png is the one that matters most: without it a machine with
          # an encrypted disk would appear to hang at a blank screen.
          for f in box.png bullet.png bar-track.png bar-fill.png; do
            if [ -s "${THEME}/${f}" ]; then ok "${f} is installed"
            else bad "${THEME}/${f} is missing"; fi
          done

          # And nothing from the boot screen this replaced. It would not be
          # drawn, but it would be carried into the boot ramdisk.
          if ls "${THEME}"/throbber-*.png "${THEME}"/watermark.png > /dev/null 2>&1; then
            bad "pictures from the old two-step boot screen are still in the theme folder"
            ls -1 "${THEME}"/throbber-*.png "${THEME}"/watermark.png 2>/dev/null || true
          else
            ok "none of the old boot screen's pictures are left in the theme folder"
          fi

          echo "== the theme's own settings =="
          cat "${THEME}/aquarius.plymouth" | grep -vE '^[[:space:]]*(#|$)' || true
          check "the theme is played by the script plug-in" '^ModuleName=script$' \
                "${THEME}/aquarius.plymouth"
          check "it points at the script that is really installed" \
                "^ScriptFile=${THEME}/aquarius.script$" "${THEME}/aquarius.plymouth"
          check "it looks for its pictures where they really are" \
                "^ImageDir=${THEME}$" "${THEME}/aquarius.plymouth"

          # ⚠️ THE OLD PLUG-IN'S SETTINGS MUST ALL BE GONE. The script plug-in
          # ignores them, so leaving one behind would change nothing and mislead
          # forever — somebody reading the file would believe a setting that does
          # not do anything.
          if grep -qE '^(ModuleName=two-step|\[two-step\]|UseFirmwareBackground=|ProgressBar[A-Za-z]*=|Watermark[A-Za-z]*=|UseAnimation=)' \
               "${THEME}/aquarius.plymouth"; then
            bad "the theme still carries settings from the old two-step boot screen:"
            grep -nE '^(ModuleName=two-step|\[two-step\]|UseFirmwareBackground=|ProgressBar[A-Za-z]*=|Watermark[A-Za-z]*=|UseAnimation=)' \
              "${THEME}/aquarius.plymouth"
          else
            ok "no left-over settings from the old two-step boot screen"
          fi

          echo "== the script that draws it all =="
          # The colours the animation does NOT carry in a picture: the Midnight
          # ground the whole screen is painted with, written as the three parts
          # of #0B1220 (11, 18, 32).
          check "the ground is Midnight bg (#0B1220 = 11, 18, 32)" \
                '^BG_RED    = channel\(11\);   BG_GREEN    = channel\(18\);   BG_BLUE    = channel\(32\);$' \
                "${THEME}/aquarius.script"
          check "the script plays all 66 frames of the pour" '^BOOT_FRAMES  = 66;' \
                "${THEME}/aquarius.script"
          check "the script plays all 57 frames of the wind" '^WIND_FRAMES  = 57;' \
                "${THEME}/aquarius.script"
          # The two screens the old plug-in drew for us and this one does not.
          # If either of these ever disappears from the script, that screen is
          # simply gone and nobody finds out until it is needed.
          check "the script draws a disk-password box" 'Plymouth.SetDisplayPasswordFunction' \
                "${THEME}/aquarius.script"
          check "the script draws the 'installing updates' screen" 'Plymouth.SetSystemUpdateFunction' \
                "${THEME}/aquarius.script"
          check "and the words on it are still the reviewed ones" \
                'Please do not turn the computer off\.' "${THEME}/aquarius.script"

          # The retired palette really is gone from the script, rather than just
          # absent from the lines above. Comment lines are skipped: the file's own
          # notes name the old colours to explain what replaced them.
          if grep -vE '^[[:space:]]*#' "${THEME}/aquarius.script" \
               | grep -Eqi '(8AB4FF|5B4BE0|E6DDB8|06070C)'; then
            bad "the boot script still names a retired Starlight colour"
            grep -nEi '(8AB4FF|5B4BE0|E6DDB8|06070C)' "${THEME}/aquarius.script" \
              | grep -vE ':[[:space:]]*#'
          else
            ok "no retired Starlight colour in the boot script"
          fi

          # ------------------------------------------------------------------
          # ⚠️ EVERY PLYMOUTH INSTRUCTION THE SCRIPT USES REALLY EXISTS HERE
          # ------------------------------------------------------------------
          # The script talks to Plymouth by name. Those names have changed
          # between Plymouth releases, and a name that does not exist FAILS
          # SILENTLY: the theme loads, the screen appears, and that one thing
          # never happens. Nothing is printed anywhere.
          #
          # So the names are read out of the plug-in's own compiled file — they
          # are stored in it as plain text, because that is how it registers
          # them — with `grep -a` rather than `strings`, because `strings` comes
          # from binutils and a check that quietly does not run is worse than no
          # check at all.
          SCRIPT_SO="$(rpm -ql plymouth-plugin-script 2>/dev/null | grep -E '/script\.so$' | head -n1 || true)"
          echo "the script plug-in itself: ${SCRIPT_SO:-<not found>}"
          if [ -r "${SCRIPT_SO}" ]; then
            grep -vE '^[[:space:]]*#' "${THEME}/aquarius.script" \
              | grep -oE 'Plymouth\.[A-Za-z]+' | sed 's/^Plymouth\.//' | sort -u > /tmp/uses.txt
            USES="$(wc -l < /tmp/uses.txt | tr -d ' ')"
            echo "the script uses ${USES} Plymouth instructions:"; sed 's/^/  /' /tmp/uses.txt
            if [ "${USES}" -lt 5 ]; then
              bad "only ${USES} instructions found — too few to be true, so the search is broken"
            else
              unknown=0
              while IFS= read -r name; do
                if grep -a -q "${name}" "${SCRIPT_SO}"; then ok "Plymouth.${name} exists in this Plymouth"
                else bad "Plymouth.${name} does NOT exist in this Plymouth — it would do nothing, silently"; unknown=1; fi
              done < /tmp/uses.txt
              [ "${unknown}" -eq 0 ] && ok "all ${USES} instructions the boot animation uses are real"
            fi
          else
            bad "the script plug-in's own file could not be found, so the instruction names could not be checked"
          fi

          echo "== which splash this machine is set to =="
          echo "--- /etc/plymouth/plymouthd.conf ---"; cat /etc/plymouth/plymouthd.conf 2>/dev/null || echo "(missing)"
          echo "--- /usr/share/plymouth/plymouthd.defaults ---"; cat /usr/share/plymouth/plymouthd.defaults 2>/dev/null || echo "(missing)"
          echo "---"
          check "this machine's splash is aquarius" '^Theme=aquarius$' /etc/plymouth/plymouthd.conf

          echo "== kernel options =="
          for f in /usr/lib/bootc/kargs.d/*.toml; do echo "--- ${f} ---"; cat "${f}"; done
          # The exact line 80-boot-branding.sh writes: quiet + splash + rhgb, and
          # since 2026-09-09 no blinking console cursor either (Royce's Mac-like
          # boot directive). Change both places together.
          check "the boot options ask for a splash and no console cursor" \
                'kargs = \["quiet", "splash", "rhgb", "vt.global_cursor_default=0"\]' \
                /usr/lib/bootc/kargs.d/05-aquarius-boot.toml

          echo "== the boot menu =="
          # On an image-based system the boot-menu entry text is generated from
          # PRETTY_NAME, not from /etc/default/grub. Both are checked: the first
          # is what actually decides, the second is what a person goes looking
          # for and what a non-image boot path would use.
          check "PRETTY_NAME is what the menu entries are named from" \
                '^PRETTY_NAME="AquariusOS"$' /etc/os-release
          check "GRUB_DISTRIBUTOR is AquariusOS" \
                '^GRUB_DISTRIBUTOR="AquariusOS"$' /etc/default/grub
          # Evidence, for the log, that the tooling which writes the boot-menu
          # entries really does read PRETTY_NAME to title them. Same technique
          # as the About-page step above: look for the string inside the
          # compiled program.
          echo "Which programs name PRETTY_NAME internally:"
          for b in /usr/bin/ostree /usr/bin/bootc /usr/bin/bootupctl; do
            [ -e "${b}" ] || continue
            if grep -a -q 'PRETTY_NAME' "${b}"; then
              echo "  ${b} reads PRETTY_NAME"
            else
              echo "  ${b} does not name PRETTY_NAME directly (it may go through a library)"
            fi
          done

          echo "== the text banners =="
          for f in /etc/issue /etc/issue.net /etc/fedora-release /etc/system-release /etc/redhat-release; do
            echo "--- ${f} ---"; cat "${f}" 2>/dev/null || echo "(missing)"
          done
          echo "--- /etc/motd (should be empty) ---"; cat /etc/motd 2>/dev/null || echo "(missing)"
          echo "---"
          check "the console banner says AquariusOS" '^AquariusOS$' /etc/issue
          check "the network banner says AquariusOS" '^AquariusOS$' /etc/issue.net
          check "the old-style release line is ours" '^AquariusOS release ' /etc/fedora-release
          if [ -f /etc/motd ] && [ ! -s /etc/motd ]; then ok "/etc/motd is empty (deliberate)"
          elif [ ! -e /etc/motd ]; then ok "/etc/motd does not exist (fine)"
          else bad "/etc/motd has content — it would print on every ssh login: $(cat /etc/motd)"; fi

          echo "== neither Fedora welcome screen is installed =="
          for pkg in gnome-tour gnome-initial-setup; do
            if rpm -q "${pkg}" > /dev/null 2>&1; then bad "${pkg} is installed — it shows a 'Welcome to Fedora' screen"
            else ok "${pkg} is not installed"; fi
          done

          # ---------------------------------------------------------------
          # THE CHECK THAT MATTERS: open the boot ramdisk and read it.
          # ---------------------------------------------------------------
          echo "== inside the boot ramdisk =="
          KVER="$(rpm -q --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}' kernel-core)"
          IMG="/usr/lib/modules/${KVER}/initramfs.img"
          echo "kernel  : ${KVER}"
          echo "ramdisk : ${IMG}"
          if [ ! -s "${IMG}" ]; then
            bad "${IMG} is missing or empty — this image has no boot ramdisk at all"
          else
            ok "the ramdisk exists ($(stat -c '%s' "${IMG}") bytes, mode $(stat -c '%a' "${IMG}"))"

            # `lsinitrd -m` prints a header and the early-CPIO file listing
            # before the module names, so everything after the line
            # "dracut modules:" is the real list.
            echo "-- the parts it was built from --"
            lsinitrd -m "${IMG}" > /tmp/lsinitrd-raw.txt 2>/dev/null || true
            awk '/^dracut modules:/ { seen = 1; next } seen' /tmp/lsinitrd-raw.txt \
              | tr -d '[:blank:]' | grep -E '^[a-z0-9][a-z0-9._-]*$' | sort -u > /tmp/initrd-mods.txt || true
            tr '\n' ' ' < /tmp/initrd-mods.txt; echo
            for part in plymouth ostree bootc; do
              if grep -qx "${part}" /tmp/initrd-mods.txt; then ok "the ramdisk contains the '${part}' part"
              else bad "the ramdisk has no '${part}' part"; fi
            done

            echo "-- everything Plymouth-related inside it --"
            lsinitrd "${IMG}" 2>/dev/null | grep -i plymouth > /tmp/initrd-ply.txt || true
            cat /tmp/initrd-ply.txt || true
            echo "--"

            # These three lines are the evidence that the splash is really in the
            # ramdisk and not just on disk.
            # Each of these is a different way for the boot animation to be
            # broken on a real machine while every file on disk looks perfect.
            for want in 'plymouth/themes/aquarius/aquarius.plymouth' \
                        'plymouth/themes/aquarius/aquarius.script' \
                        'plymouth/themes/aquarius/boot-0001.png' \
                        'plymouth/themes/aquarius/hold.png' \
                        'plymouth/themes/aquarius/shutdown-0001.png' \
                        'plymouth/themes/aquarius/box.png'; do
              if grep -q "${want}" /tmp/initrd-ply.txt; then
                ok "in the ramdisk: $(grep -m1 "${want}" /tmp/initrd-ply.txt | awk '{print $NF}')"
              else
                bad "${want} is NOT inside the ramdisk"
              fi
            done

            # ⚠️ AND THE PLUG-IN THAT PLAYS THEM. Easiest of all to miss: every
            # picture could be in the ramdisk and the boot screen would still be
            # black, because nothing in there would know how to play them.
            if grep -qE 'plymouth/(plugins/)?script\.so' /tmp/initrd-ply.txt; then
              ok "in the ramdisk: the script plug-in that plays the animation"
            else
              bad "script.so is NOT inside the ramdisk — the boot screen would be black"
            fi

            # The old boot screen's pictures must not still be riding along in
            # the largest file in the image.
            for gone in 'plymouth/themes/aquarius/watermark.png' \
                        'plymouth/themes/aquarius/throbber-0001.png'; do
              if grep -q "${gone}" /tmp/initrd-ply.txt; then
                bad "${gone} from the old boot screen is still inside the ramdisk"
              fi
            done

            # The three faces the boot screen sets its words in. They are asked
            # for with dracut's `install_optional_items`, which cannot fail — so
            # this is the only thing standing between a missing font and a boot
            # screen whose headings are quietly set in something else.
            echo "-- the AquariusOS fonts inside the ramdisk --"
            lsinitrd "${IMG}" 2>/dev/null | grep -iE 'fonts/(sora|rsms-inter|jetbrains)' \
              > /tmp/initrd-fonts.txt || true
            cat /tmp/initrd-fonts.txt || true
            for face in sora-fonts rsms-inter-fonts jetbrains-mono-fonts; do
              if grep -q "fonts/${face}/" /tmp/initrd-fonts.txt; then
                ok "in the ramdisk: ${face}"
              else
                bad "${face} is NOT inside the ramdisk — the boot screen's words would"
                bad "fall back to another face, silently"
              fi
            done

            # And that the setting inside the ramdisk names our theme rather than
            # one of Fedora's. This is the "no spinner, no bgrt as the default"
            # check — the file is what decides, not which folders happen to be
            # present.
            : > /tmp/initrd-conf.txt
            found=0
            for c in /etc/plymouth/plymouthd.conf /usr/share/plymouth/plymouthd.defaults; do
              # Paths inside a ramdisk are stored with no leading slash; ask both ways.
              if { lsinitrd -f "${c}" "${IMG}" > /tmp/one-conf.txt 2>/dev/null \
                   || lsinitrd -f "${c#/}" "${IMG}" > /tmp/one-conf.txt 2>/dev/null; } && [ -s /tmp/one-conf.txt ]; then
                found=1
                echo "-- ${c}, inside the ramdisk --"; cat /tmp/one-conf.txt
                cat /tmp/one-conf.txt >> /tmp/initrd-conf.txt
              fi
            done
            if [ "${found}" -eq 0 ]; then
              bad "the ramdisk carries no splash setting — it would fall back to Fedora's bgrt"
            elif grep -q '^Theme=aquarius$' /tmp/initrd-conf.txt; then
              ok "the setting inside the ramdisk says Theme=aquarius (so not spinner, not bgrt)"
            else
              bad "the setting inside the ramdisk does not say Theme=aquarius:"
              cat /tmp/initrd-conf.txt
            fi
            if grep -qE '^Theme=(bgrt|spinner|charge)$' /tmp/initrd-conf.txt; then
              bad "a Fedora theme is named as the default inside the ramdisk"
            fi
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The boot path is not correctly branded in this image."
            exit 1
          fi
          echo "All boot-path checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            -e WANT_HOLD="${HOLD_SUM}" \
            -e WANT_SCRIPT="${SCRIPT_SUM}" \
            -e WANT_BOOT="${REPO_BOOT}" \
            -e WANT_WIND="${REPO_WIND}" \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-boot.sh

      # ------------------------------------------------------------------------
      # THE BOOT BANNER HAS NOTHING TO COMPLAIN ABOUT
      # ------------------------------------------------------------------------
      # Every boot, under the AquariusOS banner the step above just checked, the
      # console printed:
      #
      #     Failed Units: 1
      #       systemd-remount-fs.service
      #
      # Nothing was wrong. That service re-mounts `/` to match /etc/fstab, and on
      # this operating system `/` is an overlay assembled in the boot ramdisk
      # that the kernel refuses to re-mount. It asks a question this kind of
      # machine has no answer to and reports failure for it, forever — which
      # trains a person to ignore the one line that would matter if something
      # ever really did break.
      #
      # The image ships a drop-in that skips the service on an image-mode boot.
      # This reads it back OUT OF THE FINISHED IMAGE, which is the point: the
      # build script's own check runs mid-build, and something later in the
      # build could still overwrite the file. This is the last word.
      #
      # ⚠️ WHAT THIS CANNOT PROVE, AND SAYS SO. The condition turns on a marker
      # file, /run/ostree-booted, that only exists on a real booted machine.
      # A container cannot demonstrate the skip actually happening. This checks
      # that the instruction is present, correctly spelled, and attached to a
      # unit that exists. The real proof is the bench console after a reboot —
      # docs/restart/bench-rebase.md says what to look for.
      - name: Check the boot banner has nothing to complain about
        run: |
          set -euo pipefail
          cat > /tmp/verify-remount.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          DROPIN=/usr/lib/systemd/system/systemd-remount-fs.service.d/10-aquarius-ostree.conf
          UNIT=/usr/lib/systemd/system/systemd-remount-fs.service

          echo "== the drop-in is in the finished image =="
          if [ -f "${DROPIN}" ]; then
            ok "${DROPIN} is present"
            echo "     what it actually says:"
            sed 's/^/       /' "${DROPIN}" | grep -v '^ *#' | grep -v '^ *$' || true
          else
            bad "${DROPIN} is missing — the console would say 'Failed Units: 1' on every boot"
          fi

          echo "== it says the one thing it has to say =="
          # Contents, never timestamps. An exact-line match: a near miss here
          # (ConditionPathExist, a lost '!', a stray space) is a line systemd
          # silently ignores, and the symptom is identical to no file at all.
          if grep -qx 'ConditionPathExists=!/run/ostree-booted' "${DROPIN}" 2>/dev/null; then
            ok "ConditionPathExists=!/run/ostree-booted is there, exactly"
          else
            bad "the condition line is missing or misspelled — systemd would skip the"
            bad "line, run the service anyway, and the banner would come back"
          fi

          echo "== it is under a [Unit] heading =="
          # A setting outside its section is read as belonging to whatever came
          # before it, and ConditionPathExists= only means anything under [Unit].
          if awk '/^\[Unit\]/{u=1;next} /^\[/{u=0} u && /^ConditionPathExists=!\/run\/ostree-booted$/{found=1} END{exit !found}' "${DROPIN}" 2>/dev/null; then
            ok "the condition sits under [Unit], where it counts"
          else
            bad "the condition is not under a [Unit] heading — systemd would ignore it"
          fi

          echo "== the unit it attaches to exists =="
          # systemd matches drop-ins to units by the folder name. Rename the
          # unit upstream, or mistype the folder, and this file is never read —
          # with no error anywhere.
          if [ -f "${UNIT}" ]; then
            ok "systemd-remount-fs.service exists, so the drop-in folder name is right"
          else
            bad "systemd-remount-fs.service is not in this image — the drop-in folder"
            bad "name no longer matches any unit, so the file does nothing"
          fi

          echo "== systemd itself can read the result =="
          # Advisory: inside a container systemd-analyze frequently cannot start
          # a manager at all. If that happens it never reads the file, prints no
          # complaint, and a check that only looks for complaints reports a
          # confident OK over a tool that did nothing. So say which happened.
          #
          # ⚠️ AND CHECK THE TOOL IS EVEN THERE FIRST. Without this, a missing
          # systemd-analyze produces an empty answer, matches none of the
          # patterns below, and falls into the final `else` — printing "systemd
          # read the unit and understood every line" about a tool that was never
          # run. That is the unearned green tick this repo has a rule against.
          if ! command -v systemd-analyze > /dev/null 2>&1; then
            echo "  NOTE systemd-analyze is not in this image, so nothing was verified"
            echo "       here. The checks above are what guard this."
          else
            v="$(systemd-analyze verify systemd-remount-fs.service 2>&1 || true)"
            printf '%s\n' "${v}" | sed 's/^/     /'
            if printf '%s' "${v}" | grep -Eqi "failed to initialize manager|failed to lookup runtimedirectory"; then
              echo "  NOTE systemd-analyze could not start in this container, so it did not"
              echo "       read the file. The checks above are what guard this."
            elif printf '%s' "${v}" | grep -Eqi "unknown (key|lvalue)|failed to parse"; then
              bad "systemd cannot understand part of the unit with our drop-in applied"
            else
              ok "systemd read the unit with our drop-in and understood every line"
            fi
          fi

          echo "== and the service is NOT masked =="
          # Masking would also silence the banner, and would be the wrong fix: it
          # kills the service on every machine including ones where it has a real
          # job. If somebody 'fixes' this again by masking, say so.
          if [ -L "${UNIT}" ] && [ "$(readlink "${UNIT}")" = "/dev/null" ]; then
            bad "systemd-remount-fs.service is masked. That is not the fix we chose —"
            bad "see the drop-in's own header for why the condition is used instead."
          else
            ok "the service is left intact and merely skipped on an image-mode boot"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The systemd-remount-fs drop-in is wrong or missing. Machines booting this image would print 'Failed Units: 1' on every boot. See docs/restart/bench-rebase.md."
            exit 1
          fi
          echo "All boot-banner checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-remount.sh

      # ------------------------------------------------------------------------
      # BOTH DESKTOPS, IN THE FINISHED IMAGE
      # ------------------------------------------------------------------------
      # ⚠️ WHAT THIS STEP USED TO BE. Until 15 September 2026 this was "Check
      # the Aquarius Desktop is really in there": eight hundred lines that ran
      # labwc and Quickshell inside the finished image and read what they said,
      # because two of the three parts of our own desktop were COMPILED during
      # the build and a compiled part that goes wrong does not announce itself.
      # `qs --version` in particular was the exact thing that failed on the
      # bench on 2026-09-02 and left an empty desktop.
      #
      # Royce retired that desktop (../docs/decision-2026-09-15-two-desktops.md).
      # Nothing is compiled any more: GNOME and KDE Plasma are Fedora packages,
      # read back by name in steps 4 and 4b of the build itself. So what is left
      # to prove HERE, on the finished image, is the small set of facts those
      # two steps cannot see from inside themselves — chiefly that the login
      # screen really ends up offering both, and that neither desktop has
      # smuggled in a second login screen or a second app store.
      - name: Check both desktops are really in there
        run: |
          set -euo pipefail
          cat > /tmp/verify-desktops.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          echo "== the login screen offers both desktops =="
          # This is the whole feature in one check. GDM builds its session list
          # from this folder and nothing else; a missing file here is a login
          # screen that looks completely normal and silently has one desktop.
          ls -l /usr/share/wayland-sessions/ || true
          for s in gnome plasma; do
            f="/usr/share/wayland-sessions/${s}.desktop"
            if [ -r "${f}" ]; then
              ok "${s}.desktop — $(sed -n 's/^Name=//p' "${f}" | head -n 1)"
              # A session file names the command that starts it. If that command
              # is not in the image, the entry is in the menu and picking it
              # drops you straight back to the login screen with no message.
              exec_line="$(sed -n 's/^Exec=//p' "${f}" | head -n 1)"
              prog="${exec_line%% *}"
              case "${prog}" in
                /*) [ -x "${prog}" ] && ok "  and ${prog} is runnable" || bad "  but ${prog} is not runnable" ;;
                *)  command -v "${prog}" > /dev/null 2>&1 \
                      && ok "  and ${prog} is on the path" \
                      || bad "  but ${prog} is not in this image" ;;
              esac
            else
              bad "${f} is missing — the login screen would not offer that desktop"
            fi
          done

          echo "== and it offers nothing that no longer exists =="
          # The retired Aquarius Session. A leftover file would be a third
          # choice that fails the moment somebody picks it.
          if [ -e /usr/share/wayland-sessions/aquarius.desktop ]; then
            bad "the retired Aquarius Session is still offered at the login screen"
          else
            ok "the retired Aquarius Session is not offered"
          fi
          for gone in /usr/bin/labwc /usr/bin/qs /usr/bin/quickshell \
                      /usr/bin/aquarius-session /usr/share/aquarius/labwc \
                      /usr/share/aquarius/shell /usr/libexec/aquarius-greeter; do
            if [ -e "${gone}" ]; then
              bad "${gone} is still in the image — the shell removal is incomplete"
            else
              ok "${gone} is gone"
            fi
          done

          echo "== exactly one login screen, and it is GDM =="
          if systemctl is-enabled gdm.service > /dev/null 2>&1; then
            ok "GDM is switched on"
          else
            bad "GDM is NOT switched on — this machine would boot to a text prompt"
          fi
          for other in sddm greetd lightdm; do
            if rpm -q "${other}" > /dev/null 2>&1; then
              bad "${other} is installed. AquariusOS has one login screen; two fight over the display."
            else
              ok "${other} is not in the image"
            fi
          done
          echo "       default target: $(systemctl get-default 2>/dev/null || echo unknown)"

          echo "== one app store, not two =="
          # 65-installer.sh hides the older chooser so there is one visible
          # app-store icon. A KDE Discover would put a second one back.
          if rpm -qa 'plasma-discover*' | grep -q .; then
            bad "plasma-discover is installed — a second app store beside Aquarius Installer"
            rpm -qa 'plasma-discover*' | sed 's/^/       /'
          else
            ok "no Discover — Aquarius Installer is the app store"
          fi

          echo "== one welcome, not two =="
          if rpm -q plasma-welcome > /dev/null 2>&1; then
            bad "plasma-welcome is installed — two welcome windows at a first login"
          else
            ok "no plasma-welcome — the AquariusOS welcome is the only one"
          fi

          echo "== the two things that start a desktop =="
          for prog in gnome-shell startplasma-wayland kwin_wayland plasmashell mutter; do
            if command -v "${prog}" > /dev/null 2>&1; then
              ok "${prog}"
            else
              bad "${prog} is missing"
            fi
          done
          echo "       GNOME: $(gnome-shell --version 2>&1 | head -n 1)"
          echo "       Plasma: $(plasmashell --version 2>&1 | head -n 1)"

          echo "== a portal backend for each =="
          # Nothing chooses between them by hand any more: xdg-desktop-portal
          # reads XDG_CURRENT_DESKTOP and picks. Both have to BE there.
          for pkg in xdg-desktop-portal xdg-desktop-portal-gnome xdg-desktop-portal-gtk xdg-desktop-portal-kde; do
            rpm -q "${pkg}" > /dev/null 2>&1 && ok "${pkg}" || bad "${pkg} is missing"
          done
          # And OUR written rule must be gone, or it would override the shipped
          # ones and send Plasma to GNOME's file picker.
          if [ -e /usr/share/xdg-desktop-portal/aquarius-portals.conf ]; then
            bad "aquarius-portals.conf is still here — it would override each desktop's own portal rule"
          else
            ok "no hand-written portal rule of ours (each desktop uses its own)"
          fi

          echo "== a brand-new account is given a desktop to start in =="
          T=/usr/share/accountsservice/user-templates/standard
          if [ -r "${T}" ]; then
            sed 's/^/       /' "${T}"
            want="$(sed -n 's/^Session=//p' "${T}" | head -n 1)"
            if [ -n "${want}" ] && [ -r "/usr/share/wayland-sessions/${want}.desktop" ]; then
              ok "new accounts start in '${want}', and that session exists"
            else
              bad "the template names '${want:-nothing}', which is not a session in this image"
            fi
          else
            bad "${T} is missing — a brand-new account would be sent to whatever GDM guessed"
          fi

          echo "== GTK apps have something to follow on Plasma =="
          # Aquarius Installer, the Updater, the welcome and the chooser are all
          # GTK 4. On Plasma they need a theme and something to select it.
          for d in /usr/share/themes/Breeze /usr/share/themes/Breeze-Dark \
                   /usr/share/icons/breeze /usr/share/icons/breeze-dark; do
            [ -d "${d}" ] && ok "${d}" || bad "${d} is missing"
          done
          rpm -q kde-gtk-config > /dev/null 2>&1 \
            && ok "kde-gtk-config is here — something actually selects that theme" \
            || bad "kde-gtk-config is missing — the Breeze GTK theme would be on disk and never used"

          echo "== the Mac keys reach BOTH desktops =="
          # The bug shape this guards against: a key that works on the desktop
          # you tested and does nothing on the other one.
          if [ -r /etc/xdg/kglobalshortcutsrc ]; then
            ok "/etc/xdg/kglobalshortcutsrc is here"
            grep -E '^(Walk Through Windows=|Lock Session=|_launch=)' /etc/xdg/kglobalshortcutsrc | sed 's/^/       /'
            grep -q 'Meta+Tab' /etc/xdg/kglobalshortcutsrc \
              && ok "KDE: Command-Tab switches apps" \
              || bad "KDE: Command-Tab is not bound — it would do nothing on Plasma"
            grep -q 'Ctrl+Meta+Q' /etc/xdg/kglobalshortcutsrc \
              && ok "KDE: Control-Command-Q locks the screen" \
              || bad "KDE: Control-Command-Q is not bound"
          else
            bad "/etc/xdg/kglobalshortcutsrc is missing — Command-Tab would do nothing on Plasma"
          fi
          if command -v gsettings > /dev/null 2>&1; then
            lock="$(gsettings get org.gnome.settings-daemon.plugins.media-keys screensaver 2>/dev/null || echo '')"
            echo "       GNOME lock keys: ${lock}"
            case "${lock}" in
              *"<Control><Super>q"*) ok "GNOME: Control-Command-Q locks the screen" ;;
              *) bad "GNOME: Control-Command-Q is not a lock key — and Cmd+L is remapped, so Mac mode would have no reachable lock" ;;
            esac
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::Something is wrong with one of the two desktops. Scroll up for the FAIL lines. See docs/restart/desktops.md."
            exit 1
          fi
          echo "All two-desktop checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-desktops.sh


      # ------------------------------------------------------------------------
      # THE "NO STRAY NAMES" AUDIT
      # ------------------------------------------------------------------------
      # Royce's instruction was "anything that still says Bazzite should say
      # Aquarius". This step is what keeps that true next month, when somebody
      # adds a feature and copies a snippet from somewhere.
      #
      # It is two different rules, on purpose:
      #
      #   BAZZITE  must appear NOWHERE. Zero — not in a file name, not in an
      #            installed package, not in the text of any file this build
      #            writes to, comments included. This branch is built from bare
      #            Fedora and has no relationship to Bazzite, so any occurrence
      #            is a mistake by definition.
      #
      #            ⚠️ This rule is stricter than the Fedora one below, and that
      #            asymmetry is on purpose. When this check was first written it
      #            found five real hits, all of them historical notes in the
      #            comments of two GNOME settings files ("the old Bazzite line
      #            pinned all three", and so on). Those notes are genuinely
      #            useful and they were kept — but reworded to say "the line
      #            this replaced", because those files are installed onto every
      #            machine, and Royce's instruction was that a machine should
      #            not say Bazzite anywhere. The repository's own documentation,
      #            which does not ship, still tells the story by name.
      #
      #   FEDORA   must not appear in the places a PERSON reads a name. It is
      #            expected and correct in the places a PROGRAM reads one —
      #            AquariusOS really is Fedora underneath, and pretending
      #            otherwise breaks package installation and security scanning.
      #            The allowed places are listed, with a reason each, below.
      - name: Check nothing still says Bazzite or Fedora
        run: |
          set -euo pipefail
          cat > /tmp/verify-names.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          # A settings file's VALUES, without the plain-English notes around
          # them. Every config file in this project carries a long explanatory
          # header, and several of those headers legitimately explain what
          # Fedora does and why we differ. Explaining Fedora is not the same as
          # being branded Fedora, so the comments are not part of the audit.
          values_only() { grep -vE '^[[:space:]]*(#|;|$)' "$1" 2>/dev/null || true; }

          echo "=============================================================="
          echo " RULE 1 — the word Bazzite must not appear anywhere"
          echo "=============================================================="

          echo "-- as part of a file or folder name --"
          find / -xdev -iname '*bazzite*' > /tmp/bz-names.txt 2>/dev/null || true
          if [ -s /tmp/bz-names.txt ]; then
            bad "$(wc -l < /tmp/bz-names.txt) path(s) are named after Bazzite:"
            head -40 /tmp/bz-names.txt
          else
            ok "no file or folder anywhere on the image is named after Bazzite"
          fi

          echo "-- as an installed package --"
          if rpm -qa | grep -i bazzite > /tmp/bz-pkgs.txt; then
            bad "Bazzite packages are installed:"; cat /tmp/bz-pkgs.txt
          else
            ok "no installed package is a Bazzite one"
          fi

          # Inside text files. The excluded folders are translations, manuals and
          # timezone tables — many gigabytes of text that no AquariusOS build
          # writes into, and which would turn a two-minute check into a
          # twenty-minute one. Everything the build can actually touch is in.
          echo "-- inside text files --"
          # --exclude-dir=shell keeps the Aquarius Shell's own source out of
          # THIS grep. It gets its own, stricter check immediately below, for
          # the same reason config files are checked with their comments
          # stripped: the shell's QML carries long explanatory notes, and
          # several of them explain what Bazzite's Game Mode does and why the
          # shell refuses to reimplement it. Explaining Bazzite is not the same
          # as being branded Bazzite.
          grep -rIil bazzite --exclude-dir=shell \
            /etc /usr/bin /usr/sbin /usr/libexec /usr/lib/os-release /usr/lib/bootc \
            /usr/lib/systemd /usr/lib/dracut /usr/share/aquarius /usr/share/plymouth \
            /usr/share/glib-2.0/schemas /usr/share/gnome-background-properties \
            /usr/share/applications /usr/share/gnome-shell /usr/share/wayland-sessions \
            /usr/share/xsessions /usr/share/pixmaps /usr/share/backgrounds \
            > /tmp/bz-text.txt 2>/dev/null || true
          if [ -s /tmp/bz-text.txt ]; then
            bad "$(wc -l < /tmp/bz-text.txt) file(s) contain the word Bazzite:"
            head -40 /tmp/bz-text.txt
          else
            ok "no text file in any folder this build writes to mentions Bazzite"
          fi

          echo "-- inside the Aquarius Shell's own code (comments do not count) --"
          # The shell is QML. A line starting with // is a note to whoever reads
          # the file next, and the shell's notes discuss Bazzite at length
          # because the Game Mode tile exists to hand OFF to Bazzite's own
          # script rather than reimplement it. What must not appear is Bazzite
          # in the CODE — a path, a name, a string that a running program uses.
          #
          # So: strip the comments, then look.
          if [ -d /usr/share/aquarius/shell ]; then
            : > /tmp/bz-shell.txt
            while IFS= read -r f; do
              # Drop whole-line // comments and anything after // on a line.
              # Crude, and deliberately so: it can only ever over-report, and an
              # over-report is a person reading one line of QML.
              if sed 's|//.*$||' "${f}" | grep -qi bazzite; then
                echo "${f}" >> /tmp/bz-shell.txt
              fi
            done <<< "$(find /usr/share/aquarius/shell -type f -name '*.qml' -o -type f -name '*.js')"
            if [ -s /tmp/bz-shell.txt ]; then
              bad "the shell's CODE (not its notes) mentions Bazzite:"
              while IFS= read -r f; do
                echo "       ${f}"
                sed 's|//.*$||' "${f}" | grep -in bazzite | sed 's/^/         /'
              done < /tmp/bz-shell.txt
            else
              ok "the shell's code says nothing about Bazzite (only its notes do, which is fine)"
            fi
          else
            ok "there is no shell in this image to check (see the warning above)"
          fi

          echo
          echo "=============================================================="
          echo " RULE 2 — Fedora must not appear where a PERSON reads a name"
          echo "=============================================================="

          # nofedora <what it is> <file> [<grep pattern to narrow to some lines>]
          nofedora() {
            local what="$1" file="$2" narrow="${3:-}" body
            if [ ! -e "${file}" ]; then
              ok "${what}: ${file} does not exist in this image (nothing to say Fedora)"
              return
            fi
            body="$(values_only "${file}")"
            if [ -n "${narrow}" ]; then
              body="$(printf '%s\n' "${body}" | grep -E "${narrow}" || true)"
            fi
            if printf '%s\n' "${body}" | grep -qi fedora; then
              bad "${what} (${file}) still says Fedora:"
              printf '%s\n' "${body}" | grep -i fedora | sed 's/^/       /'
            else
              ok "${what} (${file})"
            fi
          }

          nofedora "the system's name, pretty name and edition" /etc/os-release '^(NAME|PRETTY_NAME|VARIANT)='
          nofedora "the same, in the image copy"                /usr/lib/os-release '^(NAME|PRETTY_NAME|VARIANT)='
          nofedora "the console login banner"                   /etc/issue
          nofedora "the network login banner"                    /etc/issue.net
          nofedora "the message of the day"                      /etc/motd
          nofedora "the old-style release line"                   /etc/fedora-release
          nofedora "the boot menu's distributor name"             /etc/default/grub '^GRUB_DISTRIBUTOR='
          nofedora "which splash this machine uses"               /etc/plymouth/plymouthd.conf '^Theme='
          nofedora "which splash the image falls back to"         /usr/share/plymouth/plymouthd.defaults '^Theme='
          nofedora "this machine's own name"                      /etc/hostname
          nofedora "the wallpaper list in Settings > Appearance"  /usr/share/gnome-background-properties/aquarius.xml

          echo "-- our GNOME defaults --"
          for f in /usr/share/glib-2.0/schemas/zz1-aquarius-*.gschema.override; do
            nofedora "an AquariusOS default" "${f}"
          done

          # The theme folder the machine actually boots with. Text files only
          # (`-I`) — the animation's frames are pictures and have no words in
          # them to read. The two text files are the theme file and the script
          # that plays the animation, and both of them TALK about Fedora at
          # length in their notes, which is allowed; what must not say Fedora is
          # a setting.
          echo "-- the active boot screen's theme --"
          grep -rIl -i fedora /usr/share/plymouth/themes/aquarius > /tmp/fed-theme.txt 2>/dev/null || true
          if [ -s /tmp/fed-theme.txt ]; then
            # ... except our own explanatory notes, which are allowed to discuss
            # Fedora. Check the settings themselves.
            still=0
            while read -r f; do
              if values_only "${f}" | grep -qi fedora; then
                bad "a SETTING in ${f} says Fedora:"; values_only "${f}" | grep -i fedora | sed 's/^/       /'
                still=1
              fi
            done < /tmp/fed-theme.txt
            if [ "${still}" -eq 0 ]; then
              ok "the boot theme's settings say nothing about Fedora (only its notes do, which is fine)"
            fi
          else
            ok "nothing in the boot theme folder mentions Fedora at all"
          fi

          echo
          echo "=============================================================="
          echo " THE ALLOWLIST — where Fedora is SUPPOSED to still appear"
          echo "=============================================================="
          echo "Each of these is deliberate. None is visible to a person using"
          echo "the machine, and each one would break something if changed."
          echo
          # 1. os-release's machine-readable identity. Hundreds of programs and
          #    scripts branch on ID=fedora to decide which package manager to
          #    use and which paths to look in. Changing it would make this
          #    machine unrecognisable to all of them.
          echo "1. /etc/os-release — the machine-readable identity:"
          grep -E '^(ID|ID_LIKE|VERSION|VERSION_ID|CPE_NAME|REDHAT_)' /etc/os-release | sed 's/^/     /'
          if grep -q '^ID=fedora$' /etc/os-release; then ok "ID is still fedora (required, deliberate)"
          else bad "ID is no longer fedora — software that branches on it would stop recognising this machine"; fi

          # 2. The CPE identifier. Security scanners use it to work out which
          #    published vulnerabilities apply. AquariusOS really is Fedora 44
          #    underneath, so telling a scanner otherwise makes it check the
          #    wrong list — which is a security problem, not a branding one.
          echo "2. /etc/system-release-cpe — used by vulnerability scanners:"
          sed 's/^/     /' /etc/system-release-cpe 2>/dev/null || echo "     (not present)"

          # 3. The software sources. These really are Fedora's servers.
          echo "3. /etc/yum.repos.d/ — the real Fedora and RPM Fusion servers:"
          ls -1 /etc/yum.repos.d/ 2>/dev/null | sed 's/^/     /' || echo "     (none)"

          # 4. Package names, and the record of what this image was built on.
          echo "4. Package names and the build record:"
          echo "     $(rpm -qa 'fedora-*' | tr '\n' ' ')"
          grep -o '"base-image-name": "[^"]*"' /usr/share/aquarius/image-info.json | sed 's/^/     /'

          # 5. Two picture FILENAMES under /usr/share/pixmaps are Fedora's, on
          #    purpose: GNOME's Settings > About page opens those exact paths, so
          #    the only way to brand that page is to put our picture at Fedora's
          #    filename. The bytes are ours; the name is not. Checked properly by
          #    the "About page shows OUR logo" step above.
          echo "5. Fedora-named picture files whose CONTENTS are ours:"
          ls -1 /usr/share/pixmaps/fedora_logo_med.png /usr/share/pixmaps/fedora_whitelogo_med.png 2>/dev/null | sed 's/^/     /' || true

          echo
          if [ "$fails" -ne 0 ]; then
            echo "::error::This image still carries a name it should not. See the FAIL lines above."
            exit 1
          fi
          echo "No stray names. Every visible surface says AquariusOS."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-names.sh

      # ------------------------------------------------------------------------
      # THE KERNEL, AND EVERY READY-MADE MODULE THAT DEPENDS ON IT
      # ------------------------------------------------------------------------
      # Four features in this image are kernel modules: the NVIDIA driver, the
      # OBS virtual camera, and the two Xbox controller drivers. A kernel module
      # only loads on the exact kernel it was built against, so all four stand
      # or fall together with one question — is the kernel in this image the one
      # Universal Blue built their modules for?
      #
      # ⚠️ THIS CHECK EXISTS BECAUSE THE ANSWER WAS SILENTLY "NO" ONCE.
      # On 2026-09-04 (build 33900370878) Fedora shipped kernel 7.1.13 while
      # Universal Blue's modules were still built for 7.1.12. The NVIDIA image
      # swapped its kernel and was fine. The AMD/Intel image had no such step,
      # so it built green, published, and shipped with NO virtual camera and NO
      # Xbox drivers. Every other check in this workflow passed.
      #
      # build_files/58-kernel-pin.sh now pins the kernel on BOTH images, and
      # this reads that back inside the finished image: the pin note, the
      # package database, and the actual folder on disk all have to say the same
      # version, and every module has to be filed under it. It runs on both
      # variants, before the NVIDIA-specific checks below.
      - name: Check the kernel is the one the modules were built for
        run: |
          set -euo pipefail
          cat > /tmp/verify-kernel.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          echo "== what the build wrote down =="
          PIN=/usr/share/aquarius/kernel.txt
          if [ ! -r "${PIN}" ]; then
            bad "${PIN} is missing — the kernel pin step did not run"
            PINNED=""
          else
            sed 's/^/     /' "${PIN}"
            PINNED="$(sed -n 's/^kernel=//p' "${PIN}")"
            if [ -n "${PINNED}" ]; then
              ok "the image says it was pinned to ${PINNED}"
            else
              bad "${PIN} has no kernel= line in it"
            fi
          fi

          echo "== the kernel package =="
          INSTALLED="$(rpm -q --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}' kernel-core)"
          echo "     kernel-core says: ${INSTALLED}"
          rpm -qa --queryformat '     %{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n' 'kernel*' | sort

          echo "== the kernel folder on disk =="
          # This is the `uname -r` of an image you cannot boot: the one folder
          # under /usr/lib/modules is the kernel every module has to be filed
          # under. A bootable image must have exactly one.
          ls -1 /usr/lib/modules/ | sed 's/^/     /'
          COUNT="$(find /usr/lib/modules -mindepth 1 -maxdepth 1 -type d -printf . | wc -c)"
          KVER="$(find /usr/lib/modules -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | head -1)"
          if [ "${COUNT}" -eq 1 ]; then
            ok "exactly one kernel folder: ${KVER}"
          else
            bad "${COUNT} kernel folders under /usr/lib/modules — there must be exactly one"
          fi

          if [ "${KVER}" = "${INSTALLED}" ]; then
            ok "the folder on disk and the package database agree"
          else
            bad "the package database says ${INSTALLED} but the folder on disk is ${KVER}"
          fi
          if [ -n "${PINNED}" ] && [ "${KVER}" = "${PINNED}" ]; then
            ok "and that is exactly what the build pinned"
          elif [ -n "${PINNED}" ]; then
            bad "the build pinned ${PINNED} but this image ships ${KVER} — something moved the kernel after the pin"
          fi

          echo "== the ready-made modules that depend on it =="
          # These come from ghcr.io/ublue-os/akmods and are in BOTH images. Two
          # questions per module, because they fail differently: is the package
          # installed, and did its file land where THIS kernel looks?
          check_kmod() {   # check_kmod <package> <module file pattern> <what it is for>
            pkg="$1"; pat="$2"; what="$3"
            if rpm -q "${pkg}" > /dev/null 2>&1; then
              ok "${pkg} $(rpm -q --queryformat '%{VERSION}-%{RELEASE}' "${pkg}") — ${what}"
            else
              bad "${pkg} is NOT installed — ${what} does not work on this image"
              return
            fi
            found="$(find "/usr/lib/modules/${KVER}" -name "${pat}" 2>/dev/null | head -1)"
            if [ -n "${found}" ]; then
              ok "  its module is under this image's kernel: ${found}"
            else
              bad "  no ${pat} under /usr/lib/modules/${KVER} — the module would never load"
            fi
          }
          check_kmod kmod-v4l2loopback 'v4l2loopback.ko*' "OBS's Start Virtual Camera button"
          check_kmod kmod-xone         'xone_*.ko*'      "the Xbox Wireless Adapter (the USB dongle)"
          check_kmod kmod-xpadneo      'hid-xpadneo.ko*' "Xbox controllers over Bluetooth"

          if [ "${EXPECTED_NVIDIA}" = "1" ]; then
            echo "== and the NVIDIA driver, which comes from the matching box =="
            check_kmod kmod-nvidia 'nvidia.ko*' "the NVIDIA graphics driver"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The kernel and the ready-made kernel modules in this image do not agree. Do not publish it. See docs/restart/kernel.md."
            exit 1
          fi
          echo "All kernel checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            -e EXPECTED_NVIDIA="${NVIDIA}" \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-kernel.sh

      - name: Check the NVIDIA driver
        if: matrix.nvidia == 1
        run: |
          set -euo pipefail
          cat > /tmp/verify-nvidia.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          echo "== the driver packages =="
          for pkg in kmod-nvidia nvidia-driver egl-wayland nvidia-container-toolkit; do
            if rpm -q "${pkg}" > /dev/null 2>&1; then
              ok "${pkg} $(rpm -q --queryformat '%{VERSION}-%{RELEASE}' "${pkg}")"
            else
              bad "${pkg} is NOT installed"
            fi
          done

          # The kernel module and the driver come from the same source and MUST
          # be the same version. A mismatch is the classic black screen.
          k="$(rpm -q --queryformat '%{VERSION}' kmod-nvidia 2>/dev/null || echo none)"
          d="$(rpm -q --queryformat '%{VERSION}' nvidia-driver 2>/dev/null || echo none)"
          if [ "$k" = "$d" ] && [ "$k" != "none" ]; then
            ok "kernel module and driver are both version ${k}"
          else
            bad "kernel module is ${k} but the driver is ${d}"
          fi

          # And the module file has to be filed under the kernel that is
          # actually in this image, not the one it was built on.
          KERNEL="$(rpm -q --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}' kernel-core)"
          echo "== kernel in this image: ${KERNEL} =="
          ls -1 /usr/lib/modules/
          if compgen -G "/usr/lib/modules/${KERNEL}/extra/nvidia*" > /dev/null; then
            ok "the NVIDIA modules are filed under ${KERNEL}"
            ls -l /usr/lib/modules/"${KERNEL}"/extra/nvidia* | sed 's/^/       /'
          else
            bad "no nvidia* modules under /usr/lib/modules/${KERNEL}/extra — the driver would not load"
            find /usr/lib/modules -name 'nvidia*' | head -20
          fi

          echo "== boot options =="
          cat /usr/lib/bootc/kargs.d/10-aquarius-nvidia.toml || echo "(missing!)"
          if grep -q 'nvidia-drm.modeset=1' /usr/lib/bootc/kargs.d/10-aquarius-nvidia.toml 2>/dev/null; then
            ok "nvidia-drm.modeset=1 is set — Wayland will start"
          else
            bad "nvidia-drm.modeset=1 is not set — a Wayland desktop on NVIDIA would not start"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The NVIDIA layer in this image is not correct."
            exit 1
          fi
          echo "All NVIDIA checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-nvidia.sh

      # And the opposite: the AMD/Intel image must NOT have picked up the
      # NVIDIA driver. If the conditional-stage trick in the Containerfile ever
      # breaks, this is what notices.
      - name: Check the AMD/Intel image has no NVIDIA driver in it
        if: matrix.nvidia == 0
        run: |
          set -euo pipefail
          podman run --rm --pull=never \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" -c '
              if rpm -q kmod-nvidia > /dev/null 2>&1; then
                echo "::error::The AMD/Intel image contains the NVIDIA kernel module. The Containerfile stage selection is broken."
                exit 1
              fi
              echo "  OK   no NVIDIA driver on the AMD/Intel image (correct)"
            '

      # ------------------------------------------------------------------------
      # Aquarius Keys — the Mac-style keyboard shortcuts
      # ------------------------------------------------------------------------
      # A keyboard feature fails in a particularly nasty way: some keys just do
      # nothing, and nothing anywhere says why. So this asks the finished image
      # every question that matters — are both remappers there and do they run,
      # are the rule files ones the remapper itself accepts, is the service
      # switched on, does a brand-new account get Mac keys, is the permission
      # rule in place, and does `aq keys` work.
      #
      # The rule files are ALSO parsed here on the runner as plain YAML. That is
      # not a duplicate of the check the build does: the build asks "does xremap
      # accept this?", and this asks "is it well-formed text?" — which is the
      # question that catches a file that has been truncated or mangled on its
      # way into the image.
      - name: Check the Mac keyboard shortcuts are really in there
        run: |
          set -euo pipefail

          # ---- 1. inside the image -------------------------------------------
          cat > /tmp/verify-keys.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }
          check() {   # check "<description>" "<pattern>" "<file>"
            if [ ! -e "$3" ]; then bad "$1 — $3 does not exist"; return; fi
            if grep -Eq "$2" "$3"; then ok "$1"; else bad "$1 — /$2/ not found in $3"; fi
          }

          echo "== the two remapper programs =="
          for feature in wlroots gnome; do
            bin="/usr/bin/xremap-${feature}"
            if [ ! -x "${bin}" ]; then
              bad "${bin} is missing"
              continue
            fi
            if out="$("${bin}" --version 2>&1)"; then
              ok "${bin} — ${out}"
            else
              bad "${bin} is installed but will not run: ${out}"
            fi
            # A library that is not in the image shows up here as "not found",
            # and would otherwise only be discovered at somebody's login.
            if ldd "${bin}" 2>&1 | grep -q "not found"; then
              bad "${bin} needs a library that is not in this image:"
              ldd "${bin}" 2>&1 | grep "not found" | sed 's/^/       /'
            else
              ok "${bin} has every library it needs"
            fi
          done

          echo
          echo "== the rule files, judged by the remapper itself =="
          # xremap reads and validates the whole file before it looks at any
          # keyboard, so pointing it at a device that does not exist gets the
          # full check and then stops. A complaint about the FILE says "Failed
          # to load config"; a complaint about missing devices is expected,
          # because there is no keyboard inside a container.
          for profile in mac windows; do
            file="/usr/share/aquarius/keys/${profile}.yaml"
            if [ ! -s "${file}" ]; then bad "${file} is missing or empty"; continue; fi
            out="$(/usr/bin/xremap-wlroots --device /nonexistent-device "${file}" 2>&1 || true)"
            if printf '%s' "${out}" | grep -q "Failed to load config"; then
              bad "${file} is not a valid profile:"
              printf '%s\n' "${out}" | sed 's/^/       /'
            else
              ok "${file} is a profile xremap accepts"
            fi
          done

          echo
          echo "== the rules Royce actually asked for =="
          MAC=/usr/share/aquarius/keys/mac.yaml
          check "the key beside the space bar is Command" '^ *Alt_L: Super_L$'     "${MAC}"
          check "the Windows key is Option"               '^ *Super_L: Alt_L$'     "${MAC}"
          check "Apple keyboards are left alone"          'ids:0x05ac'             "${MAC}"
          check "Command-C copies"                        '^ *Super-c: C-c( |$)'   "${MAC}"
          check "in a terminal, Command-C copies"         '^ *Super-c: C-Shift-c( |$)' "${MAC}"
          check "Command-Q closes the window"             '^ *Super-q: A-F4$'      "${MAC}"
          check "Command-Shift-3 takes a screenshot"      '^ *Super-Shift-3: SYSRQ$' "${MAC}"
          check "Files gets its own rules"                '^ *- Nautilus$'         "${MAC}"
          # ⚠️ THIS CHECK CHANGED DIRECTION ON 2026-09-08, and it is inverted
          # rather than deleted so that the decision stays visible. It used to
          # require `- resolve` in mac.yaml's exclusion list, keeping DaVinci
          # Resolve on Control keys in Mac mode. Royce's years of Resolve are
          # MAC years, so that made Command do nothing inside the one
          # application this operating system exists for, while working
          # everywhere else on the machine. Resolve follows the OS setting now.
          if grep -Eq '^[[:space:]]*- resolve([[:space:]]|$)' "${MAC}"; then
            bad "mac.yaml excludes DaVinci Resolve again — Command would do nothing inside Resolve (Royce's decision, 2026-09-08)"
          else
            ok "DaVinci Resolve follows the OS's keyboard setting, like everything else"
          fi

          # These three must NOT be remapped: they are how the desktop's own
          # search and window switching are reached. A rule for any of them
          # would take the search palette away with no error anywhere.
          for combo in 'Super-space' 'Super-Tab' 'Super-grave'; do
            if grep -Eq "^[[:space:]]+${combo}:" "${MAC}"; then
              bad "${combo} is remapped — that key belongs to the desktop"
            else
              ok "${combo} is left for the desktop, as designed"
            fi
          done

          echo
          echo "== permission to read the keyboard without being root =="
          RULE=/usr/lib/udev/rules.d/70-aquarius-input.rules
          check "the udev rule covers the invented keyboard" 'uinput'          "${RULE}"
          check "it uses uaccess, not a permanent group"     'TAG\+="uaccess"' "${RULE}"
          check "it covers the real keyboards too"           'SUBSYSTEM=="input", KERNEL=="event\[0-9\]\*"' "${RULE}"
          check "the uinput driver loads at boot"            '^uinput$' /usr/lib/modules-load.d/aquarius-uinput.conf

          echo
          echo "== the service, and that it is switched on =="
          UNIT=/usr/lib/systemd/user/aquarius-keys.service
          WANTS=/usr/lib/systemd/user/graphical-session.target.wants/aquarius-keys.service
          check "the service runs the right program" '^ExecStart=/usr/libexec/aquarius-keys-run$' "${UNIT}"
          check "it belongs to the graphical session" '^WantedBy=graphical-session\.target$'      "${UNIT}"
          check "it ends when the desktop does"       '^PartOf=graphical-session\.target$'       "${UNIT}"

          # ---- the 2026-09-03 bench bug, checked in the finished image ------
          # A second remapper — the LOGIN SCREEN's, started from the same link,
          # because that link applies to every account including gdm's — had
          # taken hold of both keyboards. Ours was refused each one with
          # "Device or resource busy", held nothing, and reported itself active
          # the whole time. It looked exactly like Windows mode.
          # Every line below is part of the fix and every one is one edit from
          # being lost. See docs/restart/aquarius-keys.md.
          check "the login screen does not run this"  '^ConditionUser=!@system$'                 "${UNIT}"
          check "it keeps retrying rather than giving up" '^Restart=always$'                     "${UNIT}"
          check "it retries two seconds later"        '^RestartSec=2$'                           "${UNIT}"
          check "the give-up limit is switched off"   '^StartLimitIntervalSec=0$'                "${UNIT}"
          check "the two do-not-retry exits are named" '^RestartPreventExitStatus=64 78$'        "${UNIT}"
          check "a leftover remapper is cleared first" '^ExecStartPre=-/usr/bin/pkill'           "${UNIT}"

          RUNNER=/usr/libexec/aquarius-keys-run
          check "a leftover 'xremap' device can never be chosen" 'ignore=xremap'        "${RUNNER}"
          check "a refused keyboard fails the run"    'resource busy'                   "${RUNNER}"
          check "holding no keyboards fails the run"  'No device was selected'          "${RUNNER}"
          check "it says how many keyboards it has"   'remapping .* keyboard'           "${RUNNER}"
          check "on GNOME it waits for the shell"     'GNOME Shell to be ready'         "${RUNNER}"
          check "and for the add-on to finish loading" 'gnome-extensions info'          "${RUNNER}"
          # The image's enabled-extensions DEFAULT only reaches brand-new
          # accounts — the line above writes that whole list into an existing
          # account's own settings, which kills the default for it forever. So
          # the login script switches our quick-settings toggle on too, once per
          # account (bench bug, 2026-09-17: installed, listed, Enabled:No).
          check "it also switches our own toggle on" 'aquarius-keys@stoneharborent.github.io' "${RUNNER}"
          check "once per account, not once per login" 'keys-toggle-enabled'   "${RUNNER}"
          check "'aq keys status' reports the keyboards" 'Keyboards :'                  /usr/bin/aq

          # ⚠️ THE WINDOW BUTTONS ARE NOT PART OF THIS CHOICE ANY MORE
          # (Royce, 2026-09-17). Until that day, choosing Mac also moved the
          # close, minimise and maximise buttons to the LEFT. It was dropped
          # because applications that draw their own title bar never followed
          # it, so some windows moved and some did not. Three things have to
          # stay true: aq does not move them, the image's default is the stock
          # right-hand layout, and accounts that already had the old left-hand
          # layout written into them are put back, once per account.
          if grep -q 'apply_window_buttons' /usr/bin/aq; then
            bad "aq still has apply_window_buttons — the Mac/Windows switch would move the window buttons again"
          else
            ok "'aq keys' is the keyboard only; it does not move the window buttons"
          fi
          echo "--- the window-button default a new account gets ---"
          AQ_BTN="$(GSETTINGS_BACKEND=memory gsettings get org.gnome.desktop.wm.preferences button-layout 2>/dev/null || echo '(no answer)')"
          echo "       ${AQ_BTN}"
          case "${AQ_BTN}" in
            *":minimize,maximize,close"*)
              ok "a new account gets all three buttons, on the right" ;;
            *)
              bad "the image's button-layout default is ${AQ_BTN}, not ':minimize,maximize,close'" ;;
          esac
          check "an old left-hand GNOME layout is reset"  'button-layout'            "${RUNNER}"
          check "the KDE half is cleared out of kwinrc"   'ButtonsOnLeft'            "${RUNNER}"
          check "the stale GTK settings.ini files are fixed" 'gtk-decoration-layout'  "${RUNNER}"
          check "and that repair runs once per account"   'window-buttons-unpinned'  "${RUNNER}"

          echo "== how big things are on the screen =="
          # ⚠️ THIS FEATURE CHANGED SHAPE ON 2026-09-15. It existed because the
          # Aquarius Session started every monitor at 100%: on a 55" 4K bench
          # monitor the whole desktop was tiny, while GNOME had been running the
          # same screen at 125% for weeks. That session is retired, and BOTH
          # desktops now do their own scaling — GNOME in Settings → Displays,
          # KDE Plasma in System Settings → Display Configuration (kscreen).
          #
          # The helper is KEPT, and not as a leftover: `aq display scale` writes
          # the number that /usr/libexec/aquarius-resolve-launch reads to size
          # DaVinci Resolve, which is an X11 program and is sized by nothing
          # else. See docs/restart/aquarius-display.md.
          if [ -x /usr/libexec/aquarius-display-scale ]; then
            ok "the display-scale helper is installed"
          else
            bad "/usr/libexec/aquarius-display-scale is missing — 'aq display scale' and Resolve's sizing would both break"
          fi
          if command -v wlr-randr > /dev/null 2>&1; then
            ok "wlr-randr is installed (how the helper asks what is plugged in)"
          else
            bad "wlr-randr is missing — the helper could not even ask about the monitors"
          fi
          check "'aq display' is in the command" 'aq display scale' /usr/bin/aq
          check "the Resolve launcher reads its answer" 'aquarius-display-scale' \
            /usr/libexec/aquarius-resolve-launch
          if [ -L "${WANTS}" ] && [ -e "${WANTS}" ]; then
            ok "switched on by default — ${WANTS} -> $(readlink "${WANTS}")"
          else
            bad "${WANTS} is missing or dangling — the service would never start"
          fi

          echo
          echo "== the default is Mac, in both places it is written =="
          check "a brand-new account gets Mac keys" '^mode=mac$'      /etc/skel/.config/aquarius/keys.conf
          check "an account with no file gets them too" '^AQ_MODE="mac"$' /usr/libexec/aquarius-keys-run

          echo
          echo "== the switch =="
          for script in /usr/libexec/aquarius-keys-run /usr/bin/aq; do
            if [ ! -x "${script}" ]; then bad "${script} is missing or not runnable"; continue; fi
            if bash -n "${script}"; then ok "${script} is valid shell"; else bad "${script} has a syntax error"; fi
          done
          if /usr/bin/aq --help > /dev/null 2>&1; then ok "aq --help works"; else bad "aq --help failed"; fi
          echo "--- aq keys status, with no desktop running ---"
          if /usr/bin/aq keys status; then
            ok "aq keys status explains itself instead of falling over"
          else
            bad "aq keys status failed"
          fi
          echo "---"

          echo
          echo "== the GNOME add-on that reports the focused app =="
          EXT=/usr/share/gnome-shell/extensions/xremap@k0kubun.com
          check "it is installed" '"uuid": "xremap@k0kubun.com"' "${EXT}/metadata.json"
          if [ -s "${EXT}/extension.js" ]; then ok "its code is present"; else bad "${EXT}/extension.js is missing"; fi

          echo
          echo "== the two graphical switches for Mac or Windows (2026-09-16) =="
          # Before these existed, the only ways to change this were the Welcome
          # window — seen once, on a first login — and typing a command. A
          # switch that is installed but invisible is worth nothing, and both
          # ways of being invisible are silent, so both are checked here.
          AQEXT=/usr/share/gnome-shell/extensions/aquarius-keys@stoneharborent.github.io
          check "the GNOME toggle is installed" \
            '"uuid": "aquarius-keys@stoneharborent.github.io"' "${AQEXT}/metadata.json"
          check "it runs aq rather than writing the settings file itself" \
            "'/usr/bin/aq'" "${AQEXT}/extension.js"
          # Switched on, asked of the settings system itself — the same question
          # a brand-new account asks on its first login.
          if GSETTINGS_BACKEND=memory gsettings get org.gnome.shell enabled-extensions \
               > /tmp/aq-exts.txt 2>/dev/null \
             && grep -q 'aquarius-keys@stoneharborent.github.io' /tmp/aq-exts.txt; then
            ok "the GNOME toggle is switched on by default"
          else
            bad "the GNOME toggle is not in enabled-extensions — it would be installed and invisible"
          fi

          # The KDE page. There is exactly one folder System Settings reads, and
          # anywhere else it is just a file.
          KCM="$(find /usr/lib /usr/lib64 -type f -name kcm_aquariuskeys.so 2>/dev/null | head -n 1)"
          if [ -z "${KCM}" ]; then
            bad "the KDE 'Mac or Windows' page is not in this image"
          else
            ok "the KDE page is installed at ${KCM}"
            case "${KCM}" in
              */plasma/kcms/systemsettings/kcm_aquariuskeys.so)
                ok "that is the folder System Settings reads" ;;
              *)
                bad "${KCM} is not a folder System Settings reads — the page would never appear" ;;
            esac
            # It was compiled in a different container from the one it runs in.
            if ldd "${KCM}" 2>&1 | grep -q "not found"; then
              bad "the KDE page needs a library that is not in this image"
              ldd "${KCM}" || true
            else
              ok "every library the KDE page needs is here"
            fi
            # Its name and its place in System Settings are baked into the file.
            for want in "Mac or Windows" "X-KDE-System-Settings-Parent-Category"; do
              if grep -aq -- "${want}" "${KCM}"; then ok "the page carries: ${want}"
              else bad "the page does not contain '${want}'"; fi
            done
          fi
          # ⚠️ AND IT MUST NOT TURN UP IN GNOME. Both desktops read
          # /usr/share/applications/.
          if ls /usr/share/applications/kcm_aquariuskeys* > /dev/null 2>&1; then
            bad "the KDE page has a menu entry — it would be a dead icon in GNOME's app grid"
          else
            ok "the KDE page has no menu entry, so GNOME never shows it"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::Aquarius Keys is not correctly assembled in this image."
            exit 1
          fi
          echo "All Aquarius Keys checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-keys.sh

          # ---- 2. on the runner: are the rule files well-formed YAML? --------
          # PyYAML is on GitHub's runners already; the install line is there so
          # that a future runner image without it fails loudly at this line
          # rather than quietly skipping the check.
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml
          for profile in mac windows; do
            podman run --rm --pull=never --entrypoint /usr/bin/cat \
              "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
              "/usr/share/aquarius/keys/${profile}.yaml" > "/tmp/${profile}.yaml"
            python3 - "$profile" <<'PY'
          import sys, yaml
          name = sys.argv[1]
          with open(f"/tmp/{name}.yaml") as fh:
              doc = yaml.safe_load(fh)
          assert isinstance(doc, dict), f"{name}.yaml is not a settings file at all"
          for section in ("modmap", "keymap"):
              assert section in doc, f"{name}.yaml has no '{section}' section"
              assert isinstance(doc[section], list), f"{name}.yaml: '{section}' is not a list"
          rules = sum(len(block.get("remap", {})) for block in doc["keymap"])
          print(f"  OK   {name}.yaml is well-formed YAML — "
                f"{len(doc['modmap'])} key swap block(s), "
                f"{len(doc['keymap'])} rule block(s), {rules} rules")
          PY
          done

      - name: Check the creator apps are really in there
        run: |
          set -euo pipefail
          cat > /tmp/verify-creator.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          # ====================================================================
          # 1. THE TWO APPS THAT ARE BAKED INTO THE IMAGE
          # ====================================================================
          # Re-asked here, on the FINISHED, PACKAGED image, and not only during
          # the build. That is not belt and braces for its own sake: the tool
          # that packages a bootable image rewrites every file, and the whole
          # bug of 2026-08-28 was about file permissions. A permission that is
          # correct when it is set and wrong when it is shipped is exactly the
          # kind of thing this step exists to catch.
          echo "== Aquarius Writer (baked in) and Aquarius Editor (a download) =="

          if [ -r /usr/share/aquarius/creator-apps.txt ]; then
            echo "-- what the build says it installed --"
            sed 's/^/     /' /usr/share/aquarius/creator-apps.txt
          else
            bad "/usr/share/aquarius/creator-apps.txt is missing — the build did not record what it did"
          fi

          for app in aquarius-writer; do
            dir="/usr/lib/aquarius/${app}"

            if [ -d "${dir}" ]; then ok "${app}: unpacked at ${dir} ($(du -sh "${dir}" | cut -f1))"
            else bad "${app}: ${dir} does not exist — the app is not in the image"; continue; fi

            if [ -x "${dir}/AppRun" ]; then ok "${app}: AppRun is there"
            else bad "${app}: ${dir}/AppRun is missing or not runnable"; fi

            if [ -x "/usr/bin/${app}" ]; then ok "${app}: /usr/bin/${app} is the front door"
            else bad "${app}: /usr/bin/${app} is missing"; fi

            if [ -f "/usr/share/applications/${app}.desktop" ]; then
              ok "${app}: it has an app-grid entry"
            else
              bad "${app}: no /usr/share/applications/${app}.desktop — it would not appear in the app grid"
            fi

            # The version stamp, cross-checked against what the build wrote
            # down. Two files, written by different parts of the same step, so
            # a disagreement means one of them did not happen.
            if [ -r "${dir}/VERSION" ]; then
              v="$(cat "${dir}/VERSION")"
              ok "${app}: version ${v}"
              if grep -qx "${app} v${v}" /usr/share/aquarius/creator-apps.txt 2>/dev/null; then
                ok "${app}: the record agrees it is v${v}"
              else
                bad "${app}: VERSION says ${v} but creator-apps.txt does not say v${v}"
              fi
            else
              bad "${app}: ${dir}/VERSION is missing — the launcher could never start a downloaded update"
            fi

            # ⚠️ EVERY CHECK IN THIS FILE RUNS AS ROOT, AND ROOT IGNORES
            #    PERMISSIONS. So the questions are asked the way an ordinary
            #    account experiences them: not "can I", but "could somebody who
            #    is neither root nor in this file's group".
            n="$(find "${dir}" \( -type f -o -type d \) ! -perm -o+r | wc -l)"
            if [ "${n}" -eq 0 ]; then ok "${app}: everything is readable by an ordinary account"
            else bad "${app}: ${n} file(s)/folder(s) an ordinary account cannot read"; find "${dir}" \( -type f -o -type d \) ! -perm -o+r | head -5; fi

            n="$(find "${dir}" -type f -perm -u+x ! -perm -o+x | wc -l)"
            if [ "${n}" -eq 0 ]; then ok "${app}: every program in it can be run by an ordinary account"
            else bad "${app}: ${n} program(s) an ordinary account cannot run — this is the bug of 2026-08-28"; find "${dir}" -type f -perm -u+x ! -perm -o+x | head -5; fi

            n="$(find "${dir}" -type d ! -perm -o+x | wc -l)"
            if [ "${n}" -eq 0 ]; then ok "${app}: every folder can be opened by an ordinary account"
            else bad "${app}: ${n} folder(s) an ordinary account cannot open"; fi

            n="$(find "${dir}" ! -type l -perm -o+w | wc -l)"
            if [ "${n}" -eq 0 ]; then ok "${app}: nothing in it is writable by just anyone"
            else bad "${app}: ${n} file(s) writable by ANY account, inside /usr"; fi

            n="$(find "${dir}" -xtype l | wc -l)"
            if [ "${n}" -eq 0 ]; then ok "${app}: no symlink points at nothing"
            else bad "${app}: ${n} broken symlink(s)"; find "${dir}" -xtype l | head -5; fi
          done

          # ====================================================================
          # 1b. AQUARIUS EDITOR IS A DOWNLOAD NOW, AND MUST NOT BE IN HERE
          # ====================================================================
          # ⚠️ THE CHECK THE WHOLE 2026-09-04 CHANGE RESTS ON. Aquarius Editor
          # is 4.1 GB unpacked. Baking it in made every AquariusOS download four
          # gigabytes bigger for everybody, including the people who will never
          # open it, so it moved out of the image and into the app chooser —
          # ticked by default, installed into each person's own home folder.
          #
          # If it ever comes back, nothing goes red on its own: the build simply
          # takes ten minutes longer and the image is twice the size it needs to
          # be. So it is asserted here, on the FINISHED, PACKAGED image, in the
          # plainest way there is.
          echo
          echo "== Aquarius Editor is NOT in the image (it is a download) =="
          if [ -e /usr/lib/aquarius/aquarius-editor ]; then
            bad "/usr/lib/aquarius/aquarius-editor is in the image — four gigabytes that should not be here"
            du -sh /usr/lib/aquarius/aquarius-editor
          else
            ok "no /usr/lib/aquarius/aquarius-editor"
          fi
          if [ -e /usr/share/applications/aquarius-editor.desktop ]; then
            bad "a system-wide aquarius-editor.desktop is in the image — every account would show a dead icon"
          else
            ok "no system-wide menu entry either — the installer writes a personal one"
          fi
          # And the pieces that DO have to be here, because they are what fetches
          # it onto a real machine.
          if [ -x /usr/libexec/aquarius-appimage-install ]; then
            ok "the home-folder installer is here"
          else
            bad "/usr/libexec/aquarius-appimage-install is missing — the chooser would offer an app nobody can install"
          fi
          if [ -r /usr/share/aquarius/apps/aquarius-editor.desktop.in ]; then
            # ⚠️ Validated through a copy with the right name.
            # desktop-file-validate refuses any filename not ending in
            # `.desktop`, before reading a line of it — and this one is a
            # template on purpose. Checking the copy also asks the more honest
            # question: is the file valid under the name it will really have?
            cp /usr/share/aquarius/apps/aquarius-editor.desktop.in /tmp/aquarius-editor.desktop
            if desktop-file-validate /tmp/aquarius-editor.desktop 2>/tmp/dfv.txt; then
              ok "the menu-entry template it installs is valid"
            else
              bad "the menu-entry template is not valid — the app would install and never appear"
              sed 's/^/       /' /tmp/dfv.txt
            fi
            rm -f /tmp/aquarius-editor.desktop
          else
            bad "/usr/share/aquarius/apps/aquarius-editor.desktop.in is missing"
          fi
          if [ -x /usr/bin/aquarius-editor ]; then
            ok "/usr/bin/aquarius-editor is still the front door"
            if grep -q '\.local/lib/aquarius' /usr/bin/aquarius-editor; then
              ok "and it looks for the app in the person's own home folder"
            else
              bad "the launcher does not look in ~/.local/lib/aquarius — it would never find an installed copy"
            fi
          else
            bad "/usr/bin/aquarius-editor is missing — the menu entry points at it"
          fi
          # The rehearsal, on the packaged image: every step of an install,
          # into a throwaway folder, with the two downloads stood in for.
          echo "-- rehearsing an install, with no network --"
          if /usr/libexec/aquarius-appimage-install --dry-run --progress-fd 2 \
               install os.aquarius.editor >/tmp/reh.txt 2>&1; then
            ok "the installer walked a whole install on this image"
          else
            bad "the installer could not walk an install on this image"
          fi
          sed 's/^/       /' /tmp/reh.txt
          for want in 'STEP 1/1 Aquarius Editor' 'releases/download/v0.7.2/SHA256SUMS.txt' \
                      'menu entry written to' 'is installed, and read back' 'PERCENT 100' 'DONE'; do
            if grep -qF "${want}" /tmp/reh.txt; then ok "  it said: ${want}"
            else bad "  the rehearsal never said: ${want}"; fi
          done

          # The app-grid entries, judged by the freedesktop project's own
          # checker rather than by us reading them.
          echo "== are the app-grid entries well-formed? =="
          for d in /usr/share/applications/aquarius-writer.desktop; do
            if desktop-file-validate "${d}" 2>/tmp/dfv.txt; then ok "$(basename "${d}") is valid"
            else bad "$(basename "${d}") is not valid — the app would never appear"; sed 's/^/       /' /tmp/dfv.txt; fi
          done

          # Electron on a scaled screen. Without this the Editor's window is
          # faintly out of focus at 125% and 150%, which is every 4K monitor.
          echo "== Electron draws sharply on a scaled screen =="
          if grep -qx 'ELECTRON_OZONE_PLATFORM_HINT=auto' /usr/lib/environment.d/60-aquarius-electron.conf 2>/dev/null; then
            ok "the session sets ELECTRON_OZONE_PLATFORM_HINT=auto"
          else
            bad "/usr/lib/environment.d/60-aquarius-electron.conf does not set ELECTRON_OZONE_PLATFORM_HINT=auto"
          fi
          if grep -q 'ELECTRON_OZONE_PLATFORM_HINT' /usr/bin/aquarius-editor; then
            ok "the Editor's launcher sets it too (for an app started outside a login session)"
          else
            bad "/usr/bin/aquarius-editor does not set ELECTRON_OZONE_PLATFORM_HINT"
          fi

          # ====================================================================
          # 2. THE APPS THAT ARRIVE FROM FLATHUB ON FIRST BOOT
          # ====================================================================
          echo
          echo "== the creator apps that arrive on first boot =="

          # Flatpak has to be new enough to have the preinstall command at all.
          # 1.16 is where this mechanism became usable; Fedora 44 ships 1.18.
          FPV="$(flatpak --version | awk '{print $NF}')"
          echo "  flatpak ${FPV}"
          MAJ="${FPV%%.*}"; REST="${FPV#*.}"; MIN="${REST%%.*}"
          if [ "${MAJ}" -gt 1 ] || { [ "${MAJ}" -eq 1 ] && [ "${MIN}" -ge 16 ]; }; then
            ok "flatpak ${FPV} is new enough for preinstall (needs 1.16 or later)"
          else
            bad "flatpak ${FPV} is too old for the preinstall mechanism"
          fi
          if flatpak preinstall --help >/dev/null 2>&1; then
            ok "'flatpak preinstall' exists — the native mechanism is what runs"
          else
            bad "no 'flatpak preinstall' command — the service would fall back to a loop that cannot honour a person's uninstall"
          fi

          LIST=/usr/share/flatpak/preinstall.d/aquarius-creator-apps.preinstall
          if [ -s "${LIST}" ]; then ok "the shopping list is in the image"
          else bad "${LIST} is missing — the OS would advertise a creator suite and install nothing"; fi

          echo "-- every app on the list --"
          grep -o '^\[Flatpak Preinstall [^]]*\]' "${LIST}" | sed 's/^\[Flatpak Preinstall //; s/\]$//' | sort > /tmp/ids.txt
          sed 's/^/     /' /tmp/ids.txt
          echo "  ($(wc -l < /tmp/ids.txt) entries)"

          # The apps Royce chose. Named here so that a deletion from the list is
          # a failed build and not a quiet regression nobody notices for weeks.
          for want in \
            com.obsproject.Studio org.kde.kdenlive org.kde.krita org.blender.Blender \
            org.ardour.Ardour org.audacityteam.Audacity org.gimp.GIMP org.inkscape.Inkscape \
            org.localsend.localsend_app md.obsidian.Obsidian com.google.Chrome \
            com.obsproject.Studio.Plugin.OBSVkCapture \
            com.obsproject.Studio.Plugin.PipeWireAudioCapture \
            org.freedesktop.Platform.VulkanLayer.OBSVkCapture \
            com.heroicgameslauncher.hgl net.lutris.Lutris net.davidotek.pupgui2 \
            com.github.Matoking.protontricks
          do
            if grep -qx "${want}" /tmp/ids.txt; then ok "on the list: ${want}"
            else bad "MISSING from the list: ${want}"; fi
          done

          # Firefox must NOT be on it: it is an ordinary system package, so it
          # works on a machine that has never been online. Listing it as well
          # would mean downloading a second browser nobody asked for.
          if grep -qx 'org.mozilla.firefox' /tmp/ids.txt; then
            bad "Firefox is on the Flatpak list as well as being an installed package — that is a second, duplicate browser"
          else
            ok "Firefox is not on the Flatpak list (it is a system package — correct)"
          fi
          if rpm -q firefox >/dev/null 2>&1; then ok "firefox is installed as a system package"
          else bad "firefox is neither a package nor on the Flatpak list — this image has no browser"; fi

          # A block without Branch= installs nothing, silently.
          blocks="$(grep -c '^\[Flatpak Preinstall ' "${LIST}")"
          branches="$(grep -c '^Branch=' "${LIST}")"
          if [ "${blocks}" -eq "${branches}" ]; then ok "all ${blocks} entries name a branch"
          else bad "${blocks} entries but ${branches} Branch= lines — an entry without one installs nothing, silently"; fi

          # The plug-ins are runtime extensions, not applications, and Flatpak
          # will not find one without IsRuntime=true.
          runtimes="$(grep -c '^IsRuntime=true' "${LIST}")"
          if [ "${runtimes}" -ge 5 ]; then ok "${runtimes} entries are marked IsRuntime=true (the OBS plug-ins and the Vulkan layer)"
          else bad "only ${runtimes} entries are marked IsRuntime=true — a plug-in without it is never found"; fi

          # The installer must be PRESENT and must NOT be switched on. Since
          # 2026-09-04 the app chooser asks the person which apps they want;
          # an image that enables this service downloads about ten gigabytes
          # before anybody has been asked, which is the behaviour we removed.
          # NOT `systemctl is-enabled` as a yes/no: a unit with no [Install]
          # section prints "static" and EXITS ZERO, so asking it that way says
          # "switched on" about a service nothing can switch on. Read what
          # actually decides it — the [Install] section and the .wants links.
          PREUNIT=/usr/lib/systemd/system/aquarius-flatpak-preinstall.service
          if [ ! -r "${PREUNIT}" ]; then
            bad "${PREUNIT} is missing — 'aq apps install --all' would have nothing to run"
          elif grep -q '^\[Install\]' "${PREUNIT}"; then
            bad "the installer has an [Install] section — it would fetch every app before the person was asked; the chooser is supposed to ask first"
          else
            ok "the installer has no [Install] section, so nothing switches it on (correct — the chooser asks first)"
          fi
          WANTS="$(find /etc/systemd/system /usr/lib/systemd/system -name 'aquarius-flatpak-preinstall.service' -path '*.wants/*' 2>/dev/null | sort || true)"
          if [ -n "${WANTS}" ]; then
            bad "something linked the installer into a .wants folder, which starts it at boot:"
            printf '%s\n' "${WANTS}" | sed 's/^/       /'
          else
            ok "and nothing has linked it into a .wants folder either"
          fi
          if [ -x /usr/libexec/aquarius-flatpak-preinstall ]; then ok "the installer script is there and runnable"
          else bad "/usr/libexec/aquarius-flatpak-preinstall is missing"; fi

          # The permissions, on the other hand, MUST be switched on. They are a
          # separate service precisely because the apps now arrive from the
          # chooser: an app installed by somebody else's hand still needs them,
          # and OBS with no camera permission is a silent failure.
          OVRSTATE="$(systemctl is-enabled aquarius-flatpak-overrides.service 2>&1 || true)"
          if [ "${OVRSTATE}" = "enabled" ]; then
            ok "the permissions service is switched on"
          else
            bad "aquarius-flatpak-overrides.service says '${OVRSTATE}', not 'enabled' — OBS would install and then not see a camera"
          fi

          # And it must actually do the copying when run.
          rm -rf /var/lib/flatpak/overrides
          /usr/libexec/aquarius-flatpak-preinstall --overrides-only >/tmp/ovr.txt 2>&1
          COPIED="$(find /var/lib/flatpak/overrides -type f 2>/dev/null | wc -l)"
          SHIPPED="$(find /usr/share/aquarius/flatpak-overrides -type f ! -name '*.md' | wc -l)"
          if [ "${COPIED}" -eq "${SHIPPED}" ] && [ "${COPIED}" -gt 0 ]; then
            ok "--overrides-only put all ${COPIED} permission files in place"
          else
            bad "--overrides-only placed ${COPIED} of ${SHIPPED} permission files:"
            sed 's/^/       /' /tmp/ovr.txt
          fi

          # A permission somebody set themselves is never overwritten.
          printf '[Context]\nfilesystems=home;\n' > /var/lib/flatpak/overrides/com.obsproject.Studio
          /usr/libexec/aquarius-flatpak-preinstall --overrides-only >/dev/null 2>&1
          if grep -q '^filesystems=home;$' /var/lib/flatpak/overrides/com.obsproject.Studio; then
            ok "a permission file somebody edited themselves is left alone"
          else
            bad "it overwrote a permission file the person had set — Flatseal changes would be lost at every boot"
          fi
          rm -rf /var/lib/flatpak/overrides

          # ------------------------------------------------------------------
          # RUN THE REAL PARSER AGAINST THE REAL FILE
          # ------------------------------------------------------------------
          # This is the check that was missing on 2026-09-04, when a reading
          # fault made the installer see zero apps on a full list and write the
          # "never look again" marker. Every check above reads the list file;
          # none of them ran the code that reads it on a real machine. These do.
          PARSED="$(/usr/libexec/aquarius-flatpak-preinstall --list | wc -l)"
          if [ "${PARSED}" -eq "${blocks}" ]; then
            ok "the installer's own parser finds all ${PARSED} apps"
          else
            bad "the parser finds ${PARSED} apps but the list holds ${blocks} — a machine would install the wrong set, or nothing"
          fi

          # THE EXACT BENCH CONDITION. /etc/flatpak/preinstall.d/ is empty on
          # every new machine — nobody has changed anything yet — and that
          # empty folder is what broke the reading. Prove it is harmless.
          rm -rf /etc/flatpak/preinstall.d
          mkdir -p /etc/flatpak/preinstall.d
          PARSED_EMPTY="$(/usr/libexec/aquarius-flatpak-preinstall --list | wc -l)"
          if [ "${PARSED_EMPTY}" -eq "${blocks}" ]; then
            ok "with an empty /etc/flatpak/preinstall.d (a brand-new machine) it still finds all ${PARSED_EMPTY}"
          else
            bad "with an empty /etc/flatpak/preinstall.d it finds ${PARSED_EMPTY} of ${blocks} — this is the 2026-09-04 fault, back again"
          fi

          # And an empty answer must be a loud failure, never a quiet success
          # that writes the marker. Checked by hiding the list from it.
          mv /usr/share/flatpak/preinstall.d /usr/share/flatpak/preinstall.d.hidden
          rm -f /etc/aquarius/flatpak-preinstall-done
          if /usr/libexec/aquarius-flatpak-preinstall >/tmp/empty.txt 2>&1; then
            bad "with no list at all the installer reported SUCCESS — that is how a machine silently never gets its apps"
          else
            ok "with no list at all the installer fails loudly (exit $?) instead of pretending it is done"
          fi
          if grep -q 'ERROR' /tmp/empty.txt; then ok "and it says ERROR in plain words"
          else bad "it failed without saying why:"; sed 's/^/       /' /tmp/empty.txt; fi
          if [ -e /etc/aquarius/flatpak-preinstall-done ]; then
            bad "it wrote the 'already done' marker on an empty list — the machine would never try again"
          else
            ok "it wrote no 'already done' marker (correct — it must try again)"
          fi
          mv /usr/share/flatpak/preinstall.d.hidden /usr/share/flatpak/preinstall.d

          # ------------------------------------------------------------------
          # THE CATALOG THE CHOOSER WINDOW IS DRAWN FROM
          # ------------------------------------------------------------------
          CAT=/usr/share/aquarius/apps/catalog.ini
          if [ -s "${CAT}" ]; then ok "the app catalog is in the image"
          else bad "${CAT} is missing — the chooser would have no names to show"; fi

          /usr/libexec/aquarius-flatpak-preinstall --catalog > /tmp/catalog.txt 2>/tmp/catalog.err
          CAT_RC=$?
          if [ "${CAT_RC}" -eq 0 ]; then ok "--catalog describes every app on the list"
          else bad "--catalog failed (exit ${CAT_RC}):"; sed 's/^/       /' /tmp/catalog.err; fi

          # ⚠️ THE CATALOG IS BIGGER THAN THE FLATPAK LIST SINCE 2026-09-04.
          # Aquarius Editor is not a Flatpak, so it has no block in Flatpak's
          # file at all — it lives only in catalog.ini, marked Type=appimage.
          # The catalog is the UNION, and that is what is checked.
          OURS="$(/usr/libexec/aquarius-flatpak-preinstall --list-appimage 2>/dev/null | grep -c . || true)"
          CAT_LINES="$(wc -l < /tmp/catalog.txt)"
          if [ "${CAT_LINES}" -eq "$(( blocks + OURS ))" ]; then
            ok "${CAT_LINES} catalog lines for ${blocks} Flatpaks and ${OURS} app(s) of ours"
          else
            bad "${CAT_LINES} catalog lines for ${blocks} Flatpaks + ${OURS} of ours — the chooser would show the wrong set"
          fi
          if [ "${OURS}" -ge 1 ]; then
            ok "${OURS} app(s) of ours are offered as downloads:"
            /usr/libexec/aquarius-flatpak-preinstall --list-appimage | sed 's/^/       /'
          else
            bad "NO app of ours is offered as a download — Aquarius Editor is neither in the image nor in the catalog, so nobody could ever get it"
          fi

          # The contract other programs read. Eight fields for a Flatpak, plus
          # the ninth (type:) that every line carries since 2026-09-04, and four
          # more on one of ours: source:, pin:, asset:, sha256sums:.
          FIELDS="$(awk -F'\t' '{print NF}' /tmp/catalog.txt | sort -un | tr '\n' ' ')"
          if [ "${FIELDS}" = "9 13 " ] || [ "${FIELDS}" = "9 " ]; then
            ok "every catalog line has the promised fields (${FIELDS}per line)"
          else
            bad "catalog lines have ${FIELDS}fields — a Flatpak line must have 9 and one of ours 13"
          fi
          # And the ninth field must really say which kind each one is.
          if awk -F'\t' '$9 !~ /^type:(flatpak|appimage)$/' /tmp/catalog.txt | grep -q .; then
            bad "a catalog line does not say what kind of app it is:"
            awk -F'\t' '$9 !~ /^type:(flatpak|appimage)$/ {print "       " $1 " -> " $9}' /tmp/catalog.txt
          else
            ok "every line says whether it is a Flatpak or one of ours"
          fi

          # Six shelves since R4, when Gaming was added (build_files/68-gaming.sh).
          SHELVES='^(Video|Audio|Design|Streaming|Utilities|Gaming)$'
          if awk -F'\t' -v s="${SHELVES}" '$4 !~ s' /tmp/catalog.txt | grep -q .; then
            bad "an app names a category the chooser cannot draw:"
            awk -F'\t' -v s="${SHELVES}" '$4 !~ s {print "       " $1 " -> " $4}' /tmp/catalog.txt
          else
            ok "every app sits on one of the six shelves the chooser draws"
          fi

          # The apps a person picks from, and the plug-ins that follow OBS
          # Studio. Derived from the shipped list rather than written down as a
          # number, so that adding an app to AquariusOS does not mean editing
          # this file — the invariant is that the two agree, not that either is
          # any particular size. The floor is there so an empty catalog, which
          # would satisfy "they agree" perfectly, still fails.
          VISIBLE="$(awk -F'\t' '$6=="runtime:no"' /tmp/catalog.txt | wc -l)"
          HIDDEN="$(awk -F'\t' '$6=="runtime:yes"' /tmp/catalog.txt | wc -l)"
          EXPECT_VISIBLE=$(( blocks - runtimes + OURS ))
          if [ "${VISIBLE}" -eq "${EXPECT_VISIBLE}" ] && [ "${HIDDEN}" -eq "${runtimes}" ] && [ "${VISIBLE}" -ge 10 ]; then
            ok "the chooser would offer ${VISIBLE} apps and quietly bring ${HIDDEN} plug-ins with OBS"
          else
            bad "the chooser would offer ${VISIBLE} apps with ${HIDDEN} plug-ins — the shipped list says ${EXPECT_VISIBLE} and ${runtimes}"
          fi

          # Every plug-in must say which app it belongs to, or it can never be
          # installed: the chooser never offers one directly.
          if awk -F'\t' '$6=="runtime:yes" && $7=="requires:-"' /tmp/catalog.txt | grep -q .; then
            bad "a plug-in does not say which app it belongs to, so nothing would ever install it:"
            awk -F'\t' '$6=="runtime:yes" && $7=="requires:-" {print "       " $1}' /tmp/catalog.txt
          else
            ok "every plug-in names the app it arrives with"
          fi

          echo "-- what the chooser will show --"
          awk -F'\t' '$6=="runtime:no" {printf "     [%s] %-28s %s\n", ($5=="recommended:yes" ? "x" : " "), $2, $4}' /tmp/catalog.txt

          # ------------------------------------------------------------------
          # THE LAST PAGE OF THAT WINDOW — read back out of the finished image
          # ------------------------------------------------------------------
          # ⚠️ THE 2026-09-04 BENCH FAULT. "All set." was drawn with a widget
          # that cannot carry the Aquarius mark, so the page you land on after
          # installing was blank at the top, and its main button offered to
          # open whichever app happened to install first rather than showing
          # you the apps. Both are fixed; these two checks are what stops them
          # coming back. The build already checks the same things in
          # build_files/66-creator-apps-chooser.sh — this asks the copy that is
          # actually in the image.
          CHOOSER=/usr/libexec/aquarius-creator-apps
          if grep -q 'mark, self\.done_title, self\.done_blurb = hero(' "${CHOOSER}"; then
            ok "the 'All set.' page is built from the same hero helper as page 1, so it carries the mark"
          else
            bad "the done page does not use the hero helper — it would have no Aquarius mark on it"
          fi
          if grep -q 'Adw\.StatusPage(' "${CHOOSER}"; then
            bad "the done page is an Adw.StatusPage again, which cannot show the mark"
          else
            ok "nothing in that window is an Adw.StatusPage"
          fi
          if grep -q 'pill_button("Open apps", suggested=True)' "${CHOOSER}"; then
            ok "the suggested button on that page is 'Open apps'"
          else
            bad "the done page's suggested button is not 'Open apps'"
          fi
          if grep -q 'first_app' "${CHOOSER}"; then
            bad "the done page still opens one app on the person's behalf"
          else
            ok "it no longer picks a single app to open"
          fi
          # Two desktops, two routes. (Until 2026-09-15 the first of these was
          # the Aquarius Session's own search palette, `qs ipc call search
          # toggle`; Plasma's KRunner took its place.)
          if grep -q '"org.kde.krunner"' "${CHOOSER}" \
             && grep -q '"ShowApplications"' "${CHOOSER}"; then
            ok "'Open apps' knows both desktops: KDE's KRunner and GNOME's app grid"
          else
            bad "'Open apps' is missing one of its two routes (org.kde.krunner / org.gnome.Shell.ShowApplications)"
          fi

          # ------------------------------------------------------------------
          # THE PASSWORD SPLIT — the point of the 2026-09-04 change
          # ------------------------------------------------------------------
          # Aquarius Editor goes into the person's OWN home folder, so nothing
          # about installing it needs an administrator. Asking for a password to
          # write inside somebody's home folder would be theatre — and worse
          # than theatre, because the password prompt is the one part of this
          # feature that has actually failed on the bench (2026-09-04, no polkit
          # agent in the Aquarius session).
          #
          # Read with the chooser's own parser, in the finished image, because
          # "does it ask for a password" is not something a screenshot answers.
          echo
          echo "== picking only Aquarius Editor asks for no password =="
          "${CHOOSER}" --dry-run --select os.aquarius.editor > /tmp/ed.txt 2>&1 || true
          sed 's/^/       /' /tmp/ed.txt
          if grep -qx 'password prompts: 0' /tmp/ed.txt; then
            ok "no password prompt at all when only our own app is chosen"
          else
            bad "choosing only Aquarius Editor would still ask for a password"
          fi
          if grep -q '^  appimage: 1 app(s), steps 1-1 of 1' /tmp/ed.txt; then
            ok "and it goes to the home-folder installer"
          else
            bad "it does not go to the home-folder installer"
          fi

          echo "== picking both kinds runs two installers behind one bar =="
          "${CHOOSER}" --dry-run --select os.aquarius.editor,org.kde.kdenlive > /tmp/mix.txt 2>&1 || true
          sed 's/^/       /' /tmp/mix.txt
          if grep -qx 'installer runs: 2' /tmp/mix.txt && grep -qx 'password prompts: 1' /tmp/mix.txt; then
            ok "two installers, one password prompt, for the Flathub half only"
          else
            bad "the two-installer split is not what it should be"
          fi
          # Steps numbered straight through rather than restarting at one, which
          # is what --step-offset is for. Without it the bar jumps backwards.
          if grep -q 'steps 1-1 of 2' /tmp/mix.txt && grep -q 'steps 2-2 of 2' /tmp/mix.txt; then
            ok "the steps are numbered 1 and 2 of 2 across both installers"
          else
            bad "the two installers do not share one numbering — the progress bar would jump back to the start"
          fi

          # And the Included group must NOT claim the Editor any more: it is a
          # card now, and saying "Included" about an app that is not there is
          # the worst of both arrangements.
          if grep -q '"aquarius-editor.desktop"' "${CHOOSER}"; then
            bad "the chooser still lists Aquarius Editor as Included with AquariusOS — it is a download now"
          else
            ok "the chooser no longer claims Aquarius Editor is already installed"
          fi
          if grep -q '"aquarius-writer.desktop"' "${CHOOSER}"; then
            ok "Aquarius Writer is still shown as Included, because it really is"
          else
            bad "the chooser no longer shows Aquarius Writer as Included"
          fi

          # ------------------------------------------------------------------
          # `aq apps` — the same job in a terminal
          # ------------------------------------------------------------------
          # It must be discoverable (in `aq --help`) and it must agree with the
          # catalog rather than carry a list of its own.
          if aq --help 2>&1 | grep -q 'aq apps'; then ok "'aq apps' is in aq's own help"
          else bad "'aq apps' is not mentioned by 'aq --help' — nobody would find it"; fi

          # Count only the catalog rows: two spaces, then "installed" or "-",
          # then the app's id. `aq apps list` goes on to print everything the
          # Installer has added, and on a fresh image that section is one
          # sentence: "Nothing has been installed with Aquarius Installer
          # yet." — which a looser 'installed' match counted as a 17th app on
          # 2026-09-09.
          AQ_LISTED="$(aq apps list 2>/dev/null | grep -cE '^  (installed|-) +[A-Za-z0-9._-]+ ')"
          if [ "${AQ_LISTED}" -eq "${VISIBLE}" ]; then
            ok "'aq apps list' shows the same ${AQ_LISTED} apps as the catalog"
          else
            bad "'aq apps list' shows ${AQ_LISTED} apps but the catalog has ${VISIBLE}"
          fi

          if aq apps status >/tmp/aqstatus.txt 2>&1; then ok "'aq apps status' runs"
          else bad "'aq apps status' failed:"; sed 's/^/       /' /tmp/aqstatus.txt; fi
          if grep -q 'flatpak preinstall -y --system' /tmp/aqstatus.txt; then
            ok "and it names the rescue command when apps are missing"
          else
            bad "'aq apps status' does not tell somebody how to install the missing apps"
          fi

          # A plug-in must never be installable by name — it belongs to an app.
          if aq apps install com.obsproject.Studio.Plugin.Gstreamer >/dev/null 2>&1; then
            bad "'aq apps install' accepted a plug-in as though it were an app"
          else
            ok "'aq apps install' refuses a plug-in and points at the app it belongs to"
          fi

          # Aquarius Editor has to be findable from the terminal too — as
          # available, not installed, because it is not in this image.
          if aq apps list 2>/dev/null | grep -q 'os.aquarius.editor'; then
            ok "'aq apps list' offers Aquarius Editor"
          else
            bad "'aq apps list' does not mention Aquarius Editor — nobody would find it from a terminal"
          fi
          if aq apps list 2>/dev/null | grep 'os.aquarius.editor' | grep -q 'installed'; then
            bad "'aq apps list' says Aquarius Editor is installed, and it is not in this image"
          else
            ok "and says it is not installed yet, which is the truth on a fresh image"
          fi
          for sub in update remove; do
            if aq apps 2>&1 | grep -q "aq apps ${sub}"; then
              ok "'aq apps ${sub}' is in the help"
            else
              bad "'aq apps ${sub}' is not mentioned in 'aq apps' help"
            fi
          done
          if aq apps update >/tmp/aqup.txt 2>&1; then
            ok "'aq apps update' runs"
          else
            ok "'aq apps update' ran and reported (exit non-zero is fine with no network)"
          fi
          sed 's/^/       /' /tmp/aqup.txt
          if grep -q 'not installed' /tmp/aqup.txt; then
            ok "and says Aquarius Editor is not installed on this image, which is right"
          else
            bad "'aq apps update' did not say what it found"
          fi

          # ====================================================================
          # 3. THE EXTRA PERMISSIONS
          # ====================================================================
          echo
          echo "== the extra permissions creator apps need =="
          # Read back through Flatpak's own parser, not by looking at the text.
          # /var/lib/flatpak/overrides is the ONLY folder Flatpak reads these
          # from — checked in Flatpak's source, because the two folders one
          # would guess are not read at all — and /var is scratch space in a
          # container, so this leaves nothing behind.
          mkdir -p /var/lib/flatpak/overrides

          # A known-good file first, so that "Flatpak cannot do this in a
          # container" is never mistaken for "our permission file is wrong".
          printf '[Context]\nshared=network;\n' > /var/lib/flatpak/overrides/com.aquariusos.OverrideSelfTest
          if flatpak override --system com.aquariusos.OverrideSelfTest >/tmp/ctl.txt 2>&1; then
            ok "Flatpak can read permission files here, so it is the judge"
          else
            bad "Flatpak cannot read even a known-good permission file — this check cannot say anything about ours"
            sed 's/^/       /' /tmp/ctl.txt
          fi
          rm -f /var/lib/flatpak/overrides/com.aquariusos.OverrideSelfTest

          for f in /usr/share/aquarius/flatpak-overrides/*; do
            base="$(basename "${f}")"
            case "${base}" in *.md) continue ;; esac
            cp "${f}" "/var/lib/flatpak/overrides/${base}"

            # ⚠️ NO --show ON THIS FIRST CALL, AND THAT IS THE WHOLE POINT.
            # `--show` prints the file back and checks almost nothing. Without
            # it, Flatpak actually interprets every key and value, which is the
            # path that rejects a misspelt permission like `xdg-vidoes` — a
            # mistake that is otherwise completely silent on a real machine.
            if out="$(flatpak override --system "${base}" 2>&1)"; then
              shown="$(flatpak override --system --show "${base}" 2>&1)"
              ok "${base} — Flatpak accepts it: $(printf '%s' "${shown}" | grep -v '^\[' | grep -v '^$' | tr '\n' ' ')"
            else
              bad "${base} — Flatpak refuses this permission file"
              printf '%s\n' "${out}" | sed 's/^/       /'
            fi
            rm -f "/var/lib/flatpak/overrides/${base}"
          done

          # OBS is the one that genuinely cannot work without help: no camera,
          # no capture card and no virtual camera without devices=all.
          if grep -qE '^devices=.*all' /usr/share/aquarius/flatpak-overrides/com.obsproject.Studio; then
            ok "OBS is granted the cameras and capture cards"
          else
            bad "OBS's override does not grant devices=all — its camera list would be empty"
          fi
          # And nothing may take the lazy way out.
          grep -lE '^filesystems=(.*;)?host(;|$)' /usr/share/aquarius/flatpak-overrides/* >/tmp/host.txt 2>/dev/null || true
          if [ -s /tmp/host.txt ]; then
            bad "these grant filesystems=host, which is the same as no sandbox at all:"; sed 's/^/       /' /tmp/host.txt
          else
            ok "no app is granted the whole computer (never filesystems=host)"
          fi

          # ====================================================================
          # 4. WHERE THE APPS APPEAR
          # ====================================================================
          echo
          echo "== the dock and the app grid =="
          FAV="$(GSETTINGS_BACKEND=memory gsettings get org.gnome.shell favorite-apps)"
          echo "  GNOME dock: ${FAV}"
          for want in aquarius-editor.desktop aquarius-writer.desktop; do
            if printf '%s' "${FAV}" | grep -q "${want}"; then ok "GNOME dock pins ${want}"
            else bad "GNOME dock does not pin ${want}"; fi
          done
          # Every name on that line has to be a real file, or the icon is
          # simply missing with no error anywhere.
          #
          # ⚠️ ONE DELIBERATE EXCEPTION SINCE 2026-09-04. Aquarius Editor is
          # pinned here and is NOT in the image: its menu entry lands in each
          # person's own ~/.local/share/applications/ when they install it. It
          # stays pinned on purpose — GNOME does not draw a name it cannot
          # resolve (no gap, no dead square, no error), and the moment the app
          # is installed the same name resolves and the icon takes the seat it
          # has always had. Named explicitly, not a wildcard, so a real typo in
          # any other name still fails. build_files/50-aquarius-desktop.sh
          # carries the same exception and the same note.
          printf '%s' "${FAV}" | tr -d "[]' " | tr ',' '\n' | grep -v '^$' > /tmp/fav.txt
          while read -r fav; do
            if [ -r "/usr/share/applications/${fav}" ]; then ok "  dock: ${fav}"
            elif [ "${fav}" = "aquarius-editor.desktop" ]; then
              ok "  dock: ${fav} (installed into each person's home folder on request)"
            else bad "  dock: ${fav} is pinned but is not in this image"; fi
          done < /tmp/fav.txt

          # ⚠️ THERE WAS A SECOND DOCK HERE UNTIL 2026-09-15. The Aquarius
          # Session shipped its own dock with its own default list, at
          # /etc/skel/.config/aquarius-shell/dock.json, and this block checked
          # it too. That desktop was retired
          # (../docs/decision-2026-09-15-two-desktops.md) and the file is gone.
          # GNOME's dock is Dash to Dock, whose list is the favourite-apps
          # setting checked just above; KDE Plasma's task manager keeps its own
          # list per person and there is nothing of ours to check.
          if [ -e /etc/skel/.config/aquarius-shell/dock.json ]; then
            bad "/etc/skel/.config/aquarius-shell/dock.json is still here — it belonged to the retired Aquarius Session"
          else
            ok "no leftover dock list from the retired Aquarius Session"
          fi

          # ====================================================================
          # 5. THE INGEST HELPER
          # ====================================================================
          echo
          echo "== the ingest helper (the flagship feature) =="
          if /usr/bin/aq-ingest --version >/dev/null 2>&1; then ok "aq-ingest runs: $(/usr/bin/aq-ingest --version)"
          else bad "aq-ingest does not run"; fi
          if /usr/bin/aq ingest --help 2>&1 | grep -q 'make camera files open in a video editor'; then
            ok "'aq ingest' is wired up"
          else
            bad "'aq ingest --help' does not print its help — the subcommand is not wired up"
          fi
          if /usr/bin/aq --help 2>&1 | grep -q 'aq ingest'; then ok "'aq --help' tells people it exists"
          else bad "'aq --help' does not mention ingest"; fi
          if [ -r /usr/share/nautilus-python/extensions/aquarius_editor_ready.py ]; then
            ok "the 'Make Editor-Ready' right-click menu is installed"
          else
            bad "the right-click menu is missing"
          fi
          for u in aq-ingest-watch.path aq-ingest-watch.service; do
            if [ -r "/usr/lib/systemd/user/${u}" ]; then ok "${u} is installed"
            else bad "/usr/lib/systemd/user/${u} is missing"; fi
          done
          if [ -e /usr/lib/systemd/user/default.target.wants/aq-ingest-watch.path ]; then
            bad "the watch folder is switched on by default — it must be opt-in"
          else
            ok "the watch folder is off until asked for (correct)"
          fi
          if [ -x /usr/libexec/aquarius-ingest-watch ]; then ok "the watch-folder helper is there"
          else bad "/usr/libexec/aquarius-ingest-watch is missing"; fi

          # ====================================================================
          # 6. THE VIRTUAL CAMERA
          # ====================================================================
          echo
          echo "== the virtual camera (OBS's Start Virtual Camera button) =="
          STAMP=/usr/share/aquarius/virtual-camera.txt
          if [ ! -r "${STAMP}" ]; then
            bad "${STAMP} is missing — the build did not record whether the virtual camera is in this image"
          else
            sed 's/^/     /' "${STAMP}"
            STATUS="$(sed -n 's/^status=//p' "${STAMP}")"
            KVER="$(ls -1 /usr/lib/modules/)"
            case "${STATUS}" in
              installed)
                if find "/usr/lib/modules/${KVER}" -name 'v4l2loopback.ko*' | grep -q .; then
                  ok "the module is in the image, for kernel ${KVER}"
                else
                  bad "the build says the virtual camera is installed, and there is no v4l2loopback module for ${KVER}"
                fi
                if grep -q 'v4l2loopback' "/usr/lib/modules/${KVER}/modules.dep"; then
                  ok "the kernel's index knows about it"
                else
                  bad "v4l2loopback is not in modules.dep — the kernel would not find it"
                fi
                if grep -qx 'v4l2loopback' /usr/lib/modules-load.d/aquarius-v4l2loopback.conf; then
                  ok "it is loaded at boot"
                else
                  bad "nothing loads it at boot, so the Virtual Camera button would still fail"
                fi
                if grep -q 'exclusive_caps=1' /usr/lib/modprobe.d/aquarius-v4l2loopback.conf; then
                  ok "exclusive_caps=1 (without it browsers show a black camera)"
                else
                  bad "exclusive_caps is not set — the virtual camera would be listed and black"
                fi
                ;;
              unavailable)
                # This used to be a warning and a shrug. Since 2026-09-04 the
                # kernel is pinned to the one Universal Blue's modules were
                # built for (build_files/58-kernel-pin.sh), so `unavailable`
                # cannot happen in a build that finished — and if it somehow
                # does, the image is missing a feature it claims to have.
                bad "the image says the virtual camera is NOT in it. The kernel is pinned now, so this should be impossible — see /usr/share/aquarius/kernel.txt above and docs/restart/kernel.md"
                ;;
              *)
                bad "${STAMP} says status=${STATUS}, which is not a status this check knows"
                ;;
            esac
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The creator layer in this image is wrong. Do not publish it."
            exit 1
          fi
          echo "All creator-layer checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-creator.sh

      # ==================================================================
      # THE WELCOME — the first three minutes, read back out of the image
      # ==================================================================
      # This is the window a brand-new person actually meets first: keyboard
      # style, then the creator apps, then a page of tips. build_files/
      # 67-welcome.sh checks it during the build; this asks the copy that is
      # really in the finished image, which is the habit the whole repo runs on.
      #
      # The two things that would be invisible in a screenshot and expensive on
      # somebody's first login:
      #
      #   * Mac must still be the preselected answer. Four things in this OS
      #     have to agree that Mac is the default and this is the one a person
      #     SEES.
      #   * Exactly ONE thing may open at login. ⚠️ This used to be TWO checks:
      #     the retired Aquarius Session did not read /etc/xdg/autostart at all,
      #     so the same fact was written down twice and could drift. GNOME and
      #     KDE Plasma both read that folder, so there is one file now.
      - name: Check the welcome flow in the finished image
        run: |
          set -euo pipefail
          cat > /tmp/verify-welcome.sh <<'SCRIPT'
          set -uo pipefail
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          WELCOME=/usr/libexec/aquarius-welcome
          CHOOSER=/usr/libexec/aquarius-creator-apps
          AUTOSTART=/etc/xdg/autostart/aquarius-welcome-firstrun.desktop
          OLD=/etc/xdg/autostart/aquarius-creator-apps-firstrun.desktop

          echo "== the welcome is in the image =="
          if [ -x "${WELCOME}" ]; then ok "${WELCOME} is here and runnable"
          else bad "${WELCOME} is missing"; fi
          if [ -r /usr/share/aquarius/welcome.env ]; then
            ok "the build recorded what it did:"
            sed 's/^/       /' /usr/share/aquarius/welcome.env
          else
            bad "/usr/share/aquarius/welcome.env is missing — the build did not record what it did"
          fi

          echo
          echo "== the three steps, as the image itself describes them =="
          "${WELCOME}" --dry-run > /tmp/wel.txt 2>&1 || true
          sed 's/^/       /' /tmp/wel.txt
          if grep -qx 'steps: 3' /tmp/wel.txt; then ok "a brand-new account gets three steps"
          else bad "a brand-new account does not get three steps"; fi
          if grep -q '^step 2 of 3: apps' /tmp/wel.txt \
             && grep -qF "runs: ${CHOOSER} --embedded-flow" /tmp/wel.txt; then
            ok "step 2 runs the real creator-apps window, not a copy of it"
          else
            bad "step 2 does not run ${CHOOSER} --embedded-flow"
          fi

          echo
          echo "== Mac is still the preselected answer =="
          if grep -qx 'default choice: mac' /tmp/wel.txt; then
            ok "Mac is what the window opens on, as it is everywhere else in this OS"
          else
            bad "Mac is NOT the preselected keyboard style — the OS now disagrees with itself on its own first screen"
          fi
          if grep -q 'choice mac: Mac — Copy is ⌘C' /tmp/wel.txt \
             && grep -q 'choice windows: Windows — Copy is Ctrl+C' /tmp/wel.txt; then
            ok "both cards say what they mean in one keystroke each"
          else
            bad "the two keyboard cards no longer show their example keystroke"
          fi

          echo
          echo "== an account that already chose its apps is not asked again =="
          "${WELCOME}" --dry-run --pretend-apps-seen > /tmp/wel2.txt 2>&1 || true
          sed 's/^/       /' /tmp/wel2.txt
          if grep -qx 'steps: 2' /tmp/wel2.txt && grep -qx 'apps step: skipped' /tmp/wel2.txt; then
            ok "it gets the keyboard question and the last page, and nothing else"
          else
            bad "an existing account would be asked to choose its apps all over again"
          fi

          echo
          echo "== the keyboard answer goes through 'aq keys' and nowhere else =="
          if grep -q '\[AQ, "keys", mode\]' "${WELCOME}"; then
            ok "it runs the same command a person would type"
          else
            bad "it no longer delegates to 'aq keys'"
          fi
          if grep -qE 'mode=(mac|windows)' "${WELCOME}"; then
            bad "it carries a copy of the keys.conf format — two writers of one file is two ways to disagree"
          else
            ok "it carries no copy of the keys.conf file format"
          fi

          echo
          echo "== exactly one thing opens at login, and both desktops read it =="
          if [ -e "${OLD}" ]; then
            bad "${OLD} is still here — the creator-apps window would open twice at a first login"
          else
            ok "the old creator-apps first-login entry is gone"
          fi
          if [ -e /usr/share/aquarius/labwc/autostart ]; then
            bad "the retired Aquarius Session's autostart file is still in the image"
          else
            ok "no second autostart file from the retired Aquarius Session"
          fi
          if [ -r "${AUTOSTART}" ]; then
            ok "the welcome's first-login entry is here"
            CMD="$(sed -n 's/^Exec=//p' "${AUTOSTART}" | head -n 1)"
            echo "       it runs: ${CMD}"
            # /etc/xdg/autostart is the shared freedesktop folder. GNOME reads
            # it and so does KDE Plasma, so one file covers both desktops — the
            # write-it-twice problem is simply gone.
            for s in gnome plasma; do
              if [ -r "/usr/share/wayland-sessions/${s}.desktop" ]; then
                ok "  ${s} is in this image, and reads /etc/xdg/autostart"
              else
                bad "  ${s} is missing, so the welcome would only open on one desktop"
              fi
            done
          else
            bad "${AUTOSTART} is missing — a first login would show no welcome at all"
          fi
          # Guarded, because desktop-file-validate is a build-time tool that the
          # image is not obliged to keep. Its absence is not a fault in the
          # welcome, and reporting it as one would be a check that lies.
          if command -v desktop-file-validate >/dev/null 2>&1; then
            if desktop-file-validate "${AUTOSTART}" \
               && desktop-file-validate /usr/share/applications/aquarius-welcome.desktop; then
              ok "both menu entries are well-formed"
            else
              bad "one of the welcome's two menu entries is not a well-formed desktop entry"
            fi
          else
            echo "  note desktop-file-validate is not in this image; the build already validated both entries"
          fi

          echo
          echo "== 'aq welcome' is the way back to it =="
          if aq --help 2>&1 | grep -q 'aq welcome'; then
            ok "'aq welcome' is in aq's own help, so it is findable"
          else
            bad "'aq welcome' is not mentioned by 'aq --help' — nobody would find it"
          fi
          if aq welcome --help > /tmp/welhelp.txt 2>&1; then
            ok "'aq welcome --help' works"
          else
            bad "'aq welcome --help' failed:"; sed 's/^/       /' /tmp/welhelp.txt
          fi

          echo
          echo "== the creator-apps window is still an ordinary app =="
          # The whole change would be a regression if "Aquarius Apps" stopped
          # working on its own.
          if "${CHOOSER}" --dry-run > /tmp/chooser.txt 2>&1; then
            ok "'Aquarius Apps' still reads its list exactly as it did before"
          else
            bad "the --embedded-flow change broke the ordinary chooser:"
            sed 's/^/       /' /tmp/chooser.txt
          fi
          if grep -q 'subtitle="Step 2 of 3" if embedded else ""' "${CHOOSER}"; then
            ok "and it only claims to be 'Step 2 of 3' when the welcome opened it"
          else
            bad "the chooser's step subtitle is not conditional — it would say 'Step 2 of 3' when opened on its own"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The welcome flow in this image is wrong. Do not publish it."
            exit 1
          fi
          echo "All welcome checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-welcome.sh

      - name: Check the 'Make Editor-Ready' menu really loads in Files
        run: |
          set -euo pipefail
          # WHY THIS IS A CHECK OF ITS OWN
          #
          # The check above proves the extension FILE is in the image. On
          # 2026-09-04 that was true and the menu item still was not there: on
          # the bench, right-clicking an MP4 in Files offered nothing.
          #
          # The reason is that a Python file being present, and even compiling,
          # says nothing about whether it RUNS. This one stopped on its first
          # line, because it demanded extension interface 4.0 while the Nautilus
          # that Fedora 44 ships had already loaded 4.1:
          #
          #   ValueError: Namespace Nautilus is already loaded with version 4.1
          #
          # Files says nothing when an extension fails like that. The menu item
          # is simply absent. So this step loads the extension the way Files
          # loads it — inside the finished image, against the real Nautilus that
          # image ships — and then right-clicks a video at it and insists on
          # getting a menu item back. It is the only check here that runs our
          # extension rather than looking at it.
          #
          # AQ_NAUTILUS_REQUIRED=1 means "you may not skip": the test skips
          # itself where GNOME's libraries are missing, which is right on a Mac
          # and would be a silent hole here.
          podman run --rm --pull=never \
            -v "${GITHUB_WORKSPACE}/ingest/tests/test_nautilus_extension.py:/tmp/test_nautilus_extension.py:ro" \
            -e AQ_NAUTILUS_REQUIRED=1 \
            -e AQ_NAUTILUS_EXT=/usr/share/nautilus-python/extensions/aquarius_editor_ready.py \
            --entrypoint /usr/bin/python3 \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
            /tmp/test_nautilus_extension.py

      - name: Check the NVIDIA image can encode video on the graphics card
        if: matrix.nvidia == 1
        run: |
          set -euo pipefail
          # WHY THIS IS A CHECK OF ITS OWN
          #
          # NVENC is the video encoder built into every modern NVIDIA card. It
          # is the difference between exporting a video in three minutes and
          # exporting it in twenty, and it is the single biggest reason the
          # NVIDIA image is the primary creator target of this project
          # (standing decision 5).
          #
          # ffmpeg only offers it if it was COMPILED with it. Nothing about
          # having an NVIDIA driver installed puts it there, so "we ship the
          # NVIDIA driver" is not evidence, and the only honest question is the
          # one ffmpeg answers itself.
          cat > /tmp/verify-nvenc.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          ffmpeg -hide_banner -encoders > /tmp/enc.txt 2>&1 || true
          echo "== everything this ffmpeg can encode with an NVIDIA card =="
          grep -i 'nvenc\|nvidia\|cuda' /tmp/enc.txt | sed 's/^/     /' || echo "     (nothing at all)"

          for enc in h264_nvenc hevc_nvenc; do
            if grep -qw "${enc}" /tmp/enc.txt; then ok "ffmpeg can encode with ${enc}"
            else bad "ffmpeg has no ${enc} — exports would fall back to the processor and take many times longer"; fi
          done

          echo "== and the decoders that make a camera file play smoothly =="
          ffmpeg -hide_banner -decoders > /tmp/dec.txt 2>&1 || true
          grep -i 'cuvid\|nvdec' /tmp/dec.txt | sed 's/^/     /' || echo "     (none listed)"

          if [ "$fails" -ne 0 ]; then
            echo "::error::This NVIDIA image cannot use the graphics card to encode video."
            exit 1
          fi
          echo "NVENC checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-nvenc.sh

      # ------------------------------------------------------------------------
      # DaVinci Resolve — everything except Resolve
      # ------------------------------------------------------------------------
      # ⚠️ WHAT THIS CAN AND CANNOT PROVE, SAID PLAINLY.
      #
      # There is no DaVinci Resolve here — we may not distribute it — and no
      # graphics card in a GitHub runner. So nothing in CI can show that Resolve
      # starts. What it CAN show is that every piece AquariusOS is responsible
      # for arrived: the container machinery, the graphics-card plumbing, the
      # USB rules for a licence dongle, the app-grid entry, and four scripts
      # that parse.
      #
      # The runtime container has its own workflow and its own checks
      # (.github/workflows/build-resolve-runtime.yml). The real proof of both is
      # the bench: docs/restart/resolve.md.
      - name: Check the DaVinci Resolve support is really in there
        run: |
          set -euo pipefail
          cat > /tmp/verify-resolve.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          echo "== the container machinery Resolve runs inside =="
          for pkg in podman distrobox; do
            if rpm -q "${pkg}" > /dev/null 2>&1; then
              ok "${pkg} $(rpm -q --queryformat '%{VERSION}-%{RELEASE}' "${pkg}")"
            else
              bad "${pkg} is NOT installed — the Resolve container could not be built"
            fi
          done

          echo "== getting the graphics card into that container =="
          if [ "${EXPECTED_NVIDIA}" = "1" ]; then
            if rpm -q nvidia-container-toolkit > /dev/null 2>&1; then
              ok "nvidia-container-toolkit $(rpm -q --queryformat '%{VERSION}' nvidia-container-toolkit)"
            else
              bad "nvidia-container-toolkit is NOT installed — Resolve would say its GPU mode is unsupported"
            fi
            if command -v nvidia-ctk > /dev/null 2>&1; then
              ok "nvidia-ctk, the tool that describes the card to containers, is on the path"
            else
              bad "nvidia-ctk is missing"
            fi
            # The safety-net service, for driver builds without NVIDIA's own.
            # Its two Condition lines are the whole reason it is safe to ship:
            # without the second, it would fight nvidia-cdi-refresh for one file.
            if systemctl is-enabled aquarius-resolve-cdi.service > /dev/null 2>&1; then
              ok "the graphics-card safety-net service is switched on"
            else
              bad "aquarius-resolve-cdi.service is not switched on in the NVIDIA image"
            fi
            if grep -q '^ConditionPathExists=!/usr/lib/systemd/system/nvidia-cdi-refresh.service$' \
                 /usr/lib/systemd/system/aquarius-resolve-cdi.service; then
              ok "it stands down when NVIDIA's own service is present"
            else
              bad "the safety-net service would run alongside NVIDIA's own and fight it for one file"
            fi
          else
            # The AMD/Intel image ships the same file (system_files is one tree)
            # and must leave it switched off.
            if systemctl is-enabled aquarius-resolve-cdi.service > /dev/null 2>&1; then
              bad "the NVIDIA safety-net service is switched on in the AMD/Intel image"
            else
              ok "the NVIDIA safety-net service is correctly off in the AMD/Intel image"
            fi
          fi

          echo "== the scripts =="
          for f in /usr/libexec/aquarius-resolve-install \
                   /usr/libexec/aquarius-resolve-launch \
                   /usr/libexec/aquarius-resolve-update-notify; do
            if [ -x "$f" ]; then ok "$(basename "$f") is present and runnable"
            else bad "$f is missing or not runnable"; fi
            if bash -n "$f" 2>/tmp/syn.txt; then ok "$(basename "$f") is valid shell"
            else bad "$f has a syntax error"; cat /tmp/syn.txt; fi
          done

          echo "== the shared window pieces =="
          # Three windows import this one file. A fault in it breaks all three,
          # so it is checked the way they use it — by importing it.
          if python3 -c 'import sys; sys.path.insert(0, "/usr/lib/aquarius/python"); import aquarius_ui; print("       StepRow, LogPane and the rest imported")' 2>/tmp/ui.txt; then
            ok "aquarius_ui imports cleanly"
          else
            bad "aquarius_ui cannot be imported — every AquariusOS window would fail to open"; cat /tmp/ui.txt
          fi

          echo "== the installer, uninstaller and updater windows =="
          # "Install DaVinci Resolve" in the app grid opens a real application
          # window, not a terminal. It is Python against GTK 4 and libadwaita,
          # so three things have to be true, and a missing one shows up as an
          # icon that does nothing when clicked.
          for GUI in /usr/libexec/aquarius-resolve-installer \
                     /usr/libexec/aquarius-resolve-uninstaller \
                     /usr/libexec/aquarius-resolve-updater; do
            if [ -x "${GUI}" ]; then ok "$(basename "${GUI}") is present and runnable"
            else bad "${GUI} is missing or not runnable — its app-grid entry would do nothing"; fi
            if python3 -c 'import py_compile, sys; py_compile.compile(sys.argv[1], cfile="/tmp/aq-gui-check.pyc", doraise=True)' "${GUI}" 2>/tmp/py.txt; then
              ok "$(basename "${GUI}") is valid Python"
            else
              bad "${GUI} has a syntax error"; cat /tmp/py.txt
            fi
            # ⚠️ THE 2026-09-04 BENCH FAULT, WHICH HAPPENED THREE TIMES. All
            # three AquariusOS windows finished on an Adw.StatusPage — a widget
            # that draws a small system symbol and CANNOT be given the Aquarius
            # mark — so the page you landed on after installing was blank at the
            # top while every page before it carried the logo. One shared
            # helper, aquarius_ui.hero(), draws the top of every page now. Read
            # back out of the finished image, which is the copy that ships.
            if grep -q 'Adw\.StatusPage(' "${GUI}"; then
              bad "$(basename "${GUI}") builds an Adw.StatusPage again — that page cannot show the Aquarius mark"
            else
              ok "$(basename "${GUI}") builds no Adw.StatusPage anywhere"
            fi
            for want in 'mark, title, blurb = aquarius_ui.hero(' \
                        'mark, self.working_title, self.working_blurb = aquarius_ui.hero(' \
                        'mark, self.done_title, self.done_blurb = aquarius_ui.hero(' \
                        'aquarius_ui.heading_row('; do
              if grep -qF "$want" "${GUI}"; then
                ok "$(basename "${GUI}"): $want"
              else
                bad "$(basename "${GUI}") no longer has '$want' — one of its pages would have no Aquarius mark"
              fi
            done
          done
          # The helper itself, in the image, where all three windows read it.
          for want in 'def hero(' 'def status_glyph(' 'def set_status_glyph(' 'def heading_row('; do
            if grep -qF "$want" /usr/lib/aquarius/python/aquarius_ui.py; then
              ok "the shared window pieces still have $want"
            else
              bad "aquarius_ui.py has lost '$want' — every AquariusOS window is built on it"
            fi
          done
          # ⚠️ ROYCE'S RULE, 2026-09-04: nothing a person READS may name another
          # Linux. The comments still say Rocky, because whoever maintains these
          # needs to know; the printable strings must not.
          leak=0
          for f in /usr/libexec/aquarius-resolve-install \
                   /usr/libexec/aquarius-resolve-installer \
                   /usr/libexec/aquarius-resolve-uninstaller \
                   /usr/libexec/aquarius-resolve-updater \
                   /usr/libexec/aquarius-resolve-check \
                   /usr/libexec/aquarius-resolve-update-notify \
                   /usr/share/applications/aquarius-install-resolve.desktop \
                   /usr/share/applications/aquarius-remove-resolve.desktop \
                   /usr/share/applications/aquarius-update-resolve.desktop; do
            [ -r "$f" ] || continue
            if grep -vE '^[[:space:]]*#' "$f" | grep -qi 'rocky'; then
              bad "$(basename "$f") names Rocky Linux where a person can see it:"
              grep -vE '^[[:space:]]*#' "$f" | grep -i rocky | sed 's/^/       /'
              leak=1
            fi
          done
          [ "$leak" -eq 0 ] && ok "nothing a person reads names another Linux"
          # Removing is a window too, and reads the same channel with 3 steps.
          if aquarius-resolve-install --remove --dry-run --progress-fd 3 3>/tmp/rm.txt >/dev/null 2>&1 \
             || /usr/libexec/aquarius-resolve-install --remove --dry-run --progress-fd 3 3>/tmp/rm.txt >/dev/null 2>&1; then
            ok "the removal rehearsal ran"
            sed 's/^/       /' /tmp/rm.txt
          else
            bad "'aquarius-resolve-install --remove --dry-run' does not run"
          fi
          if grep -q '^STEP 3/3 Keeping your projects and settings$' /tmp/rm.txt; then
            ok "by default removing KEEPS your projects and settings"
          else
            bad "the default removal does not say it keeps your projects — that is the one thing it must never get wrong"
          fi
          # And the size and pointer Resolve is started with.
          LAUNCH=/usr/libexec/aquarius-resolve-launch
          for want in QT_AUTO_SCREEN_SCALE_FACTOR=0 'QT_SCALE_FACTOR=${SCALE}' \
                      'QT_DEVICE_PIXEL_RATIO=${SCALE}' 'aquarius-display-scale --resolve-scale' \
                      XCURSOR_THEME= XCURSOR_SIZE= XCURSOR_PATH=; do
            if grep -qF "$want" "$LAUNCH"; then ok "the launcher passes $want"
            else bad "the launcher no longer passes $want — Resolve would open small, or with the wrong pointer"; fi
          done
          EFF="$(/usr/libexec/aquarius-display-scale --resolve-scale 2>&1 || true)"
          case "$EFF" in
            ''|*[!0-9.]*) bad "'--resolve-scale' printed '$EFF', not a number — the launcher would have nothing to hand Resolve" ;;
            *) ok "'--resolve-scale' answers '$EFF' even on a machine with no screens" ;;
          esac
          # Importing needs no screen — it loads the typelib files and stops.
          # This is the check that catches a missing python3-gobject, which is
          # the one package of the three that GNOME does not already bring in.
          if python3 -c 'import gi; gi.require_version("Gtk","4.0"); gi.require_version("Adw","1"); from gi.repository import Gtk, Adw' 2>/tmp/gi.txt; then
            ok "Python can reach GTK 4 and libadwaita"
          else
            bad "Python cannot import GTK 4 and libadwaita — the installer window could not be drawn"
            cat /tmp/gi.txt
          fi
          for pkg in python3-gobject gtk4 libadwaita; do
            if rpm -q "${pkg}" > /dev/null 2>&1; then
              ok "${pkg} $(rpm -q --queryformat '%{VERSION}' "${pkg}")"
            else
              bad "${pkg} is NOT installed — the installer window is built out of it"
            fi
          done

          echo "== the progress channel the window reads =="
          # The window and the installer script have to agree on a handful of
          # structured lines, and the only way to know they still do is to run
          # them. --dry-run walks all seven steps and installs nothing at all, so
          # this is safe here: no graphics card, no download, no network.
          #
          # It is also what Royce runs on the bench to look at the window
          # without reinstalling Resolve:  aq resolve install --gui --dry-run
          if /usr/libexec/aquarius-resolve-install --dry-run --progress-fd 3 \
               3>/tmp/progress.txt >/tmp/dryrun.txt 2>&1; then
            ok "the rehearsal ran"
          else
            bad "'aquarius-resolve-install --dry-run' does not run"
            cat /tmp/dryrun.txt
          fi
          echo "       --- what came back on the progress channel ---"
          sed 's/^/       /' /tmp/progress.txt

          # In order, 1..7, and nothing skipped. The window draws its list of
          # steps from these, so a gap here is a window that never ticks a box.
          n=0
          while IFS= read -r line; do
            case "${line}" in
              "STEP "*)
                n=$((n + 1))
                want="STEP ${n}/7 "
                case "${line}" in
                  "${want}"*) : ;;
                  *) bad "expected a line starting '${want}' and got: ${line}" ;;
                esac
                ;;
            esac
          done < /tmp/progress.txt
          if [ "${n}" = "7" ]; then
            ok "all seven steps were announced, in order"
          else
            bad "the rehearsal announced ${n} steps, not 7"
          fi
          # ⚠️ THE LAST ONE BY NAME. Step 7 is Royce's 2026-09-08 requirement —
          # that a new version comes up at the screen's proper size — and it is
          # the step most easily dropped by somebody tidying the flow, because
          # everything still installs without it.
          if grep -q '^STEP 7/7 Matching Resolve to your screen$' /tmp/progress.txt; then
            ok "the flow ends by checking Resolve opens at the size of your screen"
          else
            bad "the flow no longer ends with 'Matching Resolve to your screen'"
          fi
          if grep -q '^PERCENT ' /tmp/progress.txt; then
            ok "PERCENT lines are sent — the bar can fill rather than only pulse"
          else
            bad "no PERCENT line was sent"
          fi
          if [ "$(tail -1 /tmp/progress.txt)" = "DONE" ]; then
            ok "it ends with DONE, which is what moves the window to its last page"
          else
            bad "the rehearsal did not end with DONE — the window would never say it had finished"
          fi
          # A rehearsal that installed something would be a serious bug.
          if [ -e /opt/resolve ] || podman container exists aquarius-resolve 2>/dev/null; then
            bad "--dry-run changed something. It must change nothing at all."
          else
            ok "the rehearsal changed nothing, which is the whole point of it"
          fi

          echo "== is there a newer Resolve? the update check =="
          # ⚠️ TESTED AGAINST A FILE, NOT AGAINST BLACKMAGIC. A build that
          # reached out to somebody else's website would go red whenever their
          # site had a bad day, which teaches people to ignore red ticks.
          # feed-sample.json is a small committed cut of their real list — both
          # editions, a few versions, one clearly-marked invented beta — so the
          # PARSING is proved on every build with no network at all.
          CHECK=/usr/libexec/aquarius-resolve-check
          FEED=/usr/share/aquarius/resolve/feed-sample.json
          if [ -x "${CHECK}" ]; then ok "aquarius-resolve-check is present and runnable"
          else bad "${CHECK} is missing — nothing would ever notice a new Resolve"; fi
          if python3 -c 'import py_compile,sys; py_compile.compile(sys.argv[1], cfile="/tmp/c.pyc", doraise=True)' "${CHECK}" 2>/tmp/py.txt; then
            ok "aquarius-resolve-check is valid Python"
          else
            bad "${CHECK} has a syntax error"; cat /tmp/py.txt
          fi
          if python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "${FEED}" 2>/dev/null; then
            ok "the saved copy of Blackmagic's release list is valid JSON"
          else
            bad "${FEED} is missing or not valid JSON — --dry-run would fail and nothing here could be tested"
          fi
          # ⚠️ `|| rc=$?` IS NOT OPTIONAL: the checker exits 10 on purpose when
          # there is something newer, which is the answer being tested for.
          rc=0
          OUT="$("${CHECK}" --feed "${FEED}" --edition studio --installed-version 21.0.4)" || rc=$?
          echo "       studio 21.0.4 -> ${OUT} (exit ${rc})"
          if [ "${rc}" = "10" ] && printf '%s' "${OUT}" | grep -q 'DaVinci Resolve Studio 21.1 is available'; then
            ok "an out-of-date Studio is offered Studio 21.1, and exits 10 so the timer knows"
          else
            bad "the check did not offer Studio 21.1 to a Studio 21.0.4 machine"
          fi
          rc=0
          OUT="$("${CHECK}" --feed "${FEED}" --edition studio --installed-version 21.1)" || rc=$?
          echo "       studio 21.1   -> ${OUT} (exit ${rc})"
          if [ "${rc}" = "0" ] && printf '%s' "${OUT}" | grep -q 'newest DaVinci Resolve Studio'; then
            ok "an up-to-date machine is told so, and exits 0 so nothing is announced"
          else
            bad "the check did not say an up-to-date Studio machine was up to date"
          fi
          rc=0
          OUT="$("${CHECK}" --feed "${FEED}" --edition free --installed-version 20.3.3)" || rc=$?
          echo "       free 20.3.3   -> ${OUT}"
          # THE ONE THAT MATTERS MOST: never offer a free user Studio, or the
          # other way round. They are different licences and different downloads.
          if printf '%s' "${OUT}" | grep -q '^DaVinci Resolve 21\.1 is available'; then
            ok "a free copy is offered the free 21.1, never Studio"
          else
            bad "the check offered a free copy something other than the newest free Resolve"
          fi
          # The saved feed carries a 21.2 beta for BOTH editions. If betas were
          # ever counted, every answer above would have said 21.2.
          if printf '%s' "${OUT}" | grep -q '21\.2'; then
            bad "the check offered the 21.2 BETA — betas must be ignored"
          else
            ok "the beta in the saved feed is ignored, as it must be"
          fi
          if "${CHECK}" --dry-run >/tmp/checkdry.txt 2>&1; then
            ok "'aquarius-resolve-check --dry-run' runs with no network at all"
            sed 's/^/       /' /tmp/checkdry.txt
          else
            bad "'aquarius-resolve-check --dry-run' failed"; cat /tmp/checkdry.txt
          fi
          if aq resolve check >/tmp/aqcheck.txt 2>&1; then
            ok "'aq resolve check' runs on a machine with nothing installed"
            sed 's/^/       /' /tmp/aqcheck.txt
          else
            bad "'aq resolve check' failed where Resolve is not installed — it must be quiet, not alarming"
            cat /tmp/aqcheck.txt
          fi

          echo "== the once-a-day check, and the notification it sends =="
          NOTIFY=/usr/libexec/aquarius-resolve-update-notify
          if "${NOTIFY}" --dry-run >/tmp/notify.txt 2>&1; then
            ok "the daily check's rehearsal runs"
            sed 's/^/       /' /tmp/notify.txt
          else
            bad "'aquarius-resolve-update-notify --dry-run' failed"; cat /tmp/notify.txt
          fi
          # With no Resolve installed it must say so and send nothing. That is
          # the state of this container and of every machine that never uses it.
          if grep -q 'not set up on this computer' /tmp/notify.txt; then
            ok "with no Resolve installed it says so and sends nothing"
          else
            bad "the daily check did not stay quiet on a machine with no Resolve"
          fi
          if grep -q 'ANNOUNCED=' "${NOTIFY}"; then
            ok "it remembers the version it announced, so nobody is nagged twice about one release"
          else
            bad "nothing remembers what was announced — the same version would be announced every day"
          fi
          # ⚠️ SWITCHED ON FROM /usr, NOT /etc. A link in /etc can be deleted by
          # a local `disable`, and this kind of operating system then preserves
          # that deletion for ever. The long version is in build_files/aq-lib.sh.
          TLINK=/usr/lib/systemd/user/timers.target.wants/aquarius-resolve-update-check.timer
          if [ -L "${TLINK}" ] && [ -e "${TLINK}" ]; then
            ok "the daily check is switched on from /usr ($(readlink "${TLINK}"))"
          else
            bad "${TLINK} is missing or dangling — the timer would never start"
          fi
          if [ -e /etc/systemd/user/timers.target.wants/aquarius-resolve-update-check.timer ]; then
            bad "the daily check is ALSO switched on through /etc — an update could lose that"
          else
            ok "nothing switches the daily check on through /etc"
          fi
          for want in 'OnUnitActiveSec=1d' 'Persistent=true' 'RandomizedDelaySec='; do
            if grep -q "${want}" /usr/lib/systemd/user/aquarius-resolve-update-check.timer; then
              ok "the timer says ${want}"
            else
              bad "the timer no longer says ${want}"
            fi
          done

          echo "== the update flow walks the same channel =="
          # Seven steps, in order, ending in DONE. A window drawing seven rows
          # against a script sending six is a bar that never finishes.
          if /usr/libexec/aquarius-resolve-install --update --dry-run --progress-fd 3 \
               3>/tmp/up.txt >/tmp/updry.txt 2>&1; then
            ok "the update rehearsal ran"
            sed 's/^/       /' /tmp/up.txt
          else
            bad "'aquarius-resolve-install --update --dry-run' does not run"; cat /tmp/updry.txt
          fi
          n=0
          while IFS= read -r line; do
            case "${line}" in
              "STEP "*)
                n=$((n + 1))
                case "${line}" in
                  "STEP ${n}/7 "*) : ;;
                  *) bad "expected 'STEP ${n}/7 ' and got: ${line}" ;;
                esac
                ;;
            esac
          done < /tmp/up.txt
          if [ "${n}" = "7" ]; then ok "the update announced all seven steps, in order"
          else bad "the update rehearsal announced ${n} steps, not 7"; fi
          if [ "$(tail -1 /tmp/up.txt)" = "DONE" ]; then
            ok "the update rehearsal ends with DONE"
          else
            bad "the update rehearsal did not end with DONE"
          fi
          # The rehearsal really asks the update check, offline, rather than
          # pretending to — which is what proves the two still fit together.
          if grep -q 'What the update check says' /tmp/updry.txt; then
            ok "the update rehearsal really asks the update check"
          else
            bad "the update rehearsal no longer asks the update check"
          fi

          echo "== and that Resolve still comes up at the size of the screen =="
          # --report asks the launcher what it would hand Resolve and starts
          # nothing, which is what the last step of every install and update
          # asks. It has to work on a machine with no Resolve and no screen.
          REPORT="$(/usr/libexec/aquarius-resolve-launch --report 2>&1 || true)"
          echo "       ${REPORT}"
          if printf '%s' "${REPORT}" | grep -q 'interface at'; then
            ok "'aquarius-resolve-launch --report' answers even with no Resolve installed"
          else
            bad "'--report' printed no scale line, so the screen-matching step would have nothing to ask"
          fi
          for want in 'step 7 "Matching Resolve to your screen"' 'aquarius-resolve-launch --report' 'conf_fingerprint'; do
            if grep -qF "${want}" /usr/libexec/aquarius-resolve-install; then
              ok "the installer still has: ${want}"
            else
              bad "the installer has lost '${want}' — the new version could come up the wrong size"
            fi
          done

          echo "== and that Resolve's window fits the screen =="
          # ⚠️ THIS CHECK IS RETIRED AND THE FAULT IS NOT FIXED — say so rather
          # than let it disappear. Resolve sizes its own window and on a 4K
          # display sometimes opened one whose edges, close button included,
          # were off the screen. The answer was one window rule in the Aquarius
          # Session's labwc configuration (FitToOutput, and a global "open in
          # the middle" placement), read back here as XML.
          #
          # That desktop was retired on 2026-09-15
          # (../docs/decision-2026-09-15-two-desktops.md), so there is no rc.xml
          # to read. What is true on the two desktops that replaced it:
          #
          #   GNOME (Mutter)  has no per-application window rules at all.
          #   KDE (KWin)      has them, and they are stronger than labwc's.
          #
          # Neither is done yet. It is a bench question first — open Resolve on
          # the 4K screen on each desktop and see whether it misbehaves at all —
          # and a follow-up in the decision record. What DOES still ship is
          # Resolve's own window memory, which is checked elsewhere in this job.
          if [ -e /usr/share/aquarius/labwc/rc.xml ]; then
            bad "a labwc rc.xml is still in the image — the shell removal is incomplete"
          else
            ok "no labwc window rule (retired with the Aquarius Session; see the note above)"
          fi
          if [ -x /usr/libexec/aquarius-resolve-settings ]; then
            ok "Resolve's own window memory is still here, which is what sizes it now"
          else
            bad "/usr/libexec/aquarius-resolve-settings is missing — nothing would remember Resolve's window"
          fi

          echo "== and that your drives are in the same places inside =="
          # ⚠️ WHY THIS IS WORTH A BUILD CHECK. A Resolve project stores the
          # FULL PATH of every clip. A drive at /run/media/royce/SHOOT outside
          # the container and nowhere inside it means dragging media in from
          # Files does nothing, "Open With → DaVinci Resolve" opens an empty
          # Resolve, and yesterday's project comes up with its media offline.
          # None of those say why; all three look like Resolve being broken.
          #
          # There are no drives here and no container to ask, so the two facts
          # the check needs are handed to it — that is what the two
          # AQ_RESOLVE_FAKE_DRIVES variables are for, and they are documented
          # beside report_drives in the installer. What is proved here is the
          # wording and the arithmetic of all three outcomes.
          drives() {   # drives <what the host has> <what the container sees>
            AQ_RESOLVE_FAKE_DRIVES="$1" AQ_RESOLVE_FAKE_DRIVES_INSIDE="$2" \
              /usr/libexec/aquarius-resolve-install --drives 2>&1
          }
          NONE="$(drives "" "")"
          echo "       --- no drives plugged in ---"
          printf '%s\n' "${NONE}" | sed 's/^/       /'
          printf '%s' "${NONE}" | grep -q 'No extra drives are plugged in' \
            && ok "a machine with no drives is told so plainly" \
            || bad "the drives check does not handle a machine with no drives at all"
          printf '%s' "${NONE}" | grep -q 'cannot be reached' \
            && bad "a machine with no drives is warned about drives it does not have" \
            || ok "and it warns about nothing"

          GOOD="$(drives /run/media/tester/SHOOT /run/media/tester/SHOOT)"
          echo "       --- one drive, visible inside ---"
          printf '%s\n' "${GOOD}" | sed 's/^/       /'
          printf '%s' "${GOOD}" | grep -q 'is visible inside Resolve at the same path' \
            && ok "one drive that lines up is reported as lining up" \
            || bad "the drives check does not say a drive is visible when it is"

          BADD="$(drives /run/media/tester/A:/run/media/tester/B /run/media/tester/A)"
          echo "       --- two drives, one missing inside ---"
          printf '%s\n' "${BADD}" | sed 's/^/       /'
          printf '%s' "${BADD}" | grep -q '1 of your 2 drives cannot be reached' \
            && ok "a missing drive is counted correctly against the ones that are there" \
            || bad "the drives check miscounts, or does not notice, a drive missing inside"
          printf '%s' "${BADD}" | grep -q '/run/media/tester/B' \
            && ok "and it names the drive rather than saying something is wrong somewhere" \
            || bad "the drives check does not name the drive that is missing"
          printf '%s' "${BADD}" | grep -q 'aq resolve install' \
            && ok "and it ends with what to do about it" \
            || bad "the drives check names a problem and no way out of it"

          # And step 7 really carries it, in the rehearsal a person would see.
          grep -q '^  Your drives, inside and out$' /tmp/dryrun.txt \
            && ok "step 7 of every install and update asks about your drives" \
            || bad "step 7 no longer asks whether your drives are visible inside"
          grep -q 'AQ_RESOLVE_INSTALLER}" --drives' /usr/bin/aq \
            && ok "'aq resolve status' asks the same script, so the two cannot disagree" \
            || bad "'aq resolve status' no longer asks about drives, or works out its own answer"

          echo "== and that the sound comes out of the speakers =="
          # ⚠️ Resolve plays through ALSA, which expects a sound card. There is
          # no sound card inside a container — the real one belongs to
          # AquariusOS, which drives it with PipeWire — so one plug-in file from
          # `pipewire-alsa` carries the audio across. Without it Resolve plays
          # silence with an empty device list, which reads as a broken Resolve.
          #
          # The plug-in lives in the RUNTIME, which is a separate image with its
          # own build; build-resolve-runtime.yml reads the file back out of it.
          # What is proved here is this image's half: that the question can be
          # asked, that both answers are worded, and that the question is about
          # the FILE and not about a package name.
          sound() { AQ_RESOLVE_FAKE_SOUND="$1" /usr/libexec/aquarius-resolve-install --sound 2>&1; }
          SND_OK="$(sound yes)"
          printf '%s\n' "${SND_OK}" | sed 's/^/       /'
          printf '%s' "${SND_OK}" | grep -q "Sound: reaches the desktop's audio (PipeWire)" \
            && ok "a working setup says its sound reaches the desktop's audio" \
            || bad "the sound check no longer says plainly that the audio reaches the desktop"
          SND_BAD="$(sound no)"
          printf '%s\n' "${SND_BAD}" | sed 's/^/       /'
          printf '%s' "${SND_BAD}" | grep -q 'cannot reach the desktop' \
            && ok "and a broken one says so rather than staying quiet" \
            || bad "the sound check does not report a setup whose audio cannot get out"
          printf '%s' "${SND_BAD}" | grep -q 'aq resolve install' \
            && ok "and ends with what to do about it" \
            || bad "the sound check names a problem and no way out of it"
          grep -q 'libasound_module_pcm_pipewire.so' /usr/libexec/aquarius-resolve-install \
            && ok "it looks for the plug-in file itself, not for a package name" \
            || bad "the sound question no longer looks for the ALSA-to-PipeWire plug-in file"
          grep -q 'AQ_RESOLVE_INSTALLER}" --sound' /usr/bin/aq \
            && ok "'aq resolve status' asks the same script about sound too" \
            || bad "'aq resolve status' no longer reports whether Resolve's sound can get out"

          echo "== and that Files knows what a Resolve project is =="
          # ⚠️ The shared list of file types has never heard of Resolve, so a
          # .drp is an "unknown" file and an unknown file cannot be offered an
          # application to open it with. AquariusOS adds the missing name at
          # build time — and copying the file in is not enough, because the
          # desktop reads a single compiled list. This reads that compiled list
          # back out of the finished image, which is the only proof that counts.
          [ -r /usr/share/mime/packages/aquarius-resolve.xml ] \
            && ok "the file type description shipped in the image" \
            || bad "/usr/share/mime/packages/aquarius-resolve.xml is missing — a .drp would be an unknown file"
          grep -qx 'application/x-davinci-resolve-project:\*.drp' /usr/share/mime/globs \
            && ok "the whole desktop knows a .drp is a DaVinci Resolve project" \
            || bad "the compiled file-type list has no .drp — update-mime-database was never run, or ran before our file arrived"

          # The installer's half.
          for want in 'RESOLVE_MIME_TYPES=' 'ensure_open_with()' 'mime_defaults_restore'; do
            grep -qF "${want}" /usr/libexec/aquarius-resolve-install \
              && ok "the installer still has: ${want}" \
              || bad "the installer has lost '${want}' — Open With would not be offered, or would change what a double-click does"
          done
          # ⚠️ THE ONE THAT MATTERS MOST. Offering Resolve in an Open With list
          # and making it what a double-click opens are different statements,
          # and only the first was asked for. Nobody wants a fifteen-second
          # professional editor because they double-clicked a clip to glance at
          # it. Everything but the project type keeps the application it had.
          grep -qF 'MIME_DEFAULTS_BEFORE="$(mime_defaults_snapshot)"' /usr/libexec/aquarius-resolve-install \
            && ok "what each file type opens with is written down before the associations are added" \
            || bad "nothing remembers the existing defaults — installing Resolve could change what a double-click opens"

          # The launcher's half: a file handed over by Files reaches Resolve,
          # instead of being read as the name of a program to run — which is
          # what used to happen, and is why "Open With" did nothing at all.
          for want in uri_to_path /opt/resolve/bin/resolve 'RUN_ARGS[@]'; do
            grep -qF "${want}" /usr/libexec/aquarius-resolve-launch \
              && ok "the launcher still has: ${want}" \
              || bad "the launcher has lost '${want}' — a project opened from Files would not reach Resolve"
          done
          OPENED="$(/usr/libexec/aquarius-resolve-launch --report 'file:///run/media/tester/Shoot%20A/Ep%203.drp' 2>&1 || true)"
          printf '%s' "${OPENED}" | grep -q 'interface at' \
            && ok "the launcher answers when it is handed a project, rather than falling over" \
            || bad "the launcher fails when Files hands it a project — 'Open With → DaVinci Resolve' would do nothing"

          # ⚠️ THE BENCH FAULT OF 9 SEPTEMBER 2026 — clicking the DaVinci
          # Resolve icon did nothing at all. Blackmagic's entry carried
          # `Path=/opt/resolve/`, the folder the desktop steps into BEFORE it
          # runs the program; that folder is inside the container, GNOME could
          # not step into it, so it refused to start the app and said nothing on
          # screen. The fix has two halves and both must stay: the entry helper
          # takes the line off, and the launcher does the stepping-in inside the
          # container, where /opt/resolve really is. Resolve's own log setting
          # asks for ./logs/rollinglog.txt relative to that folder, so losing
          # this would also start growing a logs folder in the home folder.
          for want in resolve_work_folder WORK_FOLDER '/bin/sh -c'; do
            grep -qF "${want}" /usr/libexec/aquarius-resolve-launch \
              && ok "the launcher still has: ${want}" \
              || bad "the launcher has lost '${want}' — Resolve would start from whatever folder the click left behind"
          done
          grep -qF 'unreachable_working_folder' /usr/libexec/aquarius-resolve-entry \
            && ok "the entry helper still removes a Path= naming a folder this computer does not have" \
            || bad "the entry helper no longer removes an unreachable Path= — clicking the Resolve icon would do nothing at all"

          echo "== and which file picker Resolve will open =="
          # ⚠️ FEATURE 008 ITEM 5, built as auto-detection rather than as a bench
          # experiment somebody has to remember to run. Resolve's Open, Save and
          # Render-To windows are Qt's own and look like nothing else on the
          # computer. Qt can be asked for the desktop's shared picker instead —
          # the same one Files and Firefox use, over xdg-desktop-portal on the
          # session bus distrobox already shares — but ONLY if the plug-in that
          # does it is inside Blackmagic's own copy of Qt. Whether it is there is
          # their decision; ours is to look and to say which one you are getting.
          #
          # There is no Resolve here, so the answer is stood in for, and both
          # states are walked.
          dialogs() { AQ_RESOLVE_FAKE_PORTAL_PLUGIN="$1" /usr/libexec/aquarius-resolve-launch --report 2>/dev/null || true; }
          SHARED="$(dialogs yes)"
          echo "       with the plug-in:    ${SHARED}"
          printf '%s' "${SHARED}" | grep -q "file dialogs: the desktop's shared picker" \
            && ok "the shared picker is switched on when Blackmagic's Qt can do it" \
            || bad "the launcher does not switch to the shared picker even when the plug-in is there"
          OWN="$(dialogs no)"
          echo "       without it:          ${OWN}"
          printf '%s' "${OWN}" | grep -q "file dialogs: Resolve's own" \
            && ok "and Resolve's own dialogs are reported honestly when it cannot" \
            || bad "the launcher does not say plainly that Resolve is using its own file dialogs"
          # Naming a plug-in that is not there makes Qt warn at every start and
          # change nothing, which is the worst of both.
          printf '%s' "${OWN}" | grep -q 'xdgdesktopportal' \
            && bad "the launcher would still ask Qt for a plug-in that is not in Resolve's Qt" \
            || ok "and asks Qt for nothing at all in that case"
          for want in 'libqxdgdesktopportal.so' 'conf_value file_dialogs'; do
            grep -qF "${want}" /usr/libexec/aquarius-resolve-launch \
              && ok "the launcher still has: ${want}" \
              || bad "the launcher has lost '${want}' — the picker would stop being detected, or stop being overridable"
          done
          grep -q 'file dialogs: ' /usr/bin/aq \
            && ok "'aq resolve status' reads the same answer off the same launcher" \
            || bad "'aq resolve status' no longer says which file picker Resolve opens"
          # Exercise the writer itself: changing size must preserve every other option,
          # including settings introduced by a newer version. Use an isolated config.
          if python3 - <<'AQ_CONFIG_CHECK'
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          with tempfile.TemporaryDirectory(prefix="aq-resolve-config-") as temporary:
              config = Path(temporary) / "aquarius" / "resolve.conf"
              config.parent.mkdir()
              kept = "# keep this note\nqt_variable=QT_SCALE_FACTOR\nfile_dialogs=own\nfuture_option=yes\n"
              config.write_text(kept + "scale=1.5\n scale = 2\n")
              env = dict(os.environ, XDG_CONFIG_HOME=temporary)
              for value, expected in (("1.25", ["1.25"]), ("auto", [])):
                  subprocess.run(["/usr/bin/aq", "resolve", "scale", value], env=env,
                                 check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  result = config.read_text()
                  assert result.startswith(kept), "changing scale discarded unrelated settings"
                  assert re.findall(r"^\s*scale\s*=\s*(.*)$", result, re.M) == expected
          AQ_CONFIG_CHECK
          then
              ok "'aq resolve scale' preserves comments, file-picker and unknown settings"
          else
              bad "'aq resolve scale' lost settings or failed to replace the scale"
          fi
          # ⚠️ THE OTHER HALF OF THIS IS IN THE OTHER IMAGE, and it is not
          # checkable from here: aquarius-resolve-run, inside the runtime
          # container, must KEEP an inherited QT_QPA_PLATFORMTHEME instead of
          # emptying it, or the launcher's flag is wiped out one line before
          # Resolve starts and the whole feature silently does nothing.
          # build-resolve-runtime.yml checks that, in the image it belongs to.
          echo "       (the container's half of this is checked by build-resolve-runtime.yml)"

          echo "== the way to update without a terminal =="
          DESKUP=/usr/share/applications/aquarius-update-resolve.desktop
          if [ ! -r "${DESKUP}" ]; then
            bad "${DESKUP} is missing — there would be no 'Update DaVinci Resolve' in the app grid"
          else
            cat "${DESKUP}" | sed 's/^/       /'
            if desktop-file-validate "${DESKUP}"; then
              ok "it passes freedesktop's own validator"
            else
              bad "it is not a valid desktop entry — the app grid would silently ignore it"
            fi
            grep -q '^Exec=/usr/libexec/aquarius-resolve-updater$' "${DESKUP}" \
              && ok "it opens the update window" \
              || bad "it does not point at /usr/libexec/aquarius-resolve-updater"
            grep -q '^StartupWMClass=org.aquariusos.ResolveUpdater$' "${DESKUP}" \
              && ok "the desktop can tell which window belongs to it" \
              || bad "StartupWMClass does not match the window's application id"
          fi

          echo "== the two questions the window asks before it starts =="
          # Captured, not piped into grep: `grep -q` stops early and pipefail
          # then reports the killed producer as a failed pipeline.
          GPU_LINE="$(/usr/libexec/aquarius-resolve-install --gpu-summary || true)"
          echo "       ${GPU_LINE}"
          if printf '%s' "${GPU_LINE}" | grep -Eq "^(ok|warn|none)$(printf '\t')"; then
            ok "'--gpu-summary' answers as a word, a tab and a sentence"
          else
            bad "'--gpu-summary' does not answer in the shape the window reads"
          fi
          # There is no Resolve download in a build container, so finding one
          # would mean the search is matching something it should not.
          if /usr/libexec/aquarius-resolve-install --find-installer >/dev/null 2>&1; then
            bad "'--find-installer' claims to have found a Resolve download in a container that has none"
          else
            ok "'--find-installer' correctly finds nothing here"
          fi

          echo "== which runtime container this image will pull =="
          ENVFILE=/usr/share/aquarius/resolve/runtime.env
          if [ ! -r "${ENVFILE}" ]; then
            bad "${ENVFILE} is missing — nothing would know which container to download"
          else
            grep -E '^AQ_RESOLVE' "${ENVFILE}" | sed 's/^/       /'
            grep -Eq '^AQ_RESOLVE_RUNTIME_IMAGE=ghcr\.io/[a-z0-9-]+/aquarius-resolve-runtime$' "${ENVFILE}" \
              && ok "the runtime image is named" \
              || bad "the runtime image name is not the shape it should be"
            # An Enterprise Linux release number, never `latest`. A moving tag
            # would one day follow us to Rocky 10 — which has the modern GLib
            # this whole design exists to avoid — without anybody deciding to.
            grep -Eq '^AQ_RESOLVE_RUNTIME_TAG=[0-9]+$' "${ENVFILE}" \
              && ok "it is pinned to an Enterprise Linux release, not a moving tag" \
              || bad "the runtime tag is not a release number — a moving tag could change userland by accident"
          fi

          echo "== the USB rules for a Studio licence dongle and a control panel =="
          # These must be on the HOST. Resolve's own installer writes them
          # inside the container, where they apply to nothing, and this system
          # folder is read-only so nothing can add them afterwards.
          RULES=/usr/lib/udev/rules.d/75-aquarius-resolve.rules
          if [ ! -r "${RULES}" ]; then
            bad "${RULES} is missing — a Resolve Studio dongle would not be seen"
          else
            grep -q 'idVendor}=="1edb"' "${RULES}" \
              && ok "Blackmagic Design hardware (1edb) has a rule" \
              || bad "no rule for Blackmagic Design hardware"
            grep -q 'idVendor}=="096e"' "${RULES}" \
              && ok "the Studio USB licence dongle (096e) has a rule" \
              || bad "no rule for the Studio licence dongle"
          fi

          echo "== the way in that needs no terminal =="
          DESK=/usr/share/applications/aquarius-install-resolve.desktop
          if [ ! -r "${DESK}" ]; then
            bad "${DESK} is missing — there would be no 'Install DaVinci Resolve' in the app grid"
          else
            cat "${DESK}" | sed 's/^/       /'
            if desktop-file-validate "${DESK}"; then
              ok "it passes freedesktop's own validator"
            else
              bad "it is not a valid desktop entry — the app grid would silently ignore it"
            fi
            grep -q '^Exec=/usr/libexec/aquarius-resolve-installer$' "${DESK}" \
              && ok "it opens the installer window" \
              || bad "it does not point at /usr/libexec/aquarius-resolve-installer"
            # Must match the application id the window sets, or a running
            # installer appears in the dock as a nameless generic window.
            grep -q '^StartupWMClass=org.aquariusos.ResolveInstaller$' "${DESK}" \
              && ok "the desktop can tell which window belongs to it" \
              || bad "StartupWMClass does not match the window's application id"
          fi

          echo "== the aq resolve command =="
          if aq resolve --help > /tmp/help.txt 2>&1; then
            ok "'aq resolve --help' runs"
            head -6 /tmp/help.txt | sed 's/^/       /'
          else
            bad "'aq resolve --help' does not run"
            cat /tmp/help.txt
          fi
          # `aq resolve status` on a machine with no container must say so
          # calmly rather than fall over. This is the state every new machine is
          # in, so it is the state most people will see first.
          if aq resolve status > /tmp/status.txt 2>&1; then
            ok "'aq resolve status' runs on a machine with nothing installed"
            head -8 /tmp/status.txt | sed 's/^/       /'
          else
            bad "'aq resolve status' fails when Resolve is not installed — which is every new machine"
            cat /tmp/status.txt
          fi

          echo "== and: no Blackmagic software is in this image =="
          # We may not distribute it. Making this impossible beats remembering.
          if [ -e /opt/resolve ]; then
            bad "/opt/resolve exists. We may not distribute Blackmagic's software. DO NOT PUBLISH."
          else
            ok "nothing of Blackmagic's is in this image"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The DaVinci Resolve support is incomplete."
            exit 1
          fi
          echo "All DaVinci Resolve checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            -e EXPECTED_NVIDIA="${NVIDIA}" \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-resolve.sh

      # ------------------------------------------------------------------------
      # The gaming layer (Phase R4)
      # ------------------------------------------------------------------------
      # ⚠️ WHAT THIS CAN AND CANNOT PROVE.
      #
      # There is no graphics card in a GitHub runner, no controller plugged
      # into it and no Steam account, so nothing here can show that a game
      # runs. What it CAN show is that every piece AquariusOS is responsible
      # for arrived and is the piece we meant: the programs, the 32-bit
      # libraries a Windows game needs, the controller kernel modules matched
      # to THIS image's kernel, the udev rules, the Gaming shelf in the app
      # chooser — and, the check that matters most, that adding Terra did not
      # quietly replace Fedora's graphics driver.
      #
      # The real proof is the bench: docs/restart/gaming.md.
      - name: Check the gaming layer is really in there
        run: |
          set -euo pipefail
          cat > /tmp/verify-gaming.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          echo "== the programs =="
          # terra-release is deliberately NOT in this list: Terra is a build-time
          # source only, removed once Steam and umu are installed so the
          # installer ISO can be built (see build_files/68-gaming.sh step 3b).
          for pkg in steam gamescope gamemode mangohud vkBasalt umu-launcher \
                     steam-devices; do
            if rpm -q "${pkg}" > /dev/null 2>&1; then
              ok "${pkg} $(rpm -q --queryformat '%{VERSION}-%{RELEASE}' "${pkg}")"
            else
              bad "${pkg} is NOT installed"
            fi
          done

          echo "== where they came from =="
          rpm -q --queryformat '     %{NAME}-%{VERSION} (vendor: %{VENDOR})\n' \
            steam umu-launcher gamescope mangohud 2>&1 || true

          echo "== THE ONE THAT MATTERS: Fedora still owns the graphics driver =="
          # Terra publishes a Valve-patched Mesa. We deliberately do not take
          # it: this machine's job is colour-accurate video work and a graphics
          # driver that moves on a gaming schedule is the wrong risk. If a
          # future edit ever adds terra-release-mesa, everything else would
          # still pass and only this check would notice.
          if rpm -q terra-release-mesa > /dev/null 2>&1; then
            bad "terra-release-mesa is installed — the graphics driver is no longer Fedora's"
          else
            ok "terra-release-mesa is not installed"
          fi
          for pkg in mesa-dri-drivers mesa-vulkan-drivers; do
            vendor="$(rpm -q --queryformat '%{VENDOR}' "${pkg}" 2>/dev/null || echo missing)"
            echo "     ${pkg}: ${vendor}"
            case "${vendor}" in
              *Fedora*) ok "${pkg} is Fedora's" ;;
              *)        bad "${pkg}'s vendor is '${vendor}' — not Fedora's" ;;
            esac
          done

          echo "== Terra was removed once its packages were installed =="
          # Terra's only job was to provide Steam and umu-launcher at build time;
          # both are installed above and stay installed. The Terra repository is
          # then taken out of the image, because the installer-ISO builder reads
          # every repository file it finds — enabled or not — and Terra's signed
          # catalogue (repo_gpgcheck=1) plus its local-path key (gpgkey=file://)
          # is exactly what osbuild/bootc-image-builder#1188 chokes on. Terra has
          # no runtime purpose here anyway (a bootc machine updates from whole
          # images, not from repositories). See build_files/68-gaming.sh step 3b
          # and docs/restart/installer.md.
          if ls /etc/yum.repos.d/terra*.repo >/dev/null 2>&1; then
            bad "a Terra repository file is still in the image — the installer ISO would fail to build (osbuild#1188)"
            ls /etc/yum.repos.d/terra*.repo | sed 's/^/     /'
          else
            ok "no Terra repository file is in the image"
          fi
          if rpm -q terra-release > /dev/null 2>&1; then
            bad "terra-release is still installed — it should have been removed after Steam and umu went in"
          else
            ok "terra-release has been removed from the image"
          fi

          echo "== the 32-bit libraries a Windows game needs =="
          # Missing these is the classic "the game launches and instantly
          # closes" on Linux, and it produces no error message worth reading.
          for pkg in mesa-dri-drivers mesa-vulkan-drivers mesa-libGL vulkan-loader mangohud vkBasalt; do
            if rpm -q "${pkg}.i686" > /dev/null 2>&1; then
              ok "${pkg}.i686"
            else
              bad "${pkg}.i686 is missing — 32-bit games would not start"
            fi
          done

          if [ "${EXPECTED_NVIDIA}" = "1" ]; then
            echo "== and the 32-bit NVIDIA libraries (NVIDIA image only) =="
            if rpm -q --queryformat '%{ARCH}\n' nvidia-driver-libs 2>/dev/null | grep -qx i686; then
              ok "nvidia-driver-libs is present in its 32-bit form"
              rpm -q --queryformat '     %{NAME}-%{VERSION}.%{ARCH}\n' nvidia-driver-libs
            else
              bad "no 32-bit nvidia-driver-libs — 32-bit games would not reach the graphics card"
            fi
          fi

          echo "== the Xbox controller drivers =="
          # These used to be allowed to be absent, because the ready-made
          # modules are built against one exact kernel and for a day or two
          # after a Fedora kernel update they did not match ours. Since
          # 2026-09-04 the kernel is pinned to theirs, so they must be here:
          # the stamp file is required AND its answer has to be `installed`.
          stamp=/usr/share/aquarius/gaming/controllers.txt
          if [ -r "${stamp}" ]; then
            ok "the image records what happened to the controller drivers"
            sed 's/^/     /' "${stamp}"
          else
            bad "${stamp} is missing — the image cannot say whether the Xbox drivers are in it"
          fi
          kver="$(ls -1 /usr/lib/modules | head -1)"
          echo "     this image runs kernel: ${kver}"
          for pair in "xone:xone_dongle" "xpadneo:hid-xpadneo"; do
            name="${pair%%:*}"; mod="${pair##*:}"
            status="$(sed -n "s/^${name}=//p" "${stamp}" 2>/dev/null || true)"
            found="$(find "/usr/lib/modules/${kver}" -name "${mod}.ko*" 2>/dev/null | head -1)"
            case "${status}" in
              installed)
                if [ -n "${found}" ]; then
                  ok "${name}: says installed, and ${mod} really is under this kernel"
                else
                  bad "${name}: the stamp says installed but no ${mod} module is under ${kver}"
                fi
                if grep -q "${mod}" "/usr/lib/modules/${kver}/modules.dep" 2>/dev/null; then
                  ok "${name}: the kernel's index knows about it"
                else
                  bad "${name}: not in modules.dep — the kernel would not find it at boot"
                fi
                ;;
              unavailable)
                # Same change as the virtual camera, same date, same reason: the
                # kernel is pinned, so a missing controller driver is a fault
                # rather than a scheduling accident.
                bad "${name}: the image says this driver is NOT in it. The kernel is pinned now, so this should be impossible — see /usr/share/aquarius/kernel.txt and docs/restart/kernel.md"
                ;;
              *)
                bad "${name}: the stamp says '${status}', which is neither installed nor unavailable"
                ;;
            esac
          done

          echo "== the controller USB rules =="
          if rpm -ql steam-devices 2>/dev/null | grep -q 'rules.d'; then
            ok "steam-devices installed udev rules"
            rpm -ql steam-devices | grep 'rules.d' | sed 's/^/     /'
          else
            bad "no udev rules from steam-devices — controllers would need administrator rights"
          fi

          echo "== the memory-map limit Proton needs =="
          # Games under Proton ask for far more memory maps than the historic
          # Linux limit allows, and going over it does not fail cleanly.
          grep -rhs '^[[:space:]]*vm\.max_map_count' /usr/lib/sysctl.d /etc/sysctl.d > /tmp/mm.txt 2>/dev/null || true
          if [ -s /tmp/mm.txt ]; then
            sed 's/^/     /' /tmp/mm.txt
            highest="$(awk -F= '{gsub(/[^0-9]/,"",$2); if ($2+0>m) m=$2+0} END {print m+0}' /tmp/mm.txt)"
            if [ "${highest}" -ge 1048576 ]; then
              ok "vm.max_map_count is ${highest}"
            else
              bad "vm.max_map_count is only ${highest} — Proton games would stutter and then die"
            fi
          else
            bad "nothing sets vm.max_map_count at all"
          fi

          echo "== gamemode starts on demand, and is not enabled at boot =="
          if [ -r /usr/share/dbus-1/services/com.feralinteractive.GameMode.service ]; then
            ok "gamemode is wired to start when a game asks for it"
          else
            bad "gamemode has no D-Bus activation file"
          fi

          echo "== MangoHud is installed and OFF =="
          # An overlay stuck over every 3D program — Blender included — is
          # nobody's idea of a default.
          if grep -rqs 'MANGOHUD=1' /usr/lib/environment.d /etc/environment.d 2>/dev/null; then
            bad "something switches MangoHud on for everything"
          else
            ok "nothing turns MangoHud on by itself"
          fi

          echo "== gamescope's permissions came from Fedora, not from us =="
          # Fedora's own gamescope package grants CAP_SYS_NICE in the RPM. That
          # permission has a history of confusing gamescope on NVIDIA
          # (gamescope #521 / #1370), but overriding a distribution's packaging
          # on every build, for a fault we have not seen on our own hardware,
          # is the wrong trade — docs/restart/gaming.md carries the one-line
          # test to run if the bench ever does see it.
          #
          # What must never happen is OUR build quietly granting a capability.
          # So the question is not "are there capabilities" but "did the
          # package declare them".
          declared="$(rpm -q --filecaps gamescope 2>/dev/null | awk '$1 == "/usr/bin/gamescope" { $1 = ""; sub(/^[[:space:]]+/, ""); print }')"
          echo "     the package declares: ${declared:-(none)}"
          if command -v getcap > /dev/null 2>&1; then
            actual="$(getcap /usr/bin/gamescope 2>/dev/null | awk '{ $1 = ""; sub(/^[[:space:]]+/, ""); print }')"
            echo "     the file actually has: ${actual:-(none)}"
            if [ -z "${actual}" ]; then
              ok "gamescope carries no capabilities at all"
            elif [ -n "${declared}" ]; then
              ok "the capabilities on gamescope are the ones Fedora's package ships"
            else
              bad "gamescope has capabilities its package does not declare — something in the build granted them"
            fi
          else
            echo "     (getcap is not in the image; the package's declaration above is the answer)"
          fi

          echo "== the menu entries =="
          for f in /usr/share/applications/steam.desktop \
                   /usr/share/applications/aquarius-steam-bigpicture.desktop; do
            if [ -r "$f" ]; then ok "$(basename "$f")"; else bad "$f is missing"; fi
          done
          grep -q '^Exec=steam -bigpicture$' /usr/share/applications/aquarius-steam-bigpicture.desktop \
            && ok "the Big Picture entry starts Steam full screen" \
            || bad "the Big Picture entry does not run 'steam -bigpicture'"

          echo "== the Gaming shelf in the app chooser =="
          # Read with the chooser's own parser, in the finished image — the
          # same discipline as the creator apps, and for the same reason.
          /usr/libexec/aquarius-flatpak-preinstall --catalog > /tmp/cat.txt 2>/dev/null || true
          awk -F'\t' '$4 == "Gaming" { print "     " $1 "  " $2 "  [" $5 "]" }' /tmp/cat.txt
          gaming="$(awk -F'\t' '$4 == "Gaming"' /tmp/cat.txt | wc -l)"
          if [ "${gaming}" -ge 4 ]; then
            ok "${gaming} apps on the Gaming shelf"
          else
            bad "only ${gaming} apps on the Gaming shelf"
          fi
          ticked="$(awk -F'\t' '$4 == "Gaming" && $5 == "recommended:yes"' /tmp/cat.txt | wc -l)"
          if [ "${ticked}" -eq 0 ]; then
            ok "none of them are ticked by default"
          else
            bad "${ticked} gaming app(s) are ticked by default"
          fi
          for id in com.heroicgameslauncher.hgl net.lutris.Lutris net.davidotek.pupgui2 com.github.Matoking.protontricks; do
            if awk -F'\t' -v want="${id}" '$1 == want { found = 1 } END { exit !found }' /tmp/cat.txt; then
              ok "${id} is offered"
            else
              bad "${id} is not on the shelf"
            fi
          done
          # Steam must NOT be a Flatpak card — it is a system program, and the
          # chooser shows it in the "Included with AquariusOS" group instead.
          if grep -q 'com.valvesoftware.Steam' /tmp/cat.txt; then
            bad "Steam is listed as a Flatpak to install — it is already in the image"
          else
            ok "Steam is not offered as a download (it is already installed)"
          fi
          grep -q '"steam.desktop"' /usr/libexec/aquarius-creator-apps \
            && ok "the chooser lists Steam under Included with AquariusOS" \
            || bad "the chooser does not know Steam is included"

          echo "== and the whole of Wine did not come along for the ride =="
          # protontricks and winetricks were in the first version of this layer
          # and between them pulled in 1.5 GB of Wine that nothing in this image
          # uses - Steam brings its own Proton, umu fetches its own runtime.
          # Protontricks is offered as a Flatpak instead. If Wine ever returns
          # it will be as somebody's silent dependency, and this is the only
          # thing that would notice.
          if rpm -q wine-core > /dev/null 2>&1; then
            bad "wine-core is installed — 1.3 GiB nothing in this image needs; find what pulled it in"
          else
            ok "wine-core is not in this image"
          fi

          echo "== the note that ships in the image =="
          if [ -r /usr/share/aquarius/gaming/README.md ]; then
            ok "/usr/share/aquarius/gaming/README.md is there"
          else
            bad "the plain-language gaming note is missing from the image"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The gaming layer is incomplete."
            exit 1
          fi
          echo "All gaming checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            -e EXPECTED_NVIDIA="${NVIDIA}" \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-gaming.sh

      # ------------------------------------------------------------------------
      # Game Mode (Phase G1)
      # ------------------------------------------------------------------------
      # ⚠️ WHAT THIS CAN AND CANNOT PROVE.
      #
      # A GitHub runner has no graphics card, no monitor, no controller and no
      # login screen. Nothing here can show that Game Mode DRAWS. What it CAN
      # show is that every piece is in the image and is the piece we meant: the
      # session the login screen offers, the scripts Steam calls, our own half
      # of the switch, the permission rule that lets it happen without a
      # password, the cold-boot setting shipped the safe way round, and — on the
      # NVIDIA image only — the gamescope we compiled ourselves with the fix for
      # NVIDIA's scan-out bug really in it.
      #
      # The real proof is the bench list in docs/restart/game-mode.md.
      - name: Check Game Mode is really in there
        run: |
          set -euo pipefail
          cat > /tmp/verify-game-mode.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          echo "== the Game Mode packages =="
          # terra-release is deliberately NOT in this list. Terra is a
          # build-time source only and step 71 removes it again, for the same
          # installer-ISO reason as step 68.
          for pkg in gamescope-session gamescope-session-steam; do
            if rpm -q "${pkg}" > /dev/null 2>&1; then
              ok "${pkg} $(rpm -q --queryformat '%{VERSION}-%{RELEASE}' "${pkg}")"
            else
              bad "${pkg} is NOT installed"
            fi
          done
          # ⚠️ steamos-manager IS ASKED FOR BY WHAT IT PROVIDES, NOT BY ITS NAME.
          # On the handheld image (phase G2) the plain `steamos-manager` package
          # is replaced by Terra's `steamos-manager-powerstation`, whose RPM says
          # `Obsoletes: steamos-manager` — same program, same files, different
          # package name. Asking rpm who PROVIDES the name is true on all three
          # images and stays true if Terra renames it again.
          if rpm -q --whatprovides steamos-manager > /dev/null 2>&1; then
            ok "steamos-manager is provided by $(rpm -q --whatprovides steamos-manager | tr '\n' ' ')"
          else
            bad "nothing in this image provides steamos-manager"
          fi

          echo "== the login screen can offer Game Mode =="
          SESSION=/usr/share/wayland-sessions/gamescope-session-steam.desktop
          if [ -r "${SESSION}" ]; then
            ok "$(basename "${SESSION}") is installed"
            grep -q '^Exec=gamescope-session-plus steam$' "${SESSION}" \
              && ok "it starts 'gamescope-session-plus steam'" \
              || bad "the Game Mode session does not start 'gamescope-session-plus steam'"
          else
            bad "${SESSION} is missing — the login screen would have no Game Mode to offer"
          fi
          echo "     every session this image offers:"
          ls -1 /usr/share/wayland-sessions/ 2>/dev/null | sed 's/^/       /'
          for s in gnome plasma gamescope-session-steam; do
            [ -r "/usr/share/wayland-sessions/${s}.desktop" ] \
              && ok "the login screen can start '${s}'" \
              || bad "/usr/share/wayland-sessions/${s}.desktop is missing"
          done
          [ -x /usr/bin/gamescope-session-plus ] \
            && ok "/usr/bin/gamescope-session-plus is there" \
            || bad "/usr/bin/gamescope-session-plus is missing"

          echo "== GDM is still the login screen, and SDDM is nowhere near this image =="
          # Installing Valve's session packages is exactly the kind of thing
          # that could drag SDDM in. The day it does, GNOME silently loses its
          # lock screen — that is verified in gnome-shell's own source and it is
          # why AquariusOS does the switch the Nobara way instead of Valve's.
          if rpm -q sddm > /dev/null 2>&1; then
            bad "sddm is installed — GNOME loses its lock screen on a machine that uses it"
          else
            ok "sddm is NOT installed"
          fi
          systemctl is-enabled gdm.service > /dev/null 2>&1 \
            && ok "GDM is still switched on" \
            || bad "GDM is not switched on"

          echo "== our own half of the switch =="
          for f in /usr/libexec/os-session-select \
                   /usr/libexec/aquarius-session-root \
                   /usr/libexec/aquarius-game-mode \
                   /usr/libexec/aquarius-login-mode \
                   /usr/libexec/aquarius-bluetooth-wake \
                   /usr/libexec/ogc/os-update; do
            [ -x "$f" ] && ok "$(basename "$f") is there and can be run" || bad "$f is missing or not runnable"
          done
          # The hook Steam actually calls. If this ever stops pointing at our
          # file, "Switch to Desktop" silently becomes "close Steam".
          [ -x /usr/bin/steamos-session-select ] \
            && ok "steamos-session-select (the script Steam calls) is there" \
            || bad "/usr/bin/steamos-session-select is missing — Switch to Desktop would do nothing"
          grep -q 'aquarius-session-root' /usr/libexec/os-session-select \
            && ok "our os-session-select is ours (it uses the AquariusOS root helper)" \
            || bad "/usr/libexec/os-session-select is not our file — a package overwrote it"
          # ⚠️ THE ROOT HELPER MUST BIND ITSELF TO WHOEVER ASKED.
          # The permission rule says yes with no password to any administrator
          # at this screen. Without this, one of them could point SOMEBODY
          # ELSE'S account at a session and switch on a login that needs no
          # password — a password-free way into another person's account.
          # pkexec puts the asking person's user number in PKEXEC_UID, and the
          # helper refuses any account that is not theirs.
          grep -q 'PKEXEC_UID' /usr/libexec/aquarius-session-root \
            && ok "the root helper checks PKEXEC_UID — you can only do this to your own account" \
            || bad "/usr/libexec/aquarius-session-root does not mention PKEXEC_UID — an administrator could switch on a password-free login for another person's account"

          echo "== Steam is told, honestly, that it does not update this computer =="
          # Steam's contract: 7 means "no update". Anything else and Steam
          # either tries to update the OS or sits at a progress bar for ever.
          [ -x /usr/bin/steamos-update ] \
            && ok "/usr/bin/steamos-update is installed" \
            || bad "/usr/bin/steamos-update is missing"
          /usr/libexec/ogc/os-update check > /tmp/osu.txt 2>&1
          code=$?
          sed 's/^/       /' /tmp/osu.txt
          if [ "$code" -eq 7 ]; then
            ok "our os-update answers 7 — Steam's word for 'there is no update'"
          else
            bad "our os-update answered ${code}, not 7"
          fi

          echo "== the permission rule that makes the switch password-free =="
          POLICY=/usr/share/polkit-1/actions/org.aquariusos.gamemode.policy
          RULES=/usr/share/polkit-1/rules.d/51-aquarius-game-mode.rules
          [ -r "$POLICY" ] && ok "$(basename "$POLICY") is there" || bad "$POLICY is missing"
          [ -r "$RULES" ]  && ok "$(basename "$RULES") is there"  || bad "$RULES is missing"
          grep -q 'org.aquariusos.gamemode.select' "$POLICY" 2>/dev/null \
            && ok "it describes the one action the switch needs" \
            || bad "the policy does not name org.aquariusos.gamemode.select"
          # ⚠️ THE NARROWNESS IS THE POINT. This is the only no-password rule on
          # the machine, so it must name exactly one action and refuse
          # everything else. A rule that granted YES broadly would be a hole.
          grep -q 'subject.active && subject.local && subject.isInGroup("wheel")' "$RULES" 2>/dev/null \
            && ok "it is limited to an administrator at this screen, in the active session" \
            || bad "the rule is not limited to an active, local, wheel-group person"
          grep -q 'polkit.Result.NOT_HANDLED' "$RULES" 2>/dev/null \
            && ok "it answers nothing except its own action" \
            || bad "the rule does not return NOT_HANDLED for other actions — it could grant something else"

          echo "== a cold boot on this image is unchanged =="
          # ⚠️ THE MOST IMPORTANT CHECK IN THIS BLOCK. If this file ever shipped
          # as 'game', every machine following these images would stop showing a
          # login screen at its next restart and boot into Steam instead.
          # ⚠️ AND IT IS ASKED THE OTHER WAY ROUND ON THE HANDHELD IMAGE. That
          # image exists to start into Game Mode: it has no keyboard, so a
          # password box on it is a dead end. Same check, opposite expected
          # answer, and each image is held to exactly one of them — so a mix-up
          # between the two can never pass.
          FLAG=/etc/aquarius/login-mode
          if [ "${EXPECTED_HANDHELD}" = "1" ]; then
            if grep -qx 'mode=game' "$FLAG" 2>/dev/null; then
              ok "${FLAG} ships as 'game' — this handheld turns on straight into Steam, as it must"
            else
              bad "${FLAG} does not say mode=game on the handheld image — the Ally would stop at a password box it cannot type"
            fi
          else
            if grep -qx 'mode=desktop' "$FLAG" 2>/dev/null; then
              ok "${FLAG} ships as 'desktop' — switching this computer on shows the login screen"
            else
              bad "${FLAG} does not say mode=desktop. This image would change how every machine starts."
            fi
            grep -q '^mode=game' "$FLAG" 2>/dev/null \
              && bad "${FLAG} says 'game' — this image would boot straight into Steam" \
              || ok "nothing in the image asks for a boot into Game Mode"
          fi

          echo "== the services, switched on from /usr =="
          # Never through /etc: an update merges /etc and remembers deletions
          # for ever, so a single `systemctl disable` would switch one of these
          # off on that machine permanently. The long version is in
          # build_files/aq-lib.sh.
          L=/usr/lib/systemd/system/graphical.target.wants/aquarius-login-mode.service
          if [ -L "$L" ] && [ -e "$L" ]; then
            ok "aquarius-login-mode.service is switched on from /usr"
          else
            bad "$L is missing or dangling — a machine could not undo a Game Mode switch at boot"
          fi
          [ -e /etc/systemd/system/graphical.target.wants/aquarius-login-mode.service ] \
            && bad "aquarius-login-mode.service is ALSO switched on through /etc" \
            || ok "nothing switches it on through /etc"
          for u in aquarius-game-tidy.service aquarius-bluetooth-wake.service; do
            UL="/usr/lib/systemd/user/graphical-session.target.wants/${u}"
            if [ -L "$UL" ] && [ -e "$UL" ]; then ok "${u} is switched on from /usr"; else bad "$UL is missing or dangling"; fi
          done

          echo "== steamos-manager is installed and ASLEEP =="
          # It also contains Valve's own session switching, which is hard-wired
          # to SDDM and would fight ours. It only wakes up if an SDDM holo.conf
          # exists, so the check is that no such file does.
          if [ -e /usr/lib/sddm/sddm.conf.d/holo.conf ] || [ -e /etc/sddm.conf.d/holo.conf ]; then
            bad "an SDDM holo.conf is in this image — Valve's session switching would wake up"
          else
            ok "no SDDM holo.conf, so Valve's own session switching can never start"
          fi
          # ⚠️ ON THE HANDHELD IMAGE IT IS AWAKE, AND THAT IS THE POINT. Steam's
          # power-limit and battery-charge sliders are what it is for, and an
          # Ally has both. Phase G2 switches it on there and only there; the two
          # desktop images still carry it asleep, because a desktop PC has
          # nothing for it to manage. Valve's SESSION-switching half stays off on
          # every image — that is the holo.conf check above, not this one.
          if [ "${EXPECTED_HANDHELD}" = "1" ]; then
            L=/usr/lib/systemd/system/multi-user.target.wants/steamos-manager.service
            if [ -L "$L" ] && [ -e "$L" ]; then
              ok "steamos-manager.service is switched on from /usr — the handheld needs its sliders"
            else
              bad "$L is missing or dangling — Steam's TDP and battery sliders would do nothing on the Ally"
            fi
          else
            for u in steamos-manager.service steamos-manager-user.service; do
              if [ -e "/usr/lib/systemd/system/graphical.target.wants/${u}" ] \
                 || [ -e "/usr/lib/systemd/system/multi-user.target.wants/${u}" ] \
                 || [ -e "/etc/systemd/system/multi-user.target.wants/${u}" ]; then
                bad "${u} has been switched on — G1 leaves it asleep on a desktop image"
              else
                ok "${u} is not switched on"
              fi
            done
          fi

          echo "== the way in, and the way to read about it =="
          D=/usr/share/applications/aquarius-game-mode.desktop
          [ -r "$D" ] && ok "the 'Game Mode' launcher is in the app grid" || bad "$D is missing"
          grep -q '^Exec=/usr/libexec/aquarius-game-mode$' "$D" 2>/dev/null \
            && ok "it runs the program that warns first" \
            || bad "the launcher does not run /usr/libexec/aquarius-game-mode"
          grep -q '^Name=Game Mode$' "$D" \
            && ok "it is called plain 'Game Mode' in the app grid" \
            || bad "the launcher is not called 'Game Mode'"
          [ -s /usr/share/icons/hicolor/256x256/apps/aquarius-game-mode.png ] \
            && ok "its icon — Steam's, with the controller badge — is in hicolor" \
            || bad "aquarius-game-mode.png is missing from hicolor"
          /usr/bin/aq game --help > /tmp/aqgame.txt 2>&1 \
            && ok "'aq game --help' runs" \
            || bad "'aq game --help' does not run"
          [ -r /usr/share/aquarius/gaming/game-mode.md ] \
            && ok "the plain-language Game Mode note ships in the image" \
            || bad "/usr/share/aquarius/gaming/game-mode.md is missing"

          echo "== gamescope: Fedora's on AMD, ours on NVIDIA =="
          # ⚠️ THIS IS THE ONE PLACE THE TWO IMAGES ARE DELIBERATELY DIFFERENT.
          # NVIDIA's driver can back a scan-out buffer with scattered memory
          # (NVIDIA bug 5240452), and gamescope then puts part of another
          # program's window on your screen. AMD and Intel are unaffected. So
          # the NVIDIA image carries a gamescope we compiled with the fix, and
          # the AMD image must NOT carry it.
          if [ "${EXPECTED_NVIDIA}" = "1" ]; then
            if [ -x /usr/bin/aquarius-gamescope ]; then
              ok "our own gamescope is installed at /usr/bin/aquarius-gamescope"
            else
              bad "/usr/bin/aquarius-gamescope is missing — Game Mode on this image would draw a corrupted picture"
            fi
            # The fix has to be IN it, not merely switched on in a file. The
            # author's later work removed this setting and made the behaviour
            # unconditional, so pinning the wrong commit gives a program that
            # builds, installs, and quietly ignores the switch.
            # grep -a reads a program file as text; `strings` is not in the
            # bootc base image.
            if grep -aq 'drm_gbm_scanout' /usr/bin/aquarius-gamescope 2>/dev/null; then
              ok "our gamescope really contains the 'drm_gbm_scanout' fix"
            else
              bad "our gamescope has no 'drm_gbm_scanout' in it — the wrong commit was built"
            fi
            # Real-time scheduling, the same grant Fedora gives its own copy.
            if command -v getcap > /dev/null 2>&1; then
              cap="$(getcap /usr/bin/aquarius-gamescope 2>/dev/null || true)"
              echo "     capabilities: ${cap:-(none)}"
              case "${cap}" in
                *cap_sys_nice*) ok "it has cap_sys_nice, like Fedora's own gamescope" ;;
                *) bad "our gamescope has no cap_sys_nice — Game Mode would stutter" ;;
              esac
            else
              echo "     (getcap is not in the image; skipping the capability check)"
            fi
            DROPIN=/usr/lib/systemd/user/gamescope-session-plus@.service.d/10-aquarius-nvidia.conf
            grep -q '^Environment=GAMESCOPE_BIN=/usr/bin/aquarius-gamescope$' "$DROPIN" 2>/dev/null \
              && ok "the Game Mode session is pointed at our gamescope" \
              || bad "$DROPIN does not point the session at our gamescope"
            grep -q '^Environment=gamescope_drm_gbm_scanout=1$' "$DROPIN" 2>/dev/null \
              && ok "the NVIDIA picture fix is switched on for the session" \
              || bad "$DROPIN does not switch the NVIDIA picture fix on"
            # The pinned commit, written into the image so a person on the
            # machine can say which build they are running.
            B=/usr/share/aquarius/gaming/gamescope-build.txt
            if [ -r "$B" ]; then
              sed 's/^/       /' "$B"
              grep -Eq '^commit=[0-9a-f]{40}$' "$B" \
                && ok "the exact commit our gamescope came from is recorded in the image" \
                || bad "$B does not record a full commit id"
            else
              bad "$B is missing — nothing on the machine says which gamescope this is"
            fi
            # And Fedora's is untouched: ours goes BESIDE it, never over it.
            if rpm -V gamescope 2>/dev/null | grep -q '/usr/bin/gamescope'; then
              bad "Fedora's /usr/bin/gamescope has been modified — ours is meant to sit beside it"
            else
              ok "Fedora's own gamescope is untouched"
            fi
          else
            [ -e /usr/bin/aquarius-gamescope ] \
              && bad "a hand-built gamescope is on the AMD/Intel image — it is only ever for NVIDIA" \
              || ok "no hand-built gamescope on this image, as intended"
            [ -e /usr/lib/systemd/user/gamescope-session-plus@.service.d/10-aquarius-nvidia.conf ] \
              && bad "the NVIDIA-only Game Mode settings file is on the AMD/Intel image" \
              || ok "the NVIDIA-only settings file is not on this image, as intended"
            rpm -q gamescope > /dev/null 2>&1 \
              && ok "this image uses Fedora's gamescope $(rpm -q --queryformat '%{VERSION}-%{RELEASE}' gamescope)" \
              || bad "gamescope is not installed at all"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::Game Mode is incomplete."
            exit 1
          fi
          echo "All Game Mode checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            -e EXPECTED_NVIDIA="${NVIDIA}" \
            -e EXPECTED_HANDHELD="${HANDHELD}" \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-game-mode.sh

      # ------------------------------------------------------------------------
      # The handheld layer (Phase G2 — the ROG Xbox Ally X)
      # ------------------------------------------------------------------------
      # ⚠️ WHAT THIS CAN AND CANNOT PROVE, SAID PLAINLY.
      #
      # A GitHub runner is a virtual machine in a data centre. It has no ASUS
      # handheld, no controller, no speakers, no battery and no gyro. Nothing
      # here can show that a stick moves or that a speaker makes a sound.
      #
      # What it CAN show, and does, is that every piece is in the image and is
      # the piece we meant: the packages and which version of the one version
      # that matters, the device description that names this exact board, the two
      # udev rules byte for byte, the services switched on from /usr rather than
      # /etc, the firmware files on the disk, and the cold-boot setting shipped
      # the right way round for THIS image.
      #
      # AND — just as important — it runs on all three images and proves the
      # other two are untouched by the whole phase. That half is the promise that
      # phase G2 cannot change the computer Royce edits on.
      #
      # The real proof is the bench list in docs/restart/handheld.md.
      - name: Check the handheld layer is right for this image
        run: |
          set -euo pipefail
          cat > /tmp/verify-handheld.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          # ======================================================================
          # THE TWO DESKTOP IMAGES: none of this may be here
          # ======================================================================
          if [ "${EXPECTED_HANDHELD}" != "1" ]; then
            echo "== this is a desktop image: the handheld layer must be absent =="
            for pkg in inputplumber powerstation powerbuttond steamos-manager-powerstation opengamepadui; do
              if rpm -q "${pkg}" > /dev/null 2>&1; then
                bad "${pkg} is installed on a desktop image — that is handheld-only software"
              else
                ok "${pkg} is not on this image"
              fi
            done
            for f in /usr/lib/udev/rules.d/50-ally-x-controller.rules \
                     /usr/lib/udev/rules.d/70-aquarius-ally-mcu-powersave.rules \
                     /usr/lib/systemd/system/inputplumber.service.d/10-aquarius-before-login.conf \
                     /usr/libexec/aquarius-handheld-status \
                     /usr/share/aquarius/gaming/handheld.txt; do
              [ -e "$f" ] && bad "$f is on a desktop image" || ok "$f is not on this image"
            done
            # `aq` is ONE program on all three images, so `aq handheld` exists
            # here. It must refuse politely rather than look broken.
            if /usr/bin/aq handheld status > /tmp/hh.txt 2>&1; then
              bad "'aq handheld status' succeeded on a desktop image"
            else
              ok "'aq handheld status' explains that this is not a handheld, and stops"
            fi
            sed 's/^/       /' /tmp/hh.txt
            if [ "$fails" -ne 0 ]; then
              echo "::error::Part of the handheld layer has leaked onto a desktop image. Phase G2 must not change these two images."
              exit 1
            fi
            echo "All handheld-absence checks passed."
            exit 0
          fi

          # ======================================================================
          # THE HANDHELD IMAGE
          # ======================================================================
          echo "== the handheld packages =="
          for pkg in inputplumber steamos-manager-powerstation powerbuttond powerstation; do
            if rpm -q "${pkg}" > /dev/null 2>&1; then
              ok "${pkg} $(rpm -q --queryformat '%{VERSION}-%{RELEASE}' "${pkg}")"
            else
              bad "${pkg} is NOT installed"
            fi
          done
          # Terra is a build-time source only and step 78 removes it again, for
          # the same installer-ISO reason as steps 68 and 71.
          rpm -q terra-release > /dev/null 2>&1 \
            && bad "terra-release is still in the finished image — the installer ISO would not build" \
            || ok "Terra is gone from the finished image"
          # The plain steamos-manager must have been replaced, not doubled up.
          rpm -q steamos-manager > /dev/null 2>&1 \
            && bad "both steamos-manager and steamos-manager-powerstation are installed" \
            || ok "Terra's powerstation build replaced the plain steamos-manager"

          echo "== which InputPlumber, and what it is known to do wrong =="
          # ⚠️ THE ONE VERSION THAT MATTERS IN THIS WHOLE PHASE.
          #   * below 0.79.0 the back paddles and the Armoury / Library buttons
          #     on this exact device are mapped and labelled wrongly (fixed by
          #     InputPlumber PR #688);
          #   * 0.79.5 shortened the Ally X thumbstick range (issue #724).
          # Terra publishes one version at a time, so this is NOT a build
          # failure — it is a fact that has to be written down where the bench
          # can read it. That is /usr/share/aquarius/gaming/handheld.txt, and
          # this checks the note really carries the version that is installed.
          IPV="$(rpm -q --queryformat '%{VERSION}-%{RELEASE}' inputplumber)"
          echo "     InputPlumber in this image: ${IPV}"
          NOTE=/usr/share/aquarius/gaming/handheld.txt
          if grep -qF "version: ${IPV}" "$NOTE" 2>/dev/null; then
            ok "the image's own note records exactly this version"
          else
            bad "$NOTE does not record InputPlumber ${IPV} — the bench would have no way to know which one it has"
          fi
          echo "     what the note says about it:"
          sed 's/^/       /' "$NOTE" 2>/dev/null || true

          echo "== InputPlumber knows THIS machine =="
          Y=/usr/share/inputplumber/devices/50-rog_xbox_ally.yaml
          if [ -r "$Y" ]; then
            ok "the Xbox Ally device profile is in the image"
            grep -q 'RC73XA' "$Y" \
              && ok "it matches board RC73XA — the Xbox Ally X, which is the machine on the bench" \
              || bad "the profile does not mention RC73XA"
            grep -q 'product_id: 0x1b4c' "$Y" \
              && ok "it matches the built-in controller's USB id" \
              || bad "the profile does not match the built-in controller"
            grep -q 'bmi323-imu' "$Y" \
              && ok "it picks up the motion sensor, which is what gives Steam a gyro" \
              || bad "the profile does not pick up the gyro"
            grep -qE '^[[:space:]]*-[[:space:]]*xbox-elite$' "$Y" \
              && ok "the controller it builds is an Xbox Elite pad" \
              || bad "the profile does not build an xbox-elite controller"
          else
            bad "$Y is missing — the built-in controller would have no paddles and no gyro"
          fi
          [ -r /usr/share/inputplumber/capability_maps/ally_type2.yaml ] \
            && ok "the Xbox Ally button map is in the image" \
            || bad "ally_type2.yaml is missing — the paddles and the Armoury button would do nothing"

          echo "== Steam's power-limit table knows this exact board =="
          # There are two files mentioning an Xbox Ally and they do NOT agree:
          # rog-xbox-ally.toml is RC73YA (the Z2 A) limited to 20 W through
          # amdgpu's sensors; rog-ally-series.toml is the one carrying RC73XA,
          # driven through asus-armoury, the kernel's real ASUS power knobs. If a
          # future Terra build moved our board into the other file, the slider
          # would look fine and cap at 20 W on a 35 W machine.
          T=/usr/share/steamos-manager/devices/rog-ally-series.toml
          grep -q 'RC73XA' "$T" 2>/dev/null \
            && ok "RC73XA is in steamos-manager's device table" \
            || bad "$T does not mention RC73XA — Steam's TDP slider would not know this machine"
          grep -q 'attribute = "asus-armoury"' "$T" 2>/dev/null \
            && ok "and its power limit runs through asus-armoury" \
            || bad "$T does not use the asus-armoury power knobs"

          echo "== the two udev rules =="
          R1=/usr/lib/udev/rules.d/50-ally-x-controller.rules
          R2=/usr/lib/udev/rules.d/70-aquarius-ally-mcu-powersave.rules
          # ⚠️ R1 is Bazzite's, byte-identical (ublue-os/bazzite PR #5735). Do
          # not tidy it — keeping it identical means a future upstream change is
          # one `diff` instead of an argument.
          grep -q 'ATTR{idProduct}=="1b4c"' "$R1" 2>/dev/null \
            && ok "the wake-source rule is aimed at the built-in controller" \
            || bad "$R1 is missing or does not name the built-in controller"
          grep -q 'ATTR{power/wakeup}="disabled"' "$R1" 2>/dev/null \
            && ok "and it stops a nudged thumbstick waking the handheld in a bag" \
            || bad "$R1 does not disable the controller as a wake source"
          grep -q 'KERNEL=="asus-nb-wmi"' "$R2" 2>/dev/null \
            && ok "the controller-chip power-saving rule only fires on an ASUS machine" \
            || bad "$R2 is missing or not limited to ASUS hardware"
          grep -q 'ATTR{mcu_powersave}="1"' "$R2" 2>/dev/null \
            && ok "and it switches the controller chip's power saving on" \
            || bad "$R2 does not set mcu_powersave"
          if command -v udevadm > /dev/null 2>&1 && udevadm verify --help > /dev/null 2>&1; then
            for r in "$R1" "$R2"; do
              udevadm verify "$r" > /dev/null 2>&1 \
                && ok "udev can read $(basename "$r")" \
                || bad "udev refuses to load $r — it would be silently ignored on the machine"
            done
          fi

          echo "== the services, switched on from /usr and never through /etc =="
          # /etc is merged at every update and systemd remembers a deletion
          # there for ever, so one `systemctl disable` would switch a service off
          # permanently on that machine. The long version is in aq-lib.sh.
          check_link() {   # check_link <link> "<what it is for>"
            if [ -L "$1" ] && [ -e "$1" ]; then ok "$2 — $1"
            else bad "$2 — $1 is missing or points at nothing"; fi
          }
          check_link /usr/lib/systemd/system/multi-user.target.wants/inputplumber.service \
            "the built-in controller is assembled at every boot"
          check_link /usr/lib/systemd/system/sleep.target.wants/inputplumber-suspend.service \
            "the controller is put back together after the handheld wakes up"
          check_link /usr/lib/systemd/system/multi-user.target.wants/steamos-manager.service \
            "Steam's power and battery sliders have a service to talk to"
          check_link /usr/lib/systemd/system/multi-user.target.wants/powerstation.service \
            "the power limit has something to write through on AMD"
          check_link /usr/lib/systemd/user/gamescope-session-plus@steam.service.wants/steamos-manager.service \
            "the session half of the sliders starts with OUR Game Mode session"
          check_link /usr/lib/systemd/user/gamescope-session-plus@steam.service.wants/steamos-powerbuttond.service \
            "a short press of the power button sleeps the handheld"
          ETC="$(find /etc/systemd \( -name 'inputplumber*.service' -o -name 'steamos-*.service' -o -name 'powerstation.service' \) 2>/dev/null || true)"
          if [ -z "$ETC" ]; then
            ok "nothing is switched on through /etc"
          else
            echo "$ETC" | sed 's/^/       /'
            bad "a handheld service is switched on through /etc — an update could lose it"
          fi

          echo "== Steam's first run must find the controller (bazzite #3761) =="
          # Steam asks "is there a controller?" ONCE, very early, the first time
          # it runs. If InputPlumber has not finished by then, Steam shows
          # "connect a controller" on a machine whose controller is bolted to its
          # sides. This ordering is the fix.
          D=/usr/lib/systemd/system/inputplumber.service.d/10-aquarius-before-login.conf
          grep -qx 'Before=display-manager.service' "$D" 2>/dev/null \
            && ok "the login screen waits for InputPlumber" \
            || bad "$D does not order InputPlumber before the login screen"

          echo "== the firmware this machine cannot work without =="
          # Each one fails in a way that looks like broken hardware and says
          # nothing useful on screen. Fedora compresses firmware and has changed
          # which compression it uses, so every possible name is tried.
          fw() {   # fw <path-without-extension> "<what it is for>"
            for ext in "" .xz .zst .zstd; do
              if [ -e "$1${ext}" ]; then ok "$2 — $1${ext}"; return; fi
            done
            bad "$2 — no $1 in any form"
          }
          fw /usr/lib/firmware/TAS2XXX13840.bin "the speakers (TI TAS2781); without it the handheld is silent"
          fw /usr/lib/firmware/mediatek/WIFI_MT7922_patch_mcu_1_1_hdr.bin "Wi-Fi firmware patch (MT7922)"
          fw /usr/lib/firmware/mediatek/WIFI_RAM_CODE_MT7922_1.bin "Wi-Fi firmware (MT7922)"
          fw /usr/lib/firmware/mediatek/BT_RAM_CODE_MT7922_1_1_hdr.bin "Bluetooth firmware (MT7922)"
          fwfam() {   # fwfam <prefix> <at least> "<what it is>"
            n="$(find /usr/lib/firmware/amdgpu -maxdepth 1 -name "$1*" \( -type f -o -type l \) 2>/dev/null | wc -l | tr -d ' ')"
            if [ "$n" -ge "$2" ]; then ok "$3 — $n files matching $1*"
            else bad "$3 — only $n files matching $1*, expected at least $2"; fi
          }
          fwfam gc_11_5  7 "the graphics engine (AMD 'Strix')"
          fwfam psp_14_0 2 "the security processor (nothing draws without it)"
          fwfam vcn_4_0  1 "the video decoder and encoder"

          echo "== the drivers that go with them =="
          mod() {   # mod <name> "<what it is>"
            alt="$(printf '%s' "$1" | tr '_-' '-_')"
            if [ -n "$(find /usr/lib/modules \( -name "$1.ko*" -o -name "${alt}.ko*" \) 2>/dev/null | head -1)" ]; then
              ok "$2 — driver $1"
            else
              bad "$2 — driver $1 is MISSING; that part reports itself absent even with firmware present"
            fi
          }
          mod hid-asus            "the built-in controller and the ASUS buttons"
          mod bmi323_i2c          "the motion sensor (Steam's gyro)"
          mod mt7921e             "Wi-Fi and Bluetooth (MT7922)"
          mod snd-soc-tas2781-i2c "the speakers"
          mod asus-armoury        "the power-limit knobs Steam's TDP slider moves"

          echo "== the one command a bench session runs =="
          # It has to survive a machine with none of the hardware — which is
          # exactly what this runner is. A status command that stops half way
          # through is worse than useless.
          if /usr/libexec/aquarius-handheld-status > /tmp/hh.txt 2>&1; then
            ok "aquarius-handheld-status runs and finishes even with no handheld present"
          else
            bad "aquarius-handheld-status stopped with an error"
          fi
          head -20 /tmp/hh.txt | sed 's/^/       /'
          /usr/bin/aq handheld --help > /dev/null 2>&1 \
            && ok "'aq handheld --help' runs" \
            || bad "'aq handheld --help' does not run"

          if [ "$fails" -ne 0 ]; then
            echo "::error::The handheld layer is incomplete. See docs/restart/handheld.md."
            exit 1
          fi
          echo "All handheld checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            -e EXPECTED_HANDHELD="${HANDHELD}" \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-handheld.sh

      # ------------------------------------------------------------------------
      # THE INSTALLER-ISO REGRESSION GUARD
      # ------------------------------------------------------------------------
      # This is the check that keeps the "a stranger can install from a USB
      # stick" promise from silently breaking again.
      #
      # The installer ISO is built by osbuild's image-builder (build-iso.yml). To
      # work out the installer's package set it reads THIS image's repository
      # files and asks each repository for its catalogue — and it does that in a
      # small throwaway environment that does NOT contain this image's local GPG
      # key files. So any repository whose CATALOGUE is signed
      # (`repo_gpgcheck=1`) AND whose key is named by a local path
      # (`gpgkey=file://...`) makes image-builder fail with
      # "Curl error (37): Could not read a file:// file", and the ISO build dies
      # before it starts. That is osbuild/bootc-image-builder#1188, and on
      # 2026-09-06 (run 34012037986) it is exactly how the Terra repository —
      # added by the gaming layer and left in the image even while switched off —
      # blocked every ISO.
      #
      # ⚠️ THIS IS DELIBERATELY NOT A BLANKET BAN ON `gpgkey=file://`. RPM Fusion
      # uses a local-path key too, and it is fine and must stay: its catalogue is
      # NOT signed (`repo_gpgcheck=0`), so image-builder never reads its key, and
      # that key is only ever needed on the installed machine (where the file is
      # present) when someone layers a package by hand. Only the exact pair —
      # signed catalogue plus local key — is the trap, so that exact pair is what
      # this refuses. Checked inside the finished image, on the real repo files a
      # machine ships, never on the build checkout.
      - name: Check no repository file can break the installer ISO build
        run: |
          set -euo pipefail
          cat > /tmp/verify-iso-repos.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          echo "== the repository files this image ships =="
          ls -1 /etc/yum.repos.d/*.repo 2>/dev/null | sed 's/^/     /' || echo "     (none)"

          traps=0
          for repo in /etc/yum.repos.d/*.repo; do
            [ -e "${repo}" ] || continue
            # Per-section INI scan: a file may hold several [sections], and the
            # two keys can appear in either order, so decide at each section
            # boundary and at end-of-file. repo_gpgcheck=1 + gpgkey=file:// in the
            # SAME section is the osbuild#1188 trap.
            awk -v F="${repo}" '
              function flush() {
                if (sec != "" && rgc == 1 && filekey == 1)
                  printf "  TRAP  %s  %s: repo_gpgcheck=1 with gpgkey=file://\n", F, sec
              }
              /^[[:space:]]*\[/                                                    { flush(); sec = $0; rgc = 0; filekey = 0; next }
              /^[[:space:]]*repo_gpgcheck[[:space:]]*=[[:space:]]*1([[:space:]]|$)/ { rgc = 1 }
              /^[[:space:]]*gpgkey[[:space:]]*=[[:space:]]*file:\/\//               { filekey = 1 }
              END { flush() }
            ' "${repo}" > /tmp/aq-iso-trap.txt || true
            if [ -s /tmp/aq-iso-trap.txt ]; then
              cat /tmp/aq-iso-trap.txt
              traps=1
            fi
            rm -f /tmp/aq-iso-trap.txt
          done

          if [ "${traps}" -eq 0 ]; then
            ok "no repository pairs a signed catalogue with a local-path key — the installer ISO can depsolve"
          else
            bad "a repository would break the installer ISO's depsolve (osbuild#1188) — see the TRAP line(s) above; remove that repository from the image or point its gpgkey at an https:// URL"
          fi

          # And Terra specifically must be gone: it is the one this image adds and
          # then must remove (build_files/68-gaming.sh step 3b).
          if ls /etc/yum.repos.d/terra*.repo >/dev/null 2>&1; then
            bad "a Terra repository file is still in the image — it must be removed after Steam and umu are installed"
          else
            ok "no Terra repository file is in the image"
          fi

          if [ "${fails}" -ne 0 ]; then
            echo "::error::A repository in this image would stop the installer ISO from building."
            exit 1
          fi
          echo "All installer-ISO repository checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-iso-repos.sh

      - name: Check external drives automount and the updater window are really in there
        run: |
          set -euo pipefail
          cat > /tmp/verify-r6.sh <<'SCRIPT'
          set -u
          fails=0
          ok()  { echo "  OK   $*"; }
          bad() { echo "  FAIL $*"; fails=1; }

          echo "== the drive-mounting machinery and the filesystems creators plug in =="
          for pkg in udisks2 exfatprogs ntfs-3g polkit python3-gobject; do
            if rpm -q "${pkg}" > /dev/null 2>&1; then
              ok "${pkg} $(rpm -q --queryformat '%{VERSION}-%{RELEASE}' "${pkg}")"
            else
              bad "${pkg} is NOT installed"
            fi
          done

          echo "== the auto-mount agent =="
          AGENT=/usr/libexec/aquarius-automount
          if [ -x "${AGENT}" ]; then ok "the agent is present and runnable"
          else bad "${AGENT} is missing — nothing would mount a drive on insert"; fi
          if python3 -c 'import py_compile,sys; py_compile.compile(sys.argv[1],cfile="/tmp/a.pyc",doraise=True)' "${AGENT}" 2>/tmp/a.txt; then
            ok "the agent is valid Python"
          else bad "the agent has a syntax error"; cat /tmp/a.txt; fi
          # The rehearsal runs with no udisks2 and no screen — the finished image
          # has both absent in this container, so this is the real test that it loads.
          if "${AGENT}" --dry-run > /tmp/adry.txt 2>&1; then
            ok "'aquarius-automount --dry-run' runs and changes nothing"
          else bad "'aquarius-automount --dry-run' failed"; cat /tmp/adry.txt; fi
          grep -q 'HintSystem = false' /tmp/adry.txt \
            && ok "the agent states it leaves system-internal disks alone" \
            || bad "the agent no longer states the system-disk guard"

          echo "== the no-password polkit rule, and its limits =="
          RULE=/usr/share/polkit-1/rules.d/49-aquarius-udisks.rules
          if [ -r "${RULE}" ]; then ok "the rule is installed"
          else bad "${RULE} is missing — mounting would ask for a password"; fi
          grep -q 'subject\.local'  "${RULE}" && ok "scoped to the LOCAL session"  || bad "the rule is not scoped to subject.local"
          grep -q 'subject\.active' "${RULE}" && ok "scoped to the ACTIVE session" || bad "the rule is not scoped to subject.active"
          grep -q 'org\.freedesktop\.udisks2\.filesystem-mount' "${RULE}" && ok "allows mounting a removable filesystem" || bad "the rule does not allow filesystem-mount"
          grep -q 'org\.freedesktop\.udisks2\.eject-media'      "${RULE}" && ok "allows ejecting removable media"       || bad "the rule does not allow eject-media"
          grep -q 'polkit\.Result\.YES' "${RULE}" && ok "the rule actually grants something" || bad "the rule grants nothing"
          # ⚠️ The safety line: the CODE must NEVER name the internal-disk action,
          # or it would let an internal disk mount with no password. The comments
          # do mention it (to explain it is deliberately absent), so strip the
          # `//` comments before checking.
          if sed 's://.*::' "${RULE}" | grep -q 'filesystem-mount-system'; then
            bad "the rule grants filesystem-mount-system — internal disks would mount with no password"
          else
            ok "the rule's code says nothing about internal disks — they still need a password"
          fi

          echo "== the auto-mount service, switched on for both desktops =="
          UNIT=/usr/lib/systemd/user/aquarius-automount.service
          LINK=/usr/lib/systemd/user/graphical-session.target.wants/aquarius-automount.service
          grep -q '^ExecStart=/usr/libexec/aquarius-automount$' "${UNIT}" && ok "the service runs the agent" || bad "the service does not run the agent"
          grep -q '^ConditionUser=!@system$' "${UNIT}" && ok "the login screen does not run it" || bad "the service is missing ConditionUser=!@system"
          if [ -L "${LINK}" ] && [ -e "${LINK}" ]; then ok "the service is switched on from /usr (an update always restores it)"
          else bad "${LINK} is missing or dangling — the agent would never start"; fi
          if [ -e /etc/systemd/user/graphical-session.target.wants/aquarius-automount.service ]; then
            bad "the service is ALSO switched on through /etc — an update could lose that"
          else ok "nothing switches it on through /etc"; fi

          echo "== the 'Check for Update' window =="
          UPD=/usr/libexec/aquarius-updater
          if [ -x "${UPD}" ]; then ok "the updater is present and runnable"
          else bad "${UPD} is missing — 'Check for Update' would do nothing"; fi
          if python3 -c 'import py_compile,sys; py_compile.compile(sys.argv[1],cfile="/tmp/u.pyc",doraise=True)' "${UPD}" 2>/tmp/u.txt; then
            ok "the updater is valid Python"
          else bad "the updater has a syntax error"; cat /tmp/u.txt; fi
          # GTK 4 + libadwaita, the toolkit the window is drawn with.
          if python3 -c 'import gi; gi.require_version("Gtk","4.0"); gi.require_version("Adw","1"); from gi.repository import Gtk, Adw' 2>/tmp/gi.txt; then
            ok "Python can reach GTK 4 and libadwaita"
          else bad "Python cannot import GTK 4 and libadwaita — the window could not be drawn"; cat /tmp/gi.txt; fi
          # The mark-on-every-page rule (2026-09-04).
          if grep -q 'Adw\.StatusPage(' "${UPD}"; then bad "the updater builds an Adw.StatusPage — that page cannot show the mark"
          else ok "the updater builds no Adw.StatusPage anywhere"; fi
          grep -qF 'aquarius_ui.hero(' "${UPD}" && ok "it draws its pages with aquarius_ui.hero()" || bad "it does not use aquarius_ui.hero()"
          # The rehearsal: prints the version and describes the check, no window.
          if "${UPD}" --dry-run > /tmp/udry.txt 2>&1; then ok "'aquarius-updater --dry-run' runs"
          else bad "'aquarius-updater --dry-run' failed"; cat /tmp/udry.txt; fi
          grep -q 'Current version:'    /tmp/udry.txt && ok "the rehearsal prints the current version" || bad "the rehearsal does not print the version"
          # Since bug U1 (2026-09-13) the check compares digests as an ordinary user;
          # the rehearsal says so in words. Same pattern as build_files/77-updater.sh.
          grep -q 'without asking for a password' /tmp/udry.txt && ok "the rehearsal states that checking needs no password" || bad "the rehearsal does not state that checking needs no password"
          grep -q 'pkexec bootc upgrade' /tmp/udry.txt && ok "the rehearsal states how it elevates" || bad "the rehearsal does not state how it elevates"
          # The launcher entry.
          DESK=/usr/share/applications/aquarius-updater.desktop
          grep -q '^Exec=/usr/libexec/aquarius-updater$' "${DESK}" && ok "the launcher runs the updater" || bad "the launcher does not run the updater"
          grep -q '^NoDisplay=true$' "${DESK}" && ok "it is hidden from the app grid (the logo menu launches it)" || bad "the launcher is not NoDisplay=true"
          if command -v desktop-file-validate >/dev/null 2>&1; then
            if desktop-file-validate "${DESK}" 2>/tmp/dfv.txt; then ok "desktop-file-validate accepts the launcher"
            else bad "desktop-file-validate rejects the launcher"; cat /tmp/dfv.txt; fi
          else
            echo "  note desktop-file-validate is not in this image; the build validated it"
          fi
          # bootc, and the version file the window reads.
          [ -x /usr/bin/bootc ] && ok "bootc is present to do the update" || bad "bootc is missing"
          grep -q '"version-pretty"' /usr/share/aquarius/image-info.json && ok "the image records a version for the window to show" || bad "image-info.json has no version-pretty"
          # `aq update` is wired in.
          if /usr/bin/aq update --help > /dev/null 2>&1; then ok "'aq update --help' works"
          else bad "'aq update' is not wired up"; fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The automount or updater pieces are missing or wrong."
            exit 1
          fi
          echo "All automount and updater checks passed."
          SCRIPT
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < /tmp/verify-r6.sh
      - name: Check the Bazzite images were archived first
        if: github.ref_name == 'main' || github.ref_name == 'restart/fedora-bootc'
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          if ! command -v skopeo >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y skopeo
          fi

          # Reading a public package needs no credentials, but signing in costs
          # nothing and means a package that has been made private does not look
          # like a missing archive.
          echo "${GH_TOKEN}" | skopeo login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin >/dev/null 2>&1 || true

          missing=0
          for img in aquarius-os aquarius-os-nvidia aquarius-os-deck \
                     aquarius-os-gnome aquarius-os-gnome-nvidia aquarius-os-gnome-deck; do
            ref="docker://ghcr.io/${OWNER,,}/${img}:bazzite-final"
            if digest="$(skopeo inspect --no-tags --format '{{.Digest}}' "${ref}" 2>/dev/null)"; then
              echo "  OK   ${img}:bazzite-final  ${digest}"
            else
              echo "  FAIL ${img}:bazzite-final is not there"
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            {
              echo "### Stopped before publishing — on purpose"
              echo ""
              echo "The image built and passed every check. It was **not published**, because"
              echo "the older Bazzite images have not been saved under their permanent"
              echo "\`bazzite-final\` tag yet, and publishing would take their names away."
              echo ""
              echo "**What to do:**"
              echo ""
              echo "1. Actions → **Archive the Bazzite image tags** → *Run workflow*"
              echo "   (leave the dry-run box ticked the first time, then run it again unticked)."
              echo "2. Come back to this run and press **Re-run all jobs**."
              echo ""
              echo "The whole sequence is written out in \`docs/restart/final-names.md\`."
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "::error::The Bazzite images have not been archived yet, so publishing would overwrite them. Run 'Archive the Bazzite image tags' first — see docs/restart/final-names.md."
            exit 1
          fi
          echo "The Bazzite images are safely archived. Publishing is allowed."

      - name: Work out the tags to publish under
        if: github.ref_name == 'main' || github.ref_name == 'restart/fedora-bootc'
        id: tags
        run: |
          alias_tags="$(just generate-build-tags "${IMAGE_NAME}" "${DEFAULT_TAG}")"
          echo "Publishing as: ${alias_tags}"
          echo "alias_tags=${alias_tags}" >> "${GITHUB_OUTPUT}"

      - name: Apply the tags
        if: github.ref_name == 'main' || github.ref_name == 'restart/fedora-bootc'
        env:
          ALIAS_TAGS: ${{ steps.tags.outputs.alias_tags }}
        run: just tag-images "${IMAGE_NAME}" "${DEFAULT_TAG}" "${ALIAS_TAGS}"

      - name: Sign in to GitHub's container registry
        if: github.ref_name == 'main' || github.ref_name == 'restart/fedora-bootc'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.ref_name == 'main' || github.ref_name == 'restart/fedora-bootc'
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile \
              "${IMAGE_NAME}:${tag}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done
          digest="$(< /tmp/digestfile)"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Install cosign
        if: github.ref_name == 'main' || github.ref_name == 'restart/fedora-bootc'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      # Signing is what lets a machine prove an update really came from us and
      # was not swapped out on the way. The private key is a repository secret
      # called SIGNING_SECRET; the matching public half is cosign.pub in this
      # repository, and it is the same pair the Bazzite line uses.
      - name: Sign the published image
        if: github.ref_name == 'main' || github.ref_name == 'restart/fedora-bootc'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: What was published
        if: github.ref_name == 'main' || github.ref_name == 'restart/fedora-bootc'
        run: |
          echo "### ${IMAGE_NAME}" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Published to \`${IMAGE_REGISTRY}/${IMAGE_NAME}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "To put it on a machine already running AquariusOS:" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          echo "sudo bootc switch ${IMAGE_REGISTRY}/${IMAGE_NAME}:latest" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
  # ⚠️ A WHOLE JOB USED TO LIVE HERE AND IT IS GONE — 15 September 2026.
  #
  # `shell_tests` ("The Aquarius Shell's own checks") cloned the aquarius-shell
  # repository at the exact commit this image pinned, ran that repository's own
  # test suite against it, and then ran build_files/check-labwc-drift.sh to
  # prove the four labwc files existed identically in both repositories. It also
  # carried a `grep` shim, because the shell's tests used `printf | grep -q`
  # under `set -o pipefail` and that combination reports a match as a failure
  # (the trap written up at length in build_files/aq-lib.sh).
  #
  # Royce retired the Aquarius Session and asked for GNOME and KDE Plasma
  # instead (../docs/decision-2026-09-15-two-desktops.md). This image pins no
  # shell commit, ships no labwc files, and has nothing to drift against. The
  # shell repository is tagged `aquarius-session-final` and keeps its own tests
  # for anybody who ever goes back to it.


  # ============================================================================
  # The names have not slipped back
  # ============================================================================
  # From 2 to 4 September 2026 these images were published under temporary names
  # — `aquarius-os-next` and `aquarius-os-next-nvidia` — so that the restart
  # could be built and installed without overwriting the older Bazzite images
  # people were still running. Those names are finished.
  #
  # The danger is not that somebody types the old name on purpose. It is that an
  # old branch gets merged, or a paragraph gets copied from an old document, and
  # the word comes back into a place that MATTERS — the build settings, the
  # recipe, the installer's kickstart — where it would publish or install the
  # wrong thing, and nothing else in CI would notice, because building an image
  # under a wrong name works perfectly.
  #
  # So this job reads the whole repository and fails if the old name appears
  # anywhere except the handful of files that are ALLOWED to say it, because
  # their job is to record that it happened.
  #
  # It takes about five seconds and runs beside the thirty-minute image build,
  # so a name mistake is visible almost immediately.
  names:
    name: The old image names have not come back
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Look for the retired names
        run: |
          set -uo pipefail

          # The files whose whole purpose is to explain the old names. A match
          # in one of these is correct and expected.
          allowed=(
            "aquarius-os.env"                 # the history note beside the names
            "docs/restart/final-names.md"     # the step-by-step for the rename
            "docs/restart/history.md"         # the record of what was archived
            "docs/restart/bench-rebase.md"    # names the image the bench came FROM
            ".github/workflows/build.yml"     # this comment, and this job
          )

          echo "== searching every tracked file for 'aquarius-os-next' =="
          hits="$(git grep -n --fixed-strings 'aquarius-os-next' -- . || true)"

          if [ -z "${hits}" ]; then
            echo "  OK   the retired names appear nowhere at all"
            exit 0
          fi

          fails=0
          while IFS= read -r line; do
            file="${line%%:*}"
            ok=0
            for a in "${allowed[@]}"; do
              [ "${file}" = "${a}" ] && ok=1 && break
            done
            if [ "${ok}" -eq 1 ]; then
              echo "  ok   ${line}"
            else
              echo "  FAIL ${line}"
              fails=1
            fi
          done <<< "${hits}"

          if [ "${fails}" -ne 0 ]; then
            echo "::error::The retired image name 'aquarius-os-next' is back in a file that is not a history note. The images are called aquarius-os and aquarius-os-nvidia. See docs/restart/final-names.md."
            exit 1
          fi
          echo "  OK   every mention is in a file that exists to record the history"

      - name: The names the build will actually publish
        run: |
          set -euo pipefail
          # Read them back out of the one file that defines them, rather than
          # trusting that the line above says what we think it says.
          # shellcheck disable=SC1091
          . ./aquarius-os.env
          echo "IMAGE_NAME          = ${IMAGE_NAME}"
          echo "NVIDIA_IMAGE_NAME   = ${NVIDIA_IMAGE_NAME}"
          echo "HANDHELD_IMAGE_NAME = ${HANDHELD_IMAGE_NAME}"
          fails=0
          [ "${IMAGE_NAME}" = "aquarius-os" ] || { echo "  FAIL IMAGE_NAME should be aquarius-os"; fails=1; }
          [ "${NVIDIA_IMAGE_NAME}" = "aquarius-os-nvidia" ] || { echo "  FAIL NVIDIA_IMAGE_NAME should be aquarius-os-nvidia"; fails=1; }
          [ "${HANDHELD_IMAGE_NAME}" = "aquarius-os-handheld" ] || { echo "  FAIL HANDHELD_IMAGE_NAME should be aquarius-os-handheld"; fails=1; }
          # And the installer must point new machines at the same place.
          grep -q 'ghcr.io/stoneharborent/aquarius-os:latest' disk_config/iso.toml \
            || { echo "  FAIL disk_config/iso.toml does not point installed machines at ghcr.io/stoneharborent/aquarius-os:latest"; fails=1; }
          if [ "${fails}" -ne 0 ]; then
            echo "::error::The published names are not the final ones."
            exit 1
          fi
          echo "  OK   both names and the installer's update target are the final ones"
