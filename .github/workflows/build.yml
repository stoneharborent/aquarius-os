---
# Builds the AquariusOS container images and publishes them to GitHub Container
# Registry.
#
# It builds THREE images from the same recipe, side by side, every run:
#
#   aquarius-os          for AMD and Intel graphics  (the default AquariusOS)
#   aquarius-os-nvidia   for NVIDIA graphics cards
#   aquarius-os-deck     for gaming handhelds — boots into Game Mode
#
# That is what the "matrix" below is: one job definition, run once per variant.
# If one goes red the others still finish (fail-fast is off), so a problem with
# the handheld build can never stop the normal image from shipping.
#
# Neither image name nor base image is hardcoded here — both come from
# aquarius-os.env, which the Justfile reads. One place, used everywhere.
name: Build AquariusOS image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

# Plain English: "concurrency" decides what happens when this workflow starts
# again while an earlier run is still going. Runs sharing the same "group" name
# are one queue, and cancel-in-progress means the newer run kicks the older one
# out — so pushing twice in a row doesn't leave a stale build running.
#
# No variant in the group name here, and that's correct: unlike the ISO and disk
# workflows, ONE run of this builds ALL THREE variants together (that's the
# matrix below), so there is no second run for it to cancel by mistake. Adding a
# variant to the matrix therefore needs no change here — checked again when the
# deck variant was added, 2026-08-28.
#
# This used to also tack on inputs.brand_name and inputs.stream_name. Those
# inputs don't exist in this workflow — they were leftovers from the upstream
# ublue template we started from, so they always came out empty. Removed so the
# group name says what it means.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image (${{ matrix.variant }})
    runs-on: ubuntu-24.04

    strategy:
      # Don't let one variant failing cancel the others mid-build.
      fail-fast: false
      matrix:
        # These are the names the Justfile understands
        # (`just variant-image-name` / `just variant-base-image`). Adding one
        # here without adding it there fails the "Image Name" step immediately,
        # which is the intended behaviour — the Justfile is the list of record.
        variant: [base, nvidia, deck]

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      # Both of the next two steps read aquarius-os.env, picking the value for
      # whichever variant this matrix job is: what to call the image we publish,
      # and which Bazzite image to build it on top of.
      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just variant-image-name ${{ matrix.variant }})

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      # Deliberately NOT called BASE_IMAGE. A real environment variable beats
      # aquarius-os.env inside `just`, so exporting BASE_IMAGE here would quietly
      # rewrite the file's own value for every later step.
      - name: Base Image
        id: base-image
        run: |
          VARIANT_BASE_IMAGE=$(just variant-base-image ${{ matrix.variant }})

          echo "VARIANT_BASE_IMAGE=${VARIANT_BASE_IMAGE}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG} \
            ${VARIANT_BASE_IMAGE}

      # This is optional, this provides smaller delta updates
      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          just ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # ------------------------------------------------------------------------
      # Prove the finished image really calls itself AquariusOS
      # ------------------------------------------------------------------------
      # Plain English: this starts the image we just built, looks inside it, and
      # fails the build if anything still says "Bazzite" where it should say
      # "AquariusOS".
      #
      # Why this exists: on 2026-08-28 an image shipped, installed, and booted
      # with KDE's About page still saying "Bazzite 44 / NVIDIA Edition /
      # https://bazzite.gg". The build had been green the whole time, because the
      # only thing it checked was one line of one file. A green tick is supposed
      # to mean "the OS knows its own name", so from now on it is checked here,
      # from the outside, on the exact image that gets pushed.
      #
      # It runs AFTER the rechunk step on purpose — that way we are inspecting
      # the same bits that go to the registry, not an earlier copy of them.
      #
      # `podman` is already installed on GitHub's Ubuntu runners, and the script
      # is fed in on standard input so there is no quoting to get wrong.
      - name: Verify OS identity
        id: verify-identity
        run: |
          set -euo pipefail
          cat >/tmp/verify-identity.sh <<'SCRIPT'
          set -u

          fails=0
          check() {  # check "<description>" "<pattern>" "<file>"
            if grep -Eq "$2" "$3"; then
              echo "  OK   $1"
            else
              echo "  FAIL $1  — /$2/ not found in $3"
              fails=1
            fi
          }

          echo "== /usr/lib/os-release =="
          cat /usr/lib/os-release
          echo "== /etc/os-release =="
          ls -l /etc/os-release
          echo "== /etc/xdg/kcm-about-distrorc =="
          cat /etc/xdg/kcm-about-distrorc || echo "(missing!)"
          echo "== checks =="

          # The two os-release files must BOTH say AquariusOS. On Fedora the
          # second is a link to the first, so this also proves the link is intact.
          check "/etc/os-release NAME"          '^NAME="AquariusOS"'      /etc/os-release
          check "/etc/os-release PRETTY_NAME"   '^PRETTY_NAME="AquariusOS"' /etc/os-release
          check "/usr/lib/os-release says AquariusOS" 'AquariusOS'        /usr/lib/os-release

          # The fields the About page and the network name are built from.
          check "LOGO is ours"                  '^LOGO=aquarius-logo$'    /etc/os-release
          check "DEFAULT_HOSTNAME is aquarius"  '^DEFAULT_HOSTNAME="aquarius"$' /etc/os-release
          # The edition line. This list must match the `case` in
          # build_files/image-info.sh — a new image whose edition is not named in
          # BOTH places is a half-wired image, and this is where that gets caught.
          check "VARIANT is an AquariusOS edition" '^VARIANT="(NVIDIA|Desktop|Handheld) Edition"$' /etc/os-release

          # ID stays "bazzite" deliberately — Bazzite's tooling and our Anaconda
          # installer profile both key off it. Checked so nobody "tidies" it away.
          check "ID deliberately left as bazzite" '^ID=bazzite$'          /etc/os-release

          # KDE's About page override. This is the file that caused the bug.
          check "About page name"               '^Name=AquariusOS$'       /etc/xdg/kcm-about-distrorc
          check "About page website"            '^Website=https://github\.com/' /etc/xdg/kcm-about-distrorc

          # --- the file Bazzite's own boot scripts read -----------------------
          # /usr/share/ublue-os/image-info.json is not a label. Bazzite's
          # first-boot and session scripts read it back at RUNTIME. Two fields in
          # it decide, on the handheld image, whether the machine starts up in
          # Game Mode at all — and we overwrite the whole file. So the two fields
          # that matter are checked here, on the finished image, for every
          # variant. Full explanation: build_files/image-info.sh, step 1.
          INFO=/usr/share/ublue-os/image-info.json
          echo "== ${INFO} =="
          cat "$INFO" || echo "(missing!)"

          json_field() {  # json_field <key>  → its value, or nothing
            sed -n "s/^[[:space:]]*\"$1\"[[:space:]]*:[[:space:]]*\"\([^\"]*\)\".*/\1/p" "$INFO" | head -n1
          }

          if [ ! -f "$INFO" ]; then
            echo "  FAIL ${INFO} does not exist"
            fails=1
          else
            # 1. base-image-name must stay the word Bazzite put there. Their
            #    /usr/libexec/bazzite-autologin reads it to choose which session
            #    to log into and silently skips autologin on anything it does not
            #    recognise — which on a handheld means no Game Mode.
            base_img="$(json_field base-image-name)"
            case "$base_img" in
              *kinoite* | *silverblue*)
                echo "  OK   base-image-name is '${base_img}' (bazzite-autologin understands it)" ;;
              *)
                echo "  FAIL base-image-name is '${base_img}' — expected kinoite or silverblue."
                echo "       Bazzite's autologin skips anything else, so a handheld built"
                echo "       like this boots to a login screen instead of Game Mode."
                fails=1 ;;
            esac

            # 2. image-name must be OUR image's name, and — because Bazzite's
            #    scripts ask "am I a handheld?" by looking for the substring
            #    "deck" in it — a handheld image's name must still contain it.
            img="$(json_field image-name)"
            if [ "$img" = "${EXPECTED_IMAGE_NAME}" ]; then
              echo "  OK   image-name is '${img}'"
            else
              echo "  FAIL image-name is '${img}', expected '${EXPECTED_IMAGE_NAME}'"
              fails=1
            fi
            case "${EXPECTED_IMAGE_NAME}" in
              *deck*)
                case "$img" in
                  *deck*) echo "  OK   handheld image-name still contains 'deck'" ;;
                  *)
                    echo "  FAIL this is the handheld image but image-name '${img}' has no 'deck' in it."
                    echo "       Bazzite's handheld setup would switch itself off."
                    fails=1 ;;
                esac ;;
            esac
          fi

          # Nothing user-facing may still send people to bazzite.gg as our home.
          if grep -q '^HOME_URL="https://bazzite.gg"' /etc/os-release; then
            echo "  FAIL HOME_URL still points at bazzite.gg"
            fails=1
          else
            echo "  OK   HOME_URL is not bazzite.gg"
          fi

          # The logo file the two settings above name has to actually be there.
          if [ -f /usr/share/icons/hicolor/scalable/apps/aquarius-logo.svg ]; then
            echo "  OK   aquarius-logo.svg is installed"
          else
            echo "  FAIL aquarius-logo.svg is missing — the About page would be blank"
            fails=1
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::This image does not identify as AquariusOS. See the checks above."
            exit 1
          fi
          echo "All identity checks passed."
          SCRIPT

          # EXPECTED_IMAGE_NAME is handed IN to the container rather than baked
          # into the script above: the heredoc is quoted ('SCRIPT') so that
          # nothing in it is expanded out here on the runner, which is what keeps
          # all the grep patterns readable and free of escaping.
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            -e EXPECTED_IMAGE_NAME="${IMAGE_NAME}" \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" </tmp/verify-identity.sh

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      #- name: Rechunk with Chunkah
      #  id: rechunk
      #  run: |
      #    just rechunk \
      #      ${IMAGE_NAME} \
      #      ${DEFAULT_TAG}

      # ------------------------------------------------------------------------
      # Prove the creator apps can actually be run by a real person
      # ------------------------------------------------------------------------
      # Plain English: this opens the finished image and checks that the two
      # apps AquariusOS builds in — Aquarius Editor and Aquarius Writer — are
      # installed in a way that an ordinary account can actually start.
      #
      # WHY IT EXISTS
      # On 2026-08-28 an image shipped in which BOTH apps were present, both
      # appeared in the app grid, and clicking either did nothing at all. One
      # file inside Aquarius Writer was mode 0770 — runnable by its owner and by
      # nobody else. Every check in the build had passed, because every check in
      # the build runs as root, and root ignores permissions. The first person
      # to find out was the person the OS is for.
      #
      # So the question this step asks is not "does this file exist" but
      # "COULD SOMEBODY WHO IS NOT ROOT RUN THIS". It is asked here, on the
      # image that is about to be pushed, after the rechunk step — because
      # rechunking re-packs every file, and whether it preserves things like the
      # setuid bit on Electron's sandbox helper is precisely the kind of thing
      # nobody should be taking on trust.
      - name: Verify creator apps
        id: verify-creator-apps
        run: |
          set -euo pipefail
          cat >/tmp/verify-creator-apps.sh <<'SCRIPT'
          set -u

          fails=0
          bad() { echo "  FAIL $*"; fails=1; }
          ok()  { echo "  OK   $*"; }

          # The launcher every app-grid click goes through.
          for f in /usr/bin/aquarius-editor /usr/bin/aquarius-writer /usr/libexec/aquarius-app-launch; do
            if [ -x "$f" ] && [ -r "$f" ]; then ok "$f is present and runnable"
            else bad "$f is missing or not runnable"; ls -l "$f" || true; fi
          done

          for app in aquarius-editor aquarius-writer; do
            dir="/usr/lib/aquarius/${app}"
            echo "== ${dir} =="

            if [ ! -d "$dir" ]; then bad "${dir} does not exist"; continue; fi

            # The entry point.
            if [ -x "${dir}/AppRun" ]; then ok "AppRun is executable"
            else bad "AppRun missing or not executable"; fi

            # --- the checks that matter: could a NON-root account use this? ---
            # 1. everything readable by everyone
            n="$(find "$dir" \( -type f -o -type d \) ! -perm -o+r | tee /tmp/x | wc -l)"
            if [ "$n" -eq 0 ]; then ok "every file and folder is world-readable"
            else bad "${n} files/folders are not readable by an ordinary account"; head -5 /tmp/x | xargs -r ls -ld; fi

            # 2. anything the packager marked runnable is runnable by everyone.
            #    THIS is the check that catches the 0770 bug.
            n="$(find "$dir" -type f -perm -u+x ! -perm -o+x | tee /tmp/x | wc -l)"
            if [ "$n" -eq 0 ]; then ok "every program inside is world-executable"
            else bad "${n} programs cannot be run by an ordinary account"; head -5 /tmp/x | xargs -r ls -l; fi

            # 3. folders can be entered
            n="$(find "$dir" -type d ! -perm -o+x | tee /tmp/x | wc -l)"
            if [ "$n" -eq 0 ]; then ok "every folder can be entered"
            else bad "${n} folders cannot be entered"; head -5 /tmp/x | xargs -r ls -ld; fi

            # 4. nothing in /usr may be writable by anyone who happens to log in
            n="$(find "$dir" ! -type l -perm -o+w | tee /tmp/x | wc -l)"
            if [ "$n" -eq 0 ]; then ok "nothing is world-writable"
            else bad "${n} world-writable files under /usr"; head -5 /tmp/x | xargs -r ls -l; fi

            # 5. no symlink left pointing at the build machine
            n="$(find "$dir" -xtype l | tee /tmp/x | wc -l)"
            if [ "$n" -eq 0 ]; then ok "no broken symlinks"
            else bad "${n} symlinks point at nothing"; head -5 /tmp/x | xargs -r ls -l; fi

            # 6. the app-grid entry, and the icon it names
            d="/usr/share/applications/${app}.desktop"
            if [ -f "$d" ]; then ok "app-grid entry present"
            else bad "app-grid entry ${d} missing"; fi
            if [ -f "/usr/share/pixmaps/${app}.png" ]; then ok "icon installed"
            else bad "no icon at /usr/share/pixmaps/${app}.png — the grid would show a placeholder"; fi
          done

          # --- Electron's sandbox helper, on the FINAL image -------------------
          # This is the one the rechunk step could plausibly damage. Electron
          # aborts instantly, with no window at all, if this file exists but is
          # not root-owned with the setuid bit set.
          sb=/usr/lib/aquarius/aquarius-editor/chrome-sandbox
          if [ -e "$sb" ]; then
            mode="$(stat -c '%a' "$sb")"; own="$(stat -c '%U:%G' "$sb")"
            if [ "$mode" = "4755" ] && [ "$own" = "root:root" ]; then
              ok "chrome-sandbox survived packaging as root:root 4755"
            else
              bad "chrome-sandbox is ${own} mode ${mode}, expected root:root 4755"
              echo "       (the image build set it correctly, so this means the"
              echo "        rechunk/packaging step did not preserve the setuid bit)"
            fi
          fi

          # --- our ujust recipes are actually in the menu ----------------------
          if grep -q '96-aquarius-creator.just' /usr/share/ublue-os/justfile; then
            ok "AquariusOS recipes are imported into ujust"
          else
            bad "96-aquarius-creator.just is not imported — 'ujust' would not list our recipes"
          fi
          for f in /usr/libexec/aquarius-install-resolve /usr/libexec/aquarius-resolve-launch; do
            if [ -x "$f" ]; then ok "$(basename "$f") is installed"
            else bad "$f is missing or not runnable"; fi
          done

          # --- desktop entries are valid --------------------------------------
          # Only "error:" lines fail the build. desktop-file-validate also emits
          # "hint:" and "warning:" lines about things like an entry belonging to
          # two main menu categories — worth reading, never worth refusing to
          # ship an OS over.
          if command -v desktop-file-validate >/dev/null 2>&1; then
            for d in /usr/share/applications/aquarius-*.desktop; do
              out="$(desktop-file-validate "$d" 2>&1 || true)"
              errs="$(printf '%s\n' "$out" | grep -F 'error:' || true)"
              if [ -n "$errs" ]; then
                bad "invalid desktop entry $(basename "$d"):"; printf '       %s\n' "$errs"
              else
                ok "valid: $(basename "$d")"
                [ -n "$out" ] && printf '       (note) %s\n' "$out"
              fi
            done
          else
            echo "  NOTE desktop-file-validate is not in the image; skipping entry validation"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The creator apps in this image cannot be started by an ordinary account. See above."
            exit 1
          fi
          echo "All creator-app checks passed."
          SCRIPT

          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" </tmp/verify-creator-apps.sh

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

