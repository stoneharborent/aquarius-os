---
# Builds the AquariusOS container images and publishes them to GitHub Container
# Registry.
#
# It builds SIX images from the same recipe, side by side, every run.
#
# The KDE line — FROZEN, still published so installed machines keep updating:
#   aquarius-os                for AMD and Intel graphics
#   aquarius-os-nvidia         for NVIDIA graphics cards
#   aquarius-os-deck           for gaming handhelds — boots into Game Mode
#
# The GNOME line — added 2026-08-31, where all new work goes:
#   aquarius-os-gnome          for AMD and Intel graphics
#   aquarius-os-gnome-nvidia   for NVIDIA graphics cards
#   aquarius-os-gnome-deck     for gaming handhelds — boots into Game Mode
#
# That is what the "matrix" below is: one job definition, run once per variant.
# If one goes red the others still finish (fail-fast is off), so a problem with
# the handheld build can never stop the normal image from shipping — and, since
# 2026-08-31, a problem in the new GNOME line can never stop the frozen KDE
# images from shipping either.
#
# Neither image name nor base image is hardcoded here — both come from
# aquarius-os.env, which the Justfile reads. One place, used everywhere.
name: Build AquariusOS image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

# Plain English: "concurrency" decides what happens when this workflow starts
# again while an earlier run is still going. Runs sharing the same "group" name
# are one queue, and cancel-in-progress means the newer run kicks the older one
# out — so pushing twice in a row doesn't leave a stale build running.
#
# No variant in the group name here, and that's correct: unlike the ISO and disk
# workflows, ONE run of this builds ALL SIX variants together (that's the matrix
# below), so there is no second run for it to cancel by mistake. Adding a variant
# to the matrix therefore needs no change here — checked when the deck variant
# was added (2026-08-28) and again when the three GNOME variants were added
# (2026-08-31). Per-variant scoping still matters in build-iso.yml, which really
# does run once per variant; that one has the variant in its group name.
#
# This used to also tack on inputs.brand_name and inputs.stream_name. Those
# inputs don't exist in this workflow — they were leftovers from the upstream
# ublue template we started from, so they always came out empty. Removed so the
# group name says what it means.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image (${{ matrix.variant }})
    runs-on: ubuntu-24.04

    strategy:
      # Don't let one variant failing cancel the others mid-build.
      fail-fast: false
      matrix:
        # These are the names the Justfile understands
        # (`just variant-image-name` / `just variant-base-image` /
        # `just variant-desktop`). Adding one here without adding it there fails
        # the "Image Name" step immediately, which is the intended behaviour —
        # the Justfile is the list of record.
        variant: [base, nvidia, deck, gnome, gnome-nvidia, gnome-deck]

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      # Both of the next two steps read aquarius-os.env, picking the value for
      # whichever variant this matrix job is: what to call the image we publish,
      # and which Bazzite image to build it on top of.
      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just variant-image-name ${{ matrix.variant }})

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      # Deliberately NOT called BASE_IMAGE. A real environment variable beats
      # aquarius-os.env inside `just`, so exporting BASE_IMAGE here would quietly
      # rewrite the file's own value for every later step.
      - name: Base Image
        id: base-image
        run: |
          VARIANT_BASE_IMAGE=$(just variant-base-image ${{ matrix.variant }})

          echo "VARIANT_BASE_IMAGE=${VARIANT_BASE_IMAGE}" >> $GITHUB_ENV

      # Which desktop this variant wears — "kde" or "gnome". Every step below
      # that belongs to only one desktop is switched on and off by this one
      # value, and nothing else. See the long note at the top of the
      # Containerfile for why this single branch exists at all.
      - name: Desktop
        id: desktop
        run: |
          AQ_DESKTOP=$(just variant-desktop ${{ matrix.variant }})

          echo "AQ_DESKTOP=${AQ_DESKTOP}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG} \
            ${VARIANT_BASE_IMAGE} \
            ${AQ_DESKTOP}

      # This is optional, this provides smaller delta updates
      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          just ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # ------------------------------------------------------------------------
      # Prove the finished image really calls itself AquariusOS
      # ------------------------------------------------------------------------
      # Plain English: this starts the image we just built, looks inside it, and
      # fails the build if anything still says "Bazzite" where it should say
      # "AquariusOS".
      #
      # Why this exists: on 2026-08-28 an image shipped, installed, and booted
      # with KDE's About page still saying "Bazzite 44 / NVIDIA Edition /
      # https://bazzite.gg". The build had been green the whole time, because the
      # only thing it checked was one line of one file. A green tick is supposed
      # to mean "the OS knows its own name", so from now on it is checked here,
      # from the outside, on the exact image that gets pushed.
      #
      # It runs AFTER the rechunk step on purpose — that way we are inspecting
      # the same bits that go to the registry, not an earlier copy of them.
      #
      # `podman` is already installed on GitHub's Ubuntu runners, and the script
      # is fed in on standard input so there is no quoting to get wrong.
      - name: Verify OS identity
        id: verify-identity
        run: |
          set -euo pipefail
          cat >/tmp/verify-identity.sh <<'SCRIPT'
          set -u

          fails=0
          check() {  # check "<description>" "<pattern>" "<file>"
            if grep -Eq "$2" "$3"; then
              echo "  OK   $1"
            else
              echo "  FAIL $1  — /$2/ not found in $3"
              fails=1
            fi
          }

          echo "== /usr/lib/os-release =="
          cat /usr/lib/os-release
          echo "== /etc/os-release =="
          ls -l /etc/os-release
          echo "== this image wears the ${EXPECTED_DESKTOP} desktop =="
          if [ "${EXPECTED_DESKTOP}" = "kde" ]; then
            echo "== /etc/xdg/kcm-about-distrorc =="
            cat /etc/xdg/kcm-about-distrorc || echo "(missing!)"
          fi
          echo "== checks =="

          # The two os-release files must BOTH say AquariusOS. On Fedora the
          # second is a link to the first, so this also proves the link is intact.
          check "/etc/os-release NAME"          '^NAME="AquariusOS"'      /etc/os-release
          check "/etc/os-release PRETTY_NAME"   '^PRETTY_NAME="AquariusOS"' /etc/os-release
          check "/usr/lib/os-release says AquariusOS" 'AquariusOS'        /usr/lib/os-release

          # The fields the About page and the network name are built from.
          check "LOGO is ours"                  '^LOGO=aquarius-logo$'    /etc/os-release
          check "DEFAULT_HOSTNAME is aquarius"  '^DEFAULT_HOSTNAME="aquarius"$' /etc/os-release
          # The edition line. This list must match the `case` in
          # build_files/image-info.sh — a new image whose edition is not named in
          # BOTH places is a half-wired image, and this is where that gets caught.
          # The three KDE editions are the originals and are unchanged; the GNOME
          # line adds three more, spelled out so the About page can tell the two
          # lines apart while both exist.
          check "VARIANT is an AquariusOS edition" '^VARIANT="(GNOME )?(NVIDIA|Desktop|Handheld) Edition"$' /etc/os-release

          # ID stays "bazzite" deliberately — Bazzite's tooling and our Anaconda
          # installer profile both key off it. Checked so nobody "tidies" it away.
          check "ID deliberately left as bazzite" '^ID=bazzite$'          /etc/os-release

          # KDE's About page override. This is the file that caused the bug.
          #
          # ⚠️ KDE ONLY. The file is read by KDE's Info Centre and by nothing
          # else, so build_files/image-info.sh only writes it on the KDE images
          # and there is nothing to check on a GNOME one. GNOME's own About page
          # (Settings > System > About) reads os-release directly, which the
          # checks above have already proved.
          if [ "${EXPECTED_DESKTOP}" = "kde" ]; then
            check "About page name"               '^Name=AquariusOS$'       /etc/xdg/kcm-about-distrorc
            check "About page website"            '^Website=https://github\.com/' /etc/xdg/kcm-about-distrorc
          else
            if [ -e /etc/xdg/kcm-about-distrorc ]; then
              echo "  NOTE /etc/xdg/kcm-about-distrorc exists on a GNOME image."
              echo "       Harmless (nothing on GNOME reads it), but we do not write it."
            else
              echo "  OK   no KDE About-page override on a GNOME image (correct)"
            fi
          fi

          # --- the file Bazzite's own boot scripts read -----------------------
          # /usr/share/ublue-os/image-info.json is not a label. Bazzite's
          # first-boot and session scripts read it back at RUNTIME. Two fields in
          # it decide, on the handheld image, whether the machine starts up in
          # Game Mode at all — and we overwrite the whole file. So the two fields
          # that matter are checked here, on the finished image, for every
          # variant. Full explanation: build_files/image-info.sh, step 1.
          INFO=/usr/share/ublue-os/image-info.json
          echo "== ${INFO} =="
          cat "$INFO" || echo "(missing!)"

          json_field() {  # json_field <key>  → its value, or nothing
            sed -n "s/^[[:space:]]*\"$1\"[[:space:]]*:[[:space:]]*\"\([^\"]*\)\".*/\1/p" "$INFO" | head -n1
          }

          if [ ! -f "$INFO" ]; then
            echo "  FAIL ${INFO} does not exist"
            fails=1
          else
            # 1. base-image-name must stay the word Bazzite put there. Their
            #    /usr/libexec/bazzite-autologin reads it to choose which session
            #    to log into and silently skips autologin on anything it does not
            #    recognise — which on a handheld means no Game Mode.
            base_img="$(json_field base-image-name)"
            case "$base_img" in
              *kinoite* | *silverblue*)
                echo "  OK   base-image-name is '${base_img}' (bazzite-autologin understands it)" ;;
              *)
                echo "  FAIL base-image-name is '${base_img}' — expected kinoite or silverblue."
                echo "       Bazzite's autologin skips anything else, so a handheld built"
                echo "       like this boots to a login screen instead of Game Mode."
                fails=1 ;;
            esac

            # 2. image-name must be OUR image's name, and — because Bazzite's
            #    scripts ask "am I a handheld?" by looking for the substring
            #    "deck" in it — a handheld image's name must still contain it.
            img="$(json_field image-name)"
            if [ "$img" = "${EXPECTED_IMAGE_NAME}" ]; then
              echo "  OK   image-name is '${img}'"
            else
              echo "  FAIL image-name is '${img}', expected '${EXPECTED_IMAGE_NAME}'"
              fails=1
            fi
            case "${EXPECTED_IMAGE_NAME}" in
              *deck*)
                case "$img" in
                  *deck*) echo "  OK   handheld image-name still contains 'deck'" ;;
                  *)
                    echo "  FAIL this is the handheld image but image-name '${img}' has no 'deck' in it."
                    echo "       Bazzite's handheld setup would switch itself off."
                    fails=1 ;;
                esac ;;
            esac
          fi

          # Nothing user-facing may still send people to bazzite.gg as our home.
          if grep -q '^HOME_URL="https://bazzite.gg"' /etc/os-release; then
            echo "  FAIL HOME_URL still points at bazzite.gg"
            fails=1
          else
            echo "  OK   HOME_URL is not bazzite.gg"
          fi

          # The logo file the two settings above name has to actually be there.
          if [ -f /usr/share/icons/hicolor/scalable/apps/aquarius-logo.svg ]; then
            echo "  OK   aquarius-logo.svg is installed"
          else
            echo "  FAIL aquarius-logo.svg is missing — the About page would be blank"
            fails=1
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::This image does not identify as AquariusOS. See the checks above."
            exit 1
          fi
          echo "All identity checks passed."
          SCRIPT

          # EXPECTED_IMAGE_NAME and EXPECTED_DESKTOP are handed IN to the
          # container rather than baked into the script above: the heredoc is
          # quoted ('SCRIPT') so that nothing in it is expanded out here on the
          # runner, which is what keeps all the grep patterns readable and free
          # of escaping.
          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            -e EXPECTED_IMAGE_NAME="${IMAGE_NAME}" \
            -e EXPECTED_DESKTOP="${AQ_DESKTOP}" \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" </tmp/verify-identity.sh

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      #- name: Rechunk with Chunkah
      #  id: rechunk
      #  run: |
      #    just rechunk \
      #      ${IMAGE_NAME} \
      #      ${DEFAULT_TAG}

      # ------------------------------------------------------------------------
      # Prove the creator apps can actually be run by a real person
      # ------------------------------------------------------------------------
      # Plain English: this opens the finished image and checks that the two
      # apps AquariusOS builds in — Aquarius Editor and Aquarius Writer — are
      # installed in a way that an ordinary account can actually start.
      #
      # WHY IT EXISTS
      # On 2026-08-28 an image shipped in which BOTH apps were present, both
      # appeared in the app grid, and clicking either did nothing at all. One
      # file inside Aquarius Writer was mode 0770 — runnable by its owner and by
      # nobody else. Every check in the build had passed, because every check in
      # the build runs as root, and root ignores permissions. The first person
      # to find out was the person the OS is for.
      #
      # So the question this step asks is not "does this file exist" but
      # "COULD SOMEBODY WHO IS NOT ROOT RUN THIS". It is asked here, on the
      # image that is about to be pushed, after the rechunk step — because
      # rechunking re-packs every file, and whether it preserves things like the
      # setuid bit on Electron's sandbox helper is precisely the kind of thing
      # nobody should be taking on trust.
      - name: Verify creator apps
        id: verify-creator-apps
        run: |
          set -euo pipefail
          cat >/tmp/verify-creator-apps.sh <<'SCRIPT'
          set -u

          fails=0
          bad() { echo "  FAIL $*"; fails=1; }
          ok()  { echo "  OK   $*"; }

          # The launcher every app-grid click goes through.
          for f in /usr/bin/aquarius-editor /usr/bin/aquarius-writer /usr/libexec/aquarius-app-launch; do
            if [ -x "$f" ] && [ -r "$f" ]; then ok "$f is present and runnable"
            else bad "$f is missing or not runnable"; ls -l "$f" || true; fi
          done

          for app in aquarius-editor aquarius-writer; do
            dir="/usr/lib/aquarius/${app}"
            echo "== ${dir} =="

            if [ ! -d "$dir" ]; then bad "${dir} does not exist"; continue; fi

            # The entry point.
            if [ -x "${dir}/AppRun" ]; then ok "AppRun is executable"
            else bad "AppRun missing or not executable"; fi

            # --- the checks that matter: could a NON-root account use this? ---
            # 1. everything readable by everyone
            n="$(find "$dir" \( -type f -o -type d \) ! -perm -o+r | tee /tmp/x | wc -l)"
            if [ "$n" -eq 0 ]; then ok "every file and folder is world-readable"
            else bad "${n} files/folders are not readable by an ordinary account"; head -5 /tmp/x | xargs -r ls -ld; fi

            # 2. anything the packager marked runnable is runnable by everyone.
            #    THIS is the check that catches the 0770 bug.
            n="$(find "$dir" -type f -perm -u+x ! -perm -o+x | tee /tmp/x | wc -l)"
            if [ "$n" -eq 0 ]; then ok "every program inside is world-executable"
            else bad "${n} programs cannot be run by an ordinary account"; head -5 /tmp/x | xargs -r ls -l; fi

            # 3. folders can be entered
            n="$(find "$dir" -type d ! -perm -o+x | tee /tmp/x | wc -l)"
            if [ "$n" -eq 0 ]; then ok "every folder can be entered"
            else bad "${n} folders cannot be entered"; head -5 /tmp/x | xargs -r ls -ld; fi

            # 4. nothing in /usr may be writable by anyone who happens to log in
            n="$(find "$dir" ! -type l -perm -o+w | tee /tmp/x | wc -l)"
            if [ "$n" -eq 0 ]; then ok "nothing is world-writable"
            else bad "${n} world-writable files under /usr"; head -5 /tmp/x | xargs -r ls -l; fi

            # 5. no symlink left pointing at the build machine
            n="$(find "$dir" -xtype l | tee /tmp/x | wc -l)"
            if [ "$n" -eq 0 ]; then ok "no broken symlinks"
            else bad "${n} symlinks point at nothing"; head -5 /tmp/x | xargs -r ls -l; fi

            # 6. the app-grid entry, and the icon it names
            d="/usr/share/applications/${app}.desktop"
            if [ -f "$d" ]; then ok "app-grid entry present"
            else bad "app-grid entry ${d} missing"; fi
            if [ -f "/usr/share/pixmaps/${app}.png" ]; then ok "icon installed"
            else bad "no icon at /usr/share/pixmaps/${app}.png — the grid would show a placeholder"; fi

            # 7. the version stamp.
            #    /usr is read-only on this kind of OS, so a baked-in app cannot
            #    update itself in place. Both apps instead download a
            #    newer copy of themselves into the user's home folder, and at every
            #    launch the OS compares that download against this file to decide
            #    which one to start. No file, no comparison, and the app silently
            #    stops accepting updates — with no error anywhere. Hence checking
            #    it on the finished image.
            v="$(cat "${dir}/VERSION" 2>/dev/null || true)"
            if printf '%s' "$v" | grep -qE '^[0-9]{1,9}\.[0-9]{1,9}\.[0-9]{1,9}(-[0-9A-Za-z.-]+)?$'; then
              ok "VERSION says ${v}"
            else
              bad "${dir}/VERSION is missing or is not a bare version number (read: '${v}')"
            fi
          done

          # --- Electron's sandbox helper, on the FINAL image -------------------
          # This is the one the rechunk step could plausibly damage. Electron
          # aborts instantly, with no window at all, if this file exists but is
          # not root-owned with the setuid bit set.
          sb=/usr/lib/aquarius/aquarius-editor/chrome-sandbox
          if [ -e "$sb" ]; then
            mode="$(stat -c '%a' "$sb")"; own="$(stat -c '%U:%G' "$sb")"
            if [ "$mode" = "4755" ] && [ "$own" = "root:root" ]; then
              ok "chrome-sandbox survived packaging as root:root 4755"
            else
              bad "chrome-sandbox is ${own} mode ${mode}, expected root:root 4755"
              echo "       (the image build set it correctly, so this means the"
              echo "        rechunk/packaging step did not preserve the setuid bit)"
            fi
          fi

          # --- the app-update library, on the FINAL image ----------------------
          # /usr/libexec/aquarius-app-overlay is what decides, at every launch,
          # whether a copy of Aquarius Editor or Aquarius Writer downloaded into
          # the user's home folder is newer than the one built into the OS.
          #
          # Losing it does not break anything visibly: the launcher shrugs, starts
          # the built-in copy, and the app just quietly never takes an update
          # again. That is exactly the kind of silent loss worth a CI check.
          #
          # The three sums below are the ones that would ruin somebody's day if
          # they came out wrong — most of all 0.10.0 against 0.9.0, which plain
          # text comparison gets backwards. The full test suites are run during
          # the build (build_files/creator-apps.sh) and on every pull request
          # (.github/workflows/launcher-tests.yml); this is the last word, asked
          # of the library that is actually about to be published.
          ov=/usr/libexec/aquarius-app-overlay
          if [ -r "$ov" ]; then
            ok "$(basename "$ov") is installed"
            # shellcheck source=/dev/null
            . "$ov"
            for case in "0.4.1 0.3.0 1" "0.3.0 0.4.1 -1" "0.10.0 0.9.0 1" "0.3.0 0.3.0 0"; do
              set -- $case
              got="$(aq_semver_compare "$1" "$2" 2>/dev/null || echo error)"
              if [ "$got" = "$3" ]; then ok "version comparison: $1 vs $2 = $got"
              else bad "version comparison: $1 vs $2 gave '${got}', expected '$3'"; fi
            done
          else
            bad "$ov is missing — both Aquarius apps would silently stop taking updates"
          fi

          # --- our ujust recipes are actually in the menu ----------------------
          if grep -q '96-aquarius-creator.just' /usr/share/ublue-os/justfile; then
            ok "AquariusOS recipes are imported into ujust"
          else
            bad "96-aquarius-creator.just is not imported — 'ujust' would not list our recipes"
          fi
          for f in /usr/libexec/aquarius-install-resolve /usr/libexec/aquarius-resolve-launch; do
            if [ -x "$f" ]; then ok "$(basename "$f") is installed"
            else bad "$f is missing or not runnable"; fi
          done

          # --- desktop entries are valid --------------------------------------
          # Only "error:" lines fail the build. desktop-file-validate also emits
          # "hint:" and "warning:" lines about things like an entry belonging to
          # two main menu categories — worth reading, never worth refusing to
          # ship an OS over.
          if command -v desktop-file-validate >/dev/null 2>&1; then
            for d in /usr/share/applications/aquarius-*.desktop; do
              out="$(desktop-file-validate "$d" 2>&1 || true)"
              errs="$(printf '%s\n' "$out" | grep -F 'error:' || true)"
              if [ -n "$errs" ]; then
                bad "invalid desktop entry $(basename "$d"):"; printf '       %s\n' "$errs"
              else
                ok "valid: $(basename "$d")"
                [ -n "$out" ] && printf '       (note) %s\n' "$out"
              fi
            done
          else
            echo "  NOTE desktop-file-validate is not in the image; skipping entry validation"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The creator apps in this image cannot be started by an ordinary account. See above."
            exit 1
          fi
          echo "All creator-app checks passed."
          SCRIPT

          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" </tmp/verify-creator-apps.sh

      # ------------------------------------------------------------------------
      # ROUNDED WINDOWS — is the compiled-in KWin effect really in this image?
      # ------------------------------------------------------------------------
      # AquariusOS gets its 16px window corners from one community add-on that
      # is COMPILED during the image build, against the exact KWin the image
      # ships (build_files/kwin-effects.sh explains why at length).
      #
      # ⚠️ This step used to check TWO effects. The second, Better Blur DX, was
      # removed from the image on 2026-08-30 together with all the design's
      # transparency, because the blur it existed to draw never rendered on
      # this Plasma (docs/blur-known-issue.md). Its assertions are gone from
      # here; if it ever comes back, they come back with it.
      #
      # That build script already checks its own work. This step asks the same
      # questions again of the FINISHED, rechunked image that is about to be
      # pushed — same reasoning as the creator-app step above: rechunking
      # re-packs every file in the image, and "the file was there when we made
      # it" is not the same claim as "the file is there in what we published".
      #
      # It matters more here than almost anywhere else, because of how a KWin
      # effect fails. It does not crash and it does not print an error: the
      # plug-in is simply not loaded and every window corner is quietly square
      # again. There is no user-visible symptom to report except "it looks
      # wrong". So the check has to happen up here, before anybody boots it.
      #
      # WHAT THIS CANNOT PROVE. There is no compositor and no graphics card in a
      # container, so nothing here can start KWin and watch it accept the
      # plug-in. That last step is a human one, written down in
      # docs/kwin-effects-layer.md: on a booted machine,
      #     qdbus org.kde.KWin /Effects loadedEffects
      # should list kwin4_effect_shapecorners.
      #
      # ⚠️ KDE IMAGES ONLY. A GNOME image has no KWin, so build_files/build.sh
      # never runs kwin-effects.sh there and there is no plug-in to look for.
      # The GNOME line's equivalent check is the "Verify the GNOME desktop
      # layer" step further down, which asserts among other things that this
      # compile really did NOT happen.
      - name: Verify KWin effects
        id: verify-kwin-effects
        if: env.AQ_DESKTOP == 'kde'
        run: |
          set -euo pipefail
          cat >/tmp/verify-kwin-effects.sh <<'SCRIPT'
          set -u

          fails=0
          bad() { echo "  FAIL $*"; fails=1; }
          ok()  { echo "  OK   $*"; }

          # KWin scans exactly one folder for compiled effects. On 64-bit Fedora
          # it is this one. The file name was read out of the project's own
          # build files — the working is written out in
          # /usr/share/aquarius/xdg/kwinrc, which ships in this image.
          plugins=/usr/lib64/qt6/plugins/kwin/effects/plugins
          configs=/usr/lib64/qt6/plugins/kwin/effects/configs

          echo "== what is actually in ${plugins} =="
          ls -l "$plugins" || echo "(the folder does not exist!)"
          echo "== checks =="

          # 1. The effect itself, and its System Settings page.
          for f in \
            "${plugins}/kwin4_effect_shapecorners.so" \
            "${configs}/kwin_shapecorners_config.so"
          do
            if [ -f "$f" ] && [ -r "$f" ]; then ok "$(basename "$f") is present and readable"
            else bad "$f is missing — that effect cannot load"; fi
          done

          # 2. The rounded-corners effect reads two shader files at run time and
          #    draws nothing without them. They are separate files, installed by
          #    a separate CMake rule, so they can go missing on their own.
          for f in /usr/share/kwin/shaders/shapecorners.frag \
                   /usr/share/kwin/shaders/shapecorners_core.frag
          do
            if [ -f "$f" ]; then ok "$(basename "$f") shader is present"
            else bad "$f is missing — rounded corners would load and draw nothing"; fi
          done

          # 3. Every library the plug-in needs is present in THIS image.
          #    A plug-in with a missing library is silently ignored by KWin, so
          #    this is the closest a container can get to "will it load".
          #    (This was a loop over two plug-ins until 2026-08-30. With one
          #    left it is written out plainly rather than looped over once.)
          f="${plugins}/kwin4_effect_shapecorners.so"
          if [ -f "$f" ]; then
            missing="$(ldd -r "$f" 2>&1 | grep 'not found' || true)"
            if [ -z "$missing" ]; then ok "$(basename "$f") — every library it needs is in the image"
            else bad "$(basename "$f") needs libraries this image does not have:"; printf '       %s\n' "$missing"; fi
          fi

          # 4. The description KDE lists an effect by is compiled INTO the .so
          #    as a block of JSON. Losing it gives a plug-in that loads but never
          #    appears in System Settings and can never be switched on. The text
          #    is stored verbatim, so it can simply be looked for.
          if grep -aqE 'ShapeCorners|Rounded Corners' "${plugins}/kwin4_effect_shapecorners.so" 2>/dev/null; then
            ok "kwin4_effect_shapecorners.so carries its plug-in description"
          else
            bad "kwin4_effect_shapecorners.so has no description compiled into it"
          fi

          # 5. The settings that switch it on shipped too. An effect nobody
          #    turns on looks exactly like an effect that failed to build.
          k=/usr/share/aquarius/xdg/kwinrc
          b=/usr/share/aquarius/xdg/breezerc
          check() {  # check "<description>" "<pattern>" "<file>"
            if grep -Eq "$2" "$3" 2>/dev/null; then ok "$1"
            else bad "$1 — /$2/ not found in $3"; fi
          }
          check "rounded corners are switched on"      '^kwin4_effect_shapecornersEnabled=true$' "$k"
          check "the corner radius is set"             '^\[Round-Corners\]$'                   "$k"
          check "the corner radius is 16px"            '^Size=16$'                             "$k"
          check "the window outline is ours"           '^OutlineColor=237,239,247$'            "$k"
          check "one shadow, not two"                  '^UseNativeDecorationShadows=true$'     "$k"
          check "the window shadow file shipped"       '^\[Common\]$'                          "$b"
          check "the shadow is the big one"            '^ShadowSize=ShadowVeryLarge$'          "$b"

          # 6. Handhelds get their own extra settings, and the desktop images
          #    must NOT. The folder only exists on the handheld image — build.sh
          #    deletes it from the other two — so which of these two branches
          #    runs is itself part of what is being checked.
          #
          #    This used to check the handheld's gentler blur strength. That
          #    setting went with Better Blur DX on 2026-08-30; what the file
          #    carries now is the setting a device with no mouse cannot do
          #    without, so that is what is checked.
          if [ -d /usr/share/aquarius/xdg-handheld ]; then
            check "the handheld's controller-as-mouse" '^gamecontrollerEnabled=true$' /usr/share/aquarius/xdg-handheld/kwinrc
          else
            ok "no handheld-only settings on this image (correct for a desktop image)"
          fi

          # 7. The compilers and header files used to build the effects must be
          #    gone again. Shipping them would put hundreds of megabytes of
          #    development tools on every user's machine.
          if rpm -q kwin-devel > /dev/null 2>&1; then
            bad "kwin-devel is still installed — the build tools were not cleaned up"
          else
            ok "no development packages left in the image"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The KWin effects layer is not correct in this image — window corners would be square. See above."
            exit 1
          fi
          echo "All KWin-effect checks passed."
          SCRIPT

          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" </tmp/verify-kwin-effects.sh

      # ------------------------------------------------------------------------
      # THE TOP BAR'S APP NAME — is our own widget really in this image?
      # ------------------------------------------------------------------------
      # The bold app name in the top bar ("Dolphin", "Firefox") comes from a
      # small widget of ours at
      #     /usr/share/plasma/plasmoids/com.aquariusos.appname/
      # It is plain text files, so unlike the KWin effect above there is nothing
      # to compile and no library to go missing.
      #
      # It is checked here anyway for the same reason as the steps above: this
      # runs against the FINISHED, rechunked image that is about to be pushed,
      # and "the file was there when we made it" is not the same claim as "the
      # file is there in what we published".
      #
      # It matters because of HOW this fails. The desktop layout script asks for
      # the widget by id. If the folder, the id or the layout line ever drift
      # apart, KDE builds the top bar without an app name and reports nothing —
      # no error, no log, no gap on screen. Nobody would notice for weeks.
      #
      # WHAT THIS CANNOT PROVE. A container has no desktop, so nothing here can
      # start Plasma and watch the name appear and change. That last step is a
      # human one, written down in docs/app-name-widget.md.
      #
      # ⚠️ KDE IMAGES ONLY. This widget is a Plasma applet and the layout script
      # that places it is a Plasma layout. Both still SHIP on the GNOME images
      # (they are plain text files, nothing deletes them, and nothing on GNOME
      # reads them) — they are simply not part of what a GNOME image is, so
      # nothing about them is asserted there.
      - name: Verify the top-bar app name widget
        id: verify-appname-widget
        if: env.AQ_DESKTOP == 'kde'
        run: |
          set -euo pipefail
          cat >/tmp/verify-appname-widget.sh <<'SCRIPT'
          set -u

          fails=0
          bad() { echo "  FAIL $*"; fails=1; }
          ok()  { echo "  OK   $*"; }

          widget=/usr/share/plasma/plasmoids/com.aquariusos.appname
          layout=/usr/share/plasma/look-and-feel/org.aquariusos.desktop/contents/layouts/org.kde.plasma.desktop-layout.js

          echo "== what is actually in /usr/share/plasma/plasmoids =="
          ls -l /usr/share/plasma/plasmoids || echo "(the folder does not exist!)"
          echo "== checks =="

          # 1. The widget's two files.
          for f in "${widget}/metadata.json" "${widget}/contents/ui/main.qml"; do
            if [ -r "$f" ]; then ok "$(basename "$f") is present and readable"
            else bad "$f is missing — the top bar would have no app name"; fi
          done

          # 2. metadata.json is readable JSON, its id matches its folder, and it
          #    declares itself a Plasma widget. KDE needs all three to be true
          #    before it will even list the widget.
          if [ -r "${widget}/metadata.json" ]; then
            if python3 - "$widget" <<'PY'
          import json, os, sys
          folder = sys.argv[1]
          meta = json.load(open(os.path.join(folder, "metadata.json")))
          assert meta["KPlugin"]["Id"] == os.path.basename(folder), "Id does not match the folder name"
          assert meta["KPackageStructure"] == "Plasma/Applet", "not declared as a Plasma/Applet"
          assert meta["X-Plasma-API-Minimum-Version"] == "6.0", "missing the Plasma 6 marker"
          PY
            then ok "metadata.json is valid, and its id matches its folder"
            else bad "metadata.json is broken, misnamed, or not marked as a Plasma 6 widget"; fi
          fi

          # 3. The layout script still asks for it. This is the pairing that
          #    silently breaks: a widget nobody adds to the bar looks exactly
          #    like a widget that failed to install.
          if grep -q 'com\.aquariusos\.appname' "$layout" 2>/dev/null; then
            ok "the desktop layout adds the app-name widget to the top bar"
          else
            bad "the layout script never adds com.aquariusos.appname — the widget would ship unused"
          fi

          # 4. The widget must sit BETWEEN the logo and the menus, which is the
          #    order the V2 design draws. Line numbers are compared rather than
          #    trusted, because getting this wrong looks like a design mistake
          #    rather than a bug and would survive review.
          if [ -r "$layout" ]; then
            logo=$(grep -n 'addWidget("org\.kde\.plasma\.kickerdash")' "$layout" | head -1 | cut -d: -f1)
            name=$(grep -n 'addWidget("com\.aquariusos\.appname")'     "$layout" | head -1 | cut -d: -f1)
            menu=$(grep -n 'addWidget("org\.kde\.plasma\.appmenu")'    "$layout" | head -1 | cut -d: -f1)
            if [ -n "$logo" ] && [ -n "$name" ] && [ -n "$menu" ] && [ "$logo" -lt "$name" ] && [ "$name" -lt "$menu" ]; then
              ok "top bar order is logo, then app name, then menus"
            else
              bad "top bar order is wrong or a widget is missing (logo=$logo name=$name menus=$menu)"
            fi
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The top-bar app name is not correct in this image — the bar would come up without it. See above."
            exit 1
          fi
          echo "All app-name-widget checks passed."
          SCRIPT

          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" </tmp/verify-appname-widget.sh

      # ------------------------------------------------------------------------
      # THE GNOME DESKTOP LAYER — is it really in this image?
      # ------------------------------------------------------------------------
      # Plain English: this starts the finished GNOME image, looks inside it, and
      # fails the build if the AquariusOS look and behaviour did not make it in.
      #
      # WHY IT EXISTS, AND WHY IT IS THIS LONG
      # Almost nothing in the GNOME layer fails loudly. A settings file with a
      # typo in it is ignored. A settings index that was not rebuilt means every
      # default is quietly the stock one. An extension that does not list this
      # GNOME is simply not loaded. A wallpaper path pointing at nothing gives a
      # flat coloured desktop. In every one of those cases the build is green,
      # the image boots, and the only symptom is that it looks like plain
      # Bazzite — which is exactly the failure nobody notices for a month.
      #
      # So each of those is asked about here, on the FINISHED, rechunked image
      # that is about to be pushed. The build scripts already check their own
      # work; this asks the same questions again of what actually gets published,
      # because "the file was there when we made it" is not the same claim as
      # "the file is there in what we published". Same reasoning as the KDE steps
      # above.
      #
      # WHAT THIS CANNOT PROVE. There is no desktop and nobody logged in inside a
      # container, so nothing here can start GNOME Shell and watch the dock
      # appear. The bench checklist for that is in docs/gnome-variants.md.
      - name: Verify the GNOME desktop layer
        id: verify-gnome-layer
        if: env.AQ_DESKTOP == 'gnome'
        run: |
          set -euo pipefail
          cat >/tmp/verify-gnome-layer.sh <<'SCRIPT'
          set -u

          fails=0
          bad() { echo "  FAIL $*"; fails=1; }
          ok()  { echo "  OK   $*"; }

          SCHEMAS=/usr/share/glib-2.0/schemas
          D2D=/usr/share/gnome-shell/extensions/dash-to-dock@micxgx.gmail.com
          BACKGROUNDS=/usr/share/backgrounds/aquarius

          echo "== our settings files in ${SCHEMAS} =="
          ls -l "${SCHEMAS}"/zz1-aquarius-* || echo "(none!)"
          echo "== checks =="

          # --- 1. the settings files themselves --------------------------------
          for f in zz1-aquarius-10-look zz1-aquarius-20-shell zz1-aquarius-30-dash-to-dock; do
            if [ -r "${SCHEMAS}/${f}.gschema.override" ]; then ok "${f} is installed"
            else bad "${SCHEMAS}/${f}.gschema.override is missing"; fi
          done

          # The handheld extras belong on the handheld image and NOWHERE else.
          # Which branch runs is itself part of what is being checked.
          handheld="${SCHEMAS}/zz1-aquarius-40-handheld.gschema.override"
          case "${EXPECTED_IMAGE_NAME}" in
            *deck*)
              if [ -r "$handheld" ]; then ok "the handheld settings are on the handheld image"
              else bad "this is the handheld image but the handheld settings are missing"; fi ;;
            *)
              if [ -e "$handheld" ]; then bad "handheld-only settings are on a desktop image"
              else ok "no handheld-only settings on this desktop image (correct)"; fi ;;
          esac

          # --- 2. they must sort AFTER Bazzite's ------------------------------
          # Bazzite ships its own defaults in files starting "zz0-", and the LAST
          # file to mention a setting wins. If ours ever stopped sorting after
          # theirs, every AquariusOS default would be silently overwritten by a
          # Bazzite one. Rather than trust the naming convention, compare.
          last_ours="$(ls "${SCHEMAS}"/zz1-aquarius-*.gschema.override 2>/dev/null | sort | tail -1)"
          first_ours="$(ls "${SCHEMAS}"/zz1-aquarius-*.gschema.override 2>/dev/null | sort | head -1)"
          last_theirs="$(ls "${SCHEMAS}"/*.gschema.override 2>/dev/null | grep -v 'zz1-aquarius' | sort | tail -1)"
          if [ -n "$first_ours" ] && [ -n "$last_theirs" ]; then
            if [ "$(printf '%s\n%s\n' "$(basename "$last_theirs")" "$(basename "$first_ours")" | sort | tail -1)" = "$(basename "$first_ours")" ]; then
              ok "our settings sort after everyone else's (last theirs: $(basename "$last_theirs"))"
            else
              bad "$(basename "$last_theirs") sorts AFTER $(basename "$first_ours") — it would overwrite our defaults"
            fi
          fi

          # --- 3. the index was actually rebuilt -------------------------------
          # This is the step that makes every file above real, and skipping it
          # is completely silent. The index has to exist AND be newer than the
          # newest settings file, or it was built before ours arrived.
          index="${SCHEMAS}/gschemas.compiled"
          if [ ! -s "$index" ]; then
            bad "${index} does not exist — every AquariusOS default would be ignored"
          else
            ok "the compiled settings index exists"
          fi
          # NO timestamp comparison here, deliberately. This image format
          # flattens every file's clock to the same instant when it packs the
          # image, so "was the index rebuilt AFTER our files arrived?" cannot be
          # asked with timestamps — the first six-variant run (33424319065)
          # failed on exactly that. The question is answered properly by check 4
          # below, which READS our values back out of the compiled index: stale
          # index = wrong answers = loud failure. (Same lesson as the KDE theme
          # cache: on this OS, trust content, never mtimes.)

          # --- 4. and it really contains OUR answers ---------------------------
          # The strongest check available in a container: ask the settings system
          # what the factory value of a setting is now. GSETTINGS_BACKEND=memory
          # means "do not look for anybody's saved answer", so what comes back is
          # exactly what the index says the default is — which is what a
          # brand-new account would get.
          if command -v gsettings >/dev/null 2>&1; then
            want() {  # want <schema> <key> <expected>
              got="$(GSETTINGS_BACKEND=memory gsettings get "$1" "$2" 2>/dev/null || echo '<error>')"
              if [ "$got" = "$3" ]; then ok "$1 $2 = $got"
              else bad "$1 $2 is $got, expected $3"; fi
            }
            # The four that ARE the AquariusOS look. If these are right, the
            # override mechanism is working end to end.
            want org.gnome.desktop.interface color-scheme "'default'"
            want org.gnome.desktop.interface accent-color "'blue'"
            want org.gnome.desktop.interface font-name "'Inter 11'"
            want org.gnome.desktop.interface monospace-font-name "'JetBrains Mono 10'"
            # And the dock, which is the one whose schema comes from the
            # extension we baked in rather than from GNOME itself.
            want org.gnome.shell.extensions.dash-to-dock dock-position "'BOTTOM'"
            want org.gnome.shell.extensions.dash-to-dock dock-fixed "true"

            echo "  ---- for the log: the wallpaper and the dock's apps ----"
            GSETTINGS_BACKEND=memory gsettings get org.gnome.desktop.background picture-uri || true
            GSETTINGS_BACKEND=memory gsettings get org.gnome.desktop.background picture-uri-dark || true
            GSETTINGS_BACKEND=memory gsettings get org.gnome.shell favorite-apps || true
            GSETTINGS_BACKEND=memory gsettings get org.gnome.shell enabled-extensions || true
          else
            echo "  NOTE gsettings is not in this image, so the values could not be read back."
            echo "       The files and the index were still checked above."
          fi

          # --- 5. the dock ------------------------------------------------------
          echo "== ${D2D} =="
          ls -l "$D2D" || echo "(the folder does not exist!)"

          if [ -r "${D2D}/extension.js" ] && [ -r "${D2D}/metadata.json" ]; then
            ok "Dash to Dock is installed"
          else
            bad "Dash to Dock is missing — there would be no dock on the desktop"
          fi

          # It must declare support for the GNOME in THIS image, or GNOME refuses
          # to load it and the dock silently never appears. Fedora 44 ships GNOME
          # 50; both numbers are printed so a future bump is obvious in the log.
          if [ -r "${D2D}/metadata.json" ] && command -v gnome-shell >/dev/null 2>&1; then
            shell_major="$(gnome-shell --version | awk '{print $3}' | cut -d. -f1)"
            if python3 - "${D2D}/metadata.json" "$shell_major" <<'PY'
          import json, sys
          meta = json.load(open(sys.argv[1]))
          versions = [str(v) for v in meta["shell-version"]]
          print(f"       Dash to Dock {meta['version']} supports GNOME Shell {', '.join(versions)}")
          sys.exit(0 if sys.argv[2] in versions else 1)
          PY
            then ok "Dash to Dock supports this image's GNOME Shell ${shell_major}"
            else bad "Dash to Dock does not list GNOME Shell ${shell_major} — GNOME would not load it"; fi
          fi

          # ⚠️ The check that protects every dock default we ship. If the
          # extension keeps a private compiled copy of its settings, GNOME reads
          # THAT and ignores our system-wide defaults completely — the dock comes
          # up stock and nothing says why. build_files/gnome-extensions.sh has
          # the long explanation.
          if [ -e "${D2D}/schemas/gschemas.compiled" ]; then
            bad "${D2D}/schemas/gschemas.compiled exists — it would override every AquariusOS dock default"
          else
            ok "the dock has no private settings copy (correct — ours win)"
          fi
          if [ -r "${SCHEMAS}/org.gnome.shell.extensions.dash-to-dock.gschema.xml" ]; then
            ok "the dock's settings description is installed system-wide"
          else
            bad "the dock's settings description is not in ${SCHEMAS} — our dock defaults have nothing to apply to"
          fi

          # --- 6. the extension list is the one we meant ------------------------
          # enabled-extensions REPLACES Bazzite's list rather than adding to it,
          # so what is left OUT matters as much as what is in. blur-my-shell is
          # the one we most want to stay out: it is against the whole posture of
          # this line, and the KDE line already lost days to window blur that
          # never rendered (docs/blur-known-issue.md).
          shell_override="${SCHEMAS}/zz1-aquarius-20-shell.gschema.override"
          for want_ext in dash-to-dock@micxgx.gmail.com \
                          appindicatorsupport@rgcjonas.gmail.com \
                          gsconnect@andyholmes.github.io \
                          caffeine@patapon.info \
                          hotedge@jonathan.jdoda.ca; do
            if grep -q "'${want_ext}'" "$shell_override" 2>/dev/null; then ok "enabled: ${want_ext}"
            else bad "${want_ext} is not in our enabled-extensions list"; fi
          done
          for unwanted in blur-my-shell@aunetx \
                          burn-my-windows@schneegans.github.com \
                          desktop-cube@schneegans.github.com \
                          compiz-alike-magic-lamp-effect@hermes83.github.com \
                          compiz-windows-effect@hermes83.github.com; do
            if grep -q "'${unwanted}'" "$shell_override" 2>/dev/null; then
              bad "${unwanted} is switched on — it is deliberately excluded"
            else ok "not enabled: ${unwanted} (correct)"; fi
          done

          # The handheld's list is a full copy of the desktop's plus one name.
          # Copies drift; this is what stops them.
          if [ -r "$handheld" ]; then
            if python3 - "$shell_override" "$handheld" <<'PY'
          import ast, re, sys
          def read(path):
              text = open(path).read()
              match = re.search(r"^enabled-extensions=(\[.*?\])\s*$", text, re.M | re.S)
              assert match, f"no enabled-extensions line in {path}"
              return ast.literal_eval(match.group(1))
          desktop, handheld = read(sys.argv[1]), read(sys.argv[2])
          extra = [e for e in handheld if e not in desktop]
          missing = [e for e in desktop if e not in handheld]
          print(f"       the handheld adds: {extra or 'nothing'}")
          if missing:
              sys.exit(f"       the handheld is MISSING: {missing}")
          if extra != ["block-caribou-36@lxylxy123456.ercli.dev"]:
              sys.exit(f"       the handheld adds something unexpected: {extra}")
          PY
            then ok "the handheld list is the desktop list plus block-caribou, and nothing else"
            else bad "the two extension lists have drifted apart"; fi
          fi

          # --- 7. the wallpapers ------------------------------------------------
          for f in "${BACKGROUNDS}/the-pour-ice-3840x2160.png" \
                   "${BACKGROUNDS}/the-pour-midnight-3840x2160.png"; do
            if [ -s "$f" ]; then ok "$(basename "$f") is installed ($(stat -c %s "$f") bytes)"
            else bad "$f is missing — the desktop would come up a flat colour"; fi
          done
          if [ -r /usr/share/gnome-background-properties/aquarius.xml ]; then
            ok "our wallpaper is listed in Settings > Appearance"
          else
            bad "/usr/share/gnome-background-properties/aquarius.xml is missing"
          fi

          # --- 8. the GNOME-side tools our own scripts need ---------------------
          if command -v zenity >/dev/null 2>&1; then ok "zenity is installed"
          else bad "zenity is missing — the first-login creator-apps window would never appear"; fi

          if [ -r /usr/share/nautilus-python/extensions/aquarius_editor_ready.py ]; then
            ok "the 'Make Editor-Ready' menu item is installed"
          else
            bad "the Nautilus ingest extension is missing — no right-click ingest on GNOME"
          fi
          if rpm -q nautilus-python >/dev/null 2>&1; then
            ok "nautilus-python is installed ($(rpm -q nautilus-python))"
          else
            bad "nautilus-python is not installed — that extension file would never be read"
          fi

          # --- 9. the login screen logo ----------------------------------------
          # GDM on the desktop images, SDDM on the handheld — so which branch
          # runs is part of what is checked.
          case "${EXPECTED_IMAGE_NAME}" in
            *deck*)
              ok "handheld image — no GDM settings expected (it uses SDDM)" ;;
            *)
              if [ -s /usr/share/aquarius/branding/aquarius-logo.png ]; then ok "the login-screen logo is installed"
              else bad "the login-screen logo PNG is missing — GDM would show a blank space"; fi
              if [ -s /etc/dconf/db/gdm ]; then ok "the login screen settings were compiled"
              else bad "/etc/dconf/db/gdm is missing — the login screen would keep Bazzite's logo"; fi
              if grep -q 'aquarius-logo.png' /etc/dconf/db/gdm.d/01-aquarius-logo 2>/dev/null; then
                ok "the login screen is pointed at our logo"
              else
                bad "/etc/dconf/db/gdm.d/01-aquarius-logo does not name our logo"
              fi ;;
          esac

          # --- 10. NONE of the KDE build steps ran ------------------------------
          # This is the other half of the gating in build_files/build.sh. A GNOME
          # image that somehow compiled a KWin plug-in would mean the AQ_DESKTOP
          # knob is not doing its job — and it would have shipped hundreds of
          # megabytes of development tools to do it.
          if [ -e /usr/lib64/qt6/plugins/kwin/effects/plugins/kwin4_effect_shapecorners.so ]; then
            bad "a compiled KWin effect is in this GNOME image — the KDE-only build steps ran"
          else
            ok "no compiled KWin effects (correct — nothing on GNOME would load them)"
          fi
          if [ -e /usr/share/kwin/shaders/shapecorners.frag ]; then
            bad "KWin effect shaders are in this GNOME image — the KDE-only build steps ran"
          else
            ok "no KWin effect shaders (correct)"
          fi
          if rpm -q kwin-devel >/dev/null 2>&1; then
            bad "kwin-devel is installed — development tools were left in a GNOME image"
          else
            ok "no KWin development packages in the image (correct)"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::The GNOME desktop layer is not correct in this image — it would boot looking like plain Bazzite. See above."
            exit 1
          fi
          echo "All GNOME-layer checks passed."
          SCRIPT

          podman run --rm --pull=never -i \
            --entrypoint /usr/bin/bash \
            -e EXPECTED_IMAGE_NAME="${IMAGE_NAME}" \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" </tmp/verify-gnome-layer.sh

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

