<?xml version="1.0" encoding="UTF-8"?>
<!--
  AquariusOS default wallpaper — "The Pour", ICE colourway (LIGHT)
  For the GNOME line. Design source of truth: branding/tokens.md, plus the Ice
  palette recorded in docs/custom-de/ice-theme-tokens.md.

  This is the SOURCE file. The PNG that ships with the OS is rendered from it:
      bash branding/render-wallpaper.sh gnome
  Edit this file, re-render, commit both. Never hand-edit the PNG.

  WHAT THIS IS A RECOLOUR OF, AND WHAT WAS AND WAS NOT CHANGED
  The composition is the-pour.svg unchanged — same canvas, same three ribbons at
  the same angles and the same places, same watermark in the same corner. Only
  the colours moved. That is on purpose: The Pour is the AquariusOS wallpaper,
  and Ice and Midnight are two lights falling on the same picture rather than
  two different pictures.

  The recolour is NOT a channel flip. Light grounds need different work from
  dark ones:
    * The glow is inverted in ROLE, not in value. On the dark original the
      corner glow is lighter than the ground; here it is a soft azure WASH that
      fades to almost-white at the far corners, which is what light pouring into
      a pale room actually looks like.
    * Every ribbon is more opaque than its dark twin. A translucent colour over
      near-black gains contrast; the same colour over pale paper loses it. The
      numbers were raised until each ribbon reads at arm's length without
      becoming a stripe.
    * The gold thread changed hue, not just opacity. Ancient gold (#E6DDB8) is
      lighter than this ground and would simply vanish; the Ice palette's warm
      accent (#C28B22) is the same idea one step deeper, so it still reads as
      one rare warm thread.
    * The watermark went from near-white ink to navy ink (#16273A), because on
      paper the mark has to be darker than what is behind it, not lighter.

  Authored at 1920x1080. preserveAspectRatio="xMidYMid slice" means it crops
  gracefully to 16:10 and other shapes instead of letterboxing, because every
  ribbon runs past the edge of the frame on purpose.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"
     viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Base: a soft azure wash off the top-right corner, falling to pale
         paper. Same geometry as the dark original; the three stops are the Ice
         palette read from most-tinted to least. -->
    <radialGradient id="sky" gradientUnits="userSpaceOnUse"
                    cx="1497.6" cy="-108" r="2688"
                    gradientTransform="translate(1497.6,-108) scale(1,0.401786) translate(-1497.6,108)">
      <stop offset="0"    stop-color="#D6E7F5"/>
      <stop offset="0.55" stop-color="#EAF1F8"/>
      <stop offset="1"    stop-color="#F0F6FC"/>
    </radialGradient>

    <!-- Ribbon 1 — the main pour. Aquarius Blue, with turquoise through the
         thick of it. These are the Ice-side halves of the theme-aware accent
         pairs: #2C8FC4 (Aquarius Blue on Ice) and #0E9AA0 (Turquoise on Ice). -->
    <linearGradient id="r1" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#2C8FC4" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#0E9AA0" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#2C8FC4" stop-opacity="0.32"/>
      <stop offset="0.80" stop-color="#2C8FC4" stop-opacity="0.10"/>
      <stop offset="1"    stop-color="#2C8FC4" stop-opacity="0"/>
    </linearGradient>

    <!-- Ribbon 2 — the thin "ancient" thread. Rare by design: exactly one warm
         line in the whole picture. -->
    <linearGradient id="r2" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#C28B22" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#C28B22" stop-opacity="0.16"/>
      <stop offset="0.85" stop-color="#C28B22" stop-opacity="0"/>
      <stop offset="1"    stop-color="#C28B22" stop-opacity="0"/>
    </linearGradient>

    <!-- Ribbon 3 — a deep undertow, low and quiet. Indigo-on-Ice, kept very low.
         The original's undertow is purple, and purple over pale paper turns
         lilac fast: at the 0.16 the dark version uses it read as candy pink.
         0.06 is where it goes back to being a shadow you feel rather than a
         colour you see, which is what an undertow is supposed to be. -->
    <linearGradient id="r3" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#6E2BE0" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#6E2BE0" stop-opacity="0"/>
      <stop offset="0.50" stop-color="#6E2BE0" stop-opacity="0.06"/>
      <stop offset="1"    stop-color="#6E2BE0" stop-opacity="0"/>
    </linearGradient>

    <!-- Blur amounts are stdDeviation in these 1920x1080 units, so they scale
         with the render resolution automatically. Unchanged from the original. -->
    <filter id="b1" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="23.6"/>
    </filter>
    <filter id="b2" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="13.8"/>
    </filter>
    <filter id="b3" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="url(#sky)"/>

  <!-- Every ribbon is drawn wider than the canvas so the rotation never shows a
       cut end. Rotation is about the centre of the frame. -->
  <g transform="rotate(-13 960 540)">
    <rect x="-560" y="237.6" width="3040" height="313.2" fill="url(#r1)" filter="url(#b1)"/>
  </g>
  <g transform="rotate(-13 960 540)">
    <rect x="-560" y="432" width="3040" height="64.8" fill="url(#r2)" filter="url(#b2)"/>
  </g>
  <g transform="rotate(-11 960 540)">
    <rect x="-560" y="604.8" width="3040" height="183.6" fill="url(#r3)" filter="url(#b3)"/>
  </g>

  <!-- The mark, bottom right, barely there. Kept ~100 units clear of the right
       edge so a 16:10 crop (which shaves ~96 units off each side) never cuts it.

       #16273A is the Ice palette's ink — deep navy, not black — drawn at 22%.
       On the dark original this same mark is near-white at 40%. The rule is the
       same in both: the mark is one step away from its ground and no more. -->
  <g transform="translate(1688 892) scale(1.5)" opacity="0.22" fill="none"
     stroke="#16273A" stroke-width="5" stroke-linecap="round">
    <path d="M14 54 30 12q1.4-3.6 4 0L50 54"/>
    <path d="M20 40q6-6 12 0t12 0"/>
  </g>
</svg>
